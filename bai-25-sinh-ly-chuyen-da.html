u có cơn co chuyển dạ; (2) Vỡ ối sớm: Vỡ màng ối xảy ra trong quá trình chuyển dạ nhưng khi cổ tử cung chưa mở trọn (chưa đạt 10 cm); (3) Vỡ ối đúng lúc (vỡ ối sinh lý): Vỡ màng ối xảy ra khi cổ tử cung đã mở trọn (10 cm) ở cuối giai đoạn 1 của chuyển dạ."}, {"id": 14, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 25 tuổi, con so, thai 39 tuần 4 ngày, chuyển dạ ngôi chẩm. Bác sĩ khám âm đạo ghi nhận đầu thai nhi cúi rất tốt, ngón tay khám sờ thấy thóp sau nằm ở chính giữa trung tâm đường kính lọt của khung chậu. Bác sĩ hướng dẫn học viên xác định tên đường kính lọt của đầu thai nhi và giá trị kích thước của đường kính này.", "question": "Xác định tên đường kính lọt và kích thước chuẩn xác của ngôi chẩm khi thai nhi cúi tối đa?", "options": ["Đường kính Chẩm - Trán với kích thước là 11.5 cm, là đường kính trung bình của ngôi chẩm không cúi tốt.", "Đường kính Chẩm - Cằm với kích thước là 13.5 cm, là đường kính lớn nhất của ngôi thóp trước không thể sinh ngả âm đạo.", "Đường kính Hạ cằm - Thóp trước với kích thước là 9.5 cm, là đường kính lọt của ngôi mặt cúi hoàn toàn.", "Đường kính Hạ chẩm - Thóp trước với kích thước là 9.5 cm, là đường kính nhỏ nhất và thuận lợi nhất cho quá trình lọt.", "Đường kính Trán - Mũi với kích thước là 10.5 cm, là đường kính của ngôi ngang khi có cơn co mạnh."], "correct": 3, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Chẩm - Trán (11.5 cm) gặp khi đầu thai cúi vừa phải/không cúi tốt."}, {"key": "B", "trap": "[bo_chong_chi_dinh] - Chẩm - Cằm (13.5 cm) là đường kính của ngôi trán."}, {"key": "C", "trap": "[nham_dan_so] - Hạ cằm - Thóp trước (9.5 cm) là đường kính của ngôi mặt."}, {"key": "E", "trap": "[sai_tang] - Tên đường kính không tồn tại trong phân loại ngôi thai."}], "decision": "Ngôi chẩm cúi tốt -> Trục đầu thu nhỏ -> Đường kính lọt = Hạ chẩm - Thóp trước = 9.5 cm (Bằng đường kính lưỡng đỉnh 9.5 cm) -> Thuận lợi nhất để đi qua eo trên.", "explanation": "Theo Giáo trình Bài 25: Ngôi chẩm là ngôi thai sinh lý nhất. Khi đầu thai nhi cúi tối đa, thóp sau sẽ làm điểm mốc nằm ở trung tâm đường kính lọt. Đường kính lọt của ngôi chẩm cúi tốt là đường kính Hạ chẩm - Thóp trước (Suboccipito-bregmatic) có kích thước là 9.5 cm. Kích thước này bằng đúng đường kính lưỡng đỉnh (Biparietal diameter - 9.5 cm), giúp thai nhi dễ dàng đi qua các mặt phẳng của khung chậu mẹ."}, {"id": 15, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 40 tuần, chuyển dạ giai đoạn 2. Khám âm đạo ghi nhận cổ tử cung đã mở trọn 10 cm, điểm thấp nhất của xương sọ thai nhi (chưa tính bướu huyết thanh) nằm đúng trên đường nối hai gai hông của khung chậu mẹ. Bác sĩ yêu cầu học viên xác định độ lọt của ngôi thai theo bảng phân loại De Lee.", "question": "Xác định chuẩn xác độ lọt của ngôi thai theo phân loại De Lee và ý nghĩa giải phẫu của mốc này?", "options": ["Độ lọt là Mốc 0 Station 0, nghĩa là đường kính lớn nhất của đầu thai nhi đã đi qua mặt phẳng eo trên của khung chậu mẹ.", "Độ lọt là Mốc -3 Station -3, nghĩa là đầu thai nhi còn cao bập bềnh hoàn toàn chưa đi vào khung chậu.", "Độ lọt là Mốc +3 Station +3, nghĩa là đầu thai nhi đã thò ra ngoài tầng sinh môn và chuẩn bị sổ hoàn toàn.", "Độ lọt là Mốc -1 Station -1, nghĩa là đường kính lưỡng đỉnh vẫn còn nằm trên bờ trên xương vệ 2 cm.", "Độ lọt là Mốc +1 Station +1, nghĩa là đầu thai nhi đã xoay xong 90 độ ra đường giữa xương cúng."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_tang] - Mốc -3 là ngôi thai còn cao bập bềnh trên eo trên 3 cm."}, {"key": "C", "trap": "[qua_muc] - Mốc +3 là ngôi thai đã sát tầng sinh môn dãn mỏng."}, {"key": "D", "trap": "[phan_biet_hep] - Mốc -1 là điểm thấp nhất sọ thai nằm trên gai hông 1 cm."}, {"key": "E", "trap": "[nham_dan_so] - Mốc +1 là nằm dưới gai hông 1 cm chứ không phải xoay."}], "decision": "Mốc 0 (Station 0) trong phân loại De Lee: Point thấp nhất xương sọ thai nhi trùng với đường nối 2 gai hông (eo giữa) -> Khẳng định đường kính lọt (lưỡng đỉnh) đã vượt qua mặt phẳng eo trên (thai đã lọt).", "explanation": "Theo Giáo trình Bài 25: Phân loại độ lọt theo De Lee lấy đường nối hai gai hông làm mốc 0 (Station 0). Khi điểm thấp nhất của xương sọ thai nhi (không tính bướu huyết thanh) chạm tới đường nối hai gai hông (Mốc 0), điều đó đồng nghĩa với việc đường kính lọt lớn nhất của đầu thai nhi (đường kính lưỡng đỉnh 9.5 cm) đã vượt qua mặt phẳng eo trên của khung chậu mẹ, tức là thai đã 'lọt' hoàn toàn. Mỗi cm trên mốc 0 tính là -1, -2, -3; mỗi cm dưới mốc 0 tính là +1, +2, +3."}, {"id": 16, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 24 tuổi, con so, thai 39 tuần 2 ngày, ngôi chẩm chậu trái trước (LOA). Trong quá trình theo dõi giai đoạn 2 của chuyển dạ, bác sĩ quan sát thấy đầu thai nhi sau khi đi qua eo trên và xuống eo giữa đã tiến hành xoay thóp sau từ vị trí 10 giờ về vị trí 12 giờ (dưới khớp vệ). Bác sĩ giảng giải cho sinh viên về trình tự 4 thì cơ bản trong cơ chế sinh ngôi chẩm.", "question": "Trình tự chuẩn xác 4 thì trong cơ chế sinh ngôi chẩm và góc xoay trong của kiểu thế Chẩm chậu trái trước (LOA)?", "options": ["Trình tự 4 thì gồm Xuống - Lọt - Sổ - Xoay; kiểu thế LOA tiến hành xoay trong một góc 135 độ về phía xương cùng.", "Trình tự 4 thì gồm Lọt - Xoay - Xuống - Sổ; kiểu thế LOA tiến hành xoay trong một góc 90 độ ra đường kính ngang.", "Trình tự 4 thì gồm Lọt - Xuống - Xoay - Sổ; kiểu thế LOA tiến hành xoay trong một góc 45 độ ngược chiều kim đồng hồ đưa thóp sau về dưới khớp vệ.", "Trình tự 4 thì gồm Sổ - Lọt - Xuống - Xoay; kiểu thế LOA không cần xoay trong mà sổ trực tiếp ở đường kính chéo.", "Trình tự 4 thì gồm Xoay - Lọt - Xuống - Sổ; kiểu thế LOA xoay trong một góc 180 độ về vị trí hõm tủy xương cùng."], "correct": 2, "traps": [{"key": "A", "trap": "[sai_thu_tu] - Nhầm lẫn thứ tự các thì, Xuống trước Lọt là sai."}, {"key": "B", "trap": "[phan_biet_hep] - Thì Xoay diễn ra sau thì Xuống (xuống tới eo giữa mới xoay)."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Trình tự đảo ngược hoàn toàn phi lý."}, {"key": "E", "trap": "[nham_dan_so] - Góc xoay 180 độ chỉ gặp ở chẩm chậu sau xoay ra trước muộn."}], "decision": "Cơ chế sinh ngôi chẩm: 4 thì theo trình tự -> (1) Lọt; (2) Xuống; (3) Xoay trong; (4) Sổ. Kiểu thế LOA (Chẩm chậu trái trước) -> Thóp sau ở 10h -> Xoay ra trước 45 độ ngược chiều kim đồng hồ về dưới khớp vệ (12h).", "explanation": "Theo Giáo trình Bài 25: Cơ chế sinh của ngôi chẩm gồm 4 thì liên tiếp: Lọt -> Xuống -> Xoay -> Sổ. Ở kiểu thế Chẩm chậu trái trước (LOA), thóp sau nằm ở vị trí 10 giờ trên mặt phẳng eo trên. Khi đầu thai nhi xuống đến eo giữa (độ lọt mốc 0), sức cản của cơ tầng sinh môn và khung chậu ép thóp sau xoay ra trước một góc 45 độ (ngược chiều kim đồng hồ) để đưa thóp sau về nằm ngay dưới khớp vệ (vị trí 12 giờ), tạo điều kiện cho thì sổ thai."}, {"id": 17, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 22 tuổi, con so, vóc dáng nhỏ cao 148 cm. Bác sĩ thực hiện đo khung chậu ngoài và khám khung chậu trong qua âm đạo. Bác sĩ dùng hai ngón tay sờ đến điểm nhô của xương cùng và đo đường kính Nhô - Hạ vệ đạt 12.0 cm. Bác sĩ yêu cầu học viên tính đường kính hữu dụng (Nhô - Hậu vệ) của eo trên để tiên lượng khả năng sinh ngả âm đạo.", "question": "Tính đường kính hữu dụng Nhô - Hậu vệ của sản phụ và nhận định về eo trên?", "options": ["Đường kính Nhô - Hậu vệ đạt 8.0 cm, khung chậu hẹp tuyệt đối eo trên bắt buộc phải mổ lấy thai chủ động.", "Đường kính Nhô - Hậu vệ đạt 9.0 cm, eo trên hẹp giới hạn cần phải cho thử thách lâm sàng kéo dài 24 giờ.", "Đường kính Nhô - Hậu vệ đạt 13.5 cm, khung chậu rộng bất thường có nguy cơ đẻ rơi ngay tại phòng khám.", "Đường kính Nhô - Hậu vệ đạt 12.0 cm, đường kính hữu dụng đúng bằng đường kính đo được qua khám âm đạo.", "Đường kính Nhô - Hậu vệ đạt 10.5 cm, eo trên bình thường đủ điều kiện cho thai nhi có kích thước trung bình lọt qua."], "correct": 4, "traps": [{"key": "A", "trap": "[sai_tang] - Trừ sai 4 cm thành 8.0 cm."}, {"key": "B", "trap": "[nham_dan_so] - Tính toán sai số liệu."}, {"key": "C", "trap": "[qua_muc] - Cộng nhầm 1.5 cm thay vì trừ."}, {"key": "D", "trap": "[phan_biet_hep] - Nhầm Nhô - Hậu vệ bằng Nhô - Hạ vệ."}], "decision": "Công thức eo trên: Đường kính hữu dụng (Nhô - Hậu vệ) = Đường kính đo khám âm đạo (Nhô - Hạ vệ) - 1.5 cm -> 12.0 cm - 1.5 cm = 10.5 cm (Ngưỡng chuẩn >= 10.5 cm) -> Eo trên bình thường.", "explanation": "Theo Giáo trình Bài 25: Eo trên là mặt phẳng lọt của thai nhi. Đường kính quan trọng nhất của eo trên là đường kính trước sau hữu dụng (đường kính Nhô - Hậu vệ / Conjugata vera). Trên lâm sàng không đo trực tiếp được đường kính này mà phải đo đường kính Nhô - Hạ vệ (Conjugata diagonalis) qua khám âm đạo. Công thức: Đường kính Nhô - Hậu vệ = Đường kính Nhô - Hạ vệ trừ 1.5 cm. Ở sản phụ này: 12.0 cm - 1.5 cm = 10.5 cm. Kích thước 10.5 cm đạt tiêu chuẩn khung chậu bình thường."}, {"id": 18, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, con so, thai 39 tuần 5 ngày, vào viện vì đau bụng từng cơn. Thăm khám lúc 08:00: Cổ tử cung mở 3 cm, xóa 50%, cơn co tử cung 2 cơn/10 phút. Đến 14:00 (sau 6 giờ), khám lại cổ tử cung mở 4 cm, xóa 70%, cơn co 3 cơn/10 phút. Bác sĩ trẻ lo lắng cổ tử cung tiến triển chậm (chỉ mở 1 cm/6 giờ) và đề nghị tiêm Oxytocin tăng co. Bác sĩ trưởng khoa phân tích phân độ giai đoạn 1 của chuyển dạ theo hướng dẫn mới của WHO.", "question": "Thẩm định giai đoạn chuyển dạ hiện tại của sản phụ và đánh giá về đề xuất tiêm Oxytocin tăng co?", "options": ["Sản phụ đã ở giai đoạn hoạt động từ 3 cm trở lên bị ngưng trệ chuyển dạ nghiêm trọng; bắt buộc phải bấm ối và tiêm Oxytocin ngay lập tức.", "Sản phụ vẫn đang ở giai đoạn tiềm tàng cổ tử cung mở dưới 5 cm, tốc độ mở cổ tử cung 1 cm/6 giờ là hoàn toàn sinh lý; đề xuất tiêm Oxytocin tăng co là can thiệp quá mức không cần thiết.", "Sản phụ đang ở giai đoạn 2 của chuyển dạ; bắt buộc phải chuyển ngay lên phòng sinh để can thiệp thủ thuật Forceps.", "Sản phụ bị suy cơ tử cung cấp tính; cần chuyển mổ lấy thai cấp cứu ngay lập tức để tránh vỡ tử cung.", "Sản phụ đã bị chuyển dạ giả; cần cho dùng thuốc giảm co Nifedipine và cho xuất viện về nhà theo dõi."], "correct": 1, "traps": [{"key": "A", "trap": "[guideline_cu] - Nhầm theo hướng dẫn cũ mốc giai đoạn hoạt động là 3 cm hoặc 4 cm."}, {"key": "C", "trap": "[sai_tang] - Nhầm sang giai đoạn 2 sổ thai."}, {"key": "D", "trap": "[qua_muc] - Chẩn đoán mổ cấp cứu quá mức."}, {"key": "E", "trap": "[qua_bao_ton] - Đây là chuyển dạ thật chứ không phải chuyển dạ giả."}], "decision": "Khuyến cáo WHO/ACOG mới: Giai đoạn tiềm tàng (1a) kéo dài từ khi khởi phát đến khi CTC mở 5 cm. Tốc độ mở CTC trong giai đoạn tiềm tàng có thể rất chậm và biến thiên (có thể kéo dài > 12-20 giờ) -> Mở 4 cm vẫn thuộc giai đoạn tiềm tàng -> Không can thiệp Oxytocin vội vàng.", "explanation": "Theo Hướng dẫn mới của WHO và ACOG (được cập nhật trong Bài 25): Giai đoạn 1a (tiềm tàng) kéo dài từ khi bắt đầu chuyển dạ đến khi cổ tử cung mở 5 cm (thay vì 3 cm hay 4 cm như trước đây). Trong giai đoạn tiềm tàng, tốc độ mở cổ tử cung diễn ra chậm và không tuân theo quy tắc 1 cm/giờ. Do sản phụ cổ tử cung mới mở 4 cm (vẫn thuộc giai đoạn tiềm tàng), tim thai và sinh hiệu mẹ hoàn toàn bình thường, việc cổ tử cung mở 1 cm sau 6 giờ là diễn tiến sinh lý chấp nhận được. Đề xuất can thiệp Oxytocin là không cần thiết."}, {"id": 19, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 40 tuần, cổ tử cung đã mở trọn 10 cm lúc 10:00 (bắt đầu giai đoạn 2 chuyển dạ). Sản phụ được hướng dẫn rặn sinh khi có cơn co. Đến 11:30 (sau 1.5 giờ rặn), ngôi thai đã xuống đến mốc +2, tim thai dao động tốt 140 lần/phút. Bác sĩ nội trú phân vân có nên can thiệp mổ lấy thai hay giúp sinh thủ thuật hay tiếp tục cho rặn sinh.", "question": "Giới hạn thời gian sinh lý của giai đoạn 2 (sổ thai) ở người con so không gây tê ngoài màng cứng và thái độ xử trí phù hợp?", "options": ["Thời gian sinh lý giai đoạn 2 ở con so tối đa chỉ là 30 phút; hiện tại rặn 1.5 giờ là kéo dài bất thường bắt buộc phải mổ lấy thai khẩn cấp.", "Giai đoạn 2 ở con so không bao giờ có giới hạn thời gian; có thể cho sản phụ rặn kéo dài 12 giờ đến khi thai tự rơi ra ngoài.", "Giai đoạn 2 chỉ được phép kéo dài tối đa 10 phút; quá 10 phút thai nhi sẽ bị ngạt não nặng bắt buộc phải dùng Forceps kéo ngay.", "Thời gian sinh lý giai đoạn 2 ở con so kéo dài tới 2 - 3 giờ; hiện tại rặn 1.5 giờ ngôi thai tiến triển tốt và tim thai bình thường nên tiếp tục cho rặn sinh ngả âm đạo.", "Bắt buộc phải bấm ối và cho tiêm thuốc mê tĩnh mạch để sản phụ ngủ ngáy trong suốt thời gian rặn sinh."], "correct": 3, "traps": [{"key": "A", "trap": "[guideline_cu] - Áp dụng giới hạn cũ 45-60 phút quá cứng nhắc."}, {"key": "B", "trap": "[qua_bao_ton] - Rặn 12 giờ gây tổn thương tầng sinh môn và suy thai nặng."}, {"key": "C", "trap": "[qua_muc] - Giới hạn 10 phút là hoàn toàn sai."}, {"key": "E", "trap": "[bo_chong_chi_dinh] - Tiêm thuốc mê làm mất phản xạ rặn tự nhiên."}], "decision": "Giới hạn sinh lý Giai đoạn 2 (Sổ thai) theo ACOG/WHO: Con so không gây tê NCMC kéo dài đến 2-3 giờ (Con rạ 1-2 giờ) -> Sản phụ rặn 1.5h, ngôi +2, tim thai 140 ck/p -> Tiến triển tốt -> Tiếp tục hỗ trợ rặn sinh ngả âm đạo.", "explanation": "Theo Giáo trình Bài 25 và Hướng dẫn ACOG/WHO: Giai đoạn 2 (sổ thai) tính từ khi cổ tử cung mở trọn (10 cm) đến khi thai nhi sổ hoàn toàn ra ngoài. Ở người con so không giảm đau ngoài màng cứng, thời gian giai đoạn 2 sinh lý có thể kéo dài từ 2 đến 3 giờ (ở con rạ là 1 đến 2 giờ). Miễn là tim thai hoàn toàn bình thường và ngôi thai tiếp tục có sự tiến triển đi xuống qua các cơn co rặn, việc cho sản phụ rặn sinh tiếp tục dưới sự theo dõi sát là hoàn toàn đúng đắn."}, {"id": 20, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 26 tuổi, con rạ, vừa sổ thai nhi an toàn. Bác sĩ theo dõi giai đoạn 3 (sổ nhau). Sau 10 phút, tử cung co tròn cứng thành khối an toàn. Bác sĩ quan sát thấy bánh nhau sổ ra ngoài với mặt thai (màng ối láng bóng) đi ra trước, sau khi bánh nhau sổ hoàn toàn thì máu cục và máu tươi mới chảy ra theo sau (khoảng 150 mL). Bác sĩ yêu cầu học viên chẩn đoán cơ chế sổ nhau này.", "question": "Chẩn đoán tên cơ chế sổ nhau và phân biệt với cơ chế sổ nhau Duncan?", "options": ["Cơ chế sổ nhau Baudelocque sổ mặt thai ra trước, máu chảy ra sau khi nhau sổ; khác với cơ chế Duncan sổ mặt mẹ ra trước, máu chảy rỉ rả trước và trong khi nhau sổ.", "Cơ chế sổ nhau Duncan sổ mặt thai ra trước, không chảy máu; khác với cơ chế Baudelocque bánh nhau bị kẹt hoàn toàn trong buồng tử cung.", "Cơ chế sổ nhau bóc tách nhân tạo; khác với cơ chế sổ nhau tự nhiên hoàn toàn không gây mất máu.", "Cơ chế sổ nhau do đờ tử cung cấp tính; khác với cơ chế sổ nhau sinh lý không bao giờ thấy bánh nhau thò ra âm đạo.", "Cơ chế sổ nhau do nhau cài răng lược; khác với cơ chế Baudelocque chỉ gặp ở thai kỳ đa thai."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_thu_tu] - Nhầm lẫn ngược định nghĩa cơ chế Duncan."}, {"key": "C", "trap": "[phan_biet_hep] - Bóc nhau nhân tạo là thủ thuật chứ không phải cơ chế sinh lý."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Khối an toàn co tốt chứng tỏ tử cung không bị đờ."}, {"key": "E", "trap": "[nham_dan_so] - Nhau cài răng lược không thể tự sổ."}], "decision": "Hai cơ chế sổ nhau sinh lý: (1) Baudelocque (75%) -> Bóc từ trung tâm -> Tạo khối tụ máu sau nhau -> Mặt thai (màng ối) sổ ra trước -> Máu chảy ra sau; (2) Duncan (25%) -> Bóc từ mép -> Mặt mẹ (múi nhau) sổ ra trước -> Máu chảy ra trước và trong khi sổ.", "explanation": "Theo Giáo trình Bài 25: Giai đoạn 3 (sổ nhau) có 2 cơ chế bong và sổ nhau sinh lý: (1) Cơ chế Baudelocque (chiếm 75%): Bánh nhau bắt đầu tróc từ trung tâm, tạo thành khối máu tụ sau nhau đẩy bánh nhau tiến xuống. Mặt thai (màng ối láng bóng có dây rốn bám) sổ ra trước, sau khi nhau sổ hoàn toàn thì máu cục và máu tươi tích tụ mới chảy ra sau; (2) Cơ chế Duncan (chiếm 25%): Bánh nhau bắt đầu tróc từ rìa mép. Mặt mẹ (các múi nhau đỏ thẫm) sổ ra trước, máu chảy rỉ rả ra ngoài trước và trong suốt quá trình nhau sổ."}, {"id": 21, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, con rạ, vừa sổ thai nhi nặng 3.400 g. Ngay sau khi thai sổ, nữ hộ sinh tiến hành quy trình Xử trí tích cực giai đoạn 3 (Active Management of the Third Stage of Labor - AMTSL) để phòng ngừa băng huyết sau sinh. Học viên kiểm tra lại trình tự các bước can thiệp trong quy trình AMTSL chuẩn của Bộ Y tế và WHO.", "question": "Trình tự chuẩn xác 3 bước cốt lõi trong quy trình Xử trí tích cực giai đoạn 3 (AMTSL)?", "options": ["Bước 1: Kéo mạnh dây rốn khi tử cung chưa co; Bước 2: Tiêm Oxytocin vào bánh nhau; Bước 3: Chờ bánh nhau tự rơi xuống chậu nước ấm.", "Bước 1: Bóc nhau bằng tay khẩn cấp; Bước 2: Tiêm Ergonovine vào cơ tử cung; Bước 3: Cho sản phụ uống 800 mcg Misoprostol lập tức.", "Bước 1: Tiêm bắp 10 IU Oxytocin ngay sau khi sổ thai đã loại trừ thai thứ hai; Bước 2: Kéo dây rốn có kiểm soát kết hợp ấn ngược tử cung lên trên; Bước 3: Xoa đáy tử cung qua thành bụng mỗi 15 phút.", "Bước 1: Chờ 30 phút cho nhau tự sổ; Bước 2: Tiêm kháng sinh toàn thân; Bước 3: Khâu phục hồi tầng sinh môn bằng chỉ đơn sợi.", "Bước 1: Tiêm truyền Fibrinogen tĩnh mạch; Bước 2: Đặt bóng Bakri vào buồng tử cung; Bước 3: Thắt động mạch tử cung hai bên."], "correct": 2, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - Kéo mạnh dây rốn khi tử cung chưa co gây lộn tử cung nguy hiểm."}, {"key": "B", "trap": "[qua_xam_lan] - Bóc nhau bằng tay không phải bước trong AMTSL thường quy."}, {"key": "D", "trap": "[qua_bao_ton] - Chờ 30 phút không tiêm Oxytocin là xử trí thụ động cũ."}, {"key": "E", "trap": "[nham_dan_so] - Đây là các thủ thuật điều trị băng huyết nặng chứ không phải AMTSL."}], "decision": "Quy trình AMTSL 3 bước chuẩn: (1) Tiêm bắp 10 IU Oxytocin trong vòng 1 phút sau sổ thai (xác định không còn thai); (2) Kéo dây rốn có kiểm soát CCT (tay dưới ấn tử cung ngược lên trên, tay trên kéo nhẹ dây rốn theo chiều cong dạ chậu); (3) Xoa đáy tử cung mỗi 15 phút trong 2 giờ đầu.", "explanation": "Theo Giáo trình Bài 25 và Hướng dẫn Quốc gia: Xử trí tích cực giai đoạn 3 (AMTSL) giúp giảm trên 60% nguy cơ băng huyết sau sinh do đờ tử cung. Quy trình gồm 3 bước: (1) Tiêm bắp 10 UI Oxytocin ngay sau khi sổ thai (sau khi đã khám khẳng định không còn thai thứ hai trong tử cung); (2) Kéo dây rốn có kiểm soát (Controlled Cord Traction - CCT): Một tay đặt trên xương vệ đẩy tử cung ngược lên phía đáy, tay kia giữ dây rốn và kéo nhẹ nhàng theo chiều đường sinh khi có cơn co tử cung; (3) Xoa đáy tử cung ngay sau khi nhau sổ và duy trì xoa 15 phút/lần trong 2 giờ đầu sau sinh."}, {"id": 22, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 39 tuần, đang trong giai đoạn 2 của chuyển dạ. Bác sĩ theo dõi sinh hiệu của mẹ ghi nhận: Mối khi có cơn co tử cung xuất hiện, khoảng 300 - 500 mL máu từ tử cung được dồn ngược vào hệ tuần hoàn chung của mẹ, làm thể tích máu tuần hoàn tăng cấp tính, huyết áp tâm thu tăng lên 10 - 20 mmHg và cung lượng tim tăng lên từ 15% đến 30%. Bác sĩ thảo luận về gánh nặng tuần hoàn này ở bệnh nhân có bệnh lý tim mạch kèm theo.", "question": "Phân tích tác động của sự biến đổi huyết động trong cơn co tử cung đối với sản phụ mắc bệnh tim mạch?", "options": ["Cơn co tử cung làm ngừng hoàn toàn hoạt động của tim mẹ trong 30 giây, sau đó tim mới đập lại với nhịp chậm 40 lần/phút.", "Cơn co tử cung làm giảm hoàn toàn thể tích tuần hoàn mẹ, làm tụt huyết áp nghiêm trọng và gây thiếu máu não diện rộng.", "Máu từ tử cung dồn vào tĩnh mạch cửa làm tăng áp lực tĩnh mạch cửa gây vỡ tĩnh mạch thực quản cấp tính.", "Chuyển dạ hoàn toàn không gây ra bất kỳ sự thay đổi huyết động nào ở người mẹ do bánh nhau đã hấp thu toàn bộ lượng máu dư thừa.", "Mỗi cơn co tử cung làm tăng đột ngột thể tích máu trở về tim, dễ gây ra tình trạng suy tim cấp và phù phổi cấp ở sản phụ có bệnh tim từ trước."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_muc] - Tim mẹ không ngừng đập trong cơn co."}, {"key": "B", "trap": "[sai_tang] - Cơn co làm TĂNG thể tích tuần hoàn về tim chứ không giảm."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Máu dồn về tĩnh mạch chủ dưới và tim chứ không dồn vào tĩnh mạch cửa."}, {"key": "D", "trap": "[nham_dan_so] - Phủ nhận sự biến đổi huyết động rất lớn trong chuyển dạ."}], "decision": "Mỗi cơn co tử cung -> Ép 300-500 ml máu từ các xoang mạch tử cung vào hệ tuần hoàn chung -> Tăng thể tích máu trở về tim + Tăng cung lượng tim 15-30% -> Nguy cơ suy tim cấp & Phù phổi cấp ở sản phụ có bệnh tim mạch.", "explanation": "Theo Giáo trình Bài 25: Trong mỗi cơn co tử cung, sự co thắt của các cơ tử cung ép khoảng 300 - 500 mL máu từ các xoang mạch tử cung dồn ngược về hệ tuần hoàn chung của người mẹ. Điều này làm gia tăng thể tích máu trở về tim, làm tăng huyết áp tâm thu (tăng 10-20 mmHg) và tăng cung lượng tim từ 15% đến 30% trong giai đoạn 1, và tăng tới 50% trong giai đoạn 2. Sự gia tăng thể tích đột ngột này là thử thách rất lớn đối với người mẹ mắc bệnh tim mạch (nhất là hẹp van 2 lá, suy tim), rất dễ khởi phát cơn suy tim cấp hoặc phù phổi cấp ngay trong chuyển dạ hoặc ngay sau khi sổ nhau."}, {"id": 23, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 25 tuổi, con so, thai 40 tuần, chuyển dạ kéo dài ở giai đoạn 2. Bác sĩ khám âm đạo đánh giá ngôi thai ghi nhận hai xương đỉnh của thai nhi đè lên nhau, các mép xương sọ chồng lên nhau rõ rệt nhưng khi dùng ngón tay ấn đẩy nhẹ thì các xương sọ vẫn đẩy tách ra được (Chồng xương sọ độ 2). Bác sĩ phân tích cho học viên về hiện tượng uốn khuôn đầu thai nhi.", "question": "Phân loại các độ chồng xương sọ thai nhi trên lâm sàng và ý nghĩa của Chồng xương sọ độ 3?", "options": ["Độ 0: Thai nhỏ; Độ 1: Thai bình thường; Độ 2: Thai to; Độ 3: Thai dị dạng não phình to.", "Độ 0: Xương sọ sát nhau không chồng; Độ 1: Chạm nhau; Độ 2: Chồng lên nhau nhưng đẩy tách ra được; Độ 3: Chồng lên nhau cố định không đẩy tách ra được chất hẹp khung chậu/bất tương xứng đầu chậu.", "Độ 1: Khung chậu rộng; Độ 2: Khung chậu bình thường; Độ 3: Thai nhi bị dập não xuất huyết hoàn toàn.", "Các độ chồng xương sọ chỉ có giá trị sau khi thai đã sổ ra ngoài và không phản ánh bất tương xứng đầu chậu.", "Độ 3 là dấu hiệu sinh lý bình thường giúp cho thai nhi lọt nhanh hơn qua tầng sinh môn dãn mỏng."], "correct": 1, "traps": [{"key": "A", "trap": "[nham_dan_so] - Phân loại không dựa vào kích thước thai."}, {"key": "C", "trap": "[qua_muc] - Độ 3 không có nghĩa là dập não hoàn toàn."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Chồng xương sọ có giá trị chẩn đoán bất tương xứng đầu chậu trong chuyển dạ."}, {"key": "E", "trap": "[phan_biet_hep] - Độ 3 là bệnh lý bất tương xứng đầu chậu chứ không phải sinh lý bình thường."}], "decision": "Hiện tượng uốn khuôn (Molding) - Chồng xương sọ: Độ 0 (2 xương sát nhau) -> Độ 1 (2 xương chạm mép) -> Độ 2 (2 xương chồng lên nhau nhưng đẩy tách ra được) -> Độ 3 (2 xương chồng đè cố định, không nắn tách ra được -> Dấu hiệu bất tương xứng đầu chậu nghiêm trọng).", "explanation": "Theo Giáo trình Bài 25: Hiện tượng uốn khuôn đầu thai nhi (molding) là sự thay đổi hình dạng đầu thai nhi nhờ tính đàn hồi của các khớp sọ chưa liền. Đánh giá độ chồng xương sọ: Độ 0: Các xương sọ nằm sát nhau, rãnh khớp còn sờ rõ; Độ 1: Các bờ xương sọ chạm vào nhau; Độ 2: Các bờ xương sọ chồng lên nhau nhưng khi dùng tay nắn ấn nhẹ vẫn đẩy tách rời ra được; Độ 3: Các bờ xương sọ chồng đè lên nhau cố định, không thể nắn tách ra được. Chồng xương sọ độ 3 là dấu hiệu cảnh báo bất tương xứng đầu chậu nghiêm trọng, nguy cơ kẹt ngôi và rách đường sinh dục."}, {"id": 24, "bloom": "Mức 3 - Phân tích", "stem": "Một trẻ sơ sinh nam vừa sinh ngả âm đạo sau một cuộc chuyển dạ kéo dài 14 giờ. Thám khám đầu trẻ ngay sau sinh ghi nhận một khối mềm, phù nề ở vùng đỉnh đầu, ranh giới không rõ ràng, lan qua cả đường khớp sọ giữa hai xương đỉnh. Trẻ không đau khi ấn nhẹ. Bác sĩ nội trú phân biệt khối này với khối máu tụ dưới màng xương.", "question": "Đặc điểm lâm sàng nào giúp chẩn đoán xác định khối này là bướu huyết thanh (Caput succedaneum) và phân biệt với khối máu tụ dưới màng xương?", "options": ["Bướu huyết thanh do vi khuẩn xâm nhập gây mủ, trong khi máu tụ dưới màng xương là do thiếu hụt Vitamin K sinh lý.", "Bướu huyết thanh chỉ xuất hiện sau sinh 3 ngày, cứng như đá, giới hạn rõ trong phạm vi một xương sọ và bắt buộc phải mổ rạch dẫn lưu máu.", "Bướu huyết thanh làm xương sọ trẻ bị nứt hoàn toàn, trong khi máu tụ dưới màng xương làm não trẻ phình to.", "Bướu huyết thanh xuất hiện ngay sau sinh, mềm, lan qua đường khớp sọ và tự tiêu sau vài ngày; trong khi máu tụ dưới màng xương xuất hiện sau vài giờ/ngày, giới hạn rõ trong phạm vi một xương sọ và lâu tiêu.", "Hai bệnh lý này là một, hoàn toàn không có bất kỳ điểm khác biệt nào về vị trí giải phẫu hay diễn tiến lâm sàng."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] - Bướu huyết thanh không phải do vi khuẩn gây mủ."}, {"key": "B", "trap": "[sai_tang] - Nhầm lẫn đặc điểm của máu tụ dưới màng xương."}, {"key": "C", "trap": "[qua_muc] - Bướu huyết thanh là tổn thương phần mềm dưới da chứ không nứt xương sọ."}, {"key": "E", "trap": "[phan_biet_hep] - Phủ nhận sự khác biệt giải phẫu rõ rệt."}], "decision": "Phân biệt lâm sàng: Bướu huyết thanh (Caput succedaneum) -> Tụ dịch đệm dưới da -> Có ngay sau sinh + Mềm + Vượt qua đường khớp sọ + Tự hấp thu sau 24-72h. Máu tụ dưới màng xương (Cephalohematoma) -> Máu chảy dưới màng xương -> Giới hạn rõ trong 1 xương sọ (không qua khớp sọ) + Tiêu chậm vài tuần.", "explanation": "Theo Giáo trình Bài 25: Bướu huyết thanh (Caput succedaneum) là hiện tượng tụ dịch huyết thanh và máu ở lớp mô liên kết dưới da đầu thai nhi tại vùng ngôi thai thấp nhất chịu áp lực tử cung và đường sinh dãn mở. Đặc điểm: Xuất hiện ngay khi sinh, mềm, ranh giới không rõ và có thể lan qua các đường khớp sọ, tự tiêu biến mất sau 1-3 ngày mà không cần điều trị. Khác với khối máu tụ dưới màng xương (Cephalohematoma) là tụ máu giữa xương sọ và màng xương, xuất hiện muộn hơn sau sinh vài giờ, giới hạn nghiêm ngặt trong phạm vi một xương sọ (không vượt qua đường khớp sọ) và lâu tiêu hơn (vài tuần/tháng)."}, {"id": 25, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con so, thai 40 tuần, đang truyền Oxytocin tăng co. Bác sĩ quan sát thấy cơn co tử cung dồn dập 6 cơn trong 10 phút, mỗi cơn co kéo dài 60 giây, trương lực cơ bản vọt lên 22 mmHg (cơn co tử cung cường năng). Ngay lập tức, đường biểu diễn tim thai trên Monitoring xuất hiện các nhịp chậm muộn (Late decelerations) lặp lại liên tiếp. Bác sĩ chỉ định khóa ngay dây truyền Oxytocin.", "question": "Cơ chế sinh lý bệnh nào giải thích hiện tượng suy thai cấp do cơn co tử cung cường năng gây ra?", "options": ["Khi áp lực tử cung vượt quá 30 mmHg trong cơn co, các động mạch xoắn màng rụng bị chèn ép hoàn toàn làm ngừng dòng máu vào hồ huyết, nếu khoảng cách giữa các cơn co quá ngắn thai nhi không kịp bù đắp oxy dẫn đến suy thai.", "Cơn co tử cung cường năng làm tăng gấp 10 lần lượng máu giàu oxy từ mẹ vào thai nhi, gây ra tình trạng ngộ độc oxy cấp tính ở tế bào não thai.", "Cơn co tử cung làm đứt rời hoàn toàn dây rốn ra khỏi bánh nhau, làm thai nhi mất toàn bộ lượng máu trong vòng 5 giây.", "Cơn co tử cung cường năng làm cho màng ối bị đè ép giải phóng lượng lớn khí CO2 trực tiếp vào động mạch chủ thai nhi.", "Cơn co tử cung làm cho bánh nhau bị bong hoàn toàn ra khỏi thành tử cung và rơi xuống âm đạo ngay ở giai đoạn 1."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_tang] - Cơn co làm NGỪNG dòng máu vào hồ huyết chứ không tăng."}, {"key": "C", "trap": "[qua_muc] - Cơn co không làm đứt rời dây rốn."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Khí CO2 không giải phóng trực tiếp từ màng ối vào ĐM chủ."}, {"key": "E", "trap": "[nham_dan_so] - Cơn co cường năng có thể gây nhau bong non nhưng cơ chế suy thai chính là gián đoạn tuần hoàn hồ huyết."}], "decision": "Cơ chế trao đổi máu hồ huyết: Khi tử cung co (áp lực > 30 mmHg) -> Động mạch xoắn bị đè ép -> Dòng máu mẹ vào hồ huyết tạm thời ngừng lại -> Thai trao đổi oxy nhờ lượng O2 dự trữ trong hồ huyết -> Khi hết cơn co (áp lực < 15 mmHg) -> Máu mẹ chảy lại vào hồ huyết -> Nếu cơn co quá thưa/ngắn thời gian nghỉ -> Thai bị thiếu oxy trường diễn -> Suy thai cấp.", "explanation": "Theo Giáo trình Bài 25: Dòng máu từ mẹ vào hồ huyết bánh nhau qua các động mạch xoắn màng rụng. Khi áp lực trong buồng tử cung trong cơn co vượt quá áp lực động mạch (khoảng > 30 mmHg), các động mạch xoắn bị chèn ép hoàn toàn làm dòng máu mẹ vào hồ huyết bị gián đoạn. Thai nhi sống nhờ lượng oxy dự trữ còn lại trong hồ huyết. Trong khoảng thời gian nghỉ giữa 2 cơn co (khi áp lực tử cung trở về trương lực cơ bản 8-12 mmHg), dòng máu mẹ mới chảy lại vào hồ huyết để tái nạp oxy. Nếu cơn co tử cung quá dồn dập hoặc trương lực cơ bản quá cao (cơn co cường năng), thời gian nghỉ không đủ để nạp lại oxy, lượng oxy dự trữ trong hồ huyết cạn kiệt sẽ dẫn đến thiếu oxy thai cấp tính (thể hiện bằng nhịp chậm muộn trên CTG)."}, {"id": 26, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 24 tuổi, con so, vóc dáng nhỏ, chiều cao 145 cm, thai ước tính 3.300 g qua siêu âm. Thăm khám khung chậu trong: Đường kính Nhô - Hạ vệ đo được 10.0 cm (đường kính Nhô - Hậu vệ ước tính chỉ đạt 8.5 cm). Đường kính lưỡng gai hông eo giữa đo được 8.5 cm, góc vòm vệ hẹp < 80 độ. Cổ tử cung mở 4 cm sau 4 giờ có cơn co tử cung tốt nhưng đầu thai nhi vẫn cao bập bềnh (Mốc -3), xuất hiện dấu hiệu chồng xương sọ độ 2.", "question": "Chẩn đoán hình thái khung chậu mẹ và ra quyết định xử trí chuyên môn đúng đắn nhất?", "options": ["Chẩn đoán Khung chậu rộng rãi; cho sản phụ dùng thuốc giảm co và nằm theo dõi tiếp tục 24 giờ tại phòng chờ sinh.", "Chẩn đoán Khung chậu bình thường; chỉ định bấm ối và cho tiêm Oxytocin tăng co liều cao để thúc đầu thai nhi lọt.", "Chẩn đoán Khung chậu hẹp tuyệt đối cả 3 eo kèm Bất tương xứng đầu chậu; ra quyết định phẫu thuật mổ lấy thai cấp cứu.", "Chẩn đoán Thai chậm phát triển trong tử cung; chỉ định thủ thuật Forceps kéo thai ngay lập tức khi cổ tử cung mới mở 4 cm.", "Chẩn đoán Khung chậu lý tưởng cho sinh ngả âm đạo; chỉ định tiêm tê ngoài màng cứng và cho sản phụ rặn sinh ngay."], "correct": 2, "traps": [{"key": "A", "trap": "[qua_bao_ton] - Nằm theo dõi kéo dài khi khung chậu hẹp gây vỡ tử cung và suy thai."}, {"key": "B", "trap": "[qua_xam_lan] - Khung chậu hẹp tuyệt đối mà tiêm Oxytocin thúc lọt sẽ gây vỡ tử cung."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Forceps chống chỉ định tuyệt đối khi cổ tử cung chưa mở trọn và đầu chưa lọt."}, {"key": "E", "trap": "[sai_tang] - Chẩn đoán khung chậu lý tưởng là hoàn toàn sai."}], "decision": "Chiều cao mẹ 145 cm + Nhô - Hậu vệ 8.5 cm (< 8.5 cm: Hẹp eo trên tuyệt đối) + Lưỡng gai hông 8.5 cm (Hẹp eo giữa) + Cơn co tốt nhưng đầu -3 chồng xương sọ độ 2 -> Bất tương xứng đầu chậu do khung chậu hẹp tuyệt đối -> Bắt buộc mổ lấy thai cấp cứu.", "explanation": "Theo Giáo trình Bài 25: Đường kính trước sau eo trên (Nhô - Hậu vệ) < 8.5 cm được phân loại là khung chậu hẹp tuyệt đối (bình thường >= 10.5 cm). Kết hợp với đường kính lưỡng gai hông eo giữa < 9.0 cm và góc vòm vệ < 80 độ khẳng định khung chậu hẹp toàn bộ. Khi có cơn co tử cung tốt mà đầu thai nhi vẫn cao bập bềnh (-3) kèm chồng xương sọ độ 2 là hình ảnh lâm sàng điển hình của Bất tương xứng đầu chậu. Quyết định xử trí duy nhất đúng đắn và an toàn là phẫu thuật mổ lấy thai cấp cứu, tuyệt đối chống chỉ định tăng co Oxytocin vì nguy cơ vỡ tử cung thảm khốc."}, {"id": 27, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 26 tuổi, con so, thai 39 tuần 6 ngày, chuyển dạ giai đoạn 1b. Khám âm đạo khi cổ tử cung mở 5 cm, màng ối dẹt: Sờ thấy đường liên thóp nằm theo đường kính chéo trái của khung chậu, thóp sau dạng hình tam giác nằm ở vị trí 10 giờ (phía trước bên trái khung chậu mẹ). Bác sĩ yêu cầu học viên xác định chính xác tên kiểu thế và hướng xoay trong của thóp sau.", "question": "Xác định tên kiểu thế của ngôi thai và góc xoay trong sinh lý khi thai tiến vào giai đoạn 2?", "options": ["Kiểu thế Chẩm chậu trái ngang; thóp sau sẽ xoay ra sau một góc 90 độ theo chiều kim đồng hồ.", "Kiểu thế Chẩm chậu phải sau; thóp sau sẽ xoay ra sau một góc 135 độ để nằm ở hõm tủy xương cùng.", "Kiểu thế Chẩm chậu trái sau; thóp sau không cần xoay mà sổ trực tiếp ở đường kính chéo trái.", "Kiểu thế Chẩm chậu phải trước; thóp sau sẽ xoay ra trước một góc 90 độ để về vòm mu.", "Kiểu thế Chẩm chậu trái trước; thóp sau sẽ xoay ra trước một góc 45 độ ngược chiều kim đồng hồ để nằm dưới khớp vệ."], "correct": 4, "traps": [{"key": "A", "trap": "[phan_biet_hep] - LOA không phải kiểu thế ngang LOT (thóp sau ở 3 giờ)."}, {"key": "B", "trap": "[sai_thu_tu] - Nhầm lẫn với kiểu thế Chẩm chậu phải sau (ROP - thóp sau ở 4 giờ)."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Ngôi chẩm luôn cần xoay trong trước khi sổ."}, {"key": "D", "trap": "[nham_dan_so] - ROA là Chẩm chậu phải trước (thóp sau ở 2 giờ)."}], "decision": "Mốc ngôi chẩm = Thóp sau (hình tam giác). Thóp sau ở 10h (phía trước bên trái) -> Kiểu thế LOA (Chẩm chậu trái trước - chiếm 60% trường hợp) -> Xoay trong 45 độ ngược chiều kim đồng hồ về dưới khớp vệ (12h) để sổ.", "explanation": "Theo Giáo trình Bài 25: Ngôi chẩm lấy thóp sau (hình tam giác) làm điểm mốc. Vị trí 10 giờ trên mặt phẳng khung chậu mẹ tương ứng với phía trước bên trái -> Kiểu thế Chẩm chậu trái trước (LOA - Left Occiput Anterior). Đây là kiểu thế lọt lọt phổ biến và thuận lợi nhất (chiếm khoảng 60%). Trong quá trình xuống và xoay, thóp sau sẽ xoay ra phía trước một góc 45 độ ngược chiều kim đồng hồ để về nằm dưới khớp vệ (vị trí 12 giờ), chuẩn bị cho thì sổ thai."}, {"id": 28, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 30 tuổi, con so, thai 40 tuần, chuyển dạ kéo dài ở giai đoạn hoạt động. Bác sĩ khám âm đạo thấy cổ tử cung mở 6 cm, thóp sau hình tam giác nằm ở vị trí 4 giờ (phía sau bên phải khung chậu mẹ). Sản phụ than phiền đau lưng rất dữ dội theo mỗi cơn co. Bác sĩ giải thích cho sinh viên về cơ chế xoay của kiểu thế Chẩm chậu phải sau (ROP).", "question": "Phân tích đặc điểm lâm sàng và hướng xoay trong sinh lý của kiểu thế Chẩm chậu phải sau (ROP)?", "options": ["Kiểu thế ROP sẽ tự động xoay ngang 90 độ và kẹt lại vĩnh viễn ở eo giữa không bao giờ sổ được.", "Kiểu thế ROP thường gây đau lưng nhiều; thóp sau phải xoay một góc rộng 135 độ ra trước về dưới khớp vệ hoặc 45 độ ra sau về hốc xương cùng.", "Kiểu thế ROP là chỉ định mổ lấy thai tuyệt đối ngay khi phát hiện mà không được cho theo dõi sinh ngả âm đạo.", "Kiểu thế ROP làm cho cổ tử cung bị khóa chặt hoàn toàn ở mức 2 cm không thể tiến triển thêm.", "Kiểu thế ROP làm cho thai nhi bị quay ngược đầu lên đáy tử cung thành ngôi ngược trong giai đoạn 2."], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - Tuyên bố kẹt vĩnh viễn là không đúng, đa số vẫn xoay ra trước được."}, {"key": "C", "trap": "[qua_muc] - ROP không phải chỉ định mổ lấy thai tuyệt đối ngay từ đầu."}, {"key": "D", "trap": "[phan_biet_hep] - ROP không khóa chặt cổ tử cung ở 2 cm."}, {"key": "E", "trap": "[sai_tang] - Thai không thể tự quay ngược đầu thành ngôi ngược trong giai đoạn 2."}], "decision": "Thóp sau ở 4h -> Kiểu thế Chẩm chậu phải sau (ROP) -> Gây đau lưng nhiều do chẩm đè xương cùng. Xoay trong: Đa số (90%) xoay ra trước 135 độ về dưới khớp vệ; một số ít (10%) xoay ra sau 45 độ về hõm cùng (sổ chẩm sau).", "explanation": "Theo Giáo trình Bài 25: Kiểu thế Chẩm chậu phải sau (ROP) có thóp sau nằm ở vị trí 4 giờ (phía sau bên phải). Do đầu thai nhi ngửa nhẹ hơn và chẩm tì vào xương cùng mẹ nên sản phụ thường bị đau lưng dữ dội trong chuyển dạ. Tiến triển xoay trong có 2 khả năng: Đa số trường hợp (khoảng 90%), thóp sau sẽ xoay một góc rộng 135 độ ngược chiều kim đồng hồ ra phía trước để về dưới khớp vệ (vị trí 12 giờ) và sổ như kiểu thế trước. Số ít trường hợp (khoảng 10%), thóp sau xoay 45 độ ra sau về hõm tủy xương cùng (vị trí 6 giờ) và sổ theo kiểu thế chẩm sau."}, {"id": 29, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 25 tuổi, con so, thai 39 tuần, đang trong giai đoạn 2 của chuyển dạ. Do đau đớn và lo âu, sản phụ thở rất nhanh và sâu (tần số thở 35 lần/phút) liên tục giữa các cơn co. Sau 20 phút, sản phụ xuất hiện triệu chứng tê bì ngón tay, ngọn chi, hoa mắt và co quắp bàn tay (dấu hiệu Trousseau). Xét nghiệm khí máu động mạch ghi nhận pH = 7.52, PaCO2 = 25 mmHg (kiềm hô hấp).", "question": "Cơ chế sinh lý bệnh nào giải thích tình trạng kiềm hô hấp và hướng xử trí hỗ trợ hô hấp cho sản phụ?", "options": ["Tăng thông khí làm đứt mạch máu phổi gây tràn khí màng phổi cấp; xử trí bằng cách chọc hút khí màng phổi ngay tại phòng sinh.", "Tăng thông khí làm tích tụ khí CO2 gây toan hô hấp nặng; xử trí bằng cách cho sản phụ ngửi khí Amoniac khẩn cấp.", "Sản phụ bị ngộ độc Oxy do hít thở không khí phòng sinh; xử trí bằng cách cho thở khí Nitrogen nguyên chất.", "Tăng thông khí quá mức do đau làm đào thải nhiều CO2 gây kiềm hô hấp và giảm Canxi ion hóa; xử trí bằng cách hướng dẫn sản phụ thở chậm lại và thở vào túi giấy.", "Tăng thông khí làm tụt đường huyết cấp tính; xử trí bằng cách tiêm truyền tĩnh mạch 500 mL Glucose 30%."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_muc] - Không phải tràn khí màng phổi."}, {"key": "B", "trap": "[sai_tang] - Tăng thông khí làm THẢI CO2 gây kiềm chứ không tích tụ CO2 gây toan."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Thở Nitrogen nguyên chất gây ngạt thở tử vong."}, {"key": "E", "trap": "[nham_dan_so] - Không phải triệu chứng tụt đường huyết."}], "decision": "Thở nhanh sâu quá mức trong chuyển dạ -> Thải quá nhiều CO2 -> Kiềm hô hấp cấp (PaCO2 < 35 mmHg) -> Tăng gắn kết Ca++ với Albumin -> Giảm Ca++ ion hóa máu -> Cơn Tetany co quắp bàn chi -> Hướng dẫn thở chậm, nhịp nhàng trong cơn co.", "explanation": "Theo Giáo trình Bài 25: Trong chuyển dạ, sự gia tăng thông khí do đau đớn và căng thẳng làm sản phụ thở nhanh và sâu, làm tăng thông khí phút lên tới 150-300%. Việc thông khí quá mức làm đào thải quá nhiều CO2 ra ngoài, dẫn đến tình trạng kiềm hô hấp cấp tính (pH > 7.45, PaCO2 giảm < 35 mmHg). Kiềm máu làm giảm nồng độ Canxi ion hóa tự do trong máu (do Canxi gắn mạnh hơn vào Albumin), từ đó gây ra các triệu chứng dị cảm, tê bì ngón tay và co quắp bàn tay (tetany). Hướng dẫn sản phụ trấn tĩnh, thở chậm và đều đặn theo nhịp cơn co (hoặc thở lại vào túi giấy) sẽ giúp giữ lại CO2 và cải thiện triệu chứng nhanh chóng."}, {"id": 30, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 40 tuần, được thực hiện kỹ thuật giảm đau ngoài màng cứng (ĐNMC) khi cổ tử cung mở 3 cm. Sau khi đâm cathetete thành công, sản phụ hoàn toàn hết đau đớn. Bác sĩ theo dõi tiến trình chuyển dạ ghi nhận cơn co tử cung có thời điểm bị thưa ra nhẹ ở giai đoạn đầu, và giai đoạn 2 (sổ thai) kéo dài thêm khoảng 1 giờ so với trung bình. Học viên thảo luận về tác động sinh lý của ĐNMC.", "question": "Ảnh hưởng sinh lý học điển hình của giảm đau ngoài màng cứng lên các giai đoạn chuyển dạ và phản xạ rặn sinh?", "options": ["ĐNMC có thể làm kéo dài nhẹ giai đoạn 2 của chuyển dạ và làm giảm nhẹ phản xạ rặn tự nhiên do mất cảm giác đè ép vùng tầng sinh môn phản xạ Ferguson.", "ĐNMC làm triệt tiêu hoàn toàn cơn co tử cung và bắt buộc 100% các ca phải chuyển mổ lấy thai cấp cứu.", "ĐNMC làm cho cổ tử cung bị cứng lại hoàn toàn và ngưng tiến triển xóa mở vĩnh viễn.", "ĐNMC làm tăng gấp 5 lần tốc độ sổ thai làm sản phụ đẻ rơi ngay trên giường bệnh không kịp chuẩn bị.", "ĐNMC gây liệt hoàn toàn cơ hoành làm sản phụ ngưng thở hoàn toàn trong suốt quá trình chuyển dạ."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_muc] - ĐNMC không triệt tiêu cơn co tử cung hay bắt buộc mổ cấp cứu 100%."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - ĐNMC không làm cứng cổ tử cung mà ngược lại giúp CTC mềm dãn tốt hơn."}, {"key": "D", "trap": "[sai_tang] - ĐNMC không làm đẻ rơi vọt."}, {"key": "E", "trap": "[nham_dan_so] - Liệt cơ hoành là biến chứng gây tê tủy sống cao hiếm gặp chứ không phải tác động sinh lý."}], "decision": "Tác động sinh lý của ĐNMC: (1) Giảm đau hoàn hảo giúp giảm catecholamine mẹ; (2) Giúp CTC dãn mềm tốt hơn; (3) Có thể làm kéo dài nhẹ giai đoạn 2 (thêm ~1 giờ) do giảm phản xạ rặn Ferguson -> Không làm tăng tỷ lệ mổ lấy thai.", "explanation": "Theo Giáo trình Bài 25: Giảm đau ngoài màng cứng (ĐNMC) là phương pháp giảm đau hiệu quả nhất trong chuyển dạ. ĐNMC giúp cắt đứt phản ứng căng thẳng lo âu, làm giảm nồng độ Catecholamine máu mẹ, giúp cổ tử cung dãn mềm tốt hơn. Tác động sinh lý chính của ĐNMC là có thể làm kéo dài thời gian giai đoạn 2 (giai đoạn sổ thai) thêm trung bình khoảng 1 giờ do thuốc tê làm giảm cảm giác căng đè ép ở vùng tầng sinh môn và cổ bàng quang, làm giảm nhẹ phản xạ rặn sinh tự nhiên (phản xạ Ferguson). ĐNMC hoàn toàn không làm tăng tỷ lệ mổ lấy thai."}, {"id": 31, "bloom": "Mức 3 - Phân tích", "stem": "Trong buổi đi buồng lâm sàng tại khoa Sinh, bác sĩ trưởng khoa yêu cầu nhóm bác sĩ nội trú phân tích tiên lượng khả năng sinh ngả âm đạo cho một sản phụ 29 tuổi mang thai lần đầu. Bác sĩ hướng dẫn hệ thống hóa các yếu tố tiên lượng theo mô hình 4P kinh điển trong Sản khoa.", "question": "Mô hình 4P tiên lượng cuộc sinh bao gồm 4 yếu tố cốt lõi nào?", "options": ["Pelvis Khung chậu, Perineum Tầng sinh môn, Platelet Tiểu cầu, Potassium Kali máu.", "Protein Dinh dưỡng mẹ, Pressure Huyết áp, Pulse Nhịp mạch, Pain Mức độ đau bụng của sản phụ.", "Power Lực co bóp tử cung và lực rặn, Passage Khung chậu và đường sinh học mẹ, Passenger Thai nhi và bánh nhau, Psyche Tâm lý và sự hợp tác của sản phụ.", "Parity Số lần sinh, Placenta Bánh nhau, Position Kiểu thế, Progesterone Nồng độ nội tiết.", "Pharynx Họng, Pancreas Tụy, Prostate Tuyến tiền liệt, Polyp Khối u cổ tử cung."], "correct": 2, "traps": [{"key": "A", "trap": "[sai_tang] - Liệt kê các thông số cận lâm sàng không đúng."}, {"key": "B", "trap": "[nham_dan_so] - Nhầm sang các dấu hiệu sinh hiệu và dinh dưỡng."}, {"key": "D", "trap": "[phan_biet_hep] - Các từ tiếng Anh bắt đầu bằng P nhưng không phải mô hình 4P tiên lượng."}, {"key": "E", "trap": "[bo_chong_chi_dinh] - Liệt kê các cơ quan không liên quan đến sản khoa."}], "decision": "Mô hình 4P tiên lượng cuộc đẻ: (1) Power - Lực (cơn co tử cung & lực rặn mẹ); (2) Passage - Đường sinh (khung chậu & phần mềm); (3) Passenger - Thai nhi (kích thước, ngôi, kiểu thế, bánh nhau); (4) Psyche - Tâm lý (sự chuẩn bị & hợp tác của mẹ).", "explanation": "Theo Giáo trình Bài 25: Tiên lượng một cuộc chuyển dạ sinh ngả âm đạo thành công phụ thuộc vào sự phối hợp nhịp nhàng của 4 yếu tố (mô hình 4P): (1) Power (Lực): Gồm lực co bóp tự động của tử cung và lực rặn chủ động của sản phụ trong giai đoạn 2; (2) Passage (Đường sinh): Gồm khung chậu xương (eo trên, eo giữa, eo dưới) và phần mềm đường sinh (cổ tử cung, âm đạo, tầng sinh môn); (3) Passenger (Thai nhi): Gồm kích thước thai, đường kính lọt của đầu, ngôi thai, kiểu thế và tình trạng sức khỏe thai; (4) Psyche (Tâm lý): Trạng thái tâm lý, tinh thần lo âu hay bình tĩnh và sự hợp tác của sản phụ với nhân viên y tế."}, {"id": 32, "bloom": "Mức 3 - Phân tích", "stem": "Bác sĩ trực cấp cứu phòng sinh tiếp nhận 2 sản phụ: Sản phụ X (con so, thai 40 tuần) có cơn co dồn dập 6 cơn/10 phút, cường độ 80 mmHg, trương lực cơ bản 20 mmHg, sản phụ đau đớn lăn lộn; Sản phụ Y (con rạ lần 4, thai 39 tuần) có cơn co thưa 1 cơn/10 phút, kéo dài 15 giây, cường độ 20 mmHg, cổ tử cung ngừng tiến triển suốt 4 giờ. Bác sĩ yêu cầu phân loại rối loạn cơn co tử cung.", "question": "Chẩn đoán chính xác dạng rối loạn cơn co tử cung ở sản phụ X và sản phụ Y?", "options": ["Cả hai sản phụ đều có cơn co tử cung sinh lý hoàn toàn bình thường không cần can thiệp.", "Sản phụ X bị Đờ tử cung cấp tính; Sản phụ Y bị Tăng trương lực cơ bản tử cung.", "Sản phụ X bị Chuyển dạ giả; Sản phụ Y bị Vỡ tử cung hoàn toàn ngập máu.", "Sản phụ X bị Suy thai mạn tính; Sản phụ Y bị Tắc mạch nước ối cấp tính.", "Sản phụ X bị Tăng cơn co tử cung Cơn co cường năng; Sản phụ Y bị Giảm cơn co tử cung Cơn co giảm năng/Đờ tử cung."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] - Cả hai đều có thông số rối loạn cơn co rõ rệt."}, {"key": "B", "trap": "[sai_thu_tu] - Nhầm lẫn ngược hai dạng rối loạn cơn co."}, {"key": "C", "trap": "[qua_muc] - Chẩn đoán vỡ tử cung quá mức khi không có triệu chứng."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Chẩn đoán tắc mạch nước ối hoàn toàn không phù hợp."}], "decision": "Rối loạn động lực tử cung: (1) Tăng cơn co (Cường năng) -> Tần số > 5 cơn/10p, cường độ > 80 mmHg, trương lực cơ bản > 15 mmHg -> Nguy cơ suy thai & vỡ tử cung; (2) Giảm cơn co (Giảm năng) -> Tần số < 2 cơn/10p, cường độ < 30 mmHg -> Gây ngưng trệ chuyển dạ.", "explanation": "Theo Giáo trình Bài 25: Rối loạn cơn co tử cung gồm 2 nhóm chính: (1) Tăng cơn co tử cung (Tăng năng/Cường năng): Tần số > 5 cơn/10 phút, cường độ > 80 mmHg hoặc trương lực cơ bản > 15 mmHg (như trường hợp sản phụ X). Nguy cơ gây suy thai cấp do cạn dự trữ oxy hồ huyết và vỡ tử cung nếu có bất tương xứng đầu chậu; (2) Giảm cơn co tử cung (Giảm năng/Nhược năng): Tần số < 2 cơn/10 phút, cường độ < 30 mmHg (như trường hợp sản phụ Y). Hậu quả làm cổ tử cung không xóa mở và chuyển dạ bị kéo dài, ngưng trệ."}, {"id": 33, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 38 tuần 3 ngày, vào viện lúc nửa đêm vì đau trằn bụng dưới. Thăm khám ghi nhận: Cơn co tử cung thưa thớt không đều (khoảng 15-20 phút mới có 1 cơn), kéo dài 15 giây, cường độ nhẹ, khi sản phụ đi lại hoặc ngâm nước ấm thì cơn co giảm hẳn và biến mất. Khám âm đạo: Cổ tử cung vẫn hướng sau, dài 2.5 cm, đóng kín lỗ trong. Bác sĩ tư vấn chẩn đoán.", "question": "Chẩn đoán tình trạng hiện tại của sản phụ và các tiêu chuẩn phân biệt với chuyển dạ thật?", "options": ["Sẩy thai khó tránh; cổ tử cung đóng kín là dấu hiệu bánh nhau đã bóc tách hoàn toàn.", "Chuyển dạ giả; cơn co không đều, không tăng dần, giảm khi nghỉ ngơi và quan trọng nhất là không làm biến đổi xóa mở cổ tử cung.", "Dọa sinh non cấp tính; cần cho nhập viện tiêm ngay 4 mũi Dexamethasone trưởng thành phổi.", "Chuyển dạ thật giai đoạn hoạt động; cơn co thưa là do suy cơ tử cung cấp tính bắt buộc phải mổ lấy thai ngay.", "Vỡ tử cung dưới màng bụng; cơn co thưa là do máu chảy ngập trong khoang phúc mạc."], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - Thai 38 tuần không chẩn đoán sẩy thai."}, {"key": "C", "trap": "[nham_dan_so] - Thai 38 tuần 3 ngày đã đủ tháng, không chẩn đoán dọa sinh non."}, {"key": "D", "trap": "[qua_muc] - Chẩn đoán sai thành chuyển dạ thật giai đoạn hoạt động."}, {"key": "E", "trap": "[phan_biet_hep] - Chẩn đoán vỡ tử cung hoàn toàn vô lý."}], "decision": "Phân biệt Chuyển dạ giả (Braxton Hicks) vs Chuyển dạ thật: Chuyển dạ giả -> Cơn co không chu kỳ, cường độ nhẹ, giảm khi đi lại/nghỉ ngơi, KHÔNG làm xóa mở CTC. Chuyển dạ thật -> Cơn co đều đặn tăng dần (3 tăng) + Làm xóa và mở CTC tiến triển.", "explanation": "Theo Giáo trình Bài 25: Phân biệt chuyển dạ thật và chuyển dạ giả (cơn co Braxton Hicks): (1) Chuyển dạ giả: Cơn co xuất hiện không đều đặn, khoảng cách giữa các cơn dài và không thu ngắn lại, cường độ không tăng, thường khu trú ở bụng dưới, giảm hoặc mất đi khi nghỉ ngơi, đi lại hoặc dùng thuốc giảm đau nhẹ; đặc biệt KHÔNG làm thay đổi cổ tử cung (không xóa, không mở); (2) Chuyển dạ thật: Cơn co đều đặn, tần số và cường độ tăng dần, đau từ lưng lan ra bụng, không giảm khi nghỉ ngơi và bắt buộc gây ra sự biến đổi cổ tử cung (xóa và mở tiến triển)."}, {"id": 34, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, con rạ (PARA 2002, tiền sử mổ lấy thai 1 lần), thai 39 tuần 2 ngày, chuyển dạ tại trạm y tế 12 giờ. Khám lâm sàng: Sản phụ đau đớn dữ dội la bới liên tục. Quan sát bụng thấy tử cung bị thắt lại ở đoạn giữa thành hình bầu dục giống như hình quả bầu nivo (dấu hiệu vòng Bandl nhô cao gần rốn), hai dây chằng tròn căng cứng như hai sợi dây đàn dưới da. Cơn co tử cung dồn dập 5 cơn/10 phút, tim thai suy nhịp chậm 90 lần/phút.", "question": "Chẩn đoán biến chứng cấp cứu sản khoa hiện tại và quyết định xử trí tối khẩn?", "options": ["Chẩn đoán Nhau tiền đạo trung tâm; chỉ định nạo hút buồng tử cung bằng chân không tại giường.", "Chẩn đoán Chuyển dạ tiến triển bình thường; cho tiêm Oxytocin tăng co để thúc thai sổ nhanh ngả âm đạo.", "Chẩn đoán Đờ tử cung cấp tính; cho sản phụ uống Misoprostol 800 mcg và cho tập rặn sinh ngay lập tức.", "Chẩn đoán Dọa vỡ tử cung do chuyển dạ tắc nghẽn; ra quyết định tiêm ngay thuốc giảm co tử cung và chuyển mổ lấy thai cấp cứu khẩn cấp.", "Chẩn đoán Viêm ruột thừa cấp; chuyển ngay sang khoa Ngoại tổng hợp mổ cắt ruột thừa."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] - Không phải triệu chứng nhau tiền đạo."}, {"key": "B", "trap": "[bo_chong_chi_dinh] - Tiêm Oxytocin khi dọa vỡ tử cung sẽ gây vỡ tử cung ngay lập tức."}, {"key": "C", "trap": "[qua_xam_lan] - Cho rặn sinh khi dọa vỡ tử cung sẽ gây vỡ tử cung thảm khốc."}, {"key": "E", "trap": "[phan_biet_hep] - Bỏ sót biến chứng sản khoa tử huyệt."}], "decision": "Dấu hiệu dọa vỡ tử cung (Hội chứng Bandl-Frommel): Vòng thắt Bandl nhô cao + Dây chằng tròn căng như dây đàn + Cơn co dồn dập dồn dập + Đau dữ dội -> Xử trí tối khẩn: Tiêm thuốc giảm co (Nifedipine/Atosiban/Salbutamol) + Mổ lấy thai cấp cứu lập tức.", "explanation": "Theo Giáo trình Bài 25: Trong chuyển dạ tắc nghẽn (do bất tương xứng đầu chậu hoặc ngôi bất thường), đoạn dưới tử cung bị kéo dãn quá mức và mỏng dãn tối đa. Ranh giới giữa đoạn trên (co thắt dầy lên) và đoạn dưới (dãn mỏng) tạo thành một đường thắt ngang gọi là Vòng thắt thô đại Bandl. Khi vòng Bandl càng nhô cao về phía rốn kết hợp hai dây chằng tròn bị kéo căng như hai sợi dây đàn (dấu hiệu Frommel) là triệu chứng điển hình của Dọa vỡ tử cung. Xử trí tối khẩn: Kịp thời tiêm thuốc giảm co tử cung liều mạnh để ngưng cơn co và chuyển mổ lấy thai cấp cứu khẩn cấp, chống chỉ định tuyệt đối thuốc tăng co Oxytocin."}, {"id": 35, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 26 tuổi, con so, thai 39 tuần. Sau khi đầu thai nhi đã sổ hoàn toàn ra ngoài và thực hiện thì xoay ngoài (thóp sau xoay về phía đùi trái mẹ), bác sĩ tiến hành đỡ vai cho thai nhi. Bác sĩ dùng hai tay ôm nhẹ hai bên thái dương - cằm của đầu thai nhi và kéo nhẹ đầu xuống dưới để vai trước chui ra dưới khớp vệ. Sau đó kéo nhẹ đầu lên trên để vai sau sổ qua tầng sinh môn. Bác sĩ giải thích cơ chế sổ vai.", "question": "Mô tả chuẩn xác cơ chế sổ vai và các mốc giải phẫu của hai vai khi sổ?", "options": ["Vai trước sổ trước dưới khớp vệ đến điểm bám cơ delta, sau đó vai sau mới sổ qua bờ trước tầng sinh môn.", "Vai sau bắt buộc phải sổ trước qua khớp vệ, sau đó vai trước mới sổ qua mỏm mũi nhọn xương cúc.", "Hai vai phải sổ cùng một lúc song song nhau qua hai lỗ bẹn của mẹ.", "Vai thai nhi tự rơi ra ngoài mà không cần trải qua bất kỳ sự tì chống nào vào xương vệ mẹ.", "Vai trước sổ ra qua lỗ hậu môn của mẹ, sau đó vai sau sổ ra qua khe khớp mu."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_thu_tu] - Nhầm lẫn vai sau sổ trước vai trước."}, {"key": "C", "trap": "[phan_biet_hep] - Hai vai không thể sổ cùng lúc do đường kính lưỡng mỏm vai lớn (12 cm)."}, {"key": "D", "trap": "[nham_dan_so] - Bỏ qua các mốc tì chống giải phẫu."}, {"key": "E", "trap": "[bo_chong_chi_dinh] - Mô tả giải phẫu hoàn toàn sai."}], "decision": "Thì sổ vai ngôi chẩm: Sau khi xoay ngoài -> Kéo nhẹ đầu thai xuống dưới -> Vai trước hạ xuống tì dưới khớp vệ (đến điểm bám cơ delta) -> Kéo nhẹ đầu thai lên trên -> Vai sau lướt qua bờ tầng sinh môn sổ ra ngoài.", "explanation": "Theo Giáo trình Bài 25: Sau khi đầu thai nhi sổ hoàn toàn và xoay ngoài 90 độ, đường kính lưỡng mỏm vai (12 cm) sẽ nằm theo đường kính trước sau của eo dưới. Cơ chế sổ vai diễn ra như sau: Nữ hộ sinh dùng 2 tay ôm đầu thai nhi kéo nhẹ xuống dưới theo đường cong âm đạo để vai trước chui ra dưới khớp vệ cho tới điểm bám cơ delta tì vào bờ dưới khớp vệ. Sau đó, nâng nhẹ đầu thai nhi lên phía trên bụng mẹ để vai sau lướt qua bờ trước tầng sinh môn sổ ra ngoài hoàn toàn. Cuối cùng, hạ nhẹ đầu xuống để vai trước sổ nốt."}, {"id": 36, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 30 tuổi, con so, thai 40 tuần, đang chuyển dạ kéo dài 10 giờ. Trong quá trình chuyển dạ, người nhà cho sản phụ ăn một bát bún thịt lớn lúc cổ tử cung mở 6 cm. 2 giờ sau, sản phụ xuất hiện cơn đau đớn dữ dội và nôn mửa thức ăn còn nguyên chưa tiêu hóa. Do phải chuyển mổ lấy thai cấp cứu vì suy thai, bác sĩ gây mê đặc biệt cảnh báo nguy cơ hội chứng Mendelson (viêm phổi hít do dịch dạ dày axit).", "question": "Cơ chế sinh lý học nào giải thích sự giảm trệ tiêu hóa trong chuyển dạ và nguyên tắc ăn uống an toàn cho sản phụ?", "options": ["Chuyển dạ làm cho ruột non hấp thu toàn bộ thức ăn trong vòng 5 phút; không có bất kỳ rủi ro nào khi gây mê mổ lấy thai.", "Chuyển dạ làm tăng gấp 5 lần tốc độ co bóp dạ dày; nguyên tắc là bắt buộc sản phụ phải ăn đầy đủ thức ăn đặc nồng độ cao.", "Chuyển dạ làm giảm trương lực nhu động dạ dày ruột và kéo dài thời gian làm rỗng dạ dày; nguyên tắc là chỉ nên cho sản phụ uống nước trong hoặc dịch lỏng.", "Chuyển dạ làm dạ dày ngừng tiết dịch axit hoàn toàn; nguyên tắc là cho sản phụ uống dung dịch Axit Chlohydric đậm đặc.", "Chuyển dạ làm dạ dày phình to dãn rộng chèn ép đứt rời động mạch chủ bụng."], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] - Phủ nhận nguy cơ hít sặc dịch dạ dày khi gây mê."}, {"key": "B", "trap": "[sai_tang] - Chuyển dạ làm GIẢM nhu động dạ dày chứ không tăng."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Uống Axit Chlohydric gây bỏng cháy đường tiêu hóa."}, {"key": "E", "trap": "[qua_muc] - Dạ dày không thể làm đứt rời động mạch chủ bụng."}], "decision": "Sinh lý tiêu hóa trong chuyển dạ: Lo âu + Đau đớn + Cơn co tử cung -> Giảm trương lực và nhu động dạ dày -> Thời gian rỗng dạ dày kéo dài rất nhiều -> Thức ăn đặc tồn đọng lâu -> Nguy cơ hít sặc dịch dạ dày axit vào phổi khi gây mê (Hội chứng Mendelson) -> Khuyên chỉ uống dịch trong mỏng.", "explanation": "Theo Giáo trình Bài 25: Trong chuyển dạ, do sự gia tăng hoạt động của hệ thần kinh giao cảm dưới tác động của đau đớn, lo âu và các thuốc giảm đau (nhất là opioid), trương lực co bóp và nhu động của dạ dày - ruột bị giảm rõ rệt. Thời gian làm rỗng dạ dày kéo dài đáng kể, thức ăn đặc có thể tồn đọng trong dạ dày nhiều giờ mà không được tiêu hóa. Nếu sản phụ phải gây mê toàn thân để mổ lấy thai cấp cứu, nguy cơ trào ngược dịch dạ dày giàu axit vào đường hô hấp gây viêm phổi hít hóa chất nghiêm trọng (Hội chứng Mendelson) là rất cao. Do đó, khuyến cáo hiện đại chỉ cho sản phụ uống các dịch lỏng trong suốt (nước lọc, nước đường nhẹ) trong quá trình chuyển dạ."}, {"id": 37, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 27 tuổi, con so, thai 39 tuần 4 ngày, chuyển dạ giai đoạn 1b suốt 5 giờ cổ tử cung dừng lại ở mức 5 cm không tiến triển. Thăm khám bụng: Vùng hạ vị nhô lên một khối cầu mềm, ấn tức, ranh giới rõ trên xương vệ (cầu bàng quang căng to chứa khoảng 600 mL nước tiểu). Ngôi thai bị đẩy cao bập bềnh (-2). Bác sĩ chỉ định thông tiểu thông tháo nước tiểu.", "question": "Cơ chế sinh lý học giải thích vì sao bàng quang căng to cản trở chuyển dạ và kết quả sau khi thông tiểu?", "options": ["Bàng quang căng to hoàn toàn không ảnh hưởng đến sự tiến triển của ngôi thai hay cơn co tử cung.", "Bàng quang căng to giải phóng lượng lớn Oxytocin vào máu làm tử cung co cứng đờ không thể dãn ra được.", "Bàng quang căng to làm đứt dây rốn làm thai nhi bị mất máu cấp tính ngay trong dạ con.", "Thông tiểu làm cho cổ tử cung bị rách phức tạp và gây xuất huyết ồ ạt không cầm được.", "Bàng quang căng to nằm ở tiểu khung chèn ép cơ học trực tiếp cản trở ngôi thai xuống và làm giảm phản xạ co bóp tử cung; sau thông tiểu ngôi thai sẽ lọt xuống dễ dàng."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] - Phủ nhận ảnh hưởng cản trở của bàng quang căng to."}, {"key": "B", "trap": "[sai_tang] - Bàng quang không giải phóng Oxytocin."}, {"key": "C", "trap": "[qua_muc] - Bàng quang căng không làm đứt dây rốn."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Thông tiểu không gây rách cổ tử cung."}], "decision": "Biến đổi hệ tiết niệu trong chuyển dạ: Đầu thai nhi chèn ép cổ bàng quang + Giảm cảm giác buồn tiểu do tê/đau -> Bí tiểu cấp (cầu bàng quang) -> Chèn ép cơ học cản trở ngôi thai lọt xuống + Phản ứng giảm co tử cung -> Bắt buộc thông tiểu hỗ trợ.", "explanation": "Theo Giáo trình Bài 25: Trong chuyển dạ, sự chèn ép của đầu thai nhi vào niệu đạo và cổ bàng quang, kết hợp với sự giảm nhạy cảm cảm giác của bàng quang (do thần kinh bị đè nén hoặc do tác dụng của thuốc tê ĐNMC) rất dễ dẫn đến tình trạng bí tiểu cấp đọng lại 500-800 mL nước tiểu. Bàng quang căng to chứa đầy nước tiểu nằm ở phía trước tiểu khung sẽ trở thành một vật cản cơ học trực tiếp ngăn không cho đầu thai nhi lọt và đi xuống, đồng thời phản xạ từ bàng quang căng có thể làm ức chế cơn co tử cung. Ngay sau khi được đặt ống thông tiểu tháo rỗng nước tiểu, màng bàng quang xẹp xuống, ngôi thai sẽ lập tức tiến triển đi xuống thuận lợi và cơn co tử cung phục hồi hiệu lực."}, {"id": 38, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 25 tuổi, con so, thai 39 tuần 5 ngày, chuyển dạ giai đoạn hoạt động. Nữ hộ sinh ghi biểu đồ chuyển dạ Partograph từ mốc cổ tử cung mở 5 cm lúc 08:00. Đến 12:00 (sau 4 giờ), cổ tử cung vẫn dừng lại ở mức 5 cm và đường diễn tiến độ mở cổ tử cung đã cắt qua và lệch sang bên phải của Đường hành động (Action line). Tim thai 138 lần/phút, cơn co 2 cơn/10 phút.", "question": "Thẩm định ý nghĩa lâm sàng khi đường diễn tiến cắt qua Đường hành động (Action line) và quyết định xử trí?", "options": ["Đường diễn tiến cắt qua Đường hành động báo hiệu thai nhi đã tử vong; chỉ định tiêm thuốc hủy thai khẩn cấp.", "Đường diễn tiến cắt qua Đường hành động cảnh báo sự ngưng trệ chuyển dạ bất thường nguy cơ cao; bắt buộc bác sĩ phải đánh giá lại toàn bộ nguyên nhân và ra quyết định can thiệp ngay bấm ối, Oxytocin hoặc mổ lấy thai.", "Đường diễn tiến cắt qua Đường hành động cho biết sản phụ đã đẻ xong; cần cho xuất viện về nhà lập tức.", "Đường diễn tiến cắt qua Đường hành động là hiện tượng sinh lý hoàn toàn bình thường; tiếp tục nằm theo dõi không can thiệp thêm 12 giờ nữa.", "Đường diễn tiến cắt qua Đường hành động bắt buộc phải cắt chỉ khâu cổ tử cung ngay tại phòng khám."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_muc] - Chẩn đoán thai tử vong quá mức khi tim thai 138 ck/p bình thường."}, {"key": "C", "trap": "[sai_tang] - Tuyên bố đẻ xong là hoàn toàn sai."}, {"key": "D", "trap": "[qua_bao_ton] - Theo dõi tiếp 12 giờ khi đã cắt Action line gây suy thai và vỡ tử cung."}, {"key": "E", "trap": "[bo_chong_chi_dinh] - Sản phụ không có chỉ khâu cổ tử cung."}], "decision": "Ý nghĩa Partograph: (1) Đường báo động (Alert line) -> Báo hiệu bắt đầu tiến triển chậm; (2) Đường hành động (Action line - cách Alert line 4 giờ) -> Báo hiệu chuyển dạ ngưng trệ bệnh lý nghiêm trọng -> Bắt buộc dừng theo dõi bảo tồn, đánh giá nguyên nhân 4P và xử trí ngay (Bấm ối/Tăng co Oxytocin nếu do cơn co yếu, Mổ lấy thai nếu do bất tương xứng đầu chậu/khung chậu hẹp).", "explanation": "Theo Giáo trình Bài 25 và Hướng dẫn WHO: Biểu đồ chuyển dạ (Partograph) là công cụ giám sát tiến trình chuyển dạ giai đoạn hoạt động. Đường báo động (Alert line) bắt đầu từ mốc 5 cm với tốc độ mở chuẩn 1 cm/giờ. Đường hành động (Action line) vẽ song song và cách Đường báo động 4 giờ về bên phải. Khi đường diễn tiến độ mở cổ tử cung cắt qua hoặc nằm sang bên phải của Đường hành động, điều đó khẳng định cuộc chuyển dạ đang bị ngưng trệ bất thường nghiêm trọng. Quyết định chuyên môn bắt buộc là bác sĩ phải tiến hành đánh giá lại toàn diện 4P (cơn co, khung chậu, thai nhi, tâm lý) để ra quyết định can thiệp ngay lập tức (bấm ối, truyền Oxytocin nếu do nhược năng tử cung hoặc chuyển mổ lấy thai nếu do bất tương xứng đầu chậu)."}, {"id": 39, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 22 tuổi, con so, thai 40 tuần, sinh ngả âm đạo thành công sau 12 giờ chuyển dạ. Sau sinh, em bé được theo dõi tại phòng sơ sinh. Thám khám đầu bé ghi nhận đường kính Chẩm - Trán giảm từ 11.5 cm xuống còn 10.5 cm nhờ hiện tượng hai xương đỉnh đè chồng lên nhau ở rãnh khớp dọc. Hình dạng đầu em bé kéo dài ra sau (đầu uốn khuôn). Bác sĩ giải thích hiện tượng thích ứng này.", "question": "Ý nghĩa sinh lý học của hiện tượng uốn khuôn đầu thai nhi (Molding) trong quá trình đi qua khung chậu mẹ?", "options": ["Làm tăng đường kính lưỡng đỉnh lên 15 cm để nong dãn tầng sinh môn mẹ tối đa.", "Làm cho não thai nhi phình to gấp đôi để kích thích các phản xạ thần kinh sơ sinh cất tiếng khóc chào đời.", "Làm phá hủy vĩnh viễn các khớp sọ làm cho hộp sọ em bé bị biến dạng không bao giờ hồi phục lại được.", "Làm giảm các đường kính lọt của đầu thai nhi từ 0.5 đến 1.0 cm, giúp đầu thai nhi dễ dàng thu nhỏ để thích ứng và chui qua các eo khung chậu.", "Làm đứt tất cả các mạch máu trong màng não gây xuất huyết não diện rộng 100% các ca sinh ngả âm đạo."], "correct": 3, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Uốn khuôn làm GIẢM đường kính chứ không làm tăng."}, {"key": "B", "trap": "[sai_tang] - Không làm não phình to."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Xương sọ sẽ trở lại hình dáng bình thường sau vài ngày sinh."}, {"key": "E", "trap": "[qua_muc] - Uốn khuôn sinh lý không gây xuất huyết não 100%."}], "decision": "Sinh lý uốn khuôn đầu thai (Molding): Nhờ các khớp sọ và thóp chưa dính liền -> Áp lực đường sinh làm các xương sọ chồng đè nhẹ lên nhau -> Thu nhỏ các đường kính đầu 0.5 - 1.0 cm -> Giúp thai lọt qua khung chậu dễ dàng -> Đầu sẽ tròn trịa trở lại sau 2-3 ngày.", "explanation": "Theo Giáo trình Bài 25: Hiện tượng uốn khuôn đầu thai nhi (molding) là khả năng tự điều chỉnh hình dạng hộp sọ thai nhi trong quá trình đi qua đường sinh dục mẹ. Nhờ các màng khớp sọ và các thóp (thóp trước, thóp sau) chưa bị xơ hóa, dưới tác động nén ép của cơn co tử cung và khung chậu, các xương sọ (đặc biệt là hai xương đỉnh) có thể chồng đè nhẹ lên nhau. Hiện tượng này giúp thu nhỏ các đường kính lọt của đầu thai nhi từ 0.5 đến 1.0 cm, giúp đầu thai nhi đi qua các eo khung chậu thuận lợi mà không gây tổn thương mô não. Hình dạng đầu uốn khuôn kéo dài sẽ tự hồi phục trở lại tròn trịa bình thường sau sinh từ 24 đến 72 giờ."}, {"id": 40, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, PARA 4004 (sinh nhiều lần), thai 40 tuần ước tính 3.900 g. Bác sĩ đánh giá sản phụ có nguy cơ rất cao bị đờ tử cung gây băng huyết sau sinh ở giai đoạn 3 do cơ tử cung bị căng giãn nhiều lần và thai to. Ngay sau khi em bé sổ ra ngoài an toàn, bác sĩ chỉ định thực hiện phác đồ dự phòng chuẩn mực.", "question": "Quyết định dự phòng băng huyết sau sinh tích cực nhất ngay sau khi thai sổ ở sản phụ này?", "options": ["Tiêm bắp ngay 10 UI Oxytocin trong vòng 1 phút sau sổ thai, thực hiện kéo dây rốn có kiểm soát CCT và xoa đáy tử cung liên tục.", "Chờ 45 phút cho bánh nhau tự bong tự nhiên hoàn toàn không can thiệp bất kỳ thuốc hay thủ thuật nào.", "Tiêm tĩnh mạch khẩn cấp 2 mg Ergometrine ngay khi đầu thai vừa thò ra ngoài tầng sinh môn.", "Chuyển sản phụ sang phòng phẫu thuật mổ mở cắt tử cung toàn phần ngay khi vừa sổ thai xong.", "Cho sản phụ uống ngay 1.000 mL nước đá lạnh để làm co thắt các mạch máu tử cung cấp tính."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_bao_ton] - Chờ đợi thụ động ở sản phụ nguy cơ đờ tử cung cao sẽ gây băng huyết tháo cống."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Ergometrine tiêm khi thai chưa sổ hết gây kẹt thai và co thắt tử cung quá mức."}, {"key": "D", "trap": "[qua_xam_lan] - Cắt tử cung ngay là can thiệp thô bạo quá mức khi chưa có biến chứng chảy máu."}, {"key": "E", "trap": "[nham_dan_so] - Uống nước đá lạnh không có tác dụng dự phòng đờ tử cung."}], "decision": "Sản phụ đa sản + Thai to -> Nguy cơ đờ tử cung cao -> Thực hiện nghiêm ngặt AMTSL: (1) Tiêm bắp 10 UI Oxytocin ngay sau sổ thai (trong 1 phút); (2) Kéo dây rốn có kiểm soát CCT; (3) Xoa đáy tử cung liên tục -> Giảm > 60% nguy cơ BHS.", "explanation": "Theo Giáo trình Bài 25 và Hướng dẫn Bộ Y tế: Sản phụ đa sản (PARA >= 4) và thai to là hai yếu tố nguy cơ hàng đầu gây đờ tử cung sau sinh do các sợi cơ tử cung bị xơ hóa và căng giãn quá mức. Quyết định dự phòng chuẩn mực và hiệu quả nhất là thực hiện ngay quy trình Xử trí tích cực giai đoạn 3 (AMTSL): Tiêm bắp 10 UI Oxytocin ngay trong vòng 1 phút sau khi sổ thai (sau khi khẳng định không còn thai thứ hai), phối hợp kéo dây rốn có kiểm soát (CCT) để tống xuất bánh nhau và xoa đáy tử cung qua thành bụng mỗi 15 phút. Quy trình AMTSL làm giảm trên 60% tỷ lệ băng huyết do đờ tử cung."}, {"id": 41, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, con so, thai 39 tuần 2 ngày. Vào viện vì đau bụng nhẹ từng cơn từ 20 giờ trước. Thăm khám: Cổ tử cung xóa 40%, mở 2 cm, mật độ mềm, tư thế trung gian, ngôi -3. Cơn co tử cung thưa 2 cơn/10 phút, thời gian co 20 giây, cường độ 25 mmHg. Tim thai 140 lần/phút, màng ối còn nguyên. Sản phụ mệt mỏi lo âu vì mất ngủ cả đêm.", "question": "Thiết kế chiến lược quản lý cá thể hóa và thái độ xử trí chuẩn mực cho ca bệnh này?", "options": ["Chẩn đoán Sẩy thai nhiễm khuẩn; cho dùng kháng sinh phổ rộng IV và hút buồng tử cung bằng MVA.", "Chẩn đoán Bất tương xứng đầu chậu; chỉ định chuyển phẫu thuật mổ lấy thai cấp cứu ngay lập tức.", "Chẩn đoán Giai đoạn tiềm tàng kéo dài; cho sản phụ nghỉ ngơi, nâng đỡ thể trạng, dùng thuốc giảm đau/an thần nhẹ để ngủ ngơi và theo dõi tiếp tục.", "Chẩn đoán Vỡ tử cung dưới màng bụng; cho tiêm tĩnh mạch 2.000 mL máu toàn phần khẩn cấp.", "Chẩn đoán Suy thai cấp trong chuyển dạ; bấm ối cấp cứu và tiêm Oxytocin liều tối đa."], "correct": 2, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Thai 39 tuần không chẩn đoán sẩy thai nhiễm khuẩn."}, {"key": "B", "trap": "[qua_muc] - Chỉ định mổ lấy thai vội vàng khi chưa vào giai đoạn hoạt động là sai."}, {"key": "D", "trap": "[nham_dan_so] - Không phải vỡ tử cung."}, {"key": "E", "trap": "[bo_chong_chi_dinh] - Tim thai 140 ck/p hoàn toàn bình thường, không suy thai."}], "decision": "Con so + Chuyển dạ 20h + CTC mở 2 cm -> Giai đoạn 1a (tiềm tàng) kéo dài (> 20h ở con so, > 14h ở con rạ) -> Mẹ mệt mỏi nhưng tim thai & sinh hiệu tốt -> Phác đồ chuẩn: Nâng đỡ thể trạng + An thần/Giảm đau nhẹ (Morphine/Pethidine/An thần) cho sản phụ ngủ nghỉ -> Đa số sẽ tự chuyển sang giai đoạn hoạt động sau khi dậy.", "explanation": "Theo Giáo trình Bài 25 và ACOG: Giai đoạn tiềm tàng kéo dài khi vượt quá 20 giờ ở người con so (hoặc > 14 giờ ở người con rạ). Nguyên nhân thường do cơn co tử cung giảm năng, cổ tử cung chưa chín muồi hoàn toàn hoặc do sản phụ lo âu mất ngủ. Khi tim thai và sinh hiệu mẹ hoàn toàn bình thường, màng ối còn nguyên, chiến lược xử trí thiết kế chuẩn mực là: Nâng đỡ thể trạng (truyền dịch đường lỏng), cho sản phụ dùng thuốc an thần/giảm đau nhẹ để có một giấc ngủ từ 3-4 giờ. Sau khi ngủ dậy, khoảng 85% sản phụ sẽ xuất hiện cơn co hiệu quả và chuyển sang giai đoạn hoạt động một cách tự nhiên mà không cần mổ lấy thai hay can thiệp thô bạo."}, {"id": 42, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con so, thai 40 tuần, đang truyền Oxytocin tăng co. Bác sĩ phát hiện trên Monitoring cơn co tử cung dồn dập 6 cơn/10 phút, thời gian co 65 giây, trương lực cơ bản 22 mmHg (cơn co cường năng). Đồng thời tim thai xuất hiện các nhịp chậm muộn (Late decelerations) liên tiếp xuống 100 lần/phút. Bác sĩ lập tức kích hoạt quy trình hồi sức thai tại chỗ.", "question": "Thiết kế trình tự các bước cấp cứu hồi sức thai tại chỗ ngay lập tức trong tình huống này?", "options": ["Bước 1: Tiêm Oxytocin vào cơ tử cung; Bước 2: Khâu kín cổ tử cung lại; Bước 3: Chuyển sang khoa Ngoại thần kinh.", "Bước 1: Tăng gấp đôi tốc độ truyền Oxytocin; Bước 2: Cho sản phụ rặn sinh ngay; Bước 3: Tiêm thuốc co hồi tử cung Ergometrine.", "Bước 1: Bấm ối ngay lập tức; Bước 2: Cho sản phụ uống nước đá; Bước 3: Cho sản phụ đi lại quanh phòng sinh.", "Bước 1: Tiêm thuốc mê tĩnh mạch; Bước 2: Đặt nội khí quản cho mẹ; Bước 3: Chờ 2 giờ xem tim thai có tự phục hồi không.", "Bước 1: Ngưng ngay dây truyền Oxytocin; Bước 2: Cho mẹ nằm nghiêng trái; Bước 3: Thở oxy qua mask 6-8 lít/phút và truyền dịch nhanh; Bước 4: Tiêm thuốc g "id": 44, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001 (tiền sử mổ lấy thai 1 lần), thai 37 tuần 2 ngày, chẩn đoán Nhau tiền đạo trung tâm hoàn toàn từ quý 2. Đêm nay sản phụ bắt đầu xuất hiện cơn co chuyển dạ 3 cơn/10 phút và âm đạo chảy máu đỏ tươi ồ ạt khoảng 300 mL. Bác sĩ trực cấp cứu lập tức kích hoạt quy trình phẫu thuật.", "question": "Quy trình xử trí phẫu thuật cấp cứu tối khẩn cho sản phụ này?", "options": ["Cho sản phụ tập đi lại nhẹ nhàng quanh phòng khám để đánh giá mức độ chảy máu âm đạo.", "Cho sản phụ uống thuốc giảm co Nifedipine và nằm theo dõi tại phòng sinh chờ cổ tử cung mở trọn rồi đẻ ngả âm đạo.", "Bấm ối ngay lập tức tại phòng cấp cứu để đầu thai nhi chèn vào bánh nhau cầm máu.", "Chuyển ngay sản phụ sang phòng mổ để Mổ lấy thai cấp cứu tối khẩn, lập 2 đường truyền tĩnh mạch lớn, dự trù máu và tuyệt đối không khám âm đạo bằng tay.", "Tiêm Oxytocin liều cao vào tĩnh mạch để kích thích bánh nhau bóc tách nhanh ra ngoài."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] - Cho đi lại khi đang chảy máu ồ ạt là hành vi sai lầm nghiêm trọng."}, {"key": "B", "trap": "[qua_bao_ton] - Theo dõi đẻ ngả âm đạo khi nhau tiền đạo trung tâm sẽ gây tử vong mẹ và thai do chảy máu tháo cống."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Bấm ối xuyên qua bánh nhau trung tâm gây tử vong thai ngay lập tức."}, {"key": "E", "trap": "[qua_xam_lan] - Tiêm Oxytocin làm bóc tách nhau gây mất máu cấp thảm khốc."}], "decision": "Nhau tiền đạo trung tâm hoàn toàn + Cơn co chuyển dạ + Ra máu đỏ tươi 300 ml -> Bắt buộc MỔ LẤY THAI CẤP CỨU TỐI KHẨN -> Tuyệt đối cấm khám âm đạo bằng tay -> Lập 2 đường truyền IV lớn (16G-18G) + Chuẩn bị 2-4 đơn vị khối hồng cầu sẵn sàng.", "explanation": "Theo Giáo trình Bài 25 và Bài 35: Nhau tiền đạo trung tâm hoàn toàn (bánh nhau che lấp hoàn toàn lỗ trong cổ tử cung) khi bắt đầu có cơn co chuyển dạ sẽ làm đoạn dưới co giãn và cổ tử cung bắt đầu xóa mở, dẫn đến sự bóc tách xé rách các xoang mạch máu lớn của bánh nhau gây chảy máu đỏ tươi ồ ạt tháo cống. Đây là tình huống cấp cứu sản khoa tối khẩn. Quy trình thiết kế bắt buộc: Chuyển mổ lấy thai cấp cứu ngay lập tức, tuyệt đối cấm khám âm đạo bằng tay tại phòng khám (vì ngón tay có thể chọc bóc tách thêm bánh nhau gây chảy máu dữ dội không cầm được), thiết lập 2 đường truyền tĩnh mạch ngoại vi kim lớn (16G/18G) để hồi sức thể tích và dự trù máu đồng nhóm cấp cứu."}, {"id": 45, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con so, thai 39 tuần 1 ngày, ngôi chẩm cao bập bềnh. Ngay sau khi vỡ ối tự nhiên, bác sĩ khám âm đạo phát hiện cổ tử cung mở 4 cm, một quai dây rốn thò ra ngoài cổ tử cung vào trong âm đạo, đập nẩy theo nhịp tim thai 130 lần/phút. Tim thai bắt đầu có dấu hiệu suy nhịp chậm 90 lần/phút trong cơn co.", "question": "Thiết kế quy trình cấp cứu tối khẩn bảo vệ tính mạng thai nhi trong tình huống sa dây rốn?", "options": ["Quy trình: 1 Dùng ngón tay trong âm đạo đẩy ngôi thai lên cao giải o ép dây rốn; 2 Cho mẹ nằm tư thế Trendelenburg chân cao đầu thấp; 3 Chuyển khẩn cấp sang phòng mổ Mổ lấy thai cấp cứu tối khẩn trong khi tay vẫn duy trì đẩy ngôi thai.", "Quy trình: 1 Đẩy dây rốn nhét ngược vào buồng tử cung; 2 Cho sản phụ đi lại để dây rốn tự co lên; 3 Theo dõi đẻ ngả âm đạo tiếp tục 12 giờ.", "Quy trình: 1 Tiêm Oxytocin liều cao; 2 Dùng Forceps kéo thai ngay lập tức khi cổ tử cung mới mở 4 cm; 3 Cho sản phụ rặn sinh.", "Quy trình: 1 Cắt đứt quai dây rốn sa ra ngoài; 2 Khâu đóng kín cổ tử cung lại; 3 Cho sản phụ xuất viện về nhà.", "Quy trình: 1 Cho sản phụ uống nước lạnh; 2 Chờ 4 giờ cho cổ tử cung mở trọn; 3 Bấm ối lại lần hai."], "correct": 0, "traps": [{"key": "B", "trap": "[bo_chong_chi_dinh] - Nhét dây rốn vào buồng tử cung là thất bại và làm tăng nguy cơ tắc mạch dây rốn."}, {"key": "C", "trap": "[qua_xam_lan] - Forceps chống chỉ định khi cổ tử cung mới mở 4 cm."}, {"key": "D", "trap": "[nham_dan_so] - Cắt dây rốn khi thai chưa sổ làm thai tử vong lập tức."}, {"key": "E", "trap": "[qua_bao_ton] - Chờ đợi 4 giờ thai sẽ chết ngạt do thiếu máu nuôi hoàn toàn."}], "decision": "Sa dây rốn còn đập + CTC mở 4 cm (chưa mở trọn) -> Tình huống cấp cứu tối khẩn sản khoa -> Quy trình 3 bước: (1) Đưa tay vào âm đạo đẩy đầu thai nhi lên cao giải chèn ép dây rốn; (2) Nằm tư thế Trendelenburg (hoặc mông cao/quỳ gối ngực); (3) Mổ lấy thai cấp cứu tối khẩn (Giữ nguyên tay đẩy ngôi thai đến khi bác sĩ phẫu thuật lấy được em bé ra).", "explanation": "Theo Giáo trình Bài 25 và Bài 37: Sa dây rốn là cấp cứu sản khoa tối khẩn do dây rốn bị chèn ép giữa ngôi thai và khung chậu xương, làm tắc nghẽn tuần hoàn tử cung - nhau gây chết thai nhanh chóng trong vài phút. Quy trình cấp cứu chuẩn mực gồm: (1) Bác sĩ/Nữ hộ sinh đưa ngay 2 ngón tay vào âm đạo, đẩy đầu thai nhi lên cao khỏi khung chậu để giải phóng chèn ép lên quai dây rốn; (2) Cho sản phụ nằm tư thế Trendelenburg (chân cao đầu thấp) hoặc tư thế gối - ngực để trọng lực giúp ngôi thai lùi ra xa eo trên; (3) Lập tức chuyển khẩn cấp sang phòng mổ để Mổ lấy thai cấp cứu tối khẩn. Bác sĩ đứng đẩy ngôi thai bắt buộc phải giữ nguyên bàn tay trong âm đạo đẩy đầu thai nhi liên tục cho đến khi bác sĩ phẫu thuật rạch cơ tử cung lấy em bé ra an toàn."}, {"id": 46, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, con rạ, thai 40 tuần, vừa sổ nhau sau cuộc sinh ngả âm đạo. 10 phút sau sổ nhau, âm đạo chảy máu đỏ tươi xối xả khoảng 600 mL. Thăm khám: Tử cung nhão nhão như túi đẻ không co hồi thành khối an toàn, đáy tử cung nhô cao trên rốn. Mạch vọt lên 115 lần/phút, HA tụt xuống 85/50 mmHg. Bác sĩ chẩn đoán Băng huyết sau sinh do đờ tử cung.", "question": "Xây dựng phác đồ xử trí bậc thang điều trị nội khoa và thủ thuật cầm máu đờ tử cung cấp tính?", "options": ["Bậc 1: Bóc nhau lại lần thứ hai; Bậc 2: Tiêm thuốc chống đông Heparin; Bậc 3: Chờ 24 giờ sau mới xử trí.", "Bậc 1: Chờ 2 giờ xem tử cung có tự co hồi lại không; Bậc 2: Cho sản phụ uống nước chanh đường; Bậc 3: Chuyển sang khoa Ngoại thần kinh.", "Bậc 1: Xoa đáy tử cung liên tục + Tiêm bắp Oxytocin 10 UI phối hợp Ergometrine 0.2 mg; Bậc 2: Đặt Misoprostol 800 mcg vào trực tràng + Đặt bóng chèn Bakri balloon 300-500 mL vào buồng tử cung; Bậc 3: Nếu thất bại chuyển mổ khâu B-Lynch hoặc cắt tử cung.", "Bậc 1: Tiêm giảm co Nifedipine; Bậc 2: Đặt vòng tránh thai IUD; Bậc 3: Cho sản phụ đi lại nhẹ nhàng.", "Bậc 1: Tiêm ngay thuốc mê thiopental; Bậc 2: Khâu đóng kín âm đạo lại; Bậc 3: Cho xuất viện về nhà nằm nghỉ ngơi."], "correct": 2, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - Dùng Heparin chống đông làm máu chảy xối xả tử vong ngay."}, {"key": "B", "trap": "[qua_bao_ton] - Chờ đợi 2 giờ khi băng huyết do đờ tử cung sẽ tử vong do mất máu tháo cống."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Dùng thuốc giảm co Nifedipine khi đờ tử cung là sai lầm chết người."}, {"key": "E", "trap": "[nham_dan_so] - Khâu đóng âm đạo không cầm được máu trong tử cung mà gây tụ máu âm đạo dữ dội."}], "decision": "Băng huyết sau sinh do đờ tử cung -> Xử trí bậc thang khẩn cấp: Bậc 1 (Xoa đáy tử cung bằng 2 tay + Oxytocin 10-20 UI IV/IM + Ergometrine 0.2mg IM) -> Bậc 2 (Misoprostol 800mcg ngậm/trực tràng + Đặt bóng chèn Bakri 300-500ml) -> Bậc 3 (Phẫu thuật khâu mũi B-Lynch / Thắt ĐM tử cung / Cắt tử cung).", "explanation": "Theo Giáo trình Bài 25 và Bài 33: Đờ tử cung là nguyên nhân hàng đầu gây băng huyết sau sinh (chiếm > 80%). Phác đồ cấp cứu bậc thang thiết kế chuẩn mực bao gồm: Bậc 1: Xoa đáy tử cung liên tục qua thành bụng kết hợp dùng thuốc co hồi tử cung ngay lập tức (Oxytocin 10 UI tiêm bắp/truyền tĩnh mạch phối hợp Ergometrine 0.2 mg tiêm bắp); Bậc 2: Nếu chưa cầm máu, tăng cường Misoprostol 800 mcg đặt trực tràng/ngậm dưới lưỡi, phối hợp tiêm Tranexamic acid 1g IV và thực hiện thủ thuật Đặt bóng chèn Bakri (Bakri balloon tamponade) bơm 300-500 mL nước muối sinh lý vào buồng tử cung ép diện bám cầm máu; Bậc 3: Nếu điều trị nội khoa và chèn bóng thất bại (chảy máu tiến triển), chuyển phẫu thuật khâu mũi B-Lynch, thắt động mạch tử cung 2 bên hoặc cắt tử cung bán phần/toàn phần cấp cứu để cứu sống sản phụ."}, {"id": 47, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, con so, vừa trải qua cuộc sinh ngả âm đạo thường an toàn, sổ nhau hoàn toàn, khâu phục hồi tầng sinh môn mộc tốt. Bác sĩ thiết kế quy trình theo dõi sản phụ tại phòng sinh trong 2 giờ đầu sau sinh (được coi là giờ thứ 4 của cuộc chuyển dạ) để phòng ngừa và phát hiện sớm các tai biến sản khoa tử huyệt.", "question": "Trình tự các thông số bắt buộc phải theo dõi và tần suất kiểm tra trong 2 giờ đầu sau sinh?", "options": ["Theo dõi 5 phút một lần: Thực hiện chọc dò tủy sống và chụp CT-scanner toàn thân.", "Theo dõi 12 giờ một lần: Chỉ cần kiểm tra nhiệt độ của sản phụ và cho sản phụ uống nước đá lạnh.", "Theo dõi 24 giờ một lần: Chỉ cần kiểm tra xem sản phụ đã đi lại được chưa và cho xuất viện ngay.", "Không cần theo dõi bất kỳ thông số nào vì sản phụ đã đẻ xong an toàn tuyệt đối 100%.", "Theo dõi 15 phút/lần trong giờ đầu và 30 phút/lần trong giờ thứ hai: Mạch, huyết áp, sự co hồi tử cung khối an toàn, lượng máu chảy từ âm đạo và tình trạng cầu bàng quang."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_xam_lan] - Chụp CT toàn thân và chọc tủy sống hoàn toàn vô lý."}, {"key": "B", "trap": "[qua_bao_ton] - Theo dõi 12 giờ/lần là bỏ sót BHS tử vong."}, {"key": "C", "trap": "[qua_bao_ton] - Theo dõi 24 giờ/lần là không đúng quy chuẩn."}, {"key": "D", "trap": "[nham_dan_so] - Chủ quan bỏ theo dõi là nguyên nhân tử vong mẹ hàng đầu."}], "decision": "Quy trình giám sát 2 giờ đầu sau sinh (Thời kỳ nguy hiểm nhất của BHS): Giờ thứ nhất -> Theo dõi 15 phút/lần (4 lần); Giờ thứ hai -> Theo dõi 30 phút/lần (2 lần). Nội dung giám sát 5 yếu tố: (1) Mạch, HA; (2) Sự co hồi tử cung (khối an toàn); (3) Lượng máu ra âm đạo; (4) Cầu bàng quang; (5) Toàn trạng sản phụ.", "explanation": "Theo Giáo trình Bài 25 và Quy chuẩn Quốc gia: 2 giờ đầu sau sinh (còn gọi là giờ thứ 4 của cuộc chuyển dạ) là khoảng thời gian nguy hiểm nhất xảy ra biến chứng Băng huyết sau sinh do đờ tử cung hoặc rách đường sinh dục. Quy trình giám sát thiết kế bắt buộc: Giờ đầu tiên theo dõi 15 phút/lần (4 lần); Giờ thứ hai theo dõi 30 phút/lần (2 lần). Các thông số bắt buộc kiểm tra mỗi lần: (1) Sinh hiệu (Mạch, Huyết áp); (2) Sự co hồi tử cung (phát hiện tử cung nhão hoặc nhô cao do tích máu); (3) Lượng máu ra âm đạo (đỏ tươi hay đẫm băng); (4) Cầu bàng quang (bí tiểu gây cản trở tử cung co hồi); (5) Cảm giác đau, mệt mỏi của sản phụ."}, {"id": 48, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001 (tiền sử mổ lấy thai đường ngang đoạn dưới 2 năm trước do ngôi ngược). Hiện tại thai 38 tuần 4 ngày, ngôi chẩm cúi tốt, ước tính thai 3.100 g, khám khung chậu mẹ rộng rãi bình thường, vết mổ cũ không ấn đau. Sản phụ bày tỏ nguyện vọng muốn thử thách sinh ngả âm đạo (TOLAC/VBAC). Bác sĩ xây dựng kế hoạch quản lý và tư vấn an toàn.", "question": "Thiết kế kế hoạch quản lý và điều kiện cho phép thử thách sinh ngả âm đạo sau mổ lấy thai (TOLAC) chuẩn xác?", "options": ["Cho tiêm Oxytocin liều tối đa ngay từ khi cổ tử cung chưa xóa để rút ngắn thời gian chuyển dạ xuống 1 giờ.", "Điều kiện TOLAC: Sẹo mổ cũ 1 lần đường ngang đoạn dưới, khung chậu bình thường, thai nhỏ < 3.500 g, không có hẹp khung chậu hay nguy cơ vỡ tử cung; kế hoạch: Theo dõi sát chuyển dạ tự nhiên tại cơ sở có khả năng mổ cấp cứu.", "Cho sản phụ dùng thuốc khởi phát chuyển dạ Misoprostol liều cao 400 mcg ngậm dưới lưỡi để thúc cổ tử cung mở nhanh.", "Cho sản phụ về nhà tự rặn sinh tại nhà với sự hỗ trợ của cô đỡ thôn bản để giảm chi phí y tế.", "Tất cả sản phụ có sẹo mổ cũ mổ lấy thai 100% bắt buộc phải mổ lấy thai chủ động ở tuần 37 tuyệt đối không được thử thách sinh ngả âm đạo."], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - Truyền Oxytocin liều cao trên vết mổ cũ gây vỡ tử cung."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Misoprostol chống chỉ định tuyệt đối trên tử cung có sẹo mổ cũ vì nguy cơ vỡ tử cung
