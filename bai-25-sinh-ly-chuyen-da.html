        btn.className = `w-full text-left p-3 rounded-xl border text-xs font-medium flex items-start gap-2.5 transition-all active:scale-[0.99] min-h-[48px] `;
        
        let borderClass = "border-slate-200 bg-white hover:border-teal-300 hover:bg-teal-50/30 text-slate-700";
        let letterBadge = "bg-slate-100 text-slate-700 border-slate-200";

        if (isAnswered) {
          if (idx === q.correct) {
            borderClass = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-semibold ring-1 ring-emerald-500";
            letterBadge = "bg-emerald-600 text-white border-emerald-600";
          } else if (idx === userAnswer) {
            borderClass = "border-rose-500 bg-rose-50/80 text-rose-900 font-semibold ring-1 ring-rose-500";
            letterBadge = "bg-rose-600 text-white border-rose-600";
          } else {
            borderClass = "border-slate-200 bg-slate-50/50 text-slate-400 opacity-60";
            letterBadge = "bg-slate-100 text-slate-400 border-slate-200";
          }
        }

        btn.className += borderClass;
        btn.onclick = () => selectOption(idx);
        btn.disabled = isAnswered;

        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md border text-[11px] font-bold shrink-0 mt-0.5 ${letterBadge}">
            ${letters[idx]}
          </span>
          <span class="leading-relaxed flex-1">${optText}</span>
        `;
        container.appendChild(btn);
      });

      const expBox = document.getElementById("explanation-box");
      if (isAnswered) {
        expBox.classList.remove("hidden");
        document.getElementById("exp-text").textContent = q.explanation;
        document.getElementById("decision-text").textContent = q.decision;

        const trapsList = document.getElementById("traps-list");
        trapsList.innerHTML = "";
        q.traps.forEach(t => {
          const item = document.createElement("div");
          item.className = "p-2 rounded bg-slate-50 border border-slate-100 flex items-start gap-1.5 text-slate-600";
          item.innerHTML = `<span class="font-bold text-rose-600 shrink-0">[Lựa chọn ${t.key}]:</span> <span>${t.trap}</span>`;
          trapsList.appendChild(item);
        });

        document.getElementById("personal-note").value = state.notes[q.id] || "";
      } else {
        expBox.classList.add("hidden");
      }

      document.getElementById("prev-btn").disabled = (currentFilteredPos <= 0);
      document.getElementById("next-btn").disabled = (currentFilteredPos >= filtered.length - 1);
    }

    function selectOption(idx) {
      const q = QUESTIONS[state.currentIndex];
      if (state.answers[q.id] !== undefined) return;

      state.answers[q.id] = idx;
      saveState();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function navigate(step) {
      const filtered = getFilteredList();
      const currentPos = filtered.findIndex(item => item.idx === state.currentIndex);
      const newPos = currentPos + step;
      
      if (newPos >= 0 && newPos < filtered.length) {
        state.currentIndex = filtered[newPos].idx;
        saveState();
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      state.currentIndex = idx;
      saveState();
      renderCurrentQuestion();
      toggleGridModal(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleBookmark() {
      const q = QUESTIONS[state.currentIndex];
      const pos = state.bookmarks.indexOf(q.id);
      if (pos > -1) state.bookmarks.splice(pos, 1);
      else state.bookmarks.push(q.id);
      saveState();
      renderCurrentQuestion();
      renderGridCells();
    }

    function saveCurrentNote() {
      const q = QUESTIONS[state.currentIndex];
      state.notes[q.id] = document.getElementById("personal-note").value;
      saveState();
    }

    function updateProgress() {
      let correct = 0, wrong = 0;
      Object.entries(state.answers).forEach(([qId, ans]) => {
        const q = QUESTIONS.find(item => item.id === parseInt(qId));
        if (q) {
          if (ans === q.correct) correct++;
          else wrong++;
        }
      });
      const total = QUESTIONS.length;
      document.getElementById("progress-correct").style.width = `${(correct / total) * 100}%`;
      document.getElementById("progress-wrong").style.width = `${(wrong / total) * 100}%`;
    }

    function renderGridCells() {
      const grid = document.getElementById("grid-cells");
      grid.innerHTML = "";
      const filtered = getFilteredList();

      QUESTIONS.forEach((q, idx) => {
        const isIncluded = filtered.some(item => item.idx === idx);
        if (!isIncluded) return;

        const cell = document.createElement("button");
        cell.className = `h-8 rounded text-[11px] font-bold flex flex-col items-center justify-center relative transition-all border `;
        
        const ans = state.answers[q.id];
        const isCurrent = (idx === state.currentIndex);

        if (ans !== undefined) {
          cell.className += (ans === q.correct) ? "bg-emerald-500 text-white border-emerald-600" : "bg-rose-500 text-white border-rose-600";
        } else {
          cell.className += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
        }

        if (isCurrent) cell.className += " ring-2 ring-teal-600 ring-offset-1";
        cell.textContent = q.id;

        if (state.bookmarks.includes(q.id)) {
          const starBadge = document.createElement("span");
          starBadge.className = "absolute -top-1 -right-1 text-[8px] text-amber-400 font-extrabold";
          starBadge.textContent = "★";
          cell.appendChild(starBadge);
        }

        cell.onclick = () => jumpToQuestion(idx);
        grid.appendChild(cell);
      });
    }

    function toggleGridModal(show) {
      const modal = document.getElementById("grid-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderGridCells();
      } else {
        modal.classList.add("hidden");
      }
    }

    let touchStartX = 0, touchEndX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    document.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, false);

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) navigate(1);
        else navigate(-1);
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
