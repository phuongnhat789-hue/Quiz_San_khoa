  <script>
    // DỮ LIỆU ĐẦY ĐỦ 50 CA LÂM SÀNG BÀI 25 ĐÃ ĐƯỢC RÀ SOÁT VÀ SHUFFLE ĐỀU
    const QUESTIONS = [{"id": 1, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 28 tuổi, con so, thai 39 tuần 2 ngày, vào viện vì xuất hiện các cơn co tử cung đều đặn kèm ra nhầy hồng âm đạo. Thăm khám ghi nhận tử cung có 3 cơn co trong 10 phút, cường độ 45 mmHg. Cổ tử cung xóa 80%, mở 3 cm, đầu ối dẹt. Định lượng hormone huyết thanh ghi nhận tỷ lệ Estrogen trên Progesterone tăng vọt đáng kể so với giai đoạn giữa thai kỳ. Bác sĩ giải thích cho sinh viên y khoa về cơ chế phân tử của hiện tượng này.", "question": "Cơ chế sinh học cốt lõi nào giải thích vai trò của sự gia tăng tỷ lệ Estrogen so với Progesterone trong việc khởi phát cơn co chuyển dạ?", "options": ["Ức chế sự tổng hợp Prostaglandin F2 alpha, làm giảm nhạy cảm của tế bào cơ tử cung với ion Canxi ngoại bào.", "Kích thích tuyến yên mẹ giải phóng Dopamine, giảm đáp ứng co bóp cơ tử cung và làm dầy thêm lớp niêm mạc cổ tử cung.", "Tăng tổng hợp Prostaglandin, tăng mật độ thụ thể Oxytocin và tăng hình thành cầu liên bào gap junctions giữa các tế bào cơ tử cung.", "Làm tăng tổng hợp Progesterone nội sinh, duy trì trạng thái trơ của cơ tử cung và làm cứng cổ tử cung.", "Kích thích tế bào nguyên bào nuôi tăng tiết hCG, làm giảm tổng hợp các protein liên kết khe connexin 43."], "correct": 2, "traps": [{"key": "A", "trap": "[sai_tang] - Estrogen kích thích tổng hợp PGF2a chứ không ức chế."}, {"key": "B", "trap": "[bo_chong_chi_dinh] - Estrogen không làm giảm đáp ứng co bóp hay kích thích Dopamine."}, {"key": "D", "trap": "[phan_biet_hep] - Progesterone mới có tác dụng duy trì trạng thái trơ cơ tử cung."}, {"key": "E", "trap": "[nham_dan_so] - Estrogen làm tăng connexin 43 chứ không giảm."}], "decision": "Tỷ lệ Estrogen/Progesterone tăng vọt cuối thai kỳ -> Kích thích tổng hợp Prostaglandin + Tăng mật độ thụ thể Oxytocin + Tăng gap junctions connexin 43 -> Khởi phát cơn co chuyển dạ.", "explanation": "Theo Giáo trình Bài 25: Trong suốt thai kỳ, Progesterone giữ vai trò duy trì trạng thái trơ của tử cung. Cuối thai kỳ, sự gia tăng tỷ lệ Estrogen/Progesterone làm đảo ngược hiệu ứng này. Estrogen kích thích sự tổng hợp Prostaglandin F2 alpha và E2, làm tăng mật độ thụ thể Oxytocin trên màng tế bào cơ tử cung, đồng thời tăng tổng hợp connexin 43 tạo nên các cầu liên bào (gap junctions) giúp lan truyền điện thế hoạt động giữa các tế bào cơ tử cung."}, {"id": 2, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, mang thai lần thứ hai, thai 40 tuần 1 ngày, xuất hiện cơn co chuyển dạ tự nhiên. Xét nghiệm sinh hóa ghi nhận nồng độ CRH từ bánh nhau và Cortisol trong máu dây rốn thai nhi tăng cao rõ rệt. Bác sĩ nội trú thảo luận về vai trò tín hiệu từ thai nhi trong việc châm ngòi cho toàn bộ chuỗi phản ứng sinh hóa khởi phát cuộc chuyển dạ.", "question": "Chuỗi sự kiện nội tiết nào xuất phát từ thai nhi đóng vai trò tín hiệu quyết định khởi phát chuyển dạ?", "options": ["Thượng thận thai nhi tăng tiết Adrenalin cấp tính, gây co thắt mạch máu dây rốn, kích thích giải phóng Oxytocin từ thùy sau tuyến yên thai.", "Tuyến thượng thận thai nhi tăng tiết Aldosterone, làm giữ nước và muối trong cơ thể mẹ, kích thích giải phóng Relaxin từ hoàng thể.", "Tuyến yên thai nhi ngừng sản xuất ACTH, làm suy giảm nồng độ Cortisol, kích thích bánh nhau tăng bài tiết Progesterone tự do.", "Bánh nhau ngưng tổng hợp CRH, làm giảm nồng độ Estriol trong máu mẹ, kích thích tuyến yên mẹ tăng tiết Prolactin bộc phát.", "Hạ đồi thai nhi tăng tiết CRH, kích thích tuyến yên thai tiết ACTH, kích thích thượng thận thai tiết Cortisol và DHEA-S, thúc đẩy tăng sản xuất Estrogen tại bánh nhau."], "correct": 4, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Adrenalin không phải hormone khởi phát chuỗi sinh hóa chuyển dạ."}, {"key": "B", "trap": "[nham_dan_so] - Aldosterone không đóng vai trò tín hiệu khởi phát chuyển dạ."}, {"key": "C", "trap": "[sai_tang] - Trục HPA thai nhi tăng hoạt động chứ không ngừng sản xuất ACTH."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - CRH bánh nhau tăng vọt cuối thai kỳ chứ không ngưng."}], "decision": "Tín hiệu thai nhi: CRH hạ đồi thai -> ACTH tuyến yên thai -> Cortisol & DHEA-S thượng thận thai -> Bánh nhau biến DHEA-S thành Estrogen -> Khởi phát chuyển dạ.", "explanation": "Theo Giáo trình Bài 25: Trục hạ đồi - tuyến yên - thượng thận (HPA) của thai nhi đóng vai trò 'đồng hồ sinh học' khởi phát chuyển dạ. CRH từ hạ đồi thai nhi và bánh nhau kích thích tuyến yên thai nhi tiết ACTH, từ đó kích thích vỏ thượng thận thai nhi sản xuất Cortisol (giúp trưởng thành phổi) và DHEA-S. DHEA-S được bánh nhau chuyển hóa thành Estrogen (đặc biệt là Estriol), làm thay đổi tỷ lệ Estrogen/Progesterone và kích hoạt chuyển dạ."}, {"id": 3, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 25 tuổi, con so, thai 40 tuần, cổ tử cung chưa chín muồi với chỉ số Bishop 3 điểm (chặt, hướng sau, xóa 30%, mở 1 cm, ngôi -3). Bác sĩ chỉ định sử dụng Prostaglandin E2 (Dinoprostone) đặt âm đạo để làm chín muồi cổ tử cung trước khi khởi phát chuyển dạ. Học viên đặt câu hỏi về sự khác biệt tác động sinh học giữa Prostaglandin E2 và Prostaglandin F2 alpha.", "question": "Phân tích tác động sinh học khác biệt chính giữa Prostaglandin E2 và Prostaglandin F2 alpha trong quá trình chuyển dạ?", "options": ["Prostaglandin E2 ức chế hoàn toàn cơn co tử cung, trong khi Prostaglandin F2 alpha chỉ có tác dụng duy trì trương lực cơ bản của tử cung ở mức dưới 5 mmHg.", "Prostaglandin E2 tác động chủ yếu làm mềm, xóa mở cổ tử cung và làm tan collagen, trong khi Prostaglandin F2 alpha kích thích mạnh mẽ sự co bóp tế bào cơ tử cung.", "Prostaglandin E2 làm cứng cổ tử cung để ngăn sẩy thai, trong khi Prostaglandin F2 alpha kích thích tuyến yên bài tiết Prolactin gây tiết sữa sớm.", "Prostaglandin E2 và F2 alpha có tác dụng hoàn toàn trái ngược nhau, một chất gây co thắt tử cung và một chất gây giãn toàn bộ cơ tử cung tuyệt đối.", "Prostaglandin E2 chỉ có tác dụng trên màng thai, trong khi Prostaglandin F2 alpha bị phân hủy hoàn toàn bởi enzym tại phổi nên không có tác dụng lâm sàng."], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] - PGE2 không ức chế cơn co tử cung mà cũng gây co bóp nhẹ."}, {"key": "C", "trap": "[sai_tang] - PGE2 làm mềm CTC chứ không làm cứng CTC."}, {"key": "D", "trap": "[phan_biet_hep] - Hai chất không đối kháng tuyệt đối mà phối hợp hiệp đồng."}, {"key": "E", "trap": "[nham_dan_so] - Cả hai đều có vai trò lâm sàng quan trọng trong sản khoa."}], "decision": "PGE2 -> Phân hủy mô liên kết collagen, làm mềm xóa mở CTC -> Chín muồi CTC. PGF2a -> Kích thích trực tiếp các sợi cơ tử cung co bóp -> Khởi phát và duy trì cơn co.", "explanation": "Theo Giáo trình Bài 25: Prostaglandin (PG) là mắt xích quan trọng trong chuyển dạ. PGE2 có tác dụng chủ yếu tại cổ tử cung, kích thích enzym collagenase phân hủy mô liên kết, tăng cấu trúc glycosaminoglycan, làm cổ tử cung ngấm nước, mềm ra và xóa mở. PGF2 alpha được sản xuất nhiều từ màng rụng và cơ tử cung, có tác dụng kích thích trực tiếp sự co thắt của các sợi cơ tử cung và làm tăng độ nhạy cảm của tử cung với Oxytocin."}, {"id": 4, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 31 tuổi, mang song thai 2 nhau 2 ối ở tuần thứ 34, vào viện vì bụng to căng cứng và xuất hiện các cơn co tử cung đều đặn 4 phút/cơn. Thăm khám ghi nhận bề cao tử cung 38 cm, vòng bụng 105 cm. Cổ tử cung đã xóa 70%, mở 2 cm. Bác sĩ giải thích nguyên nhân chuyển dạ sinh non ở sản phụ này liên quan đến thuyết căng giãn cơ học cơ tử cung.", "question": "Cơ chế phân tử nào giải thích sự căng giãn cơ học cơ tử cung quá mức kích hoạt chuyển dạ sinh non?", "options": ["Sự căng giãn cơ học làm giảm sản xuất Relaxin từ hoàng thể, làm cứng cổ tử cung và ngăn cản sự lan truyền điện thế.", "Sự căng giãn tử cung làm ức chế hoàn toàn quá trình giải phóng Canxi nội bào, làm giảm nồng độ Proteoglycan tại mô liên kết cổ tử cung.", "Tử cung căng to làm suy giảm tuần hoàn tử cung nhau, kích thích tuyến yên mẹ ngừng tiết Oxytocin hoàn toàn.", "Sự căng giãn cơ tử cung làm kích hoạt các kênh ion nhạy cảm áp lực, làm tăng biểu hiện của connexin 43 và thụ thể Oxytocin, dẫn đến tăng giải phóng Prostaglandin.", "Sự căng giãn cơ tử cung trực tiếp phá hủy màng tế bào, làm mất hoàn toàn phản ứng co thắt của tế bào cơ tử cung."], "correct": 3, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Căng giãn không làm cứng cổ tử cung."}, {"key": "B", "trap": "[sai_tang] - Căng giãn làm tăng giải phóng Canxi nội bào chứ không ức chế."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Căng giãn làm tăng nhạy cảm với Oxytocin chứ không ngừng tiết."}, {"key": "E", "trap": "[nham_dan_so] - Căng giãn tăng phản ứng co thắt chứ không phá hủy làm mất co thắt."}], "decision": "Tử cung căng giãn quá mức (đa thai/đa ối) -> Kích hoạt thụ thể nhạy cảm áp lực -> Tăng biểu hiện Connexin 43 + Thụ thể Oxytocin + Prostaglandin -> Khởi phát chuyển dạ sớm.", "explanation": "Theo Giáo trình Bài 25: Thuyết căng giãn cơ học giải thích vì sao các trường hợp đa thai, đa ối, thai to thường dễ bị chuyển dạ sinh non. Khi thể tích buồng tử cung tăng quá mức, sự căng giãn của các sợi cơ tử cung sẽ kích thích các kênh ion nhạy cảm với áp lực màng tế bào, làm gia tăng sản xuất các protein liên quan đến chuyển dạ (CAPs) như connexin 43, thụ thể Oxytocin (OT-R) và kích thích màng rụng giải phóng Prostaglandin, từ đó khởi phát cơn co chuyển dạ."}, {"id": 5, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, con so, thai 40 tuần 3 ngày, chuyển dạ giai đoạn hoạt động. Cổ tử cung mở 4 cm suốt 3 giờ không tiến triển, cơn co tử cung thưa 2 cơn/10 phút, cường độ nhẹ 25 mmHg (cơn co tử cung thứ phát). Bác sĩ chỉ định bấm ối và truyền tĩnh mạch Oxytocin tăng co. Học viên thắc mắc tại sao hiệu quả của Oxytocin truyền phụ thuộc chặt chẽ vào tuổi thai.", "question": "Yếu tố vi mô nào quyết định sự gia tăng độ nhạy cảm của tử cung với Oxytocin truyền ngoại sinh khi thai đủ tháng?", "options": ["Sự tăng sinh hàng trăm lần mật độ thụ thể Oxytocin OT-R trên màng tế bào cơ tử cung dưới tác động của Estrogen vào cuối thai kỳ.", "Sự sụt giảm hoàn toàn nồng độ Canxi nội bào làm cho các sợi actin và myosin dễ dàng trượt lên nhau hơn.", "Sự xuất hiện của các enzym phá hủy Oxytocin tại màng bánh nhau làm tăng nồng độ Oxytocin tự do trong máu mẹ.", "Sự biến đổi của nồng độ HPL từ bánh nhau làm tăng trương lực cơ bản của tử cung lên trên 30 mmHg.", "Sự làm mỏng đi của lớp cơ tử cung giúp cho Oxytocin ngấm trực tiếp từ khoang ối vào tế bào cơ."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_tang] - Oxytocin làm TĂNG Canxi nội bào chứ không sụt giảm."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Enzym oxytocinase ở bánh nhau làm gián đoạn Oxytocin chứ không làm tăng tác dụng."}, {"key": "D", "trap": "[phan_biet_hep] - HPL không liên quan trực tiếp đến độ nhạy Oxytocin."}, {"key": "E", "trap": "[nham_dan_so] - Oxytocin tác dụng qua đường máu gắn vào màng tế bào chứ không ngấm từ khoang ối."}], "decision": "Estrogen cuối thai kỳ -> Tăng mật độ thụ thể OT-R trên màng cơ tử cung gấp 100-200 lần -> Tử cung cực kỳ nhạy cảm với Oxytocin -> Khởi phát và tăng cường cơn co tử cung.", "explanation": "Theo Giáo trình Bài 25: Nồng độ Oxytocin trong máu mẹ chỉ tăng nhẹ trong giai đoạn đầu chuyển dạ và tăng cao ở giai đoạn sổ thai. Lý do tử cung đáp ứng mạnh với Oxytocin khi đủ tháng là do mật độ thụ thể Oxytocin (OT-R) trên tế bào cơ tử cung tăng lên từ 100 đến 200 lần dưới tác động của Estrogen. Khi Oxytocin gắn vào OT-R, nó kích thích mở kênh Canxi và giải phóng Canxi từ lưới nội chất, làm tăng Canxi nội bào gây co thắt sợi actin-myosin."}, {"id": 6, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 26 tuổi, con so, thai 39 tuần 5 ngày, đang trong giai đoạn hoạt động của chuyển dạ. Bác sĩ quan sát bảng ghi Monitoring sản khoa trong 10 phút: Áp lực tử cung giữa các cơn co đo được là 10 mmHg; trong cơn co áp lực đỉnh đạt 50 mmHg; ghi nhận được 4 cơn co trong vòng 10 phút, mỗi cơn co kéo dài 45 giây. Bác sĩ yêu cầu học viên xác định các chỉ số sinh lý cơn co.", "question": "Xác định chính xác trương lực cơ bản, cường độ cơn co và biên độ cơn co tử cung của sản phụ này?", "options": ["Trương lực cơ bản là 45 mmHg, cường độ cơn co là 40 mmHg và biên độ cơn co là 10 mmHg.", "Trương lực cơ bản là 50 mmHg, cường độ cơn co là 10 mmHg và biên độ cơn co là 60 mmHg.", "Trương lực cơ bản là 10 mmHg, cường độ cơn co đỉnh là 50 mmHg và biên độ cơn co là 40 mmHg.", "Trương lực cơ bản là 0 mmHg, cường độ cơn co là 50 mmHg và biên độ cơn co là 50 mmHg.", "Trương lực cơ bản là 20 mmHg, cường độ cơn co là 30 mmHg và biên độ cơn co là 10 mmHg."], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] - Lấy thời gian co nhầm sang trương lực cơ bản."}, {"key": "B", "trap": "[sai_thu_tu] - Nhầm lẫn giữa trương lực cơ bản và áp lực đỉnh."}, {"key": "D", "trap": "[bo_chong_chi_dinh] - Trương lực cơ bản tử cung không bao giờ bằng 0 mmHg."}, {"key": "E", "trap": "[phan_biet_hep] - Tính toán sai số liệu."}], "decision": "Trương lực cơ bản = Áp lực giữa 2 cơn co (10 mmHg). Cường độ đỉnh = 50 mmHg. Biên độ cơn co = Áp lực đỉnh - Trương lực cơ bản = 50 - 10 = 40 mmHg.", "explanation": "Theo Giáo trình Bài 25: Trương lực cơ bản là áp lực trong buồng tử cung ngoài cơn co (bình thường 8 - 12 mmHg, ở đây là 10 mmHg). Cường độ cơn co là áp lực cao nhất trong buồng tử cung khi có cơn co (ở đây là 50 mmHg). Biên độ cơn co là hiệu số giữa cường độ đỉnh và trương lực cơ bản (50 - 10 = 40 mmHg). Tần số là số cơn co trong 10 phút (ở đây là 4 cơn/10 phút)."}, {"id": 7, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 30 tuổi, con rạ (PARA 1001), thai 40 tuần, chuyển dạ giai đoạn 1b. Kết quả ghi Monitor cơn co tử cung trong 10 phút ghi nhận có 4 cơn co. Trương lực cơ bản là 10 mmHg, áp lực đỉnh của 4 cơn co lần lượt là 50 mmHg, 55 mmHg, 50 mmHg, và 55 mmHg. Bác sĩ nội trú cần tính đơn vị Montevideo (MVU) để quyết định xem cơn co có đạt hiệu lực chuyển dạ sinh lý hay không.", "question": "Tính giá trị đơn vị Montevideo (MVU) của sản phụ và đưa ra nhận định về hiệu lực cơn co tử cung?", "options": ["Giá trị đạt 50 MVU, tử cung bị đờ hoàn toàn không có phản ứng co bóp cơ học.", "Giá trị đạt 210 MVU, tử cung đang trong tình trạng tăng co bóp quá mức cần phải cho thuốc giảm co khẩn cấp.", "Giá trị đạt 90 MVU, cơn co tử cung quá yếu không đủ hiệu lực và bắt buộc phải tăng co bằng Oxytocin.", "Giá trị đạt 300 MVU, nguy cơ vỡ tử cung rất cao cần chuyển mổ lấy thai cấp cứu lập tức.", "Giá trị đạt 170 MVU, cơn co tử cung hoàn toàn đạt hiệu lực sinh lý tốt cho giai đoạn hoạt động của chuyển dạ."], "correct": 4, "traps": [{"key": "A", "trap": "[phan_biet_hep] - Tính toán hoàn toàn sai."}, {"key": "B", "trap": "[sai_tang] - Tính nhầm do lấy áp lực đỉnh không trừ trương lực cơ bản."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Tính sai biên độ làm tưởng cơn co yếu."}, {"key": "D", "trap": "[qua_muc] - Chẩn đoán quá mức nguy cơ vỡ tử cung."}], "decision": "Biên độ từng cơn = Áp lực đỉnh - 10 mmHg -> Cơn 1: 40, Cơn 2: 45, Cơn 3: 40, Cơn 4: 45 -> Tổng MVU = 40+45+40+45 = 170 MVU (Đạt hiệu lực sinh lý 150-250 MVU).", "explanation": "Theo Giáo trình Bài 25: Đơn vị Montevideo (MVU) tính bằng tổng biên độ của tất cả các cơn co tử cung trong 10 phút. Biên độ cơn 1 = 50 - 10 = 40; Cơn 2 = 55 - 10 = 45; Cơn 3 = 50 - 10 = 40; Cơn 4 = 55 - 10 = 45. Tổng MVU = 40 + 45 + 40 + 45 = 170 MVU. Trong giai đoạn hoạt động của chuyển dạ, đơn vị Montevideo đạt từ 150 đến 250 MVU được coi là cơn co có hiệu lực sinh lý tốt."}, {"id": 8, "bloom": "Mức 3 - Phân tích", "stem": "Sản phụ 27 tuổi, con so, theo dõi chuyển dạ từ giai đoạn tiềm tàng sang giai đoạn hoạt động. Lúc vào viện cổ tử cung mở 2 cm có 2 cơn co/10 phút, dài 20 giây, cường độ 30 mmHg. Sau 5 giờ, cổ tử cung mở 6 cm có 4 cơn co/10 phút, dài 50 giây, cường độ 60 mmHg. Bác sĩ yêu cầu học viên phân tích các quy luật sinh lý của cơn co tử cung chuyển dạ.", "question": "Quy luật '3 tăng' sinh lý của cơn co tử cung trong suốt quá trình chuyển dạ được thể hiện như thế nào?", "options": ["Tăng dần về trương lực cơ bản, tăng dần về lượng máu nuôi rau và tăng dần về nồng điểm). Bác sĩ yêu cầu tính tổng điểm Bishop và đưa ra nhận định lâm sàng.", "question": "Tính tổng chỉ số Bishop của sản phụ và đưa ra kết luận về khả năng thành công khi khởi phát chuyển dạ?", "options": ["Tổng điểm Bishop là 7 điểm, cổ tử cung đã chín muồi, tiên lượng khởi phát chuyển dạ bằng Oxytocin có tỷ lệ thành công cao.", "Tổng điểm Bishop là 3 điểm, cổ tử cung hoàn toàn chưa chín muồi, bắt buộc phải mổ lấy thai chủ động khẩn cấp.", "Tổng điểm Bishop là 12 điểm, cổ tử cung đã mở trọn, sản phụ đang ở giai đoạn sổ thai cần chuyển ngay lên bàn sinh.", "Tổng điểm Bishop là 5 điểm, cổ tử cung bị dính chặt, nguy cơ rách phức tạp cổ tử cung khi khởi phát chuyển dạ.", "Tổng điểm Bishop là 10 điểm, cổ tử cung bị xơ hóa nặng không thể đáp ứng với bất kỳ thuốc tăng co nào."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_tang] - Tính sai cộng thiếu điểm các thành tố."}, {"key": "C", "trap": "[qua_muc] - Bishop 12 điểm là mở nhiều nhưng không có nghĩa mở trọn."}, {"key": "D", "trap": "[phan_biet_hep] - Bishop 7 điểm không phải là cổ tử cung dính."}, {"key": "E", "trap": "[nham_dan_so] - Cộng sai số điểm."}], "decision": "Cổ tử cung: Mềm (2) + Trung tư thế (1) + Xóa 60% (2) + Mở 2cm (1) + Độ lọt -2 (1) -> Tổng Bishop = 7 điểm (>= 6 điểm: CTC chín muồi) -> Tiên lượng khởi phát Oxytocin thành công cao.", "explanation": "Theo Giáo trình Bài 25: Bảng điểm Bishop đánh giá 5 yếu tố cổ tử cung: Độ mở, độ xóa, mật độ, tư thế và độ lọt. Ở đây: Mật độ mềm = 2đ; Tư thế trung bình = 1đ; Độ xóa 60% = 2đ; Độ mở 2 cm = 1đ; Độ lọt -2 = 1đ. Tổng điểm Bishop = 2 + 1 + 2 + 1 + 1 = 7 điểm. Khi chỉ số Bishop >= 6 điểm, cổ tử cung được coi là đã chín muồi, tỷ lệ khởi phát chuyển dạ thành công bằng Oxytocin rất cao tương đương với chuyển dạ tự nhiên."}, {"id": 11, "bloom": "Mức 3 - Phân tích", "stem": "Hai sản phụ cùng vào viện vì chuyển dạ: Sản phụ A (22 tuổi, con so) khám thấy cổ tử cung xóa 100% nhưng độ mở chỉ mới 1 cm. Sản phụ B (30 tuổi, con rạ lần 3) khám thấy cổ tử cung xóa 50% và con so, thai 39 tuần, cổ tử cung mở 4 cm. Thăm khám qua âm đạo ghi nhận trong cơn co tử cung, màng ối sát vào đầu thai nhi tạo thành một lớp mỏng, nước ối giữa màng thai và đầu thai rất ít (đầu ối dẹt). Bác sĩ giải thích cho học viên về các hình dạng đầu ối và chức năng của đầu ối trong chuyển dạ.", "question": "Phân biệt các hình dạng đầu ối và vai trò sinh lý quan trọng nhất của đầu ối còn nguyên vẹn trong giai đoạn 1 chuyển dạ?", "options": ["Đầu ối phồng là dấu hiệu thai chết lưu; vai trò chính là làm tăng áp lực tĩnh mạch tử cung để ngăn ngừa chảy máu.", "Đầu ối dẹt luôn gây cản trở sự xóa mở cổ tử cung và bắt buộc phải bấm ối ngay khi cổ tử cung mới mở 1 cm.", "Đầu ối hình quả lê giúp ngôi thai lọt nhanh hơn; vai trò chính là kích thích tuyến yên mẹ tăng tiết hormon Estrogen khẩn cấp.", "Đầu ối không có vai trò sinh lý nào trong chuyển dạ mà chỉ là một hậu quả thụ động của sự tích tụ nước ối kéo dài.", "Đầu ối dẹt giúp tiên lượng chuyển dạ tốt nhất; vai trò chính là nong cổ tử cung thành một lực cơ học êm ái và bảo vệ thai nhi khỏi vi khuẩn âm đạo."], "correct": 4, "traps": [{"key": "A", "trap": "[sai_tang] - Ối phồng không phải thai chết lưu mà do màng ối cách xa đầu thai."}, {"key": "B", "trap": "[qua_xam_lan] - Ối dẹt tiên lượng tốt chứ không phải cản trở hay cần bấm ối quá sớm."}, {"key": "C", "trap": "[bo_chong_chi_dinh] - Ối quả lê (ối dính) thường gặp trong thai chết lưu hoặc thai nhỏ, cản trở chuyển dạ."}, {"key": "D", "trap": "[nham_dan_so] - Phủ nhận vai trò sinh lý quan trọng của đầu ối."}], "decision": "Đầu ối dẹt -> Màng ối sát đầu thai, lượng nước ối vừa phải -> Tiên lượng tốt nhất. Vai trò đầu ối: Nong cổ tử cung + Tránh sang chấn cho thai + Ngăn vi khuẩn ngược dòng.", "explanation": "Theo Giáo trình Bài 25: Đầu ối là phần màng ối chứa nước ối nằm trước ngôi thai. Có 3 hình dạng: Đầu ối dẹt (màng ối sát đầu thai, tiên lượng chuyển dạ tiến triển tốt nhất); Đầu ối phồng (nước ối đọng nhiều giữa màng ối và ngôi thai); Đầu ối hình quả lê (màng ối th
