<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sản Khoa Quiz - Bài 08: Thất bại thai kỳ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #main-content {
      touch-action: pan-y pinch-zoom;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased selection:bg-teal-100 selection:text-teal-900 overflow-hidden">

  <!-- TOP MINIMAL BAR -->
  <header class="shrink-0 h-12 bg-white border-b border-slate-200 px-3.5 flex items-center justify-between z-20 shadow-xs">
    <div class="flex items-center gap-2">
      <span id="case-counter" class="text-xs font-bold text-teal-800 bg-teal-50 border border-teal-200/80 px-2 py-0.5 rounded-md font-mono">
        Ca 01/50
      </span>
      <select id="filter-select" onchange="changeFilter(this.value)" class="text-xs font-medium bg-slate-100 border border-slate-200 rounded-md px-2 py-1 text-slate-700 outline-none focus:border-teal-500">
        <option value="all">Tất cả (50)</option>
        <option value="starred">Đã nhớ (Sao)</option>
        <option value="unanswered">Chưa làm</option>
        <option value="wrong">Làm sai</option>
      </select>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="toggleStarCurrent()" id="star-btn" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-amber-500 transition" title="Ghi nhớ ca này">
        <svg id="star-icon" class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
      <button onclick="promptReset()" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-rose-500 transition" title="Làm lại bài thi">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- PROGRESS LINE -->
  <div class="w-full bg-slate-100 h-0.5 shrink-0">
    <div id="progress-line" class="h-0.5 bg-teal-600 transition-all duration-200" style="width: 0%;"></div>
  </div>

  <!-- MAIN SCROLLABLE CONTENT (VERTICAL MOBILE FIRST) -->
  <main id="main-content" class="flex-1 overflow-y-auto custom-scroll p-3.5 pb-20 max-w-xl w-full mx-auto space-y-3">
    
    <!-- Header: CHỈ DUY NHẤT SỐ THỨ TỰ (Ca XX) & Mức độ -->
    <div class="flex items-center justify-between border-b border-slate-200/60 pb-2">
      <h1 id="case-title" class="text-sm font-bold text-slate-900 tracking-tight font-mono">
        Ca 01
      </h1>
      <span id="case-level" class="text-[10px] font-semibold text-teal-700 bg-teal-50 border border-teal-200/70 px-2 py-0.5 rounded-full shrink-0">
        Mức 3
      </span>
    </div>

    <!-- Vignette Box -->
    <div class="bg-amber-50/80 border border-amber-200/70 rounded-xl p-3 text-slate-800">
      <div class="text-[10px] font-bold uppercase tracking-wider text-amber-800 mb-1 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        Tình huống lâm sàng
      </div>
      <p id="case-vignette" class="text-xs sm:text-[13px] leading-relaxed text-justify">
        ...
      </p>
    </div>

    <!-- Question Prompt -->
    <div class="bg-slate-100/90 rounded-xl p-3 border border-slate-200/80">
      <p id="case-question" class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug">
        ...
      </p>
    </div>

    <!-- 4 Options -->
    <div id="options-box" class="space-y-2 pt-1">
      <!-- Injected dynamically -->
    </div>

    <!-- Explanation Box (Hiện sau khi chọn) -->
    <div id="explanation-container" class="hidden space-y-2 pt-1 transition-all">
      <div id="status-badge" class="p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2"></div>
      
      <div class="bg-white border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-700 space-y-1">
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-700 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
          </svg>
          Biện luận y khoa & phân tích bẫy
        </div>
        <p id="explanation-text" class="text-justify text-slate-600"></p>
      </div>
    </div>

    <!-- Personal Notes Box -->
    <div class="pt-1">
      <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
        <span class="flex items-center gap-1">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Ghi chú ca này
        </span>
        <span id="note-saved-hint" class="text-teal-600 font-semibold opacity-0 transition-opacity text-[10px]">Đã lưu</span>
      </div>
      <textarea id="note-input" oninput="saveNote(this.value)" placeholder="Ghi nhớ nhận định y khoa hoặc bẫy cần tránh cho ca này..." class="w-full h-14 p-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-teal-500 resize-none font-sans"></textarea>
    </div>

  </main>

  <!-- BOTTOM FLOATING NAV BAR -->
  <footer class="fixed bottom-0 inset-x-0 h-13 bg-white/95 backdrop-blur border-t border-slate-200 px-3 flex items-center justify-between max-w-xl mx-auto z-20">
    <button onclick="prevCase()" class="h-9 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 active:scale-95 transition flex items-center gap-1">
      <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Trước
    </button>

    <button onclick="openJumpModal()" class="h-9 px-3.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-800 text-xs font-bold active:scale-95 transition flex items-center gap-1.5 font-mono">
      <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span id="bottom-counter">1 / 50</span>
    </button>

    <button onclick="nextCase()" class="h-9 px-3 rounded-lg bg-teal-600 text-white text-xs font-semibold active:scale-95 transition flex items-center gap-1 shadow-xs shadow-teal-600/30">
      Tiếp <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </footer>

  <!-- MODAL JUMP GRID -->
  <div id="jump-modal" class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl max-w-md w-full max-h-[75vh] flex flex-col border border-slate-200 shadow-xl overflow-hidden">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800">Chọn nhanh ca bệnh (1 - 50)</span>
        <button onclick="closeJumpModal()" class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xs">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="p-3 overflow-y-auto custom-scroll flex-1">
        <div id="grid-container" class="grid grid-cols-5 sm:grid-cols-6 gap-1.5">
          <!-- Injected dynamically -->
        </div>
      </div>

      <div class="p-2 border-t border-slate-200 bg-slate-50 text-[10px] flex items-center justify-around text-slate-500 font-medium">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Đúng</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Sai</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-200"></span> Chưa làm</span>
        <span class="flex items-center gap-1"><span class="text-amber-500 font-bold">★</span> Đã nhớ</span>
      </div>
    </div>
  </div>

  <!-- SCRIPT DATA & APP LOGIC -->
  <script>
    // 50 Clinical Cases Data Bài 08: Thất bại thai kỳ (Không có chủ đề sau Ca XX)
    const cases = [
      {
        id: 1,
        title: "Ca 01",
        level: "Mức 3 - Vận dụng",
        vignette: "Sản phụ 26 tuổi, PARA 0000, thai 8 tuần 2 ngày theo siêu âm quý 1. Bệnh nhân đi khám vì ra máu âm đạo ít màu đỏ tươi lẫn nhầy nâu 2 ngày nay, kèm cảm giác tức nặng âm ỉ vùng hạ vị. Thăm khám: Sinh hiệu ổn định, bụng mềm. Đặt mỏ vịt: Cổ tử cung dài, lỗ ngoài đóng kín, có ít máu sẫm đọng ở cùng đồ sau. Siêu âm TVS: Buồng tử cung có 01 thai sống, CRL = 17 mm, tim thai 152 lần/phút, bờ túi thai đều, có hình ảnh bóc tách màng đệm diện tích khoảng 15%.",
        question: "Chẩn đoán xác định và hướng xử trí lâm sàng chuẩn mực nhất cho sản phụ là gì?",
        options: {
          A: "Dọa sẩy thai quý 1; khuyên nghỉ ngơi, bổ sung Progesterone đặt âm đạo.",
          B: "Sẩy thai khó tránh; chỉ định nhập viện gắp thai và hút buồng tử cung.",
          C: "Sẩy thai không hoàn toàn; chỉ định dùng thuốc Misoprostol tống xuất tổ chức.",
          D: "Thai ngoài tử cung; chỉ định mổ nội soi cấp cứu thăm dò vòi tử cung."
        },
        correct: "A",
        explanation: "Triệu chứng ra máu âm đạo ít, tức nặng hạ vị, cổ tử cung dài đóng kín, siêu âm thai còn sống kèm bóc tách màng đệm 15% là bệnh cảnh kinh điển của Dọa sẩy thai (Threatened abortion). Xử trí chuẩn mực: Nghỉ ngơi tại giường, kiêng quan hệ tình dục và bổ sung Progesterone (dạng đặt âm đạo/uống) để hỗ trợ hoàng thể."
      },
      {
        id: 2,
        title: "Ca 02",
        level: "Mức 4 - Ra quyết định",
        vignette: "Sản phụ 29 tuổi, PARA 1001, thai 9 tuần dọa sẩy thai ra máu âm đạo lượng ít. Bệnh nhân có xét nghiệm nhóm máu A, RhD âm tính (chồng nhóm máu O, RhD dương tính). Xét nghiệm gián tiếp Coombs test hiện tại âm tính. Sản phụ rất lo lắng về nguy cơ hình thành kháng thể đồng miễn dịch ảnh hưởng đến các lần mang thai sau.",
        question: "Chỉ định sinh phẩm y học dự phòng bắt buộc nào cần thực hiện cho sản phụ?",
        options: {
          A: "Tiêm dự phòng Anti-D Immunoglobulin cho mẹ trong vòng 72 giờ.",
          B: "Truyền khối hồng cầu RhD âm tính ngay để bù lượng máu mất.",
          C: "Tiêm Corticoid liều cao để ức chế đáp ứng miễn dịch của cơ thể mẹ.",
          D: "Không cần can thiệp sinh phẩm y học vì thai nhi chưa có hệ tuần hoàn."
        },
        correct: "A",
        explanation: "Ở phụ nữ mang thai RhD âm tính, mọi sự kiện có nguy cơ gây chảy máu mẹ - thai (như dọa sẩy thai, sẩy thai, thủ thuật sản khoa) đều có thể kích hoạt cơ thể mẹ sản sinh kháng thể chống RhD. Chỉ định bắt buộc: Tiêm dự phòng Anti-D Immunoglobulin (liều 125 - 300 mcg) trong vòng 72 giờ kể từ khi có biến cố chảy máu."
      },
      {
        id: 3,
        title: "Ca 03",
        level: "Mức 3 - Phân tích",
        vignette: "Bệnh nhân nữ 25 tuổi, PARA 0000, thai 10 tuần. Bệnh nhân vào viện vì ra máu âm đạo đỏ tươi lượng nhiều gấp đôi kỳ kinh bình thường, kèm đau quặn từng cơn dữ dội vùng hạ vị. Khám âm đạo: Cổ tử cung xóa 80%, hé mở 1,5 cm, đoạn dưới tử cung phình to tròn hình con quay do bọc thai tụt xuống. Siêu âm TVS: Bọc thai bóc tách hoàn toàn khỏi niêm mạc tử cung, tụt thấp xuống sát cổ tử cung, không còn hoạt động tim thai.",
        question: "Thể lâm sàng sẩy thai được chẩn đoán xác định trên bệnh nhân này là gì?",
        options: {
          A: "Sẩy thai khó tránh (Inevitable abortion) do cổ tử cung đã mở và bọc thai bóc tách hoàn toàn.",

        },
        correct: "A",
        explanation: "Triệu chứng đau quặn bụng dồn dập, ra máu tươi nhiều, cổ tử cung xóa hé mở, đoạn dưới tử cung phình hình con quay và siêu âm bọc thai bóc tách hoàn toàn tụt thấp là hình thái Sẩy thai khó tránh. Không thể giữ thai được nữa, cần hỗ trợ tống xuất thai để cầm máu."
      },
      {
        id: 4,
        title: "Ca 04",
        level: "Mức 4 - Ra quyết định",
        vignette: "Sản phụ 28 tuổi, thai 11 tuần, đột ngột đau quặn hạ vị dữ dội từng cơn kèm ra máu tươi ồ ạt lẫn máu cục tại phòng khám. Khám âm đạo ngay: Cổ tử cung mở 2 cm, sờ thấy khối tổ chức bọc thai mềm đang nằm thập thò ngay lỗ ngoài cổ tử cung, máu tươi chảy theo tay ra nhiều.",

          A: "Dùng kẹp hình tim gắp khối bọc thai thập thò ở cổ tử cung và hút buồng tử cung cầm máu.",
          B: "Tiêm ngay thuốc giảm co Salbutamol đường tĩnh mạch để ngừng cơn đau quặn bụng.",
          C: "Kê đơn Progesterone liều cao đặt âm đạo và cho bệnh nhân nằm kê cao mông.",
          D: "Cho bệnh nhân làm xét nghiệm công thức máu và chờ kết quả trước khi can thiệp."
        },
        correct: "A",
        explanation: "Khi khối thai đang thập thò ở cổ tử cung (Đang sẩy thai), bọc thai chèn ép làm cổ tử cung không thể co hồi và kích thích chảy máu ồ ạt. Thao tác xử trí cấp cứu tức thì: Dùng kẹp sát trùng/kẹp hình tim gắp nhẹ nhàng khối thai ra ngoài, sau đó tiến hành hút chân không buồng tử cung và dùng thuốc tăng co để cầm máu nhanh chóng."
      },
      {
        id: 5,
        title: "Ca 05",
        level: "Mức 3 - Phân tích",
        vignette: "Bệnh nhân 24 tuổi, thai 9 tuần. Hai ngày trước bệnh nhân đau bụng quặn nhiều và tống xuất 1 khối thịt ra âm đạo. Sau sẩy, bệnh nhân vẫn tiếp tục ra máu âm đạo màu sẫm rỉ rả và đau bụng âm ỉ. Khám phụ khoa: Cổ tử cung còn hé mở, thân tử cung to hơn bình thường nhưng nhỏ hơn tuổi thai 9 tuần, ấn tức. Siêu âm TVS: Lòng tử cung có khối hồi âm hỗn hợp không đều d = 22 mm, không thấy túi thai nguyên vẹn.",

        options: {
          A: "Sẩy thai không hoàn toàn (Sót tổ chức sẩy thai / Sót nhau).",

          C: "Dọa sẩy thai quý 1 do buồng tử cung vẫn còn khối phản âm.",
          D: "Bệnh nguyên bào nuôi do thai dạng thai trứng toàn phần."
        },
        correct: "A",
        explanation: "Bệnh nhân đã tống xuất một phần bọc thai nhưng ra máu và đau bụng vẫn kéo dài, cổ tử cung còn hé mở, tử cung to hơn bình thường và siêu âm thấy khối hỗn hợp trong lòng tử cung. Đây là bệnh cảnh kinh điển của Sẩy thai không hoàn toàn (Incomplete abortion)."
      },
      {
        id: 6,
        title: "Ca 06",
        level: "Mức 4 - Ra quyết định",

        question: "Lựa chọn phương pháp can thiệp chuẩn mực để làm sạch buồng tử cung cho bệnh nhân?",

        options: {

        correct: "A",

      },

        question: "Lời tư vấn động viên chuyên môn dựa trên y học chứng cứ?",
        options: {

        correct: "A",

        explanation: "Tiêu chí lâm sàng về mất thai sớm trong chẩn đoán Hội chứng Kháng Phospholipid (APS) quy định: Có từ 03 lần sẩy thai liên tiếp trở lên trước tuần thai thứ 10 (khi đã loại trừ các bất thường giải phẫu tử cung, di truyền bố mẹ và nội tiết)."
      },
      {
        id: 50,
        title: "Ca 50",
        level: "Mức 4 - Ra quyết định",
        vignette: "Khi thăm khám một cặp vợ chồng bị sẩy thai liên tiếp, bác sĩ phát hiện người vợ có u xơ tử cung dưới niêm mạc 2 cm. Bác sĩ phân vân có nên làm tiếp các xét nghiệm khác hay dừng lại.",
        question: "Nguyên tắc đánh giá nguyên nhân sẩy thai liên tiếp chuẩn mực?",
        options: {
          A: "Vẫn cần đánh giá đầy đủ tất cả các nhóm nguyên nhân vì STLT có thể do đa nguyên nhân kết hợp.",
          B: "Dừng ngay việc khám và xét nghiệm vì đã tìm thấy nguyên nhân duy nhất là u xơ tử cung.",
          C: "Chỉ cần làm xét nghiệm di truyền mà bỏ qua các xét nghiệm antiphospholipid và nội tiết.",
          D: "Cho bệnh nhân nhập viện phẫu thuật cắt tử cung ngay lập tức để điều trị u xơ."
        },
        correct: "A",
        explanation: "Giáo trình Bài 08 lưu ý: Ngay cả khi đã phát hiện được một bất thường (như u xơ tử cung hay suy giáp), vẫn nên đánh giá đầy đủ các nguyên nhân khác (di truyền, APS, tử cung, nội tiết) vì sẩy thai liên tiếp thường do đa nguyên nhân phối hợp."

    // PHÂN TÁCH BỘ NHỚ ĐỘC LẬP THEO TÊN FILE HTML
    const PAGE_NAME = window.location.pathname.split('/').pop().replace('.html', '').toLowerCase() || 'bai-08';
    const STORAGE_KEY = `QUIZ_STATE_${PAGE_NAME}`;

    // App State
    let state = {
      answers: {},    // { [caseId]: 'A'|'B'|'C'|'D' }
      starred: {},    // { [caseId]: boolean }
      notes: {},      // { [caseId]: string }
      index: 0
    };

    let currentFilter = 'all';
    let saveTimeout = null;

    // Load state từ LocalStorage
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          if (!(typeof state.index === 'number' && state.index >= 0 && state.index < cases.length)) {
            state.index = 0;
          }
        }
      } catch (err) {
        console.error("Lỗi đọc LocalStorage", err);
      }
    }

    // Save state vào LocalStorage
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error("Lỗi ghi LocalStorage", err);
      }
    }

    // Bộ lọc
    function getFilteredList() {
      return cases.map((c, i) => {
        const ans = state.answers[c.id];
        const isStarred = !!state.starred[c.id];
        const isAnswered = !!ans;
        const isCorrect = isAnswered && ans === c.correct;

        if (currentFilter === 'all') return i;
        if (currentFilter === 'starred') return isStarred ? i : null;
        if (currentFilter === 'unanswered') return !isAnswered ? i : null;
        if (currentFilter === 'wrong') return (isAnswered && !isCorrect) ? i : null;
        return i;
      }).filter(i => i !== null);
    }

    function changeFilter(val) {
      currentFilter = val;
      const list = getFilteredList();
      if (list.length > 0 && !list.includes(state.index)) {
        state.index = list[0];
      }
      render();
      saveState();
    }

    // Điều hướng
    function prevCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos > 0) state.index = list[pos - 1];
      else state.index = list[list.length - 1];
      render();
      saveState();
      scrollTop();
    }

    function nextCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos < list.length - 1) state.index = list[pos + 1];
      else state.index = list[0];
      render();
      saveState();
      scrollTop();
    }

    function jumpTo(idx) {
      state.index = idx;
      closeJumpModal();
      render();
      saveState();
      scrollTop();
    }

    function scrollTop() {
      const el = document.getElementById('main-content');
      if (el) el.scrollTop = 0;
    }

    // Chọn đáp án
    function chooseOption(letter) {
      const c = cases[state.index];
      state.answers[c.id] = letter;
      saveState();
      render();
    }

    // Bookmark / Star
    function toggleStarCurrent() {
      const c = cases[state.index];
      state.starred[c.id] = !state.starred[c.id];
      saveState();
      renderStarUI();
    }

    function renderStarUI() {
      const c = cases[state.index];
      const isStarred = !!state.starred[c.id];
      const icon = document.getElementById('star-icon');
      const btn = document.getElementById('star-btn');
      if (isStarred) {
        icon.classList.remove('fill-none', 'text-slate-400');
        icon.classList.add('fill-amber-400', 'text-amber-500');
        btn.classList.add('bg-amber-50', 'border-amber-300');
      } else {
        icon.classList.remove('fill-amber-400', 'text-amber-500');
        icon.classList.add('fill-none', 'text-slate-400');
        btn.classList.remove('bg-amber-50', 'border-amber-300');
      }
    }

    // Ghi chú
    function saveNote(val) {
      const c = cases[state.index];
      state.notes[c.id] = val;
      saveState();

      const hint = document.getElementById('note-saved-hint');
      if (hint) {
        hint.style.opacity = '1';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => { hint.style.opacity = '0'; }, 1000);
      }
    }

    // Đặt lại tiến độ
    function promptReset() {
      if (window.confirm("Bạn có muốn xóa kết quả đã tick để luyện lại từ đầu? (Ghi chú cá nhân vẫn được bảo lưu)")) {
        state.answers = {};
        state.starred = {};
        state.index = 0;
        saveState();
        render();
      }
    }

    // Render ca bệnh hiện tại
    function render() {
      const c = cases[state.index];
      if (!c) return;

      const userAns = state.answers[c.id];
      const isAnswered = !!userAns;
      const isCorrect = userAns === c.correct;

      // Cập nhật số thứ tự (chỉ giữ "Ca XX")
      const currentNum = c.id < 10 ? '0' + c.id : c.id;
      document.getElementById('case-counter').innerText = `Ca ${currentNum}/50`;
      document.getElementById('bottom-counter').innerText = `${c.id} / 50`;
      document.getElementById('case-title').innerText = `Ca ${currentNum}`;
      document.getElementById('case-level').innerText = c.level;
      
      document.getElementById('case-vignette').innerText = c.vignette;
      document.getElementById('case-question').innerText = c.question;

      // Tiến độ tổng
      const answeredCount = Object.keys(state.answers).length;
      document.getElementById('progress-line').style.width = `${Math.round((answeredCount / cases.length) * 100)}%`;

      // Render 4 phương án A-B-C-D
      const optionsBox = document.getElementById('options-box');
      const letters = ['A', 'B', 'C', 'D'];
      let html = '';

      letters.forEach(letter => {
        const text = c.options[letter];
        let btnCls = "w-full text-left p-3 min-h-[48px] rounded-xl border text-xs sm:text-[13px] font-medium transition flex items-center gap-2.5 active:scale-[0.99] ";
        let badgeCls = "w-6 h-6 rounded-md font-bold flex items-center justify-center shrink-0 text-xs font-mono ";

        if (!isAnswered) {
          btnCls += "border-slate-200 bg-white text-slate-700 hover:border-teal-500 hover:bg-slate-50";
          badgeCls += "bg-slate-100 text-slate-600";
        } else {
          if (letter === c.correct) {
            btnCls += "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-1 ring-emerald-400";
            badgeCls += "bg-emerald-600 text-white";
          } else if (letter === userAns) {
            btnCls += "border-rose-400 bg-rose-50 text-rose-950 font-semibold ring-1 ring-rose-400";
            badgeCls += "bg-rose-600 text-white";
          } else {
            btnCls += "border-slate-200 bg-white text-slate-400 opacity-60";
            badgeCls += "bg-slate-100 text-slate-400";
          }
        }

        html += `
          <button onclick="chooseOption('${letter}')" class="${btnCls}">
            <span class="${badgeCls}">${letter}</span>
            <span class="flex-1 py-0.5 leading-snug">${text}</span>
            ${isAnswered && letter === c.correct ? '<span class="text-emerald-600 font-bold ml-1 text-sm">✓</span>' : ''}
            ${isAnswered && letter === userAns && letter !== c.correct ? '<span class="text-rose-500 font-bold ml-1 text-sm">✕</span>' : ''}
          </button>
        `;
      });
      optionsBox.innerHTML = html;

      // Biện luận y khoa & Phân tích bẫy
      const expContainer = document.getElementById('explanation-container');
      const statusBadge = document.getElementById('status-badge');
      const expText = document.getElementById('explanation-text');

      if (isAnswered) {
        expContainer.classList.remove('hidden');
        if (isCorrect) {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-900";
          statusBadge.innerHTML = `<span class="text-emerald-600 text-base">✓</span> <span>Chính xác! Đáp án đúng là <strong>${c.correct}</strong></span>`;
        } else {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-rose-50 border border-rose-200 text-rose-900";
          statusBadge.innerHTML = `<span class="text-rose-500 text-base">✕</span> <span>Chưa chính xác. Đáp án chuẩn là <strong>${c.correct}</strong></span>`;
        }
        expText.innerText = c.explanation;
      } else {
        expContainer.classList.add('hidden');
      }

      // Khôi phục ghi chú & sao
      document.getElementById('note-input').value = state.notes[c.id] || '';
      renderStarUI();
    }

    // Modal Jump Grid
    function openJumpModal() {
      const container = document.getElementById('grid-container');
      let html = '';

      cases.forEach((c, idx) => {
        const ans = state.answers[c.id];
        const isCurrent = idx === state.index;
        const isStarred = !!state.starred[c.id];

        let bg = "bg-white border-slate-200 text-slate-700";
        if (ans) {
          bg = ans === c.correct ? "bg-emerald-500 border-emerald-600 text-white font-semibold" : "bg-rose-500 border-rose-600 text-white font-semibold";
        }
        const currentRing = isCurrent ? " ring-2 ring-teal-500 ring-offset-1 font-bold scale-105 z-10" : "";

        html += `
          <button onclick="jumpTo(${idx})" class="h-10 rounded-xl border text-xs font-mono relative flex items-center justify-center transition active:scale-95 ${bg} ${currentRing}">
            <span>${c.id < 10 ? '0' + c.id : c.id}</span>
            ${isStarred ? '<span class="absolute top-0.5 right-1 text-[10px] text-amber-300 drop-shadow">★</span>' : ''}
          </button>
        `;
      });

      container.innerHTML = html;
      const modal = document.getElementById('jump-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeJumpModal() {
      const modal = document.getElementById('jump-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Hỗ trợ vuốt màn hình (Touch Swipe Gestures)
    let startX = 0;
    let startY = 0;
    const mainEl = document.getElementById('main-content');

    mainEl.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    mainEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - startX;
      const diffY = e.changedTouches[0].screenY - startY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
        if (diffX < 0) nextCase();
        else prevCase();
      }
    }, { passive: true });

    // Phím tắt bàn phím
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') prevCase();
      else if (e.key === 'ArrowRight') nextCase();
      else if (['1', 'a', 'A'].includes(e.key)) chooseOption('A');
      else if (['2', 'b', 'B'].includes(e.key)) chooseOption('B');
      else if (['3', 'c', 'C'].includes(e.key)) chooseOption('C');
      else if (['4', 'd', 'D'].includes(e.key)) chooseOption('D');
      else if (['s', 'S'].includes(e.key)) toggleStarCurrent();
    });

    // Khởi động
    window.onload = function() {
      loadState();
      render();
    };
  </script>
