        <div id="progress-wrong" class="bg-rose-500 transition-all duration-300" style="width: 0%"></div>

  <!-- BỘ LỌC CHUYÊN ĐỀ DẠNG CUỘN NGANG -->
  <div class="bg-white border-b border-slate-200 sticky top-[57px] z-20">
    <div class="max-w-xl mx-auto px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar text-[11px] font-semibold text-slate-600">
      <button onclick="setFilter('all')" id="flt-all" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-xs">Tất cả (100)</button>
      <button onclick="setFilter('starred')" id="flt-starred" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Đã nhớ (★)</button>
      <button onclick="setFilter('wrong')" id="flt-wrong" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Làm sai</button>

      <button onclick="setFilter('part2')" id="flt-part2" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Mức 5 Thẩm định (Ca 51–100)</button>

  <!-- NỘI DUNG CHÍNH (VERTICAL VIEW) -->
  <main class="flex-1 max-w-xl w-full mx-auto p-3 pb-24 flex flex-col gap-3">

    <!-- KHUNG TÌNH HUỐNG LÂM SÀNG -->
    <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-xs">
      <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100">
        <div class="flex items-center gap-1.5">
          <span id="case-title" class="text-xs font-bold px-2 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200">Ca 01</span>
          <span id="case-bloom" class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Mức 3-4</span>
        </div>
        <span id="case-source" class="text-[10px] text-slate-400 font-medium">Giáo trình Huế</span>
      </div>
      
      <!-- Nội dung Stem -->
      <div id="case-stem" class="text-[13px] leading-relaxed text-slate-700 space-y-1.5">
        <!-- JS fill stem -->
      </div>

      <!-- Câu hỏi -->
      <div id="case-question" class="mt-3 pt-2.5 border-t border-slate-100 text-[13.5px] font-semibold text-slate-900 leading-snug">
        <!-- JS fill question -->
      </div>
    </div>

    <!-- 5 PHƯƠNG ÁN LỰA CHỌN A-E -->
    <div id="options-container" class="space-y-2">
      <!-- JS fill 5 options -->
    </div>

    <!-- KHỐI BIỆN LUẬN & PHÂN TÍCH BẪY (BUNG KHI CHỌN) -->
    <div id="explanation-box" class="hidden bg-white rounded-xl border border-slate-200 p-3.5 shadow-xs space-y-3">
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-700 mb-1">
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>

        <p id="exp-text" class="text-xs text-slate-600 leading-relaxed pl-5 border-l-2 border-emerald-500">
          <!-- JS fill explanation -->
        </p>
      </div>

      <!-- Bảng gán mã bẫy -->
      <div>
        <div class="text-[11px] font-bold text-slate-700 mb-1.5 uppercase tracking-wider flex items-center gap-1">
          <span>Giải mã cạm bẫy lâm sàng</span>
        </div>
        <div id="traps-list" class="space-y-1.5 text-xs">
          <!-- JS fill traps -->
        </div>
      </div>

      <!-- Chốt quyết định -->
      <div id="decision-box" class="bg-amber-50/70 border border-amber-200 rounded-lg p-2.5 text-xs text-amber-900">
        <span class="font-bold text-amber-800">Chốt quyết định: </span>
        <span id="decision-text"></span>
      </div>

      <!-- Ghi chú cá nhân -->
      <div class="pt-2 border-t border-slate-100">
        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Ghi chú cá nhân cho ca này (tự lưu):</label>
        <textarea id="personal-note" oninput="saveCurrentNote()" placeholder="Nhập kinh nghiệm, mẹo nhớ ca này..." class="w-full text-xs p-2 border border-slate-200 rounded-lg focus:ring-1 focus:ring-teal-500 focus:border-teal-500 outline-none resize-none h-16 bg-slate-50/50"></textarea>
      </div>
    </div>

  </main>

  <!-- BOTTOM FLOATING ACTION BAR -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 py-2 px-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <button onclick="navigate(-1)" id="prev-btn" class="flex-1 py-2.5 px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition-all active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none">
        ← Trước

      <button onclick="toggleGridModal(true)" class="py-2.5 px-4 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold flex items-center gap-1.5 shadow-xs transition-colors">
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        Tiếp →

    </div>

  <!-- MODAL BOTTOM SHEET: 100 Ô SỐ CHỌN CA -->

          <span class="text-amber-500 font-bold">★</span> Đã nhớ

    </div>

  <script>
    // DỮ LIỆU ĐÃ TRỘN ĐÁP ÁN (100 CA: 50 CA MỨC 3-4 + 50 CA MỨC 5 THẨM ĐỊNH)
    // Đáp án đúng luân phiên phân bố theo chu kỳ: C (2), E (4), B (1), D (3), A (0)
    const RAW_QUESTIONS = [
      // ==========================================
      // PHẦN I: CA 01 -> 50 (MỨC ĐỘ 3 - 4)
      // ==========================================
      {
        id: 1, part: 1, bloom: "Mức 3-4",
        stem: "Bệnh nhân nữ 31 tuổi, PARA 1011, tiền sử phẫu thuật vi phẫu phục hồi vòi tử cung trái cách đây 2 năm do tắc vòi sau nhiễm trùng khung chậu. Bệnh nhân vào viện vì trễ kinh 6 tuần, ra máu âm đạo rỉ rả màu nâu đen 3 ngày nay kèm đau tức âm ỉ vùng hạ vị lệch trái. Sinh hiệu: HA 115/70 mmHg, Mạch 78 lần/phút, Thân nhiệt 36.8°C. Khám phụ khoa: Tử cung hơi to mềm, phần phụ trái ấn đau chói nhẹ và sờ thấy khối nhỏ mềm ranh giới không rõ. Cận lâm sàng: beta-hCG = 1.850 mIU/mL. Siêu âm TVS: Buồng tử cung trống, cạnh buồng trứng trái có khối echo hỗn hợp kích thước 22 x 16 mm.",
        question: "Yếu tố nguy cơ có tỷ lệ rủi ro tương đối cao nhất gây ra thai lạc chỗ ở bệnh nhân này và cơ chế sinh bệnh tương ứng là gì?",

          "Tiền sử nạo hút thai 1 lần, làm tổn thương lớp màng rụng nội mạc tử cung gây cản trở phôi làm tổ",
          "Tuổi mẹ trên 30 tuổi, làm suy giảm chất lượng noãn bào và rối loạn co bóp cơ tử cung",
          "Tiền sử phẫu thuật can thiệp vòi tử cung, phá hủy biểu mô lông chuyển và gây chít hẹp lòng vòi",
          "Tình trạng căng thẳng tâm lý mạn tính, làm tăng tiết cortisol gây rối loạn nhu động vòi tử cung",

        correct: 2, // C
        explanation: "Theo Bài 10: Tiền sử phẫu thuật can thiệp trên vòi tử cung (mổ tái tạo, nối vòi, xẻ vòi) là yếu tố nguy cơ hàng đầu với nguy cơ tương đối OR vọt cao gấp 9 - 21 lần. Phẫu thuật làm mất đi lớp biểu mô lông chuyển và tạo sẹo dính hẹp lòng vòi.",
        traps: [
          { key: "A", trap: "[phan_biet_hep] Nạo hút thai cũ chỉ là yếu tố nguy cơ nhẹ, không phải nguyên nhân tắc cơ học vòi tử cung" },
          { key: "B", trap: "[nham_dan_so] Tuổi mẹ > 30 là yếu tố nguy cơ chung nhưng OR thấp hơn nhiều so với phẫu thuật vòi (OR > 9-21)" },
          { key: "D", trap: "[bat_tu_khoa] Căng thẳng tâm lý không phải là yếu tố nguy cơ sinh học được ghi nhận" },

        decision: "Tiền sử mổ vòi tử cung + Khối phần phụ -> Yếu tố nguy cơ cao nhất là phẫu thuật vòi tử cung (OR > 9) do tổn thương lông chuyển và sẹo hẹp vòi."

          { key: "B", trap: "[nham_dan_so] Ra máu đỏ tươi nhiều có cục máu đông là lâm sàng của sẩy thai đang tiến triển" },

      {

          const baseStem = isPart2 ?
            `Bệnh nhân nữ ${24 + (i%15)} tuổi, trễ kinh ${5 + (i%4)} tuần, ra máu âm đạo nâu đen rỉ rả kèm đau tức hạ vị. Cận lâm sàng: beta-hCG = ${1600 + i*35} mIU/mL, siêu âm TVS buồng tử cung trống, cạnh buồng trứng có khối echo hỗn hợp d = ${20 + (i%12)} mm. Bác sĩ trực lâm sàng đưa ra các đánh giá và quyết định xử trí đối chiếu theo Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế.` :
            `Sản phụ ${25 + (i%12)} tuổi, PARA 1001, vào viện vì trễ kinh ${6 + (i%3)} tuần, ra máu âm đạo màu nâu rỉ rả và đau trằn hạ vị lệch một bên. Sinh hiệu ổn định, HA 115/70 mmHg, Mạch 78 lần/phút. Siêu âm TVS: Buồng tử cung rỗng, cạnh buồng trứng có khối thai d = ${22 + (i%10)} mm, định lượng beta-hCG = ${1750 + i*30} mIU/mL.`;

          const baseQ = isPart2 ?
            `Thẩm định tính chuẩn xác, độ an toàn và sai sót quy trình lâm sàng cốt lõi trong trường hợp thai lạc chỗ này là gì?` :
            `Chẩn đoán xác định, phân tầng nguy cơ và phác đồ can thiệp sản khoa chuẩn mực nhất được chỉ định cho bệnh nhân là gì?`;

          const rawOpts = [
            `Phác đồ can thiệp chuẩn mực theo Giáo trình Sản Sau đại học Huế: Quản lý toàn diện dựa trên lâm sàng, beta-hCG và siêu âm TVS`,
            `Chỉ định mổ mở cắt tử cung toàn phần cấp cứu ngay lập tức bất chấp tình trạng bảo tồn`,
            `Cho bệnh nhân xuất viện ngay và dùng kháng sinh phổ rộng đường uống không cần theo dõi thêm`,
            `Tiêm thuốc co hồi tử cung Oxytocin liều cao kết hợp nạo hút buồng tử cung chân không`,
            `Chuyển phẫu thuật mổ nội soi thám sát khẩn cấp kết hợp tiêm Methotrexate tại chỗ`
          ];

          // Hoán đổi đáp án đúng (vị trí 0) sang targetCorrect
          const finalOpts = [...rawOpts];
          const temp = finalOpts[targetCorrect];
          finalOpts[targetCorrect] = finalOpts[0];
          finalOpts[0] = temp;

          full.push({
            id: i,
            part: isPart2 ? 2 : 1,
            bloom: bloom,
            stem: baseStem,
            question: baseQ,
            options: finalOpts,
            correct: targetCorrect,
            explanation: `Căn cứ theo Giáo trình Sản khoa Sau đại học (Tập 1 - Sản khoa), ĐH Y Dược Huế - Bài 10: Thai lạc chỗ. Mọi quyết định điều trị nội khoa (MTX), phẫu thuật bảo tồn (Salpingostomy) hay cắt vòi tử cung đều phải tuân thủ nghiêm ngặt chỉ định dựa trên huyết động, beta-hCG và hình ảnh siêu âm TVS.`,
            traps: [
              { key: ["A","B","C","D","E"][(targetCorrect+1)%5], trap: "[qua_xam_lan] Can thiệp phẫu thuật quá mức hoặc nạo hút không đúng chỉ định gây tổn thương tàn phá" },
              { key: ["A","B","C","D","E"][(targetCorrect+2)%5], trap: "[qua_bao_ton] Theo dõi lơ là hoặc cho về nhà khi chưa loại trừ nguy cơ thai vỡ ngập máu ổ bụng" },
              { key: ["A","B","C","D","E"][(targetCorrect+3)%5], trap: "[bo_chong_chi_dinh] Sử dụng thuốc co hồi tử cung hoặc dùng MTX khi có chống chỉ định tuyệt đối" },
              { key: ["A","B","C","D","E"][(targetCorrect+4)%5], trap: "[nham_dan_so] Nhầm lẫn giữa thai ngoài tử cung vỡ với các cấp cứu ngoại khoa như viêm ruột thừa hay nang hoàng thể vỡ" }
            ],
            decision: `Đánh giá toàn diện lâm sàng + beta-hCG + TVS -> Lựa chọn phương án chuẩn mực bảo tồn an toàn tính mạng và khả năng sinh sản của bệnh nhân.`
          });
        }
      }
      return full;
    }

    const QUESTIONS = build100Questions();

    // QUẢN LÝ TIẾN ĐỘ LOCAL STORAGE ĐỘC LẬP
    const STORAGE_KEY = "QUIZ_STATE_bai-10-100ca";
    let state = {
      answers: {},    // { qId: selectedOptionIndex }
      bookmarks: [],  // [ qId ]
      notes: {},      // { qId: text }
      currentIndex: 0,
      filter: 'all'
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.error("Lỗi đọc LocalStorage", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Lỗi ghi LocalStorage", e);
      }
    }

    // KHỞI TẠO VÀ RENDER GIAO DIỆN
    function initApp() {
      loadState();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function renderCurrentQuestion() {
      const q = QUESTIONS[state.currentIndex];
      if (!q) return;

      // Header info
      document.getElementById("case-title").textContent = `Ca ${q.id < 10 ? '0' + q.id : q.id}`;
      document.getElementById("case-bloom").textContent = q.bloom;
      document.getElementById("case-stem").textContent = q.stem;
      document.getElementById("case-question").textContent = q.question;
      document.getElementById("current-badge").textContent = `Ca ${q.id}/100`;
      document.getElementById("footer-index").textContent = `${q.id} / 100`;

      // Cập nhật Bookmark star
      const isStarred = state.bookmarks.includes(q.id);
      const starIcon = document.getElementById("star-icon");
      const starBtn = document.getElementById("star-btn");
      if (isStarred) {
        starIcon.classList.add("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.add("border-amber-300", "bg-amber-50");
      } else {
        starIcon.classList.remove("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.remove("border-amber-300", "bg-amber-50");
      }

      // Render 5 Options A-E
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      const letters = ["A", "B", "C", "D", "E"];
      const userAnswer = state.answers[q.id];
      const isAnswered = (userAnswer !== undefined);

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = `w-full text-left p-3 rounded-xl border text-xs font-medium flex items-start gap-2.5 transition-all active:scale-[0.99] min-h-[48px] `;
        
        let borderClass = "border-slate-200 bg-white hover:border-teal-300 hover:bg-teal-50/30 text-slate-700";
        let letterBadge = "bg-slate-100 text-slate-700 border-slate-200";

        if (isAnswered) {
          if (idx === q.correct) {
            borderClass = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-semibold ring-1 ring-emerald-500";
            letterBadge = "bg-emerald-600 text-white border-emerald-600";
          } else if (idx === userAnswer) {
            borderClass = "border-rose-500 bg-rose-50/80 text-rose-900 font-semibold ring-1 ring-rose-500";
            letterBadge = "bg-rose-600 text-white border-rose-600";
          } else {
            borderClass = "border-slate-200 bg-slate-50/50 text-slate-400 opacity-60";
            letterBadge = "bg-slate-100 text-slate-400 border-slate-200";
          }
        }

        btn.className += borderClass;
        btn.onclick = () => selectOption(idx);
        btn.disabled = isAnswered;

        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md border text-[11px] font-bold shrink-0 mt-0.5 ${letterBadge}">
            ${letters[idx]}
          </span>
          <span class="leading-relaxed flex-1">${optText}</span>
        `;
        container.appendChild(btn);
      });

      // Bung khối giải thích nếu đã trả lời
      const expBox = document.getElementById("explanation-box");
      if (isAnswered) {
        expBox.classList.remove("hidden");
        document.getElementById("exp-text").textContent = q.explanation;
        document.getElementById("decision-text").textContent = q.decision;

        // Render traps
        const trapsList = document.getElementById("traps-list");
        trapsList.innerHTML = "";
        q.traps.forEach(t => {
          const item = document.createElement("div");
          item.className = "p-2 rounded bg-slate-50 border border-slate-100 flex items-start gap-1.5 text-slate-600";
          item.innerHTML = `<span class="font-bold text-rose-600 shrink-0">[Lựa chọn ${t.key}]:</span> <span>${t.trap}</span>`;
          trapsList.appendChild(item);
        });

        // Điền ghi chú cá nhân
        document.getElementById("personal-note").value = state.notes[q.id] || "";
      } else {
        expBox.classList.add("hidden");
      }

      // Nút Trước / Tiếp
      document.getElementById("prev-btn").disabled = (state.currentIndex === 0);
      document.getElementById("next-btn").disabled = (state.currentIndex === QUESTIONS.length - 1);
    }

    function selectOption(idx) {
      const q = QUESTIONS[state.currentIndex];
      if (state.answers[q.id] !== undefined) return;

      state.answers[q.id] = idx;
      saveState();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function navigate(step) {
      const newIdx = state.currentIndex + step;
      if (newIdx >= 0 && newIdx < QUESTIONS.length) {
        state.currentIndex = newIdx;
        saveState();
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      state.currentIndex = idx;
      saveState();
      renderCurrentQuestion();
      toggleGridModal(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleBookmark() {
      const q = QUESTIONS[state.currentIndex];
      const pos = state.bookmarks.indexOf(q.id);
      if (pos > -1) {
        state.bookmarks.splice(pos, 1);
      } else {
        state.bookmarks.push(q.id);
      }
      saveState();
      renderCurrentQuestion();
      renderGridCells();
    }

    function saveCurrentNote() {
      const q = QUESTIONS[state.currentIndex];
      const val = document.getElementById("personal-note").value;
      state.notes[q.id] = val;
      saveState();
    }

    function updateProgress() {
      let correct = 0;
      let wrong = 0;
      Object.entries(state.answers).forEach(([qId, ans]) => {
        const q = QUESTIONS.find(item => item.id === parseInt(qId));
        if (q) {
          if (ans === q.correct) correct++;
          else wrong++;
        }
      });
      const total = QUESTIONS.length;
      document.getElementById("progress-correct").style.width = `${(correct / total) * 100}%`;
      document.getElementById("progress-wrong").style.width = `${(wrong / total) * 100}%`;
    }

    function renderGridCells() {
      const grid = document.getElementById("grid-cells");
      grid.innerHTML = "";

      QUESTIONS.forEach((q, idx) => {
        // Kiểm tra điều kiện lọc
        if (state.filter === 'starred' && !state.bookmarks.includes(q.id)) return;
        if (state.filter === 'wrong') {
          const ans = state.answers[q.id];
          if (ans === undefined || ans === q.correct) return;
        }
        if (state.filter === 'part1' && q.part !== 1) return;
        if (state.filter === 'part2' && q.part !== 2) return;

        const cell = document.createElement("button");
        cell.className = `h-8 rounded text-[11px] font-bold flex flex-col items-center justify-center relative transition-all border `;
        
        const ans = state.answers[q.id];
        const isCurrent = (idx === state.currentIndex);

        if (ans !== undefined) {
          if (ans === q.correct) {
            cell.className += "bg-emerald-500 text-white border-emerald-600";
          } else {
            cell.className += "bg-rose-500 text-white border-rose-600";
          }
        } else {
          cell.className += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
        }

        if (isCurrent) {
          cell.className += " ring-2 ring-teal-600 ring-offset-1";
        }

        cell.textContent = q.id;

        // Dấu sao nếu bookmark
        if (state.bookmarks.includes(q.id)) {
          const starBadge = document.createElement("span");
          starBadge.className = "absolute -top-1 -right-1 text-[8px] text-amber-400 font-extrabold";
          starBadge.textContent = "★";
          cell.appendChild(starBadge);
        }

        cell.onclick = () => jumpToQuestion(idx);
        grid.appendChild(cell);
      });
    }

    function setFilter(flt) {
      state.filter = flt;
      ['all', 'starred', 'wrong', 'part1', 'part2'].forEach(item => {
        const btn = document.getElementById(`flt-${item}`);
        if (item === flt) {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-xs font-semibold";
        } else {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold";
        }
      });
      renderGridCells();
    }

    function toggleGridModal(show) {
      const modal = document.getElementById("grid-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderGridCells();
      } else {
        modal.classList.add("hidden");
      }
    }

    // Hỗ trợ vuốt tay chuyển câu trên Mobile (Touch Swipe)
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) navigate(1);  // Vuốt sang trái -> Câu tiếp theo
        else navigate(-1);          // Vuốt sang phải -> Câu trước
      }
    }

    // Khởi chạy khi tải trang
    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
