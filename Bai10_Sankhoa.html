<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quiz 100 Ca Lâm Sàng: Thai Lạc Chỗ (Bài 10)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3 py-2.5 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-teal-600 text-white font-bold text-sm shadow-sm">
          10
        </span>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">Thai Lạc Chỗ (100 Ca)</h1>
          <p class="text-[11px] text-slate-500 font-medium">Sản Sau đại học • ĐH Y Dược Huế</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="star-btn" onclick="toggleBookmark()" class="p-2 rounded-lg border border-slate-200 text-slate-400 hover:text-amber-500 hover:border-amber-300 transition-colors">
          <svg id="star-icon" class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
          </svg>
        </button>
        <button onclick="toggleGridModal(true)" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold transition-colors">
          <span id="current-badge">Ca 1/100</span>
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Thanh tiến độ -->
    <div class="max-w-xl mx-auto mt-2">
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden flex">
        <div id="progress-correct" class="bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        <div id="progress-wrong" class="bg-rose-500 transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- BỘ LỌC CHUYÊN ĐỀ DẠNG CUỘN NGANG -->
  <div class="bg-white border-b border-slate-200 sticky top-[57px] z-20">
    <div class="max-w-xl mx-auto px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar text-[11px] font-semibold text-slate-600">
      <button onclick="setFilter('all')" id="flt-all" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-xs">Tất cả (100)</button>
      <button onclick="setFilter('starred')" id="flt-starred" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Đã nhớ (★)</button>
      <button onclick="setFilter('wrong')" id="flt-wrong" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Làm sai</button>
      <button onclick="setFilter('part1')" id="flt-part1" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Mức 3–4 (Ca 1–50)</button>
      <button onclick="setFilter('part2')" id="flt-part2" class="px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700">Mức 5 Thẩm định (Ca 51–100)</button>
    </div>
  </div>

  <!-- NỘI DUNG CHÍNH (VERTICAL VIEW) -->
  <main class="flex-1 max-w-xl w-full mx-auto p-3 pb-24 flex flex-col gap-3">

    <!-- KHUNG TÌNH HUỐNG LÂM SÀNG -->
    <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-xs">
      <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100">
        <div class="flex items-center gap-1.5">
          <span id="case-title" class="text-xs font-bold px-2 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200">Ca 01</span>
          <span id="case-bloom" class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Mức 3-4</span>
        </div>
        <span id="case-source" class="text-[10px] text-slate-400 font-medium">Giáo trình Huế</span>
      </div>
      
      <!-- Nội dung Stem -->
      <div id="case-stem" class="text-[13px] leading-relaxed text-slate-700 space-y-1.5">
        <!-- JS fill stem -->
      </div>

      <!-- Câu hỏi -->
      <div id="case-question" class="mt-3 pt-2.5 border-t border-slate-100 text-[13.5px] font-semibold text-slate-900 leading-snug">
        <!-- JS fill question -->
      </div>
    </div>

    <!-- 5 PHƯƠNG ÁN LỰA CHỌN A-E -->
    <div id="options-container" class="space-y-2">
      <!-- JS fill 5 options -->
    </div>

    <!-- KHỐI BIỆN LUẬN & PHÂN TÍCH BẪY (BUNG KHI CHỌN) -->
    <div id="explanation-box" class="hidden bg-white rounded-xl border border-slate-200 p-3.5 shadow-xs space-y-3">
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-700 mb-1">
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Biện luận lâm sàng & Nguồn trích dẫn
        </div>
        <p id="exp-text" class="text-xs text-slate-600 leading-relaxed pl-5 border-l-2 border-emerald-500">
          <!-- JS fill explanation -->
        </p>
      </div>

      <!-- Bảng gán mã bẫy -->
      <div>
        <div class="text-[11px] font-bold text-slate-700 mb-1.5 uppercase tracking-wider flex items-center gap-1">
          <span>Giải mã cạm bẫy lâm sàng</span>
        </div>
        <div id="traps-list" class="space-y-1.5 text-xs">
          <!-- JS fill traps -->
        </div>
      </div>

      <!-- Chốt quyết định -->
      <div id="decision-box" class="bg-amber-50/70 border border-amber-200 rounded-lg p-2.5 text-xs text-amber-900">
        <span class="font-bold text-amber-800">Chốt quyết định: </span>
        <span id="decision-text"></span>
      </div>

      <!-- Ghi chú cá nhân -->
      <div class="pt-2 border-t border-slate-100">
        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Ghi chú cá nhân cho ca này (tự lưu):</label>
        <textarea id="personal-note" oninput="saveCurrentNote()" placeholder="Nhập kinh nghiệm, mẹo nhớ ca này..." class="w-full text-xs p-2 border border-slate-200 rounded-lg focus:ring-1 focus:ring-teal-500 focus:border-teal-500 outline-none resize-none h-16 bg-slate-50/50"></textarea>
      </div>
    </div>

  </main>

  <!-- BOTTOM FLOATING ACTION BAR -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 py-2 px-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <button onclick="navigate(-1)" id="prev-btn" class="flex-1 py-2.5 px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition-all active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none">
        ← Trước
      </button>

      <button onclick="toggleGridModal(true)" class="py-2.5 px-4 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold flex items-center gap-1.5 shadow-xs transition-colors">
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
        <span id="footer-index">1 / 100</span>
      </button>

      <button onclick="navigate(1)" id="next-btn" class="flex-1 py-2.5 px-3 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold transition-all active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none shadow-xs">
        Tiếp →
      </button>
    </div>
  </footer>

  <!-- MODAL BOTTOM SHEET: 100 Ô SỐ CHỌN CA -->
  <div id="grid-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden flex items-end justify-center transition-opacity">
    <div class="bg-white rounded-t-2xl w-full max-w-xl max-h-[80vh] flex flex-col p-4 shadow-xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-sm font-bold text-slate-900">Danh sách 100 Ca Lâm Sàng</h3>
          <p class="text-[11px] text-slate-500">Chạm vào số ca để chuyển nhanh</p>
        </div>
        <button onclick="toggleGridModal(false)" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Grid 100 nút ca -->
      <div id="grid-cells" class="grid grid-cols-10 gap-1.5 py-3 overflow-y-auto custom-scrollbar flex-1">
        <!-- JS fill 100 buttons -->
      </div>

      <!-- Chú thích màu -->
      <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-500">
        <div class="flex items-center gap-1">
          <span class="w-2.5 h-2.5 rounded bg-emerald-500 inline-block"></span> Đúng
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2.5 h-2.5 rounded bg-rose-500 inline-block"></span> Sai
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2.5 h-2.5 rounded bg-slate-200 inline-block"></span> Chưa làm
        </div>
        <div class="flex items-center gap-1">
          <span class="text-amber-500 font-bold">★</span> Đã nhớ
        </div>
      </div>
    </div>
  </div>

  <script>
    // DỮ LIỆU ĐÃ TRỘN ĐÁP ÁN (100 CA: 50 CA MỨC 3-4 + 50 CA MỨC 5 THẨM ĐỊNH)
    // Đáp án đúng luân phiên phân bố theo chu kỳ: C (2), E (4), B (1), D (3), A (0)
    const RAW_QUESTIONS = [
      // ==========================================
      // PHẦN I: CA 01 -> 50 (MỨC ĐỘ 3 - 4)
      // ==========================================
      {
        id: 1, part: 1, bloom: "Mức 3-4",
        stem: "Bệnh nhân nữ 31 tuổi, PARA 1011, tiền sử phẫu thuật vi phẫu phục hồi vòi tử cung trái cách đây 2 năm do tắc vòi sau nhiễm trùng khung chậu. Bệnh nhân vào viện vì trễ kinh 6 tuần, ra máu âm đạo rỉ rả màu nâu đen 3 ngày nay kèm đau tức âm
