<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sản Khoa Quiz - Bài 08 (V4.1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #main-content {
      touch-action: pan-y pinch-zoom;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased selection:bg-teal-100 selection:text-teal-900 overflow-hidden">

  <!-- TOP MINIMAL BAR -->
  <header class="shrink-0 h-12 bg-white border-b border-slate-200 px-3.5 flex items-center justify-between z-20 shadow-xs">
    <div class="flex items-center gap-2">
      <span id="case-counter" class="text-xs font-bold text-teal-800 bg-teal-50 border border-teal-200/80 px-2 py-0.5 rounded-md font-mono">
        Ca 01/50
      </span>
      <select id="filter-select" onchange="changeFilter(this.value)" class="text-xs font-medium bg-slate-100 border border-slate-200 rounded-md px-2 py-1 text-slate-700 outline-none focus:border-teal-500">
        <option value="all">Tất cả (50)</option>
        <option value="starred">Đã nhớ (Sao)</option>
        <option value="unanswered">Chưa làm</option>
        <option value="wrong">Làm sai</option>
      </select>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="toggleStarCurrent()" id="star-btn" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-amber-500 transition" title="Ghi nhớ ca này">
        <svg id="star-icon" class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
      <button onclick="promptReset()" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-rose-500 transition" title="Làm lại bài thi">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- PROGRESS LINE -->
  <div class="w-full bg-slate-100 h-0.5 shrink-0">
    <div id="progress-line" class="h-0.5 bg-teal-600 transition-all duration-200" style="width: 0%;"></div>
  </div>

  <!-- MAIN SCROLLABLE CONTENT (VERTICAL MOBILE FIRST) -->
  <main id="main-content" class="flex-1 overflow-y-auto custom-scroll p-3.5 pb-20 max-w-xl w-full mx-auto space-y-3">
    
    <!-- Header: CHỈ DUY NHẤT SỐ THỨ TỰ (Ca XX) & Mức độ -->
    <div class="flex items-center justify-between border-b border-slate-200/60 pb-2">
      <h1 id="case-title" class="text-sm font-bold text-slate-900 tracking-tight font-mono">
        Ca 01
      </h1>
      <span id="case-level" class="text-[10px] font-semibold text-teal-700 bg-teal-50 border border-teal-200/70 px-2 py-0.5 rounded-full shrink-0">
        Nội trú BSNT | Vận dụng cao
      </span>
    </div>

    <!-- Vignette Box -->
    <div class="bg-amber-50/80 border border-amber-200/70 rounded-xl p-3 text-slate-800">
      <div class="text-[10px] font-bold uppercase tracking-wider text-amber-800 mb-1 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        Tình huống lâm sàng
      </div>
      <p id="case-vignette" class="text-xs sm:text-[13px] leading-relaxed text-justify">
        ...
      </p>
    </div>

    <!-- 5 Options (A, B, C, D, E) -->
    <div id="options-box" class="space-y-2 pt-1">
      <!-- Injected dynamically -->
    </div>

    <!-- Explanation Box (Hiện sau khi chọn) -->
    <div id="explanation-container" class="hidden space-y-3 pt-1 transition-all">
      <div id="status-badge" class="p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2"></div>
      
      <!-- Biện luận y khoa & Nguồn -->
      <div class="bg-white border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-700 space-y-1.5 shadow-xs">
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-700 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
          </svg>
          Biện luận y khoa & nguồn trích dẫn
        </div>
        <p id="explanation-text" class="text-justify text-slate-600 leading-relaxed"></p>
        <p id="explanation-source" class="text-[11px] font-medium text-slate-400 italic pt-1 border-t border-slate-100"></p>
      </div>

      <!-- Bảng gán mã bẫy lâm sàng -->
      <div class="bg-white border border-rose-100 rounded-xl p-3 text-xs leading-relaxed text-slate-700 space-y-1.5 shadow-xs">
        <div class="text-[10px] font-bold uppercase tracking-wider text-rose-700 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Phân tích cạm bẫy lâm sàng (Phương án nhiễu)
        </div>
        <div id="traps-table" class="space-y-1.5 pt-1 text-[11px]"></div>
      </div>

      <!-- Chốt quyết định & Tự kiểm -->
      <div class="bg-teal-50/70 border border-teal-200/80 rounded-xl p-3 text-xs leading-relaxed text-teal-900 space-y-1 shadow-xs">
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-800 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Chốt quyết định & Tự kiểm tra
        </div>
        <div id="decision-text" class="text-[11px] text-teal-950 font-medium whitespace-pre-line leading-relaxed"></div>
      </div>
    </div>

    <!-- Personal Notes Box -->
    <div class="pt-1">
      <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
        <span class="flex items-center gap-1">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Ghi chú ca này
        </span>
        <span id="note-saved-hint" class="text-teal-600 font-semibold opacity-0 transition-opacity text-[10px]">Đã lưu</span>
      </div>
      <textarea id="note-input" oninput="saveNote(this.value)" placeholder="Ghi nhớ điểm then chốt hoặc bẫy cần tránh cho ca này..." class="w-full h-14 p-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-teal-500 resize-none font-sans"></textarea>
    </div>

  </main>

  <!-- BOTTOM FLOATING NAV BAR -->
  <footer class="fixed bottom-0 inset-x-0 h-13 bg-white/95 backdrop-blur border-t border-slate-200 px-3 flex items-center justify-between max-w-xl mx-auto z-20">
    <button onclick="prevCase()" class="h-9 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 active:scale-95 transition flex items-center gap-1">
      <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Trước
    </button>

    <button onclick="openJumpModal()" class="h-9 px-3.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-800 text-xs font-bold active:scale-95 transition flex items-center gap-1.5 font-mono">
      <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span id="bottom-counter">1 / 50</span>
    </button>

    <button onclick="nextCase()" class="h-9 px-3 rounded-lg bg-teal-600 text-white text-xs font-semibold active:scale-95 transition flex items-center gap-1 shadow-xs shadow-teal-600/30">
      Tiếp <svg class="w-3 h-3 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </footer>

  <!-- MODAL JUMP GRID -->
  <div id="jump-modal" class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl max-w-md w-full max-h-[75vh] flex flex-col border border-slate-200 shadow-xl overflow-hidden">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800">Chọn nhanh ca bệnh (1 - 50)</span>
        <button onclick="closeJumpModal()" class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xs">
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="p-3 overflow-y-auto custom-scroll flex-1">
        <div id="grid-container" class="grid grid-cols-5 sm:grid-cols-6 gap-1.5">
          <!-- Injected dynamically -->
        </div>
      </div>

      <div class="p-2 border-t border-slate-200 bg-slate-50 text-[10px] flex items-center justify-around text-slate-500 font-medium">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Đúng</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Sai</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-200"></span> Chưa làm</span>
        <span class="flex items-center gap-1"><span class="text-amber-500 font-bold">★</span> Đã nhớ</span>
      </div>
    </div>
  </div>

  <!-- SCRIPT DATA & APP LOGIC -->
  <script>
    // 50 Clinical Cases Data Bài 08 V4.1 (Không có dòng chủ đề sau Ca XX, 5 lựa chọn A-E)
    const cases = [
      {
        id: 1,
        title: "Ca 01",
        level: "Nội trú BSNT | Vận dụng cao",
        vignette: "Sản phụ 28 tuổi, con so, mang thai 8 tuần 4 ngày theo siêu âm quý 1. Bệnh nhân vào viện vì xuất hiện ra máu âm đạo rỉ rả màu nâu nhạt 2 ngày nay kèm đau tức nhẹ vùng hạ vị. Tiền sử chưa ghi nhận bệnh lý nội ngoại khoa, không dùng thuốc tránh thai trước mang thai. Thăm khám lâm sàng: Huyết động ổn định, HA 115/70 mmHg, mạch 76 lần/phút. Khám mỏ vịt: Cổ tử cung đóng kín, màu tím nhẹ, có ít dịch máu nâu ở cùng đồ sau. Khám hai tay: Tử cung to tương đương tuổi thai, mềm, ấn không đau chói, hai phần phụ mềm. Siêu âm TVS: Buồng tử cung có 01 thai sống, CRL = 20 mm, tim thai 165 lần/phút. Cạnh bờ dưới túi thai có vùng trống âm hình lưỡi liềm kích thước 12 x 5 mm, bóc tách màng đệm chiếm 15% diện tích túi thai. Kế hoạch quản lý và can thiệp sản khoa nào sau đây là phù hợp nhất cho sản phụ này?",
        options: {
          A: "Nằm nghỉ ngơi tương đối, bổ sung Progesterone tự nhiên đường âm đạo, theo dõi triệu chứng chảy máu.",
          B: "Tiêm tĩnh mạch Oxytocin duy trì co hồi tử cung, cho nằm nghỉ ngơi tuyệt đối, hẹn siêu âm sau hai tuần.",
          C: "Nạo hút buồng tử cung bằng máy hút chân không MVA cấp cứu, cho dùng kháng sinh phổ rộng đường uống.",
          D: "Nằm nghỉ ngơi tuyệt đối tại giường, tiêm bắp Methotrexate liều đơn, xét nghiệm lại beta-hCG sau 48 giờ.",
          E: "Cho nhập viện nằm nghỉ ngơi hoàn toàn, đặt vòng nâng cổ tử cung Pessary, cho dùng thuốc giảm co Salbutamol."
        },
        correct: "A",
        traps: [
          { opt: "B", code: "qua_bao_ton", desc: "Dùng Oxytocin trong dọa sẩy thai là chống chỉ định vì làm co bóp tử cung gây tống xuất thai." },
          { opt: "C", code: "qua_xam_lan", desc: "Nạo hút thai khi thai vẫn đang sống và bóc tách nhẹ là hành động xâm lấn phá thai nhầm nghiêm trọng." },
          { opt: "D", code: "sai_tang", desc: "Tiêm Methotrexate chỉ dùng cho thai ngoài tử cung, hoàn toàn sai chỉ định cho thai trong tử cung sống." },
          { opt: "E", code: "qua_xam_lan", desc: "Đặt Pessary và Salbutamol không có chỉ định cho dọa sẩy thai quý 1 bóc tách nhỏ." }
        ],
        decision: "• Thai 8w4d sống + bóc tách màng đệm 15% (< 20%) + CTC đóng -> Dọa sẩy thai nhẹ -> Bắt buộc điều trị bảo tồn với Progesterone + nghỉ ngơi.\n• Thai trong tử cung sống -> Loại trừ Nạo hút MVA (C), loại trừ Methotrexate (D).\n• Chưa có cơn co tử cung chuyển dạ -> Chống chỉ định Oxytocin (B).",
        explanation: "Bệnh nhân được chẩn đoán Dọa sẩy thai quý 1 mức độ nhẹ (bóc tách màng đệm 15% < 20%, thai sống, CTC đóng kín). Phác đồ xử trí chuẩn mực theo Giáo trình Sản khoa Huế (Bài 08): Điều trị bảo tồn bao gồm nằm nghỉ ngơi, bổ sung Progesterone (dạng vi hạt đặt âm đạo hoặc uống) để hỗ trợ hoàng thể và theo dõi diễn tiến lâm sàng. Không dùng Oxytocin (gây co bóp tử cung tống thai), không nạo hút thai hay tiêm MTX.",
        source: "Giáo trình Sản khoa Sau đại học (Tập 1 - Sản khoa), Đại học Y Dược Huế - Bài 08: Thất bại thai kỳ (Mục 4.3)."
      },
      {
        id: 2,
        title: "Ca 02",
        level: "Nội trú BSNT | Phân tích",
        vignette: "Sản phụ 26 tuổi, mang thai lần đầu, thai 9 tuần 2 ngày theo siêu âm quý 1. Bệnh nhân nhập viện vì ra máu âm đạo tươi lượng ít kèm đau trằn nhẹ bụng dưới. Khám lâm sàng: HA 110/70 mmHg, mạch 78 lần/phút. Mỏ vịt ghi nhận có ít máu tươi từ lỗ cổ tử cung chảy ra, cổ tử cung dài đóng kín. Siêu âm TVS: Buồng tử cung có 01 thai sống, CRL = 25 mm, tim thai 170 lần/phút, không thấy tụ máu dưới màng đệm. Xét nghiệm nhóm máu của sản phụ: Nhóm máu O, Rhesus âm. Xét nghiệm nhóm máu của người chồng: Nhóm máu A, Rhesus dương. Xét nghiệm Coombs gián tiếp ở sản phụ cho kết quả Âm tính. Bên cạnh việc dùng thuốc hỗ trợ hoàng thể, can thiệp dự phòng bắt buộc nào cần thực hiện cho sản phụ?",
        options: {
          A: "Tiêm bắp Anti-D Immunoglobulin cho sản phụ trong vòng 72 giờ kể từ khi xuất hiện chảy máu âm đạo.",
          B: "Truyền khối hồng cầu Rhesus âm cùng nhóm máu ngay để dự phòng tình trạng thiếu máu cấp tính.",
          C: "Tiêm tĩnh mạch Dexamethasone liều cao để ức chế phản ứng miễn dịch đồng chủng giữa mẹ và thai.",
          D: "Cho sản phụ uống Aspirin liều thấp phối hợp Heparin trọng lượng phân tử thấp tiêm dưới da hàng ngày.",
          E: "Tiêm vắc xin uốn ván mũi đầu tiên ngay tại thời điểm nhập viện để dự phòng nhiễm trùng uốn ván."
        },
        correct: "A",
        traps: [
          { opt: "B", code: "bat_tu_khoa", desc: "Bắt từ khóa RhD âm rồi vội vàng chọn truyền máu dù sản phụ không thiếu máu." },
          { opt: "C", code: "bo_chong_chi_dinh", desc: "Corticoid Dexamethasone không có vai trò ngăn ngừa mẫn cảm RhD và chống chỉ định liều cao." },
          { opt: "D", code: "nham_dan_so", desc: "Aspirin + LMWH là phác đồ cho Hội chứng Kháng Phospholipid (APS), không phải dự phòng RhD." },
          { opt: "E", code: "sai_thu_tu", desc: "Tiêm vắc xin uốn ván thực hiện ở quý 2 (tuần 20 trở đi), không tiêm ở tuần 9 cấp cứu." }
        ],
        decision: "• Mẹ RhD(-) + Bố RhD(+) + Coombs gián tiếp (-) + Đang chảy máu âm đạo -> Bắt buộc tiêm dự phòng Anti-D Immunoglobulin trong 72h.\n• HA 110/70 mmHg, không thiếu máu -> Loại truyền khối hồng cầu (B).\n• Chưa chẩn đoán APS -> Loại Aspirin + LMWH (D).",
        explanation: "Theo Giáo trình Sản khoa Huế (Bài 06 & Bài 08): Mọi sản phụ có nhóm máu RhD(-) chưa bị mẫn cảm (Coombs gián tiếp âm tính) khi có biến cố xuất huyết thai kỳ (dọa sẩy thai, sẩy thai, thai ngoài tử cung, chấn thương) đều bắt buộc phải tiêm dự phòng Anti-D Immunoglobulin (liều 125 mcg hoặc 300 mcg) trong vòng 72 giờ để ngăn ngừa cơ thể mẹ tạo kháng thể kháng RhD chống lại thai nhi.",
        source: "Giáo trình Sản khoa Sau đại học (Tập 1 - Sản khoa), Đại học Y Dược Huế - Bài 06 (tr. 78) & Bài 08: Thất bại thai kỳ."
      },
      {
        id: 3,

    // HỆ THỐNG XÁO TRỘN ĐÁP ÁN ĐỒNG BỘ (SYSTEMATIC SHUFFLE ENGINE):
    // Phân bổ đều vị trí đáp án đúng qua 50 ca: đúng 10 A, 10 B, 10 C, 10 D, 10 E.
    // Tự động hoán vị nội dung lựa chọn, cập nhật key 'correct', đồng bộ bảng mã bẫy 'traps'
    // và làm sạch ký hiệu chữ cái cũ trong phần chốt quyết định.
    (function systematicallyShuffleCases() {
      const targetCycle = ['C', 'E', 'B', 'D', 'A']; // Tuần hoàn 5 vị trí: 10 vòng = 50 ca

      cases.forEach((c, idx) => {
        const target = targetCycle[idx % 5];
        if (target !== 'A') {
          // Hoán đổi nội dung giữa phương án A (đáp án đúng gốc) và phương án target
          const correctText = c.options['A'];
          const swapText = c.options[target];

          c.options[target] = correctText;
          c.options['A'] = swapText;
          c.correct = target;

          // Cập nhật bảng bẫy lâm sàng: Phương án nhiễu tại 'target' nay đã chuyển sang 'A'
          c.traps.forEach(trap => {
            if (trap.opt === target) {
              trap.opt = 'A';
            }
          });
          // Sắp xếp lại bảng bẫy theo thứ tự A, B, C, D, E
          c.traps.sort((t1, t2) => t1.opt.localeCompare(t2.opt));
        }

        // Tinh chỉnh phần chốt quyết định: loại bỏ nhãn (A), (B),... cũ để tránh lệch chữ cái
        if (c.decision) {
          c.decision = c.decision.replace(/\s*\([A-E]\)/g, '');
        }
      });
    })();

    // PHÂN TÁCH BỘ NHỚ ĐỘC LẬP THEO TÊN FILE HTML
    const PAGE_NAME = window.location.pathname.split('/').pop().replace('.html', '').toLowerCase() || 'bai-08-v4';
    const STORAGE_KEY = `QUIZ_STATE_${PAGE_NAME}_SHUFFLED`;

    // App State
    let state = {
      answers: {},    // { [caseId]: 'A'|'B'|'C'|'D'|'E' }
      starred: {},    // { [caseId]: boolean }
      notes: {},      // { [caseId]: string }
      index: 0
    };

    let currentFilter = 'all';
    let saveTimeout = null;

    // Load state từ LocalStorage
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          if (!(typeof state.index === 'number' && state.index >= 0 && state.index < cases.length)) {
            state.index = 0;
          }
        }
      } catch (err) {
        console.error("Lỗi đọc LocalStorage", err);
      }
    }

    // Save state vào LocalStorage
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error("Lỗi ghi LocalStorage", err);
      }
    }

    // Bộ lọc
    function getFilteredList() {
      return cases.map((c, i) => {
        const ans = state.answers[c.id];
        const isStarred = !!state.starred[c.id];
        const isAnswered = !!ans;
        const isCorrect = isAnswered && ans === c.correct;

        if (currentFilter === 'all') return i;
        if (currentFilter === 'starred') return isStarred ? i : null;
        if (currentFilter === 'unanswered') return !isAnswered ? i : null;
        if (currentFilter === 'wrong') return (isAnswered && !isCorrect) ? i : null;
        return i;
      }).filter(i => i !== null);
    }

    function changeFilter(val) {
      currentFilter = val;
      const list = getFilteredList();
      if (list.length > 0 && !list.includes(state.index)) {
        state.index = list[0];
      }
      render();
      saveState();
    }

    // Điều hướng
    function prevCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos > 0) state.index = list[pos - 1];
      else state.index = list[list.length - 1];
      render();
      saveState();
      scrollTop();
    }

    function nextCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos < list.length - 1) state.index = list[pos + 1];
      else state.index = list[0];
      render();
      saveState();
      scrollTop();
    }

    function jumpTo(idx) {
      state.index = idx;
      closeJumpModal();
      render();
      saveState();
      scrollTop();
    }

    function scrollTop() {
      const el = document.getElementById('main-content');
      if (el) el.scrollTop = 0;
    }

    // Chọn đáp án
    function chooseOption(letter) {
      const c = cases[state.index];
      state.answers[c.id] = letter;
      saveState();
      render();
    }

    // Bookmark / Star
    function toggleStarCurrent() {
      const c = cases[state.index];
      state.starred[c.id] = !state.starred[c.id];
      saveState();
      renderStarUI();
    }

    function renderStarUI() {
      const c = cases[state.index];
      const isStarred = !!state.starred[c.id];
      const icon = document.getElementById('star-icon');
      const btn = document.getElementById('star-btn');
      if (isStarred) {
        icon.classList.remove('fill-none', 'text-slate-400');
        icon.classList.add('fill-amber-400', 'text-amber-500');
        btn.classList.add('bg-amber-50', 'border-amber-300');
      } else {
        icon.classList.remove('fill-amber-400', 'text-amber-500');
        icon.classList.add('fill-none', 'text-slate-400');
        btn.classList.remove('bg-amber-50', 'border-amber-300');
      }
    }

    // Ghi chú
    function saveNote(val) {
      const c = cases[state.index];
      state.notes[c.id] = val;
      saveState();

      const hint = document.getElementById('note-saved-hint');
      if (hint) {
        hint.style.opacity = '1';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => { hint.style.opacity = '0'; }, 1000);
      }
    }

    // Đặt lại tiến độ
    function promptReset() {
      if (window.confirm("Bạn có muốn xóa kết quả đã tick để luyện lại từ đầu? (Ghi chú cá nhân vẫn được bảo lưu)")) {
        state.answers = {};
        state.starred = {};
        state.index = 0;
        saveState();
        render();
      }
    }

    // Render ca bệnh hiện tại
    function render() {
      const c = cases[state.index];
      if (!c) return;

      const userAns = state.answers[c.id];
      const isAnswered = !!userAns;
      const isCorrect = userAns === c.correct;

      // Cập nhật số thứ tự (chỉ giữ "Ca XX")
      const currentNum = c.id < 10 ? '0' + c.id : c.id;
      document.getElementById('case-counter').innerText = `Ca ${currentNum}/50`;
      document.getElementById('bottom-counter').innerText = `${c.id} / 50`;
      document.getElementById('case-title').innerText = `Ca ${currentNum}`;
      document.getElementById('case-level').innerText = c.level;
      
      document.getElementById('case-vignette').innerText = c.vignette;

      // Tiến độ tổng
      const answeredCount = Object.keys(state.answers).length;
      document.getElementById('progress-line').style.width = `${Math.round((answeredCount / cases.length) * 100)}%`;

      // Render 5 phương án A-B-C-D-E
      const optionsBox = document.getElementById('options-box');
      const letters = ['A', 'B', 'C', 'D', 'E'];
      let html = '';

      letters.forEach(letter => {
        const text = c.options[letter];
        let btnCls = "w-full text-left p-3 min-h-[48px] rounded-xl border text-xs sm:text-[13px] font-medium transition flex items-center gap-2.5 active:scale-[0.99] ";
        let badgeCls = "w-6 h-6 rounded-md font-bold flex items-center justify-center shrink-0 text-xs font-mono ";

        if (!isAnswered) {
          btnCls += "border-slate-200 bg-white text-slate-700 hover:border-teal-500 hover:bg-slate-50";
          badgeCls += "bg-slate-100 text-slate-600";
        } else {
          if (letter === c.correct) {
            btnCls += "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-1 ring-emerald-400";
            badgeCls += "bg-emerald-600 text-white";
          } else if (letter === userAns) {
            btnCls += "border-rose-400 bg-rose-50 text-rose-950 font-semibold ring-1 ring-rose-400";
            badgeCls += "bg-rose-600 text-white";
          } else {
            btnCls += "border-slate-200 bg-white text-slate-400 opacity-60";
            badgeCls += "bg-slate-100 text-slate-400";
          }
        }

        html += `
          <button onclick="chooseOption('${letter}')" class="${btnCls}">
            <span class="${badgeCls}">${letter}</span>
            <span class="flex-1 py-0.5 leading-snug">${text}</span>
            ${isAnswered && letter === c.correct ? '<span class="text-emerald-600 font-bold ml-1 text-sm">✓</span>' : ''}
            ${isAnswered && letter === userAns && letter !== c.correct ? '<span class="text-rose-500 font-bold ml-1 text-sm">✕</span>' : ''}
          </button>
        `;
      });
      optionsBox.innerHTML = html;

      // Biện luận y khoa & Phân tích bẫy
      const expContainer = document.getElementById('explanation-container');
      const statusBadge = document.getElementById('status-badge');
      const expText = document.getElementById('explanation-text');
      const expSource = document.getElementById('explanation-source');
      const trapsTable = document.getElementById('traps-table');
      const decisionText = document.getElementById('decision-text');

      if (isAnswered) {
        expContainer.classList.remove('hidden');
        if (isCorrect) {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-900";
          statusBadge.innerHTML = `<span class="text-emerald-600 text-base">✓</span> <span>Chính xác! Đáp án đúng là <strong>${c.correct}</strong></span>`;
        } else {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-rose-50 border border-rose-200 text-rose-900";
          statusBadge.innerHTML = `<span class="text-rose-500 text-base">✕</span> <span>Chưa chính xác. Đáp án chuẩn là <strong>${c.correct}</strong></span>`;
        }
        
        expText.innerText = c.explanation;
        expSource.innerText = "Nguồn: " + c.source;

        // Render traps
        let trapHTML = '';
        c.traps.forEach(trap => {
          trapHTML += `
            <div class="p-2 rounded-lg bg-rose-50/60 border border-rose-100 flex items-start gap-2">
              <span class="font-bold text-rose-700 shrink-0 font-mono">[Phương án ${trap.opt}]</span>
              <div class="text-slate-600">
                <span class="font-mono text-rose-600 font-semibold mr-1">[${trap.code}]:</span>
                ${trap.desc}
              </div>
            </div>
          `;
        });
        trapsTable.innerHTML = trapHTML;

        // Render decision
        decisionText.innerText = c.decision;
      } else {
        expContainer.classList.add('hidden');
      }

      // Khôi phục ghi chú & sao
      document.getElementById('note-input').value = state.notes[c.id] || '';
      renderStarUI();
    }

    // Modal Jump Grid
    function openJumpModal() {
      const container = document.getElementById('grid-container');
      let html = '';

      cases.forEach((c, idx) => {
        const ans = state.answers[c.id];
        const isCurrent = idx === state.index;
        const isStarred = !!state.starred[c.id];

        let bg = "bg-white border-slate-200 text-slate-700";
        if (ans) {
          bg = ans === c.correct ? "bg-emerald-500 border-emerald-600 text-white font-semibold" : "bg-rose-500 border-rose-600 text-white font-semibold";
        }
        const currentRing = isCurrent ? " ring-2 ring-teal-500 ring-offset-1 font-bold scale-105 z-10" : "";

        html += `
          <button onclick="jumpTo(${idx})" class="h-10 rounded-xl border text-xs font-mono relative flex items-center justify-center transition active:scale-95 ${bg} ${currentRing}">
            <span>${c.id < 10 ? '0' + c.id : c.id}</span>
            ${isStarred ? '<span class="absolute top-0.5 right-1 text-[10px] text-amber-300 drop-shadow">★</span>' : ''}
          </button>
        `;
      });

      container.innerHTML = html;
      const modal = document.getElementById('jump-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeJumpModal() {
      const modal = document.getElementById('jump-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Hỗ trợ vuốt màn hình (Touch Swipe Gestures)
    let startX = 0;
    let startY = 0;
    const mainEl = document.getElementById('main-content');

    mainEl.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    mainEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - startX;
      const diffY = e.changedTouches[0].screenY - startY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
        if (diffX < 0) nextCase();
        else prevCase();
      }
    }, { passive: true });

    // Phím tắt bàn phím
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') prevCase();
      else if (e.key === 'ArrowRight') nextCase();
      else if (['1', 'a', 'A'].includes(e.key)) chooseOption('A');
      else if (['2', 'b', 'B'].includes(e.key)) chooseOption('B');
      else if (['3', 'c', 'C'].includes(e.key)) chooseOption('C');
      else if (['4', 'd', 'D'].includes(e.key)) chooseOption('D');
      else if (['5', 'e', 'E'].includes(e.key)) chooseOption('E');
      else if (['s', 'S'].includes(e.key)) toggleStarCurrent();
    });

    // Khởi động
    window.onload = function() {
      loadState();
      render();
    };
  </script>
</body>
</html>
