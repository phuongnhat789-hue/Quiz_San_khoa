o thai-Sơ sinh + Chống đờ tử cung."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ ở tuần 12 phá hủy thai kỳ."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Cấm siêu âm Doppler làm bỏ sót biến chứng thai."}, {"letter": "D", "is_starred": true, "trap_text": "[qua_bao_ton] Uống thuốc nam không có giá trị y học."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX đại trà là tử huyệt."}]}, {"id": 50, "title": "CA LÂM SÀNG 50: TƯ VẤN KẾ HOẠCH HÓA GIA ĐÌNH & TRÁNH THAI AN TOÀN SAU SINH ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 2002 (vừa mổ lấy thai song thai DCDA đủ tháng 37 tuần 4 ngày thành công hai bé khỏe mạnh). Sản phụ đang làm thủ tục xuất viện tại khoa Hậu sản Bệnh viện Sản Nhi tỉnh. Tiền sử trước đó đã có 2 con, hiện tại tổng cộng có 4 con và gia đình nguyện vọng không sinh thêm con nữa. Sản phụ đang cho hai con bú hoàn toàn bằng sữa mẹ. Vợ chồng sản phụ tha thiết xin tư vấn về biện pháp tránh thai an toàn dài hạn và lâu dài sau mổ sinh đa thai.", "question": "Câu hỏi 50: Tư vấn biện pháp tránh thai an toàn và lâu dài phù hợp nhất cho sản phụ sau mổ sinh đa thai đủ con?", "options": ["Khuyên sản phụ uống thuốc tránh thai hàng ngày chứa Estrogen liều cao ngay từ ngày thứ 3 hậu sản.", "Tư vấn cho sản phụ nhịn ăn hoàn toàn để không thể thụ thai lại.", "Chỉ định tiêm Methotrexate hàng tháng để ngừa thai.", "Khuyên sản phụ không cần dùng biện pháp tránh thai nào vì cho bú sữa mẹ ngừa thai 100% suốt 5 năm.", "Tư vấn phẫu thuật Triệt sản nữ khâu cắt hai vòi tử cung Tubal ligation hoặc triệt sản nam Vasecotmy, hoặc đặt Dụng cụ tử cung chứa Levonorgestrel / cấy que Implanon sau 6 tuần hậu sản, không ảnh hưởng đến tiết sữa nuôi con."], "correct": 4, "decision": "Chốt quyết định: Mổ sinh đa thai đủ 4 con + Cho con bú -> Tư vấn KHHGĐ dài hạn -> Triệt sản nữ (khâu cắt vòi tử cung) / Triệt sản nam HOẶC Que cấy Implanon / DCTC Levonorgestrel sau 6 tuần (Progestin-only).\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Ke thuốc tránh thai phối hợp chứa Estrogen cho sản phụ đang cho con bú | • Phép tính kép: PARA 2002 + 2 bé vừa sinh = 4 con -> Đủ số con nguyện vọng -> Triệt sản hoặc tránh thai dài hạn | • Điểm mù an toàn: Thuốc tránh thai chứa Estrogen chống chỉ định trong 6 tuần đầu hậu sản vì tăng nguy cơ thuyên tắc huyết khối VTE và làm ức chế tiết sữa mẹ", "explanation": "Sau mổ lấy thai đa thai ở sản phụ đã đủ số con (4 con), tư vấn Kế hoạch hóa gia đình (KHHGĐ) cần hướng tới các biện pháp hiệu quả cao và lâu dài: (1) Phẫu thuật Triệt sản nữ (Khâu cắt vòi tử cung qua phẫu thuật hoặc mổ nội soi) hoặc Triệt sản nam (Vasecotmy); (2) Các biện pháp tránh thai chứa Progestin đơn thuần (Progestin-only) không ảnh hưởng tới tiết sữa và không làm tăng nguy cơ thuyên tắc huyết khối: Que cấy Implanon, Dụng cụ tử cung chứa Levonorgestrel (Mirena) hoặc tiêm DMPA sau 6 tuần hậu sản. Thuốc tránh thai phối hợp chứa Estrogen bị CHỐNG CHỈ ĐỊNH trong 6 tuần đầu sau sinh.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 338-340).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Mổ sinh đa thai đủ 4 con -> Tránh thai lâu dài: Triệt sản nữ/nam hoặc Đặt DCTC Levonorgestrel / Que cấy Implanon sau 6 tuần (an toàn cho sữa mẹ)."}, {"letter": "B", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Estrogen liều cao gây giảm tiết sữa và tăng nguy cơ huyết khối hậu sản."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Nhịn ăn là sai lầm nguy hiểm."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX không phải thuốc ngừa thai."}, {"letter": "E", "is_starred": true, "trap_text": "[qua_bao_ton] Cho bú vô kinh (LAM) chỉ có hiệu quả trong 6 tháng đầu nếu vô kinh hoàn toàn, không kéo dài 5 năm."}]}];

    // User progress state
    let userState = {
      answers: {},
      starred: {},
      notes: {}
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) userState = JSON.parse(saved);
      } catch (e) {
        console.error("Local storage read error", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
      } catch (e) {
        console.error("Local storage save error", e);
      }
    }

    let currentFilter = 'all';
    let filteredList = [...ALL_QUESTIONS];
    let currentIndex = 0;

    function applyFilter() {
      if (currentFilter === 'all') {
        filteredList = [...ALL_QUESTIONS];
      } else if (currentFilter === 'starred') {
        filteredList = ALL_QUESTIONS.filter(q => userState.starred[q.id]);
      } else if (currentFilter === 'wrong') {
        filteredList = ALL_QUESTIONS.filter(q => userState.answers[q.id] !== undefined && userState.answers[q.id] !== q.correct);
      } else if (currentFilter === 'unanswered') {
        filteredList = ALL_QUESTIONS.filter(q => userState.answers[q.id] === undefined);
      }

      if (filteredList.length === 0) {
        filteredList = [...ALL_QUESTIONS];
        currentFilter = 'all';
      }

      currentIndex = 0;
      updateFilterTabsUI();
      renderCase();
      updateStats();
    }

    function setFilter(f) {
      currentFilter = f;
      applyFilter();
    }

    function updateFilterTabsUI() {
      ['all', 'starred', 'wrong', 'unanswered'].forEach(f => {
        const btn = document.getElementById(`tab-${f}`);
        if (!btn) return;
        if (f === currentFilter) {
          btn.className = "px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-semibold shadow-xs transition active:scale-95 shrink-0";
        } else {
          btn.className = "px-3 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition active:scale-95 shrink-0";
        }
      });
    }

    function updateStats() {
      let correct = 0, wrong = 0, starred = 0, answered = 0;
      ALL_QUESTIONS.forEach(q => {
        if (userState.starred[q.id]) starred++;
        const ans = userState.answers[q.id];
        if (ans !== undefined) {
          answered++;
          if (ans === q.correct) correct++;
          else wrong++;
        }
      });

      document.getElementById('statCorrect').innerText = correct;
      document.getElementById('statWrong').innerText = wrong;
      document.getElementById('countStarred').innerText = starred;
      document.getElementById('countWrong').innerText = wrong;
      document.getElementById('countUnanswered').innerText = 50 - answered;

      const total = ALL_QUESTIONS.length;
      document.getElementById('progCorrect').style.width = `${(correct / total) * 100}%`;
      document.getElementById('progWrong').style.width = `${(wrong / total) * 100}%`;
    }

    function renderCase() {
      const q = filteredList[currentIndex];
      if (!q) return;

      document.getElementById('currentCaseLabel').innerText = `Ca ${q.id} / 50`;
      document.getElementById('caseBloom').innerText = q.bloom;
      document.getElementById('caseTitle').innerText = q.title;
      document.getElementById('caseStem').innerText = q.stem;
      document.getElementById('caseQuestion').innerText = q.question;

      // Update Star Icon
      const starIcon = document.getElementById('starIcon');
      if (userState.starred[q.id]) {
        starIcon.classList.add('text-amber-500', 'fill-amber-400');
        starIcon.classList.remove('text-slate-400', 'fill-none');
      } else {
        starIcon.classList.remove('text-amber-500', 'fill-amber-400');
        starIcon.classList.add('text-slate-400', 'fill-none');
      }

      // Render 5 Options
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const optGroup = document.getElementById('optionsGroup');
      optGroup.innerHTML = '';

      const userAns = userState.answers[q.id];
      const isAnswered = userAns !== undefined;

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.onclick = () => selectOption(idx);
        btn.disabled = isAnswered;

        let btnClass = "w-full min-h-[48px] p-3 sm:p-3.5 rounded-xl border text-left text-xs sm:text-sm flex items-start space-x-2.5 sm:space-x-3 transition active:scale-[0.99] ";

        if (!isAnswered) {
          btnClass += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 text-slate-700 shadow-2xs";
        } else {
          if (idx === q.correct) {
            btnClass += "bg-emerald-50 border-emerald-500 text-emerald-950 font-semibold ring-1 ring-emerald-500 shadow-xs";
          } else if (idx === userAns) {
            btnClass += "bg-rose-50 border-rose-500 text-rose-950 font-medium ring-1 ring-rose-500 shadow-xs";
          } else {
            btnClass += "bg-slate-50/70 border-slate-200 text-slate-400 opacity-60";
          }
        }

        btn.className = btnClass;
        btn.innerHTML = `
          <span class="shrink-0 w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs ${
            isAnswered && idx === q.correct ? 'bg-emerald-600 text-white' :
            isAnswered && idx === userAns ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'
          }">${letters[idx]}</span>
          <span class="flex-1 leading-relaxed">${optText}</span>
        `;
        optGroup.appendChild(btn);
      });

      // Explanation & Traps Reveal
      const expBox = document.getElementById('explanationBox');
      if (isAnswered) {
        expBox.classList.remove('hidden');
        document.getElementById('decisionText').innerText = q.decision;
        document.getElementById('explanationText').innerText = q.explanation;

        const trapsDiv = document.getElementById('trapsContainer');
        trapsDiv.innerHTML = '';
        q.traps.forEach(t => {
          const row = document.createElement('div');
          row.className = "flex items-start space-x-2 py-1 border-b border-amber-100/70 last:border-0";
          row.innerHTML = `<span class="font-bold text-amber-800 text-xs shrink-0 mt-0.5">[PA ${t.letter}]</span><span class="leading-relaxed text-slate-600 text-xs sm:text-[13px]">${t.trap_text}</span>`;
          trapsDiv.appendChild(row);
        });

        document.getElementById('caseNoteInput').value = userState.notes[q.id] || '';
      } else {
        expBox.classList.add('hidden');
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === filteredList.length - 1);
    }

    function selectOption(idx) {
      const q = filteredList[currentIndex];
      userState.answers[q.id] = idx;
      saveState();
      renderCase();
      updateStats();
    }

    function toggleBookmark() {
      const q = filteredList[currentIndex];
      userState.starred[q.id] = !userState.starred[q.id];
      saveState();
      renderCase();
      updateStats();
    }

    function saveCurrentNote() {
      const q = filteredList[currentIndex];
      userState.notes[q.id] = document.getElementById('caseNoteInput').value;
      saveState();
    }

    function navPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCase();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function navNext() {
      if (currentIndex < filteredList.length - 1) {
        currentIndex++;
        renderCase();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function resetAllProgress() {
      if (confirm("Bạn có chắc muốn xóa lịch sử làm bài và ghi chú để làm lại từ đầu?")) {
        userState = { answers: {}, starred: {}, notes: {} };
        saveState();
        applyFilter();
      }
    }

    // MODAL DRAWER GRID
    function openDrawer() {
      const grid = document.getElementById('grid50');
      grid.innerHTML = '';

      ALL_QUESTIONS.forEach((q, idx) => {
        const btn = document.createElement('button');
        const ans = userState.answers[q.id];
        const isStar = userState.starred[q.id];

        let bg = "bg-slate-100 text-slate-700 border-slate-200";
        if (ans !== undefined) {
          if (ans === q.correct) bg = "bg-emerald-500 text-white font-bold";
          else bg = "bg-rose-500 text-white font-bold";
        }

        btn.className = `relative h-11 rounded-xl border text-xs font-semibold flex items-center justify-center transition active:scale-90 ${bg}`;
        btn.innerHTML = `
          <span>${idx + 1}</span>
          ${isStar ? '<span class="absolute top-1 right-1 text-amber-300 text-[10px]">★</span>' : ''}
        `;
        btn.onclick = () => {
          closeDrawer();
          currentFilter = 'all';
          updateFilterTabsUI();
          filteredList = [...ALL_QUESTIONS];
          currentIndex = idx;
          renderCase();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        grid.appendChild(btn);
      });

      document.getElementById('drawerOverlay').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.add('hidden');
    }

    // KEYBOARD NAVIGATION (For iPad Magic Keyboard / Hardware Keyboard)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') navPrev();
      if (e.key === 'ArrowRight') navNext();
      if (['1', '2', '3', '4', '5'].includes(e.key)) {
        selectOption(parseInt(e.key) - 1);
      }
    });

    // TOUCH SWIPE NAVIGATION (Mobile phones & iPads)
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 75) navNext();
      if (touchEndX - touchStartX > 75) navPrev();
    }, { passive: true });

    window.onload = () => {
      loadState();
      applyFilter();
    };
  </script>
</body>
</html>
