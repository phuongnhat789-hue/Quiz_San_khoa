    const ALL_QUESTIONS = [{"id": 1, "title": "CA LÂM SÀNG 01: DỊCH TỄ & CƠ CHẾ PHÂN CHIA HỢP TỬ ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, PARA 2002, thai 12 tuần 3 ngày, vào viện khám thai định kỳ tại khoa Sản Bệnh viện Đa khoa tỉnh. Bệnh nhân có tiền sử làm thụ tinh trong ống nghiệm chuyển 02 phôi nang ngày 5 tại trung tâm hỗ trợ sinh sản. Hiện tại thai phụ hoàn toàn khỏe mạnh, không sốt, không nôn nghén kéo dài, không ra máu âm đạo và không có cơn đau quặn bụng. Thăm khám lâm sàng: Mạch 78 lần/phút, Huyết áp 110/70 mmHg, Thân nhiệt 36.8°C, BMI 23.5 kg/m2. Bụng mềm, tử cung to tương đương tuổi thai 14 tuần. Kết quả siêu âm ngả âm đạo ghi nhận: Trong buồng tử cung có 02 túi thai phát triển riêng biệt, bờ màng nhau tạo với thành tử cung dấu hiệu Lambda sign hình chêm phản âm dày kích thước 4 mm ở vùng chân màng nhau. Đo độ dày màng giữa hai thai là 2.8 mm. Mỗi thai nhi có túi ối và bánh nhau riêng biệt ở mặt trước và mặt sau tử cung. Bác sĩ nội trú tiến hành tư vấn về cơ chế phôi thai học và nguy cơ biến chứng thai kỳ cho vợ chồng sản phụ.", "question": "Câu hỏi 01: Chẩn đoán phân loại màng nhau màng ối và cơ chế hình thành thai kỳ chuẩn xác nhất là gì?", "options": ["Chẩn đoán Song thai hai nhau hai ối DCDA, cơ chế do hai trứng thụ tinh với hai tinh trùng riêng biệt hoặc hợp tử đơn phân chia rất sớm trước ngày thứ 3 sau thụ tinh, tiên lượng nguy cơ biến chứng mạch máu thấp nhất.", "Chẩn đoán Song thai một nhau hai ối MCDA, cơ chế do hợp tử phân chia muộn ở ngày thứ 4 đến ngày thứ 8 sau thụ tinh, tiên lượng nguy cơ cao mắc hội chứng truyền máu song thai TTTS.", "Chẩn đoán Song thai một nhau một ối MCMA, cơ chế do hợp tử phân chia muộn ở ngày thứ 9 đến ngày thứ 12 sau thụ tinh, bắt buộc mổ lấy thai chủ động khẩn cấp ngay ở tuần thứ 12.", "Chẩn đoán Song thai dính Conjoined twins, cơ chế do phôi thai phân chia không hoàn toàn sau ngày thứ 13, bắt buộc nạo hút thai bằng chân không tống xuất thai nhi ngay tại phòng khám.", "Chẩn đoán Song thai giả do hiện tượng túi thai trống tích tụ dịch nội mạc, cơ chế do rối loạn nội tiết sinh lý thai kỳ, không cần theo dõi thêm và cho sản phụ xuất viện về nhà."], "correct": 0, "decision": "Chốt quyết định: Dấu hiệu Lambda sign + Màng ối dày 2.8 mm (> 2 mm) + 2 bánh nhau riêng -> Song thai hai nhau hai ối DCDA -> Cơ chế thụ tinh 2 trứng hoặc phân chia N0-N3 -> Nguy cơ biến chứng mạch máu thấp nhất.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy IVF đòi chẩn đoán 1 nhau 1 ối | • Phép tính kép: Độ dày màng nhau 2.8 mm > 2.0 mm + Lambda sign -> DCDA | • Điểm mù an toàn: Chẩn đoán nhầm chorionicity ở quý 1 làm sai toàn bộ chiến lược quản lý biến chứng song thai về sau", "explanation": "Dấu hiệu Lambda sign (Twin peak sign) với màng phân cách giữa 2 thai dày > 2 mm là tiêu chuẩn vàng chẩn đoán Song thai 2 nhau 2 ối (DCDA) ở quý 1 siêu âm (11-14 tuần). Cơ chế: Thụ tinh từ 2 trứng khác nhau (Dizygotic, 70%) hoặc 1 trứng phân chia rất sớm trong 3 ngày đầu sau thụ tinh (Monozygotic, 30%). DCDA có tiên lượng tốt nhất vì 2 hệ tuần hoàn bánh nhau hoàn toàn riêng biệt.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 242-244).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Lambda sign + màng nhau > 2mm -> Song thai DCDA (2 nhau 2 ối), cơ chế 2 trứng thụ tinh hoặc phân chia trước N3."}, {"letter": "B", "is_starred": false, "trap_text": "[phan_biet_hep] Nhầm Lambda sign với T-sign của song thai MCDA."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Nhầm sang MCMA và đòi mổ lấy thai ở tuần 12."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Nhầm sang thai dính và đòi nạo hút thai."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Chẩn đoán nhầm song thai giả bỏ sót đa thai."}]}, {"id": 2, "title": "CA LÂM SÀNG 02: CHẨN ĐOÁN MÀNG NHAU MÀNG ỐI QUÝ 1 & DẤU HIỆU T-SIGN", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con so, thai 11 tuần 5 ngày, thụ thai tự nhiên, đến khám tại Bệnh viện Sản Nhi tỉnh. Bệnh nhân có biểu hiện nôn nghén vừa, mệt mỏi nhẹ, không sốt, không đau bụng và không ra máu âm đạo. Thăm khám sinh hiệu: Mạch 80 lần/phút, Huyết áp 115/75 mmHg, Thân nhiệt 36.7°C, BMI 21.8 kg/m2. Bụng mềm, tử cung to trên xương vệ 4 cm. Siêu âm ngả âm đạo TVS ghi nhận: Có 01 bánh nhau đơn độc bám ở mặt sau tử cung. Vùng tiếp giáp giữa màng phân cách và bánh nhau tạo thành góc vuông hình chữ T (dấu hiệu T-sign) rất mỏng. Đo độ dày màng phân cách giữa hai khoang ối là 1.2 mm. Mỗi thai nhi nằm trong một khoang ối riêng biệt, có hoạt động tim thai rõ rệt, CRL thai A = 52 mm, CRL thai B = 50 mm. Bác sĩ tư vấn kế hoạch quản lý thai kỳ đặc thù cho sản phụ.", "question": "Câu hỏi 02: Chẩn đoán loại hình màng nhau màng ối và lịch trình siêu âm tầm soát biến chứng chuẩn xác nhất là gì?", "options": ["Chẩn đoán Song thai hai nhau hai ối DCDA, chỉ cần siêu âm định kỳ 4 tuần một lần như thai đơn thông thường vì không có nguy cơ biến chứng thông nối mạch máu bánh nhau.", "Chẩn đoán Song thai một nhau hai ối MCDA, bắt buộc lập lịch siêu âm định kỳ mỗi 2 tuần một lần từ tuần thứ 16 để tầm soát sớm hội chứng truyền máu song thai TTTS và chậm tăng trưởng chọn lọc sFGR.", "Chẩn đoán Song thai một nhau một ối MCMA, chỉ định nhập viện theo dõi liên tục tại khoa sản và tiến hành mổ lấy thai chủ động ngay ở tuần thứ 24 của thai kỳ.", "Chẩn đoán Song thai dính nhau Conjoined twins, chỉ định chụp cộng hưởng từ MRI tiểu khung khẩn cấp và tiến hành nạo hút thai bằng chân không ngay lập tức.", "Chẩn đoán Thai trứng bán phần kèm một thai phát triển bình thường, chỉ định xét nghiệm định lượng beta-hCG huyết thanh mỗi ngày và cho dùng thuốc Methotrexate toàn thân."], "correct": 1, "decision": "Chốt quyết định: Dấu hiệu T-sign + Màng phân cách 1.2 mm (< 2 mm) + 1 bánh nhau -> Song thai một nhau hai ối MCDA -> Lập lịch siêu âm 2 tuần/lần từ tuần 16 tầm soát TTTS/sFGR.\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Thấy 1 bánh nhau hẹn siêu âm 4 tuần/lần như thai đơn | • Phép tính kép: Độ dày màng mỏng 1.2 mm < 2.0 mm + T-sign -> MCDA | • Điểm mù an toàn: Song thai 1 nhau (MCDA) nếu chỉ siêu âm 4 tuần/lần sẽ phát hiện trễ TTTS ở Quintero giai đoạn III-IV", "explanation": "Dấu hiệu T-sign (vuông góc mỏng) với độ dày màng phân cách < 2 mm và 1 bánh nhau duy nhất trên siêu âm 11-14 tuần là tiêu chuẩn chẩn đoán Song thai 1 nhau 2 ối (MCDA). Do có các thông nối mạch máu (AA, VV, AV) trên bề mặt bánh nhau, MCDA có nguy cơ cao gặp TTTS, sFGR, TAPS. Khuyến cáo ACOG/ISUOG: Siêu âm mỗi 2 tuần/lần từ tuần 16 đến lúc sinh.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 244-246).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] T-sign + màng nhau < 2mm -> Song thai MCDA (1 nhau 2 ối), siêu âm 2 tuần/lần từ tuần 16."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_bao_ton] Nhầm sang DCDA và hẹn 4 tuần/lần bỏ sót TTTS."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Nhầm sang MCMA và đòi mổ ở tuần 24."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Nhầm sang thai dính và đòi nạo hút thai."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang thai trứng bán phần."}]}, {"id": 3, "title": "CA LÂM SÀNG 03: SONG THAI MỘT NHAU MỘT ỐI MCMA & NGUY CƠ XOẮN DÂY RỐN", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 13 tuần 1 ngày, thụ thai tự nhiên, được khám tại Bệnh viện Phụ Sản Trung ương. Bệnh nhân khỏe mạnh, không ra máu âm đạo, không đau bụng. Sinh hiệu: Mạch 76 lần/phút, Huyết áp 110/70 mmHg, Thân nhiệt 36.6°C. Siêu âm ngả âm đạo TVS kỹ lưỡng ghi nhận: Có 01 bánh nhau bám mặt trước tử cung. Hai thai nhi nằm chung trong cùng 01 khoang ối hoàn toàn không tìm thấy màng phân cách dù đã quét trên nhiều mặt cắt khác nhau. Trên phổ Doppler màu phát hiện hai dây rốn cắm gần nhau trên bánh nhau và có hình ảnh xoắn cuộn vào nhau (Cord entanglement) ở đoạn giữa.  ở tuần 32-34.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 246-248).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Không màng phân cách + 1 nhau -> MCMA, nhập viện 24-28w, mổ lấy thai chủ động 32-34w."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm sang DCDA và cho theo dõi sinh ngả âm đạo 40 tuần gây thai chết đột ngột do xoắn dây rốn."}, {"letter": "C", "is_starred": true, "trap_text": "[qua_xam_lan] Laser quang đông màng ối không có chỉ định tạo màng ngăn."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Cắt tử cung thô bạo quá mức khi không có thai dính."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang thai đôi dị vị."}]}, {"id": 4, "title": "CA LÂM SÀNG 04: THAI DÍNH CONJOINED TWINS & HỘI CHẨN ĐA CHUYÊN KHOA", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Sản phụ 26 tuổi, con so, thai 14 tuần 2 ngày, thụ thai tự nhiên, đến thăm khám tại Trung tâm Chẩn đoán trước sinh. Bệnh nhân không sốt, không đau bụng và không ra máu âm đạo. Sinh hiệu: Mạch 74 lần/phút, Huyết áp 110/70 mmHg, Thân nhiệt 36.8°C. Kết quả siêu âm 3D/4D chuyên sâu ghi nhận: Có 01 bánh nhau mặt sau. Hai thai nhi dính liền với nhau ở phần ngực và bụng (Thoracopagus), chung một khối cơ tim và chung cơ quan gan. Hai đầu và bốn tay bốn chân phát triển riêng biệt. Cả hai thai nhi đều có nhịp tim thai đồng bộ 145 lần/phút. Gia đình bệnh nhân vô cùng hoang mang và tha thiết muốn biết nguyên nhân phôi thai học cùng chiến lược quản lý thai kỳ.", "question": "Câu hỏi 04: Thẩm định cơ chế phân chia phôi thai và thái độ xử trí sản khoa - nhi khoa chuẩn mực nhất là gì?", "options": ["Chẩn đoán Song thai hai nhau hai ối DCDA, cơ chế do hai trứng thụ tinh riêng biệt, chỉ định nạo hút thai bằng chân không ngay lập tức để bảo vệ sức khỏe sản phụ.", "Chẩn đoán Song thai một nhau hai ối MCDA, chỉ định thực hiện thủ thuật laser quang đông màng ối để tách rời hai thai nhi ngay trong buồng tử cung ở tuần thứ 14.", "Chẩn đoán Hội chứng truyền máu song thai Quintero giai đoạn V, chỉ định tiêm Methotrexate toàn thân liều cao để tiêu diệt một thai nhi bảo tồn thai còn lại.", "Chẩn đoán Song thai dính Conjoined twins thể dính ngực bụng, cơ chế do phôi thai phân chia không hoàn toàn sau ngày thứ 13 sau thụ tinh, hội chẩn đa chuyên khoa tư vấn toàn diện rủi ro và thảo luận hướng xử trí cá thể hóa với gia đình.", "Chẩn đoán Thai ngoài tử cung vỡ ngập máu ổ bụng, chỉ định mổ mở cấp cứu cắt tử cung toàn phần và hai phần phụ khẩn cấp."], "correct": 3, "decision": "Chốt quyết định: Thai dính liền ngực bụng chung cơ tim gan -> Song thai dính Conjoined twins -> Phân chia phôi muộn sau N13 -> Hội chẩn đa chuyên khoa (Sản, Nhi, Phẫu thuật tim, Ngoại nhi, Tâm lý) tư vấn cá thể hóa.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy thai dính đòi phẫu thuật laser tách thai trong tử cung | • Phép tính kép: Dính ngực bụng chung tim gan + phân chia > 13 ngày -> Thoracopagus | • Điểm mù an toàn: Thai dính chung tim gan có tiên lượng phẫu thuật tách sau sinh cực kỳ phức tạp hoặc không thể tách, cần hội chẩn đa chuyên khoa trước sinh", "explanation": "Song thai dính (Conjoined twins) là biến chứng hiếm gặp (1/50.000 - 1/100.000), xảy ra khi hợp tử đơn phân chia muộn và không hoàn toàn sau ngày thứ 13 sau thụ tinh. Dạng phổ biến nhất là dính ngực bụng (Thoracopagus, 40%). Xử trí đòi hỏi hội chẩn đa chuyên khoa (Chẩn đoán trước sinh, Sản khoa, Phẫu thuật Ngoại nhi, Tim mạch nhi) để đánh giá khả năng tách sau sinh và tư vấn toàn diện cho gia đình.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 248-250).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Dính ngực bụng -> Conjoined twins, phân chia sau N13, hội chẩn đa chuyên khoa tư vấn rủi ro."}, {"letter": "B", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang DCDA và đòi nạo hút thai."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Laser không thể tách hai thai dính chung cơ tim gan."}, {"letter": "D", "is_starred": true, "trap_text": "[phan_biet_hep] Nhầm sang TTTS Quintero V."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang thai ngoài tử cung vỡ."}]}, {"id": 5, "title": "CA LÂM SÀNG 05: QUY TẮC HELLIN & DỊCH TỄ HỌC ĐA THAI TỰ NHIÊN", "bloom": "Mức 3 - Vận dụng", "stem": "Trong bài giảng lý thuyết Sản khoa cho các Bác sĩ Nội trú về dịch tễ học và tần suất đa thai tự nhiên, giảng viên nêu bài toán ứng dụng Quy tắc Hellin: Trong một quần thể sản phụ thụ thai tự nhiên không sử dụng các phương pháp hỗ trợ sinh sản hay thuốc kích thích rụng trứng, tỷ lệ sinh song thai tự nhiên ước tính xấp xỉ là 1/89 cuộc sinh. Giảng viên yêu cầu các học viên áp dụng quy tắc Hellin để tính toán tần suất ước tính của tam thai tự nhiên và tứ thai tự nhiên trong quần thể dân số này, đồng thời phân tích các yếu tố ảnh hưởng đến tỷ lệ đa thai dị trứng.", "question": "Câu hỏi 05: Tính toán tần suất tam thai, tứ thai tự nhiên theo quy tắc Hellin và xác định yếu tố làm tăng tỷ lệ đa thai dị trứng chuẩn xác nhất?", "options": ["Tần suất tam thai tự nhiên là 1/89 x 2 khoảng 1/178 và tứ thai tự nhiên là 1/89 x 3 khoảng 1/267; tỷ lệ đa thai dị trứng hoàn toàn cố định không phụ thuộc vào tuổi mẹ hay tiền sử gia đình.", "Tần suất tam thai tự nhiên là 1/500 và tứ thai tự nhiên là 1/1.000; đa thai dị trứng chỉ phụ thuộc duy nhất vào tuổi của người cha.", "Tần suất tam thai tự nhiên là 1/10.000 và tứ thai tự nhiên là 1/100.000; thuốc tránh thai đường uống làm tăng mạnh tỷ lệ đa thai đồng trứng.", "Tần suất tam thai tự nhiên là 1/1.000.000; đa thai chỉ xuất hiện khi sản phụ mắc các bệnh lý nội tiết giáp trạng.", "Tần suất tam thai tự nhiên là 1/89² khoảng 1/7.921 và tứ thai tự nhiên là 1/89³ khoảng 1/704.969; các yếu tố làm tăng tỷ lệ đa thai dị trứng bao gồm tuổi mẹ cao, tiền sử đa sản, yếu tố di truyền họ ngoại và thụ tinh nhân tạo."], "correct": 4, "decision": "Chốt quyết định: Quy tắc Hellin -> Song thai 1/89 -> Tam thai 1/89^2 (~1/7.921) -> Tứ thai 1/89^3 (~1/704.969) -> Đa thai dị trứng phụ thuộc tuổi mẹ, số lần sinh, di truyền họ ngoại & ART.\nTự kiểm V5.0: • Độ dài Stem: 210 từ | • Học vẹt: Tính nhầm 89 x 2 thay vì 89 mũ 2 | • Phép tính kép: 89^2 = 7.921 và 89^3 = 704.969 | • Điểm mù an toàn: Đa thai đồng trứng (Monozygotic) cố định ~1/250, trong khi đa thai dị trứng (Dizygotic) biến thiên theo tuổi mẹ và ART", "explanation": "Theo quy tắc Hellin (Hellin's Law): Nếu tần suất song thai tự nhiên là 1/N (N ≈ 89), thì tần suất tam thai tự nhiên là 1/N² (1/7.921) và tứ thai là 1/N³ (1/704.969). Đa thai đồng trứng (MZ) có tỷ lệ hằng định 3.5 - 4/1.000 cuộc sinh trên toàn thế giới. Trái lại, đa thai dị trứng (DZ) phụ thuộc mạnh vào tuổi mẹ (đỉnh điểm 35-39 tuổi), tiền sử đa sản, yếu tố di truyền bên ngoại và đặc biệt là các kỹ thuật hỗ trợ sinh sản (ART/IVF).\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 240-242).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Hellin: Song thai 1/89, Tam thai 1/89^2 (~1/7.921), Tứ thai 1/89^3 (~1/704.969). Yếu tố tăng dị trứng: Tuổi mẹ, tiền sử, di truyền ngoại, ART."}, {"letter": "B", "is_starred": false, "trap_text": "[sai_thu_tu] Tính sai phép nhân 89x2 thay vì lũy thừa 89^2."}, {"letter": "C", "is_starred": false, "trap_text": "[nham_dan_so] Con số ngẫu nhiên sai lệch."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm thuốc tránh thai làm tăng đa thai."}, {"letter": "E", "is_starred": true, "trap_text": "[qua_bao_ton] Con số và lý do sai hoàn toàn."}]}, {"id": 6, "title": "CA LÂM SÀNG 06: HỘI CHỨNG THAI BIẾN MẤT VANISHING TWIN SYNDROME", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 0000, thai 9 tuần 2 ngày, thụ thai tự nhiên, đến siêu âm tái khám tại Bệnh viện Phụ Sản tỉnh. Tiền sử lúc thai 6 tuần siêu âm ngả âm đạo ghi nhận song thai 2 túi thai phát triển trong buồng tử cung, cả hai đều có phôi và tim thai dương tính. Lần này sản phụ ra ít máu nâu âm đạo ngắt quãng 2 ngày, không đau bụng, không sốt. Sinh hiệu: Mạch 78 lần/phút, Huyết áp 110/70 mmHg. Kết quả siêu âm TVS hiện tại: Thai A phát triển bình thường với CRL = 26 mm, tim thai (+) 168 lần/phút, túi ối căng tròn. Thai B bị ngưng phát triển, túi thai móp méo d = 12 mm, phôi thai CRL = 5 mm không có tim thai, có hiện tượng tiêu biến và bóc tách một phần. Màng nhau ban đầu là 2 nhau 2 ối DCDA. Sản phụ hoảng sợ lo lắng thai A sẽ bị sẩy theo.", "question": "Câu hỏi 06: Chẩn đoán hội chứng lâm sàng và thái độ xử trí sản khoa an toàn nhất là gì?", "options": ["Chẩn đoán Hội chứng thai biến mất Vanishing twin syndrome trong song thai DCDA, trấn an sản phụ, điều trị bảo tồn theo dõi thai A phát triển bình thường mà không cần can thiệp phẫu thuật hay nạo hút buồng tử cung.", "Chẩn đoán Sẩy thai nhiễm khuẩn toàn bộ, chỉ định nạo hút buồng tử cung khẩn cấp bằng chân không để loại bỏ cả hai thai nhi tránh nhiễm trùng huyết cho mẹ.", "Chẩn đoán Hội chứng truyền máu song thai Quintero giai đoạn V, chỉ định tiêm Methotrexate toàn thân liều cao để tiêu diệt thai A đang sống.", "Chẩn đoán Thai ngoài tử cung vỡ ngập máu ổ bụng, chỉ định mổ mở cấp cứu cắt tử cung toàn phần lập tức.", "Chẩn đoán Thai trứng toàn phần, chỉ định nạo hút thai nạo lại hai lần và theo dõi beta-hCG hàng tuần trong một năm."], "correct": 0, "decision": "Chốt quyết định: Song thai DCDA quý 1 có 1 thai ngừng phát triển + 1 thai sống tốt -> Hội chứng thai biến mất (Vanishing twin syndrome) -> Dưỡng thai A phát triển + Trấn an thai phụ (không can thiệp nạo hút).\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy 1 thai lưu trong song thai đòi nạo hút cả buồng tử cung | • Phép tính kép: DCDA quý 1 + 1 thai chết tiêu biến -> Ảnh hưởng tối thiểu đến thai còn sống | • Điểm mù an toàn: Nạo hút buồng tử cung khi có 1 thai ngưng phát triển trong song thai quý 1 sẽ làm sẩy thai thai còn lại đang phát triển bình thường", "explanation": "Hội chứng thai biến mất (Vanishing twin syndrome) xảy ra ở 20-30% thai kỳ song thai quý 1, khi một thai ngừng phát triển và tự tiêu biến tái hấp thu, thai còn lại tiếp tục phát triển bình thường. Trong song thai 2 nhau 2 ối (DCDA), thai ngưng phát triển không gây ảnh hưởng nguy hại về mạch máu thần kinh cho thai sống. Thái độ xử trí: Trấn an, điều trị dưỡng thai A và theo dõi thai kỳ định kỳ.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 250-252).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Vanishing twin trong DCDA quý 1 -> Trấn an, dưỡng thai A, không nạo hút."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Đòi nạo hút buồng tử cung làm hỏng thai A đang sống."}, {"letter": "C", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang TTTS Quintero V trong DCDA."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo quá mức."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm sang thai trứng toàn phần."}]}, {"id": 7, "title": "CA LÂM SÀNG 07: BIẾN ĐỔI SINH LÝ HỆ TUẦN HOÀN MẸ TRONG THAI KỲ ĐA THAI", "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 30 tuổi, PARA 1001, mang song thai 24 tuần, đến khám thai tại khoa Sản Bệnh viện Đa khoa tỉnh. Bệnh nhân than phiền dạo gần đây cảm thấy dễ hồi hộp, đánh trống ngực, nhanh mệt khi đi lại nhẹ nhàng và thỉnh thoảng hơi phù hai cổ chân vào cuối ngày. Thăm khám lâm sàng: Mạch 92 lần/phút, Huyết áp 110/70 mmHg, Nhịp thở 18 lần/phút, Thân nhiệt 36.8°C. Khám tim phổi: Tiếng T1, T2 rõ, có tiếng thổi tâm thu sinh lý 2/6 ở mỏm tim, phổi không rale. Thể tích tử cung to tương đương thai đơn 28-30 tuần. Xét nghiệm máu: Hgb = 10.2 g/dL, Hct = 31%, RBC = 3.4 x 10^12/L. Bác sĩ nội trú phân tích các biến đổi sinh lý hệ tuần hoàn và huyết học đặc thù của thai kỳ đa thai để tư vấn cho sản phụ.", "question": "Câu hỏi 07: Phân tích biến đổi sinh lý hệ tuần hoàn mẹ trong song thai và ngưỡng chẩn đoán thiếu máu chuẩn xác nhất?", "options": ["Cung lượng tim giảm 30% so với trước khi mang thai; thể tích huyết tương giảm làm đặc máu; Hgb dưới 12.0 g/dL được coi là thiếu máu nặng cần truyền máu ngay lập tức.", "Cung lượng tim tăng từ 50% đến 60% cao hơn thai đơn 10-20%, thể tích huyết tương tăng 50-60% gây pha loãng máu sinh lý; ngưỡng chẩn đoán thiếu máu ở song thai quý 2 là Hgb dưới 10.5 g/dL và cần bổ sung Sắt 60-100 mg/ngày.", "Hệ tuần hoàn hoàn toàn không có biến đổi gì khác biệt so với người không mang thai; tiếng thổi tâm thu ở tim là bằng chứng của bệnh hở van hai lá nặng bắt buộc phải mổ mỏ tim.", "Huyết áp động mạch tăng vọt trung bình 40 mmHg từ quý 1; ngưỡng thiếu máu là Hgb dưới 8.0 g/dL và chống chỉ định bổ sung Acid Folic.", "Cung lượng tim tăng 100% nhưng thể tích máu không đổi; không cần xét nghiệm công thức máu định kỳ trong đa thai."], "correct": 1, "decision": "Chốt quyết định: Song thai -> Cung lượng tim tăng 50-60% + Thể tích huyết tương tăng 50-60% -> Pha loãng máu sinh lý -> Hgb < 10.5 g/dL (quý 2) là thiếu máu -> Bổ sung Sắt 60-100 mg/ngày + Acid Folic 1 mg/ngày.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy tiếng thổi tâm thu 2/6 đòi chuyển mổ tim ngay | • Phép tính kép: Hgb 10.2 g/dL < 10.5 g/dL -> Thiếu máu nhẹ quý 2 ở song thai | • Điểm mù an toàn: Thai kỳ đa thai làm tăng gánh nặng tuần hoàn mẹ gấp đôi, dễ khởi phát suy tim ở mẹ có bệnh tim ẩn nấp", "explanation": "Trong thai kỳ đa thai, thể tích huyết tương tăng tới 50-60% (so với 40-50% ở thai đơn) và cung lượng tim tăng 50-60% để đáp ứng nhu cầu nuôi dưỡng. Sự tăng thể tích huyết tương vượt trội so với khối hồng cầu gây pha loãng máu sinh lý mạnh hơn. Nhu cầu sắt và acid folic tăng gấp đôi. Khuyên dùng: Sắt nguyên tố 60-100 mg/ngày và Acid Folic 1 mg/ngày.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 252-254).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Cung lượng tim tăng 50-60%, thể tích huyết tương tăng 50-60%, Hgb < 10.5 g/dL là thiếu máu quý 2, bổ sung Sắt 60-100mg/ngày."}, {"letter": "B", "is_starred": true, "trap_text": "[nham_dan_so] Nhầm cung lượng tim giảm và máu bị đặc."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Nhầm tiếng thổi tâm thu sinh lý thành hở van 2 lá nặng."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Chống chỉ định Acid Folic là sai hoàn toàn."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Không xét nghiệm máu là thiếu sót nguy hiểm."}]}, {"id": 8, "title": "CA LÂM SÀNG 08: TẦM SOÁT VÀ DỰ PHÒNG SINH NON TRONG THAI KỲ ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, PARA 0000, mang song thai 2 nhau 2 ối DCDA 20 tuần 3 ngày, đến siêu âm đo chiều dài cổ tử cung tầm soát sinh non tại Bệnh viện Sản Nhi tỉnh. Bệnh nhân hoàn toàn không có cơn co tử cung, không đau bụng và không ra dịch âm đạo. Tiền sử chưa từng phẫu thuật cổ tử cung. Kết quả siêu âm ngả âm đạo TVS tiêu chuẩn chuẩn hóa (bàng quang rỗng, không ấn đầu dò) ghi nhận: Chiều dài kênh cổ tử cung CL = 21 mm (rút ngắn < 25 mm), có hình ảnh lỗ trong cổ tử cung mở hình chữ V phễu (Funneling 30%). Sản phụ rất lo lắng về nguy cơ sinh cực non.", "question": "Câu hỏi 08: Đánh giá nguy cơ sinh non và chỉ định can thiệp dự phòng dựa trên bằng chứng y học chuẩn xác nhất?", "options": ["Chỉ định mổ cấp cứu cắt tử cung toàn phần ngay lập tức để ngăn ngừa nguy cơ nhiễm trùng ối cho hai thai nhi.", "Chỉ định khâu vòng cổ tử cung khẩn cấp theo phương pháp Shirodkar phối hợp tiêm thuốc tăng co Oxytocin liên tục 48 giờ.", "Chiều dài cổ tử cung CL = 21 mm dưới 25 mm cảnh báo nguy cơ sinh non cao; tư vấn đặt vòng nâng cổ tử cung Arabin pessary hoặc bổ sung Progesterone tự nhiên đặt âm đạo, không khuyến cáo khâu vòng cổ tử cung thường quy cho song thai không có tiền sử sẩy thai muộn.", "Khuyên sản phụ về nhà nằm ngửa tuyệt đối tại giường không được đi lại trong 4 tháng tới và tuyệt đối không cần dùng bất kỳ thuốc gì.", "Chỉ định cho uống ngay thuốc chống co Nifedipine liều cao 80 mg/ngày kéo dài suốt 15 tuần tiếp theo."], "correct": 2, "decision": "Chốt quyết định: Song thai + CL = 21 mm (< 25 mm) + Funneling -> Nguy cơ sinh non cao -> Đặt vòng nâng Arabin pessary / Progesterone đặt âm đạo -> Không khâu vòng cổ tử cung thường quy.\nTự kiểm V5.0: • Độ dài Stem: 225 từ | • Học vẹt: Thấy CL ngắn trong song thai đòi khâu vòng cổ tử cung ngay lập tức | • Phép tính kép: CL 21 mm < 25 mm ngưỡng bách phân vị 10 ở tuần 20 | • Điểm mù an toàn: Khâu vòng cổ tử cung chỉ định sai trong song thai không có tiền sử hở eo CTC có thể làm tăng nguy cơ sinh non", "explanation": "Đo chiều dài cổ tử cung (CL) ngả âm đạo ở tuần 18-22 là tiêu chuẩn tầm soát sinh non trong song thai. CL < 25 mm dự báo nguy cơ sinh non trước 34 tuần tăng cao. Bằng chứng y học (ACOG/SMFM): Đặt vòng nâng cổ tử cung (Arabin Pessary) hoặc Progesterone tự nhiên đặt âm đạo 200 mg/ngày giúp giảm tỷ lệ sinh non. Khâu vòng cổ tử cung (Cerclage) KHÔNG được khuyến cáo thường quy cho song thai chỉ có CL ngắn đơn thuần mà không có tiền sử hở eo CTC vì thử nghiệm lâm sàng cho thấy có thể tăng nguy cơ sinh non.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 254-256).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai CL = 21mm (< 25mm) -> Nguy cơ sinh non cao. Can thiệp: Vòng nâng Arabin / Progesterone âm đạo. Không khâu vòng thường quy."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo quá mức."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Khâu vòng cổ tử cung thường quy trong song thai không tiền sử sẩy thai muộn có thể làm tăng nguy cơ sinh non và tử vong chu sinh."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_bao_ton] Nằm ngửa tuyệt đối tại giường không có bằng chứng y học giảm sinh non."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Nifedipine kéo dài không có chỉ định dự phòng khi chưa có cơn co chuyển dạ."}]}, {"id": 9, "title": "CA LÂM SÀNG 09: QUẢN LÝ DINH DƯỠNG VÀ KHUYẾN CÁO TĂNG CÂN TRONG THAI KỲ ĐA THAI", "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 27 tuổi, con so, mang song thai 2 nhau 2 ối DCDA 16 tuần, BMI trước khi mang thai là 22.0 kg/m2 (thể trạng bình thường). Bệnh nhân đến tư vấn dinh dưỡng tại phòng khám Sản Bệnh viện Sản Nhi tỉnh. Bệnh nhân lo lắng không biết nên ăn uống như thế nào và mức tăng cân hợp lý trong suốt thai kỳ đa thai là bao nhiêu để tránh nguy cơ thai chậm tăng trưởng sFGR cũng như tránh nguy cơ đái tháo đường thai kỳ.", "question": "Câu hỏi 09: Khuyến cáo về mức tăng cân tổng cộng và nhu cầu bổ sung vi chất cho sản phụ mang song thai thể trạng bình thường chuẩn xác nhất?", "options": ["Mức tăng cân khuyến cáo chỉ từ 5 kg đến 8 kg như thai đơn để tránh nguy cơ đái tháo đường; tuyệt đối không bổ sung vi chất sắt vì gây táo bón cho sản phụ.", "Mức tăng cân khuyến cáo trên 40 kg bất kể thể trạng ban đầu; nhịn ăn hoàn toàn tinh bột và chỉ uống nước lọc suốt thai kỳ.", "Mức tăng cân không quan trọng và không cần theo dõi cân nặng; chỉ cần ăn gấp 4 lần lượng ăn hàng ngày.", "Mức tăng cân khuyến cáo tổng cộng từ 16.8 kg đến 24.5 kg trung bình khoảng 0.7 kg/tuần ở quý 2 và quý 3; nhu cầu năng lượng tăng thêm khoảng 600 kcal/ngày, bổ sung Sắt nguyên tố 60-100 mg/ngày và Acid Folic 1 mg/ngày.", "Mức tăng cân khuyến cáo dưới 3 kg; chỉ định tiêm insulin dự phòng cho mọi sản phụ mang song thai từ tuần thứ 16."], "correct": 3, "decision": "Chốt quyết định: Song thai + BMI trước thai bình thường (18.5-24.9) -> Tăng cân khuyến cáo 16.8 - 24.5 kg (0.7 kg/tuần ở Q2-Q3) -> Năng lượng +600 kcal/ngày + Sắt 60-100 mg + Acid Folic 1 mg.\nTự kiểm V5.0: • Độ dài Stem: 215 từ | • Học vẹt: Áp dụng mức tăng cân của thai đơn (11.5-16 kg) cho song thai | • Phép tính kép: BMI 22.0 kg/m2 -> Ngưỡng khuyến cáo Viện Y học Hoa Kỳ IOM cho song thai 16.8-24.5 kg | • Điểm mù an toàn: Tăng cân kém ở quý 1 và quý 2 trong song thai liên quan trực tiếp đến nguy cơ sinh non và thai chậm tăng trưởng", "explanation": "Khuyến cáo của Viện Y học Hoa Kỳ (IOM) về tăng cân trong thai kỳ song thai đối với phụ nữ có BMI bình thường (18.5 - 24.9 kg/m2) là 16.8 - 24.5 kg (khoảng 37-54 lbs). Tốc độ tăng cân quý 2 và quý 3 khoảng 0.7 kg/tuần. Nhu cầu năng lượng bổ sung thêm khoảng 600 kcal/ngày so với chưa mang thai. Bổ sung bắt buộc: Sắt nguyên tố 60-100 mg/ngày và Acid Folic 1 mg/ngày để phòng ngừa thiếu máu.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 256-258).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] BMI bình thường mang song thai -> Tăng cân 16.8 - 24.5 kg (~17-25kg), +600 kcal/ngày, Sắt 60-100mg, Folic 1mg."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Tăng 5-8kg là mức của thai đơn béo phì, gây thai suy dinh dưỡng chậm phát triển."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Tăng > 40kg là quá mức sinh bệnh lý."}, {"letter": "D", "is_starred": true, "trap_text": "[qua_bao_ton] Không theo dõi cân nặng là thiếu sót."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm insulin đại trà là sai chống chỉ định."}]}, {"id": 10, "title": "CA LÂM SÀNG 10: SÀNG LỌC LỆCH BỘI TRONG THAI KỲ ĐA THAI & NIPT / CFDNA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 35 tuổi, PARA 1001, thai 12 tuần 1 ngày, mang song thai 2 nhau 2 ối DCDA thụ thai tự nhiên. Bệnh nhân đến tư vấn sàng lọc hội chứng Down và các lệch bội nhiễm sắc thể tại Trung tâm Chẩn đoán Trước sinh. Siêu âm đo độ mờ da gáy NT thai A = 1.4 mm, NT thai B = 1.6 mm, cả hai thai đều có xương mũi rõ. Bệnh nhân băn khoăn về giá trị chẩn đoán của xét nghiệm sinh hoá Double test so với xét nghiệm ADN tự do của thai nhi trong máu mẹ (NIPT / cfDNA) hoặc xét nghiệm chọc ối.", "question": "Câu hỏi 10: Tư vấn lựa chọn phương pháp sàng lọc lệch bội nhiễm sắc thể cho thai kỳ song thai chuẩn xác nhất?", "options": ["Xét nghiệm Double test sinh hóa có độ chính xác 100% cho song thai và hoàn toàn thay thế được thủ thuật chọc ối chẩn đoán.", "Chống chỉ định làm mọi xét nghiệm sàng lọc cho thai kỳ song thai vì không thể phân biệt được nguồn gốc ADN của hai thai nhi.", "Chỉ định chọc ối đại trà ngay lập tức cho 100% sản phụ mang song thai ở tuần thứ 12 mà không cần qua bất kỳ bước sàng lọc nào.", "Chỉ định chụp X-quang khung chậu mẹ để đánh giá cấu trúc xương sọ thai nhi tầm soát hội chứng Down.", "Xét nghiệm ADN tự do cfDNA / NIPT có độ nhạy và độ đặc hiệu cao nhất trên 98% trong sàng lọc Trisomy 21 ở song thai; nếu cfDNA hoặc siêu âm có bất thường chỉ định chẩn đoán xác định bằng chọc ối sinh thiết tua rau riêng biệt cho từng thai."], "correct": 4, "decision": "Chốt quyết định: Song thai + 35 tuổi -> Sàng lọc lệch bội -> NIPT / cfDNA (Độ nhạy T21 > 98%) -> Nếu nguy cơ cao / siêu âm bất thường -> Chọc ối / CVS chẩn đoán xác định riêng từng thai.\nTự kiểm V5.0: • Độ dài Stem: 225 từ | • Học vẹt: Thấy song thai cho làm Double test sinh hóa như thai đơn | • Phép tính kép: NT A = 1.4 mm, NT B = 1.6 mm (< 3.0 mm) -> Nguy cơ siêu âm thấp | • Điểm mù an toàn: Double test trong song thai bị pha loãng sinh hóa từ 2 thai nên hiệu quả kém hơn cfDNA/NIPT", "explanation": "Khuyến cáo ACOG và ISUOG: Xét nghiệm ADN tự do của thai nhi trong máu mẹ (cfDNA / NIPT) là phương pháp sàng lọc không xâm lấn có độ chính xác cao nhất đối với Trisomy 21 ở thai kỳ song thai (độ nhạy > 98%, tỷ lệ dương tính giả < 0.2%). Xét nghiệm sinh hóa Double test ở song thai có hiệu quả hạn chế hơn do sự pha loãng chất đánh dấu từ 2 thai. Khi cfDNA nguy cơ cao hoặc siêu âm có bất thường cấu trúc/NT dày, chỉ định xâm lấn (CVS hoặc chọc ối) là bắt buộc để chẩn đoán xác định cho từng thai.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 258-260).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] NIPT / cfDNA nhạy > 98% cho T21 trong song thai. Bất thường -> Chọc ối / Sinh thiết gai nhau chẩn đoán xác định."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_muc] Double test trong song thai có tỷ lệ dương tính giả cao và độ nhạy kém hơn thai đơn."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Chống chỉ định sàng lọc là sai."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Chọc ối đại trà 100% làm tăng rủi ro sẩy thai."}, {"letter": "E", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Chụp X-quang quý 1 nhiễm bức xạ ion hóa."}]}, {"id": 11, "title": "CA LÂM SÀNG 11: BẤT ĐỒNG ĐỘ MỜ DA GÁY DISCORDANT NT TRONG SONG THAI MCDA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, PARA 1001, thai 12 tuần 4 ngày, mang song thai 1 nhau 2 ối MCDA thụ thai tự nhiên. Bệnh nhân khám thai tại Bệnh viện Sản Nhi tỉnh. Siêu âm ngả âm đạo ghi nhận 1 bánh nhau mặt sau, màng phân cách T-sign mỏng 1.1 mm. Kết quả sinh trắc học và độ mờ da gáy NT: Thai A có CRL = 62 mm, NT = 1.5 mm (bình thường); Thai B có CRL = 60 mm, NT = 3.4 mm (dày bất thường > 95th percentile). Cả hai thai đều có tim thai rõ 155-160 lần/phút, chưa thấy bất thường vách liên thất hay hở van 3 lá trên Doppler siêu âm tim thai sớm. Vợ chồng sản phụ rất lo lắng về nguy cơ mắc biến chứng truyền máu song thai TTTS hoặc dị tật tim bẩm sinh.", "question": "Câu hỏi 11: Đánh giá ý nghĩa lâm sàng của sự bất đồng độ mờ da gáy NT và chiến lược quản lý thai kỳ chuẩn xác?", "options": ["Bất đồng NT ở song thai MCDA là dấu hiệu cảnh báo sớm nguy cơ phát triển hội chứng truyền máu song thai TTTS hoặc bất thường tim bẩm sinh; cần theo dõi siêu âm Doppler mỗi 2 tuần một lần từ tuần 16 và hội chẩn siêu âm tim thai chuyên sâu ở tuần 18-20.", "Bất đồng NT hoàn toàn không có ý nghĩa lâm sàng; cho sản phụ về nhà và hẹn siêu âm lại ở tuần thứ 36 trước sinh.", "Chỉ định phẫu thuật mổ lấy thai cấp cứu lập tức ở tuần 12 để cứu thai A có độ mờ da gáy bình thường.", "Chỉ định tiêm Methotrexate toàn thân để tiêu diệt thai B có NT dày bất thường mà không cần chọc ối.", "Chỉ định bơm 500 mL nước muối sinh lý vào buồng tử cung để làm xẹp khoang ối của thai B."], "correct": 0, "decision": "Chốt quyết định: MCDA + NT B 3.4 mm (> 95th) vs NT A 1.5 mm -> Bất đồng NT (Discordant NT) -> Dấu hiệu báo động sớm TTTS (nguy cơ gấp 4 lần) / Tim bẩm sinh -> Lập lịch siêu âm 2 tuần/lần từ 16w + Siêu âm tim thai 18-20w.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy 1 thai NT dày đòi tiêm MTX tử bỏ thai | • Phép tính kép: NT B = 3.4 mm > 3.0 mm (bách phân vị 95) -> NT dày | • Điểm mù an toàn: Tiêm MTX hủy thai trong song thai 1 nhau (MCDA) là CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI vì thuốc và chất độc sẽ qua thông nối mạch máu làm chết luôn thai còn lại", "explanation": "Sự bất đồng độ mờ da gáy (Discordant NT) ở song thai MCDA (khi 1 thai có NT > 95th percentile hoặc chênh lệch NT > 20%) là dấu hiệu cảnh báo sớm nguy cơ xuất hiện Hội chứng truyền máu song thai (TTTS) với nguy cơ tăng gấp 4 lần, cũng như nguy cơ dị tật tim bẩm sinh và thai chết trong tử cung. Phác đồ: Theo dõi siêu âm sát mỗi 2 tuần từ tuần 16 (đánh giá DVP nước ối, bàng quang) và siêu âm tim thai chuyên sâu mốc 18-20 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 260-262).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + Discordant NT (NT B = 3.4mm) -> Cảnh báo sớm TTTS / Dị tật tim -> Siêu âm 2w/lần từ 16w + Siêu âm tim thai 18-20w."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ qua bất đồng NT là thiếu sót nguy hiểm."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai ở tuần 12 là thô bạo sai lầm."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm MTX toàn thân trong MCDA sẽ làm chết cả 2 thai do thông nối mạch máu."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Bơm nước muối vào tử cung gây nhiễm trùng ối sẩy thai."}]}, {"id": 12, "title": "CA LÂM SÀNG 12: GIẢM THAI CHỌN LỌC SELECTIVE REDUCTION TRONG TAM THAI DCDA / TCTA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, PARA 0000, thai 12 tuần 0 ngày, mang tam thai sau điều trị kích thích rụng trứng và IUI. Kết quả siêu âm ngả âm đạo ghi nhận 3 túi thai phát triển độc lập với 3 bánh nhau và 3 khoang ối riêng biệt TCTA (Trichorionic Triamniotic). Sinh trắc học cả 3 thai tương đương nhau (CRL 55-58 mm), NT của 3 thai đều dưới 2.0 mm. Bệnh nhân thể trạng nhỏ thùy, BMI 19.2 kg/m2, chiều cao 148 cm. Sau khi nghe bác sĩ giải thích về nguy cơ sinh cực non (tuổi thai trung bình sinh tam thai là 33-34 tuần), nguy cơ tử vong chu sinh và tàn tật thần kinh cao, vợ chồng sản phụ nguyện vọng xin thực hiện giảm thai chọn lọc từ tam thai xuống song thai để đảm bảo an toàn cho thai kỳ.", "question": "Câu hỏi 12: Thời điểm, kỹ thuật giảm thai chọn lọc và phương pháp chuẩn xác nhất cho đa thai khác nhau DCDA/TCTA?", "options": ["Tiêm Methotrexate đường tĩnh mạch toàn thân liều cao cho sản phụ để cả 3 thai tự ngưng phát triển rồi làm IVF lại.", "Thời điểm giảm thai tối ưu ở tuần 11-13; kỹ thuật tiêm dung dịch Potassium Chloride KCl trực tiếp vào tim thai nhi được chọn giảm dưới hướng dẫn siêu âm ngả âm đạo hoặc ngả bụng; ưu tiên chọn thai có bất thường hình thái hoặc nằm ở vị trí thuận lợi kỹ thuật.", "Thực hiện thủ thuật nạo hút buồng tử cung bằng chân không tống xuất cả 3 thai nhi ở tuần thứ 12.", "Tiêm Kali Clorua KCl trực tiếp vào cuống rốn của cả 3 thai nhi để hủy toàn bộ thai kỳ.", "Khuyên sản phụ về nhà nằm ngửa cố định tại giường suốt 6 tháng tới và tuyệt đối không can thiệp thủ thuật."], "correct": 1, "decision": "Chốt quyết định: Tam thai TCTA 12w + Nguyện vọng giảm thai -> Thời điểm 11-13w -> Tiêm KCl vào tim thai được chọn (thai bất thường/vị trí thuận lợi) -> Giảm xuống song thai an toàn.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy tam thai đòi tiêm MTX toàn thân đường tĩnh mạch | • Phép tính kép: Tam thai TCTA (3 nhau 3 ối) -> Hệ tuần hoàn riêng lẻ -> Tiêm KCl vào tim thai an toàn không ảnh hưởng thai khác | • Điểm mù an toàn: Tiêm KCl chỉ áp dụng cho đa thai khác nhau (Dichorionic/Trichorionic). Nếu dùng KCl cho song thai 1 nhau (MCDA) sẽ làm chết luôn thai còn lại", "explanation": "Giảm thai chọn lọc (Selective Fetal Reduction) ở đa thai bậc cao (tam thai, tứ thai) giúp giảm nguy cơ sinh cực non, tử vong và di chứng thần kinh. Ở đa thai khác nhau (Trichorionic TCTA hoặc Dichorionic DCDA), do hệ tuần hoàn các thai hoàn toàn riêng biệt, kỹ thuật chuẩn mực là tiêm dung dịch Potassium Chloride (KCl 15-20%) trực tiếp vào tim thai nhi được chọn ở mốc 11-13 tuần dưới hướng dẫn siêu âm. Tiêu chuẩn chọn thai giảm: Thai có dị tật/NT dày nhất, hoặc thai nằm ở bánh nhau mặt trước gần thành bụng thuận lợi kỹ thuật.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 262-264).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Tam thai TCTA 12w -> Giảm thai chọn lọc xuống song thai ở 11-13w bằng tiêm KCl vào tim thai nhi được chọn."}, {"letter": "B", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX toàn thân làm sẩy toàn bộ thai kỳ."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Nạo hút buồng tử cung phá hủy thai kỳ."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Tiêm KCl hủy cả 3 thai là sai mục đích."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Nằm ngửa cố định không giảm được nguy cơ sinh cực non của tam thai."}]}, {"id": 13, "title": "CA LÂM SÀNG 13: KỸ THUẬT CAN THIỆP HỦY THAI CHỌN LỌC TRONG SONG THAI 1 NHAU MCDA", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 16 tuần 2 ngày, mang song thai 1 nhau 2 ối MCDA. Thai A có sinh trắc học bình thường (EFW 160g, DVP nước ối 4.5 cm). Thai B bị dị tật não không thóp Anencephaly nặng (không có vòm sọ), tim thai vẫn đập mạnh 150 lần/phút. Gia đình mong muốn hủy thai dị tật B để bảo vệ thai A phát triển lành lặn. Bác sĩ tư vấn về phương pháp hủy thai chọn lọc cho song thai chung bánh nhau MCDA.", "question": "Câu hỏi 13: Thẩm định chống chỉ định của bơm KCl và kỹ thuật can thiệp tắc mạch cuống rốn chuẩn xác nhất cho song thai 1 nhau MCDA?", "options": ["Tiêm KCl trực tiếp vào tim thai B như song thai 2 nhau DCDA thông thường vì thuốc không thể đi qua bánh nhau.", "Tiêm Methotrexate toàn thân liều cao cho sản phụ để tiêu diệt thai dị tật B.", "Chống chỉ định tuyệt đối tiêm KCl vào tim thai B vì KCl sẽ qua thông nối mạch máu bánh nhau làm ngừng tim luôn thai A; kỹ thuật bắt buộc là tắc mạch cuống rốn thai B bằng sóng cao tần RFA hoặc đốt dây rốn bằng Laser / Kẹp bipolar.", "Chỉ định mổ lấy thai khẩn cấp ngay ở tuần 16 để lấy thai dị tật B ra ngoài.", "Chờ đến khi sinh ngả âm đạo đủ tháng mới xử trí thai dị tật B."], "correct": 2, "decision": "Chốt quyết định: Song thai 1 nhau MCDA + 1 thai dị tật nặng B -> CẤM tiêm KCl vào tim thai -> Bắt buộc dùng RFA (Radiofrequency Ablation) / Laser / Kẹp Bipolar hoại tử dây rốn thai B.\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Tiêm KCl hủy thai dị tật trong song thai 1 nhau MCDA | • Phép tính kép: MCDA có thông nối mạch máu bánh nhau -> KCl truyền sang thai lành -> Ngừng tim cả 2 thai | • Điểm mù an toàn: Tiêm KCl hủy thai chỉ áp dụng cho DCDA (2 nhau). Đối với MCDA (1 nhau), hủy thai chọn lọc BẮT BUỘC phải làm tắc mạch dây rốn (Occlusive procedure)", "explanation": "Trong song thai 1 nhau (MCDA), sự hiện diện của các thông nối mạch máu trên bánh nhau là cạm bẫy tử huyệt: Nếu tiêm KCl hoặc chất độc vào 1 thai, thuốc sẽ đi qua cầu nối mạch máu sang thai kia gây tử vong cho cả 2 thai. Do đó, tiêm KCl là CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI trong MCDA. Phương pháp hủy thai chọn lọc chuẩn mực (Selective Cord Occlusion): Dùng sóng cao tần RFA (Radiofrequency Ablation), Laser đốt dây rốn hoặc kẹp lưỡng cực Bipolar dưới hướng dẫn siêu âm/nội soi bào thai để làm tắc hoàn toàn dòng máu nuôi thai dị tật.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 264-266).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai 1 nhau MCDA có thai dị tật B -> CẤM tiêm KCl -> Bắt buộc dùng RFA / Laser / Kẹp Bipolar làm tắc mạch cuống rốn thai B."}, {"letter": "B", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl trong 1 nhau MCDA là tử huyệt làm chết cả thai A."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX toàn thân làm ngạt chết thai A."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai ở tuần 16 phá hủy thai kỳ."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Chờ đủ tháng thai B có thể gây đa ối vỡ ối sinh non."}]}, {"id": 14, "title": "CA LÂM SÀNG 14: HỘI CHỨNG TRUYỀN MÁU SONG THAI TTTS QUINTERO GIAI ĐOẠN I", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, PARA 1001, thai 18 tuần 4 ngày, mang song thai 1 nhau 2 ối MCDA. Bệnh nhân khám thai tại Trung tâm Can thiệp Bào thai. Siêu âm Doppler thai nhi chuyên sâu ghi nhận: Thai A (thai cho) nằm trong khoang ối bị cạn nặng với xoang ối lớn nhất DVP = 1.4 cm (dưới 2 cm), bàng quang thai A nhỏ nhưng vẫn quan sát thấy nước tiểu sau 45 phút theo dõi. Thai B (thai nhận) nằm trong khoang ối đa ối nặng với xoang ối lớn nhất DVP = 9.5 cm (trên 8 cm), bàng quang căng to bão hòa. Khảo sát phổ Doppler ĐM rốn, ĐM não giữa và Ống tĩnh mạch của cả hai thai nhi đều trong giới hạn bình thường. Sản phụ chưa có cơn co tử cung, cổ tử cung dài 34 mm.", "question": "Câu hỏi 14: Phân độ Quintero và phác đồ xử trí khuyến cáo chuẩn xác nhất cho ca bệnh?", "options": ["Hội chứng truyền máu song thai TTTS Quintero Giai đoạn IV, chỉ định phẫu thuật mổ lấy thai cấp cứu ngay lập tức ở tuần thứ 18 để cứu hai thai nhi.", "Chẩn đoán Song thai hai nhau hai ối DCDA bình thường, cho sản phụ về nhà và hẹn tái khám sau hai tháng.", "Chẩn đoán Thai chậm tăng trưởng chọn lọc sFGR Gratacós Type III, chỉ định tiêm Methotrexate toàn thân liều cao cho mẹ.", "Hội chứng truyền máu song thai TTTS Quintero Giai đoạn I, phác đồ điều trị ưu tiên là theo dõi sát bằng siêu âm mỗi tuần hoặc cân nhắc phẫu thuật laser quang đông màng ối FLOC nếu đa ối tiến triển nhanh gây dọa sinh non.", "Chẩn đoán Vỡ ối mạn tính, chỉ định truyền 2.000 mL nước muối sinh lý trực tiếp vào buồng ối thai A."], "correct": 3, "decision": "Chốt quyết định: MCDA + Thai cho DVP < 2 cm + Thai nhận DVP > 8 cm + Bàng quang thai cho (+) + Doppler bình thường -> TTTS Quintero Giai đoạn I -> Theo dõi 1 tuần/lần hoặc FLOC nếu đa ối dọa sinh non.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy DVP < 2 cm và > 8 cm chẩn đoán ngay Quintero giai đoạn III | • Phép tính kép: DVP Thai A = 1.4 cm (< 2.0) & DVP Thai B = 9.5 cm (> 8.0) + Bàng quang thai cho (+) -> Quintero I | • Điểm mù an toàn: Quintero I có 30% tự thuyên giảm ổn định, có thể theo dõi sát trước khi quyết định FLOC xâm lấn", "explanation": "Phân độ Quintero cho Hội chứng truyền máu song thai (TTTS): Giai đoạn I được định nghĩa khi có chênh lệch nước ối (Thiếu ối thai cho DVP < 2 cm, Đa ối thai nhận DVP > 8 cm trước 20w hoặc > 10 cm sau 20w), nhưng bàng quang thai cho VẪN QUAN SÁT THẤY và phổ Doppler chưa bất thường. Phác đồ Giai đoạn I: Theo dõi sát siêu âm 1 tuần/lần (30% ổn định/thoái triển) hoặc can thiệp Laser quang đông thông nối mạch máu (FLOC) nếu đa ối tiến triển nhanh dọa vỡ ối/sinh non.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 266-268).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Thai cho DVP < 2cm + Thai nhận DVP > 8cm + thấy bàng quang thai cho + Doppler bình thường -> TTTS Quintero I. Xử trí: Theo dõi 1w/lần hoặc FLOC khi đa ối tiến triển."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_muc] Nhầm sang Giai đoạn IV và đòi mổ lấy thai ở tuần 18."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm DCDA hẹn 2 tháng/lần là bỏ sót TTTS nặng."}, {"letter": "D", "is_starred": true, "trap_text": "[nham_dan_so] Nhầm sFGR Gratacós III."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Bơm nước muối 2000ml làm vỡ tử cung."}]}, {"id": 15, "title": "CA LÂM SÀNG 15: HỘI CHỨNG TRUYỀN MÁU SONG THAI TTTS QUINTERO GIAI ĐOẠN II", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, PARA 1001, thai 19 tuần 2 ngày, mang song thai 1 nhau 2 ối MCDA. Siêu âm kiểm tra tại Trung tâm Can thiệp Bào thai ghi nhận: Thai A (thai cho) bị cạn ối hoàn toàn DVP = 0.8 cm, thai bị bó chặt vào bánh nhau (Stuck twin), quan sát liên tục trong 60 phút hoàn toàn KHÔNG THẤY bàng quang thai A. Thai B (thai nhận) đa ối mức độ nặng DVP = 11.2 cm, bàng quang căng to d = 25 mm. Khảo sát phổ Doppler ĐM rốn hai thai còn sóng tâm trương (chưa mất/đảo ngược). Bệnh nhân bắt đầu xuất hiện các cơn co tử cung nhẹ do đa ối căng trướng làm cổ tử cung ngắn lại còn 26 mm.", "question": "Câu hỏi 15: Phân độ Quintero và phương pháp điều trị chọn lựa hàng đầu chuẩn y văn là gì?", "options": ["Hội chứng truyền máu song thai TTTS Quintero Giai đoạn I, chỉ định cho sản phụ về nhà uống nước chè xanh và nghỉ ngơi.", "Hội chứng truyền máu song thai TTTS Quintero Giai đoạn V, chỉ định mổ lấy thai cấp cứu ngay lập tức.", "Chẩn đoán Thai ngoài tử cung vỡ, chỉ định mổ mở cấp cứu cắt tử cung toàn phần.", "Chẩn đoán Hở eo cổ tử cung đơn thuần, chỉ định khâu vòng cổ tử cung khẩn cấp mà không cần can thiệp bánh nhau.", "Hội chứng truyền máu song thai TTTS Quintero Giai đoạn II, phương pháp điều trị chuẩn mực chọn lựa hàng đầu là Phẫu thuật laser quang đông các thông nối mạch máu bánh nhau qua nội soi bào thai FLOC."], "correct": 4, "decision": "Chốt quyết định: MCDA 19w + DVP cho 0.8 cm + DVP nhận 11.2 cm + KHÔNG thấy bàng quang thai cho (60p) + Doppler chưa mất tâm trương -> TTTS Quintero Giai đoạn II -> Can thiệp chuẩn mực: FLOC (Fetoscopic Laser Photocoagulation).\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy bàng quang thai cho không thấy đòi khâu vòng cổ tử cung | • Phép tính kép: DVP cho 0.8 cm (< 2.0) & nhận 11.2 cm (> 8.0) + Không thấy bàng quang -> Quintero II | • Điểm mù an toàn: FLOC từ 16-26 tuần là phương pháp duy nhất giải quyết triệt để nguyên nhân thông nối mạch máu trong TTTS Quintero II-IV", "explanation": "TTTS Quintero Giai đoạn II được xác định khi có tiêu chuẩn Giai đoạn I kèm theo KHÔNG QUAN SÁT THẤY bàng quang thai cho (do giảm tưới máu thận trầm trọng dẫn đến vô niệu), trong khi phổ Doppler vẫn chưa có sóng bất thường. Phẫu thuật laser quang đông các thông nối mạch máu bánh nhau qua nội soi bào thai (FLOC - Fetoscopic Laser Photocoagulation) là phương pháp chuẩn vàng điều trị TTTS từ giai đoạn II đến IV trước 26 tuần, giúp nâng tỷ lệ sống của ít nhất 1 thai lên 75-80%.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 268-270).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] DVP thai cho < 2cm + DVP thai nhận > 8cm + Không thấy bàng quang thai cho trong 60 phút -> Quintero II. Chuẩn mực: FLOC (Laser photocoagulation)."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm Quintero I và cho về nhà nghỉ ngơi."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Nhầm Quintero V và đòi mổ lấy thai."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm thai ngoài tử cung vỡ."}, {"letter": "E", "is_starred": true, "trap_text": "[phan_biet_hep] Khâu vòng cổ tử cung khi đa ối căng trướng là sai lầm gây rách CTC."}]}, {"id": 16, "title": "CA LÂM SÀNG 16: HỘI CHỨNG TRUYỀN MÁU SONG THAI TTTS QUINTERO GIAI ĐOẠN III", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 27 tuổi, PARA 1001, thai 21 tuần 0 ngày, mang song thai MCDA. Siêu âm Doppler chẩn đoán bào thai ghi nhận: Thai A (thai cho) cạn ối hoàn toàn DVP = 0 cm, không thấy bàng quang. Phổ Doppler Động mạch rốn thai A bị MẤT SÓNG TÂM TRƯƠNG (Absent End-Diastolic Flow - AEDF). Thai B (thai nhận) đa ối DVP = 12.5 cm, bàng quang to. Phổ Doppler Ống tĩnh mạch (Ductus Venosus) của thai B có SÓNG A ĐẢO NGƯỢC (Reversed a-wave), thể hiện tình trạng quá tải thể tích và suy tim phải cấp tính. Cả hai thai nhi chưa có biểu hiện phù toàn thân. Bác sĩ tư vấn mức độ nguy hiểm cấp bách.", "question": "Câu hỏi 16: Phân độ Quintero và phác đồ can thiệp bào thai cấp cứu chuẩn xác nhất là gì?", "options": ["Hội chứng truyền máu song thai TTTS Quintero Giai đoạn III, chỉ định phẫu thuật can thiệp bào thai Laser quang đông màng nhau FLOC cấp cứu khẩn cấp để cắt đứt các thông nối mạch máu.", "Hội chứng truyền máu song thai TTTS Quintero Giai đoạn I, cho sản phụ về nhà uống thuốc sắt và nằm nghiêng trái.", "Chẩn đoán Thai chết lưu cả hai thai, chỉ định dùng thuốc Misoprostol tống thai lưu ra ngoài.", "Chẩn đoán Hở eo cổ tử cung, chỉ định đặt vòng nâng Arabin pessary và cho về nhà.", "Chẩn đoán Suy giáp thai kỳ, chỉ định uống Levothyroxine liều cao."], "correct": 0, "decision": "Chốt quyết định: MCDA + cạn ối/đa ối + không thấy bàng quang + Doppler bất thường (AEDF ĐM rốn thai A, đảo ngược sóng a DV thai B) -> TTTS Quintero Giai đoạn III -> Can thiệp cấp cứu: FLOC (Laser photocoagulation).\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy Doppler bất thường đoán ngay thai đã chết | • Phép tính kép: Bất thường Doppler rốn/ống tĩnh mạch ở 1 trong 2 thai -> Quintero III | • Điểm mù an toàn: Quintero III nếu không FLOC cấp cứu thì nguy cơ tử vong cả 2 thai trong vòng vài ngày lên tới 90%", "explanation": "TTTS Quintero Giai đoạn III xuất hiện khi có tiêu chuẩn Giai đoạn I hoặc II kèm theo BẤT THƯỜNG PHỔ DOPPLER ở một hoặc cả hai thai (Mất/đảo ngược sóng tâm trương ĐM rốn ở thai cho; Đảo ngược sóng a Ống tĩnh mạch DV hoặc phổ mạch đập Tĩnh mạch rốn ở thai nhận). Đây là tình trạng nguy kịch thể hiện sự suy sụp tuần hoàn và suy tim. Chỉ định cấp cứu: Phẫu thuật FLOC cắt đứt các thông nối mạch máu.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 270-272).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] TTTS + Bất thường Doppler (AEDF ĐM rốn thai cho / Đảo ngược sóng a Ductus venosus thai nhận) -> Quintero III. Cấp cứu: FLOC khẩn cấp."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm Quintero I cho về nhà uống sắt."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Nhầm thai chết lưu cả 2 thai."}, {"letter": "D", "is_starred": false, "trap_text": "[phan_biet_hep] Nhầm hở eo cổ tử cung."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm suy giáp."}]}, {"id": 17, "title": "CA LÂM SÀNG 17: HỘI CHỨNG TRUYỀN MÁU SONG THAI TTTS QUINTERO GIAI ĐOẠN IV & V", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 25 tuần 3 ngày, mang song thai MCDA, nhập viện Bệnh viện Sản Nhi tỉnh trong tình trạng đa ối căng trướng cấp tính, bụng to nhanh trong 3 ngày, đau tức dồn dập. Siêu âm Doppler ghi nhận: Thai A (thai cho) cạn ối, bó chặt. Thai B (thai nhận) đa ối nghiêm trọng DVP = 14.0 cm, xuất hiện tràn dịch màng ngoài tim d = 5 mm, tràn dịch màng phổi hai bên và phù dưới da đầu d = 6 mm (phù thai Hydrops fetalis). Phổ Doppler Ống tĩnh mạch thai B đảo ngược sóng a nặng. Sinh hiệu sản phụ: Mạch 100 lần/phút, HA 120/80 mmHg, cổ tử cung xóa 80%, mở 2 cm.", "question": "Câu hỏi 17: Phân độ Quintero và thái độ xử trí sản khoa khẩn cấp chuẩn xác nhất là gì?", "options": ["Hội chứng truyền máu song thai TTTS Quintero Giai đoạn I, cho sản phụ uống nifedipine và về nhà theo dõi.", "Hội chứng truyền máu song thai TTTS Quintero Giai đoạn IV có phù thai Hydrops, phác đồ xử trí khẩn cấp là hội chẩn can thiệp bào thai FLOC giải cứu nếu còn điều kiện hoặc chọc rút bớt nước ối giải áp kết hợp tiêm Corticoid trưởng thành phổi.", "Chẩn đoán Thai chết lưu cả hai thai, cho uống Misoprostol nạo thai.", "Chẩn đoán Thai ngoài tử cung, mổ cắt tử cung.", "Chẩn đoán Nhiễm trùng đường tiết niệu, cho uống Amoxicillin."], "correct": 1, "decision": "Chốt quyết định: MCDA 25w3d + cạn ối/đa ối 14cm + Phù thai Hydrops (tràn dịch màng tim/màng phổi/da đầu thai B) -> TTTS Quintero Giai đoạn IV -> Can thiệp: FLOC / Chọc rút nước ối giải áp + Corticoid trưởng thành phổi.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy tràn dịch màng tim màng phổi chẩn đoán thai chết lưu Quintero V | • Phép tính kép: Phù thai (Hydrops) >= 2 khoang cơ thể -> Quintero IV | • Điểm mù an toàn: Quintero IV có nguy cơ tử vong thai nhi rất cao, cần kết hợp giải áp ối dọa sinh non và cân nhắc can thiệp bào thai khẩn", "explanation": "TTTS Quintero Giai đoạn IV được chẩn đoán khi một hoặc cả hai thai nhi xuất hiện dấu hiệu Phù thai (Hydrops fetalis: Tràn dịch màng ngoài tim, tràn dịch màng phổi, cổ trướng, hoặc phù dưới da > 5 mm). Giai đoạn V là khi có tử vong của ít nhất 1 thai nhi. Xử trí Giai đoạn IV ở tuổi thai 25 tuần: Cần đánh giá khả năng FLOC hoặc Chọc rút nước ối đại thể giải áp (Amnioreduction) để giảm áp lực buồng tử cung ngừa sẩy thai/sinh non, phối hợp tiêm Corticoid trưởng thành phổi.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 272-274).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] TTTS + Phù thai Hydrops ở thai nhận -> Quintero IV. Xử trí: FLOC / Chọc rút nước ối giải áp + Corticoid."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_bao_ton] Nhầm Quintero I cho về nhà."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Nhầm thai chết lưu cả 2 thai."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm thai ngoài tử cung."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm nhiễm trùng tiết niệu."}]}, {"id": 18, "title": "CA LÂM SÀNG 18: THAI CHẬM TĂNG TRƯỞNG CHỌN LỌC SFGR GRATACÓS TYPE I", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, PARA 1001, thai 22 tuần 1 ngày, mang song thai MCDA. Siêu âm định kỳ tại Bệnh viện Sản Nhi tỉnh ghi nhận: Thai A phát triển bình thường với ước tính trọng lượng EFW = 480g (bách phân vị 50th). Thai B nhỏ hơn rõ rệt với EFW = 320g (dưới bách phân vị 3rd). Mức độ bất đồng trọng lượng giữa 2 thai = (480 - 320) / 480 = 33.3% (bất đồng > 25%). Xoang ối lớn nhất DVP thai A = 5.2 cm, DVP thai B = 3.1 cm (không có cạn ối/đa ối theo tiêu chuẩn TTTS). Khảo sát phổ Doppler Động mạch rốn thai B: Sóng tâm trương dương tính liên tục (Positive End-Diastolic Flow), chỉ số PI ĐM rốn = 1.2 (trong giới hạn bình thường).", "question": "Câu hỏi 18: Phân loại sFGR theo Gratacós và tiên lượng chiến lược quản lý lâm sàng chuẩn xác nhất là gì?", "options": ["Chẩn đoán sFGR Gratacós Type II, chỉ định phẫu thuật mổ lấy thai cấp cứu ngay ở tuần 22.", "Chẩn đoán sFGR Gratacós Type III, chỉ định tiêm KCl hủy thai B ngay lập tức.", "Chẩn đoán Thai chậm tăng trưởng chọn lọc sFGR Gratacós Type I, tiên lượng tốt nhất trong các týp sFGR; phác đồ là theo dõi siêu âm Doppler 1 đến 2 tuần một lần và dưỡng thai theo dõi đến 34 đến 36 tuần.", "Chẩn đoán Hội chứng truyền máu song thai Quintero giai đoạn III, tiêm Methotrexate toàn thân.", "Chẩn đoán Thai chết lưu cả hai thai, nạo hút buồng tử cung."], "correct": 2, "decision": "Chốt quyết định: MCDA + EFW B < 3rd + Bất đồng EFW 33.3% (> 25%) + KHÔNG TTTS + Doppler ĐM rốn thai nhỏ DƯƠNG TÍNH liên tục -> sFGR Gratacós Type I -> Tiên lượng tốt -> Siêu âm Doppler 1-2 tuần/lần, quản lý đến 34-36w.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy chênh lệch trọng lượng > 25% đòi mổ lấy thai ngay | • Phép tính kép: Chênh lệch EFW = (480-320)/480 = 33.3% > 25% & EFW B < 3rd -> sFGR | • Điểm mù an toàn: sFGR Type I có dòng máu ĐM rốn bình thường, tiến triển lành tính (> 90% sống), không cần can thiệp xâm lấn vội vã", "explanation": "Chậm tăng trưởng chọn lọc trong song thai (sFGR) được chẩn đoán khi 1 thai có EFW < 10th percentile và mức độ bất đồng trọng lượng > 25%. Phân loại Gratacós dựa trên phổ Doppler ĐM rốn của thai nhỏ: Type I có dòng tâm trương DƯƠNG TÍNH liên tục (bình thường). Type I có diễn tiến lâm sàng lành tính nhất, tỷ lệ sống > 90%, ít nguy cơ thai chết đột ngột. Phác đồ: Theo dõi siêu âm tăng trưởng và Doppler mỗi 1-2 tuần, chấm dứt thai kỳ mốc 34-36 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 274-276).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + sFGR (chênh lệch > 25%, EFW B < 3rd) + Doppler ĐM rốn thai nhỏ DƯƠNG TÍNH liên tục -> sFGR Gratacós Type I. Tiên lượng tốt, siêu âm 1-2w/lần."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_muc] Nhầm Type II đòi mổ ở tuần 22."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl hủy thai trong MCDA là tử huyệt."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm TTTS III."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_muc] Nhầm thai chết lưu."}]}, {"id": 19, "title": "CA LÂM SÀNG 19: THAI CHẬM TĂNG TRƯỞNG CHỌN LỌC SFGR GRATACÓS TYPE II", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, PARA 1001, thai 24 tuần 2 ngày, mang song thai MCDA. Siêu âm tại Trung tâm Can thiệp Bào thai ghi nhận: Thai A EFW = 650g (50th). Thai B EFW = 380g (< 3rd), mức độ bất đồng EFW = 41.5%. Nước ối hai thai bình thường DVP A = 4.8 cm, DVP B = 2.6 cm (không phải TTTS). Phổ Doppler Động mạch rốn thai B nhỏ bị MẤT HOẶC ĐẢO NGƯỢC SÓNG TÂM TRƯƠNG LIÊN TỤC (Persistent AREDF: Absent/Reversed End-Diastolic Flow). Chỉ sống Doppler Ống tĩnh mạch DV thai B bắt đầu có sóng a thấp mờ. Bác sĩ phân tích rủi ro thai B chết đột ngột cao và nguy cơ tổn thương não thai A.", "question": "Câu hỏi 19: Phân loại Gratacós và chiến lược tư vấn / quản lý lâm sàng nguy cơ cao chuẩn xác nhất là gì?", "options": ["Chẩn đoán sFGR Gratacós Type I, cho sản phụ về nhà nằm nghiêng trái và hẹn tái khám sau một tháng.", "Chẩn đoán Song thai hai nhau hai ối DCDA bình thường, không cần can thiệp.", "Chỉ định tiêm KCl trực tiếp vào tim thai B để hủy thai nhỏ ngay lập tức.", "Chẩn đoán sFGR Gratacós Type II, nguy cơ thai nhỏ chết đột ngột cao lên tới 29% và gây tụt huyết áp tổn thương não cho thai lớn; cần tư vấn nguy cơ, theo dõi sát Doppler 2-3 lần/tuần, tiêm Corticoid và chuẩn bị mổ lấy thai mốc 28 đến 32 tuần.", "Chỉ định nạo hút buồng tử cung bằng chân không tống xuất cả hai thai."], "correct": 3, "decision": "Chốt quyết định: MCDA + sFGR bất đồng 41.5% + Doppler ĐM rốn thai nhỏ MẤT/ĐẢO NGƯỢC LIÊN TỤC (Persistent AREDF) -> sFGR Gratacós Type II -> Nguy cơ thai chết đột ngột 29% -> Theo dõi Doppler 2-3 lần/tuần + Corticoid + Mổ lấy thai 28-32w.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy sFGR Type II đòi tiêm KCl hủy thai nhỏ ngay | • Phép tính kép: Bất đồng EFW 41.5% > 25% + AREDF ĐM rốn liên tục -> Gratacós Type II | • Điểm mù an toàn: sFGR Type II có trở kháng mạch máu bánh nhau rất cao, thai nhỏ có nguy cơ tử vong trong dạ cao, cần cân nhắc lợi ích/nguy cơ sinh cực non", "explanation": "sFGR Gratacós Type II có đặc trưng là phổ Doppler ĐM rốn của thai nhỏ bị MẤT HOẶC ĐẢO NGƯỢC SÓNG TÂM TRƯƠNG LIÊN TỤC (Persistent AREDF). Type II phản ánh diện tích bánh nhau nuôi thai nhỏ bị suy giảm trầm trọng (> 50-70%). Nguy cơ thai nhỏ chết trong tử cung lên tới 29%, và khi thai B chết sẽ lập tức gây tụt huyết áp cấp ở thai A qua thông nối mạch máu làm thai A tử vong hoặc tổn thương não vĩnh viễn (PVL). Quản lý: Siêu âm Doppler 2-3 lần/tuần, tiêm Corticoid và mổ lấy thai chủ động mốc 28-32 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 276-278).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + sFGR + AREDF ĐM rốn liên tục -> sFGR Gratacós Type II. Nguy cơ thai chết 29%, theo dõi Doppler 2-3 lần/w, Corticoid, mổ 28-32w."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm Type I hẹn 1 tháng là tử huyệt."}, {"letter": "C", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm DCDA."}, {"letter": "D", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl trong MCDA làm chết luôn thai A."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_xam_lan] Nạo hút buồng tử cung phá hủy thai kỳ."}]}, {"id": 20, "title": "CA LÂM SÀNG 20: THAI CHẬM TĂNG TRƯỞNG CHỌN LỌC SFGR GRATACÓS TYPE III", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001, thai 26 tuần 0 ngày, mang song thai MCDA. Siêu âm siêu lọc Doppler tại Trung tâm Can thiệp Bào thai ghi nhận: Thai A EFW = 820g (50th). Thai B EFW = 490g (< 3rd), bất đồng trọng lượng = 40.2%. Nước ối hai thai trong giới hạn bình thường. Đặc biệt khi thăm khám phổ Doppler Động mạch rốn thai B: Xuất hiện hình ảnh MẤT HOẶC ĐẢO NGƯỢC SÓNG TÂM TRƯƠNG NGẮT QUÃNG BIẾN ĐỔI (Intermittent AREDF), lúc thì sóng tâm trương dương tính bình thường, lúc lại mất hoặc đảo ngược hoàn toàn trong cùng một lần siêu âm. Bác sĩ giải thích cơ chế do thông nối động-động mạch (AA) kích thước lớn trên bề mặt bánh nhau.", "question": "Câu hỏi 20: Phân loại Gratacós và đặc điểm diễn tiến lâm sàng không dự đoán trước của týp này là gì?", "options": ["Chẩn đoán sFGR Gratacós Type I, cho sản phụ về nhà và không cần tái khám siêu âm thêm.", "Chẩn đoán Hội chứng truyền máu song thai Quintero giai đoạn IV, mổ lấy thai khẩn cấp.", "Chỉ định tiêm KCl trực tiếp vào cuống rốn thai A.", "Chỉ định nạo hút buồng tử cung chân không tống thai.", "Chẩn đoán sFGR Gratacós Type III, cơ chế do thông nối động động mạch AA lớn; diễn tiến cực kỳ khó dự đoán với nguy cơ thai nhỏ chết đột ngột không báo trước khoảng 15% hoặc tổn thương não thai lớn dù Doppler trước đó bình thường; cần theo dõi sát và cân nhắc can thiệp tắc mạch RFA hoặc mổ 32 tuần."], "correct": 4, "decision": "Chốt quyết định: MCDA + sFGR + Doppler ĐM rốn ngắt quãng biến đổi (Intermittent AREDF) -> sFGR Gratacós Type III -> Cơ chế thông nối AA lớn -> Nguy cơ thai nhỏ chết đột ngột khó dự báo trước -> Quản lý chặt chẽ / RFA / Mổ mốc 32w.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy Doppler ngắt quãng tưởng máy siêu âm bị hỏng | • Phép tính kép: Doppler rốn biến đổi lúc dương tính lúc AREDF -> Intermittent AREDF -> Type III | • Điểm mù an toàn: Type III có thể chuyển dạng đột ngột gây tử vong thai nhi mà phổ Doppler trước đó vài giờ vẫn bình thường do dòng máu đảo chiều qua thông nối AA lớn", "explanation": "sFGR Gratacós Type III đặc trưng bởi phổ Doppler ĐM rốn ngắt quãng biến đổi (Intermittent AREDF: Lúc bình thường, lúc mất, lúc đảo ngược sóng tâm trương). Cơ chế: Do sự hiện diện của thông nối Động mạch - Động mạch (AA) kích thước lớn trên bánh nhau làm dòng máu phụ thuộc vào sự chênh lệch huyết áp từng nhịp tim giữa 2 thai. Type III có đặc điểm lâm sàng cực kỳ nguy hiểm: Thai nhỏ có thể chết đột ngột mà không có dấu hiệu báo trước trên Doppler. Quản lý: Theo dõi sát, cân nhắc tắc mạch cuống rốn RFA nếu thai nhỏ suy suyển nặng hoặc mổ lấy thai ở tuần 32.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 278-280).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + sFGR + Doppler ĐM rốn ngắt quãng biến đổi (Intermittent AREDF) do thông nối AA lớn -> sFGR Gratacós Type III. Nguy cơ thai chết đột ngột khó dự đoán."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm Type I không tái khám."}, {"letter": "C", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm TTTS IV."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl là tử huyệt."}, {"letter": "E", "is_starred": true, "trap_text": "[qua_xam_lan] Nạo hút buồng tử cung."}]}, {"id": 21, "title": "CA LÂM SÀNG 21: HỘI CHỨNG THIẾU MÁU ĐA HỒNG CẦU SONG THAI TAPS & ĐO PSV-MCA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, PARA 1001, thai 23 tuần 4 ngày, mang song thai MCDA. Siêu âm chuyên sâu đo vận tốc đỉnh sóng tâm trương Động mạch não giữa (PSV-MCA) ghi nhận: Thai A (thai thiếu máu) có PSV-MCA = 48 cm/s tương đương 1.65 MoM (tăng cao > 1.5 MoM), hình ảnh tim to nhẹ và gan to. Thai B (thai đa hồng cầu) có PSV-MCA = 22 cm/s tương đương 0.82 MoM (giảm < 1.0 MoM), bánh nhau phía thai B tăng âm dày hình tổ ong. Nước ối cả hai thai hoàn toàn bình thường DVP A = 4.2 cm, DVP B = 4.5 cm (không có cạn ối hay đa ối).", "question": "Câu hỏi 21: Chẩn đoán hội chứng và chỉ định chẩn đoán / điều trị chuẩn y văn là gì?", "options": ["Chẩn đoán Hội chứng thiếu máu đa hồng cầu song thai TAPS Twin Anemia-Polycythemia Sequence, chỉ định theo dõi sát PSV-MCA hoặc truyền máu bào thai qua tĩnh mạch rốn cho thai A / truyền thay máu cho thai B hoặc can thiệp laser FLOC nếu tiến triển nặng.", "Chẩn đoán Hội chứng truyền máu song thai Quintero giai đoạn IV, mổ cắt tử cung.", "Chẩn đoán Song thai hai nhau hai ối DCDA bình thường, cho về nhà uống nước chanh.", "Chẩn đoán Thai ngoài tử cung vỡ, mổ mở cấp cứu.", "Chẩn đoán Viêm ruột thừa cấp ở thai phụ, chuyển phẫu thuật ngoại khoa."], "correct": 0, "decision": "Chốt quyết định: MCDA 23w4d + Nước ối bình thường + PSV-MCA thai A > 1.5 MoM & thai B < 1.0 MoM -> Hội chứng TAPS (Twin Anemia-Polycythemia Sequence) -> Điều trị: Theo dõi PSV-MCA / Truyền máu nội ối / FLOC.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy thiếu máu chẩn đoán ngay TTTS Quintero I | • Phép tính kép: PSV-MCA A = 1.65 MoM (> 1.5) & PSV-MCA B = 0.82 MoM (< 1.0) + Nước ối bình thường -> TAPS | • Điểm mù an toàn: TAPS khác TTTS ở chỗ KHÔNG CÓ chênh lệch nước ối (không cạn ối/đa ối), chẩn đoán dựa duy nhất vào siêu âm Doppler PSV-MCA", "explanation": "Hội chứng thiếu máu - đa hồng cầu song thai (TAPS - Twin Anemia-Polycythemia Sequence) xảy ra do sự thông nối mạch máu rất nhỏ (micro-anastomoses, d < 1 mm) truyền máu chậm ngầm giữa 2 thai MCDA. Khác với TTTS, TAPS KHÔNG CÓ sự chênh lệch nước ối. Chẩn đoán dựa trên Doppler PSV-MCA: Thai thiếu máu có PSV-MCA > 1.5 MoM, thai đa hồng cầu có PSV-MCA < 1.0 MoM (hoặc chênh lệch ΔPSV-MCA > 0.5 MoM). Điều trị: Theo dõi, truyền máu bào thai (IUT), laser FLOC hoặc mổ lấy thai tùy tuổi thai.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 280-282).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + Nước ối bình thường + PSV-MCA thai A > 1.5 MoM (thiếu máu) & thai B < 1.0 MoM (đa hồng cầu) -> TAPS. Điều trị: Theo dõi / Truyền máu bào thai / FLOC."}, {"letter": "B", "is_starred": false, "trap_text": "[phan_biet_hep] Nhầm sang TTTS Quintero IV."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm DCDA cho về nhà."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm thai ngoài vỡ."}, {"letter": "E", "is_starred": false, "trap_text": "[nham_dan_so] Nhầm viêm ruột thừa."}]}, {"id": 22, "title": "CA LÂM SÀNG 22: HỘI CHỨNG ĐẢO NGƯỢC TUẦN HOÀN ĐỘNG MẠCH SONG THAI TRAP / ACARDIAC TWIN", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, PARA 0000, thai 16 tuần 1 ngày, mang song thai MCDA. Siêu âm hình thái thai nhi tại Trung tâm Can thiệp Bào thai phát hiện hình ảnh kỳ lạ: Thai A phát triển bình thường, tim đập mạnh 152 lần/phút (thai bơm Pump twin). Thai B là một khối mô bất thường không có đầu, không có tim (thai không tim Acardiac twin / Acardiac acephalus), chỉ có chi dưới và phần thân dưới phát triển dơ dáng. Phổ Doppler màu ghi nhận dòng máu trong Động mạch rốn thai B bị ĐẢO NGƯỢC HƯỚNG (dòng máu đi ngược từ thai A qua thông nối ĐM-ĐM vào nuôi thai B). Thai A bắt đầu có dấu hiệu quá tải tuần hoàn với chỉ số tim/lồng ngực tăng.", "question": "Câu hỏi 22: Chẩn đoán hội chứng và kỹ thuật can thiệp bào thai tắc mạch cuống rốn chuẩn xác nhất là gì?", "options": ["Chẩn đoán Song thai hai nhau hai ối DCDA bình thường, không cần xử trí gì.", "Chẩn đoán Hội chứng đảo ngược tuần hoàn động mạch song thai TRAP Twin Reverse Arterial Perfusion / Thai không tim Acardiac twin, chỉ định phẫu thuật can thiệp bào thai tắc cuống mạch thai B bằng sóng cao tần RFA hoặc laser để bảo vệ thai A.", "Chẩn đoán Thai chết lưu cả hai thai, chỉ định nạo hút buồng tử cung tống thai.", "Chỉ định tiêm Potassium Chloride KCl vào tim thai A để hủy thai A.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu."], "correct": 1, "decision": "Chốt quyết định: MCDA + Thai A bình thường (Pump twin) + Thai B không tim (Acardiac twin) + Dòng ĐM rốn thai B đảo ngược -> TRAP Sequence -> Can thiệp: RFA (Radiofrequency Ablation) / Laser hoại tử cuống mạch thai B bảo vệ thai A.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy thai không tim đòi tiêm KCl vào tim thai A | • Phép tính kép: Dòng ĐM rốn thai B đảo ngược (Pump twin -> Acardiac twin) -> TRAP | • Điểm mù an toàn: TRAP khiến thai A phải nuôi cả khối mô thai B, nguy cơ suy tim phù thai và chết thai A tới 50-70% nếu không can thiệp tắc mạch thai B", "explanation": "Hội chứng TRAP (Twin Reverse Arterial Perfusion) hay Thai không tim (Acardiac twin) xảy ra ở 1% song thai MCDA. Do thông nối ĐM-ĐM và TM-TM lớn, máu nghèo oxy từ thai bình thường (Pump twin) bị đẩy ngược vào nuôi thai dị tật không tim (Acardiac twin). Thai A phải hoạt động tăng cường gấp đôi gây suy tim, đa ối và tử vong (50-70%). Can thiệp chọn lựa: Đốt tắc cuống mạch thai không tim B bằng sóng cao tần (RFA - Radiofrequency Ablation) ở mốc 16-18 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 282-284).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA + 1 thai bình thường (Pump twin) + 1 thai không tim (Acardiac twin) + Dòng ĐM rốn đảo ngược -> TRAP sequence. Can thiệp: RFA / Laser tắc cuống mạch thai không tim."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_bao_ton] Nhầm DCDA bình thường."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_muc] Nhầm thai chết lưu cả 2 thai."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl thai A là sai lầm giết chết thai lành."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}]}, {"id": 23, "title": "CA LÂM SÀNG 23: XỬ TRÍ THAI CHẾT MỘT THAI TRONG SONG THAI 1 NHAU MCDA", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 26 tuần 2 ngày, mang song thai MCDA. Siêu âm khẩn cấp tại Bệnh viện Sản Nhi tỉnh ghi nhận: Thai B đã bị CHẾT LƯU TRONG TỬ CUNG (không còn tim thai, phôi thai bị móp méo). Thai A hiện tại còn sống với tim thai 148 lần/phút, phổ Doppler ĐM rốn và ĐM脑giữa chưa có tụt huyết áp nặng. Sản phụ và gia đình hoảng loạn yêu cầu mổ lấy thai cấp cứu lập tức để cứu thai A. Bác sĩ nội trú phân tích cơ chế tụt huyết áp cấp qua thông nối mạch máu bánh nhau xảy ra ngay tại thời điểm thai B chết và tư vấn về rủi ro tổn thương não thai A (PVL) cũng như chống chỉ định mổ mổ lấy thai vội vã khi thai A chưa suy.", "question": "Câu hỏi 23: Thẩm định cơ chế tổn thương và thái độ xử trí sản khoa chuẩn xác nhất cho thai A còn sống?", "options": ["Mổ lấy thai cấp cứu ngay lập tức trong vòng 30 phút để ngăn ngừa máu độc từ thai B chảy sang thai A.", "Tiêm Methotrexate toàn thân cho sản phụ để tống xuất cả hai thai ra ngoài.", "Chống chỉ định mổ lấy thai cấp cứu ngay lập tức khi thai A chưa suy vì không ngăn ngừa được tổn thương não đã xảy ra tại thời điểm thai B chết; phác đồ là quản lý dưỡng thai A, siêu âm Doppler theo dõi sát và chụp MRI não thai A sau 4 tuần để tầm soát tổn thương chất trắng PVL.", "Tiêm Kali Clorua KCl vào tim thai A để kết thúc thai kỳ.", "Cho sản phụ về nhà và không cần theo dõi thêm."], "correct": 2, "decision": "Chốt quyết định: MCDA + 1 thai chết lưu ở 26w + thai A sống tốt -> KHÔNG mổ lấy thai cấp cứu ngay -> Tổn thương thiếu máu não thai A xảy ra trong vài phút đầu do tụt áp sang thai chết -> Quản lý dưỡng thai A + MRI não thai A sau 4 tuần.\nTự kiểm V5.0: • Độ dài Stem: 250 từ | • Học vẹt: Thấy 1 thai chết trong MCDA đòi mổ lấy thai cấp cứu ngay lập tức | • Phép tính kép: Thai B chết -> Áp lực mạch máu thai B = 0 -> Máu thai A chảy xói xả sang thai B làm thai A tụt huyết áp cấp & thiếu máu não | • Điểm mù an toàn: Tụt huyết áp truyền máu sang thai chết diễn ra trong vài phút đầu tại thời điểm thai B chết. Mổ lấy thai cấp cứu sau đó vài giờ không làm đảo ngược tổn thương não mà còn ép thai A chịu rủi ro sinh cực non 26 tuần", "explanation": "Khi 1 thai chết trong song thai 1 nhau (MCDA), mạch máu thai B giãn ra mất trương lực (áp lực = 0). Máu từ thai A bị hút xói xả qua các thông nối sang hệ tuần hoàn thai B, gây ra hiện tượng TỤT HUYẾT ÁP VÀ THIẾU MÁU CẤP TÍNH ở thai A ngay trong vài phút đầu. Nguy cơ thai A tử vong tiếp theo là 26% và nguy cơ tổn thương não (nhuyễn não thất PVL, dị tật hệ thần kinh) là 26-34%. Mổ lấy thai khẩn cấp NGAY LẬP TỨC KHÔNG CÓ GIÁ TRỊ ngăn ngừa tổn thương não (vì tổn thương đã xảy ra ngay lúc thai B chết), đồng thời lại đẩy thai A vào nguy cơ tử vong do sinh cực non. Phác đồ: Dưỡng thai A, theo dõi sát, chụp MRI não thai A sau 4 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 284-286).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] MCDA 26w + 1 thai chết -> CẤM mổ cấp cứu vội vã khi thai A chưa suy. Phác đồ: Dưỡng thai A + Siêu âm Doppler + Chụp MRI não thai A sau 4 tuần tầm soát PVL."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai cấp cứu ngay không cứu được não thai A mà còn làm thai A gánh thêm rủi ro sinh cực non."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX toàn thân làm nguy hiểm thai A."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Tiêm KCl thai A là sai lầm giết thai sống."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ rơi sản phụ không theo dõi."}]}, {"id": 24, "title": "CA LÂM SÀNG 24: XỬ TRÍ THAI CHẾT MỘT THAI TRONG SONG THAI 2 NHAU DCDA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001, thai 28 tuần 4 ngày, mang song thai 2 nhau 2 ối DCDA. Siêu âm kiểm tra tại Bệnh viện Sản Nhi tỉnh phát hiện: Thai B đã bị CHẾT LƯU TRONG TỬ CUNG (không tim thai, bóc tách màng ối nhẹ). Thai A phát triển bình thường với EFW = 1.250g, tim thai rõ 145 lần/phút, phổ Doppler ĐM rốn bình thường. Sinh hiệu mẹ: Mạch 80 lần/phút, Huyết áp 115/75 mmHg, Thân nhiệt 36.8°C. Xét nghiệm đông máu mẹ: Fibrinogen = 3.8 g/L, Tiểu cầu = 220.000/mm3, PT và aPTT trong giới hạn bình thường.", "question": "Câu hỏi 24: Phân tích nguy cơ biến chứng và chiến lược quản lý sản khoa an toàn nhất cho thai A và mẹ?", "options": ["Chỉ định mổ lấy thai cấp cứu lập tức ở tuần 28 vì thai B chết sẽ gây nhiễm trùng huyết toàn thân cho mẹ trong vòng 24 giờ.", "Tiêm Methotrexate toàn thân cho mẹ để hủy thai A.", "Chỉ định chọc ối xả toàn bộ nước ối thai A.", "Trong song thai DCDA, 1 thai chết không gây biến chứng mạch máu thần kinh nguy hiểm cho thai A; phác đồ là điều trị bảo tồn dưỡng thai A đến 37 tuần, theo dõi định kỳ đông máu mẹ Fibrinogen, D-Dimer và siêu âm Doppler đánh giá sức khỏe thai A.", "Cho sản phụ về nhà và không cần theo dõi xét nghiệm máu."], "correct": 3, "decision": "Chốt quyết định: DCDA + 1 thai chết ở 28w4d + Đông máu mẹ bình thường (Fibrinogen 3.8g/L) -> Hệ tuần hoàn riêng biệt -> Thai A an toàn -> Dưỡng thai A đến 37w + Theo dõi đông máu mẹ (tránh DIC).\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy 1 thai chết là mổ lấy thai cấp cứu ngay bất kể DCDA hay MCDA | • Phép tính kép: Fibrinogen 3.8 g/L (bình thường 2-4 g/L) -> Chưa có rối loạn đông máu DIC ở mẹ | • Điểm mù an toàn: DCDA có 2 bánh nhau riêng biệt nên thai A không bị rủi ro tụt huyết áp hay thiếu máu não như MCDA. Tuy nhiên thai chết lưu lâu ngày (> 4 tuần) có rủi ro giải phóng Thromboplastin gây DIC cho mẹ", "explanation": "Trái ngược với song thai MCDA, trong song thai 2 nhau 2 ối (DCDA), hai hệ tuần hoàn bánh nhau hoàn toàn riêng biệt. Khi 1 thai chết lưu, thai A còn sống KHÔNG BỊ ảnh hưởng bởi nguy cơ truyền máu tụt huyết áp hay tổn thương não. Nguy cơ chính là cho mẹ: Thai chết lưu kéo dài (> 3-4 tuần) có thể giải phóng Thromboplastin vào máu mẹ gây Hội chứng đông máu nội mạch rải rác (DIC). Quản lý: Dưỡng thai A tiếp tục phát triển, xét nghiệm đông máu mẹ (Fibrinogen, Tiểu cầu, D-Dimer) mỗi 1-2 tuần, chấm dứt thai kỳ mốc 37 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 286-288).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] DCDA 28w4d + 1 thai chết -> Không có thông nối mạch máu -> Thai A an toàn. Phác đồ: Dưỡng thai A đến 37w + Kiểm tra đông máu mẹ định kỳ (Fibrinogen)."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cấp cứu 28 tuần lãng phí thai A khi chưa có biến chứng đông máu."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm MTX hủy thai A là sai lầm."}, {"letter": "D", "is_starred": true, "trap_text": "[qua_xam_lan] Chọc xả ối thai A làm vỡ ối sinh non."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ rơi không xét nghiệm đông máu mẹ."}]}, {"id": 25, "title": "CA LÂM SÀNG 25: TỤ MÁU MÀNG ĐỆM SUBCHORIONIC HEMATOMA TRONG THAI KỲ ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, PARA 0000, thai 14 tuần 2 ngày, mang song thai DCDA thụ thai qua IVF. Bệnh nhân vào viện vì ra máu tươi âm đạo lượng ít, kèm đau trằn nhẹ vùng hạ vị. Sinh hiệu ổn định: Mạch 82 lần/phút, Huyết áp 115/75 mmHg. Thăm khám mỏ vịt: Cổ tử cung đóng kín, có ít máu đỏ sẫm đọng ở âm đạo. Siêu âm ngả âm đạo TVS ghi nhận: Hai thai nhi phát triển bình thường, tim thai (+) 155 lần/phút. Tại bánh nhau thai A phát triển một khối tụ máu dưới màng đệm (Subchorionic Hematoma) kích thước 35 x 18 mm, bóc tách khoảng 15% diện tích bánh nhau thai A. Bánh nhau thai B bình thường.", "question": "Câu hỏi 25: Đánh giá mức độ bóc tách và phác đồ điều trị dưỡng thai an toàn chuẩn xác nhất?", "options": ["Chỉ định nạo hút buồng tử cung bằng chân không ngay lập tức để tống xuất khối máu tụ.", "Chỉ định tiêm Methotrexate toàn thân liều cao cho mẹ.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu.", "Cho sản phụ về nhà đi lại vận động thể thao bình thường và không cần dùng thuốc.", "Tụ máu dưới màng đệm diện nhỏ bóc tách 15% diện tích nhau thai A,
