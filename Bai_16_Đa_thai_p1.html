 phác đồ điều trị bảo tồn là nằm nghỉ ngơi tại giường, bổ sung Progesterone tự nhiên đặt âm đạo hoặc tiêm bắp, theo dõi siêu âm đánh giá sự hấp thu khối tụ máu."], "correct": 4, "decision": "Chốt quyết định: Song thai DCDA 14w + Tụ máu dưới màng đệm bóc tách 15% nhau A -> Lượng ít (< 20%) -> Tiên lượng tốt -> Nằm nghỉ ngơi + Progesterone tự nhiên + Theo dõi tiến triển siêu âm.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy ra máu âm đạo tụ máu màng đệm đòi mổ cấp cứu | • Phép tính kép: Bóc tách 15% diện tích bánh nhau < 20% -> Bóc tách lượng ít | • Điểm mù an toàn: Khối tụ máu màng đệm < 20% diện tích nhau đa số tự thoái triển tái hấp thu trong 2-4 tuần nếu được điều trị dưỡng thai đúng phác đồ", "explanation": "Tụ máu dưới màng đệm (Subchorionic Hematoma) khá phổ biến trong thai kỳ đa thai IVF quý 1 và đầu quý 2. Khi diện tích bóc tách < 20% diện tích bánh nhau, tiên lượng dưỡng thai thành công rất cao (> 80-90%). Phác đồ: Nằm nghỉ ngơi tại chỗ, kiêng sinh hoạt tình dục, dùng Progesterone tự nhiên (dạng đặt âm đạo 200-400 mg/ngày hoặc dydrogesterone uống) để giảm co thắt tử cung và ổn định gai nhau, siêu âm kiểm tra mỗi 1-2 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 288-290).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai DCDA + Tụ máu dưới màng đệm bóc tách 15% (< 20%) -> Phác đồ: Nằm nghỉ + Progesterone tự nhiên + Theo dõi siêu âm hấp thu."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Nạo hút buồng tử cung phá hủy thai kỳ."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm MTX là tử huyệt."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo quá mức."}, {"letter": "E", "is_starred": true, "trap_text": "[qua_bao_ton] Vận động thể thao làm khối tụ máu bóc tách thêm."}]}, {"id": 26, "title": "CA LÂM SÀNG 26: DỰ PHÒNG TIỀN SẢN GIẬT TRONG THAI KỲ ĐA THAI & ASPIRIN LIỀU THẤP", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, PARA 0000, mang song thai DCDA 12 tuần 5 ngày qua IVF. Bệnh nhân đến khám thai định kỳ tại Bệnh viện Sản Nhi tỉnh. Tiền sử bản thân chưa ghi nhận tăng huyết áp mạn tính hay bệnh lý thận. Sinh hiệu hiện tại: Mạch 76 lần/phút, Huyết áp 120/78 mmHg, BMI trước thai 24.2 kg/m2. Siêu âm Doppler Động mạch tử cung quý 1 ghi nhận có khuyết tiền tâm trương (Notching) hai bên, chỉ số trở kháng PI trung bình ĐM tử cung = 1.85 (tăng cao > 95th percentile). Xét nghiệm nước tiểu chưa có đạm niệu. Bác sĩ tư vấn nguy cơ tiền sản giật cao gấp 2-3 lần ở thai kỳ đa thai và thiết kế phác đồ dự phòng cấp I.", "question": "Câu hỏi 26: Chỉ định sinh phẩm y học dự phòng tiền sản giật và thời điểm bắt đầu chuẩn y văn là gì?", "options": ["Chỉ định uống Aspirin liều thấp 150 mg/ngày vào buổi tối trước khi đi ngủ, bắt đầu từ tuần thứ 12 đến 16 và kéo dài liên tục đến tuần thứ 36 của thai kỳ.", "Chỉ định uống thuốc hạ áp Nifedipine retard 20 mg/ngày ngay từ tuần thứ 12 để ngăn ngừa tuyệt đối tiền sản giật.", "Chỉ định tiêm Heparin trọng lượng phân tử thấp LMWH tiêm dưới da hàng ngày suốt thai kỳ bất kể xét nghiệm đông máu.", "Chỉ định mổ lấy thai chủ động lập tức ở tuần thứ 12 để chấm dứt nguy cơ tiền sản giật cho mẹ.", "Khuyên sản phụ tuyệt đối không ăn muối và hạn chế uống nước dưới 500 mL/ngày."], "correct": 0, "decision": "Chốt quyết định: Song thai + PI ĐM tử cung quý 1 > 95th -> Nguy cơ Tiền sản giật cao gấp 2-3 lần -> Phác đồ dự phòng: Aspirin liều thấp 150 mg/ngày bắt đầu từ 12-16w kéo dài đến 36w.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy nguy cơ tiền sản giật cho uống Nifedipine dự phòng ngay | • Phép tính kép: PI ĐM tử cung = 1.85 > 95th percentile -> Tăng trở kháng mạch máu nuôi nhau | • Điểm mù an toàn: Aspirin liều thấp (100-150 mg/ngày) bắt đầu trước 16 tuần giảm 50% nguy cơ tiền sản giật xuất hiện sớm ở thai kỳ đa thai", "explanation": "Phụ nữ mang đa thai có nguy cơ mắc Tiền sản giật cao gấp 2-3 lần so với thai đơn do diện tích bánh nhau lớn và tăng tiết các yếu tố kháng mạch máu (sFlt-1). Khuyến cáo FIGO, ACOG và USPSTF: Bắt buộc dùng Aspirin liều thấp (100-150 mg/ngày uống buổi tối) bắt đầu từ tuần 12-16 (tốt nhất trước 16 tuần) đến 36 tuần cho tất cả phụ nữ mang đa thai để dự phòng tiền sản giật.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 290-292).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai + PI ĐM tử cung > 95th -> Nguy cơ tiền sản giật cao. Phác đồ: Aspirin liều thấp 150mg/ngày từ 12-16w đến 36w."}, {"letter": "B", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Thuốc hạ áp không có tác dụng dự phòng tiền sản giật khi chưa có huyết áp cao."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] LMWH không có chỉ định đại trà dự phòng tiền sản giật."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai ở tuần 12 là thô bạo sai lầm."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Hạn chế nước < 500ml gây cô đặc máu nguy hiểm."}]}, {"id": 27, "title": "CA LÂM SÀNG 27: TẦM SOÁT VÀ QUẢN LÝ ĐÁI THÁO ĐƯỜNG THAI KỲ TRONG ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, PARA 1001, mang song thai DCDA 24 tuần 1 ngày qua IVF. Bệnh nhân thực hiện nghiệm pháp nạp 75g Glucose 3 mẫu tầm soát Đái tháo đường thai kỳ tại Bệnh viện Sản Nhi tỉnh. Kết quả: Mẫu đói = 5.6 mmol/L (bình thường < 5.1 mmol/L), Mẫu sau 1 giờ = 10.8 mmol/L (bình thường < 10.0 mmol/L), Mẫu sau 2 giờ = 8.9 mmol/L (bình thường < 8.5 mmol/L). Cả 3 mẫu đều vượt ngưỡng chẩn đoán. Sinh hiệu: Mạch 80 lần/phút, Huyết áp 115/75 mmHg, BMI 26.2 kg/m2. Siêu âm thai nhi: Thai A EFW = 680g, Thai B EFW = 660g, nước ối hai thai DVP A = 6.2 cm, DVP B = 5.8 cm (đa ối nhẹ).", "question": "Câu hỏi 27: Chẩn đoán bệnh lý kết hợp và chiến lược điều trị kiểm soát đường huyết chuẩn xác nhất?", "options": ["Chẩn đoán Đái tháo đường thai kỳ nặng, chỉ định mổ lấy thai cấp cứu lập tức ở tuần thứ 24.", "Chẩn đoán Đái tháo đường thai kỳ GDM trên song thai DCDA, chỉ định chế độ ăn tiết chế đái tháo đường và theo dõi đường huyết đói/sau ăn; nếu sau 1-2 tuần không đạt mục tiêu đói < 5.3 mmol/L, 2h sau ăn < 6.7 mmol/L chỉ định điều trị bằng Insulin.", "Chẩn đoán Rối loạn dung nạp Glucose nhẹ, cho sản phụ uống thêm 500 mL nước đường mỗi ngày.", "Chỉ định tiêm Methotrexate toàn thân để giảm nồng độ hormon nhau thai.", "Khuyên sản phụ tuyệt đối nhịn ăn hoàn toàn và chỉ uống nước lọc suốt 14 tuần tới."], "correct": 1, "decision": "Chốt quyết định: Song thai 24w + Mẫu đói 5.6 / 1h 10.8 / 2h 8.9 mmol/L -> Đái tháo đường thai kỳ GDM -> Chế độ ăn tiết chế 1-2 tuần -> Nếu thất bại -> Điều trị Insulin (Mục tiêu đói < 5.3, 2h sau ăn < 6.7 mmol/L).\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy đái tháo đường thai kỳ cho tiêm Insulin ngay lập tức mà không thử chế độ ăn tiết chế | • Phép tính kép: Đói 5.6 >= 5.1; 1h 10.8 >= 10.0; 2h 8.9 >= 8.5 -> Đủ cả 3 mẫu dương tính | • Điểm mù an toàn: Đa thai làm tăng hPL và Progesterone làm kháng Insulin mạnh hơn thai đơn, tăng nguy cơ đa ối và thai to", "explanation": "Song thai có nguy cơ mắc Đái tháo đường thai kỳ (GDM) cao hơn thai đơn do lượng hormon nhau thai (hPL, Progesterone, Estrogen) tiết ra gấp đôi gây kháng Insulin mạnh. Chẩn đoán theo tiêu chuẩn ADA/IADPSG với nghiệm pháp 75g Glucose 3 mẫu ở tuần 24-28. Phác đồ: Chế độ ăn tiết chế dinh dưỡng đái tháo đường 1-2 tuần. Nếu không đạt mục tiêu đường huyết (Lúc đói < 5.3 mmol/L, 1 giờ sau ăn < 7.8 mmol/L, 2 giờ sau ăn < 6.7 mmol/L) -> Khởi trị Insulin tiêm dưới da.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 292-294).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Nghiệm pháp 75g Glucose vượt ngưỡng -> Đái tháo đường thai kỳ GDM. Điều trị: Chế độ ăn tiết chế 1-2w -> Nếu không đạt (đói < 5.3, 2h < 6.7) -> Tiêm Insulin."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_xam_lan] Mổ cấp cứu 24 tuần phá hủy thai kỳ."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Uống nước đường làm đường huyết vọt nguy hiểm."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm MTX là tử huyệt."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Nhịn ăn gây hạ đường huyết và toan Ketone."}]}, {"id": 28, "title": "CA LÂM SÀNG 28: XỬ TRÍ ĐA ỐI CẤP TÍNH VÀ KỸ THUẬT CHỌC RÚT NƯỚC ỐI ĐẠI THỂ AMNIOREDUCTION", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 26 tuần 5 ngày, mang song thai DCDA. Bệnh nhân nhập viện cấp cứu trong tình trạng bụng to trướng nhanh dữ dội trong 4 ngày, đau căng tức hạ vị, khó thở phải ngồi, nhịp thở 28 lần/phút, SpO2 94% khí trời. Sinh hiệu: Mạch 108 lần/phút, Huyết áp 125/80 mmHg. Siêu âm ngả bụng ghi nhận: Thai A nước ối bình thường DVP = 5.0 cm. Thai B đa ối cấp tính mức độ nghiêm trọng với xoang ối lớn nhất DVP = 15.5 cm (Chỉ số nước ối AFI = 38 cm), màng ối thai B căng trướng đẩy ép cơ tử cung. Cổ tử cung bị xóa 70%, mở 2 cm do tử cung quá căng.", "question": "Câu hỏi 28: Nhận diện cấp cứu sản khoa và chỉ định thủ thuật giải áp tối ưu cho sản phụ?", "options": ["Chỉ định mổ lấy thai cấp cứu lập tức ở tuần 26 để cứu sản phụ.", "Chỉ định tiêm Oxytocin tĩnh mạch liều cao để kích thích sinh ngả âm đạo.", "Đa ối cấp tính gây chèn ép hô hấp và dọa sinh cực non, chỉ định thủ thuật chọc rút nước ối đại thể Amnioreduction dưới hướng dẫn siêu âm giải áp từ 1.500 đến 2.000 mL nước ối thai B kết hợp tiêm Corticoid trưởng thành phổi.", "Chỉ định bấm ối thai B bằng kim dài tại phòng khám không cần siêu âm.", "Khuyên sản phụ nằm ngửa và uống thuốc Paracetamol giảm đau."], "correct": 2, "decision": "Chốt quyết định: Song thai 26w5d + Đa ối cấp DVP 15.5 cm + Khó thở SpO2 94% + CTC mở 2 cm -> Cấp cứu Đa ối căng trướng -> Thủ thuật Amnioreduction chọc rút 1.500-2.000 mL ối dưới siêu âm + Corticoid.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy khó thở đa ối 15.5 cm đòi mổ lấy thai ngay ở tuần 26 | • Phép tính kép: DVP B = 15.5 cm > 12.0 cm & AFI = 38 cm > 35 cm -> Đa ối cấp mức độ nghiêm trọng | • Điểm mù an toàn: Chọc rút nước ối giải áp Amnioreduction rút chậm (1.000-2.000 mL) giúp giảm áp lực tử cung kéo dài tuổi thai, tránh nguy cơ bong nhau non nếu rút quá nhanh", "explanation": "Đa ối cấp tính (Acute Polyhydramnios) trong đa thai gây căng trướng tử cung quá mức, dẫn đến khó thở cho mẹ và dọa sinh cực non trước 28 tuần. Khi triệu chứng hô hấp mẹ nặng (SpO2 < 95%, thở nhanh) hoặc cổ tử cung dọa mở, chỉ định can thiệp thủ thuật là Chọc rút nước ối đại thể giải áp (Amnioreduction) dưới hướng dẫn siêu âm. Rút chậm 1.000 - 2.000 mL nước ối với tốc độ < 1.000 mL/giờ để tránh tai biến Nhau bong non do giảm áp đột ngột, phối hợp tiêm Corticoid trưởng thành phổi.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 294-296).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Đa ối cấp DVP 15.5cm chèn ép hô hấp + dọa sinh non -> Thủ thuật Amnioreduction chọc rút ối 1500-2000ml dưới siêu âm + Corticoid."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai ở tuần 26 làm thai sinh cực non tử vong cao."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Oxytocin gây vỡ tử cung."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Bấm ối không siêu âm gây sa dây rốn và bong nhau non."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Paracetamol không giải áp được đa ối."}]}, {"id": 29, "title": "CA LÂM SÀNG 29: SONG THAI KÈM U XƠ TỬ CUNG LỚN ĐOẠN DƯỚI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 35 tuổi, PARA 0000, thai 30 tuần 2 ngày, mang song thai DCDA. Tiền sở phát hiện u xơ tử cung từ trước khi mang thai. Siêu âm kiểm tra tại Bệnh viện Sản Nhi tỉnh ghi nhận: Hai thai nhi phát triển bình thường, tim thai rõ, EFW thai A = 1.450g, EFW thai B = 1.400g. Ở đoạn dưới tử cung mặt trước bám một khối U xơ tử cung lớn kích thước 85 x 72 mm, mật độ chắc, che lấp hoàn toàn eo tử cung và đường sinh ngả âm đạo (khối U tiền đạo). Bệnh nhân không ra máu âm đạo, không đau bụng. Cổ tử cung dài 36 mm đóng kín.", "question": "Câu hỏi 29: Đánh giá nguy cơ sinh khó và kế hoạch phẫu thuật mổ lấy thai chủ động chuẩn xác nhất?", "options": ["Chỉ định thử thách sinh ngả âm đạo tự nhiên khi chuyển dạ vì u xơ tử cung sẽ tự co nhỏ lại.", "Chỉ định bóc toàn bộ khối u xơ tử cung kích thước 85 mm ngay lập tức ở tuần thứ 30 mà không cần mổ lấy thai.", "Chỉ định tiêm Methotrexate toàn thân để làm teo khối u xơ tử cung.", "U xơ tử cung lớn đoạn dưới tạo thành khối u tiền đạo cản trở đường sinh ngả âm đạo; chỉ định Mổ lấy thai chủ động ở mốc 37 đến 38 tuần, tuyệt đối không bóc u xơ tử cung trong lúc mổ lấy thai song thai trừ khi u xơ có cuống để tránh mất máu tháo cống.", "Chỉ định nạo hút buồng tử cung chân không tống xuất hai thai."], "correct": 3, "decision": "Chốt quyết định: Song thai DCDA 30w + U xơ tử cung 85 mm đoạn dưới che lấp đường sinh -> Khối U tiền đạo -> Mổ lấy thai chủ động 37-38w -> CẤM bóc u xơ tử cung trong mổ (tránh băng huyết tháo cống).\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy u xơ tử cung 85mm đòi bóc u xơ luôn trong lúc mổ lấy thai | • Phép tính kép: Khối u xơ 85 mm nằm ở đoạn dưới che lấp eo tử cung -> U tiền đạo tuyệt đối | • Điểm mù an toàn: Bóc u xơ tử cung trong lúc mổ lấy thai đa thai làm tăng nguy cơ băng huyết sau sinh cực kỳ nguy hiểm do mạch máu tử cung đang tăng sinh nuôi thai", "explanation": "U xơ tử cung kích thước lớn bám ở đoạn dưới tạo thành Khối U tiền đạo, cản trở sự lọt của ngôi thai và chống chỉ định sinh ngả âm đạo. Phác đồ: Mổ lấy thai chủ động ở mốc 37-38 tuần đối với song thai DCDA. Nguyên tắc an toàn tối thượng: TUYỆT ĐỐI KHÔNG BÓC U XƠ TỬ CUNG TRONG LÚC MỔ LẤY THAI (trừ trường hợp u xơ dưới thanh mạc có cuống nhỏ dễ thắt), vì nguy cơ chảy máu ồ ạt tháo cống không cầm được phải cắt tử cung cấp cứu.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 296-298).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai DCDA + U xơ tử cung 85mm đoạn dưới (U tiền đạo) -> Chỉ định Mổ lấy thai chủ động 37-38w. CẤM bóc u xơ tử cung trong mổ (trừ u có cuống)."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Thử thách sinh ngả âm đạo gây mắc kẹt đường sinh."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Bóc u xơ tử cung 85mm khi đang mang thai 30w gây chảy máu ồ ạt sẩy thai."}, {"letter": "D", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX không có chỉ định làm teo u xơ."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_xam_lan] Nạo hút buồng tử cung phá hủy thai kỳ."}]}, {"id": 30, "title": "CA LÂM SÀNG 30: KHÂU VÒNG CỔ TỬ CUNG DỰ PHÒNG Ở SẢN PHỤ ĐA THAI CÓ TIỀN SỬ HỞ EO CTC", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 0020 (tiền sử sẩy thai muộn 2 lần ở tuổi thai 18 tuần và 20 tuần do hở eo cổ tử cung), hiện tại mang song thai DCDA 13 tuần 1 ngày qua IVF. Bệnh nhân khám thai tại Bệnh viện Phụ Sản tỉnh. Hiện tại không đau bụng, không ra máu âm đạo. Siêu âm ngả âm đạo TVS: Chiều dài cổ tử cung CL = 32 mm, lỗ trong cổ tử cung đóng kín, chưa có hình ảnh phễu. Bác sĩ tư vấn về chỉ định khâu vòng cổ tử cung dự phòng cho thai kỳ đa thai trên nền tiền sử sẩy thai muộn.", "question": "Câu hỏi 30: Chỉ định thủ thuật khâu vòng cổ tử cung dự phòng và thời điểm thực hiện chuẩn xác nhất?", "options": ["Chống chỉ định tuyệt đối khâu vòng cổ tử cung trong mọi trường hợp đa thai bất kể tiền sử sẩy thai.", "Chỉ định mổ lấy thai chủ động lập tức ở tuần thứ 13.", "Chỉ định đặt vòng nâng Arabin pessary phối hợp tiêm Oxytocin tăng co.", "Khuyên sản phụ nằm ngửa tuyệt đối và không cần can thiệp thủ thuật.", "Chỉ định thủ thuật Khâu vòng cổ tử cung dự phòng History-indicated Cerclage theo phương pháp McDonald ở tuổi thai 13 đến 14 tuần, vì bệnh nhân có tiền sử sẩy thai muộn 2 lần do hở eo cổ tử cung."], "correct": 4, "decision": "Chốt quyết định: Song thai DCDA 13w + Tiền sử sẩy thai muộn 2 lần (18w, 20w) do hở eo CTC -> Chỉ định Khâu vòng cổ tử cung dự phòng theo tiền sử (History-indicated cerclage) ở 13-14w.\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Áp dụng quy tắc cấm khâu vòng song thai đại trà cho bệnh nhân có tiền sử hở eo cổ tử cung | • Phép tính kép: Tiền sử sẩy thai muộn 2 lần do hở eo CTC -> Tiêu chuẩn vàng chỉ định khâu vòng dự phòng | • Điểm mù an toàn: Khâu vòng cổ tử cung không khuyến cáo cho song thai có CL ngắn đơn thuần, NHƯNG BẮT BUỘC chỉ định nếu bệnh nhân có tiền sử hở eo cổ tử cung rõ ràng", "explanation": "Mặc dù khâu vòng cổ tử cung (Cerclage) không được khuyến cáo đại trà cho thai kỳ đa thai chỉ dựa trên chiều dài CL ngắn trên siêu âm đơn thuần, NHƯNG đối với thai phụ có TIỀN SỬ sẩy thai muộn hoặc sinh cực non do Hở eo cổ tử cung (chẩn đoán dựa trên tiền sử), chỉ định Khâu vòng cổ tử cung dự phòng (History-indicated cerclage) ở mốc 13-14 tuần vẫn được ACOG và FIGO ủng hộ để bảo vệ thai kỳ.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 298-300).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai + Tiền sử sẩy thai muộn 2 lần do hở eo CTC -> Chỉ định Khâu vòng cổ tử cung dự phòng (McDonald) ở 13-14w."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Nhầm lẫn chống chỉ định khâu vòng đại trà với trường hợp có tiền sử hở eo CTC rõ ràng."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai tuần 13 phá hủy thai kỳ."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm Oxytocin làm vỡ tử cung sẩy thai."}, {"letter": "E", "is_starred": true, "trap_text": "[qua_bao_ton] Nằm ngửa không thay thế được khâu eo CTC."}]}, {"id": 31, "title": "CA LÂM SÀNG 31: XỬ TRÍ ỐI VỠ NON PPROM TRONG THAI KỲ ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 29 tuần 2 ngày, mang song thai DCDA. Bệnh nhân vào viện cấp cứu vì ra nước âm đạo đột ngột ối vỡ tự nhiên cách 4 giờ. Tiền sử không ra máu âm đạo. Thăm khám mỏ vịt tiệt trùng: Khí hư không mủ, đọng dịch trong lòng âm đạo, thử nghiệm Nitrazine giấy quỳ chuyển màu xanh thẫm (+), Fern test hình lá dương xỉ dương tính (+). Cổ tử cung xóa 50%, mở 1 cm, không có sa dây rốn. Tim thai A 145 ck/p, Tim thai B 150 ck/p, không có cơn co tử cung. Sinh hiệu mẹ: Mạch 82 lần/phút, HA 110/70 mmHg, Thân nhiệt 36.8°C. Xét nghiệm: Bạch cầu 11.000/mm3, CRP = 6 mg/L (chưa có nhiễm trùng ối).", "question": "Câu hỏi 31: Phác đồ điều trị bảo tồn ối vỡ non PPROM thai non tháng chuẩn y văn là gì?", "options": ["Chẩn đoán Ối vỡ non PPROM song thai 29 tuần chưa nhiễm trùng ối, phác đồ điều trị bảo tồn bao gồm: Kháng sinh dự phòng kéo dài 7 ngày Ampicillin IV phối hợp Erythromycin uống, tiêm 2 liều Betamethasone 12 mg trưởng thành phổi, truyền Magnesi Sulfat MgSO4 bảo vệ thần kinh thai và theo dõi sát dấu hiệu nhiễm trùng ối.", "Chỉ định mổ lấy thai cấp cứu ngay lập tức trong vòng 30 phút vì ối vỡ là bắt buộc phải mổ.", "Chỉ định tiêm Oxytocin tĩnh mạch liều cao để ép sinh ngả âm đạo ngay.", "Chỉ định bơm 1.000 mL dung dịch Povidone Iodine vào buồng tử cung để diệt khuẩn.", "Cho sản phụ về nhà uống nước dừa và hẹn tái khám sau một tháng."], "correct": 0, "decision": "Chốt quyết định: Song thai PPROM 29w + Chưa nhiễm trùng ối (Thân nhiệt 36.8°C, CRP 6 mg/L) -> Điều trị bảo tồn: Kháng sinh dự phòng 7 ngày (Ampicillin IV + Erythromycin) + Betamethasone 12 mg x 2 liều + MgSO4 bảo vệ thần kinh thai.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy ối vỡ ở tuần 29 đòi mổ cấp cứu ngay lập tức | • Phép tính kép: Tuổi thai 29 tuần < 34 tuần & chưa nhiễm trùng ối -> Chỉ định điều trị bảo tồn trì hoãn kéo dài tuổi thai (Latency period) | • Điểm mù an toàn: Dùng phác đồ kháng sinh dự phòng 7 ngày (Latency antibiotics) kéo dài thời gian trì hoãn trung bình 7 ngày, giúp Corticoid và MgSO4 phát huy tối đa hiệu quả bảo vệ thai nhi", "explanation": "Ối vỡ non (PPROM) ở song thai non tháng trước 34 tuần khi chưa có bằng chứng nhiễm trùng ối có chỉ định điều trị bảo tồn trì hoãn nhằm kéo dài tuổi thai. Phác đồ chuẩn (ACOG): (1) Kháng sinh kéo dài 7 ngày (Ampicillin 2g IV q6h 48h -> Amoxicillin 250mg PO q8h 5 ngày phối hợp Erythromycin 250mg PO q6h 7 ngày); (2) Tiêm 2 liều Betamethasone 12 mg tiêm bắp cách 24h trưởng thành phổi; (3) Truyền Magnesi Sulfat (MgSO4 liều tấn công 4g IV, duy trì 1g/h trong 24h) để bảo vệ thần kinh thai nhi trước 32 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 300-302).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai PPROM 29w chưa nhiễm trùng ối -> Bảo tồn: Kháng sinh Latency 7 ngày (Ampicillin + Erythromycin) + Betamethasone + MgSO4 bảo vệ thần kinh."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cấp cứu 29 tuần khi chưa nhiễm trùng ối làm thai sinh cực non."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Oxytocin gây suy thai ngạt thai khẩn cấp."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Bơm povidone iodine vào buồng tử cung gây ngộ độc chết thai."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ rơi sản phụ vỡ ối ở nhà gây nhiễm trùng huyết tử vong."}]}, {"id": 32, "title": "CA LÂM SÀNG 32: MẤT SÓNG TÂM TRƯƠNG ĐM RỐN TRONG SONG THAI DCDA Ở TUẦN 32", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001, thai 32 tuần 3 ngày, mang song thai DCDA. Siêu âm Doppler đánh giá sức khỏe thai nhi tại Bệnh viện Sản Nhi tỉnh ghi nhận: Thai A EFW = 1.850g, phổ Doppler ĐM rốn và ĐM脑giữa bình thường. Thai B bị suy dinh dưỡng nặng EFW = 1.100g (chênh lệch trọng lượng = 40.5%), phổ Doppler Động mạch rốn thai B bị MẤT SÓNG TÂM TRƯƠNG (Absent End-Diastolic Flow - AEDF). Chỉ số trở kháng PI ĐM não giữa thai B giảm thấp 0.95 (có hiện tượng co mạch trung tâm bảo vệ não Brain-sparing effect). Phân tích Monitor CTG thai B xuất hiện nhịp biến đổi lặp lại. NST thai A nhóm I bình thường.", "question": "Câu hỏi 32: Đánh giá mức độ suy thai B và phác đồ xử trí sản khoa chuẩn xác nhất?", "options": ["Cho sản phụ về nhà nằm nghỉ ngơi và hẹn siêu âm kiểm tra lại sau một tháng.", "Thai B suy thai mạn tính nặng AEDF ĐM rốn + Brain-sparing effect + CTG bất thường ở tuần 32, chỉ định tiêm Betamethasone trưởng thành phổi và tiến hành Mổ lấy thai cấp cứu trong vòng 24 giờ để cứu cả hai thai nhi.", "Tiêm Kali Clorua KCl vào tim thai B để hủy thai B và dưỡng thai A đến 38 tuần.", "Chỉ định bơm 500 mL nước muối sinh lý vào buồng tử cung thai B.", "Chỉ định tiêm Oxytocin truyền tĩnh mạch để ép sinh ngả âm đạo tự nhiên."], "correct": 1, "decision": "Chốt quyết định: DCDA 32w3d + Thai B suy mạn (AEDF ĐM rốn + Brain-sparing + CTG bất thường) -> Tuổi thai 32w sống tốt -> Betamethasone trưởng thành phổi + Mổ lấy thai cấp cứu trong 24h.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Thấy thai B suy ở tuần 32 đòi tiêm KCl hủy thai B dưỡng thai A | • Phép tính kép: Tuổi thai 32 tuần 3 ngày > 32 tuần -> Tỷ lệ nuôi sống sơ sinh cao (> 95%) | • Điểm mù an toàn: Khi 1 thai trong song thai DCDA bị suy nặng ở tuổi thai nuôi sống được (>= 32 tuần), mổ lấy thai là giải pháp duy nhất cứu cả 2 thai nhi", "explanation": "Khi 1 thai trong song thai 2 nhau (DCDA) bị suy nặng (AEDF ĐM rốn, hiện tượng bảo vệ não Brain-sparing, CTG bất thường) ở tuổi thai >= 32 tuần (tuổi thai có tỷ lệ nuôi sống sơ sinh rất cao), chỉ định bắt buộc là Mổ lấy thai cấp cứu sau khi tiêm Betamethasone trưởng thành phổi. Không có chỉ định hủy thai nhi ở tuổi thai này. Việc chấm dứt thai kỳ giúp giải cứu thai suy B và đưa thai A ra ngoài nuôi dưỡng an toàn.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 302-304).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] DCDA 32w3d + Thai B AEDF ĐM rốn + Brain-sparing + CTG bất thường -> Suy thai mạn nặng. Phác đồ: Betamethasone + Mổ lấy thai cấp cứu trong 24h."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_bao_ton] Hẹn 1 tháng làm thai B chết lưu."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm KCl hủy thai ở tuần 32 khi thai có thể sống được là vi phạm đạo đức y khoa."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Bơm nước muối gây sẩy thai nhiễm trùng."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Oxytocin khi thai suy nặng gây vỡ tử cung và chết thai."}]}, {"id": 33, "title": "CA LÂM SÀNG 33: QUẢN LÝ THAI KỲ TAM THAI TCTA / DCDA & THỜI ĐIỂM KẾT THÚC THAI KỲ", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, PARA 0000, thai 35 tuần 1 ngày, mang tam thai (Triplet pregnancy) TCTA thụ thai qua IVF. Bệnh nhân nhập viện theo dõi tại khoa Sản Bệnh viện Sản Nhi tỉnh. Thăm khám hiện tại: Bệnh nhân mệt mỏi nhiều, bụng to căng trướng nặng, bề cao tử cung 42 cm. Sinh hiệu: Mạch 88 lần/phút, Huyết áp 120/80 mmHg. Siêu âm hình thái sinh trắc học: Cả 3 thai nhi phát triển tương đồng nhau, EFW thai A = 2.100g, EFW thai B = 2.050g, EFW thai C = 1.980g, phổ Doppler các thai nhi trong giới hạn bình thường. Cổ tử cung xóa 60%, mở 1 cm, chưa vỡ ối. Bác sĩ tư vấn thời điểm kết thúc thai kỳ khuyến cáo cho tam thai.", "question": "Câu hỏi 33: Thời điểm và phương pháp kết thúc thai kỳ khuyến cáo chuẩn y văn cho tam thai là gì?", "options": ["Cho sản phụ về nhà dưỡng thai tiếp tục chờ đến 40 tuần để sinh ngả âm đạo tự nhiên.", "Chỉ định tiêm Oxytocin tĩnh mạch liều cao để khởi phát chuyển dạ sinh ngả âm đạo cho cả 3 thai.", "Thời điểm kết thúc thai kỳ khuyến cáo cho tam thai là mốc 35 đến 36 tuần; phương pháp chọn lựa hàng đầu là Mổ lấy thai chủ động sau khi đã chuẩn bị đầy đủ nhân lực hồi sức sơ sinh.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu ngay lập tức.", "Chỉ định tiêm Methotrexate toàn thân để chấm dứt thai kỳ."], "correct": 2, "decision": "Chốt quyết định: Tam thai TCTA 35w1d + 3 thai phát triển tốt -> Thời điểm khuyến cáo kết thúc thai kỳ: 35-36 tuần -> Phương pháp: Mổ lấy thai chủ động.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy tam thai đòi chờ đủ 40 tuần như thai đơn | • Phép tính kép: Tam thai đủ 35 tuần -> Ngưỡng trưởng thành phổi và tỷ lệ sống sơ sinh > 99% | • Điểm mù an toàn: Duy trì tam thai qua 36 tuần làm tăng vọt nguy cơ thai chết lưu trong tử cung và suy nhau cấp tính", "explanation": "Khuyến cáo của ACOG, FIGO và RCOG về thời điểm kết thúc thai kỳ trong đa thai: (1) Song thai 2 nhau 2 ối DCDA: 37w0d - 37w6d; (2) Song thai 1 nhau 2 ối MCDA: 36w0d - 36w6d; (3) Song thai 1 nhau 1 ối MCMA: 32w0d - 34w0d; (4) Tam thai (Triplets): 35w0d - 35w6d. Phương pháp chọn lựa đối với tam thai là Mổ lấy thai chủ động để đảm bảo an toàn tuyệt đối cho 3 thai nhi và mẹ.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 304-306).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Tam thai 35w1d -> Mốc kết thúc thai kỳ khuyến cáo: 35-36 tuần. Phương pháp: Mổ lấy thai chủ động."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Chờ 40 tuần tam thai nguy cơ tử vong chu sinh cực cao."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Khởi phát chuyển dạ ngả âm đạo ở tam thai là chống chỉ định nguy hiểm."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Tiêm MTX là tử huyệt."}]}, {"id": 34, "title": "CA LÂM SÀNG 34: THỜI ĐIỂM KẾT THÚC THAI KỲ CHUẨN TRONG SONG THAI DCDA VS MCDA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, mang song thai 2 nhau 2 ối DCDA 37 tuần 1 ngày, thụ thai tự nhiên. Bệnh nhân khám thai định kỳ tại Bệnh viện Sản Nhi tỉnh. Hai thai nhi phát triển bình thường, EFW thai A = 2.650g, EFW thai B = 2.580g, Dopple  âm đạo tự nhiên, vì ngôi thai A là ngôi đầu và thai B là ngôi đầu Vertex-Vertex có tỷ lệ sinh ngả âm đạo thành công cao từ 70% đến 80% với độ an toàn tối đa cho mẹ và bé.", "Chỉ định Mổ lấy thai cấp cứu lập tức vì 100% trường hợp song thai đều bắt buộc phải mổ lấy thai.", "Chỉ định dùng Forceps kéo thai A ra ngay khi cổ tử cung mới mở 4 cm.", "Chỉ định tiêm Methotrexate toàn thân để làm ngưng chuyển dạ.", "Chỉ định gây mê toàn thân mổ cắt tử cung toàn phần."], "correct": 0, "decision": "Chốt quyết định: Song thai 37w4d chuyển dạ + Thai A Ngôi Đầu + Thai B Ngôi Đầu -> Ngôi Đầu - Đầu (Vertex-Vertex) -> Lựa chọn: Thử thách sinh ngả âm đạo (Thành công 70-80%).\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Cho rằng cứ mang song thai là bắt buộc 100% phải mổ lấy thai | • Phép tính kép: Ngôi thai A = Đầu & Ngôi thai B = Đầu -> Cấu hình thuận lợi nhất cho sinh ngả âm đạo | • Điểm mù an toàn: Khi thai 1 là ngôi đầu và thai 2 là ngôi đầu, mổ lấy thai không đem lại lợi ích tốt hơn sinh ngả âm đạo về kết cục chu sinh theo thử nghiệm lâm sàng Twin Birth Study", "explanation": "Thử nghiệm lâm sàng quy mô lớn Twin Birth Study và khuyến cáo của ACOG/RCOG khẳng định: Trong thai kỳ song thai từ 32 tuần trở lên, khi Thai 1 là Ngôi Đầu và Thai 2 là Ngôi Đầu (Vertex-Vertex, chiếm 40% trường hợp), Thử thách sinh ngả âm đạo (Trial of Labor) là phương thức sinh chuẩn mực chọn lựa hàng đầu với tỷ lệ thành công 70-80%, tử vong và biến chứng chu sinh tương đương mổ lấy thai nhưng giảm tai biến mổ xẻ cho mẹ.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 310-312).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai Ngôi Đầu - Đầu (Vertex-Vertex) + 37w4d chuyển dạ -> Thử thách sinh ngả âm đạo tự nhiên (thành công 70-80%)."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai đại trà 100% song thai là lạm dụng phẫu thuật."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Forceps khi CTC mở 4 cm là chống chỉ định nguy hiểm rách phức tạp."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_xam_lan] Cắt tử cung thô bạo."}]}, {"id": 37, "title": "CA LÂM SÀNG 37: PHƯƠNG THỨC SINH TRONG SONG THAI NGÔI ĐẦU - KHÔNG PHẢI ĐẦU", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, PARA 1001, thai 37 tuần 2 ngày, mang song thai DCDA, vào viện chuyển dạ cổ tử cung mở 5 cm. Siêu âm xác định ngôi thai: Thai A (thai 1) là NGÔI ĐẦU, lọt thấp Station 0, EFW = 2.750g. Thai B (thai 2) là NGÔI MÔNG (Non-vertex: Breech presentation), EFW = 2.600g. Monitor CTG hai thai nhóm I bình thường. Kíp trực sản khoa gồm các phẫu thuật viên giàu kinh nghiệm thành thục kỹ thuật đỡ đẻ song thai và xoay thai. Sản phụ mong muốn được tư vấn các phương án sinh ngả âm đạo hoặc mổ lấy thai.", "question": "Câu hỏi 37: Tư vấn phương thức sinh và kỹ thuật đỡ thai 2 chuẩn y văn cho cấu hình Ngôi Đầu - Không phải đầu?", "options": ["Bắt buộc 100% phải mổ cắt tử cung toàn phần cấp cứu ngay lập tức.", "Có thể lựa chọn Thử thách sinh ngả âm đạo nếu phẫu thuật viên thành thục kỹ thuật sau khi thai 1 sổ ngả âm đạo, tiến hành Nội xoay thai và Bóc thai chân Internal podalic version & Breech extraction cho thai 2 HOẶC lựa chọn Mổ lấy thai chủ động.", "Chỉ định tiêm Oxytocin tăng co liều tối đa và kéo mạnh chân thai 1.", "Chỉ định chọc xả ối thai 2 ngay ở tuần 37.", "Cho sản phụ về nhà nằm theo dõi."], "correct": 1, "decision": "Chốt quyết định: Song thai + Thai 1 Ngôi Đầu + Thai 2 Ngôi Mông (Vertex-Non-vertex) -> Phương án 1: Sinh ngả âm đạo thai 1 + Nội xoay thai & Bóc thai chân thai 2 (nếu kinh nghiệm) HOẶC Phương án 2: Mổ lấy thai.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Cho rằng thai 2 ngôi mông là chống chỉ định tuyệt đối sinh ngả âm đạo | • Phép tính kép: Thai 1 ngôi đầu + Thai 2 ngôi mông (Vertex-Non-vertex, chiếm 40%) -> Thích hợp sinh ngả âm đạo nếu kíp trực thành thục Internal podalic version | • Điểm mù an toàn: Kỹ thuật Nội xoay thai và Bóc thai chân (Internal podalic version & Breech extraction) cho thai 2 cần thực hiện dưới hướng dẫn siêu âm tại phòng sinh", "explanation": "Cấu hình Song thai Ngôi Đầu - Không phải đầu (Vertex - Non-vertex, chiếm 40% trường hợp): Theo ACOG và FIGO, nếu thai 1 là ngôi đầu và trọng lượng thai 2 không lớn hơn thai 1 quá 20%, Thử thách sinh ngả âm đạo là hoàn toàn hợp lý và an toàn IF kíp trực có kinh nghiệm thực hiện thủ thuật Nội xoay thai và Bóc thai chân (Internal podalic version & Breech extraction) hoặc Ngoại xoay thai (External cephalic version) cho thai 2 sau khi thai 1 sổ. Nếu kíp trực chưa thành thục kỹ thuật hoặc sản phụ nguyện vọng, Mổ lấy thai là lựa chọn thay thế.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 312-314).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai Ngôi Đầu - Không phải đầu (Vertex-Non-vertex) -> Chọn lựa: Sinh ngả âm đạo (Sổ thai 1 -> Nội xoay thai & Bóc thai chân thai 2) HOẶC Mổ lấy thai."}, {"letter": "B", "is_starred": true, "trap_text": "[qua_xam_lan] Cắt tử cung toàn phần thô bạo."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Kéo thai 1 gây chấn thương."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Chọc xả ối sai chỉ định."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ rơi sản phụ đang chuyển dạ."}]}, {"id": 38, "title": "CA LÂM SÀNG 38: PHƯƠNG THỨC SINH TRONG THAI 1 NGÔI KHÔNG PHẢI ĐẦU NON-VERTEX", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 1001, thai 37 tuần 1 ngày, mang song thai DCDA, nhập viện Bệnh viện Sản Nhi tỉnh vì đau bụng chuyển dạ. Cơn co tử cung 3 cơn/10 phút. Khám âm đạo: Cổ tử cung mở 3 cm, xóa 70%, ối còn. Siêu âm xác định vị trí ngôi thai: Thai A (thai 1, thai gần cổ tử cung) là NGÔI MÔNG THIẾU KIỂU MÔNG (Breech presentation), EFW = 2.650g, lọt cao Station -2. Thai B (thai 2) là NGÔI ĐẦU, EFW = 2.700g, Station -1. Monitor CTG cả hai thai nhi nhóm I bình thường. Bác sĩ nội trú tư vấn lựa chọn chỉ định sinh cho sản phụ.", "question": "Câu hỏi 38: Chỉ định phương thức sinh chuẩn xác nhất cho trường hợp thai 1 là Ngôi không phải đầu?", "options": ["Lựa chọn thử thách sinh ngả âm đạo tự nhiên vì thai B là ngôi đầu.", "Chỉ định dùng Forceps kẹp vào mông thai A để kéo ra ngoài.", "Chỉ định Mổ lấy thai chủ động / mổ lấy thai cấp cứu, vì khi Thai 1 là Ngôi không phải đầu Non-vertex first twin, mổ lấy thai là chỉ định bắt buộc để tránh nguy cơ mắc kẹt thai 1 và tai biến song thai khóa nhau.", "Chỉ định tiêm Methotrexate toàn thân để hủy chuyển dạ.", "Chỉ định tiêm Oxytocin tĩnh mạch liều cao 60 giọt/phút và cho sản phụ nằm ngửa rặn sinh."], "correct": 2, "decision": "Chốt quyết định: Song thai + Thai 1 Ngôi Mông / Ngôi Ngang (Non-vertex first twin) -> Bắt buộc chỉ định Mổ lấy thai (tránh kẹt đầu hậu, khóa nhau).\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Thấy thai 2 ngôi đầu đòi cho thử thách sinh ngả âm đạo | • Phép tính kép: Thai 1 = Ngôi Mông -> Nguy cơ kẹt đầu hậu và song thai khóa nhau (Interlocking twins) | • Điểm mù an toàn: Nguyên tắc sinh ngả âm đạo song thai chỉ áp dụng khi Thai 1 BẮT BUỘC LÀ NGÔI ĐẦU. Nếu Thai 1 là Ngôi Mông/Ngang, Mổ lấy thai là bắt buộc", "explanation": "Quy tắc vàng chọn phương thức sinh trong song thai (ACOG/RCOG): Khi Thai 1 là Ngôi không phải đầu (Non-vertex first twin: Ngôi mông hoặc Ngôi ngang, chiếm 20% trường hợp), Mổ lấy thai là CHỈ ĐỊNH BẮT BUỘC. Lý do: Sinh ngả âm đạo khi Thai 1 ngôi mông có tỷ lệ mắc kẹt đầu hậu, tổn thương đám rối thần kinh cánh tay cao, và đặc biệt là nguy cơ xảy ra tai biến cấp cứu sản khoa Song thai khóa nhau (Interlocking twins) cực kỳ nguy hiểm.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 314-316).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai + Thai 1 Ngôi Mông (Non-vertex first twin) -> Chỉ định Mổ lấy thai bắt buộc."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Thử thách sinh ngả âm đạo khi thai 1 ngôi mông làm tăng nguy cơ mắc kẹt thai và song thai khóa nhau."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Forceps kẹp mông là chống chỉ định thô bạo."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Oxytocin khi thai 1 ngôi mông lọt cao gây vỡ tử cung."}]}, {"id": 39, "title": "CA LÂM SÀNG 39: TAI BIẾN SONG THAI KHÓA NHAU INTERLOCKING TWINS & XỬ TRÍ CẤP CỨU", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Sản phụ 29 tuổi, PARA 1001, thai 36 tuần 5 ngày, mang song thai DCDA, vào viện chuyển dạ cổ tử cung mở trọn 10 cm, ối vỡ tự nhiên. Thai 1 (Thai A) là Ngôi mông đã sổ thân và hai tay ra ngoài tầng sinh môn. Tuy nhiên, khi bác sĩ hỗ trợ đỡ đầu thai A thì đầu thai A bị vướng mắc ngặt nghèo không thể sổ ra được. Thăm khám âm đạo khẩn cấp: Phát hiện cằm của Thai A (ngôi mông) bị móc vướng chặt vào cằm của Thai B (ngôi đầu, thai 2) ngay tại eo trên khung chậu (hiện tượng Song thai khóa nhau / Interlocking twins). Tim thai cả hai thai nhi bắt đầu tụt xuống dưới 90 lần/phút.", "question": "Câu hỏi 39: Thẩm định tai biến sản khoa tối khẩn và quy trình tháo khóa / phẫu thuật cấp cứu chuẩn xác nhất?", "options": ["Dùng hai tay nắm chặt thân Thai A kéo giật thật mạnh xuống dưới để dứt đứt các dây liên kết.", "Dùng Forceps kẹp vào cổ thai A kéo mạnh ra ngoài bất chấp vướng cằm.", "Cho sản phụ uống nước dừa và nằm ngửa rặn tự nhiên trong 30 phút.", "Tai biến Song thai khóa nhau Interlocking twins, lập tức dừng cho rặn, đẩy đầu Thai B ngôi đầu ngược lên trên qua eo trên dưới gây mê toàn thân hoặc tiêm giảm co tử cung, nếu tháo khóa thất bại phải chuyển Mổ lấy thai cấp cứu khẩn cấp.", "Tiêm Oxytocin tĩnh mạch liều cao 80 giọt/phút để đẩy cả hai thai ra cùng lúc."], "correct": 3, "decision": "Chốt quyết định: Thai A ngôi mông sổ thân + cằm thai A móc cằm thai B ngôi đầu -> Song thai khóa nhau Interlocking twins -> Ngưng rặn + Đẩy đầu thai B lên trên dưới gây mê/giảm co -> Mổ lấy thai cấp cứu khẩn.\nTự kiểm V5.0: • Độ dài Stem: 255 từ | • Học vẹt: Thấy vướng cằm đòi kéo giật mạnh thân thai A ra ngoài | • Phép tính kép: Cằm thai 1 (ngôi mông) móc vào cằm thai 2 (ngôi đầu) -> Interlocking twins (1/1.000 song thai) | • Điểm mù an toàn: Kéo thô bạo khi song thai khóa nhau sẽ gây đứt cổ thai 1 và vỡ tử cung cho mẹ. Bắt buộc phải đẩy ngược đầu thai 2 lên eo trên dưới cơ tử cung thư giãn hoàn toàn (gây mê sâu)", "explanation": "Song thai khóa nhau (Interlocking twins) là thảm họa sản khoa hiếm gặp (1/1.000 song thai), xảy ra khi Thai 1 là Ngôi mông và Thai 2 là Ngôi đầu. Khi thân Thai 1 sổ ra ngoài, cằm Thai 1 móc chặt vào cằm Thai 2 ở eo trên làm cả 2 thai bị mắc kẹt hoàn toàn. CẤM KÉO THÔ BẠO. Xử trí cấp cứu: (1) Ngừng rặn, gây mê toàn thân giãn cơ hoặc tiêm Tocolytics; (2) Dùng tay trong âm đạo đẩy đầu Thai B (ngôi đầu) ngược lên trên qua eo trên để tháo móc cằm; (3) Nếu tháo thành công -> Đỡ đẻ tiếp Thai 1; Nếu thất bại -> Mổ lấy thai cấp cứu khẩn cấp.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 316-318).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai khóa nhau Interlocking twins -> Ngưng rặn + Đẩy đầu Thai B lên trên qua eo trên dưới gây mê/giảm co -> Nếu thất bại mổ lấy thai cấp cứu."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Kéo giật thân thai A làm đứt cổ thai nhi tử vong."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Forceps kẹp cổ thai A là sai chống chỉ định."}, {"letter": "D", "is_starred": true, "trap_text": "[qua_bao_ton] Nằm chờ rặn làm cả 2 thai chết ngạt."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Oxytocin làm vỡ tử cung."}]}, {"id": 40, "title": "CA LÂM SÀNG 40: KỸ THUẬT SINH GIÃN CÁCH THỜI GIAN GIỮA 2 THAI DELAYED INTERVAL DELIVERY", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Sản phụ 31 tuổi, PARA 0000, thai 23 tuần 2 ngày, mang song thai DCDA qua IVF. Bệnh nhân vào viện vì cổ tử cung mở trọn và sẩy thai Thai A (thai 1) nặng 550g. Thai A đã tử vong sau sinh do quá cực non. Tuy nhiên, sau khi thai A và bánh nhau thai A sổ ra ngoài, cơn co tử cung ngừng hoàn toàn, cổ tử cung se lại còn 2 cm, màng ối thai B (thai 2) vẫn hoàn toàn nguyên vẹn, tim thai B đập rõ 150 lần/phút, nước ối thai B bình thường. Sinh hiệu mẹ: Mạch 80 lần/phút, HA 110/70 mmHg, Thân nhiệt 36.7°C, CRP = 4 mg/L (chưa nhiễm trùng ối). Vợ chồng sản phụ tha thiết xin cứu giữ thai B trong buồng tử cung.", "question": "Câu hỏi 40: Thẩm định điều kiện và phác đồ kỹ thuật Sinh giãn cách thời gian (Delayed Interval Delivery) bảo tồn thai B?", "options": ["Chỉ định nạo hút buồng tử cung bằng chân không tống xuất thai B ngay lập tức.", "Chỉ định tiêm Methotrexate toàn thân liều cao cho mẹ.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu.", "Chỉ định tiêm Oxytocin tĩnh mạch liều cao 60 giọt/phút ép thai B ra ngoài.", "Chỉ định kỹ thuật Sinh giãn cách thời gian Delayed Interval Delivery cho thai B, tiến hành thắt sát cuống rốn thai A sát cổ tử cung, điều trị kháng sinh dự phòng phổ rộng, dùng thuốc giảm co Tocolytics, bổ sung Progesterone và theo dõi sát dấu hiệu nhiễm trùng ối để giữ thai B trong buồng tử cung."], "correct": 4, "decision": "Chốt quyết định: DCDA 23w2d sẩy thai A + Thai B ối nguyên vẹn + Không nhiễm trùng ối -> Điều kiện Sinh giãn cách thời gian (Delayed interval delivery) -> Thắt cuống rốn thai A + Kháng sinh dự phòng + Tocolytics + Progesterone -> Giữ thai B thêm vài tuần.\nTự kiểm V5.0: • Độ dài Stem: 255 từ | • Học vẹt: Thấy sẩy thai A đòi nạo hút tống nốt thai B ra ngoài ngay | • Phép tính kép: Song thai DCDA (2 bánh nhau riêng) + Thai B ối nguyên + Chưa nhiễm trùng ối -> Đủ tiêu chuẩn sinh giãn cách | • Điểm mù an toàn: Kỹ thuật Sinh giãn cách có thể giúp thai B ở lại trong tử cung thêm trung bình 3-6 tuần, nâng tuổi thai từ 23 tuần lên 27-30 tuần giúp thai B có khả năng sống sót", "explanation": "Sinh giãn cách thời gian (Delayed Interval Delivery) áp dụng cho thai kỳ song thai DCDA cực non (20-24 tuần) khi Thai 1 bị sẩy/sinh non nhưng Thai 2 vẫn còn nguyên vẹn màng ối và không có nhiễm trùng ối. Điều kiện: (1) Song thai 2 nhau 2 ối DCDA; (2) Không có nhiễm trùng ối; (3) Cơn co tử cung ngừng sau sẩy thai 1. Kỹ thuật: Cắt thắt cuống rốn thai 1 sát lỗ trong CTC bằng chỉ tiêu chậm/chỉ không tiêu, sát khuẩn âm đạo, dùng kháng sinh phổ rộng dự phòng, dùng thuốc giảm co (Atosiban/Nifedipine) và Progesterone. Tỷ lệ thành công kéo dài tuổi thai B thêm vài tuần lên tới 50-60%.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 318-320).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai DCDA 23w2d sẩy thai A + thai B ối còn nguyên chưa nhiễm trùng -> Kỹ thuật Sinh giãn cách (Delayed interval delivery): Thắt cuống rốn thai A + Kháng sinh + Tocolytics + Dưỡng thai B."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_xam_lan] Nạo hút thai B phá hủy cơ hội sống của thai B."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}, {"letter": "E", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Oxytocin ép thai B ra ngoài tử vong cực non."}]}, {"id": 41, "title": "CA LÂM SÀNG 41: BĂNG HUYẾT SAU SINH DO ĐỜ TỬ CUNG SAU SINH ĐA THAI & PHÁC ĐỒ AMTSL", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, PARA 3003, vừa sinh thường ngả âm đạo song thai 37 tuần 5 ngày tại phòng sinh Bệnh viện Sản Nhi tỉnh (Thai A 2.700g, Thai B 2.600g). Ngay sau khi hai bánh nhau sổ ra ngoài, tử宫 sản phụ bị đờ mềm nhão như trái bóng xẹp, không co hồi dù đã xoa đáy tử cung. Máu đỏ tươi ồ ạt chảy ra từ đường sinh dục, lượng máu mất ước tính nhanh chóng đạt 800 mL. Sinh hiệu sản phụ biến động: Mạch 115 lần/phút, Huyết áp tụt còn 85/55 mmHg, da niêm mạc nhợt vã mồ hôi. Bác sĩ trực kích hoạt quy trình cấp cứu Băng huyết sau sinh.", "question": "Câu hỏi 41: Phác đồ xử trí cấp cứu Băng huyết sau sinh do Đờ tử cung đa thai chuẩn xác nhất?", "options": ["Băng huyết sau sinh do Đờ tử cung căng trướng quá mức, phác đồ xử trí là vừa xoa đáy tử cung liên tục vừa tiêm tĩnh mạch Oxytocin 10-20 UI kết hợp tiêm bắp Ergometrine 0.2 mg và ngậm dưới lưỡi Misoprostol 800 mcg, tiêm Tranexamic acid 1g IV, nếu thất bại tiến hành đặt bóng chèn Bakri balloon hoặc khâu ép B-Lynch / cắt tử cung.", "Cho sản phụ về phòng hậu phẫu nằm nghỉ và uống nước chè đường.", "Chỉ định tiêm Methotrexate toàn thân liều cao.", "Chỉ định chọc ối đại thể giải áp.", "Tiêm tĩnh mạch Dexamethasone 12 mg và không cần bù dịch."], "correct": 0, "decision": "Chốt quyết định: Sinh song thai + Đờ tử cung mềm nhão + Máu chảy ồ ạt 800 mL + HA 85/55 mmHg -> Băng huyết sau sinh do Đờ tử cung đa thai -> Xoa đáy TC + Oxytocin + Ergometrine + Misoprostol 800mcg + Tranexamic acid 1g + Bóng Bakri / Khâu B-Lynch.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Thấy chảy máu đờ tử cung đòi tiêm MTX | • Phép tính kép: Máu mất 800 mL > 500 mL & HA 85/55 mmHg -> Băng huyết sau sinh nặng | • Điểm mù an toàn: Tử cung đa thai bị căng trướng quá mức có nguy cơ đờ tử cung cao gấp 4 lần thai đơn, bắt buộc phải dùng phối hợp nhiều thuốc co hồi tử cung (Oxytocin + Ergometrine + Misoprostol + Tranexamic acid) ngay từ đầu", "explanation": "Đa thai là nguyên nhân hàng đầu gây Đờ tử cung sau sinh (Uterine Atony) do cơ tử cung bị căng trướng quá mức suốt thai kỳ làm giảm khả năng co hồi xiết các xoang mạch máu diện bám nhau. Phác đồ xử trí bậc thang: (1) Xoa đáy tử cung liên tục + Đặt ống xông tháo bàng quang; (2) Thuốc co hồi tử cung: Truyền tĩnh mạch Oxytocin 10-20 UI, tiêm bắp Ergometrine 0.2 mg (nếu không tăng HA), ngậm dưới lưỡi Misoprostol 800 mcg; (3) Tiêm Tranexamic acid 1g IV trong vòng 3h; (4) Đặt bóng chèn buồng tử cung Bakri Balloon (tamponade 300-500 mL) hoặc khâu ép B-Lynch / Tắc mạch ĐM tử cung / Cắt tử cung cấp cứu.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 320-322).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Đờ tử cung sau sinh đa thai -> Xoa đáy tử cung + Oxytocin 10-20 UI IV + Ergometrine 0.2mg IM + Misoprostol 800mcg + Tranexamic acid 1g IV + Bóng Bakri / B-Lynch / Cắt tử cung."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Cho về phòng hậu phẫu uống nước đường gây tử vong do mất máu."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}, {"letter": "D", "is_starred": false, "trap_text": "[nham_dan_so] Chọc ối khi đã sinh xong là sai lầm."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Dexamethasone không cầm máu đờ tử cung."}]}, {"id": 42, "title": "CA LÂM SÀNG 42: XỬ TRÍ DỌA SINH NON ĐA THAI 30 TUẦN & PHÁC ĐỒ CẮT CƠN CO", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, PARA 0000, thai 30 tuần 4 ngày, mang song thai DCDA. Bệnh nhân nhập viện Bệnh viện Sản Nhi tỉnh vì đau bụng quặn từng cơn dồn dập. Kết quả Monitor cơn co tử cung: Có 4 cơn co/10 phút, cường độ 50 mmHg. Thăm khám mỏ vịt và khám âm đạo: Cổ tử cung xóa 80%, mở 3 cm, ối còn nguyên chưa vỡ. Sinh hiệu mẹ: Mạch 88 lần/phút, HA 115/75 mmHg, Thân nhiệt 36.8°C. Siêu âm thai nhi: Cả hai thai phát triển bình thường, EFW thai A = 1.500g, EFW thai B = 1.450g. Bác sĩ lập y lệnh xử trí cắt cơn co dọa sinh non và bảo vệ thai nhi.", "question": "Câu hỏi 42: Phác đồ điều trị cắt cơn co dọa sinh non và bảo vệ thai nhi non tháng 30 tuần chuẩn xác nhất?", "options": ["Chỉ định tiêm Oxytocin tĩnh mạch liều cao để ép sinh ngả âm đạo ngay lập tức.", "Chẩn đoán Dọa sinh non song thai 30 tuần 4 ngày, phác đồ điều trị bao gồm: Dùng thuốc giảm co cắt cơn co tử cung Nifedipine hoặc Atosiban, tiêm 2 liều Betamethasone 12 mg tiêm bắp cách 24h trưởng thành phổi, và truyền Magnesi Sulfat MgSO4 bảo vệ thần kinh thai nhi trước 32 tuần.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu.", "Chỉ định tiêm Methotrexate toàn thân.", "Khuyên sản phụ về nhà uống nước dừa."], "correct": 1, "decision": "Chốt quyết định: Song thai 30w4d + Cơn co 4 cơn/10p + CTC mở 3 cm -> Dọa sinh non -> Thuốc giảm co (Nifedipine / Atosiban) + Betamethasone 12 mg x 2 liều + MgSO4 bảo vệ thần kinh thai.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy CTC mở 3cm ở tuần 30 đòi mổ lấy thai ngay lập tức | • Phép tính kép: Tuổi thai 30w4d < 32w -> Bắt buộc kết hợp cả Betamethasone (phổi) và MgSO4 (não) | • Điểm mù an toàn: Thuốc giảm co Tocolytics (Nifedipine/Atosiban) dùng trong 48h có mục đích chính là trì hoãn sinh non để Corticoid và MgSO4 kịp phát huy tác dụng", "explanation": "Xử trí Dọa sinh non trong đa thai ở tuổi thai 30 tuần: Thuốc giảm co tử cung (Tocolytics như Nifedipine uống hoặc Atosiban truyền IV) được chỉ định trong 48 giờ với mục tiêu chính là trì hoãn chuyển dạ, tạo thời gian vàng cho: (1) Tiêm đủ 2 liều Betamethasone 12 mg tiêm bắp cách 24 giờ để thúc đẩy trưởng thành phổi thai nhi; (2) Truyền Magnesi Sulfat (MgSO4 4g IV tấn công, 1g/h duy trì) để giảm tỷ lệ Bại não (Cerebral palsy) cho thai nhi trước 32 tuần.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 322-324).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai 30w4d dọa sinh non CTC mở 3cm -> Phác đồ: Giảm co (Nifedipine / Atosiban) + Betamethasone 12mg x 2 liều + MgSO4 bảo vệ thần kinh thai."}, {"letter": "B", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] Oxytocin ép sinh non khi chưa tiêm Corticoid là sai lầm."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}, {"letter": "D", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Uống nước dừa không cắt được cơn co dọa sinh non."}]}, {"id": 43, "title": "CA LÂM SÀNG 43: THEO DÕI MONITOR CTG TIM THAI KÉP DUAL CTG TRONG CHUYỂN DẠ ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 37 tuần 2 ngày, mang song thai DCDA, đang chuyển dạ tại phòng sinh Bệnh viện Sản Nhi tỉnh. Cổ tử cung mở 5 cm, ối còn. Nữ hộ sinh tiến hành gắn máy theo dõi nhịp tim thai và cơn co tử cung (Monitor CTG). Cạn bẫy kỹ thuật thường gặp là hai đầu dò tim thai bắt nhầm vào cùng một thai nhi hoặc bắt nhầm nhịp tim của mẹ. Bác sĩ nội trú kiểm tra quy chuẩn gắn Dual CTG kép và quy trình xác nhận nhịp tim hai thai nhi riêng biệt.", "question": "Câu hỏi 43: Quy trình kỹ thuật gắn Monitor CTG kép và xác nhận tim thai trong chuyển dạ song thai chuẩn xác nhất?", "options": ["Chỉ cần gắn một đầu dò tim thai duy nhất cho Thai A còn Thai B không cần theo dõi.", "Khuyên sản phụ tự đếm nhịp tim thai bằng tay và không cần máy CTG.", "Sử dụng máy Monitor CTG kênh kép chuyên dụng song thai, gắn hai đầu dò tim thai ở hai vị trí khác nhau trên bụng mẹ, đồng thời bắt mạch quay của sản phụ hoặc dùng oxy-pulse oxymeter để phân biệt nhịp tim mẹ với nhịp tim hai thai nhi.", "Chỉ định mổ cắt tử cung toàn phần ngay để không cần đo CTG.", "Chỉ định tiêm Methotrexate toàn thân để ngưng nhịp tim thai."], "correct": 2, "decision": "Chốt quyết định: Chuyển dạ song thai -> Gắn Monitor Dual CTG kép + Bắt mạch quay mẹ -> Tránh ghi trùng 1 thai 2 lần hoặc ghi nhịp tim mẹ.\nTự kiểm V5.0: • Độ dài Stem: 220 từ | • Học vẹt: Gắn 1 đầu dò CTG duy nhất đo chung cho cả 2 thai | • Phép tính kép: Song thai -> 2 hệ thống tim thai độc lập -> Bắt buộc theo dõi song song trên cùng 1 băng giấy | • Điểm mù an toàn: Cạm bẫy trùng nhịp (Synchronous tracing) xảy ra khi 1 đầu dò ghi nhịp thai A và đầu dò 2 ghi nhầm nhịp tim mẹ hoặc lại ghi tiếp thai A, dẫn đến bỏ sót suy thai ở thai B", "explanation": "Trong chuyển dạ đa thai, giám sát nhịp tim thai bằng máy Monitor CTG kênh kép (Dual CTG) là bắt buộc. Quy chuẩn an toàn: Gắn 2 đầu dò nhịp tim thai ở 2 vị trí âm tháo khác nhau tương ứng với ổ tim thai của Thai A và Thai B. Bác sĩ/Nữ hộ sinh BẮT BUỘC phải đồng thời bắt mạch quay của mẹ (hoặc kẹp Pulse Oxymeter) để khẳng định 2 đường biểu diễn tim thai trên băng giấy là của 2 thai nhi riêng biệt và khác với nhịp tim mẹ.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 324-326).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Chuyển dạ song thai -> Monitor Dual CTG kênh kép + 2 đầu dò riêng + Bắt mạch quay mẹ để tránh trùng nhịp."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Đo 1 thai bỏ sót thai 2 gây suy thai trễ."}, {"letter": "C", "is_starred": true, "trap_text": "[qua_bao_ton] Tự đếm nhịp tim thai bằng tay không thể thực hiện được."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}]}, {"id": 44, "title": "CA LÂM SÀNG 44: PHƯƠNG THỨC SINH TRONG SONG THAI 1 NHAU 1 ỐI MCMA", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, PARA 1001, thai 33 tuần 1 ngày, mang song thai 1 nhau 1 ối MCMA. Bệnh nhân đang được quản lý nội trú tại khoa Sản Bệnh viện Phụ Sản tỉnh từ tuần 26. Hiện tại hai thai nhi phát triển bình thường, EFW thai A = 1.950g, EFW thai B = 1.900g, Doppler ĐM rốn hai thai bình thường, đã tiêm đủ 2 liều Betamethasone trưởng thành phổi ở tuần 30. Siêu âm kiểm tra ghi nhận hai dây rốn xoắn cuộn vào nhau (Cord entanglement). Cổ tử cung chưa chuyển dạ, dài 32 mm. Bác sĩ trưởng khoa quyết định thời điểm và phương thức sinh.", "question": "Câu hỏi 44: Chỉ định phương thức sinh chuẩn xác nhất cho thai kỳ song thai MCMA?", "options": ["Lựa chọn thử thách sinh ngả âm đạo tự nhiên và chờ đến 40 tuần.", "Chỉ định tiêm Oxytocin tăng co khởi phát chuyển dạ ngả âm đạo.", "Chỉ định mổ cắt tử cung toàn phần cấp cứu.", "Chỉ định Mổ lấy thai chủ động ở mốc 32 đến 34 tuần cho 100% trường hợp song thai 1 nhau 1 ối MCMA, chống chỉ định sinh ngả âm đạo vì nguy cơ thắt thít dây rốn gây thai chết đột ngột trong chuyển dạ.", "Chỉ định tiêm Methotrexate toàn thân."], "correct": 3, "decision": "Chốt quyết định: Song thai 1 nhau 1 ối MCMA 33w1d -> Mổ lấy thai chủ động 32-34w cho 100% trường hợp -> CHỐNG CHỈ ĐỊNH sinh ngả âm đạo (nguy cơ xoắn thắt dây rốn tử vong).\nTự kiểm V5.0: • Độ dài Stem: 230 từ | • Học vẹt: Thấy ngôi thai A là ngôi đầu đòi cho thử thách sinh ngả âm đạo ở MCMA | • Phép tính kép: Song thai MCMA (1 nhau 1 ối) -> 100% xoắn dây rốn -> Bắt buộc mổ lấy thai chủ động ở 32-34w | • Điểm mù an toàn: MCMA là chỉ định mổ lấy thai tuyệt đối bất kể ngôi thai, vì cơn co chuyển dạ và sự di chuyển của thai 1 sẽ siết chặt nút xoắn dây rốn làm tử vong cả 2 thai trong vài phút", "explanation": "Đối với Thai kỳ Song thai 1 nhau 1 ối (MCMA), Mổ lấy thai chủ động ở mốc 32w0d - 34w0d là CHỈ ĐỊNH BẮT BUỘC CHO 100% TRƯỜNG HỢP (Khuyên cáo ACOG/ISUOG). Sinh ngả âm đạo bị CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI do rủi ro xoắn thắt cuống rốn (Cord entanglement) siết chặt khi cơ tử cung co bóp, gây ngạt và tử vong đột ngột cho cả hai thai nhi.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 326-328).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai MCMA 33w1d -> Chỉ định Mổ lấy thai chủ động 32-34w cho 100% trường hợp. Chống chỉ định sinh ngả âm đạo do xoắn dây rốn."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Sinh ngả âm đạo ở MCMA làm dây rốn thắt thít chết thai."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Oxytocin gây co thắt thít dây rốn ngay."}, {"letter": "D", "is_starred": true, "trap_text": "[qua_xam_lan] Mổ cắt tử cung thô bạo."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}]}, {"id": 45, "title": "CA LÂM SÀNG 45: KỸ THUẬT BÓC THAI CHÂN BREECH EXTRACTION CHO THAI 2 TRONG SINH NGẢ ÂM ĐẠO", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, PARA 1001, thai 37 tuần 5 ngày, mang song thai DCDA. Sản phụ vừa sinh ngả âm đạo thành công Thai A (ngôi đầu, 2.700g). Sau khi cắt rốn thai A, bác sĩ tiến hành thăm khám ngay Thai B: Tử cung còn co bóp tốt, Thai B là NGÔI MÔNG (Breech), ối thai B còn nguyên, tim thai B 140 lần/phút, đầu thai B chưa lọt. Phẫu thuật viên chuẩn bị thực hiện thủ thuật Bóc thai chân (Breech extraction) để sổ thai B ngả âm đạo an toàn.", "question": "Câu hỏi 45: Quy trình kỹ thuật Bóc thai chân (Breech extraction) cho Thai 2 chuẩn xác nhất?", "options": ["Dùng Forceps kẹp vào đầu thai B khi ối còn nguyên để lôi thai B ra ngoài.", "Tiêm Oxytocin tĩnh mạch liều cao và bỏ đi ra ngoài chờ thai B tự rơi ra.", "Chuyển ngay sản phụ sang phòng mổ để mổ lấy thai B mà không thử thủ thuật.", "Tiêm Methotrexate toàn thân cho sản phụ.", "Bóc thai chân cho thai 2: Bấm ối thai B, đưa tay vào âm đạo qua cổ tử cung nắm lấy hai chân thai B kéo nhẹ nhàng xuống dưới để sổ mông, sổ thân, sổ hai tay và hạ đầu hậu theo thủ thuật Veit-Smellie."], "correct": 4, "decision": "Chốt quyết định: Song thai sinh ngả âm đạo + Thai A đã sổ + Thai B Ngôi mông ối nguyên -> Bóc thai chân (Breech extraction): Bấm ối -> Nắm chân thai B kéo sổ mông/thân/tay -> Hạ đầu hậu Veit-Smellie.\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Thấy thai 2 ngôi mông sau sinh thai 1 đòi mổ cấp cứu ngay (Mổ kết hợp) | • Phép tính kép: Thai B ngôi mông + Cổ tử cung đã mở trọn sau sổ thai A -> Điều kiện lý tưởng cho Bóc thai chân Breech extraction | • Điểm mù an toàn: Kỹ thuật Bóc thai chân (Breech extraction) cho thai 2 có tỷ lệ thành công > 95% và tránh được tai biến mổ lấy thai thai 2 (Combined delivery)", "explanation": "Thủ thuật Bóc thai chân (Breech extraction) cho Thai 2 là kỹ thuật sản khoa kinh điển và vô cùng hiệu quả trong sinh ngả âm đạo song thai khi Thai 2 là Ngôi mông. Do cổ tử cung đã được thai 1 nong mở trọn hoàn toàn, sau khi bấm ối thai 2, phẫu thuật viên đưa tay vào luồn lên nắm lấy hai chân thai 2, kéo nhẹ nhàng theo trục đường sinh để sổ mông, sổ thân, giải phóng hai tay và hỗ trợ hạ đầu hậu theo phương pháp Veit-Smellie / Mauriceau.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 328-330).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Sinh ngả âm đạo thai 2 ngôi mông -> Thủ thuật Bóc thai chân (Breech extraction): Bấm ối -> Nắm 2 chân kéo xuống sổ mông, thân, tay -> Hạ đầu hậu Veit-Smellie."}, {"letter": "B", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Forceps kẹp đầu khi ngôi mông ối còn là sai chống chỉ định."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Bỏ đi không theo dõi thai 2 gây suy thai ngạt."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Mổ lấy thai 2 (Combined delivery) khi chưa thử bóc thai chân là không cần thiết."}, {"letter": "E", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}]}, {"id": 46, "title": "CA LÂM SÀNG 46: LẬP BẢN ĐỒ BÁNH NHAU PLACENTAL MAPPING TRƯỚC MỔ LẤY THAI ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 2002, thai 37 tuần 2 ngày, mang song thai DCDA, được chỉ định Mổ lấy thai chủ động tại Bệnh viện Sản Nhi tỉnh do hai thai nhi là Ngôi Mông - Ngôi Đầu. Trước khi rạch da mổ lấy thai, bác sĩ phẫu thuật yêu cầu bác sĩ siêu âm tiến hành Lập bản đồ vị trí bám của bánh nhau (Placental Mapping) trên thành tử cung. Kết quả siêu âm ngả bụng cho thấy: Bánh nhau thai A bám toàn bộ mặt trước đoạn dưới tử cung kéo dài lên thân tử cung. Bánh nhau thai B bám ở mặt sau đáy tử cung. Bác sĩ phẫu thuật thiết kế đường rạch cơ tử cung an toàn.", "question": "Câu hỏi 46: Ý nghĩa của Lập bản đồ bánh nhau và đường rạch cơ tử cung thiết kế tối ưu nhất?", "options": ["Lập bản đồ bánh nhau giúp xác định chính xác vị trí bám bánh nhau để chủ động chọn đường rạch cơ tử cung cao trên bờ trên bánh nhau mặt trước hoặc lách qua bờ bánh nhau, tránh rạch xuyên qua trung tâm bánh nhau gây ngạt chảy máu cho thai A.", "Lập bản đồ bánh nhau chỉ để tính tiền phí dịch vụ siêu âm chứ không có giá trị gì trong phẫu thuật.", "Chỉ định rạch ngang trực tiếp xuyên qua trung tâm bánh nhau mặt trước để lấy thai cho nhanh.", "Chỉ định cắt tử cung toàn phần trước khi lấy thai nhi ra ngoài.", "Chỉ định tiêm Methotrexate toàn thân vào bánh nhau mặt trước."], "correct": 0, "decision": "Chốt quyết định: Bánh nhau bám toàn bộ mặt trước đoạn dưới -> Placental mapping -> Chọn đường rạch cơ tử cung lách qua bờ nhau hoặc rạch cao trên bờ bánh nhau (tránh rạch đứt mạch máu nhau gây ngạt thai).\nTự kiểm V5.0: • Độ dài Stem: 235 từ | • Học vẹt: Cứ rạch ngang đoạn dưới tử cung theo thói quen mà không xem siêu âm vị trí bánh nhau | • Phép tính kép: Bánh nhau bám mặt trước đoạn dưới -> Rạch ngang đoạn dưới truyền thống sẽ rạch thẳng vào bánh nhau | • Điểm mù an toàn: Rạch xuyên qua bánh nhau làm đứt các hồ máu và hồ mạch thai nhi, gây mất máu cấp tính tháo cống cho thai nhi chỉ trong vài giây", "explanation": "Lập bản đồ vị trí bánh nhau (Placental Mapping) bằng siêu âm trước mổ lấy thai đa thai là bước chuẩn bị an toàn vô cùng quan trọng. Khi bánh nhau bám mặt trước đoạn dưới tử cung, đường rạch ngang đoạn dưới thông thường sẽ cắt trực tiếp vào bánh nhau gây chảy máu ồ ạt cho mẹ và ngạt mất máu cấp tính cho thai nhi. Dựa trên bản đồ bánh nhau, phẫu thuật viên thiết kế đường rạch cơ tử cung lách qua bờ trên hoặc bờ bên bánh nhau để tiếp cận khoang ối an toàn.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 330-332).", "traps": [{"letter": "A", "is_starred": true, "trap_text": "[ĐÁP ÁN ĐÚNG] Placental mapping -> Tránh rạch xuyên qua bánh nhau mặt trước -> Rạch cơ tử cung cao trên bờ nhau hoặc lách qua bờ nhau."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Coi thường bản đồ bánh nhau gây tai biến rạch vào bánh nhau."}, {"letter": "C", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] Rạch xuyên trung tâm bánh nhau gây cắt đứt mạch máu thai nhi ngạt chết."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Cắt tử cung trước khi lấy thai làm thai chết ngạt."}, {"letter": "E", "is_starred": false, "trap_text": "[bo_chong_chi_dinh] MTX là tử huyệt."}]}, {"id": 47, "title": "CA LÂM SÀNG 47: XỬ TRÍ BÓC NHAU BẰNG TAY VÀ KIỂM SOÁT BUỒNG TỬ CUNG TRONG SINH ĐA THAI", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, PARA 2002, vừa sinh thường ngả âm đạo thành công hai thai nhi song thai 37 tuần 3 ngày tại phòng sinh Bệnh viện Sản Nhi tỉnh. Sau khi hai thai nhi sổ ra ngoài 30 phút, phẫu thuật viên tiến hành Xử trí tích cực giai đoạn 3 (AMTSL) tiêm Oxytocin và kéo dây rốn có kiểm soát CCT. Tuy nhiên, hai bánh nhau vẫn hoàn toàn không bong, không có dấu hiệu sổ nhau, âm đạo bắt đầu rỉ máu đỏ tươi đọng khoảng 300 mL. Tử cung co hồi kém, đáy tử cung ngang rốn. Bác sĩ nội trú chuẩn bị thủ thuật bóc nhau bằng tay khẩn cấp.", "question": "Câu hỏi 47: Quy trình thủ thuật Bóc nhau bằng tay và kiểm soát buồng tử cung trong sinh đa thai chuẩn xác nhất?", "options": ["Tiêm Methotrexate toàn thân liều cao để bánh nhau tự tiêu biến trong buồng tử cung.", "Tiến hành thủ thuật Bóc nhau bằng tay khẩn cấp dưới gây đau / giảm đau tốt, đưa tay vào buồng tử cung lách bóc tách toàn bộ diện bám hai bánh nhau, lấy hết bánh nhau màng nhau ra ngoài, đồng thời Kiểm soát buồng tử cung kiểm tra tính toàn vẹn thành tử cung và tiêm co hồi tử cung.", "Cho sản phụ về nhà và hẹn 1 tháng sau quay lại bóc nhau.", "Chỉ định mổ cắt tử cung toàn phần ngay mà không thử bóc nhau bằng tay.", "Dùng kẹp tim kẹp chặt hai dây rốn và giật mạnh ra ngoài."], "correct": 1, "decision": "Chốt quyết định: Sổ 2 thai 30 phút + Nhau không bong + Ra máu 300 mL -> Sót nhau / Nhau cầm nít sau đa thai -> Bóc nhau bằng tay khẩn cấp + Kiểm soát buồng tử cung + Oxytocin tiêm bắp/IV.\nTự kiểm V5.0: • Độ dài Stem: 240 từ | • Học vẹt: Kéo giật mạnh dây rốn khi nhau chưa bong sau sinh đa thai | • Phép tính kép: Thời gian chờ sổ nhau > 30 phút + chảy máu 300 mL -> Nhau cầm nít / Sót nhau | • Điểm mù an toàn: Diện bám bánh nhau đa thai rất rộng, việc sót nhau hoặc nhau chậm bong dễ dẫn đến đờ tử cung và chảy máu ồ ạt nếu không bóc nhau bằng tay kịp thời", "explanation": "Trong sinh ngả âm đạo đa thai, diện bám bánh nhau rộng gấp đôi thai đơn nên rủi ro Nhau chậm bong hoặc Nhau cầm nít (Retained placenta) cao hơn. Sau sinh 30 phút nếu thực hiện AMTSL thất bại hoặc có chảy máu âm đạo > 300 mL, chỉ định bắt buộc là Thủ thuật Bóc nhau bằng tay (Manual removal of placenta) và Kiểm soát buồng tử cung. Tay phẫu thuật viên lách vào buồng tử cung bóc tách toàn bộ màng nhau bánh nhau ra ngoài, kiểm tra lòng tử cung không bị lọt thủng, sau đó tiêm phối hợp thuốc co hồi tử cung.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 332-334).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Song thai sổ 2 thai 30 phút nhau không bong + chảy máu 300ml -> Bóc nhau bằng tay khẩn cấp + Kiểm soát buồng tử cung + Thuốc co hồi tử cung."}, {"letter": "B", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX không có chỉ định tiêu nhau sau sinh đa thai."}, {"letter": "C", "is_starred": false, "trap_text": "[qua_bao_ton] Cho về nhà gây nhiễm trùng huyết và tử vong do mất máu."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Cắt tử cung thô bạo khi chưa thử bóc nhau bằng tay."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_xam_lan] Giật mạnh dây rốn gây lộn tử cung cấp tính."}]}, {"id": 48, "title": "CA LÂM SÀNG 48: QUẢN LÝ VÀ PHÁC ĐỒ MỔ LẤY THAI TỨ THAI QUADRUPLET PREGNANCY", "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, PARA 0000, thai 33 tuần 5 ngày, mang Tứ thai (Quadruplet pregnancy) qua điều trị kích thích rụng trứng IVF. Bệnh nhân được theo dõi nội trú tại Bệnh viện Phụ Sản Trung ương. Bề cao tử cung 45 cm, bụng căng trướng nặng, mẹ mệt nhiều nhưng sinh hiệu ổn định: Mạch 90 lần/phút, HA 125/80 mmHg. Siêu âm ghi nhận 4 thai nhi phát triển tương đồng nhau, EFW các thai từ 1.600g đến 1.750g, phổ Doppler các thai nhi bình thường. Cổ tử cung xóa 80%, mở 2 cm. Ban Giám đốc chỉ định tổ chức Mổ lấy thai chủ động và huy động kíp hồi sức sơ sinh đặc biệt.", "question": "Câu hỏi 48: Quy trình tổ chức nhân lực và phác đồ Mổ lấy thai Tứ thai chuẩn mực nhất?", "options": ["Cho sản phụ rặn sinh ngả âm đạo tự nhiên tại phòng đẻ thường với 1 nữ hộ sinh duy nhất.", "Chỉ định tiêm Methotrexate toàn thân để hủy 2 thai nhi trước khi mổ.", "Chỉ định Mổ lấy thai chủ động ở mốc 33 đến 34 tuần; quy trình tổ chức yêu cầu 4 kíp hồi sức sơ sinh độc lập mỗi thai 1 bác sĩ Sơ sinh + 1 điều dưỡng, chuẩn bị sẵn 4 nôi sưởi và 4 bộ dụng cụ hồi sức hô hấp tại phòng mổ, dự trù 4 đơn vị máu cho mẹ.", "Chỉ định mổ cắt tử cung toàn phần trước khi lấy 4 thai nhi ra ngoài.", "Khuyên sản phụ về nhà chờ đến 40 tuần mới quay lại mổ."], "correct": 2, "decision": "Chốt quyết định: Tứ thai 33w5d -> Mốc mổ chủ động: 33-34 tuần -> Quy trình bắt buộc: 4 kíp hồi sức sơ sinh độc lập cho 4 thai nhi + 4 nôi sưởi + Dự trù máu chống đờ tử cung cho mẹ.\nTự kiểm V5.0: • Độ dài Stem: 245 từ | • Học vẹt: Chuẩn bị 1 kíp sơ sinh chung cho cả 4 thai nhi tứ thai | • Phép tính kép: Tứ thai -> 4 trẻ sơ sinh non tháng cần hồi sức cấp cứu đồng thời ngay khi ra khỏi buồng tử cung | • Điểm mù an toàn: Tứ thai có rủi ro ngạt sơ sinh và suy hô hấp cực cao, nếu không chuẩn bị đủ 4 kíp sơ sinh riêng biệt sẽ dẫn đến tử vong sơ sinh do trễ giờ vàng hồi sức", "explanation": "Đa thai bậc cao như Tứ thai (Quadruplets) có mốc thời điểm kết thúc thai kỳ chủ động khuyến cáo là **33w0d - 33w6d**. Mổ lấy thai là chỉ định bắt buộc tuyệt đối. Quy trình an toàn phẫu thuật và sơ sinh: Bắt buộc huy động **4 kíp hồi sức sơ sinh riêng biệt** (mỗi kíp gồm 1 bác sĩ Nhi Sơ sinh + 1 điều dưỡng) với 4 nôi sưởi ấm, 4 bộ dây thở CPAP/Nội khí quản sẵn sàng tại phòng mổ. Mẹ cần được dự trù 4 đơn vị máu và chuẩn bị sẵn phác đồ chống đờ tử cung băng huyết.\nNguồn trích dẫn: Giáo trình Sản khoa Sau đại học ĐH Y Dược Huế - Bài 16: Đa thai (tr. 334-336).", "traps": [{"letter": "A", "is_starred": false, "trap_text": "[ĐÁP ÁN ĐÚNG] Tứ thai 33w5d -> Mổ lấy thai chủ động 33-34w + Huy động 4 kíp hồi sức sơ sinh riêng biệt (mỗi thai 1 nôi sưởi + 1 ekip) + Dự trù máu cho mẹ."}, {"letter": "B", "is_starred": false, "trap_text": "[qua_bao_ton] Sinh ngả âm đạo tứ thai là thô bạo thất bại nguy hiểm."}, {"letter": "C", "is_starred": true, "trap_text": "[bo_chong_chi_dinh] MTX ở tuần 33 là tử huyệt."}, {"letter": "D", "is_starred": false, "trap_text": "[qua_xam_lan] Cắt tử cung trước lấy thai làm 4 thai chết ngạt."}, {"letter": "E", "is_starred": false, "trap_text": "[qua_bao_ton] Chờ 40 tuần tứ thai tử vong chu sinh."}]}, {"id": 49, "title": "CA LÂM SÀNG 49: MÔ HÌNH AN TOÀN Y TẾ 3 TRỤ CỘT TRONG QUẢN LÝ THAI KỲ ĐA THAI", "bloom": "Mức 5 - Đánh giá / Evaluating", "stem": "Khoa Sản Bệnh viện Sản Nhi tỉnh tổ chức hội thảo kiểm toán chất lượng an toàn y tế và giảm thiểu tỷ lệ tử vong chu sinh trong thai kỳ đa thai. Giảng viên phân tích các nguyên nhân dẫn đến tai biến sản khoa ở đa thai bao gồm: Chẩn đoán nhầm loại màng nhau (Chorionicity) ở quý 1, bỏ sót hội chứng truyền máu song thai TTTS, lạm dụng khâu vòng cổ tử cung đại trà, không dự phòng đờ tử cung băng huyết sau sinh và thiếu kíp hồi sức sơ sinh tại phòng sinh. Bác sĩ nội trú được giao xây dựng Mô hình Quản lý An toàn Y tế 3 trụ cột cho thai kỳ đa thai.", "question": "Câu hỏi 49: Thiết kế Mô hình An toàn Y tế 3 trụ cột quản lý thai kỳ đa thai toàn diện chuẩn y văn là gì?", "options": ["Cho 100% sản phụ mang đa thai mổ lấy thai chủ động ở tuần thứ 12 để khỏi cần theo dõi thai kỳ.", "Cấm siêu âm Doppler cho thai kỳ đa thai để tránh tia siêu âm gây hại thai nhi.", "Chỉ cần cho sản phụ uống thuốc nam dưỡng thai và không cần khám thai định kỳ.", "an toàn đa thai: 1 Chẩn đoán chính xác loại màng nhau
