<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sản Khoa Quiz - Bài 03</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #main-content {
      touch-action: pan-y pinch-zoom;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased selection:bg-teal-100 selection:text-teal-900 overflow-hidden">

  <!-- TOP MINIMAL BAR -->
  <header class="shrink-0 h-12 bg-white border-b border-slate-200 px-3.5 flex items-center justify-between z-20 shadow-xs">
    <div class="flex items-center gap-2">
      <span id="case-counter" class="text-xs font-bold text-teal-800 bg-teal-50 border border-teal-200/80 px-2 py-0.5 rounded-md font-mono">
        Ca 01/50
      </span>
      <select id="filter-select" onchange="changeFilter(this.value)" class="text-xs font-medium bg-slate-100 border border-slate-200 rounded-md px-2 py-1 text-slate-700 outline-none focus:border-teal-500">
        <option value="all">Tất cả (50)</option>
        <option value="starred">Đã nhớ (Sao)</option>
        <option value="unanswered">Chưa làm</option>
        <option value="wrong">Làm sai</option>
      </select>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="toggleStarCurrent()" id="star-btn" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-amber-500 transition" title="Ghi nhớ ca này">
        <i id="star-icon" class="fa-regular fa-star text-sm"></i>
      </button>
      <button onclick="promptReset()" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-rose-500 transition" title="Làm lại từ đầu">
        <i class="fa-solid fa-arrow-rotate-left text-xs"></i>
      </button>
    </div>
  </header>

  <!-- PROGRESS BAR -->
  <div class="w-full bg-slate-100 h-0.5 shrink-0">
    <div id="progress-line" class="h-0.5 bg-teal-600 transition-all duration-200" style="width: 0%;"></div>
  </div>

  <!-- MAIN SCROLLABLE CONTENT (VERTICAL MOBILE FIRST) -->
  <main id="main-content" class="flex-1 overflow-y-auto custom-scroll p-3.5 pb-20 max-w-xl w-full mx-auto space-y-3">
    
    <!-- Header: CHỈ DUY NHẤT SỐ THỨ TỰ (Ca XX) & Mức độ -->
    <div class="flex items-center justify-between border-b border-slate-200/60 pb-2">
      <h1 id="case-title" class="text-sm font-bold text-slate-900 tracking-tight font-mono">
        Ca 01
      </h1>
      <span id="case-level" class="text-[10px] font-semibold text-teal-700 bg-teal-50 border border-teal-200/70 px-2 py-0.5 rounded-full shrink-0">
        Mức 3
      </span>
    </div>

    <!-- Vignette Box -->
    <div class="bg-amber-50/80 border border-amber-200/70 rounded-xl p-3 text-slate-800">
      <div class="text-[10px] font-bold uppercase tracking-wider text-amber-800 mb-1 flex items-center gap-1">
        <i class="fa-solid fa-notes-medical"></i> Tình huống lâm sàng
      </div>
      <p id="case-vignette" class="text-xs sm:text-[13px] leading-relaxed text-justify">
        ...
      </p>
    </div>

    <!-- Question Prompt -->
    <div class="bg-slate-100/90 rounded-xl p-3 border border-slate-200/80">
      <p id="case-question" class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug">
        ...
      </p>
    </div>

    <!-- 4 Options -->
    <div id="options-box" class="space-y-2 pt-1">
      <!-- Injected dynamically -->
    </div>

    <!-- Explanation Box (Hiện ra ngay sau khi chọn) -->
    <div id="explanation-container" class="hidden space-y-2 pt-1 transition-all">
      <div id="status-badge" class="p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2"></div>
      
      <div class="bg-white border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-700 space-y-1">
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-700 flex items-center gap-1">
          <i class="fa-solid fa-stethoscope"></i> Biện luận y khoa & phân tích bẫy
        </div>
        <p id="explanation-text" class="text-justify text-slate-600"></p>
      </div>
    </div>

    <!-- Minimal Note Box -->
    <div class="pt-1">
      <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
        <span class="flex items-center gap-1"><i class="fa-regular fa-pen-to-square"></i> Ghi chú ca này</span>
        <span id="note-saved-hint" class="text-teal-600 font-semibold opacity-0 transition-opacity text-[10px]">Đã lưu</span>
      </div>
      <textarea id="note-input" oninput="saveNote(this.value)" placeholder="Lưu ý nhớ nhanh cho ca bệnh này..." class="w-full h-14 p-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-teal-500 resize-none font-sans"></textarea>
    </div>

  </main>

  <!-- BOTTOM FLOATING NAV BAR -->
  <footer class="fixed bottom-0 inset-x-0 h-13 bg-white/95 backdrop-blur border-t border-slate-200 px-3 flex items-center justify-between max-w-xl mx-auto z-20">
    <button onclick="prevCase()" class="h-9 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 active:scale-95 transition flex items-center gap-1">
      <i class="fa-solid fa-chevron-left text-[10px]"></i> Trước
    </button>

    <button onclick="openJumpModal()" class="h-9 px-3.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-800 text-xs font-bold active:scale-95 transition flex items-center gap-1.5 font-mono">
      <i class="fa-solid fa-list-ol text-[11px]"></i>
      <span id="bottom-counter">1 / 50</span>
    </button>

    <button onclick="nextCase()" class="h-9 px-3 rounded-lg bg-teal-600 text-white text-xs font-semibold active:scale-95 transition flex items-center gap-1 shadow-xs shadow-teal-600/30">
      Tiếp <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </button>
  </footer>

  <!-- MODAL JUMP GRID -->
  <div id="jump-modal" class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl max-w-md w-full max-h-[75vh] flex flex-col border border-slate-200 shadow-xl overflow-hidden">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800">Chọn nhanh ca bệnh (1 - 50)</span>
        <button onclick="closeJumpModal()" class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3 overflow-y-auto custom-scroll flex-1">
        <div id="grid-container" class="grid grid-cols-5 sm:grid-cols-6 gap-1.5">
          <!-- Injected dynamically -->
        </div>
      </div>

      <div class="p-2 border-t border-slate-200 bg-slate-50 text-[10px] flex items-center justify-around text-slate-500 font-medium">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Đúng</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Sai</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-200"></span> Chưa làm</span>
        <span class="flex items-center gap-1"><i class="fa-solid fa-star text-amber-500 text-[9px]"></i> Có sao</span>
      </div>
    </div>
  </div>

  <!-- SCRIPT DATA & APP LOGIC -->
  <script>
    // 50 Clinical Cases Data (Chỉ giữ thứ tự "Ca XX", loại bỏ hoàn toàn chủ đề sau tên ca)
    const cases = [
      {
        id: 1,
        title: "Ca 01",
        level: "Mức 3 - Vận dụng",
        vignette: "Sản phụ 32 tuổi, PARA 0000, vô sinh 3 năm do tắc hai vòi tử cung, thực hiện thụ tinh trong ống nghiệm (IVF). Sản phụ được chuẩn bị niêm mạc bằng chu kỳ nội tiết nhân tạo HRT và được chuyển 01 phôi nang ngày 5 vào ngày 10/03/2026. Khám thai quý 1 vào ngày 02/06/2026: Sinh hiệu ổn định, tử cung lớn mấp mé khớp mu. Siêu âm thai đường bụng: Một thai sống trong buồng tử cung, đo CRL = 64 mm (máy siêu âm tính tương đương 12 tuần 5 ngày). Bác sĩ siêu âm in phiếu hẹn ngày dự sinh là 10/12/2026 dựa trên CRL, khiến sản phụ băn khoăn vì trung tâm IVF hẹn ngày 26/11/2026.",
        question: "Theo nguyên tắc sản khoa chuẩn mực, ngày dự sinh chính thức được xác lập cho sản phụ này là ngày nào?",
        options: {
          A: "Ngày 10/12/2026 xác lập theo chiều dài đầu mông trên siêu âm.",
          B: "Ngày 26/11/2026 xác lập theo ngày chuyển phôi nang ngày 5.",
          C: "Ngày 03/12/2026 tính theo trung bình cộng giữa hai phương pháp.",
          D: "Ngày 17/12/2026 xác lập khi siêu âm lại hình thái ở quý hai."
        },
        correct: "B",
        explanation: "Trong thụ tinh trong ống nghiệm (IVF), thời điểm thụ tinh và tuổi phôi được biết chính xác tuyệt đối. Ngày đầu kỳ kinh cuối quy ước đối với phôi ngày 5: LMP = Ngày chuyển phôi - 19 ngày (10/03 - 19 ngày = 19/02/2026). Theo quy tắc Naegele: Ngày dự sinh = Ngày + 7, Tháng + 9 -> 26/11/2026. Ngày dự sinh tính theo ngày chuyển phôi là chuẩn vàng bất biến, không hiệu chỉnh theo siêu âm CRL. Loại trừ A vì siêu âm CRL quý 1 dù chính xác nhưng vẫn có sai số sinh học ± 5 đến 7 ngày, không thể thay thế ngày chuyển phôi IVF. Loại trừ C và D vì không có cơ sở lấy trung bình cộng hay chờ quý 2."
      },
      {
        id: 2,
        title: "Ca 02",
        level: "Mức 3 - Phân tích",
        vignette: "Bệnh nhân nữ 26 tuổi, PARA 0000, trễ kinh 5 tuần 4 ngày, tiền sử kinh nguyệt đều 28 ngày. Bệnh nhân vào viện vì ra máu âm đạo rỉ rả màu nâu đen kèm đau tức nhẹ hạ vị lệch bên phải. Khám thực thể: Sinh hiệu bình thường, ấn tức hố chậu phải, thân tử cung to hơn bình thường nhẹ. Định lượng beta-hCG huyết thanh = 1.850 mIU/mL. Siêu âm TVS: Buồng tử cung có một túi dịch nhỏ d = 6 mm nằm ở chính giữa khoang nội mạc, bao quanh bởi một đường viền tăng âm đơn độc, không có dấu màng rụng đôi (Double-decidual sign). Cạnh buồng trứng phải có khối echo hỗn hợp kích thước 18 x 14 mm.",
        question: "Nhận định hình ảnh học chuẩn xác nhất về túi dịch quan sát thấy trong lòng tử cung là gì?",
        options: {
          A: "Túi thai sớm đang làm tổ bình thường nhưng chưa có phôi.",
          B: "Túi thai giả do dịch tụ trong buồng tử cung ở thai ngoài.",
          C: "Hình ảnh túi thai bị bóc tách dọa sẩy ở giai đoạn rất sớm.",
          D: "Túi thai trống đã ngừng phát triển cần can thiệp nạo buồng."
        },
        correct: "B",
        explanation: "Túi thai thật trên siêu âm thường nằm lệch tâm dưới lớp nội mạc và có dấu hiệu màng rụng đôi (double-decidual sign) gồm 2 lớp phản âm dày. Túi thai giả (pseudo-gestational sac) nằm ở chính giữa khoang nội mạc, chỉ có một lớp viền màng rụng đơn độc, bên trong chứa dịch máu, hay gặp trong thai lạc chỗ. Kết hợp beta-hCG 1.850 mIU/mL và khối cạnh tử cung phải, đây là túi thai giả của thai lạc chỗ. Loại trừ A, C, D vì hình ảnh túi dịch trung tâm không có màng rụng đôi không thể là thai trong tử cung bình thường hay dọa sẩy."
      },
      {
        id: 3,
        title: "Ca 03",
        level: "Mức 4 - Phân tích & Đánh giá",
        vignette: "Sản phụ 27 tuổi, con so, chu kỳ kinh nguyệt rất đều nhưng kéo dài 35 ngày. Ngày đầu của kỳ kinh cuối cùng là ngày 01/01/2026. Bác sĩ tuyến dưới tính ngày dự sinh theo quy tắc Naegele cổ điển là 08/10/2026. Đến tuần thứ 8 tính theo ngày kinh, siêu âm đo CRL = 14 mm (tương đương 7 tuần 5 ngày). Bác sĩ tuyến dưới chẩn đoán thai có dấu hiệu chậm tăng trưởng so với ngày kinh (lệch gần 1 tuần).",
        question: "Nhận định y khoa nào giải thích đúng đắn nhất về tình trạng tuổi thai của sản phụ?",
        options: {
          A: "Thai chậm tăng trưởng sớm do suy giảm chức năng nội tiết của hoàng thể thai kỳ.",
          B: "Thai phát triển hoàn toàn bình thường sau khi hiệu chỉnh ngày rụng trứng.",
          C: "Thai có nguy cơ cao bị ngừng tiến triển trong buồng tử cung cần xét nghiệm lại.",
          D: "Phép đo siêu âm sai số nghiêm trọng do tư thế giải phẫu tử cung gập sau."
        },
        correct: "B",
        explanation: "Pha hoàng thể luôn cố định 14 ngày. Với chu kỳ 35 ngày, thời điểm rụng trứng là ngày thứ 21 (muộn hơn 7 ngày so với chu kỳ chuẩn 28 ngày). Quy tắc Naegele hiệu chỉnh: Ngày dự sinh chuẩn + 7 ngày = 08/10 + 7 ngày = 15/10/2026. Tuổi thai thực tế tại thời điểm khám là 7 tuần 5 ngày, hoàn toàn trùng khớp với CRL = 14 mm. Thai phát triển hoàn toàn bình thường. Loại trừ A, C, D vì chẩn đoán chậm phát triển là sai lầm do không hiệu chỉnh ngày rụng trứng ở chu kỳ dài."
      },
      {
        id: 4,
        title: "Ca 04",
        level: "Mức 3 - Vận dụng",
        vignette: "Sản phụ 25 tuổi, con so, nhớ rõ ngày kinh cuối là 05/01/2026 (chu kỳ đều 28 ngày). Ngày dự sinh tính theo Naegele là 12/10/2026. Khám thai vào ngày 30/03/2026, tính theo ngày kinh tuổi thai là 12 tuần 0 ngày (84 ngày). Siêu âm đường bụng đúng chuẩn ISUOG: 01 thai sống, đo CRL = 72 mm, tương đương tuổi thai 13 tuần 2 ngày (93 ngày), ngày dự sinh theo siêu âm là 03/10/2026 (chênh lệch 9 ngày so với ngày kinh).",
        question: "Theo hướng dẫn thực hành của ACOG, quyết định xác lập ngày dự sinh chính thức là gì?",
        options: {
          A: "Giữ nguyên ngày dự sinh theo ngày kinh là ngày 12/10/2026.",
          B: "Đổi ngày dự sinh chính thức sang ngày 03/10/2026 theo siêu âm.",
          C: "Lấy trung bình cộng hai mốc ngày dự sinh là ngày 07/10/2026.",
          D: "Chờ siêu âm đo đường kính lưỡng đỉnh ở tuần 16 quyết định."
        },
        correct: "B",
        explanation: "Theo Bảng 3.1 của ACOG: Ở tuổi thai từ 9 tuần 0 ngày đến 13 tuần 6 ngày, nếu độ chênh lệch giữa tuổi thai theo siêu âm và ngày kinh > 7 ngày thì bắt buộc phải hiệu chỉnh ngày dự sinh theo siêu âm. Ở đây độ lệch là 9 ngày (> 7 ngày), do đó đổi ngày dự sinh chính thức theo siêu âm sang ngày 03/10/2026. Loại trừ A vì độ lệch vượt ngưỡng cho phép. Loại trừ C và D vì không có khuyến cáo lấy trung bình cộng hoặc trì hoãn."
      },
      {
        id: 5,
        title: "Ca 05",
        level: "Mức 3 - Phân tích",
        vignette: "Sản phụ 30 tuổi, PARA 1001, đến khám vì trễ kinh 3 tuần kèm ra ít dịch nhầy nâu ở âm đạo. Khám lâm sàng: Thân tử cung mềm, kích thước tương đương thai 6-7 tuần, cổ tử cung đóng kín, không đau hạ vị. Siêu âm qua đầu dò âm đạo (TVS) được thực hiện cẩn thận: Quan sát thấy một túi thai bờ tròn đều trong buồng tử cung, đo đường kính túi thai trung bình MSD = 27 mm. Hoàn toàn không quan sát thấy túi noãn hoàng và không thấy âm vang phôi thai.",
        question: "Dựa trên tiêu chuẩn siêu âm chuẩn quốc tế, kết luận chẩn đoán xác định phù hợp nhất là gì?",
        options: {
          A: "Dọa sẩy thai sớm, cần kê đơn thuốc nội tiết dưỡng thai.",
          B: "Thai ngừng tiến triển trong buồng tử cung dạng túi thai trống.",
          C: "Thai chưa xác định vị trí, cần làm thêm xét nghiệm beta-hCG.",
          D: "Thai trong tử cung bình thường nhưng phát triển chậm hơn tuổi."
        },
        correct: "B",
        explanation: "Tiêu chuẩn vàng của ACOG và Hội đồng Siêu âm Sản phụ khoa quốc tế chẩn đoán chắc chắn thất bại thai kỳ sớm (Early Pregnancy Loss) bao gồm: Đường kính túi thai trung bình (MSD) >= 25 mm qua đầu dò âm đạo mà không có phôi thai (túi thai trống/trứng trống). Trường hợp này MSD = 27 mm và không có phôi thai, đủ tiêu chuẩn chẩn đoán xác định mà không cần theo dõi thêm. Loại trừ A và D vì chẩn đoán dọa sẩy hay thai bình thường là sai lầm nghiêm trọng. Loại trừ C vì túi thai đã nằm rõ trong lòng tử cung."
      },
      {
        id: 6,
        title: "Ca 06",

    // PHÂN TÁCH BỘ NHỚ THEO TÊN FILE HTML
    const PAGE_NAME = window.location.pathname.split('/').pop().replace('.html', '').toLowerCase() || 'bai03';
    const STORAGE_KEY = `QUIZ_STATE_${PAGE_NAME}`;

    // App State
    let state = {
      answers: {},    // { [caseId]: 'A'|'B'|'C'|'D' }
      starred: {},    // { [caseId]: boolean }
      notes: {},      // { [caseId]: string }
      index: 0
    };

    let currentFilter = 'all';
    let saveTimeout = null;

    // Load state từ LocalStorage
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          if (!(typeof state.index === 'number' && state.index >= 0 && state.index < cases.length)) {
            state.index = 0;
          }
        }
      } catch (err) {
        console.error("Lỗi đọc LocalStorage", err);
      }
    }

    // Save state vào LocalStorage
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error("Lỗi ghi LocalStorage", err);
      }
    }

    // Bộ lọc
    function getFilteredList() {
      return cases.map((c, i) => {
        const ans = state.answers[c.id];
        const isStarred = !!state.starred[c.id];
        const isAnswered = !!ans;
        const isCorrect = isAnswered && ans === c.correct;

        if (currentFilter === 'all') return i;
        if (currentFilter === 'starred') return isStarred ? i : null;
        if (currentFilter === 'unanswered') return !isAnswered ? i : null;
        if (currentFilter === 'wrong') return (isAnswered && !isCorrect) ? i : null;
        return i;
      }).filter(i => i !== null);
    }

    function changeFilter(val) {
      currentFilter = val;
      const list = getFilteredList();
      if (list.length > 0 && !list.includes(state.index)) {
        state.index = list[0];
      }
      render();
      saveState();
    }

    // Điều hướng
    function prevCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos > 0) state.index = list[pos - 1];
      else state.index = list[list.length - 1];
      render();
      saveState();
      scrollTop();
    }

    function nextCase() {
      const list = getFilteredList();
      if (list.length === 0) return;
      const pos = list.indexOf(state.index);
      if (pos < list.length - 1) state.index = list[pos + 1];
      else state.index = list[0];
      render();
      saveState();
      scrollTop();
    }

    function jumpTo(idx) {
      state.index = idx;
      closeJumpModal();
      render();
      saveState();
      scrollTop();
    }

    function scrollTop() {
      const el = document.getElementById('main-content');
      if (el) el.scrollTop = 0;
    }

    // Chọn đáp án
    function chooseOption(letter) {
      const c = cases[state.index];
      state.answers[c.id] = letter;
      saveState();
      render();
    }

    // Bookmark / Star
    function toggleStarCurrent() {
      const c = cases[state.index];
      state.starred[c.id] = !state.starred[c.id];
      saveState();
      renderStarUI();
    }

    function renderStarUI() {
      const c = cases[state.index];
      const isStarred = !!state.starred[c.id];
      const icon = document.getElementById('star-icon');
      const btn = document.getElementById('star-btn');
      if (isStarred) {
        icon.className = "fa-solid fa-star text-amber-500 text-sm";
        btn.classList.add('bg-amber-50', 'border-amber-300');
      } else {
        icon.className = "fa-regular fa-star text-slate-400 text-sm";
        btn.classList.remove('bg-amber-50', 'border-amber-300');
      }
    }

    // Ghi chú
    function saveNote(val) {
      const c = cases[state.index];
      state.notes[c.id] = val;
      saveState();

      const hint = document.getElementById('note-saved-hint');
      if (hint) {
        hint.style.opacity = '1';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => { hint.style.opacity = '0'; }, 1000);
      }
    }

    // Đặt lại tiến độ
    function promptReset() {
      if (window.confirm("Bạn có muốn xóa kết quả đã tick để luyện lại từ đầu? (Ghi chú vẫn được giữ)")) {
        state.answers = {};
        state.starred = {};
        state.index = 0;
        saveState();
        render();
      }
    }

    // Render ca bệnh hiện tại
    function render() {
      const c = cases[state.index];
      if (!c) return;

      const userAns = state.answers[c.id];
      const isAnswered = !!userAns;
      const isCorrect = userAns === c.correct;

      // Cập nhật số thứ tự (chỉ giữ "Ca XX")
      const currentNum = c.id < 10 ? '0' + c.id : c.id;
      document.getElementById('case-counter').innerText = `Ca ${currentNum}/50`;
      document.getElementById('bottom-counter').innerText = `${c.id} / 50`;
      document.getElementById('case-title').innerText = `Ca ${currentNum}`;
      document.getElementById('case-level').innerText = c.level;
      
      document.getElementById('case-vignette').innerText = c.vignette;
      document.getElementById('case-question').innerText = c.question;

      // Tiến độ tổng
      const answeredCount = Object.keys(state.answers).length;
      document.getElementById('progress-line').style.width = `${Math.round((answeredCount / cases.length) * 100)}%`;

      // Render 4 phương án A-B-C-D
      const optionsBox = document.getElementById('options-box');
      const letters = ['A', 'B', 'C', 'D'];
      let html = '';

      letters.forEach(letter => {
        const text = c.options[letter];
        let btnCls = "w-full text-left p-3 min-h-[48px] rounded-xl border text-xs sm:text-[13px] font-medium transition flex items-center gap-2.5 active:scale-[0.99] ";
        let badgeCls = "w-6 h-6 rounded-md font-bold flex items-center justify-center shrink-0 text-xs font-mono ";

        if (!isAnswered) {
          btnCls += "border-slate-200 bg-white text-slate-700 hover:border-teal-500 hover:bg-slate-50";
          badgeCls += "bg-slate-100 text-slate-600";
        } else {
          if (letter === c.correct) {
            btnCls += "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-1 ring-emerald-400";
            badgeCls += "bg-emerald-600 text-white";
          } else if (letter === userAns) {
            btnCls += "border-rose-400 bg-rose-50 text-rose-950 font-semibold ring-1 ring-rose-400";
            badgeCls += "bg-rose-600 text-white";
          } else {
            btnCls += "border-slate-200 bg-white text-slate-400 opacity-60";
            badgeCls += "bg-slate-100 text-slate-400";
          }
        }

        html += `
          <button onclick="chooseOption('${letter}')" class="${btnCls}">
            <span class="${badgeCls}">${letter}</span>
            <span class="flex-1 py-0.5 leading-snug">${text}</span>
            ${isAnswered && letter === c.correct ? '<i class="fa-solid fa-circle-check text-emerald-600 text-sm ml-1 shrink-0"></i>' : ''}
            ${isAnswered && letter === userAns && letter !== c.correct ? '<i class="fa-solid fa-circle-xmark text-rose-500 text-sm ml-1 shrink-0"></i>' : ''}
          </button>
        `;
      });
      optionsBox.innerHTML = html;

      // Biện luận y khoa & Phân tích bẫy
      const expContainer = document.getElementById('explanation-container');
      const statusBadge = document.getElementById('status-badge');
      const expText = document.getElementById('explanation-text');

      if (isAnswered) {
        expContainer.classList.remove('hidden');
        if (isCorrect) {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-900";
          statusBadge.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i> <span>Chính xác! Đáp án đúng là <strong>${c.correct}</strong></span>`;
        } else {
          statusBadge.className = "p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-rose-50 border border-rose-200 text-rose-900";
          statusBadge.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-500 text-sm"></i> <span>Chưa chính xác. Đáp án chuẩn là <strong>${c.correct}</strong></span>`;
        }
        expText.innerText = c.explanation;
      } else {
        expContainer.classList.add('hidden');
      }

      // Khôi phục ghi chú & sao
      document.getElementById('note-input').value = state.notes[c.id] || '';
      renderStarUI();
    }

    // Modal Jump Grid
    function openJumpModal() {
      const container = document.getElementById('grid-container');
      let html = '';

      cases.forEach((c, idx) => {
        const ans = state.answers[c.id];
        const isCurrent = idx === state.index;
        const isStarred = !!state.starred[c.id];

        let bg = "bg-white border-slate-200 text-slate-700";
        if (ans) {
          bg = ans === c.correct ? "bg-emerald-500 border-emerald-600 text-white font-semibold" : "bg-rose-500 border-rose-600 text-white font-semibold";
        }
        const currentRing = isCurrent ? " ring-2 ring-teal-500 ring-offset-1 font-bold scale-105 z-10" : "";

        html += `
          <button onclick="jumpTo(${idx})" class="h-10 rounded-xl border text-xs font-mono relative flex items-center justify-center transition active:scale-95 ${bg} ${currentRing}">
            <span>${c.id < 10 ? '0' + c.id : c.id}</span>
            ${isStarred ? '<span class="absolute top-1 right-1 text-[8px] text-amber-300 drop-shadow"><i class="fa-solid fa-star"></i></span>' : ''}
          </button>
        `;
      });

      container.innerHTML = html;
      const modal = document.getElementById('jump-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeJumpModal() {
      const modal = document.getElementById('jump-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Hỗ trợ vuốt màn hình (Swipe Gestures)
    let startX = 0;
    let startY = 0;
    const mainEl = document.getElementById('main-content');

    mainEl.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    mainEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - startX;
      const diffY = e.changedTouches[0].screenY - startY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
        if (diffX < 0) nextCase();
        else prevCase();
      }
    }, { passive: true });

    // Phím tắt
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') prevCase();
      else if (e.key === 'ArrowRight') nextCase();
      else if (['1', 'a', 'A'].includes(e.key)) chooseOption('A');
      else if (['2', 'b', 'B'].includes(e.key)) chooseOption('B');
      else if (['3', 'c', 'C'].includes(e.key)) chooseOption('C');
      else if (['4', 'd', 'D'].includes(e.key)) chooseOption('D');
      else if (['s', 'S'].includes(e.key)) toggleStarCurrent();
    });

    // Khởi động
    window.onload = function() {
      loadState();
      render();
    };
  </script>
</body>
