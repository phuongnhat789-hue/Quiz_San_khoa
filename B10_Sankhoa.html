ội soi.", "Chẩn đoán nhầm U xơ tử cung hoại tử vì tử cung ấn đau và khí hư màu vàng đục chảy ra từ âm đạo."], "correct": 2, "traps": [{"key": "A", "trap": "Khí hư mủ âm đạo và Chandelier sign hướng tới PID hơn viêm ruột thừa [sai_tang]"}, {"key": "B", "trap": "beta-hCG âm tính loại trừ thai ngoài tử cung; cổ tử cung lắc đau Chandelier sign là dấu hiệu của PID [phan_biet_hep]"}, {"key": "D", "trap": "Nạo hút buồng tử cung chống chỉ định khi đang có viêm nhiễm cấp tính [bo_chong_chi_dinh]"}, {"key": "E", "trap": "Không có bằng chứng u xơ tử cung [bat_tu_khoa]"}], "decision": "Sốt 38.5°C + Khí hư mủ + Cổ tử cung lắc đau Chandelier sign + BC 16.000/mm³ + beta-hCG âm tính -> Viêm phần phụ cấp (PID) -> Chẩn đoán thai ngoài tử cung rỉ máu để mổ là sai lầm.", "explanation": "Theo Bài 10: Viêm phần phụ cấp (Pelvic Inflammatory Disease - PID) có triệu chứng đau hạ vị và lắc cổ tử cung đau (Chandelier sign), nhưng đặc trưng bởi: sốt, khí hư mủ, bạch cầu máu tăng cao và đặc biệt beta-hCG âm tính. Mổ cấp cứu thai ngoài tử cung khi beta-hCG âm tính là sai sót quy trình."}, {"id": 72, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, trễ kinh 9 tuần, nghén nặng nôn mửa liên tục, ra máu âm đạo rỉ rả. Tử cung to tương đương thai 14 tuần, mật độ mềm. Siêu âm TVS: Buồng tử cung chứa hình ảnh tuyết rơi lốm đốm, không có thai nhi (chửa trứng toàn phần). Tuy nhiên khi làm xét nghiệm que thử thai nhanh nước tiểu ban đầu lại cho kết quả vạch mờ (âm tính giả). Bác sĩ chỉ định pha loãng mẫu nước tiểu 1:100 rồi thử lại thì xuất hiện 2 vạch đậm rõ ngay lập tức.", "question": "Thẩm định cơ chế sinh hóa miễn dịch giải thích hiện tượng âm tính giả ban đầu trên que thử nhanh?", "options": ["Do nước tiểu bệnh nhân bị kiềm hóa nặng làm đứt gãy các chuỗi peptide beta của hormone hCG.", "Hiện tượng kháng thể dị ái trong máu phá hủy hoàn toàn cấu trúc phân tử hormone hCG làm không hiện vạch. theo đúng quy trình hướng", "Do thận bệnh nhân bị suy giảm chức năng lọc nên không tống xuất được hormone hCG ra ngoài nước tiểu.", "Do hormone TSH tăng cao đột ngột gây phản ứng chéo cạnh tranh vị trí gắn kết trên que thử thai nhanh.", "Hiệu ứng móc do nồng độ hCG quá cao làm bão hòa cả kháng thể bắt giữ và kháng thể phát hiện trên que thử."], "correct": 4, "traps": [{"key": "A", "trap": "Không liên quan đến kiềm hóa nước tiểu [bat_tu_khoa]"}, {"key": "B", "trap": "Kháng thể dị ái gây dương tính giả Phantom hCG chứ không gây âm tính giả do nồng độ cao [phan_biet_hep]"}, {"key": "C", "trap": "Không liên quan đến chức năng lọc của thận [sai_tang]"}, {"key": "D", "trap": "TSH không cạnh tranh gây âm tính giả kiểu Hook effect [bat_tu_khoa]"}], "decision": "Chửa trứng toàn phần + hCG vọt cực cao (> 500.000) + Que thử mờ/âm tính -> Hiệu ứng móc (Hook effect) bão hòa kháng thể -> Pha loãng 1:100 cho 2 vạch đậm -> Khẳng định cạm bẫy Hook effect.", "explanation": "Theo Bài 10 và Bài 09: Hiệu ứng móc (Hook effect) xảy ra khi nồng độ beta-hCG trong mẫu thử quá cao (> 500.000 mIU/mL), làm bão hòa đồng thời cả kháng thể bắt giữ và kháng thể phát hiện trên que thử nhanh sandwich, ngăn cản tạo phức hợp màu -> Âm tính giả. Khắc phục bằng cách pha loãng mẫu thử 1:10 - 1:100."}, {"id": 73, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Phụ nữ 26 tuổi, chưa từng mang thai, không có triệu chứng lâm sàng. Định lượng beta-hCG huyết thanh liên tục dao động 80 - 120 mIU/mL suốt 3 tháng qua. Siêu âm TVS buồng tử cung và hai phần phụ hoàn toàn bình thường. Bệnh nhân đã được mổ nội soi thám sát ổ bụng 1 lần nhưng không tìm thấy khối thai. Bác sĩ tư vấn tiêm Methotrexate hóa trị. Tuy nhiên, khi lấy mẫu nước tiểu làm xét nghiệm beta-hCG nước tiểu thì kết quả lại ÂM TÍNH hoàn toàn.", "question": "Thẩm định chẩn đoán nguyên nhân gây hiện tượng beta-hCG máu dương tính giả kéo dài trên bệnh nhân này?", "options": ["Bệnh nguyên bào nuôi ác tính di căn xa cần chuyển ngay sang chuyên khoa ung bướu để điều trị hóa chất đa trị liệu. theo đúng quy", "Hiện tượng Phantom hCG do kháng thể dị ái trong máu mẹ gắn kết phi đặc hiệu với kháng thể xét nghiệm, không phải thai thật.", "Thai ngoài tử cung ở vị trí cực kỳ hiếm gặp như lách hoặc gan bắt buộc phải chụp PET-CT toàn thân để tìm.", "Suy thận mạn tính làm giảm khả năng đào thải hCG qua đường nước tiểu dẫn đến tích tụ hormone trong máu.", "U tuyến yên tiết hCG ectopic bắt buộc phải chỉ định phẫu thuật mổ qua xoang bướm cắt U tuyến yên khẩn cấp."], "correct": 1, "traps": [{"key": "A", "trap": "Phantom hCG không phải u nguyên bào nuôi di căn, tiêm MTX hay mổ đều không làm giảm hCG [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Không có thai thật vì hCG nước tiểu âm tính (kháng thể dị ái phân tử lớn không qua được màng lọc cầu thận) [phan_biet_hep]"}, {"key": "D", "trap": "Suy thận không gây Phantom hCG [sai_tang]"}, {"key": "E", "trap": "Không có chỉ định mổ tuyến yên [qua_xam_lan]"}], "decision": "beta-hCG máu dương tính 80-120 mIU/mL kéo dài + Siêu âm & Mổ OGD bình thường + beta-hCG nước tiểu ÂM TÍNH -> Kháng thể dị ái Heterophile antibodies (Phantom hCG) -> Tuyệt đối KHÔNG mổ hay tiêm MTX.", "explanation": "Theo Bài 10 và Bài 09: Phantom hCG (dương tính giả) xảy ra do kháng thể dị ái (heterophile antibodies) trong huyết thanh bệnh nhân tự gắn kết phi đặc hiệu với kháng thể dùng trong kít thử nghiệm. Kháng thể này có kích thước phân tử lớn không lọc qua cầu thận nên beta-hCG NƯỚC TIỂU LUÔN ÂM TÍNH. Bệnh nhân không có thai thật, tuyệt đối không mổ hay tiêm hóa chất MTX."}, {"id": 74, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, mang thai lần đầu, được mổ nội soi cắt vòi tử cung phải do thai ngoài tử cung vỡ. Xét nghiệm nhóm máu của sản phụ: Nhóm máu O, RhD âm tính. Nhóm máu của người chồng: Nhóm máu A, RhD dương tính. Bác sĩ cho bệnh nhân xuất viện sau mổ 2 ngày mà không có chỉ định tiêm sinh phẩm y học dự phòng bất đồng nhóm máu.", "question": "Thẩm định sai sót trong quy trình dự phòng miễn dịch đồng huyết cho sản phụ RhD âm tính này?", "options": ["Quy trình đúng đắn nhưng phải dặn sản phụ uống thuốc Corticoid Dexamethasone kéo dài 1 tháng để chống thải ghép.", "Quy trình xuất viện hoàn toàn đúng đắn vì thai ngoài tử cung chưa có hệ tuần hoàn nên không gây mẫn cảm nhóm máu RhD.", "Sai sót vì đáng lẽ phải truyền 02 đơn vị khối hồng cầu RhD âm tính cho sản phụ trước khi cho xuất viện.", "Bỏ sót chỉ định tiêm dự phòng Anti-D Immunoglobulin cho mẹ RhD âm tính trong vòng 72 giờ sau phẫu thuật thai ngoài tử cung.", "Sai sót vì đáng lẽ phải tiêm vắc xin phòng ngừa uốn ván và rubella ngay trong buổi sáng xuất viện."], "correct": 3, "traps": [{"key": "A", "trap": "Corticoid không thay thế được Anti-D Immunoglobulin [qua_bao_ton]"}, {"key": "B", "trap": "Mọi trường hợp thai ngoài tử cung ở mẹ RhD (-) đều có nguy cơ chảy máu mẹ-thai gây mẫn cảm RhD [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Không có chỉ định truyền máu khi không mất máu nặng [qua_xam_lan]"}, {"key": "E", "trap": "Không liên quan đến dự phòng miễn dịch RhD [bat_tu_khoa]"}], "decision": "Mẹ RhD âm tính + Chồng RhD dương tính + Mổ thai ngoài tử cung -> Nguy cơ mẫn cảm RhD -> Bắt buộc tiêm Anti-D Immunoglobulin (50-120 mcg) trong 72 giờ -> Bỏ sót là sai sót quy trình.", "explanation": "Theo Bài 10 và Bài 08: Phụ nữ mang nhóm máu RhD âm tính bị thai ngoài tử cung (dù điều trị nội khoa hay phẫu thuật) BẮT BUỘC phải được tiêm dự phòng Anti-D Immunoglobulin (liều 50-120 mcg) trong vòng 72 giờ để ngăn ngừa sự sản sinh kháng thể Anti-D gây tan huyết nặng nề cho các thai kỳ sau."}, {"id": 75, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 27 tuổi, vừa điều trị khỏi thai ngoài tử cung bằng Methotrexate liều đơn (beta-hCG đã về âm tính < 5 mIU/mL cách đây 1 tuần). Bệnh nhân đến phòng khám tư vấn về kế hoạch mang thai lại. Bác sĩ phòng khám khuyên bệnh nhân có thể thả thai mang thai lại ngay trong tháng tới và không cần kiểm tra thêm bất kỳ xét nghiệm nào.", "question": "Thẩm định tính đúng đắn và độ an toàn trong lời khuyên tư vấn của bác sĩ phòng khám?", "options": ["Lời khuyên sai lầm nguy hiểm vì bắt buộc phải tránh thai an toàn ít nhất 3 tháng sau tiêm Methotrexate và nên chụp HSG kiểm tra vòi tử cung.", "Lời khuyên hoàn toàn đúng đắn vì beta-hCG đã âm tính chứng tỏ cơ thể đã hồi phục hoàn toàn và Methotrexate đã đào thải hết.", "Lời khuyên sai lầm vì bệnh nhân đã bị thai ngoài tử cung thì bắt buộc phải làm IVF 100% chứ không được mang thai tự nhiên nữa. theo đúng quy trình", "Lời khuyên đúng đắn nhưng dặn bệnh nhân phải uống viên sắt và acid folic liều cao 5 mg/ngày ngay lập tức trong tuần này.", "Lời khuyên sai lầm vì bắt buộc phải phẫu thuật mổ nội soi thám sát kiểm tra vòi tử cung trước khi cho phép thả thai."], "correct": 0, "traps": [{"key": "B", "trap": "MTX làm suy giảm folate tích lũy trong trứng, thả thai ngay < 3 tháng có nguy cơ cao dị tật ống thần kinh [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Vẫn có thể mang thai tự nhiên 60-70%, không bắt buộc IVF 100% [qua_xam_lan]"}, {"key": "D", "trap": "Uống Folic acid ngay khi vừa tiêm MTX làm giảm hiệu quả đào thải độc tính [phan_biet_hep]"}, {"key": "E", "trap": "Không cần mổ nội soi thám sát kiểm tra vòi tử cung [qua_xam_lan]"}], "decision": "Điều trị MTX -> Độc tính kháng Folate kéo dài -> Bắt buộc tránh thai an toàn ít nhất 3 tháng -> Chụp HSG kiểm tra độ thông vòi tử cung -> Thả thai ngay < 3 tháng là tư vấn sai lầm nguy hiểm.", "explanation": "Theo Bài 10: Methotrexate là chất đối kháng acid folic, có thể tích lũy và gây độc cho noãn bào và phôi thai. Quy định bắt buộc: Bệnh nhân phải tránh thai an toàn ít nhất 3 THÁNG sau khi dùng MTX mới được phép mang thai lại. Đồng thời nên chụp tử cung - vòi tử cung (HSG) sau 3 tháng vào ngày 2-5 sau sạch kinh để kiểm tra độ thông của vòi tử cung."}, {"id": 76, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, trễ kinh 6 tuần, ra máu âm đạo rỉ rả nâu đen. Siêu âm chưa rõ vị trí túi thai (PUL). Bác sĩ phòng khám cho kê đơn thuốc Ergometrine tiêm bắp và Misoprostol ngậm dưới lưỡi với mục đích tống xuất hoàn toàn bọc máu trong tử cung ra ngoài. 2 giờ sau khi dùng thuốc, sản phụ xuất hiện cơn co tử cung dữ dội, vòi tử cung trái bị khối thai xé vỡ ngập máu ổ bụng.", "question": "Thẩm định sai lầm nghiêm trọng trong việc chỉ định thuốc co hồi tử cung cho bệnh nhân này?", "options": ["Sai lầm vì đáng lẽ phải phối hợp tiêm truyền khẩn cấp dung dịch Oxytocin liều cao cùng lúc với Misoprostol ngậm.", "Chỉ định Ergometrine và Misoprostol hoàn toàn đúng đắn nhưng do liều dùng thuốc chưa đủ cao để tống xuất bọc thai.", "Dùng thuốc co hồi tử cung khi chưa loại trừ thai ngoài tử cung là chống chỉ định tuyệt đối, gây tăng áp lực tử cung xé vỡ khối thai ngoài.", "Chỉ định đúng đắn nhưng phải kết hợp cho bệnh nhân ngâm bồn nước ấm để làm giãn nở cổ tử cung giúp tống xuất. theo đúng quy trình hướng dẫn lâm sàng", "Sai lầm vì thuốc Misoprostol chỉ được phép sử dụng qua đường đặt sâu vào âm đạo chứ không được dùng qua đường ngậm."], "correct": 2, "traps": [{"key": "A", "trap": "Oxytocin làm tăng co bóp càng xé vỡ thai ngoài nhanh hơn [qua_xam_lan]"}, {"key": "B", "trap": "Dùng thuốc co hồi tử cung khi chưa loại trừ thai ngoài là sai sót chết người [bo_chong_chi_dinh]"}, {"key": "D", "trap": "Ngâm nước ấm không có tác dụng tống xuất thai ngoài [bat_tu_khoa]"}, {"key": "E", "trap": "Không liên quan đến đường dùng thuốc Misoprostol [bat_tu_khoa]"}], "decision": "Chưa loại trừ thai ngoài tử cung (PUL) -> Dùng Ergometrine/Misoprostol -> Tử cung co bóp tăng áp lực -> Thai ngoài tử cung vỡ ngập máu -> CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI.", "explanation": "Theo Bài 10: Khi chưa loại trừ chẩn đoán thai ngoài tử cung (hoặc đang theo dõi PUL), CẤM TUYỆT ĐỐI không được sử dụng các thuốc co hồi tử cung (Ergometrine, Oxytocin, Misoprostol). Cơn co tử cung mạnh sẽ làm tăng áp lực vòi tử cung gây vỡ khối thai xuất huyết nội nguy kịch."}, {"id": 77, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 23 tuổi, con so (PARA 0000), hiếm muộn 2 năm, thai ngoài tử cung vòi trứng phải d = 28 mm chưa vỡ, sinh hiệu hoàn toàn ổn định. Vòi tử cung trái bình thường. Trong mổ nội soi, bác sĩ quyết định thực hiện phẫu thuật xẻ vòi tử cung phải lấy khối thai bảo tồn (Salpingostomy) để giữ khả năng mang thai tự nhiên cho sản phụ.", "question": "Thẩm định tính hợp lý của quyết định phẫu thuật xẻ vòi bảo tồn trên sản phụ con so này?", "options": ["Quyết định sai lầm vì mổ xẻ vòi bảo tồn sẽ làm sản phụ bị mất khả năng rụng trứng của buồng trứng cùng bên.", "Quyết định sai lầm vì bắt buộc phải cắt bỏ vòi tử cung phải 100% để ngăn ngừa tuyệt đối nguy cơ tái phát thai ngoài.", "Quyết định sai lầm vì chỉ cần tiêm thuốc Methotrexate tại chỗ qua nội soi chứ không được rạch xẻ vòi tử cung.", "Quyết định đúng đắn nhưng bắt buộc phải tiến hành kẹp cắt luôn vòi tử cung bên trái để chuẩn bị làm IVF.", "Quyết định hoàn toàn đúng đắn và ưu tiên vì sản phụ chưa có con, khối thai chưa vỡ và kích thước dưới 3 cm."], "correct": 4, "traps": [{"key": "A", "trap": "Xẻ vòi tử cung không ảnh hưởng đến chức năng rụng trứng của buồng trứng [sai_tang]"}, {"key": "B", "trap": "Cắt vòi tử cung ở sản phụ con so chưa vỡ là can thiệp thô bạo lãng phí [qua_xam_lan]"}, {"key": "C", "trap": "Xẻ vòi lấy sạch khối thai là phẫu thuật chuẩn mực [phan_biet_hep]"}, {"key": "D", "trap": "Kẹp cắt vòi bên lành là phá hủy chức năng sinh sản [qua_xam_lan]"}], "decision": "Con so + Thai vòi trứng chưa vỡ < 3cm -> Chỉ định phẫu thuật xẻ vòi bảo tồn Salpingostomy -> Giúp bảo tồn khả năng sinh sản tự nhiên -> Quyết định hoàn toàn chuẩn xác.", "explanation": "Theo Bài 10: Phẫu thuật xẻ vòi tử cung bảo tồn (Salpingostomy) được chỉ định ưu tiên ở phụ nữ trẻ chưa đủ con, mong muốn bảo tồn khả năng sinh sản, khi khối thai chưa vỡ và kích thước < 3 cm. Tỷ lệ mang thai trong tử cung sau xẻ vòi bảo tồn đạt 50-60%."}, {"id": 78, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 35 tuổi, PARA 2002 (đã đủ con). Bệnh nhân vào viện vì thai ngoài tử cung vòi trứng trái vỡ, chảy máu trong ổ bụng khoảng 400 mL, sinh hiệu ổn định. Trong mổ nội soi: Vòi tử cung trái bị vỡ nát đoạn bóng, mô vòi rách nát biến dạng không còn khả năng tái tạo. Bác sĩ quyết định phẫu thuật cắt toàn bộ vòi tử cung trái (Salpingectomy).", "question": "Thẩm định tính đúng đắn và độ an toàn trong quyết định cắt bỏ vòi tử cung của bác sĩ?", "options": ["Quyết định sai lầm vì bắt buộc phải cố gắng khâu tái tạo lại vòi tử cung bị vỡ nát để bảo tồn giải phẫu. theo đúng quy trình hướng dẫn", "Quyết định hoàn toàn chuẩn xác vì sản phụ đã đủ con, vòi tử cung bị vỡ nát không thể phục hồi và để tránh thai ngoài tồn tại.", "Quyết định sai lầm vì đáng lẽ phải tiêm Methotrexate liều cao vào khối vỡ thay vì tiến hành phẫu thuật cắt vòi.", "Quyết định đúng đắn nhưng bắt buộc phải tiến hành cắt luôn cả buồng trứng bên trái cùng lúc với vòi tử cung.", "Quyết định sai lầm vì cắt vòi tử cung sẽ gây rối loạn chu kỳ kinh nguyệt và mất kinh nguyệt vĩnh viễn."], "correct": 1, "traps": [{"key": "A", "trap": "Khâu vòi vỡ nát sẽ gây hẹp gập nguy cơ thai ngoài tái phát 100% hoặc thai tồn tại [qua_bao_ton]"}, {"key": "C", "trap": "Tiêm MTX khi khối thai đã vỡ chảy máu là sai chỉ định [qua_bao_ton]"}, {"key": "D", "trap": "Không cắt buồng trứng lành khi cắt vòi tử cung [qua_xam_lan]"}, {"key": "E", "trap": "Cắt vòi tử cung không ảnh hưởng đến kinh nguyệt do buồng trứng vẫn hoạt động [sai_tang]"}], "decision": "Sản phụ 35t đủ con + Thai vòi trứng vỡ nát -> Phẫu thuật cắt vòi Salpingectomy -> Tránh chảy máu & thai ngoài tồn tại -> Quyết định chuẩn xác.", "explanation": "Theo Bài 10: Chỉ định cắt vòi tử cung (Salpingectomy) áp dụng khi: (1) Sản phụ đã đủ con hoặc không còn nhu cầu sinh thêm; (2) Vòi tử cung bị vỡ nát, tổn thương nặng không thể phục hồi; (3) Chảy máu không cầm được sau xẻ vòi; (4) Thai ngoài tử cung tái phát trên cùng một vòi."}, {"id": 79, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 29 tuổi, thai ngoài tử cung vòi trứng trái chưa vỡ. beta-hCG = 4.800 mIU/mL, khối thai d = 32 mm, chưa có tim thai, sinh hiệu ổn định. Do nồng độ beta-hCG cao gần ngưỡng 5.000 mIU/mL, bác sĩ quyết định áp dụng phác đồ Methotrexate đa liều: MTX 1 mg/kg tiêm bắp vào các Ngày 1, 3, 5, 7 phối hợp Leucovorin 0,1 mg/kg vào các Ngày 2, 4, 6, 8 để giải độc.", "question": "Thẩm định tính đúng đắn và vai trò của Leucovorin trong phác đồ Methotrexate đa liều này?", "options": ["Phác đồ đúng đắn nhưng Leucovorin bắt buộc phải tiêm cùng lúc vào cùng một vị trí với Methotrexate.", "Phác đồ sai lầm; Leucovorin là chất kích thích làm tăng hiệu quả tiêu diệt tế bào nuôi của Methotrexate lên gấp hai lần. theo đúng quy trình hướng", "Phác đồ sai lầm; Methotrexate đa liều chống chỉ định tuyệt đối cho mọi trường hợp thai ngoài tử cung chưa vỡ.", "Phác đồ chuẩn xác; Leucovorin là Acid Folinic dùng để bảo vệ tế bào lành khỏi độc tính suy tủy và viêm loét niêm mạc do MTX.", "Phác đồ sai lầm; Leucovorin làm trung hòa tiêu hủy toàn bộ Methotrexate làm điều trị thất bại 100%."], "correct": 3, "traps": [{"key": "A", "trap": "Leucovorin tiêm vào ngày xen kẽ N2,4,6,8 chứ không tiêm cùng lúc [sai_thu_tu]"}, {"key": "B", "trap": "Leucovorin là chất giải độc cứu tế bào lành Folinic acid rescue chứ không tăng độc tính MTX [phan_biet_hep]"}, {"key": "C", "trap": "Phác đồ đa liều dùng rất tốt cho ca hCG cao gần 5.000 [guideline_cu]"}, {"key": "E", "trap": "Leucovorin giải độc tế bào lành theo liều chuẩn không làm thất bại điều trị [sai_tang]"}], "decision": "beta-hCG 4.800 mIU/mL gần 5.000 -> Chỉ định Phác đồ MTX đa liều (N1,3,5,7) + Leucovorin (N2,4,6,8) -> Leucovorin (Folinic acid) bảo vệ tủy xương & niêm mạc -> Phác đồ hoàn toàn chuẩn xác.", "explanation": "Theo Bài 10: Phác đồ MTX đa liều (1 mg/kg N1,3,5,7) kết hợp Leucovorin (0,1 mg/kg N2,4,6,8) áp dụng hiệu quả cho ca beta-hCG cao gần 5.000 mIU/mL. Leucovorin (Acid Folinic) đóng vai trò giải độc (Folinic acid rescue), bảo vệ tủy xương và niêm mạc tiêu hóa của mẹ khỏi tác dụng phụ của MTX."}, {"id": 80, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, trễ kinh 6 tuần, ra máu nâu rỉ rả. Siêu âm TVS: Buồng tử cung trống, cạnh buồng trứng phải có khối echo hỗn hợp d = 24 mm. Bác sĩ bật Doppler màu khảo sát khối thai thấy hình ảnh vòng nhẫn mạch máu tăng sinh mạnh xung quanh với trở kháng thấp RI < 0.45 (dấu hiệu Ring of fire). Bác sĩ kết luận đây là khối thai ngoài tử cung đang hoạt động mạch máu mạnh.", "question": "Thẩm định giá trị chẩn đoán và cạm bẫy phân biệt của dấu hiệu Ring of fire trên siêu âm Doppler?", "options": ["Dấu hiệu Ring of fire gợi ý mạnh mẽ thai ngoài tử cung nhưng cần phân biệt với Nang hoàng thể buồng trứng cũng có vòng mạch tương tự.", "Dấu hiệu Ring of fire là tiêu chuẩn vàng khẳng định 100% thai ngoài tử cung mà không cần chẩn đoán phân biệt với bất kỳ khối nào. theo đúng quy", "Dấu hiệu Ring of fire chỉ xuất hiện khi khối thai ngoài tử cung đã vỡ ngập máu ổ bụng chảy máu cấp tính.", "Dấu hiệu Ring of fire khẳng định khối thai ngoài tử cung đã bị chết hoại tử không còn nguồn máu nuôi.", "Dấu hiệu Ring of fire là hình ảnh giả do hiện tượng nhiễu xạ chùm tia siêu âm khi đi qua bàng quang căng nước tiểu."], "correct": 0, "traps": [{"key": "B", "trap": "Nang hoàng thể buồng trứng cũng có Ring of fire nên không phải tiêu chuẩn khẳng định 100% [phan_biet_hep]"}, {"key": "C", "trap": "Ring of fire xuất hiện ở khối thai chưa vỡ đang hoạt động [sai_tang]"}, {"key": "D", "trap": "Ring of fire là vòng mạch máu nuôi tăng sinh mạnh chứ không phải hoại tử [sai_tang]"}, {"key": "E", "trap": "Ring of fire là tín hiệu dòng chảy Doppler thật không phải nhiễu xạ [bat_tu_khoa]"}], "decision": "Siêu âm TVS Doppler -> Vòng mạch tăng sinh trở kháng thấp RI < 0.45 -> Dấu hiệu Ring of fire -> Gợi ý Thai ngoài tử cung nhưng BẮT BUỘC phân biệt với Nang hoàng thể buồng trứng.", "explanation": "Theo Bài 10: Dấu hiệu vòng lửa (Ring of fire) trên siêu âm Doppler màu là hình ảnh vòng mạch máu giàu có trở kháng thấp (RI < 0.45) bao quanh khối thai ngoài tử cung. Tuy nhiên, Nang hoàng thể buồng trứng (Corpus luteum) cũng có hình ảnh Ring of fire tương tự, do đó bắt buộc phải phân biệt dựa vào vị trí khối so với nhu mô buồng trứng và beta-hCG."}, {"id": 81, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 30 tuổi, tiền sử bóc u xơ tử cung và nạo hút thai 2 lần. Trễ kinh 7 tuần, ra máu nâu ít. Siêu âm TVS: Buồng tử cung và kênh cổ tử cung rỗng hoàn toàn, khoang nội mạc liên tục. Túi thai d = 18 mm nằm hoàn toàn trong lớp cơ tử cung ở thành sau, được bao bọc bởi lớp cơ tử cung xung quanh, không liên thông với khoang nội mạc. beta-hCG = 3.800 mIU/mL.", "question": "Thẩm định chẩn đoán thể thai ngoài tử cung đặc biệt hiếm gặp trên ca bệnh này?", "options": ["Thai đoạn kẽ; túi thai nằm ở đoạn vòi tử cung đi trong cơ sừng tử cung liên thông với vòi tử cung.", "Thai tại sẹo mổ cũ; túi thai nằm ở đoạn dưới cổ tử cung tại vị trí sẹo mổ lấy thai cũ.", "Thai trong cơ tử cung; túi thai phát triển hoàn toàn trong lớp cơ tử cung và tách biệt với khoang nội mạc.", "Thai cổ tử cung; túi thai nằm trong kênh cổ tử cung làm cổ tử cung phồng to hình đồng hồ cát.", "Thai trong tử cung bình thường nhưng bị tử cung gập sau chèn ép làm méo mó hình dạng túi thai."], "correct": 2, "traps": [{"key": "A", "trap": "Thai đoạn kẽ nằm ở góc sừng tử cung liên thông vòi [phan_biet_hep]"}, {"key": "B", "trap": "Thai sẹo mổ cũ nằm ở thành trước đoạn dưới eo tử cung [phan_biet_hep]"}, {"key": "D", "trap": "Thai cổ tử cung nằm trong kênh cổ tử cung [phan_biet_hep]"}, {"key": "E", "trap": "Túi thai nằm trong cơ tử cung tách biệt nội mạc không phải thai trong tử cung [sai_tang]"}], "decision": "Tiền sử bóc u xơ TC + TVS buồng TC rỗng + Túi thai nằm hoàn toàn trong lớp cơ TC thành sau + Tách biệt khoang nội mạc -> Chẩn đoán Thai trong cơ tử cung (Intramural pregnancy).", "explanation": "Theo Bài 10: Thai trong cơ tử cung (Intramural pregnancy) là thể thai hiếm gặp nhất (< 1%), do phôi làm tổ vào khuyết sẹo cơ tử cung sau bóc u xơ hoặc nạo hút thai. Tiêu chuẩn siêu âm: Túi thai nằm hoàn toàn trong lớp cơ tử cung, tách biệt hoàn toàn với khoang nội mạc và kênh cổ tử cung."}, {"id": 82, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 33 tuổi, trễ kinh 2 tháng, ra máu nâu đen kéo dài 3 tuần kèm đau âm ỉ hạ vị và mót rượt đi ngoài. Khám phụ khoa: Tử cung bị đẩy lệch ra trước, túi cùng sau đè đau nhói, rãnh sau sờ thấy một khối đường kính khoảng 6 cm mật độ không đều, ranh giới không rõ, dính chặt vào trực tràng. beta-hCG = 450 mIU/mL. Siêu âm TVS: Khối phản âm hỗn hợp d = 58 mm ở túi cùng Douglas được bao bọc bởi quai ruột và mạc nối.", "question": "Thẩm định chẩn đoán thể thai ngoài tử cung diễn tiến kéo dài và nguyên tắc xử trí phẫu thuật?", "options": ["Thể thai trong ổ bụng nguyên phát; chỉ định theo dõi bảo tồn không can thiệp phẫu thuật chờ thai tự tiêu.", "Thể thai ngoài tử cung vỡ ngập máu cấp tính; bắt buộc phải phẫu thuật mổ mở cắt tử cung toàn phần cấp cứu. theo đúng quy", "Thể thai ngoài tử cung chưa vỡ; chỉ định tiêm Methotrexate toàn thân liều đơn 50 mg/m2 để tiêu khối thai.", "Thể thai cổ tử cung tiến triển; chỉ định chèn bóng Foley cầm máu trong kênh cổ tử cung ngay tại phòng khám.", "Thể bọc huyết tụ tiểu khung; phẫu thuật mổ gỡ dính cẩn thận lấy hết máu tụ và khối thai, tránh làm thủng trực tràng."], "correct": 4, "traps": [{"key": "A", "trap": "Khối bọc huyết tụ 6 cm dính trực tràng gây mót rượt không tự tiêu hoàn toàn [qua_bao_ton]"}, {"key": "B", "trap": "Bọc huyết tụ tiến triển kéo dài dính ruột không phải vỡ ngập máu cấp [phan_biet_hep]"}, {"key": "C", "trap": "Khối bọc huyết tụ 6 cm dính ruột beta-hCG thấp không có chỉ định tiêm MTX [qua_bao_ton]"}, {"key": "D", "trap": "Không phải thai cổ tử cung [sai_tang]"}], "decision": "Trễ kinh 2 tháng + Mót rượt đi ngoài + Khối túi cùng sau 6cm dính trực tràng + beta-hCG 450 mIU/mL -> Thể bọc huyết tụ tiểu khung -> Phẫu thuật gỡ dính lấy khối máu tụ cẩn thận tránh thủng trực tràng.", "explanation": "Theo Bài 10: Thể bọc huyết tụ tiểu khung xảy ra khi thai vòi trứng rỉ máu ít một, được mạc nối và quai ruột đến bao bọc lại thành khối tụ máu ở túi cùng Douglas. Khối huyết tụ chèn ép trực tràng gây triệu chứng mót rượt đi ngoài. Phẫu thuật cần gỡ dính cẩn thận bóc khối máu tụ, tránh tổn thương ruột."}, {"id": 83, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, trễ kinh 7 tuần, đau trằn hạ vị và bí tiểu cấp. Khám phụ khoa: Cổ tử cung bị đẩy ngửa ra trước sát xương mu, túi cùng sau phồng căng đè đau. Bác sĩ trực nghĩ đến Tử cung mang thai gập sau bị kẹt trong tiểu khung và tiến hành đẩy tử cung qua ngả âm đạo. Bệnh nhân đột ngột đau chói dữ dội và vỡ khối thai rỉ máu vào ổ bụng. Siêu âm lại: Khối thai ngoài tử cung d = 35 mm nằm ở vòi tử cung gập sau dính ở túi cùng Douglas.", "question": "Thẩm định sai lầm trong thao tác lâm sàng đẩy tử cung của bác sĩ trực?", "options": ["Thao tác đẩy tử cung đúng đắn nhưng do bác sĩ sử dụng lực đè quá nhẹ không giải phóng được cổ tử cung. theo đúng quy", "Chẩn đoán nhầm Thai ngoài tử cung túi cùng sau thành Tử cung gập sau kẹt tiểu khung, thao tác đẩy làm vỡ khối thai.", "Sai lầm vì đáng lẽ phải cho bệnh nhân uống thuốc co hồi tử cung Misoprostol để tử cung tự quay ra trước.", "Thao tác đúng đắn nhưng bắt buộc phải tiến hành thông tiểu bằng ống sắt cứng trước khi đẩy tử cung.", "Sai lầm vì bắt buộc phải tiến hành mổ mở cắt tử cung toàn phần ngay khi bệnh nhân bị bí tiểu cấp."], "correct": 1, "traps": [{"key": "A", "trap": "Thao tác đẩy khối thai ngoài tử cung dính túi cùng sau gây vỡ khối thai [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Misoprostol không làm quay tử cung gập sau [sai_tang]"}, {"key": "D", "trap": "Không dùng ống thông tiểu sắt cứng [qua_xam_lan]"}, {"key": "E", "trap": "Bí tiểu cấp do chèn ép không phải chỉ định cắt tử cung [qua_xam_lan]"}], "decision": "Trễ kinh 7w + Bí tiểu + Khối túi cùng sau đè đau -> Nhầm Thai ngoài vòi gập sau với Tử cung gập sau kẹt -> Thao tác đè đẩy âm đạo làm vỡ khối thai -> Sai sót chẩn đoán và thao tác.", "explanation": "Theo Bài 10: Khối thai ngoài tử cung nằm ở vòi tử cung gập sau dính túi cùng Douglas có thể chèn ép cổ tử cung gây bí tiểu cấp, dễ nhầm với Tử cung mang thai gập sau bị kẹt (Incarcerated gravid uterus). Thao tác nắn đẩy thô bạo qua âm đạo khi chưa siêu âm xác định sẽ làm vỡ khối thai nguy hiểm."}, {"id": 84, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 26 tuổi, thai chưa rõ vị trí (PUL) có beta-hCG = 480 mIU/mL, sinh hiệu ổn định, không đau bụng. Bác sĩ quyết định cho bệnh nhân theo dõi ngoại trú. Trước khi cho về, bác sĩ dặn bệnh nhân: Hẹn tái khám lại sau 48 giờ để xét nghiệm lại beta-hCG và siêu âm, đồng thời cảnh báo các dấu hiệu báo động phải vào viện ngay lập tức (đau bụng tăng, ra máu âm đạo nhiều, chóng mặt, vặt vã, ngất xỉu) bất kể ngày hay đêm.", "question": "Thẩm định tính đầy đủ và độ an toàn trong quy trình dặn dò bệnh nhân theo dõi ngoại trú này?", "options": ["Quy trình sai lầm vì chỉ cần hẹn bệnh nhân tái khám sau 2 tuần chứ không cần xét nghiệm lại beta-hCG sau 48 giờ.", "Quy trình sai lầm vì bệnh nhân PUL bắt buộc phải giữ lại nằm viện theo dõi nội trú 100% không được cho về ngoại trú.", "Quy trình thiếu sót vì đáng lẽ phải kê đơn thuốc kháng sinh phổ rộng cho bệnh nhân uống dự phòng nhiễm trùng tại nhà.", "Quy trình dặn dò hoàn toàn chuẩn xác và đạt chuẩn an toàn, giúp phát hiện sớm biến chứng vỡ khối thai kịp thời.", "Quy trình thiếu sót vì bắt buộc phải dặn bệnh nhân tập thể dục vận động mạnh để kích thích khối thai thoái triển."], "correct": 3, "traps": [{"key": "A", "trap": "Hẹn 2 tuần là quá muộn cho PUL [qua_bao_ton]"}, {"key": "B", "trap": "Bệnh nhân PUL beta-hCG < 1.000 không đau bụng hoàn toàn có thể theo dõi ngoại trú an toàn nếu được dặn dò kỹ [qua_xam_lan]"}, {"key": "C", "trap": "Không có chỉ định kháng sinh cho PUL [thieu_cau_phan]"}, {"key": "E", "trap": "Tập thể dục vận động mạnh làm tăng nguy cơ vỡ khối thai [bo_chong_chi_dinh]"}], "decision": "PUL + beta-hCG 480 + Không đau bụng -> Cho theo dõi ngoại trú -> Dặn hẹn 48h xét nghiệm lại hCG + Cảnh báo dấu hiệu báo động đau bụng/chóng mặt -> Quy trình an toàn đạt chuẩn.", "explanation": "Theo Bài 10: Theo dõi ngoại trú bệnh nhân PUL (beta-hCG < 1.000 mIU/mL, lâm sàng ổn định) là an toàn nếu tuân thủ quy trình: Hẹn xét nghiệm lại beta-hCG sau 48 giờ để đánh giá động học và tư vấn đầy đủ các dấu hiệu cảnh báo nhập viện khẩn cấp (đau bụng, ra máu nhiều, chóng mặt, ngất)."}, {"id": 85, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, trễ kinh 6 tuần, đau trằn nhẹ hạ vị. TVS: Buểm tử cung trống, khối thai d = 20 mm nằm ở loa vòi tử cung phải, có dấu hiệu rỉ máu qua loa vòi vào túi cùng Douglas d = 15 mm. beta-hCG Lần 1 = 850 mIU/mL, Lần 2 (sau 48h) = 520 mIU/mL (giảm 38%). Bệnh nhân được theo dõi bảo tồn, sau 2 tuần khối thai tự tống xuất hoàn toàn qua loa vòi vào ổ bụng và thoái triển tự nhiên.", "question": "Thẩm định diễn tiến sinh học của thể thai ngoài tử cung sẩy qua loa vòi (Tubal abortion) trên ca bệnh này?", "options": ["Khối thai làm tổ ở loa vòi bong ra tống xuất qua loa vòi vào ổ bụng và tự thoái triển hấp thu, diễn tiến thuận lợi.", "Khối thai vỡ ngập máu cấp tính bắt buộc phải mổ mở cắt tử cung toàn phần và hai phần phụ khẩn cấp. theo đúng quy trình hướng dẫn", "Diễn tiến bất thường do vi khuẩn Chlamydia gây đẩy khối thai từ buồng tử cung ngược ra loa vòi.", "Diễn tiến thất bại do bệnh nhân dùng thuốc cản quang chụp HSG làm đẩy khối thai ra ngoài ổ bụng.", "Biến chứng nguy hiểm bắt buộc phải tiêm Methotrexate đa liều 4 liều kết hợp Leucovorin giải độc."], "correct": 0, "traps": [{"key": "B", "trap": "Sẩy qua loa vòi rỉ máu nhẹ beta-hCG đang giảm không phải vỡ ngập máu cấp [phan_biet_hep]"}, {"key": "C", "trap": "Sẩy qua loa vòi là diễn tiến tự nhiên do thai bong khỏi niêm mạc loa vòi chứ không do Chlamydia đẩy [sai_tang]"}, {"key": "D", "trap": "Không liên quan đến chụp HSG [bat_tu_khoa]"}, {"key": "E", "trap": "beta-hCG đang giảm tự nhiên không có chỉ định tiêm MTX đa liều [qua_xam_lan]"}], "decision": "Thai loa vòi + beta-hCG 850 giảm 38% sau 48h + Không đau bụng -> Thai ngoài sẩy qua loa vòi (Tubal abortion) -> Khối thai bong tống xuất vào ổ bụng tự thoái triển -> Diễn tiến sinh học thuận lợi.", "explanation": "Theo Bài 10: Thai ngoài tử cung ở loa vòi (Tubal abortion) thường có diễn tiến sẩy qua loa vòi vào khoang phúc mạc. Nếu nồng độ beta-hCG thấp và đang giảm, khối thai sẩy vào ổ bụng sẽ tự thoái triển và được các đại thực bào hấp thu hoàn toàn mà không cần phẫu thuật."}, {"id": 86, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 38 tuổi, trễ kinh 2 tuần, đau quặn hạ vị kèm ra máu âm đạo nâu. Khám phụ khoa: Tử cung to bằng thai 10 tuần, thành sau có khối chắc d = 5 cm đè đau. Bác sĩ trực nghi ngờ Thai ngoài tử cung thể bọc huyết tụ dính thành sau tử cung. Bác sĩ tiến hành cho xét nghiệm beta-hCG huyết thanh = 0,2 mIU/mL (âm tính) và siêu âm TVS thấy khối u xơ thành sau tử cung hoại tử vô sinh trung tâm.", "question": "Thẩm định vai trò của xét nghiệm beta-hCG huyết thanh trong việc loại trừ chẩn đoán thai ngoài tử cung ở ca bệnh này?", "options": ["beta-hCG âm tính chứng tỏ bệnh nhân bị ung thư nguyên bào nuôi di căn sang u xơ tử cung.", "beta-hCG âm tính không có giá trị loại trừ vì khối thai ngoài tử cung hoại tử lâu ngày sẽ không tiết hCG nữa.", "beta-hCG âm tính loại trừ 100% thai ngoài tử cung hoạt động, giúp khẳng định chẩn đoán U xơ tử cung hoại tử.", "beta-hCG âm tính bắt buộc phải làm lại xét nghiệm sau 24 giờ mới được phép khẳng định loại trừ.", "beta-hCG âm tính do hiện tượng kháng thể dị ái trong máu làm triệt tiêu hoàn toàn tín hiệu thử nghiệm."], "correct": 2, "traps": [{"key": "A", "trap": "Không liên quan ung thư nguyên bào nuôi [sai_tang]"}, {"key": "B", "trap": "Mọi thai ngoài tử cung hoạt động hay hoại tử rỉ máu đều có hCG dương tính (> 5 mIU/mL) [bo_chong_chi_dinh]"}, {"key": "D", "trap": "beta-hCG 0.2 mIU/mL loại trừ ngay không cần chờ 24h [thieu_cau_phan]"}, {"key": "E", "trap": "Kháng thể dị ái gây dương tính giả chứ không gây âm tính hoàn toàn [phan_biet_hep]"}], "decision": "Trễ kinh + Khối thành sau TC 5cm đau + beta-hCG = 0.2 mIU/mL (Âm tính) -> Loại trừ 100% Thai ngoài tử cung -> Khẳng định U xơ tử cung hoại tử vô sinh.", "explanation": "Theo Bài 10: Định lượng beta-hCG huyết thanh có giá trị loại trừ 100% thai ngoài tử cung khi kết quả âm tính (< 5 mIU/mL). U xơ tử cung hoại tử vô sinh (Red degeneration) gây đau bụng và ra máu âm đạo có thể nhầm với thai ngoài tử cung, nhưng beta-hCG âm tính giúp khẳng định chẩn đoán u xơ."}, {"id": 87, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 32 tuổi, PARA 2002, đang mang vòng tránh thai IUD TCu-380A được 2 năm. Bệnh nhân chậm kinh 10 ngày, ra máu nâu rỉ rả, đau tức hố chậu trái. Siêu âm TVS: Vòng tránh thai IUD nằm đúng vị trí trong buồng tử cung, nhưng cạnh buồng trứng trái có khối thai ngoài tử cung d = 26 mm có tim thai (+). Bệnh nhân thắc mắc tại sao đã đặt vòng tránh thai chuẩn mà vẫn bị thai ngoài tử cung.", "question": "Thẩm định cơ chế dịch tễ học giải thích hiện tượng mang thai ngoài tử cung khi đang đặt dụng cụ tử cung (IUD)?", "options": ["Dụng cụ tử cung IUD làm ức chế hoàn toàn nồng độ Progesterone làm vòi tử cung bị liệt không co bóp được.", "Dụng cụ tử cung IUD chủ động đẩy phôi thai từ buồng tử cung ngược ra vòi tử cung để làm tổ ngoài tử cung. theo đúng quy trình hướng dẫn lâm sàng chuẩn", "Do vòng tránh thai TCu-380A tiết ra chất đồng làm tăng trưởng kích thước vòi tử cung thu hút phôi thai đến làm tổ.", "Do đặt vòng sai vị trí tụt xuống kênh cổ tử cung làm vi khuẩn xâm nhập gây thai ngoài tử cung vòi trứng.", "IUD ngừa thai trong tử cung rất hiệu quả nhưng không ngừa được thai ngoài tử cung, nên nếu thất bại ngừa thai thì tỷ lệ là thai ngoài sẽ tăng lên."], "correct": 4, "traps": [{"key": "A", "trap": "IUD TCu-380A không tiết hormone Progesterone [bat_tu_khoa]"}, {"key": "B", "trap": "IUD không đẩy phôi ngược ra vòi tử cung [sai_tang]"}, {"key": "C", "trap": "Chất đồng chống làm tổ trong tử cung chứ không thu hút phôi ra vòi [bat_tu_khoa]"}, {"key": "D", "trap": "Mặc dù IUD nằm đúng vị trí nhưng nếu thất bại ngừa thai thì xác suất là thai ngoài tăng lên [phan_biet_hep]"}], "decision": "Đang mang IUD TCu-380A + Thất bại ngừa thai -> IUD ngăn thai trong tử cung 99.5% nhưng không ngăn thai ngoài vòi trứng -> Nếu có thai khi đang đặt IUD thì tỷ lệ là Thai ngoài tử cung vọt lên 5-10%.", "explanation": "Theo Bài 10: Dụng cụ tử cung (IUD) ngăn ngừa thai trong tử cung rất hiệu quả (99,5%), nhưng hiệu quả ngăn ngừa thai ngoài tử cung thấp hơn. Do đó, nếu người phụ nữ mang IUD mà bị thất bại ngừa thai (có thai), thì xác suất thai đó là THAI NGOÀI TỬ CUNG tăng cao lên tới 5-10%."}, {"id": 88, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 29 tuổi, vừa được phẫu thuật nội soi xẻ vòi tử cung phải bảo tồn điều trị thai ngoài tử cung. Bệnh nhân lo lắng hỏi bác sĩ về nguy cơ bị thai ngoài tử cung tái phát trong những lần mang thai tiếp theo và khả năng mang thai trong tử cung thành công.", "question": "Thẩm định số liệu tư vấn y học chứng cứ chuẩn xác nhất về nguy cơ tái phát và tỷ lệ mang thai trong tử cung sau điều trị?", "options": ["Nguy cơ tái phát thai ngoài tử cung là 100% bắt buộc phải làm IVF triệt để cho tất cả các lần mang thai sau.", "Nguy cơ tái phát thai ngoài tử cung khoảng 10-15%, nhưng tỷ lệ mang thai trong tử cung thành công vẫn đạt 50-70%.", "Nguy cơ tái phát thai ngoài tử cung là 0% do vòi tử cung đã được phẫu thuật làm sạch hoàn toàn mô mạc rụng.", "Tỷ lệ mang thai trong tử cung giảm xuống còn 0% do hai buồng trứng bị suy giảm chức năng sau phẫu thuật nội soi.", "Nguy cơ tái phát vọt lên 80% nếu bệnh nhân không tiêm vắc xin phòng ngừa vi khuẩn Chlamydia ngay sau mổ."], "correct": 1, "traps": [{"key": "A", "trap": "Tái phát không phải 100%, không bắt buộc IVF cho mọi trường hợp [qua_xam_lan]"}, {"key": "C", "trap": "Không bao giờ có nguy cơ 0% tái phát [qua_bao_ton]"}, {"key": "D", "trap": "Mổ xẻ vòi không làm mất khả năng mang thai trong tử cung [sai_tang]"}, {"key": "E", "trap": "Không có vắc xin Chlamydia phòng tái phát thai ngoài [bat_tu_khoa]"}], "decision": "Mổ xẻ vòi tha độ thông vòi tử cung [phan_biet_hep]"}], "decision": "Chỉ định chụp HSG kiểm tra vòi tử cung -> Quy chuẩn thời điểm chụp: Ngày 2 đến Ngày 5 sau khi sạch kinh hoàn toàn -> Chụp Ngày 20 có nguy cơ chiếu tia X vào thai kỳ sớm -> Sai sót quy trình.", "explanation": "Theo Bài 10: Quy chuẩn chụp tử cung - vòi tử cung (HSG) bắt buộc thực hiện vào Ngày thứ 2 đến Ngày thứ 5 SAU KHI SẠCH KINH HOÀN TOÀN (giai đoạn tiền phóng noãn). Chụp ở pha hoàng thể (Ngày 20) nguy hiểm vì có thể chiếu tia X hoặc đẩy phôi thai sớm đang làm tổ vào vòi tử cung gây thai ngoài tử cung tái phát."}, {"id": 90, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 30 tuổi, tiền sử mổ cắt vòi tử cung phải do thai ngoài tử cung vỡ cách đây 2 năm. Lần này, sản phụ bị thai ngoài tử cung vòi tử cung trái vỡ nát, bác sĩ tiến hành mổ cắt nốt vòi tử cung trái. Sau mổ, sản phụ tha thiết muốn sinh con và hỏi bác sĩ về phương pháp hỗ trợ sinh sản duy nhất giúp sản phụ mang thai.", "question": "Thẩm định chỉ định phương pháp hỗ trợ sinh sản chuẩn xác duy nhất cho sản phụ sau khi đã cắt cả hai vòi tử cung?", "options": ["Chỉ định Thụ tinh trong ống nghiệm IVF ; phôi được chuyển trực tiếp vào buồng tử cung không cần qua vòi tử cung.", "Chỉ định Bơm tinh trùng vào buồng tử cung IUI ; tinh trùng sẽ tự bơi qua cơ tử cung để thụ tinh với trứng.", "Chỉ định phẫu thuật vi phẫu nối lại vòi tử cung bằng kỹ thuật mổ nội soi robot hiện đại.", "Chỉ định cho uống thuốc kích thích rụng trứng Clomiphene citrate để trứng tự rụng vào buồng tử cung.", "Khẳng định sản phụ vĩnh viễn mất khả năng mang thai 100% kể cả làm các kỹ thuật hỗ trợ sinh sản."], "correct": 0, "traps": [{"key": "B", "trap": "IUI cần ít nhất 1 vòi tử cung thông để tinh trùng gặp trứng [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Cắt bỏ 2 vòi tử cung hoàn toàn không còn đoạn vòi để nối vi phẫu [qua_xam_lan]"}, {"key": "D", "trap": "Kích trứng IUI không có tác dụng khi đã mất 2 vòi [qua_bao_ton]"}, {"key": "E", "trap": "Tử cung và buồng trứng còn nguyên vẹn làm IVF thành công cao [sai_tang]"}], "decision": "Cắt cả 2 vòi tử cung -> Mất hoàn toàn đường dẫn tinh trùng gặp trứng -> Bắt buộc làm Thụ tinh trong ống nghiệm (IVF) -> Chuyển phôi trực tiếp vào buồng tử cung.", "explanation": "Theo Bài 10: Khi sản phụ đã cắt bỏ cả hai vòi tử cung (do thai ngoài tử cung vỡ cả 2 bên), đường dẫn tự nhiên cho trứng và tinh trùng gặp nhau bị mất hoàn toàn. Chỉ định bắt buộc duy nhất để mang thai là Thụ tinh trong ống nghiệm (IVF), trong đó phôi tạo ra ngoài cơ thể sẽ được chuyển trực tiếp vào buồng tử cung."}, {"id": 91, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Phụ nữ 28 tuổi, tiền sử hút thuốc lá 1 bao/ngày (20 điếu/ngày) liên tục 5 năm qua. Bệnh nhân vừa được phẫu thuật mổ nội soi cắt vòi tử cung do thai ngoài tử cung vỡ. Bệnh nhân hỏi bác sĩ tại sao hút thuốc lá lại liên quan trực tiếp đến việc bị thai ngoài tử cung.", "question": "Thẩm định cơ chế sinh lý bệnh học giải thích tác hại của Nikotin trong thuốc lá làm tăng nguy cơ thai ngoài tử cung?", "options": ["Nikotin làm phá hủy toàn bộ niêm mạc nội mạc buồng tử cung làm buồng tử cung bị dính hoàn toàn.", "Nikotin làm biến đổi cấu trúc DNA của tinh trùng làm phôi thai tự bò ngược từ buồng tử cung ra vòi tử cung. theo đúng quy trình hướng dẫn", "Nikotin làm giảm nhu động co bóp và tê liệt hoạt động tế bào lông chuyển của vòi tử cung, làm phôi di chuyển chậm bị kẹt lại.", "Nikotin làm tăng nồng độ hCG vọt cao gấp 10 lần kích thích phôi thai bám chặt vào niêm mạc vòi tử cung.", "Nikotin làm suy giảm hoàn toàn chức năng rụng trứng của hai buồng trứng gây phóng noãn bất thường."], "correct": 2, "traps": [{"key": "A", "trap": "Nikotin không gây dính buồng tử cung hoàn toàn [bat_tu_khoa]"}, {"key": "B", "trap": "Nikotin tác động lên lông chuyển vòi tử cung mẹ chứ không làm phôi tự bò [sai_tang]"}, {"key": "D", "trap": "Nikotin không tăng hCG gấp 10 lần [sai_tang]"}, {"key": "E", "trap": "Không liên quan đến mất hoàn toàn rụng trứng [bat_tu_khoa]"}], "decision": "Hút thuốc lá > 20 điếu/ngày -> Tăng nguy cơ thai ngoài 2.5 lần -> Cơ chế: Nikotin làm giảm nhu động vòi tử cung & tê liệt lông chuyển -> Phôi di chuyển chậm kẹt lại vòi tử cung.", "explanation": "Theo Bài 10: Hút thuốc lá (> 20 điếu/ngày) làm tăng nguy cơ thai ngoài tử cung gấp 2,5 - 4 lần. Cơ chế: Nikotin tác động trực tiếp làm giảm trương lực co bóp cơ trơn vòi tử cung và làm liệt hoạt động đập của tế bào có lông chuyển (ciliary action) niêm mạc vòi, làm phôi di chuyển chậm và làm tổ ngay tại vòi."}, {"id": 92, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 26 tuổi, mổ nội soi do thai ngoài tử cung vòi trứng trái chưa vỡ. Trong mổ quan sát thấy hai vòi tử cung bị viêm xơ dính gập góc, có nhiều dải dính dạng dây đàn Violin (Fitz-Hugh-Curtis sign) giữa gan và thành bụng. Kết quả xét nghiệm PCR dịch cổ tử cung dương tính với Chlamydia trachomatis.", "question": "Thẩm định cơ chế bệnh sinh của vi khuẩn Chlamydia trachomatis dẫn đến thai ngoài tử cung?", "options": ["Chlamydia làm biến đổi nhóm máu của thai nhi gây ra phản ứng thải ghép tự nhiên của cơ thể mẹ.", "Chlamydia tiết ra độc tố phân hủy niêm mạc buồng tử cung làm phôi không thể bám vào nội mạc tử cung. theo đúng quy trình hướng dẫn", "Chlamydia làm vỡ các nang noãn buồng trứng sớm làm phôi thụ tinh ngay trong buồng trứng.", "Chlamydia làm kích thích tăng sinh nồng độ Progesterone làm vòi tử cung co bóp quá nhanh đẩy phôi ra ngoài.", "Chlamydia gây viêm tiềm tàng làm mất lông chuyển và xơ hóa gập góc hẹp lòng vòi tử cung, cản trở phôi di chuyển về buồng."], "correct": 4, "traps": [{"key": "A", "trap": "Không liên quan biến đổi nhóm máu [bat_tu_khoa]"}, {"key": "B", "trap": "Chlamydia gây tổn thương niêm mạc vòi tử cung là chính [phan_biet_hep]"}, {"key": "C", "trap": "Không gây vỡ nang noãn buồng trứng sớm [sai_tang]"}, {"key": "D", "trap": "Chlamydia gây xơ dính làm vòi co bóp kém chứ không co bóp quá nhanh [sai_tang]"}], "decision": "PCR Chlamydia trachomatis (+) + Dính Fitz-Hugh-Curtis -> Viêm vùng chậu PID tiềm tàng -> Mất tế bào lông chuyển & xơ hóa gập góc vòi tử cung -> Phôi kẹt lại gây Thai ngoài tử cung.", "explanation": "Theo Bài 10: Chlamydia trachomatis là tác nhân hàng đầu gây viêm vùng chậu (PID) tiềm tàng (chiếm 30-50%). Vi khuẩn gây tổn thương lớp nội mạc vòi tử cung, rụng tế bào có lông chuyển và tạo các dải xơ dính gập góc làm hẹp lòng vòi tử cung, cản trở phôi di chuyển về buồng tử cung."}, {"id": 93, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bác sĩ thực hiện siêu âm ngả âm đạo khảo sát thai sớm 6 tuần cho sản phụ. Để tìm tim thai, bác sĩ bật chế độ Doppler xung (Spectral Doppler) liên tục trong 8 phút rọi trực tiếp vào khối phôi thai nhỏ d = 4 mm để nghe âm thanh tim thai và đo vận tốc dòng chảy.", "question": "Thẩm định sai sót quy chuẩn an toàn siêu âm thai kỳ sớm (nguyên tắc ALARA) của bác sĩ?", "options": ["Thao tác hoàn toàn chuẩn xác vì siêu âm Doppler xung 100% an toàn tuyệt đối không gây bất kỳ tác động nhiệt nào. theo đúng quy trình hướng dẫn", "Lạm dụng Doppler xung kéo dài ở thai dưới 10 tuần gây nhiệt năng và hiệu ứng sóng cơ học có hại cho phôi thai đang phát triển.", "Sai sót vì đáng lẽ phải chuyển sang siêu âm 3D/4D màu để khảo sát tim thai chứ không dùng Doppler xung.", "Thao tác đúng đắn nhưng phải dặn sản phụ uống thuốc chống bức xạ sau khi kết thúc buổi siêu âm.", "Sai sót vì chỉ được phép bật siêu âm Doppler khi tuổi thai đã đạt từ 28 tuần trở lên."], "correct": 1, "traps": [{"key": "A", "trap": "Doppler xung có chỉ số nhiệt Thermal Index cao có thể gây hại phôi thai < 10w [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Sử dụng B-mode hoặc M-mode đếm nhịp tim thai chứ không cần 3D/4D [guideline_cu]"}, {"key": "D", "trap": "Không có thuốc chống bức xạ siêu âm [bat_tu_khoa]"}, {"key": "E", "trap": "Doppler dùng từ 10-12w an toàn [guideline_cu]"}], "decision": "Thai 6 tuần + Bật Doppler xung 8 phút rọi phôi -> Vi phạm nguyên tắc ALARA -> Doppler xung sinh nhiệt năng cao nguy hại phôi < 10w -> Bắt buộc dùng M-mode đếm nhịp tim thai.", "explanation": "Theo Bài 10, Bài 46 và ISUOG: Tuân thủ nguyên tắc ALARA (As Low As Reasonably Achievable). Ở thai < 10 tuần, CẤM LẠM DỤNG Doppler xung kéo dài vì chỉ số nhiệt (Thermal Index - TI) cao có thể gây tổn thương mô phôi thai đang phân chia. Khảo sát tim thai quý 1 ưu tiên dùng M-mode hoặc B-mode."}, {"id": 94, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 28 tuổi, được chẩn đoán Sẩy thai không hoàn toàn và được tiến hành hút chân không buồng tử cung. Mẫu mô nạo được gửi làm xét nghiệm giải phẫu bệnh lý. Kết quả mô bệnh học trả về: Quan sát thấy các nhung mao gai nhau (Chorionic villi) và hợp bào nuôi cắm trong lớp màng rụng nội mạc tử cung.", "question": "Thẩm định giá trị chẩn đoán của sự xuất hiện nhung mao gai nhau trên giải phẫu bệnh?", "options": ["Không có giá trị chẩn đoán vì nhung mao gai nhau xuất hiện trong mọi trường hợp thai ngoài tử cung. theo đúng quy", "Khẳng định bệnh nhân bị thai ngoài tử cung vòi trứng đã vỡ tống xuất mô vào buồng tử cung.", "Khẳng định bệnh nhân bị bệnh u nguyên bào nuôi ác tính di căn vào buồng tử cung.", "Khẳng định 100% bệnh nhân đã mang thai trong buồng tử cung, loại trừ chẩn đoán thai ngoài tử cung đơn thuần.", "Khẳng định bệnh nhân bị dị dạng tử cung hai sừng kèm theo thai ngoài tử cung."], "correct": 3, "traps": [{"key": "A", "trap": "Thai ngoài tử cung đơn thuần mô nạo buồng tử cung CHỈ CÓ màng rụng Arias-Stella chứ KHÔNG CÓ gai nhau [bo_chong_chi_dinh]"}, {"key": "B", "trap": "Nhung mao gai nhau Chorionic villi trong mô nạo chứng tỏ thai làm tổ trong tử cung [phan_biet_hep]"}, {"key": "C", "trap": "Nhung mao gai nhau lành tính không phải u nguyên bào nuôi [sai_tang]"}, {"key": "E", "trap": "Không liên quan tử cung hai sừng [bat_tu_khoa]"}], "decision": "Mô nạo buồng tử cung -> Giải phẫu bệnh thấy Nhung mao gai nhau (Chorionic villi) -> Khẳng định Thai trong buồng tử cung -> Loại trừ Thai ngoài tử cung đơn thuần (chỉ có màng rụng Arias-Stella).", "explanation": "Theo Bài 10 và Bài 08: Tìm thấy nhung mao gai nhau (Chorionic villi) trong mô nạo buồng tử cung là tiêu chuẩn vàng khẳng định đã có thai trong buồng tử cung. Trong thai ngoài tử cung đơn thuần, niêm mạc tử cung chỉ có phản ứng màng rụng (Arias-Stella) mà tuyệt đối không bao giờ có nhung mao gai nhau."}, {"id": 95, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 29 tuổi, mổ nội soi cắt vòi tử cung phải do thai ngoài tử cung. Bệnh nhân tái khám định kỳ mỗi tuần xét nghiệm beta-hCG: Trước mổ = 4.500 mIU/mL; Tuần 1 = 380 mIU/mL; Tuần 2 = 45 mIU/mL; Tuần 3 = 2,1 mIU/mL (Âm tính < 5 mIU/mL). Bệnh nhân hoàn toàn không đau bụng, hết ra máu âm đạo.", "question": "Thẩm định tiêu chuẩn khỏi bệnh hoàn toàn dựa trên động học sụt giảm beta-hCG huyết thanh?", "options": ["Đạt tiêu chuẩn khỏi bệnh hoàn toàn khi beta-hCG sụt giảm liên tục trở về mức âm tính dưới 5 mIU/mL.", "Chưa khỏi bệnh vì bắt buộc beta-hCG phải đạt mức 0,00 mIU/mL tuyệt đối mới công nhận âm tính.", "Theo dõi thất bại vì beta-hCG giảm quá chậm phải mất tới 3 tuần mới về âm tính hoàn toàn. theo đúng quy", "Bắt buộc phải tiến hành chụp cộng hưởng từ MRI tiểu khung để khẳng định lại tiêu chuẩn khỏi bệnh.", "Bắt buộc phải tiêm ngừa 01 liều Methotrexate toàn thân để dự phòng tái phát sau khi beta-hCG âm tính."], "correct": 0, "traps": [{"key": "B", "trap": "Ngưỡng âm tính chuẩn phòng xét nghiệm là < 5 mIU/mL [guideline_cu]"}, {"key": "C", "trap": "Thoái triển hCG về âm tính sau mổ/MTX thường mất 2-4 tuần là tốc độ sinh lý bình thường [phan_biet_hep]"}, {"key": "D", "trap": "Không cần chụp MRI khi hCG đã âm tính [qua_xam_lan]"}, {"key": "E", "trap": "Không tiêm MTX dự phòng khi hCG đã âm tính [qua_xam_lan]"}], "decision": "Mổ thai ngoài -> beta-hCG giảm liên tục 4.500 -> 380 -> 45 -> 2.1 mIU/mL (< 5 mIU/mL) sau 3 tuần -> Đạt tiêu chuẩn Khỏi bệnh hoàn toàn -> Không cần can thiệp thêm.", "explanation": "Theo Bài 10: Tiêu chuẩn công nhận khỏi bệnh hoàn toàn sau điều trị thai ngoài tử cung (bằng phẫu thuật hay Methotrexate) là nồng độ beta-hCG huyết thanh sụt giảm liên tục trở về mức âm tính (< 5 mIU/mL). Thời gian thoái triển sinh lý thường kéo dài từ 2 đến 4 tuần."}, {"id": 96, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 27 tuổi, tiền sử tử cung hai sừng (Bicornuate uterus). Trễ kinh 8 tuần, đau hạ vị lệch trái. Siêu âm TVS: Sừng tử cung bên phải rỗng có màng rụng dày 12 mm; Sừng tử cung bên trái phồng to chứa túi thai d = 26 mm có phôi thai và tim thai (+), được bao bọc bởi lớp cơ tử cung liên tục dày 8 mm xung quanh túi thai. beta-hCG = 12.000 mIU/mL.", "question": "Thẩm định chẩn đoán phân biệt vị trí thai làm tổ giữa sừng tử cung dị dạng và thai đoạn kẽ?", "options": ["Thai cổ tử cung; túi thai nằm hoàn toàn trong kênh cổ tử cung gây phồng cổ tử cung hình số 8.", "Thai đoạn kẽ vòi tử cung trái; túi thai nằm lệch ra ngoài cơ sừng tử cung và lớp cơ bao quanh rất mỏng dưới 2 mm. theo đúng quy trình hướng", "Thai làm tổ ở sừng tử cung dị dạng trái; túi thai nằm trong buồng sừng trái và được cơ tử cung bao bọc hoàn toàn dày trên 5 mm.", "Thai sẹo mổ cũ; túi thai làm tổ ở đoạn dưới eo tử cung phía trước sát bàng quang.", "Thai trong ổ bụng thứ phát; túi thai nằm ngoài tử cung chen giữa các quai ruột non."], "correct": 2, "traps": [{"key": "A", "trap": "Không phải thai cổ tử cung [sai_tang]"}, {"key": "B", "trap": "Thai đoạn kẽ nằm ngoài sừng TC và lớp cơ bao quanh mỏng < 2 mm [phan_biet_hep]"}, {"key": "D", "trap": "Không phải thai sẹo mổ cũ [sai_tang]"}, {"key": "E", "trap": "Túi thai nằm trong sừng tử cung có cơ bao bọc không phải thai ổ bụng [sai_tang]"}], "decision": "Tử cung hai sừng + Sừng phải rỗng màng rụng + Sừng trái chứa túi thai + Cơ tử cung bao quanh dày 8mm (> 5mm) -> Chẩn đoán Thai trong sừng tử cung dị dạng (không phải thai đoạn kẽ).", "explanation": "Theo Bài 10 và Bài 46: Phân biệt thai trong sừng tử cung dị dạng (Bicornuate uterus) với thai đoạn kẽ (Interstitial pregnancy) dựa vào lớp cơ tử cung bao quanh túi thai trên siêu âm TVS: Thai trong sừng tử cung được bao bọc bởi lớp cơ tử cung liên tục dày >= 5 mm; còn thai đoạn kẽ nằm lệch ra ngoài và lớp cơ bao quanh rất mỏng < 2 mm."}, {"id": 97, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 32 tuổi, trễ kinh 2 tuần, đến khám tại phòng khám tư do ra máu rỉ rả. Bác sĩ siêu âm không thấy túi thai trong tử cung, xét nghiệm beta-hCG = 1.800 mIU/mL. Bác sĩ kết luận sẩy thai tự nhiên hoàn toàn và cho sản phụ về nhà không dặn dò tái khám. 3 ngày sau, sản phụ đột ngột đau bụng dữ dội, ngất xỉu tại nhà và tử vong trên đường cấp cứu do thai ngoài tử cung vỡ ngập máu ổ bụng.", "question": "Thẩm định bài học an toàn hệ thống quan trọng nhất rút ra từ ca tử vong mẹ này?", "options": ["Bắt buộc phải cấm tất cả các phòng khám tư nhân thực hiện khám và siêu âm chẩn đoán thai kỳ sớm.", "Mọi bệnh nhân trễ kinh ra máu âm đạo đều bắt buộc phải mổ mở thám sát ngay lập tức để phòng ngừa tử vong. theo đúng quy trình hướng dẫn lâm sàng", "Nguyên nhân tử vong hoàn toàn do sản phụ không chịu uống thuốc co hồi tử cung Misoprostol đúng liều lượng.", "Bác sĩ phòng khám hoàn toàn không có lỗi vì thai ngoài tử cung vỡ tại nhà là rủi ro bất khả kháng 100%.", "Mọi trường hợp nghi ngờ sẩy thai khi buồng tử cung trống bắt buộc phải loại trừ thai ngoài tử cung bằng beta-hCG 48h và dặn dò dấu hiệu báo động."], "correct": 4, "traps": [{"key": "A", "trap": "Không thể cấm phòng khám tư khám thai sớm [bat_tu_khoa]"}, {"key": "B", "trap": "Mổ mở thám sát 100% bệnh nhân trễ kinh là can thiệp thô bạo lãng phí [qua_xam_lan]"}, {"key": "C", "trap": "Misoprostol chống chỉ định khi nghi thai ngoài [bo_chong_chi_dinh]"}, {"key": "D", "trap": "Bác sĩ có lỗi sai sót quy trình khi phán sẩy thai hoàn toàn mà chưa theo dõi beta-hCG 48h [guideline_cu]"}], "decision": "Trễ kinh + beta-hCG 1.800 + TVS buồng TC trống -> Bác sĩ kết luận sẩy thai hoàn toàn cho về -> Thai ngoài vỡ tử vong tại nhà -> Sai sót quy trình nghiêm trọng -> Bài học: Bắt buộc theo dõi beta-hCG 48h & dặn dấu hiệu báo động.", "explanation": "Theo Bài 10: Vụ việc tử vong mẹ do tha     // QUẢN LÝ TIẾN ĐỘ LOCAL STORAGE ĐỘC LẬP THEO TÊN FILE
    const PAGE_ID = window.location.pathname.split('/').pop().replace('.html', '') || 'bai-10-100ca';
    const STORAGE_KEY = `QUIZ_STATE_${PAGE_ID}_V100_FIXED`;
    
    let state = {
      answers: {},    // { qId: selectedOptionIndex }
      bookmarks: [],  // [ qId ]
      notes: {},      // { qId: text }
      currentIndex: 0,
      filter: 'all'
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.error("Lỗi đọc LocalStorage", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Lỗi ghi LocalStorage", e);
      }
    }

    // LẤY DANH SÁCH CÂU HỎI THEO BỘ LỌC ĐANG CHỌN
    function getFilteredList() {
      return QUESTIONS.map((q, idx) => ({ q, idx })).filter(({ q }) => {
        if (state.filter === 'starred') return state.bookmarks.includes(q.id);
        if (state.filter === 'wrong') {
          const ans = state.answers[q.id];
          return (ans !== undefined && ans !== q.correct);
        }
        if (state.filter === 'part1') return q.part === 1;
        if (state.filter === 'part2') return q.part === 2;
        return true; // 'all'
      });
    }

    // KHỞI TẠO VÀ RENDER GIAO DIỆN
    function initApp() {
      loadState();
      // Đảm bảo nút filter đang lưu được active
      applyFilterUI();
      // Kiểm tra xem currentIndex có nằm trong filter không
      ensureCurrentIndexInFilter();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function applyFilterUI() {
      ['all', 'starred', 'wrong', 'part1', 'part2'].forEach(item => {
        const btn = document.getElementById(`flt-${item}`);
        if (!btn) return;
        if (item === state.filter) {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-xs font-semibold";
        } else {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold";
        }
      });
    }

    function ensureCurrentIndexInFilter() {
      const filtered = getFilteredList();
      if (filtered.length === 0) return;
      const exists = filtered.some(item => item.idx === state.currentIndex);
      if (!exists) {
        state.currentIndex = filtered[0].idx;
      }
    }

    function setFilter(flt) {
      state.filter = flt;
      applyFilterUI();
      
      const filtered = getFilteredList();
      if (filtered.length === 0) {
        if (flt === 'starred') alert('Bạn chưa đánh dấu (★) ca lâm sàng nào!');
        else if (flt === 'wrong') alert('Bạn chưa có câu nào làm sai!');
        state.filter = 'all';
        applyFilterUI();
        state.currentIndex = 0;
      } else {
        // Tự động nhảy đến câu đầu tiên của bộ lọc đó
        state.currentIndex = filtered[0].idx;
      }
      
      saveState();
      renderCurrentQuestion();
      renderGridCells();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentQuestion() {
      const filtered = getFilteredList();
      const currentFilteredPos = filtered.findIndex(item => item.idx === state.currentIndex);
      
      const q = QUESTIONS[state.currentIndex];
      if (!q) return;

      // Header info
      document.getElementById("case-title").textContent = `Ca ${q.id < 10 ? '0' + q.id : q.id}`;
      document.getElementById("case-bloom").textContent = q.bloom;
      document.getElementById("case-stem").textContent = q.stem;
      document.getElementById("case-question").textContent = q.question;
      
      // Badge hiển thị vị trí trong bộ lọc
      const badgeText = (state.filter === 'all') ? `Ca ${q.id}/100` : `Ca ${q.id} (${currentFilteredPos + 1}/${filtered.length})`;
      document.getElementById("current-badge").textContent = badgeText;
      document.getElementById("footer-index").textContent = (state.filter === 'all') ? `${q.id} / 100` : `${currentFilteredPos + 1} / ${filtered.length}`;

      // Cập nhật Bookmark star
      const isStarred = state.bookmarks.includes(q.id);
      const starIcon = document.getElementById("star-icon");
      const starBtn = document.getElementById("star-btn");
      if (isStarred) {
        starIcon.classList.add("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.add("border-amber-300", "bg-amber-50");
      } else {
        starIcon.classList.remove("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.remove("border-amber-300", "bg-amber-50");
      }

      // Render 5 Options A-E
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      const letters = ["A", "B", "C", "D", "E"];
      const userAnswer = state.answers[q.id];
      const isAnswered = (userAnswer !== undefined);

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = `w-full text-left p-3 rounded-xl border text-xs font-medium flex items-start gap-2.5 transition-all active:scale-[0.99] min-h-[48px] `;
        
        let borderClass = "border-slate-200 bg-white hover:border-teal-300 hover:bg-teal-50/30 text-slate-700";
        let letterBadge = "bg-slate-100 text-slate-700 border-slate-200";

        if (isAnswered) {
          if (idx === q.correct) {
            borderClass = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-semibold ring-1 ring-emerald-500";
            letterBadge = "bg-emerald-600 text-white border-emerald-600";
          } else if (idx === userAnswer) {
            borderClass = "border-rose-500 bg-rose-50/80 text-rose-900 font-semibold ring-1 ring-rose-500";
            letterBadge = "bg-rose-600 text-white border-rose-600";
          } else {
            borderClass = "border-slate-200 bg-slate-50/50 text-slate-400 opacity-60";
            letterBadge = "bg-slate-100 text-slate-400 border-slate-200";
          }
        }

        btn.className += borderClass;
        btn.onclick = () => selectOption(idx);
        btn.disabled = isAnswered;

        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md border text-[11px] font-bold shrink-0 mt-0.5 ${letterBadge}">
            ${letters[idx]}
          </span>
          <span class="leading-relaxed flex-1">${optText}</span>
        `;
        container.appendChild(btn);
      });

      // Bung khối giải thích nếu đã trả lời
      const expBox = document.getElementById("explanation-box");
      if (isAnswered) {
        expBox.classList.remove("hidden");
        document.getElementById("exp-text").textContent = q.explanation;
        document.getElementById("decision-text").textContent = q.decision;

        // Render traps
        const trapsList = document.getElementById("traps-list");
        trapsList.innerHTML = "";
        q.traps.forEach(t => {
          const item = document.createElement("div");
          item.className = "p-2 rounded bg-slate-50 border border-slate-100 flex items-start gap-1.5 text-slate-600";
          item.innerHTML = `<span class="font-bold text-rose-600 shrink-0">[Lựa chọn ${t.key}]:</span> <span>${t.trap}</span>`;
          trapsList.appendChild(item);
        });

        // Điền ghi chú cá nhân
        document.getElementById("personal-note").value = state.notes[q.id] || "";
      } else {
        expBox.classList.add("hidden");
      }

      // Nút Trước / Tiếp theo danh sách lọc
      document.getElementById("prev-btn").disabled = (currentFilteredPos <= 0);
      document.getElementById("next-btn").disabled = (currentFilteredPos >= filtered.length - 1);
    }

    function selectOption(idx) {
      const q = QUESTIONS[state.currentIndex];
      if (state.answers[q.id] !== undefined) return;

      state.answers[q.id] = idx;
      saveState();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function navigate(step) {
      const filtered = getFilteredList();
      const currentPos = filtered.findIndex(item => item.idx === state.currentIndex);
      const newPos = currentPos + step;
      
      if (newPos >= 0 && newPos < filtered.length) {
        state.currentIndex = filtered[newPos].idx;
        saveState();
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      state.currentIndex = idx;
      saveState();
      renderCurrentQuestion();
      toggleGridModal(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleBookmark() {
      const q = QUESTIONS[state.currentIndex];
      const pos = state.bookmarks.indexOf(q.id);
      if (pos > -1) {
        state.bookmarks.splice(pos, 1);
      } else {
        state.bookmarks.push(q.id);
      }
      saveState();
      renderCurrentQuestion();
      renderGridCells();
    }

    function saveCurrentNote() {
      const q = QUESTIONS[state.currentIndex];
      const val = document.getElementById("personal-note").value;
      state.notes[q.id] = val;
      saveState();
    }

    function updateProgress() {
      let correct = 0;
      let wrong = 0;
      Object.entries(state.answers).forEach(([qId, ans]) => {
        const q = QUESTIONS.find(item => item.id === parseInt(qId));
        if (q) {
          if (ans === q.correct) correct++;
          else wrong++;
        }
      });
      const total = QUESTIONS.length;
      document.getElementById("progress-correct").style.width = `${(correct / total) * 100}%`;
      document.getElementById("progress-wrong").style.width = `${(wrong / total) * 100}%`;
    }

    function renderGridCells() {
      const grid = document.getElementById("grid-cells");
      grid.innerHTML = "";

      const filtered = getFilteredList();

      QUESTIONS.forEach((q, idx) => {
        // Chỉ hiển thị các ô tương ứng với bộ lọc đang chọn
        const isIncluded = filtered.some(item => item.idx === idx);
        if (!isIncluded) return;

        const cell = document.createElement("button");
        cell.className = `h-8 rounded text-[11px] font-bold flex flex-col items-center justify-center relative transition-all border `;
        
        const ans = state.answers[q.id];
        const isCurrent = (idx === state.currentIndex);

        if (ans !== undefined) {
          if (ans === q.correct) {
            cell.className += "bg-emerald-500 text-white border-emerald-600";
          } else {
            cell.className += "bg-rose-500 text-white border-rose-600";
          }
        } else {
          cell.className += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
        }

        if (isCurrent) {
          cell.className += " ring-2 ring-teal-600 ring-offset-1";
        }

        cell.textContent = q.id;

        // Dấu sao nếu bookmark
        if (state.bookmarks.includes(q.id)) {
          const starBadge = document.createElement("span");
          starBadge.className = "absolute -top-1 -right-1 text-[8px] text-amber-400 font-extrabold";
          starBadge.textContent = "★";
          cell.appendChild(starBadge);
        }

        cell.onclick = () => jumpToQuestion(idx);
        grid.appendChild(cell);
      });
    }

    function toggleGridModal(show) {
      const modal = document.getElementById("grid-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderGridCells();
      } else {
        modal.classList.add("hidden");
      }
    }

    // Hỗ trợ vuốt tay chuyển câu trên Mobile (Touch Swipe)
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) navigate(1);  // Vuốt sang trái -> Câu tiếp theo
        else navigate(-1);          // Vuốt sang phải -> Câu trước
      }
    }

    // Khởi chạy khi tải trang
    window.addEventListener("DOMContentLoaded", initApp);

  </script>
</body>
</html>
