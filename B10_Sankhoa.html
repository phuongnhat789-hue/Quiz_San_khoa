i soi cấp cứu tháo xoắn / cắt u nang buồng trứng."}, {"id": 35, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 30 tuổi, chẩn đoán thai ngoài tử cung vòi tử cung trái chưa vỡ. Sinh hiệu ổn định. Định lượng beta-hCG = 4.200 mIU/mL. Bác sĩ chỉ định điều trị nội khoa bằng phác đồ Methotrexate (MTX) đa liều (Multi-dose regimen). Bệnh nhân được tiêm bắp MTX liều 1.0 mg/kg vào các Ngày 1, 3, 5, 7. Bác sĩ kê thêm thuốc Leucovorin (Folinic acid) liều 0.1 mg/kg tiêm bắp vào các Ngày 2, 4, 6, 8.", "question": "Vai trò dược lý học cốt lõi của việc bổ sung Leucovorin (Folinic acid) vào các ngày xen kẽ trong phác đồ MTX đa liều là gì?", "options": ["Bảo vệ tế bào lành của cơ thể mẹ, giải độc và giảm thiểu tác dụng phụ độc tủy xương niêm mạc do Methotrexate gây ra", "Tăng cường khả năng tiêu diệt khối thai của Methotrexate gấp mười lần", "Ức chế sự rụng trứng của buồng trứng bên đối diện trong thai kỳ", "Kích thích tử cung co bóp tống xuất khối thai ra ngoài qua đường âm đạo theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thay thế hoàn toàn vai trò của hormon Progesterone nội tiết hoàng thể"], "correct": 0, "traps": [{"key": "B", "trap": "[phan_biet_hep] Leucovorin là chất giải độc chống lại MTX cho tế bào lành, không làm tăng độc tính diệt thai"}, {"key": "C", "trap": "[bat_tu_khoa] Leucovorin không ức chế rụng trứng buồng trứng"}, {"key": "D", "trap": "[sai_tang] Leucovorin không tác động lên cơ tử cung"}, {"key": "E", "trap": "[nham_dan_so] Leucovorin không phải hormon sinh dục thay thế Progesterone"}], "decision": "Phác đồ MTX đa liều (N1,3,5,7) + Tiêm Leucovorin Folinic acid xen kẽ (N2,4,6,8) -> Dược lý Leucovorin -> Giải độc tế bào lành, giảm độc tính tủy xương và niêm mạc đường tiêu hóa cho người mẹ.", "explanation": "Trong phác đồ Methotrexate đa liều (Multi-dose MTX regimen): MTX là chất đối kháng acid folic ức chế enzym Dihydrofolate reductase, ngăn cản tổng hợp ADN tế bào. Việc tiêm Leucovorin (Folinic acid - dạng hoạt tính của folate) vào các ngày xen kẽ (Ngày 2, 4, 6, 8) có vai trò 'cứu vớt' (rescue therapy), cung cấp folate cho các tế bào lành của cơ thể mẹ (tủy xương, niêm mạc đường tiêu hóa), giúp giảm thiểu tối đa các tác dụng phụ nguy hiểm như suy tủy, viêm loét miệng và tiêu chảy."}, {"id": 36, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 29 tuổi, PARA 0000, trễ kinh 6 tuần, chẩn đoán thai ngoài tử cung vòi tử cung phải. Khai thác tiền sử: Bệnh nhân không có tiền sử viêm nhiễm vùng chậu, không phẫu thuật vòi tử cung, chưa từng can thiệp phụ khoa. Tuy nhiên, bệnh nhân nghiện hút thuốc lá nặng hơn 8 năm nay với liều lượng 15 - 20 điếu/ngày.", "question": "Cơ chế sinh học giải thích tác động của khói thuốc lá (Nikotin) làm tăng nguy cơ thai lạc chỗ ở vòi tử cung là gì?", "options": ["Nikotin làm tăng tiết lượng dịch chất nhầy lấp kín hoàn toàn buồng tử cung", "Nikotin đâm thủng vách vòi tử cung tạo các lỗ rò làm phôi bị kẹt lại", "Nikotin làm suy giảm cử động lông chuyển tế bào biểu mô và làm giảm tần số co bóp cơ trơn vòi tử cung", "Nikotin kích thích trứng rụng đồng thời mười quả gây cản trở phôi di chuyển", "Nikotin làm biến đổi nhóm máu của người mẹ từ RhD dương tính sang RhD âm tính theo đúng quy trình hướng dẫn lâm sàng chuẩn mực"], "correct": 2, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Nikotin không lấp kín lòng tử cung bằng chất nhầy"}, {"key": "B", "trap": "[qua_muc] Nikotin không đâm thủng tạo lỗ rò vòi tử cung cơ học"}, {"key": "D", "trap": "[nham_dan_so] Nikotin không gây rụng 10 trứng cùng lúc"}, {"key": "E", "trap": "[sai_tang] Nikotin không thay đổi gien nhóm máu RhD của con người"}], "decision": "Tiền sử hút thuốc lá nặng 15-20 điếu/ngày x 8 năm + Thai ngoài tử cung -> Cơ chế Nikotin -> Làm liệt cử động lông chuyển niêm mạc và giảm nhu động co bóp cơ trơn vòi tử cung -> Phôi di chuyển chậm bị kẹt lại vòi.", "explanation": "Hút thuốc lá là yếu tố nguy cơ có thể thay đổi được làm tăng nguy cơ thai lạc chỗ lên gấp 1.5 - 3.5 lần tùy theo liều lượng. Cơ chế: Nikotin và các chất độc trong khói thuốc lá làm suy giảm cử động sóng quét của hệ thống tế bào lông chuyển (cilia) niêm mạc vòi tử cung, đồng thời làm giảm tần số và biên độ co bóp cơ trơn vòi tử cung, khiến thời gian di chuyển của phôi từ vòi về tử cung bị kéo dài và phôi bị kẹt lại làm tổ ngay tại vòi tử cung."}, {"id": 37, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 27 tuổi, trễ kinh 6 tuần, chẩn đoán thai ngoài tử cung vòi tử cung trái. Khai thác tiền sử: Bệnh nhân từng bị viêm vùng chậu mạn tính (PID) tái phát nhiều lần do nhiễm Chlamydia trachomatis không được điều trị triệt để. Hình ảnh trong mổ nội soi: Hai vòi tử cung dính nhiều vào buồng trứng và thành chậu, niêm mạc loa vòi bị xơ dính dải dính mạng nhện.", "question": "Tổn thương giải phẫu bệnh học do vi khuẩn Chlamydia trachomatis gây ra ở vòi tử cung là gì?", "options": ["Gây tắc hoàn toàn động mạch tử cung dẫn đến hoại tử tử cung", "Gây ung thư biểu mô vòi tử cung dạng tế bào gai ác tính theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Gây tăng sinh lành tính các nang tuyến làm phồng to buồng trứng", "Gây teo hoàn toàn hai buồng trứng khiến bệnh nhân bị mãn kinh sớm", "Gây viêm mạn tính phá hủy lớp biểu mô lông chuyển, làm mất các nếp gấp niêm mạc và xơ hóa dính gập góc lòng vòi"], "correct": 4, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Chlamydia không gây tắc động mạch tử cung chính"}, {"key": "B", "trap": "[qua_muc] Chlamydia gây viêm xơ dính lành tính, không gây ung thư tế bào gai"}, {"key": "C", "trap": "[nham_dan_so] Chlamydia tấn công niêm mạc vòi tử cung, không tạo nang tuyến buồng trứng"}, {"key": "D", "trap": "[sai_tang] Chlamydia không gây mãn kinh sớm do teo buồng trứng"}], "decision": "Tiền sử viêm chậu PID do Chlamydia trachomatis + Hình ảnh vòi tử cung xơ dính gập góc -> Cơ chế Chlamydia -> Viêm mạn tính phá hủy lông chuyển niêm mạc và gây xơ dính hẹp lòng vòi tử cung.", "explanation": "Nhiễm vi khuẩn Chlamydia trachomatis là nguyên nhân hàng đầu gây viêm vùng chậu (PID) âm thầm. Chlamydia tấn công nội mạc vòi tử cung gây phản ứng viêm mạn tính, phá hủy các nếp gấp niêm mạc sinh lý, làm rụng và mất chức năng của tế bào lông chuyển, đồng thời tạo các dải xơ dính làm vòi tử cung bị hẹp hoặc gập góc cơ học -> Phôi không thể di chuyển về buồng tử cung và bị kẹt lại làm tổ gây thai ngoài tử cung."}, {"id": 38, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 32 tuổi, PARA 2002, đang mang vòng tránh thai chứa đồng (IUD TCu-380A) đặt cách đây 2 năm. Bệnh nhân trễ kinh 10 ngày, ra máu âm đạo nâu rỉ rả kèm đau tức hố chậu trái. Siêu âm TVS: Cây vòng tránh thai IUD nằm đúng vị trí trong buồng tử cung, niêm mạc tử cung mỏng d = 6 mm, lòng tử cung không có túi thai. Tại phần phụ trái có khối vòng nhẫn tăng âm d = 24 mm cạnh buồng trứng trái, beta-hCG = 2.100 mIU/mL.", "question": "Mối tương quan sinh học giữa dụng cụ tử cung IUD và nguy cơ thai ngoài tử cung được giải thích như thế nào?", "options": ["IUD trực tiếp hút phôi thai từ trong lòng tử cung đẩy ngược ra ngoài vòi tử cung", "IUD ngăn ngừa thai trong tử cung rất hiệu quả 99% nhưng không ngăn ngừa thai ngoài tử cung hiệu quả bằng, do đó nếu thất bại IUD thì tỷ lệ thai là thai ngoài tử cung sẽ tăng lên", "IUD làm tăng nồng độ beta-hCG lên gấp 100 lần kích thích thai làm tổ ở vòi tử cung theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "IUD gây tắc hoàn toàn hai buồng trứng làm trứng không thể thụ tinh", "IUD làm biến đổi nhóm máu của thai nhi gây phản ứng thải ghép"], "correct": 1, "traps": [{"key": "A", "trap": "[qua_muc] IUD không hút hay đẩy phôi thai cơ học ra vòi tử cung"}, {"key": "C", "trap": "[bat_tu_khoa] IUD không tác động lên quá trình tổng hợp beta-hCG"}, {"key": "D", "trap": "[sai_tang] IUD tác động tại niêm mạc tử cung phòng tránh thai, không làm tắc buồng trứng"}, {"key": "E", "trap": "[nham_dan_so] IUD không tác động lên nhóm máu hay gien của thai"}], "decision": "Mang IUD TCu-380A + Trễ kinh + IUD nằm đúng vị trí trong tử cung + beta-hCG 2.100 + Khối thai vòi trái 24 mm -> Cơ chế IUD -> IUD ngừa thai trong tử cung rất tốt (99%) nhưng ít hiệu quả với thai ngoài vòi -> Nếu có thai khi đang mang IUD thì nguy cơ là thai ngoài tử cung tăng lên.", "explanation": "Dụng cụ tử cung (IUD) không phải là nguyên nhân trực tiếp gây ra thai ngoài tử cung. Bản chất: IUD ngăn ngừa sự làm tổ của thai TRONG tử cung cực kỳ hiệu quả (giảm 99,5% nguy cơ thai trong tử cung), nhưng hiệu quả ngăn ngừa thai NGOẠI tử cung kém hơn. Do đó, nếu một phụ nữ đang mang IUD mà bị thất bại tránh thai (có thai), thì xác suất thai đó là thai ngoài tử cung sẽ cao hơn đáng kể (khoảng 10 - 20% các trường hợp có thai khi đang mang IUD là thai ngoài tử cung)."}, {"id": 39, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 30 tuổi, từng phẫu thuật thắt vòi tử cung hai bên để triệt sản cách đây 4 năm. Năm ngoái, do tái hôn, bệnh nhân đã thực hiện phẫu thuật vi phẫu nối lại hai vòi tử cung để phục hồi khả năng sinh sản. Hiện tại bệnh nhân trễ kinh 5 tuần, thử que 2 vạch đậm, ra ít máu âm đạo màu nâu. Siêu âm TVS: Buồng tử cung trống, vị trí xẻ nối cũ vòi tử cung bên phải có khối echo hỗn hợp d = 20 mm, beta-hCG = 1.950 mIU/mL.", "question": "Nguy cơ thai ngoài tử cung tại vị trí nối vòi tử cung tái tạo được giải thích do nguyên nhân gì?", "options": ["Do tinh trùng bị biến đổi hình thái sau phẫu thuật nối vòi", "Sự tăng sinh bất thường của các tế bào nang trứng ở buồng trứng theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Tác động của thuốc gây mê toàn thân trong phẫu thuật nối vòi", "Sẹo xơ dính hẹp lòng vòi và rối loạn nhu động tại vị trí miệng nối vi phẫu", "Do tử cung bị suy giảm kích thước sau phẫu thuật triệt sản"], "correct": 3, "traps": [{"key": "A", "trap": "[sai_tang] Phẫu thuật vòi tử cung không làm biến đổi tinh trùng của người chồng"}, {"key": "B", "trap": "[nham_dan_so] Buồng trứng phát triển bình thường, không liên quan sẹo nối vòi"}, {"key": "C", "trap": "[bat_tu_khoa] Thuốc gây mê không ảnh hưởng đến cấu trúc vòi tử cung lâu dài"}, {"key": "E", "trap": "[qua_muc] Triệt sản vòi tử cung không làm thay đổi kích thước tử cung"}], "decision": "Tiền sử vi phẫu nối lại vòi tử cung + Trễ kinh 5w + Khối thai làm tổ ngay vị trí miệng nối vòi phải -> Nguyên nhân -> Sẹo xơ dính gây chít hẹp khẩu kính lòng vòi và mất nhu động co bóp tại vị trí miệng nối vi phẫu.", "explanation": "Phẫu thuật vi phẫu phục hồi vòi tử cung sau triệt sản giúp khôi phục sự thông suốt cơ học, nhưng tại vị trí miệng nối (anastomosis site) luôn hình thành sẹo xơ dính, làm hẹp khẩu kính lòng vòi và phá hủy tính liên tục của lớp cơ trơn cũng như niêm mạc lông chuyển. Nguy cơ thai ngoài tử cung sau mổ nối vòi lên tới 15% - 20%, phôi thai thường bị kẹt lại ngay tại vị trí miệng nối sẹo."}, {"id": 40, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 27 tuổi, trễ kinh 5 tuần, không đau bụng, ra chút dịch nâu âm đạo. Định lượng beta-hCG ban đầu Ngày 1 = 800 mIU/mL. Siêu âm TVS: Buồng tử cung trống, đoạn loa vòi tử cung trái có khối nhỏ d = 14 mm, không có tim thai, không có dịch ổ bụng. Bệnh nhân được theo dõi sát. Xét nghiệm lặp lại: Ngày 3 beta-hCG = 520 mIU/mL; Ngày 5 beta-hCG = 310 mIU/mL (giảm 61.2% so với Ngày 1). Khối thai trên siêu âm thu nhỏ d = 10 mm.", "question": "Diễn tiến sinh học của khối thai ngoài tử cung này và chiến lược quản lý tiếp theo là gì?", "options": ["Thai ngoài tử cung đang tự thoái triển sinh lý hoàn toàn, tiếp tục theo dõi định lượng beta-hCG hàng tuần đến khi âm tính", "Thai ngoài tử cung đang tiến triển vỡ ngập máu, chuyển mổ cắt vòi tử cung ngay lập tức theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung hóa ác thành u nguyên bào nuôi, chỉ định tiêm hóa trị đa chất", "Thai trong tử cung dọa sẩy, cho tiêm Progesterone liều cao dưỡng thai", "Nhiễm trùng phần phụ cấp, cho nhập viện tiêm kháng sinh tĩnh mạch 14 ngày"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_xam_lan] beta-hCG giảm nhanh từ 800 -> 520 -> 310 mIU/mL và khối thai nhỏ lại chứng tỏ thai đang tự tiêu biến, không có nguy cơ vỡ"}, {"key": "C", "trap": "[qua_muc] beta-hCG giảm nhanh phản ảnh tế bào nuôi thoái hóa chết đi, không phải hóa ác"}, {"key": "D", "trap": "[sai_tang] Bệnh nhân mang thai ngoài tử cung đang thoái triển, không tiêm progesterone dưỡng thai"}, {"key": "E", "trap": "[nham_dan_so] Bệnh nhân không sốt, bạch cầu bình thường, không có nhiễm trùng"}], "decision": "beta-hCG N1 = 800 -> N3 = 520 -> N5 = 310 (giảm 61.2%) + Khối thai nhỏ d = 10 mm + Không đau bụng -> Thai ngoài tử cung đang tự thoái triển sinh lý (Spontaneous regression) -> Tiếp tục theo dõi beta-hCG hàng tuần đến khi âm tính (< 5 mIU/mL).", "explanation": "Khoảng 5% - 10% các trường hợp thai ngoài tử cung sớm (đặc biệt ở đoạn loa vòi với beta-hCG ban đầu < 1.000 mIU/mL) sẽ tự diễn tiến theo hướng **thoái triển sinh lý tự nhiên (Spontaneous regression)**. Do nguồn máu nuôi không đủ, tổ chức nguyên bào nuôi tự hoại tử và thoái hóa, nồng độ beta-hCG sụt giảm nhanh chóng (> 50% sau vài ngày) và khối thai tự tiêu biến hoàn toàn mà không cần bất kỳ can thiệp thuốc hay phẫu thuật nào."}, {"id": 41, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 26 tuổi, trễ kinh 6 tuần, ra máu âm đạo nâu rỉ rả. Tiền sử chưa ghi nhận dị dạng sinh dục. Siêu âm TVS lần 1 tại phòng khám tư: Buồng tử cung trống, góc phải tử cung có một túi thai d = 20 mm có phôi thai sống, chẩn đoán nghi ngờ thai ngoài tử cung đoạn kẽ sừng phải. Bệnh nhân được chuyển đến bệnh viện chuyên khoa. Bác sĩ chuyên khoa siêu âm kỹ lại: Bệnh nhân có dị dạng tử cung hai sừng (Bicornuate uterus). Túi thai d = 20 mm nằm hoàn toàn trong khoang nội mạc của Sừng Tử Cung Bên Phải (được bao quanh bởi lớp cơ tử cung liên tục d = 8 mm), còn Sừng Tử Cung Bên Trái trống rỗng có phản ứng màng rụng ra máu rỉ rả.", "question": "Chẩn đoán xác định chuẩn xác và cạm bẫy lâm sàng cần tránh ở bệnh nhân này là gì?", "options": ["Thai ngoài tử cung đôi hai bên sừng tử cung, chỉ định phẫu thuật cắt tử cung theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung đoạn kẽ vỡ, chỉ định mổ cắt góc tử cung khẩn cấp", "Thai trong tử cung sống ở sừng phải của tử cung hai sừng, cạm bẫy nhầm sừng tử cung mang thai thành khối thai ngoài tử cung", "Thai ở cổ tử cung, chỉ định đặt bóng Foley chèn kênh cổ tử cung", "Thai trứng toàn phần sừng trái, chỉ định nạo hút buồng tử cung"], "correct": 2, "traps": [{"key": "A", "trap": "[sai_tang] Thai làm tổ trong sừng phải, sừng trái phản ứng màng rụng rỉ máu, không phải thai ngoài hai bên"}, {"key": "B", "trap": "[qua_xam_lan] Chẩn đoán nhầm thai trong sừng tử cung dị dạng thành thai ngoài tử cung sẽ dẫn đến phẫu thuật mổ oan hủy hỏng thai nhi"}, {"key": "D", "trap": "[nham_dan_so] Thai làm tổ ở sừng tử cung phía trên, không nằm ở cổ tử cung"}, {"key": "E", "trap": "[bat_tu_khoa] Thai sống phát triển bình thường có phôi và tim thai, không phải thai trứng"}], "decision": "Dị dạng tử cung hai sừng + Túi thai làm tổ trong khoang nội mạc sừng phải + Lớp cơ bao quanh d = 8 mm + Sừng trái trống rỉ máu do màng rụng -> Thai trong tử cung ở sừng phải của tử cung hai sừng -> Cạm bẫy chẩn đoán nhầm sừng tử cung mang thai thành thai ngoài tử cung đoạn kẽ.", "explanation": "Dị dạng tử cung hai sừng (Bicornuate uterus) hoặc tử cung đôi là một cạm bẫy chẩn đoán hình ảnh rất kinh điển. Sừng tử cung mang thai nằm lệch hẳn sang một bên chậu dễ bị chẩn đoán nhầm là khối thai ngoài tử cung ở vòi tử cung hoặc đoạn kẽ. Tiêu chí phân biệt then chốt trên siêu âm TVS: Túi thai nằm hoàn toàn trong khoang nội mạc của sừng tử cung và **được bao quanh bởi lớp cơ tử cung liên tục dày >= 5 - 8 mm**. Sừng còn lại không có thai sẽ dầy niêm mạc và bong màng rụng gây ra máu rỉ rả. Đây là thai TRONG tử cung phát triển bình thường, cần quản lý dưỡng thai."}, {"id": 42, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 28 tuổi, đột ngột ngất xỉu tại nhà, được xe cấp cứu đưa vào viện trong tình trạng sốc mất máu cực kỳ nguy kịch. Khám lúc vào viện: Bệnh nhân hôn mê nhẹ, da trắng bệch, niêm mạc nhợt nhạt, chi lạnh ngắt. Mạch nhanh nhỏ vĩnh viễn 140 lần/phút, Huyết áp không đo được (0/0 mmHg). Bụng chướng căng cứng như gỗ, gõ đục toàn bộ. Siêu âm cấp cứu tại chỗ: Ổ bụng ngập tràn máu tươi và máu cục lượng rất lớn (> 1.500 ml). Bác sĩ trưởng khoa cấp cứu phát lệnh báo động đỏ nội viện.", "question": "Phương pháp phẫu thuật và quy trình xử trí sản khoa tối khẩn bắt buộc cho sản phụ này là gì?", "options": ["Chờ kết quả xét nghiệm công thức máu và đông máu toàn bộ trả về mới quyết định phương pháp mổ theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Phẫu thuật nội soi bơm khí CO2 ổ bụng thám sát tìm vị trí vòi tử cung vỡ", "Tiêm Methotrexate liều cao trực tiếp vào tĩnh mạch trung tâm rồi chờ huyết áp nâng lên", "Thực hiện thủ thuật nạo hút buồng tử cung bằng chân không để cầm máu", "Báo động đỏ chuyển thẳng phòng mổ MỔ MỞ CẤP CỨU ngay lập tức, vừa nhanh chóng kẹp cầm máu vòi tử cung vỡ vừa hồi sức truyền máu khối lượng lớn"], "correct": 4, "traps": [{"key": "A", "trap": "[qua_bao_ton] Chờ xét nghiệm ở bệnh nhân HA = 0 mmHg sẽ làm mất thời gian vàng cứu sống bệnh nhân"}, {"key": "B", "trap": "[bo_chong_chi_dinh] Bơm khí CO2 nội soi ở bệnh nhân sốc HA = 0 mmHg làm tồi tệ thêm tình trạng suy tuần hoàn và chèn ép hô hấp gây dừng tim ngay lập tức"}, {"key": "C", "trap": "[bo_chong_chi_dinh] Tiêm MTX khi đang sốc chảy máu là chống chỉ định tuyệt đối gây tử vong"}, {"key": "D", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được vòi tử cung đang vỡ chảy máu trong ổ bụng"}], "decision": "Hôn mê + Da trắng bệch + HA 0/0 mmHg, M 140 + Bụng căng gỗ + Tràn máu ổ bụng > 1.500 ml -> Choáng mất máu nguy kịch do thai ngoài tử cung vỡ -> Báo động đỏ MỔ MỞ CẤP CỨU ngay lập tức (Laparotomy) kẹp cầm máu vừa mổ vừa hồi sức truyền máu khối lượng lớn.", "explanation": "Khi bệnh nhân thai ngoài tử cung vỡ ngập máu ổ bụng gây choáng mất máu cực kỳ nguy kịch (huyết áp không đo được, mạch nhanh nhỏ, tràn máu ổ bụng lượng lớn): **Phẫu thuật MỔ MỞ CẤP CỨU (Laparotomy)** là chỉ định bắt buộc tuyệt đối. Mổ mở cho phép mở bụng nhanh trong vòng vài giây, kẹp kẹp cầm máu ngay lập tức vòi tử cung đang vỡ chảy máu xối xả, rửa hút máu cục và hồi sức truyền máu khối lượng lớn. Phẫu thuật nội soi chống chỉ định tuyệt đối khi huyết động thất bẫy/sốc nặng vì việc bơm khí CO2 khoang bụng làm giảm lưu lượng máu về tim gây tụt huyết áp nặng thêm và ngừng tim."}, {"id": 43, "part": 1, "bloom": "Mức 3-4", "stem": "Trong quá trình phẫu thuật nội soi xẻ vòi tử cung bảo tồn (Salpingostomy) điều trị thai ngoài tử cung ở đoạn bóng vòi tử cung phải chưa vỡ cho sản phụ 25 tuổi chưa có con. Phẫu thuật viên tiến hành xẻ một đường dọc dài khoảng 1.5 cm ở bờ tự do của vòi tử cung (bờ đối diện bờ mạc treo vòi tử cung) ngay trên chỗ phồng của khối thai, dùng bơm nước áp lực hút tống xuất toàn bộ khối thai ra ngoài.", "question": "Tại sao đường xẻ vòi tử cung trong kỹ thuật Salpingostomy bắt buộc phải thực hiện ở BỜ TỰ DO của vòi tử cung?", "options": ["Bờ tự do chứa nhiều tế bào thần kinh kích thích co bóp vòi tử cung tống thai ra ngoài theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Bờ tự do là vùng ít mạch máu nhất, giúp hạn chế tối đa nguy cơ chảy máu và tránh tổn thương hệ thống mạch máu mạc treo vòi tử cung", "Bờ tự do dính sát vào buồng trứng giúp khối thai tự chui vào buồng trứng", "Bờ tự do có lớp cơ tử cung dày nhất giúp dễ khâu phục hồi bằng chỉ nilon", "Bờ tự do là nơi duy nhất không có niêm mạc lông chuyển"], "correct": 1, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Bờ tự do không chứa mạng lưới thần kinh co bóp tống thai"}, {"key": "C", "trap": "[sai_tang] Bờ tự do hướng tự do vào ổ bụng, không dính vào buồng trứng"}, {"key": "D", "trap": "[phan_biet_hep] Trong Salpingostomy, bờ xẻ vòi tử cung thường để ngỏ tự lành, không khâu kín vĩnh viễn"}, {"key": "E", "trap": "[nham_dan_so] Bờ tự do được lót niêm mạc lông chuyển toàn bộ"}], "decision": "Kỹ thuật Salpingostomy -> Xẻ dọc 1.5 cm ở BỜ TỰ DO vòi tử cung (Antimesenteric border) -> Lý do -> Bờ tự do vô mạch/ít mạch máu nhất, tránh tổn thương vòng mạch mạc treo vòi tử cung (Mesosalpinx).", "explanation": "Trong phẫu thuật Salpingostomy bảo tồn: Đường xẻ vòi tử cung bắt buộc phải thực hiện ở **bờ tự do (antimesenteric border)** của vòi tử cung (bờ đối diện bờ bám mạc treo vòi). Lý do giải phẫu: Bờ tự do là vùng nghèo mạch máu nhất. Nếu xẻ ở bờ mạc treo (mesosalpinx) sẽ làm rách vòng nối động mạch tử cung - buồng trứng gây chảy máu dữ dội không thể cầm, buộc phải chuyển sang cắt toàn bộ vòi tử cung."}, {"id": 44, "part": 1, "bloom": "Mức 3-4", "stem": "Một bác sĩ tuyến cơ sở tiếp nhận bệnh nhân 27 tuổi trễ kinh 6 tuần, ra máu âm đạo nâu rỉ rả, nghi ngờ thai ngoài tử cung ở vòi tử cung trái chưa vỡ. Do nghĩ rằng ra máu âm đạo là do tử cung co bóp kém, bác sĩ định kê đơn thuốc Misoprostol (Prostaglandin E1) phối hợp tiêm bắp Ergometrine để kích thích tử cung co bóp cầm máu.", "question": "Sai lầm chuyên môn nghiêm trọng của việc chỉ định thuốc co bóp tử cung (Misoprostol / Ergometrine) ở bệnh nhân thai ngoài tử cung là gì?", "options": ["Thuốc làm biến đổi nhóm máu của người mẹ từ RhD âm tính sang dương tính", "Thuốc làm tăng nồng độ beta-hCG lên gấp 10 lần làm thai phát triển thành thai đôi theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thuốc gây vô kinh kéo dài trên 5 năm sau khi xuất viện", "Chống chỉ định tuyệt đối vì thuốc làm tăng áp lực co bóp tử cung và vòi tử cung gây nguy cơ vỡ khối thai ngoài cấp tính", "Thuốc làm hoại tử hoàn toàn hai buồng trứng gây mãn kinh sớm"], "correct": 3, "traps": [{"key": "A", "trap": "[sai_tang] Thuốc không làm thay đổi gien nhóm máu RhD"}, {"key": "B", "trap": "[bat_tu_khoa] Thuốc co hồi tử cung không làm tăng tổng hợp beta-hCG"}, {"key": "C", "trap": "[qua_muc] Thuốc co hồi tử cung không gây vô kinh 5 năm"}, {"key": "E", "trap": "[nham_dan_so] Thuốc tác động lên cơ trơn tử cung/vòi tử cung, không gây hoại tử buồng trứng"}], "decision": "Nghi thai ngoài tử cung chưa vỡ + Dùng Misoprostol / Ergometrine -> Chống chỉ định TUYỆT ĐỐI -> Thuốc kích thích tăng co bóp cơ trơn tử cung và vòi tử cung -> Làm tăng áp lực đâm thủng vỡ khối thai gây xuất huyết nội nguy kịch.", "explanation": "Sử dụng các thuốc co hồi tử cung (Misoprostol, Oxytocin, Ergometrine) khi nghi ngờ hoặc đã xác định thai ngoài tử cung là **chống chỉ định tuyệt đối nguy hiểm**. Các thuốc này kích thích sự co bóp dồn dập của cơ trơn tử cung và vòi tử cung, làm tăng vọt áp lực nội vòi, dẫn đến nguy cơ vỡ khối thai ngoài tử cung cấp tính gây chảy máu ngập ối/ổ bụng đe doạ tính mạng bệnh nhân."}, {"id": 45, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 28 tuổi, vừa điều trị thành công thai ngoài tử cung ở vòi tử cung phải bằng Methotrexate (MTX) liều đơn, beta-hCG đã về âm tính (< 5 mIU/mL). Bệnh nhân và chồng chuẩn bị xuất viện và hỏi bác sĩ tư vấn về thời gian an toàn có thể bắt đầu mang thai trở lại.", "question": "Khuyến cáo về thời gian bắt đầu mang thai an toàn và biện pháp tránh thai phù hợp sau điều trị Methotrexate là gì?", "options": ["Bắt buộc sử dụng biện pháp tránh thai an toàn ít nhất 3 tháng sau liều MTX cuối cùng để đảm bảo thuốc thải trừ hoàn toàn, tránh nguy cơ quái thai", "Có thể mang thai ngay lập tức trong chu kỳ kinh nguyệt tiếp theo sau khi xuất viện theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Bắt buộc phải kiêng mang thai vĩnh viễn trong 10 năm do MTX đọng trong xương", "Không cần dùng biện pháp tránh thai vì MTX gây triệt sản vĩnh viễn", "Chỉ cần kiêng quan hệ tình dục trong 7 ngày sau xuất viện rồi mang thai bình thường"], "correct": 0, "traps": [{"key": "B", "trap": "[bo_chong_chi_dinh] Mang thai ngay sau MTX có nguy cơ cao quái thai dị tật bẩm sinh do độc tính ức chế phân bào của thuốc"}, {"key": "C", "trap": "[qua_muc] Kiêng 10 năm là không cần thiết, MTX thải trừ hoàn toàn sau 3 tháng"}, {"key": "D", "trap": "[bat_tu_khoa] MTX không gây triệt sản vĩnh viễn"}, {"key": "E", "trap": "[qua_bao_ton] 7 ngày là quá ngắn, chưa đủ thời gian thải trừ MTX khỏi tế bào"}], "decision": "Điều trị MTX thành công -> beta-hCG < 5 mIU/mL -> Dược động học MTX ức chế tổng hợp ADN tế bào -> Bắt buộc tránh thai an toàn ít nhất 3 THÁNG sau liều MTX cuối cùng -> Ngăn ngừa nguy cơ dị tật bẩm sinh / quái thai.", "explanation": "Methotrexate (MTX) là thuốc hóa trị chống chuyển hóa, liên kết bền vững với enzym Dihydrofolate reductase và tích lũy trong các tế bào gan/thận từ 2 - 3 tháng. Nếu mang thai quá sớm sau khi dùng MTX, nồng độ thuốc dư thừa sẽ gây độc cho phôi thai, dẫn đến sẩy thai, dị tật bẩm sinh hoặc quái thai nghiêm trọng. Khuyến cáo bắt buộc của ACOG và WHO: Bệnh nhân phải sử dụng biện pháp tránh thai hiệu quả (như bao cao su, thuốc tránh thai) **ít nhất 3 tháng (12 tuần)** sau liều MTX cuối cùng trước khi bắt đầu thả mang thai trở lại."}, {"id": 46, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 26 tuổi, con so, điều trị bảo tồn thai ngoài tử cung vòi tử cung trái thành công. Bệnh nhân có nguyện vọng kiểm tra lại hình thái và độ thông suốt của hai vòi tử cung trước khi kế hoạch mang thai trở lại. Bác sĩ hẹn thời điểm chụp X-quang tử cung - vòi tử cung (HSG).", "question": "Thời điểm chuẩn mực và điều kiện sạch kinh để thực hiện chụp HSG kiểm tra vòi tử cung là khi nào?", "options": ["Thực hiện ngay khi vừa xuất viện dù beta-hCG vẫn còn 500 mIU/mL", "Thực hiện ngay trong ngày thứ hai của chu kỳ kinh nguyệt đang ra máu nhiều theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thực hiện sau điều trị ít nhất 3 tháng, vào thời điểm sau khi sạch kinh từ 2 đến 5 ngày và hoàn toàn không có viêm nhiễm đường sinh dục", "Thực hiện ở tuần thứ 20 của thai kỳ tiếp theo", "Thực hiện bất kỳ thời điểm nào không phụ thuộc vào chu kỳ kinh nguyệt"], "correct": 2, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] beta-hCG còn 500 chứng tỏ tổ chức thai chưa thoái triển hết, chống chỉ định bơm thuốc cản quang"}, {"key": "B", "trap": "[bo_chong_chi_dinh] Chụp HSG khi đang ra máu kinh gây tắc mạch do khí/thuốc cản quang và đẩy máu kinh ngược vào ổ bụng"}, {"key": "D", "trap": "[sai_tang] HSG bơm thuốc cản quang X-quang chống chỉ định khi đang mang thai"}, {"key": "E", "trap": "[qua_bao_ton] Phải chụp sau sạch kinh 2-5 ngày để đảm bảo niêm mạc mỏng và không có thai sớm"}], "decision": "Nguyện vọng kiểm tra vòi tử cung sau điều trị thai ngoài -> Chụp HSG (Hysterosalpingography) -> Thời điểm: Sau 3 tháng + Sau sạch kinh 2 - 5 ngày + Không có viêm nhiễm sinh dục.", "explanation": "Chụp tử cung - vòi tử cung có bơm thuốc cản quang (HSG) là phương pháp cận lâm sàng giúp đánh giá độ thông suốt của vòi tử cung sau điều trị thai ngoài tử cung. Thời điểm chuẩn: (1) Sau điều trị ổn định ít nhất 3 tháng; (2) Thực hiện vào giai đoạn đầu chu kỳ kinh, **sau khi sạch kinh từ 2 đến 5 ngày** (khi niêm mạc tử cung mỏng nhất, chưa rụng trứng và chắc chắn không có thai); (3) Bệnh nhân hoàn toàn không có tình trạng viêm nhiễm cấp tính đường sinh dục (để tránh đẩy vi khuẩn vào ổ bụng)."}, {"id": 47, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 28 tuổi, trễ kinh 6 tuần, ra máu nâu rỉ rả. beta-hCG = 1.750 mIU/mL. Siêu âm TVS: Buồng tử cung trống. Tại phần phụ phải, nằm sát ngay cạnh buồng trứng phải, quan sát thấy một khối phản âm hỗn hợp tăng âm không đều (Blob sign) kích thước 21 x 15 mm, không có cấu trúc vòng nhẫn trống âm rõ ràng, đè ép đầu dò khối này di chuyển độc lập với buồng trứng phải.", "question": "Dấu hiệu khối echo hỗn hợp (Blob sign) cạnh buồng trứng trên siêu âm TVS phản ánh tổn thương giải phẫu bệnh nào?", "options": ["Khối u xơ tử cung dưới niêm mạc FIGO 0 theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Nang buồng trứng lành tính chứa dịch trong suốt", "Thai trong tử cung sống phát triển bình thường", "Sỏi bàng quang đâm thủng niệu quản", "Khối thai ngoài tử cung đã bị sẩy hoặc thoái triển tạo tụ máu trong lòng vòi tử cung"], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] U xơ dưới niêm mạc FIGO 0 nằm hoàn toàn trong lòng tử cung"}, {"key": "B", "trap": "[phan_biet_hep] Blob sign là khối echo hỗn hợp tăng âm không đều do máu tụ và mô thai, không phải nang dịch trong"}, {"key": "C", "trap": "[sai_tang] Khối nằm ở phần phụ cạnh buồng trứng, buồng tử cung trống"}, {"key": "D", "trap": "[bat_tu_khoa] Không liên quan sỏi bàng quang hay niệu quản"}], "decision": "beta-hCG 1.750 + Buồng tử cung trống + Khối echo hỗn hợp Blob sign cạnh buồng trứng di động độc lập -> Khối thai ngoài tử cung sẩy / thoái triển tạo bọc máu tụ trong vòi tử cung.", "explanation": "Dấu hiệu 'Blob sign' (khối phản âm hỗn hợp không đồng nhất cạnh buồng trứng) là hình ảnh siêu âm qua ngả âm đạo (TVS) phổ biến nhất của thai ngoài tử cung (chiếm khoảng 60% các trường hợp). Khối này được hình thành do sự thoái triển, sẩy thai cục bộ hoặc tụ máu đọng lại trong lòng vòi tử cung quanh tổ chức nguyên bào nuôi hoại tử. Phân biệt với Tubal ring sign (vòng nhẫn trống âm) xuất hiện khi túi thai còn nguyên vẹn."}, {"id": 48, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 29 tuổi, vô sinh I do hội chứng buồng trứng đa nang (PCOS). Bệnh nhân được điều trị kích thích rụng trứng bằng thuốc Clomiphene citrate đường uống. Sau kích trứng, bệnh nhân chậm kinh 2 tuần, thử que 2 vạch đậm. Bệnh nhân xuất hiện đau tức hố chậu trái. Siêu âm TVS: Buồng tử cung trống, phần phụ trái có khối thai d = 26 mm có tim thai (+), hai buồng trứng có nhiều nang hoàng thể d = 35 - 40 mm. Định lượng beta-hCG = 4.800 mIU/mL.", "question": "Mối liên quan giữa sử dụng thuốc kích thích rụng trứng Clomiphene citrate và nguy cơ thai lạc chỗ là gì?", "options": ["Thuốc đâm thủng vách vòi tử cung làm phôi rơi ra ngoài theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thuốc làm thay đổi nồng độ Estrogen/Progesterone cao bất thường gây rối loạn nhu động co bóp vòi tử cung", "Thuốc gây tiêu biến hoàn toàn lớp niêm mạc buồng tử cung", "Thuốc làm biến đổi di truyền phôi thai thành bộ gen 3n", "Thuốc gây hoại tử toàn bộ mạch máu nuôi tử cung"], "correct": 1, "traps": [{"key": "A", "trap": "[qua_muc] Thuốc kích trứng đường uống không đâm thủng cơ học vòi tử cung"}, {"key": "C", "trap": "[bat_tu_khoa] Clomiphene không làm tiêu biến hoàn toàn niêm mạc tử cung"}, {"key": "D", "trap": "[nham_dan_so] Clomiphene kích thích phát triển nang noãn, không làm đột biến gen tam bội 3n"}, {"key": "E", "trap": "[sai_tang] Thuốc không gây hoại tử mạch máu tử cung"}], "decision": "Kích thích rụng trứng bằng Clomiphene citrate + Thai ngoài tử cung vòi trái -> Mối liên quan -> Nồng độ nội tiết Estrogen/Progesterone vọt cao làm rối loạn sóng nhu động co bóp cơ trơn vòi tử cung làm phôi kẹt lại.", "explanation": "Các thuốc kích thích rụng trứng (Clomiphene citrate, Gonadotropins) làm tăng nguy cơ thai lạc chỗ lên gấp 2 - 4 lần so với chu kỳ tự nhiên. Cơ chế: Sự phát triển của nhiều nang noãn đồng thời tạo ra nồng độ Estrogen và Progesterone trong máu vọt cao vượt ngưỡng sinh lý, làm thay đổi môi trường sinh hóa và gây rối loạn sóng nhu động co bóp tự nhiên của cơ trơn vòi tử cung, dẫn đến phôi di chuyển bất thường và bị kẹt lại làm tổ tại vòi tử cung."}, {"id": 49, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 32 tuổi, trễ kinh 7 tuần, đau hạ vị dữ dội. Siêu âm TVS: Khoang nội mạc buồng tử cung hoàn toàn trống rỗng, liên tục không bị gián đoạn. Hai vòi tử cung và hai buồng trứng hoàn toàn bình thường. Nằm hoàn toàn trong lớp cơ tử cung ở thành sau tử cung, tách biệt tuyệt đối với khoang nội mạc và bờ serosa phúc mạc, quan sát thấy một túi thai d = 22 mm có phôi thai sống. Phổ Doppler màu thấy mạch máu cơ tử cung tăng sinh bao quanh túi thai.", "question": "Chẩn đoán vị trí thai lạc chỗ cực kỳ hiếm gặp và tiêu chuẩn khẳng định trên siêu âm là gì?", "options": ["Thai trứng toàn phần xâm lấn bàng quang", "Thai ngoài tử cung ở vòi tử cung đoạn bóng vỡ theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ở cổ tử cung dọa sẩy", "Thai trong cơ tử cung Intramural pregnancy, túi thai nằm hoàn toàn trong lớp cơ tử cung và tách biệt với khoang nội mạc", "U xơ tử cung hoại tử đỏ thai kỳ"], "correct": 3, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Siêu âm có phôi thai sống rõ ràng trong cơ, không phải thai trứng"}, {"key": "B", "trap": "[sai_tang] Hai vòi tử cung hoàn toàn bình thường, túi thai nằm trong lớp cơ tử cung thành sau"}, {"key": "C", "trap": "[nham_dan_so] Túi thai nằm ở cơ thành sau thân tử cung, không nằm ở kênh cổ tử cung"}, {"key": "E", "trap": "[phan_biet_hep] Có phôi thai và tim thai sống trong cơ, không phải u xơ hoại tử"}], "decision": "Khoang nội mạc rỗng + Túi thai nằm hoàn toàn trong lớp cơ tử cung thành sau + Tách biệt khoang nội mạc và màng ngoài tử cung -> Thai trong cơ tử cung (Intramural pregnancy).", "explanation": "Thai trong cơ tử cung (Intramural pregnancy) là dạng thai lạc chỗ cực kỳ hiếm gặp (< 1%), trong đó túi thai làm tổ hoàn toàn trong lớp cơ tử cung (myometrium) và tách biệt tuyệt đối với khoang nội mạc tử cung cũng như vòi tử cung. Tiêu chuẩn siêu âm TVS: (1) Khoang nội mạc tử cung trống rỗng và liên tục; (2) Túi thai nằm hoàn toàn trong lớp cơ tử cung, bao quanh bởi cơ tử cung; (3) Tách biệt với vòi tử cung và buồng trứng hai bên."}, {"id": 50, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 28 tuổi, vừa phẫu thuật cắt vòi tử cung phải do thai ngoài tử cung vỡ. Bệnh nhân lo lắng hỏi bác sĩ tư vấn về nguy cơ bị thai ngoài tử cung tái phát trong những lần mang thai tiếp theo và chiến lược theo dõi cần làm ngay khi trễ kinh ở lần mang thai sau.", "question": "Con số tỷ lệ nguy cơ tái phát thai ngoài tử cung và quy trình quản lý thai kỳ sau được tư vấn chuẩn xác là gì?", "options": ["Nguy cơ tái phát khoảng 10 đến 15 phần trăm sau một lần bị thai ngoài, lần mang thai sau cần đi siêu âm TVS sớm ngay khi trễ kinh 1 tuần để xác định vị trí thai", "Nguy cơ tái phát 100 phần trăm, bắt buộc phải xin trứng làm IVF xin con nuôi", "Nguy cơ tái phát bằng 0 phần trăm vì đã cắt bỏ vòi tử cung bị bệnh", "Lần mang thai sau bắt buộc phải mổ màng bụng thắt nốt vòi tử cung còn lại", "Lần mang thai sau không được siêu âm vì tia siêu âm làm thai bò ra ngoài vòi theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_muc] Nguy cơ tái phát sau 1 lần bị là 10-15%, vẫn còn 85-90% cơ hội thai trong tử cung bình thường"}, {"key": "C", "trap": "[qua_bao_ton] Vòi tử cung bên đối diện vẫn có nguy cơ bị thai ngoài tử cung"}, {"key": "D", "trap": "[bo_chong_chi_dinh] Thắt vòi còn lại sẽ làm bệnh nhân bị vô sinh hoàn toàn"}, {"key": "E", "trap": "[bat_tu_khoa] Siêu âm an toàn không gây dịch chuyển vị trí thai"}], "decision": "Tiền sử 1 lần thai ngoài tử cung -> Nguy cơ tái phát -> Tỷ lệ 10 - 15% sau 1 lần (vọt lên 25 - 30% sau >= 2 lần) -> Hướng dẫn: Lần mang thai sau đi khám và siêu âm TVS sớm ngay khi trễ kinh 1-2 tuần để khẳng định thai đã vào buồng tử cung.", "explanation": "Sau một lần bị thai ngoài tử cung, nguy cơ tái phát thai ngoài tử cung ở các lần mang thai tiếp theo là khoảng **10% - 15%** (nếu tiền sử bị >= 2 lần thai ngoài thì nguy cơ tái phát vọt lên 25% - 30%). Tuy nhiên, bệnh nhân vẫn có 85% - 90% cơ hội mang thai trong tử cung bình thường. Hướng dẫn tư vấn: Ngay khi trễ kinh 1 - 2 tuần hoặc thử que 2 vạch ở lần mang thai sau, bệnh nhân bắt buộc phải đến cơ sở y tế siêu âm TVS và định lượng beta-hCG sớm để kiểm tra vị trí túi thai đã vào lòng tử cung an toàn chưa."}, {"id": 51, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân nữ 24 tuổi, trễ kinh 10 ngày, xuất hiện đau râm râm hạ vị lệch phải kèm sốt nhẹ 37.8°C và buồn nôn. Bác sĩ tuyến dưới khám ghi nhận ấn đau vùng hố chậu phải, chẩn đoán ngay Viêm ruột thừa cấp và chuyển mổ nội soi cắt ruột thừa mà không làm xét nghiệm định lượng beta-hCG hay siêu âm ngả âm đạo. Trong mổ, ruột thừa hoàn toàn bình thường, vòi tử cung phải vỡ rỉ rả máu chảy 300 mL vào ổ bụng.", "question": "Thẩm định sai lầm lâm sàng nghiêm trọng nhất trong quy trình chẩn đoán ban đầu tại tuyến dưới là gì?", "options": ["Chỉ định mổ nội soi quá muộn khiến khối thai ngoài tử cung bị vỡ ngập máu rỉ rả vào trong khoang ổ bụng.", "Không cho chụp cắt lớp vi tính ổ bụng ngay từ đầu để khẳng định hình ảnh viêm ruột thừa cấp trước khi mổ.", "Bỏ sót xét nghiệm beta-hCG và siêu âm ngả âm đạo ở phụ nữ tuổi sinh đẻ có đau bụng, gây chẩn đoán nhầm và mổ nhầm.", "Không cho uống thuốc kháng sinh phổ rộng liều cao để điều trị nội khoa viêm ruột thừa trước khi quyết định mổ.", "Bỏ qua thao tác thăm khám trực tràng và âm đạo hai tay để tìm dấu hiệu phản ứng thành bụng ở vùng hạ vị. theo đúng quy trình"], "correct": 2, "traps": [{"key": "A", "trap": "Sai về trình tự nguyên nhân hậu quả vì việc vỡ khối thai do không chẩn đoán đúng chứ không phải mổ nội soi muộn [sai_thu_tu]"}, {"key": "B", "trap": "Thống nhất không chụp CT scan ổ bụng cho phụ nữ nghi ngờ mang thai quý 1 do độc tính bức xạ xạ trị [bo_chong_chi_dinh]"}, {"key": "D", "trap": "Viêm ruột thừa cấp có chỉ định phẫu thuật cắt bỏ chứ không điều trị kháng sinh bảo tồn đơn thuần [guideline_cu]"}, {"key": "E", "trap": "Thiếu thành tố quyết định là xét nghiệm sinh hóa beta-hCG huyết thanh [thieu_cau_phan]"}], "decision": "Phụ nữ tuổi sinh đẻ + Trễ kinh + Đau hố chậu phải -> Bắt buộc làm beta-hCG & TVS trước -> Không làm beta-hCG dẫn đến mổ nhầm ruột thừa -> Sai sót quy trình cốt lõi.", "explanation": "Theo Giáo trình Bài 10: Ở mọi phụ nữ trong độ tuổi sinh đẻ xuất hiện triệu chứng đau bụng vùng hạ vị hoặc hố chậu, xét nghiệm định lượng beta-hCG huyết thanh và siêu âm ngả âm đạo TVS là bắt buộc phải thực hiện đầu tiên để loại trừ thai lạc chỗ trước khi nghĩ đến các bệnh lý ngoại khoa tiêu hóa như viêm ruột thừa cấp."}, {"id": 52, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 29 tuổi, trễ kinh 2 tuần, ra máu nâu rỉ rả. Khám phụ khoa tử cung hơi to mềm, hai phần phụ chưa sờ thấy khối bất thường. Cận lâm sàng: beta-hCG huyết thanh = 2.400 mIU/mL. Siêu âm TVS: Buồng tử cung hoàn toàn trống rỗng, không có túi thai thật hay giả, hai phần phụ quan sát chưa rõ do hơi ruột, túi cùng sau không có dịch. Bác sĩ phòng khám cho bệnh nhân đơn thuốc giảm đau và hẹn về nhà tự theo dõi tái khám sau 5 ngày.", "question": "Đánh giá mức độ an toàn và tính đúng đắn trong quyết định xử trí của bác sĩ phòng khám?", "options": ["Quyết định sai lầm vì chưa chỉ định nạo hút buồng tử cung chẩn đoán ngay lập tức để làm giải phẫu bệnh mô thai.", "Quyết định hoàn toàn đúng đắn vì siêu âm chưa thấy khối thai ở phần phụ nên cho về theo dõi ngoại trú là an toàn tuyệt đối.", "Quyết định sai lầm vì chưa cho bệnh nhân tiêm khẩn cấp một liều Methotrexate ngay tại phòng khám trước khi cho về.", "Quyết định đúng đắn nhưng cần cho thêm thuốc co hồi tử cung Oxytocin uống để tống xuất máu tụ còn sót trong buồng tử cung.", "Quyết định sai lầm nghiêm trọng vì beta-hCG vượt ngưỡng phân định 2.000 mIU/mL mà buồng tử cung trống bắt buộc nhập viện theo dõi thai lạc chỗ."], "correct": 4, "traps": [{"key": "A", "trap": "Nạo hút buồng tử cung xâm lấn khi beta-hCG 2.400 mIU/mL chưa có chỉ định nạo hút chẩn đoán [qua_xam_lan]"}, {"key": "B", "trap": "Cho bệnh nhân về nhà khi beta-hCG > 2.000 mIU/mL buồng tử cung trống có nguy cơ vỡ thai ngoài tử cung gây tử vong tại nhà [qua_bao_ton]"}, {"key": "C", "trap": "Tiêm MTX khi chưa nhập viện theo dõi và chưa đánh giá chức năng gan thận là vi phạm quy trình an toàn [qua_xam_lan]"}, {"key": "D", "trap": "Dùng Oxytocin khi nghi ngờ thai ngoài tử cung là chống chỉ định tuyệt đối gây co bóp vỡ khối thai [bo_chong_chi_dinh]"}], "decision": "beta-hCG = 2.400 mIU/mL (> ngưỡng phân định 2.000 mIU/mL) + TVS buồng tử cung trống -> Khẳng định Thai ngoài tử cung -> Bắt buộc nhập viện theo dõi sát, tuyệt đối không cho về ngoại trú.", "explanation": "Theo Bài 10: Ngưỡng phân định (Discriminatory zone) của siêu âm TVS là 1.500 - 2.000 mIU/mL. Khi beta-hCG >= 2.000 mIU/mL mà siêu âm TVS buồng tử cung trống rỗng, chẩn đoán thai ngoài tử cung được thiết lập. Cho bệnh nhân về theo dõi ngoại trú là sai lầm nguy hiểm vì khối thai có thể vỡ bất cứ lúc nào gây xuất huyết nội nguy kịch."}, {"id": 53, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 26 tuổi, trễ kinh 4 ngày, ra máu nâu rỉ rả. Xét nghiệm beta-hCG = 450 mIU/mL. Siêu âm TVS: Buồng tử cung trống, hai phần phụ bình thường, không có dịch ối. Bác sĩ chỉ định nạo hút buồng tử cung chẩn đoán ngay lập tức để tìm nhung mao gai nhau. Kết quả giải phẫu bệnh mô nạo: Màng rụng biến đổi Arias-Stella, hoàn toàn không có nhung mao gai nhau. Hai ngày sau nạo, beta-hCG vọt lên 980 mIU/mL.", "question": "Thẩm định sai lầm can thiệp lâm sàng của bác sĩ đối với trường hợp thai chưa rõ vị trí này?", "options": ["Nạo hút buồng tử cung quá muộn khiến tế bào nuôi xâm nhập sâu vào cơ tử cung gây biến chứng ung thư nguyên bào nuôi.", "Nạo hút buồng tử cung quá sớm khi beta-hCG chưa vượt ngưỡng phân định làm phá hủy một thai trong tử cung giai đoạn sớm.", "Không tiêm thuốc Methotrexate toàn thân kết hợp ngay trong lúc thực hiện thủ thuật nạo hút buồng tử cung chẩn đoán.", "Chỉ định nạo hút buồng tử cung là đúng nhưng kỹ thuật nạo chưa sạch hoàn toàn dẫn đến beta-hCG tiếp tục tăng cao.", "Bỏ qua bước chụp cộng hưởng từ hạt nhân tiểu khung trước khi tiến hành thủ thuật nạo hút buồng tử cung."], "correct": 1, "traps": [{"key": "A", "trap": "Nạo hút không liên quan đến ung thư nguyên bào nuôi [sai_tang]"}, {"key": "C", "trap": "Tiêm MTX cùng lúc nạo hút khi chưa chẩn đoán xác định thai ngoài tử cung là sai lầm chồng sai lầm [qua_xam_lan]"}, {"key": "D", "trap": "beta-hCG tăng sau nạo do thai ngoài tử cung vẫn phát triển hoặc phá nhầm thai trong tử cung sớm [phan_biet_hep]"}, {"key": "E", "trap": "Không có chỉ định chụp MRI tiểu khung trước nạo hút buồng tử cung [thieu_cau_phan]"}], "decision": "Trễ kinh 4 ngày + beta-hCG = 450 mIU/mL (< 1.500) + TVS buồng tử cung trống -> Thai chưa rõ vị trí (PUL) -> Bắt buộc theo dõi beta-hCG 48h -> Nạo hút ngay là sai lầm làm hỏng thai sớm.", "explanation": "Theo Bài 10: Khi beta-hCG < 1.500 mIU/mL và siêu âm chưa thấy túi thai (PUL), tuyệt đối không được nạo hút buồng tử cung chẩn đoán vội vàng vì có thể đó là một thai trong tử cung sống bình thường nhưng tuổi thai còn quá nhỏ. Nạo hút lúc này sẽ làm hỏng thai trong tử cung một cách oan uổng."}, {"id": 54, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 30 tuổi, PARA 1001, thai ngoài tử cung vòi trứng phải. Bệnh nhân tỉnh táo, sinh hiệu ổn định: HA 115/70 mmHg, Mạch 78 lần/phút. Cận lâm sàng: beta-hCG = 4.200 mIU/mL. Siêu âm TVS: Buồng tử cung trống, khối thai vòi trứng phải d = 28 mm, quan sát thấy phôi thai có hoạt động tim thai dương tính rõ tần số 120 lần/phút, không có dịch ổ bụng. Bác sĩ tư vấn chỉ định tiêm Methotrexate liều đơn 50 mg/m2.", "question": "Thẩm định tính hợp lý và độ an toàn của chỉ định tiêm Methotrexate trên bệnh nhân này?", "options": ["Chỉ định đúng đắn nhưng phải phối hợp uống Mifepristone liều cao 600 mg trước khi tiêm Methotrexate liều đơn.", "Chỉ định hoàn toàn đúng đắn vì beta-hCG dưới 5.000 mIU/mL và kích thước khối thai dưới 3.5 cm nên đạt hiệu quả cao.", "Chỉ định sai lầm vì beta-hCG vượt quá 3.000 mIU/mL bắt buộc phải mổ mở cắt tử cung toàn phần cấp cứu ngay.", "Chỉ định sai lầm vì hoạt động tim thai dương tính là chống chỉ định tương đối/tuyệt đối làm tăng tỷ lệ thất bại điều trị nội khoa.", "Chỉ định sai lầm vì khối thai vòi trứng chưa vỡ bắt buộc phải phẫu thuật cắt bỏ vòi tử cung để làm giải phẫu bệnh. theo đúng quy trình"], "correct": 3, "traps": [{"key": "A", "trap": "Phác đồ chuẩn MTX liều đơn không bắt buộc dùng Mifepristone 600 mg [guideline_cu]"}, {"key": "B", "trap": "Bỏ qua yếu tố tim thai (+) là tiêu chí chống chỉ định quan trọng của MTX [thieu_cau_phan]"}, {"key": "C", "trap": "beta-hCG 4.200 mIU/mL không có chỉ định mổ cắt tử cung toàn phần [qua_xam_lan]"}, {"key": "E", "trap": "Khối thai chưa vỡ con so có thể xẻ vòi bảo tồn chứ không bắt buộc cắt vòi [qua_xam_lan]"}], "decision": "Khối thai ngoài tử cung + Tim thai (+) trên siêu âm -> Nguy cơ thất bại MTX rất cao (> 30-40%) -> Chống chỉ định tương đối/tuyệt đối của MTX liều đơn -> Bắt buộc chuyển phẫu thuật nội soi.", "explanation": "Theo Bài 10 và ACOG: Sự hiện diện của hoạt động tim thai (+) trên siêu âm là một chống chỉ định tương đối/tuyệt đối cho điều trị Methotrexate liều đơn, vì tỷ lệ thất bại điều trị nội khoa vọt lên rất cao. Trường hợp này phẫu thuật nội soi xẻ vòi/cắt vòi tử cung là lựa chọn ưu tiên an toàn hơn."}, {"id": 55, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 27 tuổi, trễ kinh 6 tuần, ra máu âm đạo ít. Siêu âm ngả âm đạo ghi nhận trong buồng tử cung có một túi dịch hình bầu dục d = 8 mm, nằm chính giữa lòng tử cung, chỉ có một lớp viền phản âm mỏng, không có dấu hiệu màng rụng đôi (Double-decidual sign). Bác sĩ siêu âm kết luận: Thai trong tử cung 5 tuần, cho kê đơn Progesterone dưỡng thai. 3 ngày sau, bệnh nhân đột ngột đau bụng dữ dội, vào viện trong tình trạng sốc mất máu do thai ngoài tử cung vỡ.", "question": "Thẩm định sai sót chuyên môn hình ảnh học dẫn đến hậu quả lâm sàng nghiêm trọng trên?", "options": ["Đọc nhầm túi thai giả dịch tích tụ lòng tử cung thành túi thai thật, bỏ sót khối thai ngoài tử cung đang phát triển.", "Đo sai kích thước túi thai làm tính lùi tuổi thai non hơn so với tuổi thai sinh lý thực tế của sản phụ. theo đúng quy", "Không sử dụng năng lượng Doppler màu để đo vận tốc dòng máu nuôi túi thai trong buồng tử cung.", "Chỉ định kê đơn Progesterone dưỡng thai quá muộn làm túi thai trong tử cung bị bóc tách sẩy ra ngoài.", "Bỏ qua bước thử que thử thai nước tiểu lại tại phòng khám trước khi tiến hành siêu âm ngả âm đạo."], "correct": 0, "traps": [{"key": "B", "trap": "Đo kích thước túi thai không liên quan đến việc bỏ sót thai ngoài tử cung vỡ [sai_tang]"}, {"key": "C", "trap": "Doppler màu túi thai lòng tử cung không giúp phân biệt túi thai giả nếu bỏ qua dấu màng rụng đôi [thieu_cau_phan]"}, {"key": "D", "trap": "Progesterone không cứu được thai ngoài tử cung vỡ [qua_bao_ton]"}, {"key": "E", "trap": "Thử que lại không giúp phân biệt thai trong hay thai ngoài tử cung [bat_tu_khoa]"}], "decision": "Túi dịch lòng tử cung nằm chính giữa + Viền phản âm mỏng + Không có dấu màng rụng đôi -> Túi thai giả (Pseudo-gestational sac) -> Kết luận thai trong tử cung là sai lầm bỏ sót thai ngoài vỡ.", "explanation": "Theo Bài 10: Túi thai giả (Pseudo-gestational sac) gặp trong 10-20% trường hợp thai ngoài tử cung, do đọng máu/dịch trong lòng tử cung, đặc điểm: nằm chính giữa khoang nội mạc, chỉ có một lớp viền phản âm đơn độc. Túi thai thật nằm lệch một bên nội mạc và có dấu hiệu màng rụng đôi (Double-decidual sign). Nhầm lẫn này là cạm bẫy nguy hiểm nhất."}, {"id": 56, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 32 tuổi, thai ngoài tử cung vòi trứng trái chưa vỡ. beta-hCG = 3.100 mIU/mL, khối thai d = 26 mm trên TVS, không có tim thai. Sinh hiệu ổn định. Kết quả xét nghiệm hóa sinh máu: ALT (GPT) = 280 U/L, AST (GOT) = 240 U/L (tăng vọt > 5 lần ngưỡng bình thường). Bác sĩ vẫn tiến hành tiêm Methotrexate liều đơn 50 mg/m2 cho bệnh nhân.", "question": "Thẩm định độ an toàn và tính đúng đắn trong quyết định lâm sàng của bác sĩ?", "options": ["Chỉ định đúng đắn nhưng bắt buộc phải giảm một nửa liều Methotrexate xuống 25 mg/m2 để bảo vệ tế bào gan.", "Chỉ định hoàn toàn hợp lý vì Methotrexate chỉ chuyển hóa qua thận nên không bị ảnh hưởng bởi nồng độ men gan cao. theo đúng quy trình hướng dẫn", "Chỉ định sai lầm nguy hiểm vì suy giảm chức năng gan nặng là chống chỉ định tuyệt đối của Methotrexate do nguy cơ nhiễm độc gan cấp.", "Chỉ định sai lầm vì beta-hCG trên 3.000 mIU/mL bắt buộc phải mổ cắt vòi tử cung chứ không liên quan đến men gan.", "Chỉ định đúng đắn nhưng phải phối hợp tiêm truyền khẩn cấp dung dịch Albumin huyết thanh cùng lúc với tiêm thuốc."], "correct": 2, "traps": [{"key": "A", "trap": "Men gan > 5 lần là chống chỉ định tuyệt đối, không có phác đồ giảm nửa liều MTX [qua_bao_ton]"}, {"key": "B", "trap": "Sai cơ chế vì MTX chuyển hóa và tích lũy trực tiếp gây độc tế bào gan [sai_tang]"}, {"key": "D", "trap": "Ngưỡng beta-hCG dùng MTX là < 5.000 mIU/mL [guideline_cu]"}, {"key": "E", "trap": "Truyền Albumin không giải quyết được độc tính men gan của MTX [thieu_cau_phan]"}], "decision": "Thai ngoài tử cung + Men gan ALT/AST > 5 lần bình thường -> Chống chỉ định tuyệt đối của MTX -> Tiêm MTX gây suy gan cấp tử vong -> Bắt buộc chuyển phẫu thuật nội soi.", "explanation": "Theo Bài 10 và ACOG: Chống chỉ định tuyệt đối của Methotrexate bao gồm: Suy giảm chức năng gan nặng (men gan > 5 lần bình thường), suy thận, suy tủy xương, bệnh phổi cấp, đang cho con bú, huyết động không ổn định. Tiêm MTX khi men gan tăng cao có thể dẫn đến hoại tử tế bào gan cấp tính nguy hiểm tính mạng."}, {"id": 57, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 28 tuổi, thai ngoài tử cung vòi trứng phải chưa vỡ được tiêm MTX liều đơn N1 (beta-hCG N1 = 2.800 mIU/mL). Xét nghiệm lại beta-hCG N4 = 3.200 mIU/mL (tăng nhẹ khoảng 14%). Bệnh nhân hoàn toàn không đau bụng, sinh hiệu ổn định. Bác sĩ trực vội vàng giải thích điều trị nội khoa thất bại và đưa bệnh nhân lên phòng mổ nội soi cắt vòi tử cung cấp cứu.", "question": "Thẩm định tính hợp lý trong quyết định xử trí phẫu thuật của bác sĩ trực?", "options": ["Quyết định sai lầm vì đáng lẽ phải chỉ định nạo hút buồng tử cung chân không trước khi quyết định đưa lên phòng mổ.", "Quyết định hoàn toàn đúng đắn vì beta-hCG N4 tăng chứng tỏ khối thai kháng thuốc Methotrexate bắt buộc phải mổ cắt vòi ngay.", "Quyết định phẫu thuật sai lầm vì đáng lẽ phải tiêm bổ sung ngay liều Methotrexate thứ hai ngay tại thời điểm N4.", "Quyết định đúng đắn vì nồng độ beta-hCG vọt lên trên 3.000 mIU/mL làm khối thai vòi trứng có nguy cơ vỡ ngay lập tức. theo đúng quy trình hướng dẫn lâm sàng chuẩn mực hiện hành", "Quyết định phẫu thuật vội vàng và sai phác đồ vì beta-hCG N4 tăng nhẹ do tế bào nuôi thoái hóa giải phóng hCG, tiêu chuẩn đáp ứng chỉ đánh giá giữa N4 và N7."], "correct": 4, "traps": [{"key": "A", "trap": "Nạo hút buồng tử cung không có vai trò trong theo dõi MTX [qua_xam_lan]"}, {"key": "B", "trap": "Sai lầm phổ biến do không hiểu động học hCG N1-N4 trong phác đồ MTX [guideline_cu]"}, {"key": "C", "trap": "Phác đồ đơn liều chỉ tiêm liều thứ 2 tại N7 nếu beta-hCG N7 giảm < 15% so với N4 [sai_thu_tu]"}, {"key": "D", "trap": "beta-hCG 3.200 mIU/mL khi bệnh nhân không đau bụng chưa phải là chỉ định mổ vỡ [qua_xam_lan]"}], "decision": "Tiêm MTX N1 -> beta-hCG N4 tăng nhẹ sinh lý do tế bào nuôi vỡ phóng thích hCG -> Tiêu chuẩn đáp ứng = beta-hCG N7 giảm >= 15% so với N4 -> Mổ cấp cứu tại N4 là sai phác đồ.", "explanation": "Theo Bài 10: Trong phác đồ MTX liều đơn, nồng độ beta-hCG vào Ngày 4 (N4) thường tăng nhẹ so với Ngày 1 (N1) do các tế bào nuôi bị hoại tử giải phóng hCG vào máu. Đánh giá hiệu quả điều trị bắt buộc dựa vào sự sụt giảm beta-hCG >= 15% giữa Ngày 4 và Ngày 7. Mổ cấp cứu tại N4 khi bệnh nhân không đau bụng là sai lầm lãng phí vòi tử cung."}, {"id": 58, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 26 tuổi, thai ngoài tử cung vòi trứng trái được tiêm MTX liều đơn N1. Vào Ngày 5 (N5) sau tiêm, sản phụ xuất hiện đau trằn nhẹ vùng hạ vị lệch trái kéo dài khoảng 2 giờ. Thăm khám: Sinh hiệu hoàn toàn ổn định (HA 115/75 mmHg, Mạch 76 lần/phút), bụng mềm, ấn tức nhẹ hố chậu trái, không có phản ứng thành bụng. Siêu âm TVS: Khối thai d = 25 mm, dịch túi cùng Douglas = 12 mm. Bác sĩ trực vội vã đẩy bệnh nhân đi mổ nội soi cấp cứu.", "question": "Thẩm định chẩn đoán và tính hợp lý trong quyết định phẫu thuật của bác sĩ trực?", "options": ["Quyết định mổ cấp cứu hoàn toàn đúng đắn vì xuất hiện đau bụng vào Ngày 5 là dấu hiệu chắc chắn vỡ khối thai ngoài tử cung.", "Chẩn đoán nhầm đau bóc tách khối thai sinh lý thành thai vỡ, mổ cấp cứu vội vàng không cần thiết khi sinh hiệu và bụng ổn định.", "Chẩn đoán nhầm viêm ruột thừa cấp kèm theo, đáng lẽ phải tiến hành mổ cắt ruột thừa kết hợp cắt vòi tử cung trái.", "Quyết định mổ đúng đắn nhưng đáng lẽ phải tiến hành mổ mở đường giữa dưới rốn thay vì mổ nội soi để cầm máu.", "Chẩn đoán nhầm tác dụng phụ dị ứng thuốc Methotrexate, đáng lẽ phải tiêm truyền khẩn cấp thuốc kháng Histamin H1."], "correct": 1, "traps": [{"key": "A", "trap": "Đau bóc tách Separation pain xảy ra ở 50% bệnh nhân N3-N7, không phải là thai vỡ nếu sinh hiệu ổn định [nham_dan_so]"}, {"key": "C", "trap": "Không có căn cứ viêm ruột thừa cấp [sai_tang]"}, {"key": "D", "trap": "Mổ mở không cần thiết khi sinh hiệu ổn định [qua_xam_lan]"}, {"key": "E", "trap": "Đau bụng bóc tách không phải phản ứng dị ứng Histamin [bat_tu_khoa]"}], "decision": "Tiêm MTX -> Đau hạ vị N5 + Mạch 76, HA 115/75 + Bụng mềm + Dịch Douglas 12mm -> Đau bóc tách khối thai Separation pain -> Theo dõi & dùng NSAIDs -> Mổ vội là sai lầm.", "explanation": "Theo Bài 10: Khoảng 50% bệnh nhân sau tiêm MTX xuất hiện cơn đau trằn hạ vị vào ngày 3-7 (Separation pain) do sự bong bóc và căng giãn vòi tử cung của khối thai hoại tử. Nếu sinh hiệu ổn định, bụng mềm, dịch Douglas ít, chỉ cần theo dõi và dùng thuốc giảm đau thông thường (NSAIDs), không có chỉ định mổ."}, {"id": 59, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 31 tuổi, thai ngoài tử cung vỡ nhập viện trong tình trạng sốc mất máu nguy kịch: Bệnh nhân lơ mơ, da xanh tái, niêm mạc nhợt nhạt, Mạch 130 lần/phút nhanh nhỏ khó bắt, HA = 60/40 mmHg. Bụng chướng nhẹ, gõ đục vùng thấp, cảm ứng phúc mạc toàn bụng. Bác sĩ trực chỉ định chuyển mổ mở cấp cứu đường giữa dưới rốn ngay lập tức, vừa mổ vừa hồi sức truyền máu hoàn hồi cấp cứu.", "question": "Thẩm định tính đúng đắn và độ an toàn của quyết định chọn phương pháp mổ mở cấp cứu trong tình huống này?", "options": ["Quyết định đúng đắn nhưng bắt buộc phải tiến hành tiêm 01 liều Methotrexate toàn thân trước khi rạch da mổ mở.", "Quyết định sai lầm vì mổ nội soi luôn luôn là tiêu chuẩn vàng bắt buộc áp dụng cho mọi trường hợp thai ngoài tử cung vỡ. theo đúng quy trình hướng dẫn", "Quyết định sai lầm vì đáng lẽ phải hồi sức nâng huyết áp lên 120/80 mmHg hoàn toàn ổn định rồi mới đưa lên phòng mổ.", "Quyết định hoàn toàn chuẩn xác vì bệnh nhân sốc mất máu nặng huyết động không ổn định là chỉ định bắt buộc mổ mở cấp cứu để cầm máu nhanh.", "Quyết định sai lầm vì chỉ cần chọc dò màng bụng hút máu ra rồi tiếp tục theo dõi điều trị nội khoa bảo tồn."], "correct": 3, "traps": [{"key": "A", "trap": "Không tiêm MTX trước mổ cấp cứu [thieu_cau_phan]"}, {"key": "B", "trap": "Mổ nội soi chống chỉ định khi sốc mất máu nặng HA không bắt được do bơm CO2 làm sụt huyết áp tử vong [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Chờ HA 120/80 mới mổ khi đang chảy máu trong ổ bụng sẽ làm bệnh nhân tử vong vì mất máu [qua_bao_ton]"}, {"key": "E", "trap": "Chọc dò hút máu không cầm được gốc chảy máu vòi tử cung vỡ [qua_bao_ton]"}], "decision": "Thai ngoài vỡ + HA = 60/40, Mạch 130 + Sốc mất máu nặng -> Bắt buộc mổ mở đường giữa cấp cứu vừa mổ vừa hồi sức -> Mổ nội soi hoặc chờ HA ổn định là sai lầm tử vong.", "explanation": "Theo Bài 10: Mổ mở cấp cứu đường giữa dưới rốn là chỉ định bắt buộc tuyệt đối khi thai ngoài tử cung vỡ gây choáng mất máu nặng, huyết động không ổn định. Bơm khí CO2 trong mổ nội soi lúc này sẽ làm giảm chèn ép tĩnh mạch về tim, gây trụy mạch tử vong trên bàn mổ."}, {"id": 60, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 24 tuổi, con so, thai ngoài tử cung đoạn bóng vòi tử cung phải d = 25 mm chưa vỡ. Bác sĩ tiến hành mổ nội soi xẻ vòi tử cung bảo tồn (Salpingostomy). Trong lúc phẫu thuật, bác sĩ thực hiện đường rạch dọc ở bờ mạc treo vòi tử cung (mesosalpinx) để lấy khối thai. Ngay lập tức, máu phun ra chảy dữ dội không cầm được, bác sĩ buộc phải chuyển sang cắt bỏ toàn bộ vòi tử cung phải.", "question": "Thẩm định sai sót kỹ thuật phẫu thuật trực tiếp gây ra biến chứng chảy máu không cầm được trên?", "options": ["Rạch sai vị trí ở bờ mạc treo chứa nhiều mạch máu lớn, quy chuẩn kỹ thuật bắt buộc phải rạch ở bờ tự do vô mạch.", "Không tiêm thuốc Methotrexate vào khối thai trước khi rạch vòi tử cung làm mạch máu nuôi thai không bị co thắt.", "Rạch sai chiều vì quy chuẩn bắt buộc phải rạch ngang vuông góc với trục vòi tử cung thay vì rạch dọc.", "Không kẹp cắt hai dây chằng tử cung buồng trứng trước khi rạch làm máu từ động mạch buồng trứng phun ra.", "Chỉ định xẻ vòi sai lầm vì bệnh nhân chưa sinh con nào bắt buộc phải cắt vòi tử cung ngay từ đầu. theo đúng quy trình hướng dẫn"], "correct": 0, "traps": [{"key": "B", "trap": "Không tiêm MTX vào khối thai trước khi xẻ vòi trong phẫu thuật [thieu_cau_phan]"}, {"key": "C", "trap": "Đường rạch xẻ vòi chuẩn là rạch dọc ở bờ tự do antimesenteric border chứ không rạch ngang [sai_thu_tu]"}, {"key": "D", "trap": "Không kẹp dây chằng tử cung buồng trứng khi xẻ vòi [qua_xam_lan]"}, {"key": "E", "trap": "Con so là chỉ định ưu tiên mổ xẻ vòi bảo tồn [qua_xam_lan]"}], "decision": "Mổ xẻ vòi bảo tồn Salpingostomy -> Rạch ở bờ mạc treo mesosalpinx -> Trúng đám rối mạch máu -> Chảy máu dữ dội phải cắt vòi -> Sai kỹ thuật rạch (bắt buộc rạch bờ tự do).", "explanation": "Theo Bài 10: Quy chuẩn kỹ thuật xẻ vòi tử cung bảo tồn (Salpingostomy) là đường rạch dọc nằm ở bờ tự do (antimesenteric border) của vòi tử cung - nơi vô mạch nhất. Rạch ở bờ mạc treo (mesosalpinx) sẽ cắt phạm vào đám rối động mạch vòi tử cung gây chảy máu ồ ạt, buộc phải chuyển sang cắt vòi."}, {"id": 61, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 25 tuổi, mổ nội soi xẻ vòi tử cung trái lấy khối thai bảo tồn (Salpingostomy) cách đây 7 ngày. Định lượng beta-hCG trước mổ = 3.500 mIU/mL. Xét nghiệm beta-hCG Ngày 7 (N7) sau mổ = 2.900 mIU/mL (chỉ giảm khoảng 17% so với trước mổ). Bệnh nhân không đau bụng, âm đạo ra ít máu nâu.", "question": "Thẩm định chẩn đoán biến chứng sau phẫu thuật và chỉ định xử trí tiếp theo chuẩn xác nhất?", "options": ["Nhiễm trùng vết mổ nội soi; chỉ định dùng kháng sinh phổ rộng tĩnh mạch phối hợp thuốc co hồi tử cung.", "Phẫu thuật xẻ vòi thành công; cho bệnh nhân xuất viện và không cần tiếp tục theo dõi nồng độ beta-hCG nữa.", "Thai ngoài tử cung tồn tại; chỉ định tiêm 01 liều Methotrexate toàn thân 50 mg/m2 để tiêu diệt tế bào nuôi sót.", "Tái phát thai ngoài tử cung vòi trứng đối diện; chỉ định mổ nội soi cấp cứu cắt vòi tử cung phải lập tức.", "Bình thường sau mổ; cho uống viên tránh thai kết hợp liều cao để điều hòa lại chu kỳ kinh nguyệt."], "correct": 2, "traps": [{"key": "A", "trap": "Không phải nhiễm trùng vết mổ [sai_tang]"}, {"key": "B", "trap": "Bỏ theo dõi khi beta-hCG N7 giảm < 50% sẽ làm khối thai tồn tại phát triển vỡ [qua_bao_ton]"}, {"key": "D", "trap": "Không có căn cứ thai ngoài vòi đối diện [phan_biet_hep]"}, {"key": "E", "trap": "Uống viên tránh thai không giải quyết được thai ngoài tử cung tồn tại [qua_bao_ton]"}], "decision": "Mổ xẻ vòi bảo tồn -> beta-hCG N7 sau mổ giảm < 50% so với trước mổ -> Thai ngoài tử cung tồn tại (Persistent trophoblast) -> Bắt buộc tiêm bổ sung MTX 50 mg/m2.", "explanation": "Theo Bài 10: Thai ngoài tử cung tồn tại (Persistent trophoblast) xảy ra ở 5-10% các ca mổ xẻ vòi bảo tồn. Tiêu chuẩn chẩn đoán: nồng độ beta-hCG N7 sau mổ giảm dưới 50% so với trước mổ hoặc tăng trở lại. Hướng xử trí chuẩn mực là tiêm bổ sung 01 liều Methotrexate toàn thân 50 mg/m2."}, {"id": 62, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 33 tuổi, PARA 2002 (tiền sử mổ lấy thai 2 lần). Bệnh nhân chậm kinh 6 tuần, đi khám phòng khám tư được chẩn đoán thai sớm và tiến hành nạo hút thai bằng chân không. Ngay trong lúc hút, máu tươi xối ra ào ạt không cầm được, lượng máu mất ước tính > 1.000 mL, bệnh nhân rơi vào trạng thái sốc mất máu HA = 70/40 mmHg. Bệnh nhân được chuyển cấp cứu vào bệnh viện tuyến tỉnh.", "question": "Thẩm định sai lầm chẩn đoán ban đầu tại phòng khám tư dẫn đến tai biến xuất huyết ồ ạt nguy kịch?", "options": ["Bỏ qua bước xét nghiệm nhóm máu ABO và RhD của bệnh nhân trước khi tiến hành thủ thuật.", "Kỹ thuật nạo hút quá thô bạo làm thủng đáy tử cung gây chảy máu từ động mạch buồng trứng.", "Không cho bệnh nhân uống thuốc co hồi tử cung Misoprostol trước khi tiến hành thủ thuật nạo hút thai.", "Sử dụng ống hút thai kích thước quá nhỏ không tống xuất được hết tổ chức thai làm đờ tử cung thứ phát. theo đúng quy trình hướng dẫn lâm sàng", "Bỏ sót chẩn đoán Thai tại sẹo mổ cũ, tự ý nạo hút thai khi chưa kiểm soát mạch máu làm rách gai nhau ăn sâu gây thủng mạch."], "correct": 4, "traps": [{"key": "A", "trap": "Không xét nghiệm nhóm máu không phải nguyên nhân gây xối máu [thieu_cau_phan]"}, {"key": "B", "trap": "Máu xối ào ạt ở vị trí sẹo mổ cũ do mạch máu màng rụng bị xé rách chứ không phải thủng đáy [phan_biet_hep]"}, {"key": "C", "trap": "Misoprostol không ngăn được chảy máu thai sẹo mổ cũ [qua_bao_ton]"}, {"key": "D", "trap": "Ống hút nhỏ không gây chảy máu ào ạt 1.000 mL [sai_tang]"}], "decision": "Mổ mổ cũ 2 lần + Nạo hút thai ngả âm đạo -> Máu xối ào ạt > 1.000 mL -> Thai tại sẹo mổ cũ (CSP) -> Tự ý nạo hút phòng khám tư là sai sót chết người.", "explanation": "Theo Bài 10: Thai tại sẹo mổ cũ (Cesarean scar pregnancy - CSP) là một thể thai ngoài tử cung cực kỳ nguy hiểm. Tự ý nạo hút thai ngả âm đạo khi chưa tắc mạch hoặc chuẩn bị bóng cầm máu sẽ xé rách các mạch máu tăng sinh mất lớp cơ bảo vệ tại vị trí sẹo mổ cũ, gây xuất huyết ồ ạt đe dọa tính mạng."}, {"id": 63, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 34 tuổi, PARA 2002 (mổ lấy thai 2 lần). Thai 7 tuần tại sẹo mổ cũ loại 1 (nội mạc), tim thai dương tính (+), cơ tử cung tại sẹo d = 2,5 mm, tăng sinh mạch máu mạnh. Bệnh nhân được hội chẩn nhập viện thực hiện phác đồ: Tắc mạch động mạch tử cung (UAE) bằng hạt xốp xơ hóa dưới X-quang tăng sáng, sau đó 24 giờ tiến hành hút thai dưới hướng dẫn siêu âm ngả âm đạo và chèn bóng Foley 30 mL trong kênh tử cung cầm máu.", "question": "Thẩm định độ an toàn và hiệu quả của phác đồ can thiệp đa trị liệu này?", "options": ["Phác đồ sai lầm vì chèn bóng Foley kênh tử cung sẽ làm vỡ khối thai sẹo mổ cũ gây chảy máu trong ổ bụng dữ dội.", "Phác đồ hoàn toàn chuẩn xác và tối ưu vì vừa chủ động diệt mạch máu nuôi thai triệt để, vừa lấy thai an toàn bảo tồn tử cung.", "Phác đồ quá mức cần thiết vì chỉ cần cho bệnh nhân uống viên Mifepristone 200 mg dưỡng thai là khối thai tự thoái triển.", "Phác đồ sai lầm vì bắt buộc phải phẫu thuật mổ mở cắt tử cung toàn phần ngay lập tức ở bệnh nhân có tiền sử mổ 2 lần.", "Phác đồ không hợp lý vì tắc mạch động mạch tử cung sẽ gây hoại tử toàn bộ buồng trứng hai bên làm mãn kinh sớm."], "correct": 1, "traps": [{"key": "A", "trap": "Bóng Foley chèn dưới hướng dẫn siêu âm có tác dụng ép cầm máu tại vùng sẹo [phan_biet_hep]"}, {"key": "C", "trap": "Mifepristone đơn thuần không điều trị khỏi CSP có tim thai (+) [qua_bao_ton]"}, {"key": "D", "trap": "Cắt tử cung toàn phần là can thiệp thô bạo không cần thiết khi bệnh nhân còn nguyện vọng bảo tồn [qua_xam_lan]"}, {"key": "E", "trap": "Tắc mạch ĐM tử cung bằng hạt tạm thời không gây hoại tử buồng trứng [sai_tang]"}], "decision": "Thai sẹo mổ cũ CSP type 1 + Tim thai (+) -> UAE tắc mạch ĐM tử cung -> Hút thai dưới US + Chèn bóng Foley 30mL -> Phác đồ đa trị liệu chuẩn mực tối ưu bảo tồn tử cung.", "explanation": "Theo Bài 10: Phác đồ can thiệp Thai tại sẹo mổ cũ (CSP) phối hợp Tắc mạch động mạch tử cung (UAE) trước, sau đó hút thai dưới hướng dẫn siêu âm và chèn bóng Foley kênh tử cung là phác đồ an toàn chuẩn mực nhất hiện nay, giúp triệt tiêu nguy cơ chảy máu ồ ạt và bảo tồn tử cung cho người mẹ."}, {"id": 64, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 29 tuổi, trễ kinh 7 tuần, ra máu tươi âm đạo nhiều. Khám mỏ vịt: Cổ tử cung phồng to hình đồng hồ cát (hình số 8), lỗ ngoài cổ tử cung hé mở thấy tổ chức thai màu tím sẫm, lỗ trong cổ tử cung đóng kín. Siêu âm TVS: Buồng tử cung trống, kênh cổ tử cung phồng to chứa túi thai d = 22 mm có tim thai (+). Bác sĩ tiến hành tiêm Methotrexate tại chỗ kết hợp chèn bóng Foley 30 mL vào kênh cổ tử cung.", "question": "Thẩm định tính hợp lý và hiệu quả cầm máu của thao tác chèn bóng Foley trong kênh cổ tử cung?", "options": ["Thao tác sai lầm vì bắt buộc phải tiến hành nạo vét sạch kênh cổ tử cung bằng thìa sắc trước khi chèn bóng.", "Thao tác sai lầm vì bơm bóng Foley sẽ đẩy khối thai ngược vào lòng tử cung gây vỡ tử cung.", "Thao tác không có giá trị cầm máu, bắt buộc phải phẫu thuật mổ mở thắt động mạch tử cung hai bên lập tức. theo đúng quy trình hướng dẫn lâm sàng chuẩn mực hiện", "Chèn bóng Foley kênh cổ tử cung là thủ thuật cầm máu cơ học chuẩn xác và hiệu quả cao bằng cách ép trực tiếp vào giường gắn nhau thai cổ tử cung.", "Thao tác thô bạo gây hoại tử toàn bộ niêm mạc cổ tử cung dẫn đến dính kênh cổ tử cung hoàn toàn."], "correct": 3, "traps": [{"key": "A", "trap": "Nạo bằng thìa sắc vùng cổ tử cung làm xé rách mạch máu chảy không cầm được [bo_chong_chi_dinh]"}, {"key": "B", "trap": "Bóng Foley nằm dưới lỗ trong không đẩy thai ngược vào lòng tử cung [sai_tang]"}, {"key": "C", "trap": "Thắt ĐM tử cung là phẫu thuật xâm lấn sau khi các biện pháp cơ học thất bại [qua_xam_lan]"}, {"key": "E", "trap": "Chèn bóng 24-48h không gây hoại tử niêm mạc cổ tử cung [bat_tu_khoa]"}], "decision": "Thai cổ tử cung + Cổ tử cung phồng số 8 -> Tiêm MTX tại chỗ + Bơm chèn bóng Foley 30mL kênh CTC -> Cầm máu cơ học trực tiếp chuẩn xác.", "explanation": "Theo Bài 10: Trong thai cổ tử cung (Cervical pregnancy), các mạch máu nuôi thai cắm trực tiếp vào niêm mạc cổ tử cung không có lớp cơ co hồi cầm máu. Chèn bóng Foley 30 mL bơm căng nước cất trong kênh cổ tử cung ép trực tiếp vào giường nhau thai là biện pháp cầm máu cơ học cực kỳ hiệu quả và bảo tồn."}, {"id": 65, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 31 tuổi, trễ kinh 12 tuần. Sản phụ đột ngột đau quặn dữ dội vùng góc phải tử cung rồi ngất xỉu tại nhà. Nhập viện trong tình trạng sốc mất máu cực kỳ nguy kịch: HA = 50/30 mmHg, Mạch = 135 lần/phút. Siêu âm TVS cấp cứu: Khối thai d = 45 mm có tim thai (+) nằm ở góc phải tử cung, lớp cơ tử cung bao quanh khối thai rất mỏng < 2 mm, dịch máu ngập đầy ổ bụng. Bác sĩ mổ mở cấp cứu xén góc tử cung hình chêm (Cornual wedge resection).", "question": "Thẩm định cơ chế giải phẫu sinh học giải thích tại sao thai đoạn kẽ/sừng tử cung thường vỡ muộn và gây mất máu dữ dội hơn thai vòi trứng?", "options": ["Đoạn kẽ được bao bọc bởi lớp cơ tử cung dầy nên thai phát triển lớn muộn mới vỡ, khi vỡ làm rách đám rối động mạch tử cung - buồng trứng gây ngập máu ổ bụng.", "Đoạn kẽ hoàn toàn không có mạch máu nuôi nên khi khối thai vỡ chỉ gây chảy máu rỉ rả không đáng kể vào túi cùng Douglas.", "Thai đoạn kẽ luôn vỡ rất sớm ở tuần thứ 4 đến tuần thứ 6 do vòi tử cung đoạn kẽ có kích thước nhỏ nhất trong các đoạn vòi. theo đúng quy trình hướng dẫn lâm sàng chuẩn", "Thai đoạn kẽ tự thoái triển 100% nhờ sự co bóp của cơ sừng tử cung nên không bao giờ gây biến chứng vỡ ngập máu.", "Do khối thai đoạn kẽ tiết ra hormone hCG làm ức chế hoàn toàn hệ thống đông máu toàn thân của sản phụ."], "correct": 0, "traps": [{"key": "B", "trap": "Đoạn kẽ rất giàu mạch máu từ vòng nối ĐM tử cung và ĐM buồng trứng [sai_tang]"}, {"key": "C", "trap": "Thai đoạn kẽ vỡ muộn tuần 8-16 chứ không vỡ sớm tuần 4-6 [guideline_cu]"}, {"key": "D", "trap": "Thai đoạn kẽ nguy hiểm nhất, vỡ chảy máu ồ ạt chứ không tự thoái triển [qua_bao_ton]"}, {"key": "E", "trap": "hCG không ức chế hệ đông máu toàn thân [bat_tu_khoa]"}], "decision": "Thai đoạn kẽ/sừng tử cung -> Lớp cơ tử cung bao quanh giúp thai lớn 8-16 tuần mới vỡ -> Vỡ rách vòng nối ĐM tử cung - buồng trứng -> Xuất huyết nội cực kỳ dữ dội -> Mổ xén góc chêm Cornual wedge resection.", "explanation": "Theo Bài 10: Thai đoạn kẽ (Interstitial/Cornual pregnancy) nằm ở đoạn vòi đi trong cơ tử cung. Lớp cơ tử cung co giãn tốt giúp thai phát triển muộn đến tuần 8-16 mới vỡ. Khi vỡ, tổn thương xé rách vòng nối mạch máu giàu có giữa động mạch tử cung và động mạch buồng trứng gây mất máu ồ ạt tử vong cực nhanh."}, {"id": 66, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 28 tuổi, mổ nội soi vì thai ngoài tử cung vỡ. Trong mổ ghi nhận: Vòi tử cung hai bên hoàn toàn bình thường và tách rời khỏi khối thai; khối thai d = 30 mm nằm trọn trong nhu mô buồng trứng phải; khối thai dính với tử cung qua dây chằng tử cung - buồng trứng; kết quả mô bệnh học khẳng định nhung mao gai nhau nằm xen kẽ giữa các tế bào nhu mô buồng trứng.", "question": "Thẩm định tên gọi của bộ tiêu chuẩn kinh điển dùng để khẳng định chẩn đoán thai buồng trứng trên ca bệnh này?", "options": ["Tiêu chuẩn Fernandez; tính điểm tiên lượng khả năng thành công của điều trị nội khoa Methotrexate.", "Tiêu chuẩn Arias-Stella; khẳng định sự biến đổi màng rụng tế bào nội mạc tử cung dưới tác động của hormone thai kỳ.", "Tiêu chuẩn Spiegelberg; khẳng định khối thai nằm hoàn toàn trong nhu mô buồng trứng và vòi tử cung nguyên vẹn.", "Tiêu chuẩn Hadlock; tính toán kích thước chiều dài đầu mông CRL để suy ra tuổi thai chính xác.", "Tiêu chuẩn Rotterdam; chẩn đoán hội chứng buồng trứng đa năng dựa trên siêu âm và rối loạn phóng noãn."], "correct": 2, "traps": [{"key": "A", "trap": "Fernandez là bảng điểm tiên lượng MTX [sai_tang]"}, {"key": "B", "trap": "Arias-Stella là phản ứng màng rụng nội mạc tử cung [phan_biet_hep]"}, {"key": "D", "trap": "Hadlock là công thức siêu âm sinh trắc [bat_tu_khoa]"}, {"key": "E", "trap": "Rotterdam là tiêu chuẩn PCOS [sai_tang]"}], "decision": "Khối thai trong buồng trứng + Vòi tử cung bình thường + Dây chằng TC-BT nguyên vẹn + Gai nhau trong nhu mô BT -> Đủ 4 tiêu chuẩn Spiegelberg -> Chẩn đoán Thai buồng trứng.", "explanation": "Theo Bài 10: Thai buồng trứng (Ovarian pregnancy) là thể thai hiếm gặp (0,7-1%). Chẩn đoán xác định bắt buộc dựa vào 4 tiêu chuẩn Spiegelberg: (1) Vòi tử cung bên tổn thương nguyên vẹn; (2) Khối thai nằm ở vị trí buồng trứng; (3) Khối thai nối với tử cung bằng dây chằng tử cung - buồng trứng; (4) Mô bệnh học thấy gai nhau nằm trong nhu mô buồng trứng."}, {"id": 67, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 32 tuổi, vô sinh 4 năm, mang thai sau chuyển 02 phôi nang IVF. Thai 7 tuần, xuất hiện đau râm râm hố chậu phải. Siêu âm TVS: Buồng tử cung có 01 thai sống CRL = 10 mm, tim thai (+) 140 ck/p. Đồng thời cạnh buồng trứng phải có 01 khối thai ngoài tử cung d = 28 mm có tim thai (+) 130 ck/p, không có dịch ổ bụng. Bác sĩ tư vấn chỉ định tiêm Methotrexate toàn thân để điều trị khối thai ngoài.", "question": "Thẩm định sai lầm nghiêm trọng trong tư vấn chỉ định điều trị Methotrexate toàn thân của bác sĩ?", "options": ["Chỉ định sai lầm vì thai đôi dị vị tự thoái triển hoàn toàn 100% không cần can thiệp bất kỳ thủ thuật nào.", "Chỉ định hoàn toàn đúng đắn vì Methotrexate tiêu diệt khối thai ngoài tử cung mà không gây ảnh hưởng gì đến thai trong buồng tử cung. theo đúng quy", "Chỉ định sai lầm vì bắt buộc phải phẫu thuật mổ mở cắt tử cung toàn phần để loại bỏ khối thai ngoài tử cung khẩn cấp.", "Chỉ định đúng đắn nhưng phải phối hợp nạo hút buồng tử cung ngay lập tức để lấy thai trong tử cung ra trước.", "Chỉ định Methotrexate toàn thân sai lầm tuyệt đối vì thuốc sẽ gây chết thai và dị tật nặng nề cho thai trong buồng tử cung đang sống."], "correct": 4, "traps": [{"key": "A", "trap": "Thai ngoài có tim thai (+) không tự thoái triển [qua_bao_ton]"}, {"key": "B", "trap": "MTX qua nhau thai gây chết thai và quái thai thai trong buồng tử cung [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Cắt tử cung toàn phần làm mất thai trong tử cung oan uổng [qua_xam_lan]"}, {"key": "D", "trap": "Nạo hút buồng tử cung phá hủy thai trong tử cung [qua_xam_lan]"}], "decision": "Thai đôi dị vị Heterotopic (1 thai trong TC + 1 thai ngoài TC) -> Tiêm MTX toàn thân là CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI vì độc cho thai trong -> Bắt buộc mổ nội soi xẻ/cắt vòi bảo tồn thai trong.", "explanation": "Theo Bài 10: Thai đôi dị vị (Heterotopic pregnancy) có tỷ lệ 1/100 ở bệnh nhân làm IVF. Điều trị bằng Methotrexate toàn thân là CHỐNG CHỈ ĐỊNH TUYỆT ĐỐI do MTX gây độc tế bào và dị tật quái thai cho thai trong tử cung đang sống. Phương pháp chuẩn là phẫu thuật nội soi xẻ/cắt vòi tử cung lấy khối thai ngoài và bảo tồn thai trong."}, {"id": 68, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Sản phụ 30 tuổi, thai trong ổ bụng thứ phát 32 tuần. Bệnh nhân được chỉ định mổ mở cấp cứu lấy thai do thai suy. Trong mổ: Thai nhi nằm trong khoang phúc mạc được lấy ra an toàn nặng 1.800g. Bánh nhau bám rất chặt và lan rộng trên bề mặt động mạch chủ bụng và các quai ruột non. Phẫu thuật viên cố sức dùng tay bóc tách bánh nhau ra khỏi bề mặt ruột. Ngay lập tức, máu phun ra xối xả không thể cầm được.", "question": "Thẩm định sai lầm kỹ thuật phẫu thuật gây ra tai biến xuất huyết tử vong trên bàn mổ?", "options": ["Không cho bệnh nhân tiêm Oxytocin liều cao vào tĩnh mạch trước khi bắt đầu phẫu thuật rạch da bụng.", "Cố tình bóc tách bánh nhau bám vào các cơ quan sống, quy chuẩn bắt buộc là kẹp cắt dây rốn sát bánh nhau và để lại bánh nhau tự thoái triển.", "Rạch nhầm vào bánh nhau làm mạch máu thai nhi bị rách gây tử vong cho thai nhi ngay trong bụng mẹ. theo đúng quy trình hướng dẫn lâm sàng chuẩn mực hiện hành", "Không tiến hành thắt động mạch tử cung hai bên trước khi lấy thai nhi ra khỏi khoang bụng.", "Chỉ định mổ lấy thai quá muộn khiến bánh nhau ăn sâu xuyên thấu qua thành ruột non vào lòng ruột."], "correct": 1, "traps": [{"key": "A", "trap": "Oxytocin không có tác dụng co hồi mạch máu bám trên quai ruột và ĐM chủ [sai_tang]"}, {"key": "C", "trap": "Sai lầm ở đây là cố bóc bánh nhau sau khi đã lấy thai [sai_thu_tu]"}, {"key": "D", "trap": "Thắt ĐM tử cung không cầm được máu bánh nhau bám trên quai ruột và ĐM chủ [thieu_cau_phan]"}, {"key": "E", "trap": "Mổ 32 tuần vì thai suy là chỉ định hợp lý [qua_xam_lan]"}], "decision": "Thai trong ổ bụng tiến triển -> Bánh nhau bám trên quai ruột & ĐM chủ -> Bóc bánh nhau gây xé rách mạch máu lớn tử vong -> Bắt buộc kẹp cắt rốn để lại bánh nhau + Dùng MTX thoái triển.", "explanation": "Theo Bài 10: Trong phẫu thuật thai trong ổ bụng (Abdominal pregnancy), nếu bánh nhau bám vào các cơ quan quan trọng (ruột, mạc treo, mạch máu lớn), CẤM TUYỆT ĐỐI không được bóc tách bánh nhau vì sẽ gây chảy máu ồ ạt không cầm được. Quy chuẩn: kẹp cắt dây rốn sát bánh nhau, để lại bánh nhau tại chỗ và theo dõi thoái triển tự nhiên hoặc hỗ trợ bằng MTX."}, {"id": 69, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 27 tuổi, trễ kinh 5 ngày, ra ít dịch nâu âm đạo. Bệnh nhân hoàn toàn không đau bụng, sinh hiệu ổn định. Xét nghiệm beta-hCG Lần 1 = 650 mIU/mL, Lần 2 (sau 48h) = 420 mIU/mL (giảm 35%). Siêu âm TVS: Buồng tử cung trống, khối phản âm hỗn hợp cạnh buồng trứng trái d = 15 mm, không tim thai, không dịch ổ bụng. Bác sĩ quyết định theo dõi thoái triển tự nhiên (Expectant management), không dùng thuốc và không phẫu thuật.", "question": "Thẩm định tính hợp lý và độ an toàn của quyết định theo dõi thoái triển tự nhiên trên bệnh nhân này?", "options": ["Quyết định đúng đắn nhưng phải phối hợp cho uống thuốc co hồi tử cung Misoprostol để tống xuất khối thai qua đường âm đạo.", "Quyết định sai lầm vì mọi trường hợp thai ngoài tử cung đã xác định bắt buộc phải tiêm Methotrexate liều đơn ngay lập tức.", "Quyết định sai lầm vì beta-hCG giảm chứng tỏ khối thai đang vỡ rỉ rả bắt buộc phải mổ nội soi cắt vòi tử cung cấp cứu.", "Quyết định hoàn toàn chuẩn xác vì beta-hCG thấp dưới 1.000 mIU/mL và đang tự giảm xu hướng thoái triển, lâm sàng hoàn toàn ổn định.", "Quyết định sai lầm vì bắt buộc phải chỉ định nạo hút buồng tử cung chân không chẩn đoán trước khi cho bệnh nhân theo dõi."], "correct": 3, "traps": [{"key": "A", "trap": "Misoprostol không tống xuất được thai vòi trứng qua đường âm đạo [bo_chong_chi_dinh]"}, {"key": "B", "trap": "Không phải mọi trường hợp đều phải tiêm MTX nếu hCG < 1.000 mIU/mL đang tự giảm [qua_xam_lan]"}, {"key": "C", "trap": "beta-hCG giảm xu hướng thoái triển không phải dấu hiệu vỡ [phan_biet_hep]"}, {"key": "E", "trap": "Nạo hút buồng tử cung không có chỉ định khi hCG đang giảm [qua_xam_lan]"}], "decision": "Thai ngoài tử cung + Không đau bụng + beta-hCG < 1.000 mIU/mL đang giảm 35% + Khối thai < 2cm -> Đủ tiêu chuẩn Theo dõi thoái triển tự nhiên Expectant management -> Không cần MTX hay phẫu thuật.", "explanation": "Theo Bài 10: Theo dõi thoái triển tự nhiên (Expectant management) chỉ định khi: (1) Lâm sàng không đau bụng, sinh hiệu ổn định; (2) beta-hCG ban đầu thấp < 1.000 mIU/mL và đang có xu hướng giảm tự nhiên; (3) Khối thai < 2 cm, không tim thai, không dịch ổ bụng. Tỷ lệ thoái triển thành công tự nhiên đạt 70-80% mà không cần MTX hay phẫu thuật."}, {"id": 70, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân nữ 22 tuổi, chưa lập gia đình, đột ngột đau nhói hạ vị lệch phải sau khi tập thể thao nặng. Bệnh nhân vào viện trong tình trạng đau bụng nhiều, da niêm mạc hơi nhợt, Mạch 92 lần/phút, HA 105/65 mmHg. Siêu âm TVS: Buồng tử cung kích thước bình thường, buồng trứng phải có khối nang d = 35 mm bờ không đều chứa phản âm hỗn hợp dạng mạng lưới sợi, dịch túi cùng Douglas d = 25 mm. Xét nghiệm beta-hCG huyết thanh = 0,5 mIU/mL (âm tính). Bác sĩ trực chuẩn bị mổ cấp cứu chẩn đoán thai ngoài tử cung vỡ.", "question": "Thẩm định sai lầm chẩn đoán của bác sĩ trực khi bỏ qua kết quả xét nghiệm định lượng beta-hCG?", "options": ["Chẩn đoán nhầm Nang hoàng thể xuất huyết vỡ thành Thai ngoài tử cung vỡ vì beta-hCG âm tính hoàn toàn loại trừ thai ngoài tử cung.", "Chẩn đoán hoàn toàn đúng đắn vì dịch túi cùng Douglas 25 mm kèm khối phản âm cạnh buồng trứng là tiêu chuẩn vàng thai vỡ. theo đúng quy", "Chẩn đoán nhầm Viêm ruột thừa cấp vỡ mủ vì khối phản âm nằm ở hố chậu phải kèm dịch tự do ổ bụng.", "Chẩn đoán đúng nhưng bắt buộc phải tiến hành tiêm Methotrexate liều đơn trước khi đưa bệnh nhân vào phòng mổ.", "Chẩn đoán nhầm Thai trong tử cung sẩy hoàn toàn gây ngập máu ổ bụng do vỡ mạch máu dây rốn."], "correct": 0, "traps": [{"key": "B", "trap": "beta-hCG âm tính loại trừ 100% thai ngoài tử cung hoạt động [bo_chong_chi_dinh]"}, {"key": "C", "trap": "Hình ảnh siêu âm nang xuất huyết mạng lưới sợi và beta-hCG âm tính hướng đến Nang hoàng thể vỡ [phan_biet_hep]"}, {"key": "D", "trap": "beta-hCG âm tính tuyệt đối không dùng MTX [bo_chong_chi_dinh]"}, {"key": "E", "trap": "Sẩy thai hoàn toàn không gây vỡ ngập máu ổ bụng [sai_tang]"}], "decision": "Đau hố chậu phải + Khối nang buồng trứng mạng lưới sợi + Dịch Douglas 25mm + beta-hCG = 0.5 mIU/mL (Âm tính) -> Chẩn đoán Nang hoàng thể xuất huyết vỡ -> beta-hCG âm tính loại trừ Thai ngoài tử cung vỡ -> Mổ thai ngoài là sai sót.", "explanation": "Theo Bài 10: Định lượng beta-hCG huyết thanh có độ nhạy 99-100% trong chẩn đoán thai ngoài tử cung. Khi beta-hCG âm tính (< 5 mIU/mL), chẩn đoán thai ngoài tử cung bị LOẠI TRỪ hoàn toàn. Bệnh cảnh đau bụng + dịch ổ bụng + khối buồng trứng mạng lưới sợi ở phụ nữ beta-hCG âm tính là đặc trưng của Nang hoàng thể xuất huyết vỡ (Ruptured corpus luteum cyst)."}, {"id": 71, "part": 2, "bloom": "Mức 5 Thẩm định", "stem": "Bệnh nhân 25 tuổi, vào viện vì đau hạ vị liên tục 3 ngày kèm sốt 38.5°C, khí hư âm đạo màu vàng đục hôi. Khám phụ khoa: Cổ tử cung lắc rất đau (Chandelier sign +), hai phần phụ dày ấn đau chói. Định lượng beta-hCG = 1,2 mIU/mL (âm tính). Bạch cầu máu = 16.000/mm³ (Neutrophil 85%). Bác sĩ trực chẩn đoán Thai ngoài tử cung rỉ máu và chỉ định mổ nội soi cấp cứu.", "question": "Thẩm định sai lầm chẩn đoán lâm sàng của bác sĩ trực đối với bệnh nhân này?", "options": ["Chẩn đoán nhầm Viêm ruột thừa cấp vì bạch cầu tăng cao và bệnh nhân có đau hạ vị liên tục kéo dài 3 ngày.", "Chẩn đoán hoàn toàn đúng đắn vì cổ tử cung lắc đau và hai phần phụ dày là tiêu chuẩn vàng chẩn đoán thai vòi trứng.", "Chẩn đoán nhầm Viêm phần phụ cấp thành Thai ngoài tử cung vì beta-hCG âm tính và có dấu hiệu sốt cao kèm khí hư mủ.", "Chẩn đoán đúng nhưng bắt buộc phải tiến hành nạo hút buồng tử cung chẩn đoán trước khi tiến hành mổ n
