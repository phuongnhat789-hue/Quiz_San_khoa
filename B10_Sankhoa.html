  <script>
    // DỮ LIỆU CHUẨN 100% TỪ HAI FILE WORD GỐC ĐÃ ĐƯỢC RÀ SOÁT TỪNG CA VÀ SHUFFLE ĐỀU
    const QUESTIONS = [{"id": 1, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 31 tuổi, PARA 1011, tiền sử phẫu thuật vi phẫu phục hồi vòi tử cung trái cách đây 2 năm do tắc vòi sau nhiễm trùng khung chậu. Bệnh nhân vào viện vì trễ kinh 6 tuần, ra máu âm đạo rỉ rả màu nâu đen 3 ngày nay kèm đau tức âm ỉ vùng hạ vị lệch trái. Sinh hiệu: HA 115/70 mmHg, Mạch 78 lần/phút, Thân nhiệt 36.8°C. Khám phụ khoa: Tử cung hơi to mềm, phần phụ trái ấn đau chói nhẹ và sờ thấy khối nhỏ mềm ranh giới không rõ. Cận lâm sàng: beta-hCG = 1.850 mIU/mL. Siêu âm TVS: Buồng tử cung trống, cạnh buồng trứng trái có khối echo hỗn hợp kích thước 22 x 16 mm.", "question": "Yếu tố nguy cơ có tỷ lệ rủi ro tương đối cao nhất gây ra thai lạc chỗ ở bệnh nhân này và cơ chế sinh bệnh tương ứng là gì?", "options": ["Tuổi mẹ trên 30 tuổi, làm suy giảm chất lượng noãn bào và rối loạn co bóp cơ tử cung", "Tiền sử nạo hút thai 1 lần, làm tổn thương lớp màng rụng nội mạc tử cung gây cản trở phôi làm tổ", "Tiền sử phẫu thuật can thiệp vòi tử cung, phá hủy biểu mô lông chuyển và gây chít hẹp lòng vòi", "Tình trạng căng thẳng tâm lý mạn tính, làm tăng tiết cortisol gây rối loạn nhu động vòi tử cung", "Sử dụng thuốc tránh thai đường uống kết hợp kéo dài, làm teo niêm mạc vòi tử cung và buồng tử cung"], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] Tuổi mẹ > 30 là yếu tố nguy cơ chung nhưng OR thấp hơn nhiều so với phẫu thuật vòi tử cung (OR > 9 - 21)"}, {"key": "B", "trap": "[phan_biet_hep] Nạo hút thai cũ chỉ là yếu tố nguy cơ nhẹ, không phải nguyên nhân trực tiếp làm tắc cơ học vòi tử cung"}, {"key": "D", "trap": "[bat_tu_khoa] Căng thẳng tâm lý không phải là yếu tố nguy cơ sinh học được ghi nhận trong giáo trình"}, {"key": "E", "trap": "[bo_chong_chi_dinh] Thuốc tránh thai kết hợp làm giảm nguy cơ thai ngoài tử cung do ức chế rụng trứng"}], "decision": "Tiền sử mổ phục hồi vòi tử cung + Trễ kinh 6w + Ra máu nâu + beta-hCG 1.850 mIU/mL + Khối phần phụ -> Yếu tố nguy cơ cao nhất là phẫu thuật vòi tử cung (OR > 9) -> Tổn thương lông chuyển và sẹo hẹp lòng vòi tử cung.", "explanation": "Theo Giáo trình Sản khoa Sau đại học - Bài 10: Thai lạc chỗ, tiền sử phẫu thuật can thiệp trên vòi tử cung (mổ tái tạo, nối vòi, xẻ vòi) là yếu tố nguy cơ hàng đầu với nguy cơ tương đối OR vọt cao gấp 9 - 21 lần. Phẫu thuật làm mất đi lớp tế bào biểu mô có lông chuyển sinh lý và tạo sẹo dính hẹp lòng vòi, làm phôi nang bị kẹt lại không về được buồng tử cung."}, {"id": 2, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 28 tuổi, PARA 0000, trễ kinh 12 ngày (chu kỳ kinh đều 28 ngày). Bệnh nhân đến khám vì 3 ngày nay xuất hiện ra máu âm đạo ít, máu màu nâu đen rỉ rả liên tục, không đóng thành cục, kèm đau tức âm ỉ vùng hố chậu bên phải. Thăm khám lâm sàng: Sinh hiệu ổn định, Mạch 76 lần/phút, HA 110/70 mmHg, Thân nhiệt 36.9°C. Bụng mềm, ấn tức nhẹ hố chậu phải, không có phản ứng thành bụng. Khám mỏ vịt: Cổ tử cung khép kín, có ít máu nâu ở cùng đồ sau. Khám hai tay: Tử cung to nhẹ mật độ mềm, phần phụ phải sờ thấy khối nhỏ mềm kích thước khoảng 2 cm, ấn đau nhẹ.", "question": "Tam chứng lâm sàng kinh điển được ghi nhận đầy đủ trên bệnh nhân này bao gồm những triệu chứng nào?", "options": ["Đau nhói đột ngột như dao đâm, choáng vã mồ hôi và túi cùng Douglas phồng đau chói", "Trễ kinh, nôn mửa dữ dội kéo dài và sốt cao rét run kèm đau tức hạ vị", "Ra máu đỏ tươi lượng nhiều kèm cục máu đông, vỡ ối sớm và đau bụng từng cơn dồn dập", "Trễ kinh, tử cung to nhanh vượt tuổi thai và xuất hiện hai khối u nang hoàng tuyến hai bên", "Trễ kinh, ra máu âm đạo nâu đen rỉ rả không đông và đau bụng dưới âm ỉ lệch bên"], "correct": 4, "traps": [{"key": "A", "trap": "[qua_muc] Đau dao đâm và choáng phồng túi cùng là lâm sàng của thai ngoài tử cung THỂ VỠ NGẬP MÁU, không phải thể chưa vỡ"}, {"key": "B", "trap": "[phan_biet_hep] Nôn mửa nghén nặng và sốt cao là biểu hiện của thai trứng hoặc sẩy thai nhiễm khuẩn"}, {"key": "C", "trap": "[nham_dan_so] Ra máu đỏ tươi nhiều có cục máu đông là lâm sàng của sẩy thai đang tiến triển"}, {"key": "D", "trap": "[bat_tu_khoa] Tử cung to nhanh và nang hoàng tuyến là lâm sàng điển hình của bệnh nguyên bào nuôi"}], "decision": "Trễ kinh 12 ngày + Ra máu nâu đen rỉ rả không đông + Đau hố chậu phải âm ỉ + Sinh hiệu ổn định -> Tam chứng kinh điển thai ngoài tử cung CHƯA VỠ -> Trễ kinh, ra máu nâu rỉ rả, đau bụng dưới lệch bên.", "explanation": "Tam chứng lâm sàng kinh điển của thai ngoài tử cung thể chưa vỡ gồm: (1) Trễ kinh / Vô kinh; (2) Ra máu âm đạo bất thường (máu màu nâu đen, rỉ rả, ít một, không đông); (3) Đau bụng dưới (đau âm ỉ một bên hố chậu). Phương án E mô tả thể vỡ ngập máu ổ bụng."}, {"id": 3, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 29 tuổi, trễ kinh 5 tuần, được chẩn đoán thai ngoài tử cung và tiến hành phẫu thuật nội soi ổ bụng thám sát. Trong mổ quan sát thấy: Tử cung kích thước bình thường. Vòi tử cung bên phải ở đoạn giữa bóng vòi phồng to kích thước 3 x 2.5 cm, màu tím sẫm, chưa vỡ, không thấy máu chảy qua loa vòi. Vòi tử cung trái và hai buồng trứng hình thể bình thường, không dính. Phẫu thuật viên tiến hành xẻ vòi tử cung phải hút tống xuất khối thai bảo tồn vòi tử cung thành công.", "question": "Đoạn bóng vòi tử cung chiếm tỷ lệ bao nhiêu trong tổng số các trường hợp thai lạc chỗ ở vòi tử cung?", "options": ["Khoảng 12 đến 15 phần trăm tổng số trường hợp thai ngoài tử cung", "Khoảng 75 đến 80 phần trăm tổng số trường hợp thai ngoài tử cung", "Khoảng 5 phần trăm tổng số trường hợp thai ngoài tử cung", "Khoảng 2 đến 3 phần trăm tổng số trường hợp thai ngoài tử cung", "Khoảng 0.5 phần trăm tổng số trường hợp thai ngoài tử cung"], "correct": 1, "traps": [{"key": "A", "trap": "[phan_biet_hep] 12% là tỷ lệ thai làm tổ ở đoạn eo vòi tử cung"}, {"key": "C", "trap": "[nham_dan_so] 5% là tỷ lệ thai làm tổ ở đoạn loa vòi tử cung"}, {"key": "D", "trap": "[bat_tu_khoa] 2-3% là tỷ lệ thai làm tổ ở đoạn kẽ / sừng tử cung"}, {"key": "E", "trap": "[qua_muc] < 1% là tỷ lệ thai ở cổ tử cung hoặc buồng trứng"}], "decision": "Khối thai làm tổ ở đoạn bóng vòi tử cung -> Tỷ lệ vị trí làm tổ phổ biến nhất -> Đoạn bóng chiếm 75 - 80% thai ngoài tử cung.", "explanation": "Theo Giáo trình Sản khoa Sau đại học - Bài 10: Vòi tử cung là vị trí làm tổ phổ biến nhất (chiếm > 95% thai lạc chỗ). Trong đó, đoạn bóng vòi tử cung chiếm tỷ lệ cao nhất từ 75% - 80%, tiếp theo là đoạn eo (12%), đoạn loa vòi (5%) và đoạn kẽ / sừng tử cung (2-3%)."}, {"id": 4, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 26 tuổi, trễ kinh 6 tuần, đột ngột đau quặn dữ dội vùng hạ vị như dao đâm, sau đó vã mồ hôi, choáng váng và ngất xỉu tại nhà được gia đình đưa vào cấp cứu. Thăm khám lúc vào viện: Bệnh nhân lơ mơ, da xanh tái, niêm mạc nhợt nhạt, chi lạnh. Mạch 125 lần/phút nhỏ khó bắt, Huyết áp tụt 75/40 mmHg. Khám bụng: Bụng chướng nhẹ, cảm ứng phúc mạc toàn bụng, gõ đục vùng thấp. Khám âm đạo: Cổ tử cung khép, lắc cổ tử cung bệnh nhân đau chói, túi cùng sau Douglas phồng căng và ấn đau dữ dội (tiếng kêu Douglas). Siêu âm cấp cứu tại giường: Máu ngập ổ bụng lượng nhiều, tử cung trống, phần phụ phải có khối vỡ.", "question": "Chẩn đoán lâm sàng cấp cứu và chiến lược xử trí sản khoa tối khẩn nào cần được thực hiện ngay lập tức?", "options": ["Vỡ u nang buồng trứng chảy máu, chỉ định nạo buồng tử cung chẩn đoán và truyền khối hồng cầu lắng", "Thai ngoài tử cung chưa vỡ, chỉ định tiêm Methotrexate nội khoa liều đơn và theo dõi sát huyết động", "Sẩy thai băng huyết choáng mất máu, chỉ định nạo hút chân không buồng tử cung cấp cứu tại phòng thủ thuật", "Thai ngoài tử cung vỡ ngập máu ổ bụng gây sốc mất máu, chuyển mổ mở cấp cứu cầm máu ngay vừa mổ vừa hồi sức", "Viêm phúc mạc toàn thể do vỡ ruột thừa, chỉ định điều trị kháng sinh phổ rộng tĩnh mạch 24 giờ rồi mới mổ theo đúng quy trình hướng dẫn lâm sàng chuẩn mực"], "correct": 3, "traps": [{"key": "A", "trap": "[phan_biet_hep] Nạo buồng tử cung trong vỡ u nang buồng trứng là can thiệp sai lầm tốn thời gian vàng"}, {"key": "B", "trap": "[bo_chong_chi_dinh] Tiêm MTX khi bệnh nhân đang sốc HA 75/40 mmHg là chống chỉ định tuyệt đối gây tử vong"}, {"key": "C", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được nguồn chảy máu ở vòi tử cung vỡ trong ổ bụng"}, {"key": "E", "trap": "[qua_bao_ton] Hoãn mổ 24h ở bệnh nhân đang chảy máu trong ổ bụng cấp tính sẽ làm bệnh nhân tử vong"}], "decision": "Sốc HA 75/40, M 125 + Cảm ứng phúc mạc + Douglas phồng đau chói + Siêu âm máu ngập ổ bụng -> Thai ngoài tử cung vỡ ngập máu ổ bụng gây sốc mất máu -> Bắt buộc Mổ mở cấp cứu cầm máu vừa mổ vừa hồi sức.", "explanation": "Bệnh nhân có triệu chứng choáng mất máu nặng (HA 75/40 mmHg, mạch 125), túi cùng Douglas phồng đau chói và siêu âm tràn máu ổ bụng lượng nhiều -> Thai ngoài tử cung vỡ ngập máu ổ bụng. Chỉ định tối khẩn: Chuyển ngay lên phòng mổ mở cấp cứu để kẹp kẹp cầm máu vòi tử cung vỡ, đồng thời lập đường truyền xả dịch và truyền máu khẩn cấp (vừa mổ vừa hồi sức)."}, {"id": 5, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 33 tuổi, tiền sử trễ kinh khoảng 2 tháng kèm ra máu âm đạo rỉ rả kéo dài 3 tuần nay. Bệnh nhân từng có cơn đau bụng cấp cách đây 2 tuần nhưng tự uống thuốc giảm đau ở nhà. Hiện tại bệnh nhân vào viện vì đau tức nặng liên tục vùng hạ vị, mệt mỏi, sốt nhẹ 37.8°C và mót rặn đi cầu nhiều lần. Thăm khám: Da niêm mạc nhạt, Mạch 84 lần/phút, HA 110/70 mmHg. Khám bụng: Vùng hạ vị sờ thấy một khối chắc ranh giới không rõ, ấn đau nhẹ. Khám âm đạo bằng hai tay: Tử cung bị đẩy lệch ra trước sát xương vệ; túi cùng sau Douglas sờ thấy một khối chắc, không di động, ấn đau chói nhẹ, thâm nhiễm rộng ra hai bên dây chằng rộng.", "question": "Thể lâm sàng thai ngoài tử cung đặc biệt nào cần được nghĩ đến đầu tiên ở bệnh nhân này?", "options": ["Thai ngoài tử cung thể bọc huyết tụ tiểu khung do thai sẩy rỉ rả được mạc nối và ruột bao bọc", "Thai ngoài tử cung thể vỡ cấp tính ngập máu toàn bộ ổ bụng theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung thể tiến triển bình thường trong tử cung", "Ung thư niêm mạc tử cung di căn xâm lấn toàn bộ khung chậu", "U xơ tử cung hoại tử vô khuẩn gây phản ứng viêm phúc mạc"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_muc] Thể vỡ cấp tính sẽ gây choáng mất máu dữ dội và phản ứng thành bụng toàn bộ, không tạo khối chắc thâm nhiễm"}, {"key": "C", "trap": "[sai_tang] Bệnh nhân có khối ở túi cùng sau đẩy tử cung ra trước, không phải thai trong tử cung"}, {"key": "D", "trap": "[nham_dan_so] Tiền sử trễ kinh và đau bụng rỉ rả gợi ý bệnh lý thai nghén hơn là ung thư di căn"}, {"key": "E", "trap": "[phan_biet_hep] U xơ hoại tử không giải thích được tiền sử trễ kinh và ra máu rỉ rả kéo dài 3 tuần"}], "decision": "Trễ kinh 2 tháng + Đau bụng rỉ rả 3w + Đau cấp cách 2w + Tử cung bị đẩy ra trước + Khối chắc thâm nhiễm túi cùng Douglas + Mót rặn -> Bọc huyết tụ tiểu khung (Pelvic hematocele) do thai ngoài sẩy / vỡ rỉ rả được ruột và mạc nối bao bọc.", "explanation": "Thai ngoài tử cung thể bọc huyết tụ tiểu khung (Pelvic hematocele) hình thành do khối thai ngoài vỡ hoặc sẩy rỉ rả lượng máu ít, được mạc nối lớn, các quai ruột và phúc mạc bao bọc lại ở túi cùng Douglas tạo thành một khối máu tụ cũ. Khối này dính chặt, đẩy tử cung ra trước và chèn ép trực tràng gây triệu chứng mót rặn đi cầu."}, {"id": 6, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 30 tuổi, PARA 1001, trễ kinh 10 tuần. Sản phụ đột ngột đau dữ dội vùng hạ vị và ngất xỉu. Khi vào viện: Mạch 130 lần/phút, HA 70/40 mmHg, da xanh niêm mạc nhạt chanh. Siêu âm TVS: Buồng tử cung trống, lớp cơ tử cung vùng sừng phải bị mỏng còn 1.5 mm, vách túi thai nằm hoàn toàn trong lớp cơ đoạn kẽ tử cung với kích thước túi thai d = 35 mm có phôi thai và tim thai (+). Khảo sát Doppler thấy mạng lưới mạch máu nuôi phong phú từ động mạch tử cung và động mạch buồng trứng quanh túi thai. Ổ bụng tràn ngập máu.", "question": "Đặc điểm giải phẫu học và nguy cơ lâm sàng đặc thù của thai làm tổ ở đoạn kẽ tử cung là gì?", "options": ["Thai nằm ở cổ tử cung nên luôn luôn tự tống xuất ra ngoài đường âm đạo mà không gây vỡ cơ theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai nằm ở đầu loa vòi nên dễ tự sẩy hoàn toàn vào ổ bụng mà không gây chảy máu", "Thai nằm trong lớp cơ tử cung được mạch máu nuôi phong phú nên vỡ muộn ở tuần 12 đến 16 gây chảy máu cực kỳ ồ ạt", "Thai nằm trong dây chằng rộng nên hoàn toàn không ảnh hưởng đến hệ thống mạch máu tử cung", "Thai nằm ở vùng đáy tử cung nên phát triển bình thường đến đủ tháng như thai trong buồng"], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] Mô tả thai ở cổ tử cung, không phải thai đoạn kẽ"}, {"key": "B", "trap": "[sai_tang] Đoạn kẽ là đoạn vòi tử cung nằm trong cơ tử cung, không phải đoạn loa vòi"}, {"key": "D", "trap": "[bat_tu_khoa] Đoạn kẽ nhận máu nuôi từ cả đm tử cung và đm buồng trứng nên chảy máu rất nặng khi vỡ"}, {"key": "E", "trap": "[qua_bao_ton] Thai đoạn kẽ nằm ngoài khoang nội mạc, cơ tử cung giãn mỏng sẽ bị vỡ nguy hiểm"}], "decision": "Thai đoạn kẽ sừng tử cung 10w + Cơ tử cung bao quanh < 2 mm + Tràn máu ổ bụng -> Mạch máu nuôi phong phú (đm tử cung + đm buồng trứng) + Cơ tử cung giãn nở tốt -> Vỡ muộn (tuần 12-16) gây chảy máu cực kỳ ồ ạt.", "explanation": "Đoạn kẽ (interstitial segment) là đoạn vòi tử cung đi xuyên qua lớp cơ tử cung. Do được lớp cơ tử cung bao bọc nên thai đoạn kẽ có thể phát triển lớn hơn và vỡ muộn hơn (tuần 12 - 16) so với các đoạn khác của vòi tử cung. Tuy nhiên, vì vùng kẽ nhận nguồn máu nuôi dồi dào từ vòng nối động mạch tử cung và động mạch buồng trứng nên khi vỡ sẽ gây chảy máu cực kỳ dữ dội, nguy cơ tử vong mẹ rất cao."}, {"id": 7, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 27 tuổi, trễ kinh 5 tuần, ra máu nâu rỉ rả ở âm đạo. Định lượng beta-hCG huyết thanh ban đầu đạt 2.200 mIU/mL. Bác sĩ chỉ định làm siêu âm qua đầu dò âm đạo (TVS). Trên hình ảnh siêu âm TVS: Buồng tử cung hoàn toàn trống rỗng, không quan sát thấy túi thai thật hay túi thai giả, nội mạc tử cung dày 12 mm, không có dịch túi cùng sau.", "question": "Khái niệm ngưỡng phân định (Discriminatory zone) beta-hCG đối với siêu âm TVS và ý nghĩa chẩn đoán trên bệnh nhân này là gì?", "options": ["Nồng độ beta-hCG trên 50.000 mIU/mL mới được chỉ định siêu âm qua ngả âm đạo", "Nồng độ beta-hCG từ 5.000 đến 10.000 mIU/mL mới bắt buộc thấy túi thai trên TVS, nồng độ 2.200 mIU/mL là còn quá sớm theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Nồng độ beta-hCG từ 100 đến 500 mIU/mL đã phải thấy phôi thai có tim thai trên TVS", "Nồng độ beta-hCG không có mối liên quan sinh học nào với hình ảnh túi thai trên siêu âm", "Nồng độ beta-hCG từ 1.500 đến 2.000 mIU/mL bắt buộc phải thấy túi thai trong tử cung trên TVS, nếu buồng tử cung trống là gợi ý mạnh thai lạc chỗ"], "correct": 4, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] Siêu âm TVS được thực hiện ngay từ giai đoạn sớm, không chờ đến 50.000 mIU/mL"}, {"key": "B", "trap": "[guideline_cu] 5.000 - 10.000 mIU/mL là ngưỡng phân định của siêu âm qua THÀNH BỤNG (TAS), không phải TVS"}, {"key": "C", "trap": "[qua_muc] 100-500 mIU/mL là nồng độ quá thấp, chưa thể thấy túi thai trên siêu âm"}, {"key": "D", "trap": "[bat_tu_khoa] Phát biểu sai sinh học, beta-hCG tương quan thuận với kích thước túi thai"}], "decision": "beta-hCG = 2.200 mIU/mL + TVS buồng tử cung trống -> Vượt ngưỡng phân định Discriminatory zone (1.500 - 2.000 mIU/mL trên TVS) -> Bắt buộc phải thấy túi thai thật nếu thai trong tử cung -> Buồng tử cung trống khẳng định gợi ý thai ngoài tử cung.", "explanation": "Ngưỡng phân định (Discriminatory zone) là nồng độ beta-hCG huyết thanh tối thiểu mà ở mức đó siêu âm bắt buộc phải quan sát được túi thai trong buồng tử cung nếu thai làm tổ đúng vị trí. Với siêu âm qua đầu dò âm đạo (TVS), ngưỡng này là 1.500 - 2.000 mIU/mL (với siêu âm thành bụng TAS là 5.000 - 6.000 mIU/mL). Khi beta-hCG = 2.200 mIU/mL (> 2.000) mà TVS buồng tử cung trống, nguy cơ thai lạc chỗ là cực kỳ cao."}, {"id": 8, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 25 tuổi, trễ kinh 4 ngày, ra chút dịch nâu âm đạo, không đau bụng. Khám lâm sàng bình thường, tử cung nhỏ, hai phần phụ mềm. Xét nghiệm lần 1: beta-hCG = 450 mIU/mL. Siêu âm TVS: Buồng tử cung trống, hai phần phụ bình thường, không có dịch ổ bụng. Bệnh nhân được chẩn đoán Thai chưa rõ vị trí (Pregnancy of Unknown Location - PUL) và hẹn xét nghiệm lại beta-hCG sau 48 giờ. Kết quả lần 2 sau 48 giờ: beta-hCG = 520 mIU/mL (mức tăng 15.5%).", "question": "Động học beta-hCG tăng 15.5% sau 48 giờ phản ánh tình trạng sinh lý bệnh nào và hướng theo dõi tiếp theo là gì?", "options": ["Động học hoàn toàn bình thường của thai trong tử cung giai đoạn sớm, cho bệnh nhân về nhà hẹn tái khám sau hai tuần theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Động học bất thường của thai không sống hoặc thai lạc chỗ, cần tiếp tục theo dõi sát lâm sàng và định lượng lại beta-hCG sau 48 giờ", "Động học điển hình của thai đôi khác trứng phát triển khỏe mạnh, chỉ định tiêm Progesterone liều cao dưỡng thai", "Bằng chứng chắc chắn của bệnh nguyên bào nuôi ác tính, chỉ định tiêm Methotrexate toàn thân ngay lập tức", "Bằng chứng chắc chắn sẩy thai hoàn toàn, cho xuất viện và không cần xét nghiệm theo dõi thêm"], "correct": 1, "traps": [{"key": "A", "trap": "[qua_bao_ton] Thai sinh lý sống bình thường phải tăng tối thiểu 35 - 53% sau 48h, mức tăng 15.5% là bất thường"}, {"key": "C", "trap": "[bat_tu_khoa] Thai đôi có beta-hCG tăng rất nhanh chứ không tăng chậm 15.5%"}, {"key": "D", "trap": "[qua_xam_lan] Tiêm MTX ngay khi chưa có chẩn đoán xác định vị trí và beta-hCG < 1.000 mIU/mL là can thiệp vội vã"}, {"key": "E", "trap": "[qua_bao_ton] Sẩy thai hoàn toàn thì beta-hCG phải giảm ít nhất 21-35% sau 48h, không phải tăng 15.5%"}], "decision": "PUL + beta-hCG lần 1 = 450, lần 2 = 520 (tăng 15.5% sau 48h) -> Mức tăng sinh lý tối thiểu phải là 35 - 53% -> Tăng chậm 15.5% là động học bất thường (Abnormal rise) -> Cảnh báo thai lạc chỗ hoặc thai sẩy ngừng phát triển -> Tiếp tục theo dõi beta-hCG và TVS sau 48h.", "explanation": "Trong thai kỳ sống trong tử cung sớm, beta-hCG phải tăng ít nhất 35% - 53% sau 48 giờ. Mức tăng chỉ 15.5% là động học bất thường (abnormal rise), khẳng định thai kỳ không phát triển bình thường (gợi ý thai lạc chỗ hoặc thai trong tử cung ngừng tiến triển). Vì beta-hCG < 1.000 mIU/mL và bệnh nhân hoàn toàn không có triệu chứng đau bụng, hướng xử trí chuẩn là theo dõi sát lâm sàng, lặp lại beta-hCG và TVS sau 48 giờ."}, {"id": 9, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 29 tuổi, trễ kinh 6 tuần, ra ít dịch máu nâu âm đạo. Định lượng beta-hCG = 1.650 mIU/mL. Bác sĩ tiến hành siêu âm TVS khảo sát kỹ vùng chậu. Kết quả: Buồng tử cung trống, nội mạc dày 10 mm. Tại vị trí phần phụ bên phải, nằm tách biệt hoàn toàn với buồng trứng phải, quan sát thấy một cấu trúc dạng nang tròn bờ đều, trung tâm trống âm, bao quanh bởi một vòng màng phản âm dày (Tubal ring sign / Bagel sign) kích thước 18 mm. Khảo sát Doppler màu thấy phổ mạch máu bao quanh hình 'vòng lửa' (Ring of fire).", "question": "Dấu hiệu vòng nhẫn tăng âm (Tubal ring sign) trên siêu âm TVS có giá trị chẩn đoán như thế nào đối với thai lạc chỗ?", "options": ["Là dấu hiệu khẳng định bệnh nhân bị dính buồng tử cung sau nạo hút thai", "Là hình ảnh khẳng định chắc chắn 100% bệnh nhân đang mang thai trứng toàn phần", "Là hình ảnh sinh lý hoàn toàn bình thường của nang hoàng thể buồng trứng trong quý 1 theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Là hình ảnh siêu âm đặc trưng nhất của thai ngoài tử cung ở vòi tử cung khi chưa có phôi thai", "Là hình ảnh điển hình của u nang bì buồng trứng xoắn gây hoại tử"], "correct": 3, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Dính buồng tử cung thấy dải dính trong lòng tử cung, không tạo khối ngoài tử cung"}, {"key": "B", "trap": "[sai_tang] Thai trứng nằm trong buồng tử cung có hình ảnh tuyết rơi, không nằm ngoài buồng trứng"}, {"key": "C", "trap": "[phan_biet_hep] Nang hoàng thể nằm TRONG buồng trứng và chuyển động cùng buồng trứng khi đè ép đầu dò"}, {"key": "E", "trap": "[nham_dan_so] U nang bì có phản âm hỗn hợp chứa tóc/răng/bã nhờn, không có dạng vòng nhẫn Tubal ring"}], "decision": "TVS buồng tử cung trống + Khối cạnh buồng trứng dạng vòng nhẫn tăng âm Tubal ring sign + Phổ Doppler Ring of fire -> Dấu hiệu siêu âm đặc trưng nhất của thai ngoài tử cung ở vòi tử cung.", "explanation": "Dấu hiệu vòng nhẫn vòi tử cung (Tubal ring sign / Bagel sign) là một cấu trúc tròn có bờ phản âm dày bao quanh túi dịch nhỏ nằm ở phần phụ, tách biệt hẳn với buồng trứng. Đây là hình ảnh siêu âm TVS phổ biến và đặc trưng nhất của thai ngoài tử cung ở vòi tử cung khi chưa quan sát thấy rõ phôi thai hay tim thai. Phân biệt với nang hoàng thể ở chỗ nang hoàng thể nằm trong mô buồng trứng."}, {"id": 10, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 26 tuổi, trễ kinh 5 tuần, ra ít máu âm đạo. Định lượng beta-hCG = 1.900 mIU/mL. Bác sĩ siêu âm quan sát buồng tử cung thấy một túi dịch nhỏ d = 7 mm nằm ở vị trí chính giữa đường lòng tử cung, chỉ bao bởi một lớp màng mỏng đơn độc, không có hình ảnh hai đường phản âm song song (dấu màng rụng đôi - Double-decidual sign). Cạnh buồng trứng trái có khối echo hỗn hợp d = 20 mm. Bác sĩ kết luận túi dịch trong tử cung là túi thai giả (Pseudo-gestational sac).", "question": "Đặc điểm siêu âm giúp phân biệt chắc chắn giữa túi thai thật và túi thai giả trong buồng tử cung là gì?", "options": ["Túi thai thật nằm lệch tâm nội mạc và có dấu màng rụng đôi, túi thai giả nằm ở chính giữa nội mạc và chỉ có một lớp màng", "Túi thai thật luôn có hình tam giác góc nhọn, túi thai giả luôn có hình tròn xoe tuyệt đối", "Túi thai thật chứa máu tụ đông cứng bên trong, túi thai giả chứa phôi thai và tim thai + rõ theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Túi thai thật nằm ở cổ tử cung, túi thai giả nằm ở đáy tử cung sát phúc mạc", "Túi thai thật không thay đổi kích thước, túi thai giả tăng kích thước gấp đôi sau mỗi 12 giờ"], "correct": 0, "traps": [{"key": "B", "trap": "[phan_biet_hep] Hình dạng túi thai thật thường tròn hoặc bầu dục, túi thai giả dẹt hình thoi theo lòng tử cung"}, {"key": "C", "trap": "[sai_tang] Phát biểu ngược hoàn toàn, túi thai giả do dịch/máu đọng trong lòng tử cung, túi thai thật chứa phôi"}, {"key": "D", "trap": "[nham_dan_so] Vị trí túi thai thật làm tổ ở đáy/thân tử cung dưới lớp nội mạc, túi thai giả nằm trong khoang nội mạc"}, {"key": "E", "trap": "[bat_tu_khoa] Túi thai giả không tăng kích thước gấp đôi sau 12h, phát biểu sai sinh học"}], "decision": "Túi dịch chính giữa lòng tử cung + 1 lớp màng + Không có Double-decidual sign -> Túi thai giả (Pseudo-gestational sac) -> Túi thai thật làm tổ lệch tâm dưới nội mạc và có dấu màng rụng đôi (Double-decidual sign).", "explanation": "Túi thai thật (True gestational sac) làm tổ dưới lớp nội mạc nên nằm lệch về một bên (eccentric) so với đường lòng tử cung và được bao quanh bởi 2 lớp phản âm dày đồng tâm gọi là dấu màng rụng đôi (Double-decidual sign - màng rụng bao và màng rụng đáy). Trong khi đó, túi thai giả (Pseudo-gestational sac) là do đọng dịch hoặc máu trong khoang tử cung ở bệnh nhân thai ngoài tử cung, nằm chính giữa khoang nội mạc (central) và chỉ có một lớp màng phản âm đơn độc."}, {"id": 11, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 28 tuổi, trễ kinh 6 tuần, ra máu âm đạo nâu rỉ rả. Định lượng beta-hCG = 1.200 mIU/mL. Siêu âm TVS: Buồng tử cung trống, phần phụ chưa thấy rõ khối thai. Bác sĩ cho làm thêm xét nghiệm định lượng Progesterone huyết thanh, kết quả trả về: Progesterone = 3.2 ng/mL (mốc ngắt thấp < 5 ng/mL).", "question": "Giá trị Progesterone huyết thanh < 5 ng/mL có ý nghĩa chẩn đoán và tiên lượng sinh học như thế nào?", "options": ["Là chỉ định bắt buộc phải phẫu thuật mổ mở cắt tử cung toàn phần cấp cứu", "Khẳng định chắc chắn 100% thai trong tử cung sống phát triển hoàn toàn khỏe mạnh", "Khẳng định thai kỳ không phát triển bình thường, gợi ý mạnh thai lạc chỗ hoặc thai trong tử cung ngừng tiến triển", "Là bẫy sinh hóa do bệnh nhân ăn nhiều thực phẩm giàu chất béo trước khi lấy máu theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Khẳng định bệnh nhân bị đa thai phân chia từ một trứng"], "correct": 2, "traps": [{"key": "A", "trap": "[qua_xam_lan] Progesterone < 5 ng/mL chỉ phản ánh thai bất thường, không có chỉ định cắt tử cung"}, {"key": "B", "trap": "[sai_tang] Progesterone > 20 - 25 ng/mL mới gợi ý thai sống trong tử cung khỏe mạnh"}, {"key": "D", "trap": "[bat_tu_khoa] Thực phẩm không ảnh hưởng đến nồng độ Progesterone huyết thanh do hoàng thể tiết ra"}, {"key": "E", "trap": "[nham_dan_so] Đa thai thường có nồng độ Progesterone cao hơn đơn thai, không sụt giảm < 5 ng/mL"}], "decision": "Trễ kinh + beta-hCG 1.200 + Progesterone = 3.2 ng/mL (< 5 ng/mL) -> Progesterone < 5 ng/mL khẳng định thai kỳ không sống (An abnormal/nonviable pregnancy) -> Gợi ý thai ngoài tử cung hoặc thai lưu trong tử cung.", "explanation": "Định lượng Progesterone huyết thanh giúp đánh giá khả năng sống của thai. Nồng độ Progesterone < 5 ng/mL có độ đặc hiệu cao khẳng định một thai kỳ không phát triển bình thường (hầu như loại trừ thai sống trong tử cung, gợi ý thai lạc chỗ hoặc thai trong tử cung ngừng tiến triển). Ngược lại, Progesterone > 20 - 25 ng/mL tiên lượng thai sống trong tử cung bình thường với độ tin cậy > 95%."}, {"id": 12, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 28 tuổi, PARA 0000, trễ kinh 6 tuần, ra máu nâu rỉ rả, đau tức nhẹ hố chậu trái. Sinh hiệu hoàn toàn ổn định: Mạch 76 lần/phút, HA 115/75 mmHg, Thân nhiệt 36.8°C. Bụng mềm, ấn đau nhẹ hố chậu trái, không có phản ứng thành bụng. Cận lâm sàng: beta-hCG = 2.800 mIU/mL. Siêu âm TVS: Buồng tử cung trống, cạnh buồng trứng trái có khối vòng nhẫn tăng âm d = 28 mm, không có phôi thai, không có tim thai, không có dịch ổ bụng. Xét nghiệm công thức máu, chức năng gan (ALT, AST) và chức năng thận (Ure, Creatinin) hoàn toàn bình thường. Bệnh nhân tha thiết muốn bảo tồn vòi tử cung và cam kết tuân thủ tái khám.", "question": "Bệnh nhân này có đủ tiêu chuẩn chỉ định điều trị nội khoa thai ngoài tử cung bằng Methotrexate (MTX) liều đơn hay không và lý do là gì?", "options": ["Chống chỉ định tuyệt đối vì bệnh nhân chưa sinh con lần nào nên không được dùng thuốc hóa trị", "Không đủ tiêu chuẩn vì beta-hCG vượt quá 1.000 mIU/mL bắt buộc phải mổ cắt vòi tử cung", "Không đủ tiêu chuẩn vì kích thước khối thai 28 mm là quá lớn, bắt buộc phải mổ mở cấp cứu theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Đủ tiêu chuẩn nhưng bắt buộc phải phối hợp nạo hút buồng tử cung bằng chân không cùng lúc", "Đủ tiêu chuẩn chỉ định MTX liều đơn vì sinh hiệu ổn định, beta-hCG dưới 5.000 mIU/mL, khối thai dưới 3.5 cm, chưa vỡ và chức năng gan thận bình thường"], "correct": 4, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] Chưa sinh con không phải chống chỉ định, ngược lại MTX giúp bảo tồn vòi tử cung cho lần mang thai sau"}, {"key": "B", "trap": "[guideline_cu] Ngưỡng beta-hCG điều trị MTX là < 5.000 mIU/mL (mốc 1.000 là của theo dõi tự nhiên)"}, {"key": "C", "trap": "[qua_muc] Kích thước < 3.5 cm (35 mm) là tiêu chuẩn hoàn toàn hợp lệ để điều trị MTX"}, {"key": "D", "trap": "[qua_xam_lan] Nạo hút buồng tử cung không có chỉ định khi buồng tử cung trống và đã xác định thai ngoài"}], "decision": "Sinh hiệu ổn định + beta-hCG 2.800 (< 5.000) + Khối thai 28 mm (< 3.5 cm) + Chưa vỡ + Không tim thai + Gan thận bình thường + Hợp tác -> Đủ tiêu chuẩn chỉ định MTX liều đơn.", "explanation": "Theo khuyến cáo của ACOG và Bài 10: Tiêu chuẩn điều trị nội khoa thai lạc chỗ bằng Methotrexate (MTX) gồm: (1) Sinh hiệu ổn định; (2) beta-hCG < 5.000 mIU/mL; (3) Kích thước khối thai < 3.5 cm (35 mm) trên siêu âm; (4) Chưa vỡ, không có hoạt động tim thai; (5) Không có dịch ổ bụng lượng vừa/nhiều; (6) Chức năng gan, thận, tủy xương bình thường; (7) Bệnh nhân cam kết tuân thủ theo dõi. Bệnh nhân này thỏa mãn đầy đủ các tiêu chí."}, {"id": 13, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 29 tuổi, được chỉ định tiêm Methotrexate (MTX) liều đơn 50 mg/m² bắp sâu vào Ngày 1 để điều trị thai ngoài tử cung ở vòi tử cung phải. Định lượng beta-hCG vào Ngày 1 (ngày tiêm) là 3.200 mIU/mL. Bệnh nhân được hẹn quay lại xét nghiệm beta-hCG vào Ngày 4 và Ngày 7. Kết quả: Ngày 4 beta-hCG = 3.800 mIU/mL (tăng nhẹ); Ngày 7 beta-hCG = 3.100 mIU/mL (giảm 18.4% so với Ngày 4).", "question": "Đánh giá đáp ứng điều trị nội khoa MTX ở bệnh nhân này như thế nào và hướng xử trí tiếp theo vào Ngày 7 là gì?", "options": ["Thất bại điều trị vì beta-hCG Ngày 4 tăng cao hơn Ngày 1, chuyển phẫu thuật mổ mở cắt vòi tử cung ngay lập tức theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Đạt đáp ứng tốt vì beta-hCG Ngày 7 giảm trên 15% so với Ngày 4, tiếp tục theo dõi định lượng beta-hCG hàng tuần cho đến khi âm tính", "Thất bại điều trị vì beta-hCG Ngày 7 chưa giảm xuống dưới 100 mIU/mL, bắt buộc tiêm ngay liều MTX thứ hai", "Tác dụng phụ độc tủy xương nặng, cho nhập viện lọc máu cấp cứu để thải độc thuốc", "Ngưng theo dõi và cho bệnh nhân xuất viện ngay vì thai đã tiêu biến hoàn toàn"], "correct": 1, "traps": [{"key": "A", "trap": "[phan_biet_hep] beta-hCG Ngày 4 tăng nhẹ so với Ngày 1 là hiện tượng sinh lý do tế bào nuôi bị hủy giải phóng hCG"}, {"key": "C", "trap": "[qua_muc] Tiêu chuẩn đánh giá thành công dựa vào % giảm giữa Ngày 4 và Ngày 7 (>= 15%), không yêu cầu < 100 mIU/mL ngay"}, {"key": "D", "trap": "[bat_tu_khoa] Không có triệu chứng ngộ độc, beta-hCG giảm 18.4% là diễn tiến tốt"}, {"key": "E", "trap": "[qua_bao_ton] beta-hCG = 3.100 mIU/mL chưa về âm tính, dừng theo dõi sẽ bỏ sót nguy cơ thai vỡ muộn"}], "decision": "Tiêm MTX Ngày 1 -> N1 = 3.200, N4 = 3.800, N7 = 3.100 -> Mức giảm N7 so với N4 = (3800 - 3100)/3800 = 18.4% (>= 15%) -> Tiêu chuẩn thành công của phác đồ liều đơn -> Theo dõi beta-hCG hàng tuần đến khi < 5 mIU/mL.", "explanation": "Theo phác đồ MTX liều đơn (Single-dose 50 mg/m²): Tiêu chuẩn đánh giá đáp ứng điều trị dựa vào **mức giảm beta-hCG giữa Ngày 4 và Ngày 7 phải >= 15%**. Cần lưu ý beta-hCG Ngày 4 có thể tăng cao hơn Ngày 1 do sự phóng thích hCG từ tế bào nuôi bị hoại tử. Ở bệnh nhân này, mức giảm N7 so với N4 là 18.4% (>= 15%) -> Đáp ứng tốt, tiếp tục theo dõi beta-hCG hàng tuần cho đến khi âm tính (< 5 mIU/mL). Nếu giảm < 15% mới tiêm liều MTX thứ 2."}, {"id": 14, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 32 tuổi, trễ kinh 6 tuần, chẩn đoán thai ngoài tử cung ở vòi tử cung trái chưa vỡ. Khám lâm sàng: Bệnh nhân đau bụng nhiều, da xanh tái. Sinh hiệu: Mạch 115 lần/phút, HA tụt 85/55 mmHg. Siêu âm TVS: Buồng tử cung trống, khối thai cạnh buồng trứng trái d = 30 mm, dịch ổ bụng lượng vừa (khoảng 300 ml dịch không âm vang). Xét nghiệm máu cấp cứu: Bạch cầu 4.200/mm³, Tiểu cầu 80.000/mm³ (giảm tiểu cầu), AST = 180 U/L, ALT = 210 U/L (men gan tăng cao gấp 4 lần). Bệnh nhân đang cho con bú con nhỏ 8 tháng tuổi.", "question": "Những chống chỉ định tuyệt đối nào của điều trị nội khoa Methotrexate (MTX) ghi nhận được trên bệnh nhân này?", "options": ["Tiền sử từng đẻ thường con nặng 3.200g khỏe mạnh", "Bệnh nhân đã 32 tuổi và đã có một con nhỏ 8 tháng tuổi theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Kích thước khối thai 30 mm trên siêu âm qua ngả âm đạo", "Sinh hiệu không ổn định nghi vỡ, suy giảm chức năng gan huyết học và đang cho con bú", "Thời gian trễ kinh 6 tuần tính từ ngày đầu kỳ kinh cuối"], "correct": 3, "traps": [{"key": "A", "trap": "[bat_tu_khoa] Tiền sử sinh con bình thường không ảnh hưởng đến chỉ định MTX"}, {"key": "B", "trap": "[nham_dan_so] Tuổi 32 và có con không phải chống chỉ định của MTX"}, {"key": "C", "trap": "[phan_biet_hep] Kích thước 30 mm (< 3.5 cm) là điều kiện THUẬN LỢI, không phải chống chỉ định"}, {"key": "E", "trap": "[thieu_cau_phan] Trễ kinh 6 tuần là tuổi thai sớm hoàn toàn phù hợp để dùng MTX"}], "decision": "HA 85/55, M 115 (huyết động không ổn định) + Men gan tăng vọt + Giảm tiểu cầu + Đang cho con bú -> Chống chỉ định TUYỆT ĐỐI của MTX -> Chuyển phẫu thuật cấp cứu khẩn cấp.", "explanation": "Các chống chỉ định tuyệt đối của Methotrexate (MTX) bao gồm: (1) Huyết động không ổn định hoặc có dấu hiệu vỡ ngập máu ổ bụng; (2) Suy gan, suy thận, suy tủy xương / bệnh lý huyết học (giảm bạch cầu, tiểu cầu); (3) Đang cho con bú (MTX tiết qua sữa gây độc cho trẻ); (4) Bệnh lý loét dạ dày tiến triển; (5) Dị ứng MTX; (6) Mang thai trong tử cung kết hợp (thai đôi dị vị). Bệnh nhân này có nhiều chống chỉ định tuyệt đối -> Bắt buộc chuyển phẫu thuật."}, {"id": 15, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 27 tuổi, được tiêm MTX liều đơn điều trị thai ngoài tử cung vòi tử cung phải vào Ngày 1. Đến Ngày 3 sau tiêm, bệnh nhân xuất hiện đau tức trằn nặng vùng hạ vị bên phải. Thăm khám cấp cứu: Bệnh nhân tỉnh táo, tiếp xúc tốt, da niêm mạc hồng. Sinh hiệu ổn định: Mạch 78 lần/phút, HA 115/70 mmHg, Thân nhiệt 36.9°C. Khám bụng: Bụng mềm, ấn tức nhẹ hố chậu phải, không có cảm ứng phúc mạc. Siêu âm TVS: Khối thai kích thước không tăng (25 mm), không có dịch tự do mới trong ổ bụng. Định lượng Hct = 38% (không giảm).", "question": "Chẩn đoán nguyên nhân gây đau bụng ở Ngày 3 sau tiêm MTX và hướng xử trí phù hợp nhất là gì?", "options": ["Cơn đau do bóc tách thoái triển khối thai sinh lý, tiếp tục theo dõi lâm sàng và cho dùng thuốc giảm đau Paracetamol", "Thai ngoài tử cung vỡ ngập máu ổ bụng, chuyển phẫu thuật mổ mở cắt vòi tử cung khẩn cấp theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Tác dụng phụ thủng dạ dày do MTX, chuyển khoa Ngoại tổng hợp mổ khâu lỗ thủng", "Nhiễm trùng huyết cấp tính do hoại tử khối thai, cho tiêm kháng sinh phổ rộng liều cao", "Thất bại điều trị MTX hoàn toàn, tiêm ngay liều MTX thứ hai vào Ngày 3"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_xam_lan] Huyết động hoàn toàn ổn định, Hct không giảm, siêu âm không có dịch -> Chưa có bằng chứng vỡ"}, {"key": "C", "trap": "[nham_dan_so] Nhầm lẫn tác dụng phụ tiêu hóa đơn thuần với thủng tạng rỗng"}, {"key": "D", "trap": "[qua_muc] Bệnh nhân không sốt, bạch cầu bình thường, không có dấu hiệu nhiễm trùng huyết"}, {"key": "E", "trap": "[sai_thu_tu] Tiêm MTX liều 2 chỉ xét vào Ngày 7 nếu beta-hCG giảm < 15%, không tiêm vào Ngày 3"}], "decision": "Tiêm MTX Ngày 3 xuất hiện đau bụng + HA 115/70, M 78 (huyết động ổn) + Bụng mềm + Hct 38% + Siêu âm không có dịch mới -> Cơn đau do bóc tách thoái triển khối thai (Separation pain) sinh lý -> Theo dõi sát và cho giảm đau Paracetamol.", "explanation": "Sau tiêm MTX từ 3 đến 7 ngày, khoảng 50% bệnh nhân có cảm giác đau tăng nhẹ vùng hạ vị. Đây là cơn đau do sự thoái triển, sẩy hoặc căng giãn bóc tách khối thai trong vòi tử cung (Separation pain). Để phân biệt với khối thai vỡ: Nếu bệnh nhân có sinh hiệu hoàn toàn ổn định, bụng mềm không cảm ứng phúc mạc, Hct không giảm và siêu âm không có dịch tự do mới -> Chẩn đoán cơn đau bóc tách sinh lý. Xử trí: Cho dùng giảm đau đơn thuần (Paracetamol) và theo dõi sát. Tránh dùng NSAIDs vì làm giảm hiệu quả của MTX."}, {"id": 16, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 24 tuổi, con so (PARA 0000), trễ kinh 6 tuần, chẩn đoán thai ngoài tử cung ở đoạn bóng vòi tử cung phải chưa vỡ. Sinh hiệu hoàn toàn ổn định: Mạch 78 lần/phút, HA 120/75 mmHg. Định lượng beta-hCG = 6.200 mIU/mL (vượt ngưỡng điều trị MTX nội khoa). Siêu âm TVS: Khối thai bóng vòi phải d = 32 mm, chưa vỡ, không có dịch ổ bụng. Bệnh nhân còn rất trẻ, tha thiết muốn bảo tồn chức năng sinh sản của vòi tử cung phải. Vòi tử cung bên trái qua thám sát hoàn toàn bình thường.", "question": "Chỉ định phẫu thuật và kỹ thuật can thiệp sản khoa tối ưu nhất cho bệnh nhân này là gì?", "options": ["Mổ mở cấp cứu cắt tử cung toàn phần và hai phần phụ hai bên", "Phẫu thuật nội soi cắt toàn bộ vòi tử cung phải đến tận góc tử cung", "Phẫu thuật nội soi xẻ bờ tự do vòi tử cung phải lấy khối thai bảo tồn vòi tử cung", "Tiêm thuốc co hồi tử cung Oxytocin kết hợp nạo hút buồng tử cung bằng chân không theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Nằm nghỉ ngơi tuyệt đối tại giường và không cần thực hiện bất kỳ can thiệp nào"], "correct": 2, "traps": [{"key": "A", "trap": "[qua_xam_lan] Cắt tử cung toàn phần ở nữ 24 tuổi chưa có con là sai lầm nghiêm trọng"}, {"key": "B", "trap": "[qua_xam_lan] Cắt vòi tử cung ở bệnh nhân con so tha thiết giữ vòi tử cung khi khối thai chưa vỡ là xâm lấn quá mức"}, {"key": "D", "trap": "[bo_chong_chi_dinh] Nạo buồng tử cung không giải quyết được khối thai ở vòi tử cung, Oxytocin có nguy cơ làm vỡ vòi"}, {"key": "E", "trap": "[qua_bao_ton] beta-hCG 6.200 mIU/mL không thể theo dõi tự nhiên vì nguy cơ vỡ rất cao"}], "decision": "Con so 24w + beta-hCG 6.200 (> 5.000) + Khối thai bóng vòi chưa vỡ 32 mm + Sinh hiệu ổn định + Tha thiết giữ vòi -> Chỉ định Phẫu thuật nội soi xẻ bờ tự do vòi tử cung tống xuất khối thai bảo tồn (Salpingostomy).", "explanation": "Phẫu thuật nội soi xẻ vòi tử cung bảo tồn (Laparoscopic Salpingostomy) được chỉ định ở bệnh nhân thai ngoài tử cung chưa vỡ, sinh hiệu ổn định, bệnh nhân có nhu cầu bảo tồn sinh sản (chưa đủ con) và vòi tử cung không bị tổn thương quá nặng. Kỹ thuật: Xẻ bờ tự do của vòi tử cung tại vị trí khối thai, lấy hết tổ chức thai và cầm máu cẩn thận, để ngỏ vòi tử cung tự lành."}, {"id": 17, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 36 tuổi, PARA 3003 (đã đủ 3 con khỏe mạnh, đã thắt vòi tử cung tránh thai cách đây 3 năm). Bệnh nhân trễ kinh 7 tuần, đau hạ vị lệch trái dữ dội. Sinh hiệu: Mạch 105 lần/phút, HA 95/60 mmHg. Siêu âm TVS: Khối thai vòi tử cung trái d = 42 mm đã vỡ, dịch tụ ở cùng đồ sau và ngách gan thận lượng vừa (khoảng 350 ml). Thám sát nội soi: Vòi tử cung trái đoạn bóng bị vỡ nát biến dạng hoàn toàn, đang chảy máu rỉ rả, mô vòi tử cung xơ dính nhiều. Vòi tử cung phải bình thường.", "question": "Chỉ định phẫu thuật chuẩn xác và hợp lý nhất cho sản phụ này là gì?", "options": ["Đặt dẫn lưu ổ bụng đơn thuần và theo dõi tình trạng chảy máu", "Phẫu thuật xẻ vòi tử cung trái bảo tồn và đính lại đoạn vòi bị vỡ nát theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Mổ mở cắt toàn bộ tử cung và hai buồng trứng hai bên", "Tiêm Methotrexate liều cao trực tiếp vào khối vỡ qua ngả âm đạo", "Phẫu thuật nội soi cắt toàn bộ vòi tử cung trái sát góc tử cung và lau rửa sạch ổ bụng"], "correct": 4, "traps": [{"key": "A", "trap": "[qua_bao_ton] Dẫn lưu đơn thuần không cầm được nguồn chảy máu ở vòi tử cung vỡ"}, {"key": "B", "trap": "[qua_bao_ton] Vòi tử cung đã vỡ nát biến dạng ở bệnh nhân đủ 3 con không có chỉ định xẻ bảo tồn vì nguy cơ chảy máu và thai tái phát"}, {"key": "C", "trap": "[qua_xam_lan] Cắt tử cung và hai buồng trứng là phẫu thuật quá rộng không cần thiết"}, {"key": "D", "trap": "[bo_chong_chi_dinh] Tiêm MTX khi khối thai đã vỡ đang chảy máu là chống chỉ định tuyệt đối"}], "decision": "Đủ 3 con + Vòi trái vỡ nát biến dạng 42 mm + Đang chảy máu + Vòi phải bình thường -> Chỉ định Phẫu thuật nội soi cắt toàn bộ vòi tử cung trái (Salpingectomy) sát góc tử cung.", "explanation": "Phẫu thuật cắt vòi tử cung (Salpingectomy) được chỉ định khi: (1) Khối thai ngoài tử cung đã vỡ, mô vòi tử cung bị tổn thương vỡ nát nghiêm trọng không thể phục hồi; (2) Chảy máu không cầm được sau xẻ vòi; (3) Bệnh nhân đã đủ con và không có nhu cầu sinh thêm; (4) Tiền sử thai ngoài tử cung tái phát trên cùng một vòi. Trường hợp này bệnh nhân 36 tuổi đã đủ 3 con, vòi vỡ nát -> Cắt vòi tử cung trái là lựa chọn chuẩn xác."}, {"id": 18, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 25 tuổi, được phẫu thuật nội soi xẻ vòi tử cung phải bảo tồn hút khối thai cách đây 5 ngày. Định lượng beta-hCG trước mổ là 5.400 mIU/mL. Bệnh nhân được theo dõi beta-hCG hậu phẫu vào Ngày 3 và Ngày 7. Kết quả: beta-hCG Ngày 3 = 4.200 mIU/mL (chỉ giảm 22.2% so với trước mổ, chưa đạt mốc giảm 50%); beta-hCG Ngày 7 vọt lên 4.800 mIU/mL. Bệnh nhân bắt đầu ra máu âm đạo trở lại và đau tức nhẹ hố chậu phải.", "question": "Biến chứng hậu phẫu nào được chẩn đoán xác định và phác đồ xử trí tiếp theo là gì?", "options": ["Nhiễm trùng vết mổ nội soi, chỉ định dùng kháng sinh phổ rộng và thay băng vết mổ hàng ngày theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung tồn tại, chỉ định điều trị bổ sung bằng Methotrexate nội khoa hoặc phẫu thuật cắt vòi tử cung", "Sẩy thai hoàn toàn trong tử cung sinh lý, không cần xử trí thêm", "U nguyên bào nuôi ác tính di căn phổi, chỉ định phác đồ hóa trị phối hợp EMA-CO", "Thủng tử cung do thủ thuật, chuyển mổ mở khâu cơ tử cung khẩn cấp"], "correct": 1, "traps": [{"key": "A", "trap": "[nham_dan_so] Vết mổ nội soi bình thường, beta-hCG tăng vọt phản ánh sự tồn tại của tế bào nuôi, không phải nhiễm trùng vết mổ"}, {"key": "C", "trap": "[qua_bao_ton] beta-hCG Ngày 7 tăng lại 4.800 mIU/mL chứng tỏ tế bào nuôi còn sót đang phát triển tiếp"}, {"key": "D", "trap": "[qua_muc] Thai ngoài tồn tại là biến chứng sinh học sau xẻ vòi, không chẩn đoán ngay là u nguyên bào nuôi di căn EMA-CO"}, {"key": "E", "trap": "[sai_tang] Bệnh nhân xẻ vòi tử cung, không can thiệp buồng tử cung nên không có thủng tử cung"}], "decision": "Sau phẫu thuật xẻ vòi bảo tồn + beta-hCG N3 giảm < 50% + beta-hCG N7 vọt lên 4.800 + Ra máu đau bụng -> Chẩn đoán Thai ngoài tử cung tồn tại (Persistent trophoblast) -> Xử trí: Tiêm Methotrexate nội khoa bổ sung hoặc mổ cắt vòi tử cung.", "explanation": "Thai ngoài tử cung tồn tại (Persistent ectopic pregnancy / Persistent trophoblast) xảy ra ở 5 - 10% các trường hợp phẫu thuật xẻ vòi bảo tồn, do sót lại các tế bào nguyên bào nuôi còn sống tiếp tục tăng sinh. Tiêu chuẩn chẩn đoán: Nồng độ beta-hCG sau mổ không giảm như kỳ vọng (giảm < 50% vào Ngày 3) hoặc tăng trở lại. Xử trí: Điều trị nội khoa bằng tiêm Methotrexate (thường đạt hiệu quả cao > 95%) hoặc phẫu thuật cắt vòi tử cung nếu MTX thất bại hoặc có biến chứng vỡ."}, {"id": 19, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 34 tuổi, PARA 2002 (tiền sử mổ lấy thai 2 lần). Sản phụ trễ kinh 6 tuần, ra chút dịch máu nâu ở âm đạo. Siêu âm TVS: Buồng tử cung hoàn toàn trống rỗng, kênh cổ tử cung rỗng. Tại vùng eo tử cung phía trước, ngay vị trí sẹo mổ lấy thai cũ, quan sát thấy một túi thai d = 18 mm, có phôi thai CRL = 5 mm và tim thai (+). Lớp cơ tử cung phía trước giữa túi thai và bàng quang bị mỏng còn d = 1.6 mm. Phổ Doppler màu thấy dòng máu vắt ngang qua sẹo mổ tăng sinh rất mạnh.", "question": "Chẩn đoán vị trí thai lạc chỗ đặc biệt và nguy cơ biến chứng sản khoa nghiêm trọng nhất nếu tiếp tục dưỡng thai là gì?", "options": ["Thai trong tử cung dọa sẩy, nguy cơ gây sinh con to trên 4.000g", "Thai ở cổ tử cung, nguy cơ gây viêm âm đạo mạn tính do nấm Candida theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung ở vòi tử cung trái, nguy cơ gây xoắn vòi trứng", "Thai tại sẹo mổ lấy thai cũ, nguy cơ nhau cài răng lược thể Percreta vỡ tử cung vỡ bàng quang xuất huyết nội dữ dội", "Thai ở buồng trứng, nguy cơ gây suy buồng trứng sớm sau sinh"], "correct": 3, "traps": [{"key": "A", "trap": "[qua_bao_ton] CSP là thai ngoài tử cung đặc biệt, tuyệt đối không được chẩn đoán dọa sẩy để dưỡng thai"}, {"key": "B", "trap": "[phan_biet_hep] Thai cổ tử cung làm tổ ở kênh cổ tử cung dưới lỗ trong, CSP làm tổ ở sẹo mổ eo tử cung"}, {"key": "C", "trap": "[sai_tang] Siêu âm thấy túi thai ở sẹo mổ cơ tử cung phía trước, không nằm ở vòi tử cung"}, {"key": "E", "trap": "[nham_dan_so] Thai buồng trứng làm tổ ở mô buồng trứng, không liên quan sẹo mổ cũ"}], "decision": "Tiền sử mổ cũ 2 lần + Buồng tử cung trống + Túi thai ở sẹo mổ eo trước + Cơ tử cung bàng quang mỏng 1.6 mm + Doppler tăng sinh mạch -> Thai tại sẹo mổ lấy thai cũ (Cesarean Scar Pregnancy - CSP) -> Nguy cơ nhau cài răng lược Percreta / vỡ tử cung vỡ bàng quang xuất huyết nội dữ dội.", "explanation": "Thai tại sẹo mổ cũ (Cesarean Scar Pregnancy - CSP) là tình huống túi thai làm tổ trong lớp cơ tử cung tại vị trí sẹo mổ lấy thai trước đó. Siêu âm TVS: (1) Buồng tử cung và kênh cổ tử cung rỗng; (2) Túi thai nằm ở eo trước tử cung; (3) Lớp cơ tử cung giữa bàng quang và túi thai mỏng (< 3 mm). Nếu tiếp tục dưỡng thai, gai nhau sẽ xâm lấn đâm thủng bàng quang (nhau cài răng lược Percreta) gây vỡ tử cung và chảy máu ngập ối/ổ bụng đe dọa tính mạng người mẹ."}, {"id": 20, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 33 tuổi, PARA 2002, chẩn đoán thai tại sẹo mổ lấy thai cũ (CSP) tuổi thai 6 tuần 3 ngày, chưa vỡ, cơ tử cung còn 2.0 mm, beta-hCG = 12.500 mIU/mL. Bệnh nhân hoàn toàn tỉnh táo, huyết động ổn định. Bác sĩ tư vấn phác đồ xử trí can thiệp chấm dứt thai kỳ an toàn nhằm hạn chế tối đa nguy cơ băng huyết cấp tính trong và sau thủ thuật.", "question": "Phác đồ điều trị phối hợp được ưu tiên lựa chọn để chấm dứt thai kỳ CSP an toàn cho bệnh nhân này là gì?", "options": ["Tắc mạch động mạch tử cung UAE phối hợp tiêm Methotrexate tại chỗ hoặc hút khối thai dưới hướng dẫn siêu âm", "Nạo hút buồng tử cung bằng mù tại phòng khám phụ khoa ngoại trú mà không cần chuẩn bị phẫu thuật theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Cho uống viên thuốc Miso-Prostol đơn thuần tại nhà để thai tự sẩy ra ngoài", "Chỉ định mổ cắt tử cung toàn phần ngay lập tức mà không cần bảo tồn", "Tiêm Oxytocin liều cao truyền tĩnh mạch liên tục trong 48 giờ"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_xam_lan] Nạo mù CSP sẽ làm rách diện sẹo mổ gây băng huyết ngập máu tử cung không thể cầm"}, {"key": "C", "trap": "[bo_chong_chi_dinh] Misoprostol làm co bóp tử cung có nguy cơ gây vỡ vị trí sẹo mổ chảy máu dữ dội"}, {"key": "D", "trap": "[qua_xam_lan] Cắt tử cung ngay ở bệnh nhân huyết động ổn định chưa can thiệp bảo tồn là quá mức"}, {"key": "E", "trap": "[bo_chong_chi_dinh] Oxytocin tăng co bóp làm tăng nguy cơ vỡ sẹo mổ cũ"}], "decision": "CSP 6w3d + Huyết động ổn định + Cơ tử cung 2.0 mm + beta-hCG 12.500 -> Bắt buộc can thiệp chấm dứt thai kỳ chủ động -> Phác đồ ưu tiên: Tắc mạch động mạch tử cung (UAE) phòng băng huyết + Tiêm MTX / Hút khối thai dưới siêu âm.", "explanation": "Điều trị thai tại sẹo mổ cũ (CSP) đòi hỏi phối hợp các biện pháp để vừa loại bỏ khối thai vừa kiểm soát nguy cơ băng huyết cấp tính. Phác đồ ưu tiên hiện nay: Tắc mạch động mạch tử cung (Uterine Artery Embolization - UAE) nhằm cắt nguồn máu nuôi khối sẹo, phối hợp tiêm Methotrexate toàn thân / tại chỗ hoặc hút khối thai dưới hướng dẫn siêu âm / phẫu thuật xẻ khối sẹo lấy thai qua nội soi. Nạo hút mù tuyệt đối chống chỉ định vì gây ồ ạt máu không thể cầm."}, {"id": 21, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 30 tuổi, trễ kinh 7 tuần, ra máu âm đạo màu đỏ tươi lượng vừa. Khám mỏ vịt: Cổ tử cung phồng to mất cân đối có hình đồng hồ cát, lỗ ngoài cổ tử cung hé mở thấy một khối sẫm màu nằm hoàn toàn trong kênh cổ tử cung, lỗ trong cổ tử cung đóng kín. Siêu âm TVS: Buồng tử cung trống rỗng, kênh cổ tử cung phồng to chứa một túi thai d = 22 mm có phôi thai và tim thai (+). Dưới túi thai là cơ cổ tử cung bị giãn mỏng.", "question": "Chẩn đoán vị trí thai lạc chỗ và thủ thuật cầm máu tại chỗ sinh lý hiệu quả sau khi lấy khối thai là gì?", "options": ["Thai trong tử cung dọa sẩy, thủ thuật tiêm bắp thuốc co hồi tử cung Ergometrine", "Thai ngoài tử cung ở vòi tử cung, thủ thuật khâu vòng cổ tử cung bằng chỉ Mersilene theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ở cổ tử cung, thủ thuật đặt sonde Foley bơm bóng chèn trong kênh cổ tử cung để cầm máu", "Thai trứng bán phần, thủ thuật nạo nẫy bằng thìa cùn dưới gây mê toàn thân", "Polyp cổ tử cung hoại tử, thủ thuật xoắn đứt chân polyp tại chỗ"], "correct": 2, "traps": [{"key": "A", "trap": "[qua_bao_ton] Cơ cổ tử cung không có lớp cơ chéo co hồi nên Ergometrine không thể cầm máu cổ tử cung"}, {"key": "B", "trap": "[sai_tang] Túi thai nằm hoàn toàn trong kênh cổ tử cung dưới lỗ trong, không phải vòi tử cung"}, {"key": "D", "trap": "[nham_dan_so] Thai trứng nằm trong lòng tử cung, không nằm ở kênh cổ tử cung hình đồng hồ cát"}, {"key": "E", "trap": "[phan_biet_hep] Polyp cổ tử cung không có túi thai và tim thai trên siêu âm"}], "decision": "Cổ tử cung phồng hình đồng hồ cát + Lỗ trong đóng, lỗ ngoài mở + Túi thai nằm trong kênh cổ tử cung -> Thai ở cổ tử cung (Cervical pregnancy) -> Cơ cổ tử cung không có cơ chéo cầm máu -> Đặt sonde Foley bơm bóng 30 ml chèn kênh cổ tử cung cầm máu.", "explanation": "Thai ở cổ tử cung (Cervical pregnancy) là dạng thai lạc chỗ hiếm gặp (< 1%), túi thai làm tổ trong niêm mạc kênh cổ tử cung dưới lỗ trong. Dấu hiệu đặc trưng: Cổ tử cung phồng to hình đồng hồ cát, lỗ trong đóng, lỗ ngoài mở. Do cổ tử cung chủ yếu là mô liên kết và không có lớp cơ chéo co hồi siết mạch như thân tử cung, nên sau khi tống xuất khối thai sẽ gây chảy máu rất dữ dội. Thủ thuật cầm máu sinh lý hiệu quả là đặt sonde Foley vào kênh cổ tử cung và bơm bóng 30 - 50 ml để chèn ép trực tiếp diện rau bám."}, {"id": 22, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 27 tuổi, trễ kinh 6 tuần, đau hố chậu trái. Phẫu thuật nội soi thám sát ghi nhận: Vòi tử cung bên trái hoàn toàn bình thường, mềm mại, không tổn thương. Buồng trứng trái phồng to kích thước 3.5 x 3.0 cm, bên trong nhu mô buồng trứng có một khối thai bóc tách ra thấy có nhung mao gai nhau. Khối thai được nối với tử cung bằng dây dằng riêng buồng trứng. Kết quả giải phẫu bệnh khẳng định mô thai nằm hoàn toàn trong tổ chức buồng trứng.", "question": "Bộ tiêu chuẩn giải phẫu bệnh kinh điển dùng để khẳng định chẩn đoán thai ở buồng trứng là tiêu chuẩn nào?", "options": ["Tiêu chuẩn ASRM phân loại mức độ dính buồng tử cung", "Tiêu chuẩn Arias-Stella khẳng định phản ứng màng rụng tế bào tuyến nội mạc theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Tiêu chuẩn Fernandez đánh giá thang điểm tiên lượng điều trị Methotrexate", "Tiêu chuẩn Hadlock tính toán kích thước sinh trắc học thai nhi", "Tiêu chuẩn Spiegelberg gồm bốn điều kiện giải phẫu khẳng định thai nằm hoàn toàn trong buồng trứng"], "correct": 4, "traps": [{"key": "A", "trap": "[sai_tang] ASRM là phân loại dính buồng tử cung hoặc lạc nội mạc"}, {"key": "B", "trap": "[nham_dan_so] Arias-Stella là phản ứng màng rụng ở nội mạc tử cung, không phải tiêu chuẩn thai buồng trứng"}, {"key": "C", "trap": "[phan_biet_hep] Fernandez là thang điểm tiên lượng MTX nội khoa"}, {"key": "D", "trap": "[bat_tu_khoa] Hadlock là công thức tính tuổi thai trên siêu âm"}], "decision": "Vòi tử cung bình thường + Khối thai nằm trong nhu mô buồng trứng + Dây dằng riêng buồng trứng dính khối thai vào tử cung -> Thai ở buồng trứng -> Khẳng định bằng Bộ tiêu chuẩn Spiegelberg (4 tiêu chí).", "explanation": "Chẩn đoán thai ở buồng trứng (Ovarian pregnancy) bắt buộc phải thỏa mãn 4 tiêu chuẩn Spiegelberg: (1) Vòi tử cung bên tổn thương hoàn toàn bình thường, không có tổn thương; (2) Túi thai nằm hoàn toàn ở vị trí buồng trứng; (3) Khối thai nối với tử cung bằng dây dằng riêng buồng trứng; (4) Kết quả giải phẫu bệnh thấy nhung mao gai nhau nằm trong tổ chức mô buồng trứng."}, {"id": 23, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 30 tuổi, vô sinh 4 năm, thực hiện thụ tinh trong ống nghiệm (IVF) chuyển 2 phôi. Tuần thứ 7 sau chuyển phôi, sản phụ xuất hiện ra chút dịch nâu âm đạo và đau tức nhẹ hố chậu phải. Siêu âm TVS: Trong buồng tử cung có 01 túi thai d = 24 mm có phôi thai CRL = 10 mm và tim thai (+) sống phát triển bình thường. Tuy nhiên, ở phần phụ bên phải có một khối vòng nhẫn tăng âm d = 26 mm chứa một túi thai thứ hai có phôi thai CRL = 8 mm và tim thai (+) nằm ngoài tử cung.", "question": "Chẩn đoán thai kỳ đặc biệt và chiến lược xử trí sản khoa bảo tồn tối ưu nhất là gì?", "options": ["Thai đôi dị vị, tiêm Methotrexate toàn thân liều cao để tiêu diệt cả hai khối thai theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai đôi dị vị Heterotopic pregnancy, phẫu thuật nội soi xẻ/cắt vòi tử cung phải lấy khối thai ngoài và bảo tồn thai trong buồng", "Song thai trong tử cung dọa sẩy, cho tiêm Oxytocin dưỡng thai và nằm nghỉ tuyệt đối", "Thai trứng bán phần di căn, chỉ định nạo hút buồng tử cung lập tức", "Thai ngoài tử cung đôi hai bên vòi tử cung, mổ cắt hai vòi tử cung"], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] Tiêm MTX toàn thân chống chỉ định tuyệt đối vì thuốc làm chết thai sống trong buồng tử cung"}, {"key": "C", "trap": "[qua_bao_ton] Bỏ sót khối thai ngoài tử cung đang có tim thai sẽ dẫn đến vỡ ngập máu ổ bụng"}, {"key": "D", "trap": "[sai_tang] Trong buồng tử cung có thai sống bình thường, không phải thai trứng"}, {"key": "E", "trap": "[nham_dan_so] Có 1 thai trong buồng và 1 thai ngoài vòi, không phải thai ngoài hai bên"}], "decision": "Chuyển 2 phôi IVF + 1 thai sống trong tử cung + 1 thai sống ngoài vòi tử cung phải -> Thai đôi dị vị (Heterotopic pregnancy) -> Chống chỉ định MTX toàn thân -> Phẫu thuật nội soi loại bỏ khối thai ngoài tử cung phải và bảo tồn thai sống trong buồng tử cung.", "explanation": "Thai đôi dị vị (Heterotopic pregnancy) là tình trạng mang đồng thời 1 thai trong buồng tử cung và 1 thai ngoài tử cung. Tỷ lệ tự nhiên rất hiếm (1/30.000), nhưng sau hỗ trợ sinh sản (IVF) tỷ lệ này vọt cao lên 1/100 - 1/500. Xử trí: Chống chỉ định tuyệt đối dùng Methotrexate toàn thân. Lựa chọn chuẩn mực: Phẫu thuật nội soi cắt / xẻ vòi tử cung lấy khối thai ngoài tử cung hoặc tiêm KCL tại chỗ vào khối thai ngoài dưới siêu âm, để bảo tồn an toàn cho thai sống trong buồng tử cung tiếp tục phát triển."}, {"id": 24, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 26 tuổi, trễ kinh 5 tuần, không đau bụng, ra chút dịch nâu âm đạo rồi tự sạch. Sinh hiệu hoàn toàn ổn định. Xét nghiệm beta-hCG ban đầu = 650 mIU/mL. Siêu âm TVS: Buồng tử cung trống, cạnh buồng trứng phải có khối echo hỗn hợp d = 15 mm, không tim thai, không có dịch ổ bụng. Định lượng beta-hCG sau 48 giờ giảm xuống còn 380 mIU/mL (giảm 41.5%). Bệnh nhân không đau bụng, tiếp xúc tốt, cam kết tuân thủ tái khám.", "question": "Chiến lược quản lý sản khoa an toàn và phù hợp nhất cho bệnh nhân này là gì?", "options": ["Nạo hút buồng tử cung bằng chân không và cho uống kháng sinh 10 ngày", "Tiêm Methotrexate liều cao bắp sâu ngay lập tức để phòng ngừa khối thai phát triển lại theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Mổ mở cấp cứu cắt vòi tử cung phải triệt để", "Theo dõi thoái triển tự nhiên không dùng thuốc, lặp lại beta-hCG và siêu âm mỗi 48-72 giờ cho đến khi beta-hCG về âm tính", "Cho bệnh nhân nhập viện theo dõi tại phòng hồi sức tích cực ICU"], "correct": 3, "traps": [{"key": "A", "trap": "[sai_tang] Buồng tử cung trống và beta-hCG đang giảm tự nhiên, nạo buồng tử cung không có lợi ích"}, {"key": "B", "trap": "[qua_muc] beta-hCG < 1.000 mIU/mL và đang tự giảm nhanh 41.5% thì không cần tiêm MTX"}, {"key": "C", "trap": "[qua_xam_lan] Mổ cắt vòi tử cung ở bệnh nhân đang thoái triển tự nhiên hoàn toàn không có triệu chứng là can thiệp thô bạo"}, {"key": "E", "trap": "[qua_muc] Bệnh nhân ổn định không cần nằm phòng ICU"}], "decision": "beta-hCG 650 -> 380 (giảm 41.5% sau 48h) + Khối thai 15 mm + Không đau bụng + Sinh hiệu ổn -> Đủ tiêu chuẩn Theo dõi thoái triển tự nhiên (Expectant management) -> Lặp lại beta-hCG hàng tuần đến khi âm tính.", "explanation": "Theo dõi thoái triển tự nhiên (Expectant management) được chỉ định khi: (1) Bệnh nhân hoàn toàn không có triệu chứng lâm sàng (không đau bụng, không chảy máu nặng); (2) Nồng độ beta-hCG ban đầu thấp (< 1.000 mIU/mL) và có xu hướng tự giảm liên tục trên xét nghiệm lặp lại; (3) Khối thai nhỏ (< 3 cm), không có tim thai; (4) Bệnh nhân cam kết tuân thủ tái khám. Bệnh nhân này có beta-hCG tự giảm 41.5% sau 48h -> Theo dõi thoái triển tự nhiên là lựa chọn an toàn, tránh tác dụng phụ của thuốc và phẫu thuật."}, {"id": 25, "part": 1, "bloom": "Mức 3-4", "stem": "Bác sĩ đánh giá khả năng thành công của điều trị nội khoa Methotrexate cho bệnh nhân thai ngoài tử cung 27 tuổi bằng thang điểm Fernandez (dựa vào 6 thông số: Tuổi thai, nồng độ beta-hCG, nồng độ Progesterone, kích thước khối thai, hình ảnh siêu âm và tình trạng đau bụng). Bệnh nhân đạt tổng số điểm Fernandez = 9 điểm (thang điểm dưới 12 điểm).", "question": "Tổng điểm Fernandez = 9 điểm tiên lượng tỷ lệ thành công của điều trị nội khoa Methotrexate như thế nào?", "options": ["Tiên lượng tỷ lệ thành công rất cao trên 85-90 phần trăm với điều trị Methotrexate", "Tiên lượng thất bại 100 phần trăm, bắt buộc phải chuyển mổ mở cắt tử cung", "Tiên lượng nguy cơ cơ tử cung bị hoại tử tử vong cao", "Tiên lượng bệnh nhân sẽ bị vô sinh vĩnh viễn không thể thụ thai", "Thang điểm Fernandez chỉ dùng để tiên lượng mức độ sốc mất máu"], "correct": 0, "traps": [{"key": "B", "trap": "[qua_muc] Điểm < 12 tiên lượng thành công cao, không phải thất bại"}, {"key": "C", "trap": "[bat_tu_khoa] MTX không gây hoại tử cơ tử cung"}, {"key": "D", "trap": "[nham_dan_so] MTX bảo tồn vòi tử cung giúp duy trì khả năng sinh sản"}, {"key": "E", "trap": "[phan_biet_hep] Fernandez là thang điểm tiên lượng thành công của MTX, không đo mức sốc"}], "decision": "Thang điểm Fernandez = 9 điểm (< 12 điểm) -> Tiên lượng tỷ lệ thành công cao (> 85 - 90%) với phác đồ Methotrexate nội khoa.", "explanation": "Thang điểm Fernandez (Fernandez score) là công thức đa thông số gồm 6 chỉ số lâm sàng và cận lâm sàng để lượng hóa khả năng thành công của điều trị nội khoa Methotrexate trong thai ngoài tử cung. Tổng điểm < 12 điểm tiên lượng tỷ lệ điều trị MTX thành công rất cao (> 85% - 90%). Ngược lại, nếu tổng điểm >= 13 điểm thì tỷ lệ thất bại cao, nên cân nhắc phẫu thuật."}, {"id": 26, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 31 tuổi, trễ kinh 16 tuần, tiền sử từng đau bụng cấp rỉ rả ở tuần thứ 7 nhưng không khám. Hiện tại bệnh nhân vào viện vì đau bụng gồ bất thường. Khám lâm sàng: Thấy các phần thai nhi sờ rất rõ ngay dưới da bụng người mẹ, tử cung kích thước nhỏ tách biệt nằm thấp ở khung chậu. Siêu âm: 01 thai sống 16 tuần nằm hoàn toàn trong khoang ổ bụng giữa các quai ruột, không có cơ tử cung bao quanh túi thai, bánh nhau bám rộng lên phúc mạc mạc nối lớn và ruột.", "question": "Chẩn đoán thai lạc chỗ vị trí hiếm gặp và nguy cơ tai biến lớn nhất khi xử trí bánh nhau trong mổ là gì?", "options": ["Thai ở cổ tử cung, nguy cơ gây rách tầng sinh môn phức tạp theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai trong tử cung dọa sẩy, nguy cơ vỡ ối sớm", "Thai trong ổ bụng, nguy cơ chảy máu ồ ạt không cầm được nếu cố tình bóc tách bánh nhau bám trên mạc nối và cơ quan nội tạng", "Thai trứng bán phần, nguy cơ hóa ác thành Choriocarcinoma", "Thai đoạn kẽ tử cung, nguy cơ thủng bàng quang"], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] Khối thai nằm trong khoang ổ bụng, không nằm ở cổ tử cung"}, {"key": "B", "trap": "[sai_tang] Thai nằm ngoài tử cung giữa các quai ruột, không có cơ tử cung bao quanh"}, {"key": "D", "trap": "[bat_tu_khoa] Có thai nhi phát triển 16w trong ổ bụng, không phải thai trứng"}, {"key": "E", "trap": "[phan_biet_hep] Thai nằm giữa quai ruột phúc mạc, không phải thai đoạn kẽ"}], "decision": "Thai 16w nằm trong khoang ổ bụng между quai ruột + Không có cơ tử cung bao quanh + Nhau bám mạc nối phúc mạc -> Thai trong ổ bụng (Abdominal pregnancy) -> Nguy cơ chảy máu ồ ạt không cầm được nếu cố tình bóc tách bánh nhau bám trên tạng rỗng/mạch máu.", "explanation": "Thai trong ổ bụng (Abdominal pregnancy) là dạng thai lạc chỗ rất hiếm (< 1%) nhưng có tỷ lệ tử vong mẹ cao gấp 8 lần so với thai ở vòi tử cung. Thường là thứ phát sau sẩy thai qua loa vòi hoặc vỡ vòi tử cung nhỏ, phôi thai rơi vào ổ bụng và làm tổ lại trên phúc mạc, mạc nối lớn hoặc ruột. Nguyên tắc phẫu thuật: Lấy thai ra cẩn thận; với bánh nhau bám trên cơ quan nội tạng/mạch máu lớn tuyệt đối KHÔNG cố bóc tách vì sẽ gây chảy máu xối xả không thể cầm. Lựa chọn an toàn là buộc dây rốn sát bánh nhau, để lại bánh nhau trong ổ bụng và điều trị MTX hỗ trợ thoái triển bánh nhau."}, {"id": 27, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 28 tuổi, nghi ngờ thai ngoài tử cung, được thực hiện nạo kiểm tra buồng tử cung chẩn đoán. Kết quả phẫu thuật đại thể: Mô nạo rửa trong nước không thấy có nhung mao gai nhau trôi nổi (Chorionic villi -). Kết quả giải phẫu bệnh vi thể mô nội mạc tử cung: Quan sát thấy các tế bào tuyến nội mạc phì đại, nhân to dị dạng, tăng sắc, tế bào chất chứa nhiều glycogen (Phản ứng Arias-Stella).", "question": "Phản ứng Arias-Stella trên vi thể nội mạc tử cung phản ánh tình trạng sinh lý bệnh nào?", "options": ["Là tế bào gai nhau bị thoái hóa mỡ do nhiễm virus Rubella", "Là tế bào ung thư biểu mô tuyến nội mạc tử cung ác tính giai đoạn tiến triển theo đúng quy trình hướng dẫn lâm sàng chuẩn mực theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Là vi khuẩn Chlamydia gây viêm nội mạc tử cung mạn tính hoại tử", "Là hình ảnh khẳng định chắc chắn 100% thai trong tử cung phát triển bình thường", "Là phản ứng màng rụng biệt hóa của tế bào tuyến nội mạc tử cung dưới tác động của estrogen và progesterone nội tiết thai kỳ, không có nhung mao gai nhau"], "correct": 4, "traps": [{"key": "A", "trap": "[phan_biet_hep] Không liên quan đến nhiễm virus Rubella"}, {"key": "B", "trap": "[nham_dan_so] Nhân to dị dạng dễ nhầm với ung thư nhưng đây là biến đổi lành tính do nội tiết thai kỳ"}, {"key": "C", "trap": "[bat_tu_khoa] Arias-Stella do hormone thai kỳ, không phải do nhiễm vi khuẩn"}, {"key": "D", "trap": "[qua_bao_ton] Phản ứng Arias-Stella xuất hiện ở cả thai trong và thai ngoài tử cung, mô nạo không thấy gai nhau gợi ý thai ngoài"}], "decision": "Mô nạo không có nhung mao gai nhau (Chorionic villi -) + Tế bào tuyến phì đại nhân to phì đại chứa glycogen -> Phản ứng Arias-Stella -> Phản ứng màng rụng nội mạc dưới tác động hormone thai kỳ khi có thai ngoài tử cung.", "explanation": "Phản ứng Arias-Stella (Arias-Stella reaction) là sự biến đổi đặc trưng của các tế bào tuyến nội mạc tử cung dưới tác động của nồng độ Estrogen và Progesterone cao trong thai kỳ (tế bào phì đại, nhân to tăng sắc, chứa nhiều glycogen). Phản ứng này xuất hiện khi có thai (kể cả thai trong hay thai ngoài tử cung). Khi nạo buồng tử cung thấy phản ứng Arias-Stella nhưng **hoàn toàn không thấy nhung mao gai nhau (Chorionic villi)** -> Bằng chứng gián tiếp khẳng định thai làm tổ ngoài buồng tử cung."}, {"id": 28, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 26 tuổi, trễ kinh 6 tuần, được chẩn đoán thai ngoài tử cung ở vòi tử cung phải và được phẫu thuật nội soi cắt vòi tử cung thành công. Xét nghiệm nhóm máu của sản phụ: Nhóm máu O, RhD âm tính (Rh-). Xét nghiệm Coombs gián tiếp âm tính. Bác sĩ chỉ định tiêm sinh phẩm miễn dịch dự phòng đồng đồng miễn dịch RhD cho sản phụ.", "question": "Chỉ định tiêm sinh phẩm dự phòng đồng đồng miễn dịch RhD cho sản phụ này là gì?", "options": ["Truyền khối hồng cầu RhD dương tính ngay lập tức để trung hòa kháng thể", "Tiêm bắp Anti-D Immunoglobulin liều 50 mcg đến 300 mcg trong vòng 72 giờ sau phẫu thuật", "Tiêm vắc-xin phòng uốn ván và vắc-xin viêm gan B liều kép", "Tiêm Corticoid Dexamethasone liều cao để chống thải ghép", "Không cần tiêm sinh phẩm vì thai ngoài tử cung không gây nhạy cảm hồng cầu theo đúng quy trình hướng dẫn lâm sàng chuẩn mực"], "correct": 1, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] Truyền hồng cầu RhD(+) cho mẹ RhD(-) làm kích hoạt đồng miễn dịch nghiêm trọng hơn"}, {"key": "C", "trap": "[nham_dan_so] Vắc xin uốn ván/viêm gan B không giải quyết được bất đồng RhD"}, {"key": "D", "trap": "[qua_muc] Corticoid không ngăn được sự tạo kháng thể Anti-D"}, {"key": "E", "trap": "[qua_bao_ton] Sẩy/mổ thai ngoài tử cung vẫn gây thoát hồng cầu thai nhi vào máu mẹ RhD(-)"}], "decision": "Mẹ RhD âm tính + Phẫu thuật mổ thai ngoài tử cung -> Nguy cơ thoát hồng cầu thai nhi vào máu mẹ gây đồng miễn dịch RhD -> Bắt buộc tiêm bắp Anti-D Immunoglobulin (50 - 300 mcg) trong vòng 72 giờ.", "explanation": "Ở tất cả phụ nữ mang thai có nhóm máu RhD âm tính khi bị thai ngoài tử cung (sẩy, vỡ hoặc sau phẫu thuật/điều trị nội khoa), sự thoát hồng cầu mang gien RhD(+) của thai nhi vào tuần hoàn mẹ có thể kích hoạt hệ miễn dịch mẹ sản xuất kháng thể Anti-D (đồng miễn dịch RhD), gây bệnh tán huyết nặng cho các thai kỳ sau. Chỉ định bắt buộc: Tiêm bắp Anti-D Immunoglobulin (liều 50 - 300 mcg tùy tuổi thai) trong vòng 72 giờ sau can thiệp."}, {"id": 29, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân 30 tuổi, trễ kinh 6 tuần, ra máu âm đạo nâu rỉ rả kéo dài 10 ngày. Đau âm ỉ hố chậu trái. Siêu âm TVS: Buồng tử cung trống. Tại vị trí loa vòi tử cung trái quan sát thấy một khối echo hỗn hợp d = 22 mm đang có xu hướng dịch chuyển hướng ra ngoài loa vòi, có ít dịch máu đọng ở túi cùng sau. Định lượng beta-hCG = 850 mIU/mL và giảm dần qua các lần thử.", "question": "Cơ chế sinh lý bệnh diễn tiến tự nhiên của thai ngoài tử cung đoạn loa vòi là gì?", "options": ["Thai đoạn loa vòi đâm thủng trực tràng gây rò âm đạo trực tràng", "Thai đoạn loa vòi luôn vỡ sớm ở tuần thứ 4 gây choáng mất máu dữ dội theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai đoạn loa vòi sẽ tự chui vào lòng tử cung làm tổ lại bình thường", "Thai đoạn loa vòi dễ bị sẩy qua loa vòi vào khoang phúc mạc gây chảy máu rỉ rả tạo bọc huyết tụ", "Thai đoạn loa vòi biến thành u nguyên bào nuôi ác tính di căn não"], "correct": 3, "traps": [{"key": "A", "trap": "[qua_muc] Thai vòi tử cung sẩy không đâm thủng trực tràng"}, {"key": "B", "trap": "[phan_biet_hep] Đoạn eo vòi tử cung hẹp mới dễ vỡ sớm ở tuần 6-8, đoạn loa vòi rộng nên dễ sẩy qua loa"}, {"key": "C", "trap": "[sai_tang] Thai đã làm tổ ở vòi tử cung không thể tự chui ngược lại lòng tử cung"}, {"key": "E", "trap": "[nham_dan_so] Thai loa vòi sẩy hoàn toàn/không hoàn toàn, không phải choriocarcinoma"}], "decision": "Khối thai ở loa vòi trái + Di chuyển ra ngoài loa vòi + beta-hCG 850 mIU/mL giảm dần -> Diễn tiến sẩy qua loa vòi tử cung (Tubal abortion) -> Chảy máu rỉ rả vào túi cùng Douglas tạo bọc huyết tụ.", "explanation": "Thai ngoài tử cung đoạn loa vòi (fimbrial ectopic) nằm ở phần xa nhất của vòi tử cung gần buồng trứng. Do phô làm tổ nông ở niêm mạc loa vòi nên hướng tiến triển sinh lý tự nhiên phổ biến nhất là **Sẩy thai qua loa vòi (Tubal abortion)** vào khoang phúc mạc. Quá trình sẩy qua loa gây chảy máu rỉ rả kéo dài đọng ở túi cùng Douglas, được mạc nối bao bọc tạo bọc huyết tụ tiểu khung."}, {"id": 30, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 22 tuổi, chưa lập gia đình, đột ngột đau chói hố chậu phải sau khi vận động mạnh (tập thể thao) vào ngày thứ 22 của chu kỳ kinh (chu kỳ đều 28 ngày, chưa trễ kinh). Sinh hiệu: Mạch 88 lần/phút, HA 110/70 mmHg. Khám bụng: Ấn đau hố chậu phải, có phản ứng đề kháng nhẹ. Siêu âm TVS: Buồng tử cung trống, nội mạc dày 12 mm. Buồng trứng phải có một nang d = 30 mm bờ dày chứa nhiều dải xơ mạng lưới (xuất huyết nang hoàng thể), túi cùng Douglas có dịch không âm vang d = 15 mm. Xét nghiệm cấp cứu: Định lượng beta-hCG huyết thanh = < 2.3 mIU/mL (âm tính).", "question": "Chẩn đoán xác định bệnh lý phụ khoa cấp tính và yếu tố cận lâm sàng then chốt giúp loại trừ thai lạc chỗ là gì?", "options": ["Nang hoàng thể buồng trứng phải vỡ / xuất huyết, xét nghiệm beta-hCG huyết thanh âm tính giúp loại trừ thai lạc chỗ", "Thai ngoài tử cung vỡ ngập máu ổ bụng, cần mổ mở cắt vòi tử cung khẩn cấp theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Viêm ruột thừa cấp tính muộn, chuyển khoa Ngoại mổ cắt ruột thừa", "U nang bì buồng trứng xoắn hoại tử, chỉ định cắt buồng trứng phải", "Thủng ổ loét dạ đành hành tá tràng, chuyển mổ khâu lỗ thủng"], "correct": 0, "traps": [{"key": "B", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính (< 2.3 mIU/mL) khẳng định 100% không phải thai ngoài tử cung"}, {"key": "C", "trap": "[phan_biet_hep] Siêu âm thấy rõ nang hoàng thể xuất huyết 30 mm và chưa trễ kinh, không nghĩ viêm ruột thừa"}, {"key": "D", "trap": "[nham_dan_so] Phổ siêu âm dải xơ dạng mạng lưới (spider-web) đặc trưng cho xuất huyết nang hoàng thể, không phải u nang bì"}, {"key": "E", "trap": "[sai_tang] Bệnh lý vùng chậu phụ khoa, không có hơi tự do dưới hoành để nghĩ thủng dạ dày"}], "decision": "Đau hố chậu phải ngày 22 chu kỳ + Nang buồng trứng 30 mm chứa dải xơ mạng lưới + Dịch túi cùng 15 mm + beta-hCG âm tính (< 2.3 mIU/mL) -> Xuất huyết / vỡ nang hoàng thể buồng trứng (Corpus luteum hematoma) -> beta-hCG âm tính hoàn toàn loại trừ thai lạc chỗ.", "explanation": "Vỡ hoặc xuất huyết nang hoàng thể buồng trứng (Ruptured corpus luteum) là chẩn đoán phân biệt cấp cứu phụ khoa rất thường gặp với thai ngoài tử cung. Bệnh nhân cũng có đau hố chậu đột ngột, có dịch túi cùng và khối ở buồng trứng. Tuy nhiên, yếu tố then chốt để phân biệt chắc chắn là **định lượng beta-hCG huyết thanh hoàn toàn âm tính** (loại trừ 100% bệnh lý liên quan đến thai nghén). Xử trí nang hoàng thể xuất huyết chủ yếu là điều trị bảo tồn theo dõi huyết động."}, {"id": 31, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 24 tuổi, trễ kinh 5 ngày, đau khu trú ở hố chậu phải kèm sốt 38.2°C, buồn nôn và chán ăn. Khám lâm sàng: Mạch 92 lần/phút, HA 115/70 mmHg. Bụng mềm, ấn đau chói điểm McBurney ở hố chậu phải, có phản ứng đề kháng thành bụng rõ. Khám phụ khoa: Tử cung bình thường, lắc cổ tử cung không đau, hai phần phụ mềm không đau. Xét nghiệm máu: Bạch cầu vọt lên 15.200/mm³ (Neutrophil 86%), CRP = 45 mg/L. Định lượng beta-hCG huyết thanh = < 2.0 mIU/mL (âm tính). Siêu âm TVS: Tử cung và hai buồng trứng bình thường, vùng hố chậu phải có cấu trúc hình ống tịt đầu d = 8.5 mm, ấn không xẹp, xung quanh có thâm nhiễm mỡ.", "question": "Chẩn đoán bệnh lý ngoại khoa cấp tính và yếu tố cận lâm sàng khẳng định loại trừ thai ngoài tử cung là gì?", "options": ["Viêm phần phụ cấp do Chlamydia, chỉ định điều trị Doxycycline uống 14 ngày", "Thai ngoài tử cung ở vòi tử cung phải vỡ, chỉ định mổ cắt vòi tử cung cấp cứu theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Viêm ruột thừa cấp tính, xét nghiệm beta-hCG âm tính giúp loại trừ 100 phần trăm thai ngoài tử cung", "U nang buồng trứng phải xoắn hoại tử, chỉ định mổ mở cắt buồng trứng", "Sẩy thai không hoàn toàn, chỉ định nạo hút buồng tử cung bằng chân không"], "correct": 2, "traps": [{"key": "A", "trap": "[phan_biet_hep] Điểm McBurney đau, siêu âm thấy ruột thừa d = 8.5 mm thâm nhiễm mỡ, lắc CTC không đau -> Không nghĩ viêm phần phụ"}, {"key": "B", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính (< 2.0 mIU/mL) hoàn toàn loại trừ thai ngoài tử cung"}, {"key": "D", "trap": "[nham_dan_so] Siêu âm hai buồng trứng bình thường, hình ảnh ruột thừa viêm rõ"}, {"key": "E", "trap": "[sai_tang] beta-hCG âm tính và tử cung bình thường, loại trừ sẩy thai"}], "decision": "Đau McBurney hố chậu phải + Sốt 38.2°C + BC 15.200 + Siêu âm ruột thừa d = 8.5 mm thâm nhiễm mỡ + beta-hCG âm tính (< 2.0 mIU/mL) -> Viêm ruột thừa cấp tính (Acute appendicitis) -> beta-hCG âm tính loại trừ hoàn toàn thai ngoài tử cung.", "explanation": "Viêm ruột thừa cấp ở phụ nữ độ tuổi sinh đẻ có trễ kinh là một cạm bẫy chẩn đoán phân biệt kinh điển. Tuy nhiên, bệnh nhân có sốt 38.2°C, hội chứng nhiễm trùng (bạch cầu 15.200/mm³), đau đúng điểm McBurney, siêu âm thấy ruột thừa viêm d = 8.5 mm thâm nhiễm mỡ, và quan trọng nhất là **beta-hCG huyết thanh âm tính (< 2.0 mIU/mL)** -> Khẳng định 100% không phải thai ngoài tử cung, chuyển mổ cắt ruột thừa cấp cứu."}, {"id": 32, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 26 tuổi, có tiền sử quan hệ tình dục không an toàn, trễ kinh 3 ngày. Bệnh nhân vào viện vì sốt 38.5°C, đau âm ỉ liên tục cả hai bên hố chậu, âm đạo ra nhiều khí hư màu vàng đục mùi hôi. Thăm khám: Mạch 96 lần/phút, HA 110/70 mmHg. Bụng mềm, ấn đau chói cả hai bên hố chậu. Khám mỏ vịt: Cổ tử cung rỉ mủ màu vàng từ lỗ trong. Khám hai tay: Lắc cổ tử cung làm bệnh nhân đau dữ dội cả hai bên (chandelier sign), hai phần phụ dày ấn đau chói. Xét nghiệm: Bạch cầu 16.500/mm³, CRP = 62 mg/L, soi tươi khí hư thấy nhiều bạch cầu đa nhân và vi khuẩn Chlamydia trachomatis (+). 定量 beta-hCG huyết thanh = < 2.0 mIU/mL (âm tính).", "question": "Chẩn đoán xác định bệnh lý nhiễm trùng phần phụ và hướng điều trị chuẩn mực là gì?", "options": ["Sẩy thai nhiễm khuẩn, chỉ định gắp thai tại phòng thủ thuật", "Thai ngoài tử cung đôi hai bên vòi tử cung vỡ, mổ cấp cứu cắt hai vòi tử cung theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Thai ngoài tử cung thể bọc huyết tụ, phẫu thuật nạo hút buồng tử cung", "Thủng ruột thừa gây viêm phúc mạc toàn thể, mổ màng bụng rửa ổ bụng", "Viêm phần phụ cấp / Viêm vùng chậu PID, điều trị nội khoa bằng phác đồ kháng sinh phổ rộng phối hợp"], "correct": 4, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính không có thai để sẩy"}, {"key": "B", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính loại trừ thai ngoài tử cung hoàn toàn"}, {"key": "C", "trap": "[sai_tang] beta-hCG âm tính và tử cung bình thường không phải thai bọc huyết tụ"}, {"key": "D", "trap": "[phan_biet_hep] Đau hai bên hố chậu, CTC rỉ mủ và lắc CTC đau chói hai bên đặc trưng cho PID, không phải thủng ruột thừa"}], "decision": "Sốt 38.5°C + Đau 2 bên hố chậu + CTC rỉ mủ vàng + Lắc CTC đau chói 2 bên (Chandelier sign) + Chlamydia (+) + beta-hCG âm tính (< 2.0 mIU/mL) -> Viêm phần phụ cấp / Viêm vùng chậu (PID) -> Bắt buộc điều trị kháng sinh phổ rộng phối hợp.", "explanation": "Viêm phần phụ cấp / Bệnh viêm vùng chậu (Pelvic Inflammatory Disease - PID) có thể nhầm với thai ngoài tử cung do cũng gây đau bụng dưới và ra dịch âm đạo bất thường. Đặc điểm giúp phân biệt PID: Sốt cao, đau liên tục cả HAI bên hố chậu, âm đạo ra khí hư mủ vàng, cổ tử cung lắc đau chói hai bên (dấu hiệu Chandelier sign), bạch cầu và CRP tăng rất cao, và **beta-hCG huyết thanh âm tính**. Xử trí: Điều trị kháng sinh phổ rộng phối hợp che phủ vi khuẩn yếm khí và Chlamydia."}, {"id": 33, "part": 1, "bloom": "Mức 3-4", "stem": "Sản phụ 28 tuổi, trễ kinh 7 tuần, ra máu âm đạo đỏ tươi lượng nhiều kèm máu cục và đau quặn dồn dập vùng hạ vị. Khám mỏ vịt: Cổ tử cung mở 2 cm, thấy tổ chức thai mềm đang kẹt ở lỗ ngoài cổ tử cung và chảy máu tươi đỏ. Siêu âm TVS: Buồng tử cung có tổ chức hỗn hợp đang di chuyển xuống kênh cổ tử cung, hai phần phụ bình thường không có khối bất thường, không có dịch tự do ổ bụng. Định lượng beta-hCG = 18.500 mIU/mL. Mô nạo tống xuất rửa trong nước thấy các nhung mao gai nhau (Chorionic villi) trôi nổi rõ ràng.", "question": "Chẩn đoán sản khoa chắc chắn và điểm khác biệt cốt lõi với thai ngoài tử cung là gì?", "options": ["Thai ngoài tử cung vỡ ngập máu, mổ mở cấp cứu kẹp cắt vòi tử cung theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Sẩy thai trong tử cung tiến triển, xuất hiện nhung mao gai nhau trong mô tống xuất khẳng định thai làm tổ trong buồng tử cung", "Thai ngoài tử cung thể bọc huyết tụ, tiêm Methotrexate nội khoa", "Thai ở cổ tử cung, đặt bóng Foley chèn kênh cổ tử cung", "Thai trứng toàn phần hoại tử, chỉ định tiêm hóa trị dactinomycin"], "correct": 1, "traps": [{"key": "A", "trap": "[sai_tang] Thai làm tổ trong buồng tử cung đang sẩy qua cổ tử cung, siêu âm không có dịch ổ bụng"}, {"key": "C", "trap": "[qua_xam_lan] Khai quật thấy nhung mao gai nhau khẳng định thai trong tử cung, loại trừ thai ngoài"}, {"key": "D", "trap": "[phan_biet_hep] Khối thai từ lòng tử cung đang sẩy ra qua cổ tử cung, không phải thai làm tổ ở niêm mạc cổ tử cung"}, {"key": "E", "trap": "[nham_dan_so] Tìm thấy gai nhau bình thường, không phải hình ảnh bóng nước thai trứng"}], "decision": "Trễ kinh 7w + Ra máu đỏ tươi cục + CTC mở 2 cm có thai kẹt + Siêu âm tổ chức sẩy xuống kênh CTC + Tìm thấy nhung mao gai nhau (Chorionic villi) -> Sẩy thai trong tử cung tiến triển -> Khẳng định thai làm tổ trong tử cung, loại trừ thai ngoài tử cung.", "explanation": "Sẩy thai trong tử cung (dọa sẩy, sẩy thai tiến triển) là chẩn đoán phân biệt quan trọng hàng đầu. Đặc điểm phân biệt: Ra máu đỏ tươi lượng nhiều có cục máu đông (thai ngoài ra máu nâu đen rỉ rả không đông), đau quặn từng cơn dồn dập ở hạ vị, cổ tử cung xóa mở thấy tổ chức thai. Bằng chứng vàng khẳng định thai trong tử cung là **tìm thấy nhung mao gai nhau (Chorionic villi)** trong mô nạo / tống xuất khi thử rửa trong nước."}, {"id": 34, "part": 1, "bloom": "Mức 3-4", "stem": "Bệnh nhân nữ 25 tuổi, không trễ kinh (kinh nguyệt vừa sạch cách đây 5 ngày). Bệnh nhân đột ngột đau quặn dồn dập dữ dội vùng hố chậu trái kèm nôn mửa liên tục 4 lần. Sinh hiệu: Mạch 100 lần/phút, HA 120/75 mmHg, không sốt. Khám bụng: Bụng mềm, ấn đau chói hố chậu trái, có cảm ứng phúc mạc nhẹ khu trú. Khám phụ khoa: Tử cung bình thường, phần phụ trái sờ thấy một khối tròn d = 6 cm, ranh giới rõ, di động hạn chế, đè vào bệnh nhân đau nảy người. Siêu âm TVS: Buồng tử cung trống, nội mạc 6 mm. Buồng trứng trái có khối nang đường kính 62 mm phản âm hỗn hợp, không có phổ màu Doppler chảy vào cuống nang. Xét nghiệm beta-hCG = < 2.0 mIU/mL (âm tính).", "question": "Chẩn đoán ngoại - phụ khoa cấp tính và yếu tố cận lâm sàng loại trừ thai lạc chỗ là gì?", "options": ["Sẩy thai không hoàn toàn, nạo hút buồng tử cung", "Thai ngoài tử cung ở vòi tử cung trái vỡ, mổ mở cấp cứu cắt vòi tử cung theo đúng quy trình hướng dẫn lâm sàng chuẩn mực", "Viêm ruột thừa cấp tính muộn, mổ cắt ruột thừa", "Xoắn u nang buồng trứng trái hoại tử, xét nghiệm beta-hCG âm tính giúp loại trừ hoàn toàn thai lạc chỗ", "Chửa ngoài tử cung thể bọc huyết tụ, tiêm Methotrexate"], "correct": 3, "traps": [{"key": "A", "trap": "[sai_tang] beta-hCG âm tính và tử cung bình thường không có thai để sẩy"}, {"key": "B", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính (< 2.0 mIU/mL) hoàn toàn không có thai"}, {"key": "C", "trap": "[sai_tang] Khối u buồng trứng trái 62 mm xoắn mất dòng Doppler, không phải viêm ruột thừa hố chậu phải"}, {"key": "E", "trap": "[bo_chong_chi_dinh] beta-hCG âm tính không phải thai ngoài tử cung để tiêm MTX"}], "decision": "Đau quặn dữ dội hố chậu trái + Nôn mửa + Khối u buồng trứng 62 mm mất dòng Doppler cuống + beta-hCG âm tính (< 2.0 mIU/mL) -> Xoắn u nang buồng trứng trái hoại tử -> beta-hCG âm tính loại trừ thai lạc chỗ hoàn toàn.", "explanation": "Xoắn u nang buồng trứng (Ovarian cyst torsion) gây đau quặn dữ dội đột ngột ở hố chậu kèm nôn mửa nhiều do kích thích phúc mạc. Khám sờ thấy khối u di động hạn chế ấn đau chói. Siêu âm TVS thấy khối u buồng trứng mất dòng chảy Doppler cuống mạch. Yếu tố khẳng định loại trừ thai ngoài tử cung là **xét nghiệm beta-hCG huyết thanh âm tính (< 2.0 mIU/mL)**. Chỉ định: Mổ nộ
