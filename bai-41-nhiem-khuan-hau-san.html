    const QUESTIONS = [{"id": 1, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 25 tuổi, con so, sinh thường ngả âm đạo ngày thứ 3 hậu sản. Bệnh nhân nhập viện vì đau nhức nhiều vùng tầng sinh môn. Thăm khám lâm sàng: Sinh hiệu ổn định, Mạch 80 lần/phút, HA 110/70 mmHg, Thân nhiệt 37.8°C. Tử cung co hồi tốt ngang mắm mu, sản dịch sẫm màu không hôi. Khám vết may tầng sinh môn: Vùng sẹo may sưng đỏ, nề nhẹ, ấn đau rát, rỉ ít dịch trong lẫn mủ nhẹ ở chân chỉ, không có cầu ổ mủ sâu.", "question": "Chẩn đoán xác định và phác đồ xử trí lâm sàng chuẩn mực nhất cho sản phụ là gì?", "options": ["Viêm niêm mạc tử cung cấp tính, chỉ định nạo hút buồng tử cung bằng chân không, tiêm kháng sinh phổ rộng.", "Nhiễm khuẩn tầng sinh môn sâu, chỉ định mổ mở cắt lọc toàn bộ tầng sinh môn, tiêm kháng sinh tĩnh mạch liều cao.", "Nhiễm khuẩn vết may tầng sinh môn nông, cắt bỏ chỉ may hở chân mủ, rửa sát khuẩn tại chỗ, dùng kháng sinh đường uống.", "Bình thường hậu sản, cho sản phụ về nhà tự ngâm nước muối ấm, không cần dùng thuốc kháng sinh.", "Viêm tắc tĩnh mạch chậu, cho dùng thuốc chống đông Heparin đường tiêm, nằm nghỉ tuyệt đối tại giường."], "correct": 2, "traps": [{"key": "A", "trap": "[sai_tang] Nhầm nhọt tổn thương tầng sinh môn với viêm niêm mạc tử cung."}, {"key": "B", "trap": "[qua_muc] Mổ cắt lọc toàn bộ tầng sinh môn là can thiệp quá mức khi vết mổ chỉ nhiễm khuẩn nông."}, {"key": "D", "trap": "[qua_bao_ton] Bỏ qua vết may sưng rỉ mủ không điều trị gây nhiễm khuẩn lan rộng."}, {"key": "E", "trap": "[nham_dan_so] Nhầm với bệnh lý viêm tắc tĩnh mạch chậu hậu sản."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sinh thường N3 + Vết may tầng sinh môn sưng đỏ rỉ mủ + Tử cung co tốt sản dịch không hôi -> Nhiễm khuẩn vết may tầng sinh môn nông -> Cắt chỉ rỉ mủ + Rửa sát khuẩn + Kháng sinh uống.", "explanation": "Nhiễm khuẩn tầng sinh môn nông xuất hiện sớm sau sinh. Xử trí chuẩn mực: Cắt bỏ chỉ may bị nhiễm khuẩn để thoát dịch mủ, rửa sạch vết thương hàng ngày bằng dung dịch sát khuẩn Betadine/Oxy già, phối hợp kháng sinh đường uống."}, {"id": 2, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con rạ, ngày thứ 5 sau sinh ngả âm đạo có cắt khâu tầng sinh môn. Bệnh nhân sốt cao 39.2°C, rét run, đau nhức dữ dội vùng tầng sinh môn không thể ngồi được. Sinh hiệu: Mạch 105 lần/phút, HA 100/60 mmHg. Khám tầng sinh môn: Vùng sẹo may sưng to gồ lên, da thâm tím hoại tử nhẹ, ấn có cảm giác phập phồng mủ sâu, chảy mủ đục hôi thối nồng nặc. Tử cung co hồi bình thường.", "question": "Quy trình xử trí ngoại khoa và phác đồ điều trị tối ưu nhất cho sản phụ là gì?", "options": ["Tụ máu tầng sinh môn vô khuẩn, chườm đá lạnh tại chỗ, cho uống thuốc cầm máu Tranexamic acid.", "Nhiễm khuẩn tầng sinh môn nông, chỉ dùng Paracetamol hạ sốt, ngâm hậu môn bằng dung dịch nước muối, tiếp tục theo dõi ngoại trú.", "Viêm niêm mạc tử cung, tiến hành nạo hút buồng tử cung cấp cứu, tiêm Oxytocin tăng co hồi tử cung.", "Viêm phúc mạc chậu, mổ nội soi thăm dò ổ bụng, cắt bỏ tử cung toàn phần và hai phần phụ.", "Nhiễm khuẩn tầng sinh môn sâu hoại tử, bóc tách thoát ổ mủ, cắt lọc tổ chức hoại tử, dùng kháng sinh tĩnh mạch phổ rộng, khâu thì hai khi sạch."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm ổ mủ đục hôi thối với khối tụ máu vô khuẩn."}, {"key": "B", "trap": "[qua_bao_ton] Điều trị bảo tồn ngâm nước muối khi có ổ mủ sâu gây sốc nhiễm khuẩn."}, {"key": "C", "trap": "[sai_tang] Nhầm ổ mủ tầng sinh môn với viêm niêm mạc tử cung."}, {"key": "D", "trap": "[qua_xam_lan] Mổ cắt tử cung lãng phí khi tổn thương hoàn toàn ở tầng sinh môn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sốt 39.2°C + Tầng sinh môn sưng tím phập phồng mủ hôi thối + Tử cung co tốt -> Nhiễm khuẩn tầng sinh môn sâu hoại tử -> Rạch thoát mủ + Cắt lọc hoại tử + Kháng sinh IV + Khâu thì hai.", "explanation": "Nhiễm khuẩn tầng sinh môn sâu có ổ mủ phập phồng hoại tử bắt buộc phải xử trí ngoại khoa: Bộc lộ rộng ổ mủ, cắt lọc hết tổ chức hoại tử, rửa sạch bằng dung dịch sát khuẩn, phối hợp kháng sinh tĩnh mạch phổ rộng (bao phủ vi khuẩn yếm khí và gram âm). Chỉ khâu thì hai khi ổ khuyết hoàn toàn sạch mô hạt."}, {"id": 3, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 24 tuổi, con so, sinh thường ngả âm đạo ngày thứ 3 hậu sản. Bệnh nhân xuất hiện sốt 38.3°C, mệt mỏi, đau tức râm râm vùng hạ vị. Thăm khám: Mạch 88 lần/phút, HA 110/70 mmHg. Khám bụng: Tử cung co hồi chậm, đáy tử cung ngang rốn, mật độ mềm, ấn đau tức nhẹ. Khám mỏ vịt: Cổ tử cung hé mở, sản dịch ra màu đỏ sẫm lẫn hôi đục nhẹ, không có mủ đặc. Siêu âm buồng tử cung: Cánh nội mạc dày 12 mm, không có khối phản âm âm đặc.", "question": "Chẩn đoán thể lâm sàng và phác đồ điều trị ban đầu chuẩn mực nhất cho sản phụ là gì?", "options": ["Nhiễm khuẩn vết may tầng sinh môn, cắt bỏ toàn bộ chỉ may tầng sinh môn, rửa bằng oxy già hàng ngày.", "Viêm niêm mạc tử cung cấp tính, dùng kháng sinh đường tĩnh mạch phối hợp, cho thuốc co hồi tử cung Oxytocin, theo dõi sát sản dịch.", "Viêm phúc mạc toàn thể, chuyển mổ cấp cứu cắt tử cung toàn phần và lau rửa ổ bụng.", "Sẩy thai không hoàn toàn, chỉ định nạo hút buồng tử cung khẩn cấp bằng thìa sắc.", "Căng sữa sinh lý hậu sản, chỉ cần chườm ấm hai vú, cho con bú nhiều lần trong ngày."], "correct": 1, "traps": [{"key": "A", "trap": "[sai_tang] Nhầm viêm tử cung với nhiễm khuẩn tầng sinh môn."}, {"key": "C", "trap": "[qua_xam_lan] Chuyển mổ cắt tử cung khi chỉ mới viêm niêm mạc tử cung đơn thuần."}, {"key": "D", "trap": "[guideline_cu] Nạo hút thìa sắc khi viêm tử cung cấp chưa đánh kháng sinh gây thủng tử cung."}, {"key": "E", "trap": "[qua_bao_ton] Bỏ qua triệu chứng sản dịch hôi tử cung ấn đau nhầm với căng sữa."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N3 hậu sản + Sốt 38.3°C + Tử cung co chậm ấn đau + Sản dịch hôi đục -> Viêm niêm mạc tử cung cấp -> Kháng sinh tĩnh mạch + Oxytocin co hồi tử cung.", "explanation": "Viêm niêm mạc tử cung là thể nhiễm khuẩn hậu sản hay gặp nhất. Tam chứng kinh điển: Sốt (thường ngày 3-4), tử cung co hồi chậm ấn đau, sản dịch hôi. Điều trị: Kháng sinh đường tĩnh mạch (bao phủ gram âm, gram dương và yếm khí) phối hợp thuốc co hồi tử cung Oxytocin."}, {"id": 4, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, mổ lấy thai vì chuyển dạ kéo dài ối vỡ sớm 18 giờ, ngày thứ 4 hậu phẫu. Bệnh nhân sốt cao 39.1°C, rét run, đau quặn hạ vị. Sinh hiệu: Mạch 108 lần/phút, HA 105/65 mmHg. Khám bụng: Tử cung to bằng thai 12 tuần, ấn đau chói vùng hạ vị, vết mổ thành bụng khô sạch không sưng. Khám âm đạo: Cổ tử cung hé mở, sản dịch màu nâu đen hôi thối nồng nặc. Xét nghiệm: Bạch cầu 18.500/mm³, CRP = 78 mg/L.", "question": "Chẩn đoán xác định và phác đồ kháng sinh phối hợp đường tĩnh mạch chuẩn mực nhất là gì?", "options": ["Nhiễm khuẩn đường tiết niệu nhẹ, cho uống Cephalexin liều đơn trong ba ngày.", "Nhiễm khuẩn vết mổ thành bụng sâu, mở rộng toàn bộ vết mổ thành bụng, đặt dải gạc dẫn lưu mủ.", "Viêm tắc tĩnh mạch chậu, cho dùng ngay thuốc tan huyết khối Streptokinase kết hợp Heparin.", "Viêm niêm mạc tử cung sau mổ lấy thai, dùng phối hợp Ampicillin hoặc Cephalosporin thế hệ 3 kết hợp Gentamicin và Metronidazole đường tĩnh mạch.", "Sốt sinh lý hậu phẫu, chỉ cho dùng Paracetamol uống và chườm ấm toàn thân."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_bao_ton] Coi sốt 39.1°C sản dịch hôi thối là sốt sinh lý hậu phẫu."}, {"key": "B", "trap": "[sai_tang] Nhầm viêm tử cung với nhiễm khuẩn vết mổ thành bụng khi vết mổ khô."}, {"key": "C", "trap": "[nham_dan_so] Nhầm với viêm tắc tĩnh mạch chậu."}, {"key": "E", "trap": "[thieu_cau_phan] Chỉ dùng 1 kháng sinh đơn thuần không đủ bao phủ vi khuẩn yếm khí sau mổ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ lấy thai N4 + Sốt 39.1°C rét run + Tử cung đau chói sản dịch hôi thối + BC 18.500 -> Viêm niêm mạc tử cung sau mổ sinh -> Kháng sinh IV 3 thành phần (Amp/Ceph3 + Gentamicin + Metronidazole).", "explanation": "Mổ lấy thai là yếu tố nguy cơ hàng đầu gây viêm niêm mạc tử cung nặng. Phác đồ kháng sinh chuẩn mực bắt buộc phải phối hợp đường tĩnh mạch bao phủ đa vi khuẩn: Penicillin/Ampicillin hoặc Cephalosporin thế hệ 3 (diệt gram dương) + Gentamicin (diệt gram âm) + Metronidazole hoặc Clindamycin (diệt vi khuẩn yếm khí)."}, {"id": 5, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, sinh thường ngả âm đạo ngày thứ 5 hậu sản. Bệnh nhân vào viện vì sốt 38.8°C, đau tức hạ vị, ra máu âm đạo sẫm màu hôi nồng. Khám: Tử cung co hồi chậm, d d = 14 cm, ấn đau tức. Khám âm đạo: Cổ tử cung mở 1 finger, máu đen lẫn bánh nhau mủ chảy ra. Siêu âm buồng tử cung: Có khối phản âm hỗn hợp d = 28 mm kèm tụ dịch. Bạch cầu 16.200/mm³.", "question": "Trình tự xử trí lâm sàng an toàn và chuẩn mực nhất để tránh nguy cơ vi khuẩn huyết là gì?", "options": ["Điều trị kháng sinh tĩnh mạch phổ rộng liều cao trước, sau khi kiểm soát sốt 24 đến 48 giờ mới tiến hành nạo hút buồng tử cung nhẹ nhàng tống xuất nhau sót.", "Nạo hút buồng tử cung bằng thìa sắc khẩn cấp ngay lập tức để loại bỏ ổ nhiễm khuẩn trước khi dùng kháng sinh.", "Chỉ định mổ mở cắt tử cung toàn phần ngay lập tức bất chấp tình trạng toàn thân sản phụ.", "Chỉ dùng thuốc co hồi tử cung Oxytocin đường tiêm bắp, tuyệt đối không dùng kháng sinh.", "Cho sản phụ về nhà uống thuốc kháng sinh Amoxicillin và hẹn tái khám sau hai tuần."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_xam_lan] Nạo hút buồng tử cung ngay khi đang sốt làm vi khuẩn xối xả vào máu gây sốc nhiễm khuẩn."}, {"key": "C", "trap": "[qua_xam_lan] Cắt tử cung ngay khi mới nhiễm khuẩn niêm mạc tử cung do sót nhau là thô bạo."}, {"key": "D", "trap": "[thieu_cau_phan] Chỉ dùng Oxytocin không thể tống xuất hết khối nhau sót nhiễm khuẩn."}, {"key": "E", "trap": "[qua_bao_ton] Cho về nhà uống kháng sinh đơn thuần gây biến chứng nhiễm khuẩn huyết."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sốt 38.8°C + Sản dịch hôi + Siêu âm có khối sót nhau 28 mm -> Viêm niêm mạc tử cung do sót nhau -> Bắt buộc Kháng sinh IV 24-48h hạ sốt -> Nạo hút buồng tử cung nhẹ nhàng.", "explanation": "Nguyên tắc vàng khi có nhiễm khuẩn buồng tử cung kèm sót nhau: Bắt buộc điều trị kháng sinh đường tĩnh mạch phổ rộng liều cao trước 24-48 giờ cho đến khi bệnh nhân hết sốt/giảm sốt rõ rệt mới tiến hành nạo hút buồng tử cung nhẹ nhàng. Nạo hút vội vàng khi chưa có nồng độ kháng sinh thỏa đáng sẽ làm vi khuẩn xâm nhập trực tiếp vào các xoang tĩnh mạch tử cung hở gây nhiễm khuẩn huyết."}, {"id": 6, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 22 tuổi, sinh thường ngả âm đạo ngày thứ 4 hậu sản. Bệnh nhân thấy đau rát nhiều vùng âm đạo, khí hư ra nhiều màu vàng đục hôi nhẹ, không sốt. Sinh hiệu: Thân nhiệt 37.1°C, HA 110/70 mmHg. Khám bụng: Tử cung co hồi tốt, ấn không đau. Khám mỏ vịt: Niêm mạc âm đạo và cổ tử cung sung huyết đỏ rực, có nhiều mảng mủ vàng bám dính, vết may tầng sinh môn lành tốt không sưng.", "question": "Chẩn đoán vị trí nhiễm khuẩn và hướng điều trị phù hợp nhất cho sản phụ là gì?", "options": ["Viêm phúc mạc chậu, cho tiêm kháng sinh tĩnh mạch liều cao kết hợp mổ dẫn lưu túi cùng.", "Viêm cơ tử cung hoại tử, chỉ định mổ cắt tử cung toàn phần cấp cứu.", "Viêm âm đạo cổ tử cung hậu sản, vệ sinh sát khuẩn tại chỗ, đặt thuốc âm đạo kết hợp kháng sinh đường uống.", "Nhiễm khuẩn tầng sinh môn, cắt chỉ xả mủ tầng sinh môn ngay tại phòng khám.", "Bình thường hậu sản, không cần xử trí gì thêm ngoài ngâm rửa nước chè xanh."], "correct": 2, "traps": [{"key": "A", "trap": "[qua_xam_lan] Nhầm với viêm phúc mạc chậu."}, {"key": "B", "trap": "[qua_xam_lan] Chẩn đoán quá mức viêm cơ tử cung để cắt tử cung."}, {"key": "D", "trap": "[sai_tang] Nhầm tổn thương âm đạo cổ tử cung với tầng sinh môn khi tầng sinh môn lành tốt."}, {"key": "E", "trap": "[qua_bao_ton] Bỏ qua niêm mạc âm đạo mủ vàng sung huyết."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N4 hậu sản + Không sốt + Niêm mạc âm đạo CTC sung huyết có mủ vàng + Tử cung co tốt -> Viêm âm đạo cổ tử cung hậu sản -> Vệ sinh tại chỗ + Đặt thuốc âm đạo + Kháng sinh uống.", "explanation": "Viêm âm đạo cổ tử cung hậu sản là dạng nhiễm khuẩn nhẹ ở đường sinh dục dưới. Tổn thương khu trú ở niêm mạc âm đạo và cổ tử cung mà không lan lên tử cung (tử cung co tốt, ấn không đau). Điều trị: Sát khuẩn tại chỗ, đặt thuốc kháng sinh/kháng nấm âm đạo, dùng kháng sinh đường uống."}, {"id": 7, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 30 tuổi, mổ lấy thai lần thứ nhất ngày thứ 6 hậu phẫu. Bệnh nhân sốt nhẹ 38.0°C, đau tức dai dẳng tại vết mổ thành bụng ngang trên mu. Khám: Vết mổ dài 10 cm, vùng giữa vết mổ sưng đỏ d = 3 cm, ấn vào phập phồng nhẹ và có ít dịch mủ vàng đục chảy ra qua chân chỉ. Tử cung co hồi tốt, sản dịch đỏ sẫm không hôi.", "question": "Chẩn đoán xác định và phác đồ xử trí tại chỗ chuẩn mực nhất cho sản phụ là gì?", "options": ["Tụ máu thành bụng vô khuẩn, chỉ cần chườm ấm và cho uống thuốc giảm đau Paracetamol.", "Viêm niêm mạc tử cung, nạo hút buồng tử cung cấp cứu bằng hút chân không.", "Bung thành bụng hoàn toàn, chuyển mổ lại khâu phục hồi thành bụng bằng chỉ thép.", "Viêm phúc mạc toàn thể, mổ mở thăm dò lau rửa toàn bộ ổ bụng.", "Nhiễm khuẩn vết mổ thành bụng nông, cắt bỏ một vài mũi chỉ vùng sưng mủ, rạch thoát mủ, rửa bavia bằng sát khuẩn, dùng kháng sinh."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm ổ mủ vàng đục chân chỉ với tụ máu vô khuẩn."}, {"key": "B", "trap": "[sai_tang] Nhầm nhiễm khuẩn vết mổ thành bụng với buồng tử cung."}, {"key": "C", "trap": "[qua_muc] Nhầm nhiễm khuẩn nông với hở bung thành bụng."}, {"key": "D", "trap": "[qua_xam_lan] Mổ thăm dò ổ bụng khi phúc mạc hoàn toàn bình thường."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N6 + Vết mổ thành bụng sưng đỏ chảy mủ chân chỉ + Tử cung co tốt sản dịch không hôi -> Nhiễm khuẩn vết mổ thành bụng nông -> Cắt chỉ xả mủ + Rửa bavia + Kháng sinh.", "explanation": "Nhiễm khuẩn vết mổ thành bụng nông khu trú ở lớp da và mô dưới da. Xử trí chuẩn mực: Cắt chỉ tại vùng nhiễm khuẩn, tách rộng mép vết mổ cho thoát hết mủ đục, rửa bavia hàng ngày bằng dung dịch sát khuẩn (Betadine/Oxy già), dùng kháng sinh đường uống hoặc tiêm."}, {"id": 8, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, béo phì, mổ lấy thai ngày thứ 7 hậu phẫu. Bệnh nhân sốt 38.9°C, đau bụng dữ dội, sau một cơn ho mạnh thấy rỉ ra nhiều dịch hồng hôi thối ở vết mổ. Thăm khám: Vết mổ thành bụng bung hở hoàn toàn lớp cân da, rải rác mủ đục và tổ chức hoại tử, lấp ló quai ruột ở đáy vết mổ nhưng chưa vỡ ruột. Tử cung co hồi tốt.", "question": "Chẩn đoán biến chứng và quy trình phẫu thuật xử trí khẩn cấp cho sản phụ là gì?", "options": ["Nhiễm khuẩn vết mổ nông, chỉ cần thay băng hàng ngày tại phòng bệnh mà không cần can thiệp phẫu thuật.", "Nhiễm khuẩn vết mổ sâu gây bung thành bụng, mổ lại cắt lọc toàn bộ tổ chức hoại tử, rửa sạch ổ bụng, khâu phục hồi thành bụng các lớp kèm dẫn lưu.", "Viêm phúc mạc toàn thể, tiến hành mổ cắt tử cung toàn phần và hai phần phụ khẩn cấp,.", "Viêm cơ tử cung hoại tử, cho dùng thuốc Oxytocin tiêm bắp kết hợp nạo hút buồng tử cung.", "Tụ dịch thành bụng đơn thuần, đè ép băng dính co giãn lên thành bụng và cho về nhà."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_bao_ton] Coi bung thành bụng lấp ló quai ruột là nhiễm khuẩn nông thay băng tại chỗ."}, {"key": "C", "trap": "[qua_xam_lan] Cắt tử cung khi tử cung co hồi tốt không tổn thương."}, {"key": "D", "trap": "[sai_tang] Nhầm tổn thương thành bụng với viêm cơ tử cung."}, {"key": "E", "trap": "[qua_bao_ton] Băng ép thành bụng khi đang nhiễm khuẩn hoại tử gây hoại tử ruột."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N7 + Vết mổ bung hở cân da lấp ló quai ruột + Mủ hoại tử -> Nhiễm khuẩn vết mổ sâu bung thành bụng -> Mổ lại cắt lọc hoại tử + Rửa sạch + Khâu phục hồi thành bụng kèm dẫn lưu.", "explanation": "Bung thành bụng sau mổ lấy thai do nhiễm khuẩn sâu hoại tử lớp cân cơ là biến chứng ngoại khoa nặng. Bắt buộc phải mổ lại: Cắt lọc sạch toàn bộ mủ và mô hoại tử, rửa sạch vết thương và khoang bụng, khâu phục hồi từng lớp thành bụng bằng chỉ bền chậm tan, đặt dẫn lưu ngoài cân."}, {"id": 9, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 27 tuổi, sinh thường ngả âm đạo ngày thứ 12 hậu sản. Bệnh nhân vào viện vì ra máu âm đạo kéo dài không giảm, dịch màu đỏ nâu hôi nồng, sốt 38.2°C. Thăm khám: Mạch 84 lần/phút, HA 110/70 mmHg. Tử cung to bằng thai 8 tuần, mật độ mềm, ấn đau nhẹ. Khám mỏ vịt: Cổ tử cung mở 1 finger, máu đen đục chảy ra. Siêu âm buồng tử cung: Nội mạc dày 16 mm, không có khối sót nhau rõ.", "question": "Chẩn đoán thể bệnh và phác đồ điều trị phù hợp nhất cho sản phụ là gì?", "options": ["Ung thư nguyên bào nuôi, chuyển hóa chất Methotrexate ngay lập tức.", "Chửa trứng tái phát muộn, tiến hành nạo hút buồng tử cung và xét nghiệm beta-hCG máu.", "Nhiễm khuẩn tầng sinh môn, cắt chỉ khâu tầng sinh môn và rửa bằng dung dịch oxy già.", "Viêm niêm mạc tử cung muộn, điều trị kháng sinh đường tĩnh mạch, phối hợp thuốc co hồi tử cung Oxytocin và theo dõi sản dịch.", "Sản dịch bình thường hậu sản, cho xuất viện không cần kê đơn thuốc."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_muc] Chẩn đoán ung thư nguyên bào nuôi quá sớm khi chưa làm xét nghiệm."}, {"key": "B", "trap": "[nham_dan_so] Nhầm viêm tử cung muộn với bệnh nguyên bào nuôi."}, {"key": "C", "trap": "[sai_tang] Nhầm tổn thương tử cung với tầng sinh môn."}, {"key": "E", "trap": "[qua_bao_ton] Coi sốt và sản dịch hôi kéo dài N12 là bình thường."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N12 hậu sản + Sốt 38.2°C + Ra máu kéo dài sản dịch hôi + Tử cung to mềm ấn đau -> Viêm niêm mạc tử cung muộn -> Kháng sinh IV + Oxytocin.", "explanation": "Viêm niêm mạc tử cung có thể xuất hiện muộn sau 10-14 ngày sau sinh (thường do Chlamydia trachomatis hoặc vi khuẩn yếm khí). Triệu chứng: Ra máu kéo dài, sản dịch hôi, tử cung chậm co hồi, sốt nhẹ. Điều trị: Kháng sinh đường tĩnh mạch phối hợp thuốc co hồi tử cung."}, {"id": 10, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, sinh thường ngả âm đạo sau ối vỡ 12 giờ. Ngay ngày thứ 1 hậu sản, bệnh nhân sốt cao đột ngột 39.5°C, rét run dữ dội, hạ huyết áp 90/55 mmHg, Mạch 120 lần/phút. Bụng dưới ấn đau chói, tử cung co hồi kém, sản dịch ra ít nhưng có mùi hôi. Xét nghiệm: Bạch cầu 22.000/mm³, CRP vọt 110 mg/L. Cấy dịch cổ tử cung mọc Streptococcus agalactiae (Group B Streptococcus - GBS).", "question": "Chẩn đoán tác nhân vi khuẩn và phác đồ kháng sinh tĩnh mạch liều cao tối ưu nhất là gì?", "options": ["Viêm niêm mạc tử cung cấp tối cấp do Liên cầu nhóm B GBS, dùng Ampicillin tĩnh mạch liều cao phối hợp Gentamicin và Metronidazole, hồi sức chống sốc.", "Viêm niêm mạc tử cung nhẹ, cho uống Doxycycline liều thấp trong năm ngày.", "Nhiễm nấm C. albicans âm đạo, cho đặt viên đặt âm đạo Clotrimazole,.", "Viêm phúc mạc toàn thể, chuyển mổ nạo buồng tử cung bằng thìa sắc khẩn cấp.", "Sốc phản vệ do thuốc, tiêm ngay Adrenaline dưới da và dừng toàn bộ thuốc."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_bao_ton] Dùng kháng sinh uống liều thấp khi bệnh nhân nhiễm khuẩn nặng sốc."}, {"key": "C", "trap": "[nham_dan_so] Nhầm vi khuẩn GBS với nhiễm nấm âm đạo."}, {"key": "D", "trap": "[qua_xam_lan] Nạo hút thìa sắc khi đang nhiễm khuẩn tối cấp làm lan rộng vi khuẩn huyết."}, {"key": "E", "trap": "[nham_dan_so] Nhầm sốc nhiễm khuẩn với sốc phản vệ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N1 hậu sản + Sốt cao 39.5°C tụt HA + Cấy mọc GBS + BC 22.000 -> Viêm niêm mạc tử cung tối cấp do GBS -> Ampicillin IV liều cao + Gentamicin + Metronidazole + Hồi sức chống sốc.", "explanation": "Liên cầu nhóm B (GBS) gây nhiễm khuẩn hậu sản khởi phát cực sớm (trong 24h đầu) với diễn tiến độc lực rất mạnh gây sốc nhiễm khuẩn. Phác đồ bắt buộc: Ampicillin IV liều cao (đặc hiệu GBS) phối hợp Gentamicin và Metronidazole, kết hợp hồi sức bù dịch chống sốc."}, {"id": 11, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, mổ lấy thai vì chuyển dạ kéo dài 24 giờ sau ối vỡ sớm 28 giờ. Ngày thứ 3 hậu phẫu, bệnh nhân sốt 38.9°C, đau quặn bụng dưới, rét run. Tử cung co hồi kém, d d = 15 cm, ấn đau chói. Sản dịch đục màu xám hôi nồng. Bệnh nhân có tiền sử dị ứng nặng với Penicillin (tiền sử sốc phản vệ).", "question": "Lựa chọn phác đồ kháng sinh tĩnh mạch chuẩn mực thay thế Penicillin cho sản phụ là gì?", "options": ["Tiếp tục dùng Amoxicillin tiêm tĩnh mạch liều cao kết hợp Clavulanate.", "Chỉ dùng Metronidazole đường uống đơn thuần không phối hợp,.", "Phác đồ Clindamycin phối hợp Gentamicin đường tĩnh mạch, bao phủ hoàn hảo vi khuẩn hiếu khí và yếm khí mà không gây dị ứng Penicillin.", "Mổ lại nạo bóc toàn bộ niêm mạc tử cung hoại tử.", "Cho dùng Cephalexin đường uống phối hợp Paracetamol hạ sốt."], "correct": 2, "traps": [{"key": "A", "trap": "[bo_chong_chi_dinh] Cố tình dùng Amoxicillin khi bệnh nhân có tiền sử sốc phản vệ Penicillin."}, {"key": "B", "trap": "[thieu_cau_phan] Dùng Metronidazole uống đơn thuần không đủ phổ diệt khuẩn gram âm."}, {"key": "D", "trap": "[qua_xam_lan] Mổ nạo bóc niêm mạc tử cung gây thủng tử cung và vô sinh."}, {"key": "E", "trap": "[qua_bao_ton] Dùng kháng sinh uống nhẹ khi có nhiễm khuẩn hậu sản nặng."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh + Ối vỡ sớm 28h + Sốt 38.9°C + Dị ứng phản vệ Penicillin -> Viêm niêm mạc tử cung nặng -> Phác đồ thay thế Clindamycin + Gentamicin tĩnh mạch.", "explanation": "Phác đồ Clindamycin + Gentamicin đường tĩnh mạch là phác đồ chuẩn vàng kinh điển điều trị viêm niêm mạc tử cung hậu sản, đặc biệt cực kỳ tối ưu cho bệnh nhân có chống chỉ định/dị ứng nặng với nhóm Beta-lactam (Penicillin/Ampicillin)."}, {"id": 12, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 35 tuổi, đái tháo đường thai kỳ, sinh thường ngả âm đạo ngày thứ 4 hậu sản. Bệnh nhân sốt cao 39.8°C, tụt huyết áp 80/50 mmHg, Mạch 130 lần/phút, lơ mơ. Khám tầng sinh môn: Vùng tầng sinh môn lan rộng ra hai bên mông và vùng bẹn sưng nề đen thẫm, có nhiều nốt phỏng đục, ấn có tiếng lạo xạo hơi dưới da, dịch mủ thối nồng nặc.", "question": "Chẩn đoán biến chứng tối cấp và quy trình cấp cứu sống còn cho sản phụ là gì?", "options": ["Nhiễm khuẩn vết may tầng sinh môn nông, chỉ cần ngâm rửa bằng dung dịch nước muối sinh lý tại giường.", "Tụ máu đùi bẹn sinh lý, chườm lạnh tại chỗ và cho về nhà theo dõi.", "Viêm niêm mạc tử cung nhẹ, tiêm Oxytocin co hồi tử cung và cho uống Paracetamol,.", "Sốc phản vệ do dị ứng thức ăn, tiêm ngay Adrenaline dưới da,.", "Viêm mạc hoại tử tầng sinh môn Necrotizing fasciitis, cắt lọc ngoại khoa rộng rãi khẩn cấp toàn bộ mô hoại tử, dùng kháng sinh tĩnh mạch phổ rộng liều cao, hồi sức chống sốc."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_bao_ton] Coi viêm mạc hoại tử tử vong cao là nhiễm khuẩn nông ngâm nước muối."}, {"key": "B", "trap": "[qua_bao_ton] Coi hoại tử hơi lạo xạo là tụ máu vô khuẩn."}, {"key": "C", "trap": "[sai_tang] Nhầm tổn thương mạc tầng sinh môn với niêm mạc tử cung."}, {"key": "D", "trap": "[nham_dan_so] Nhầm sốc nhiễm khuẩn hoại tử với sốc phản vệ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N4 hậu sản + ĐTĐ + Sốc nhiễm khuẩn + Tầng sinh môn đen thẫm lạo xạo hơi -> Viêm mạc hoại tử tầng sinh môn (Necrotizing fasciitis) -> Cắt lọc ngoại khoa rộng rãi khẩn cấp + Kháng sinh IV phổ rộng + Hồi sức sốc.", "explanation": "Viêm mạc hoại tử tầng sinh môn (Necrotizing fasciitis) là cấp cứu ngoại-sản tối khẩn cấp với tỷ lệ tử vong rất cao (đặc biệt trên bệnh nhân đái tháo đường). Dấu hiệu đặc trưng: Da tím đen, nốt phỏng, tiếng lạo xạo hơi dưới da (vi khuẩn sinh hơi Clostridium/Streptococcus). Xử trí sống còn: Cắt lọc ngoại khoa rộng rãi tối đa toàn bộ mô hoại tử + Kháng sinh tĩnh mạch phổ rộng liều cao + Hồi sức chống sốc."}, {"id": 13, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 26 tuổi, con so, sinh thường ngày thứ 4 hậu sản. Bệnh nhân sốt 38.5°C, đau tức căng cứng vùng hạ vị, 2 ngày nay không thấy sản dịch chảy ra ngoài. Thăm khám: Tử cung to bằng thai 14 tuần, mật độ căng cứng, ấn đau tức dữ dội. Khám mỏ vịt: Cổ tử cung đóng kín, có cục máu đông bít chặt lỗ cổ tử cung, không có dịch chảy ra. Siêu âm: Buồng tử cung ứ dịch và máu đông d = 35 mm.", "question": "Chẩn đoán thể bệnh và quy trình khai thông tử cung chuẩn mực là gì?", "options": ["Mổ cấp cứu cắt tử cung toàn phần để loại bỏ hoàn toàn khối ứ dịch,.", "Viêm niêm mạc tử cung kèm bế sản dịch, Nong nhẹ cổ tử cung gắp cục máu đông bít tắc khai thông sản dịch, tiêm Oxytocin co hồi tử cung, dùng kháng sinh tĩnh mạch.", "Chỉ dùng thuốc tiêm Oxytocin liều cao mà không cần nong khai thông cổ tử cung.", "Cho bệnh nhân uống thuốc giảm co Nifedipine để làm mềm tử cung,.", "Không cần can thiệp gì vì sản dịch sẽ tự tiêu biến trong buồng tử cung."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_xam_lan] Cắt tử cung lãng phí khi chỉ bị bế sản dịch cơ học."}, {"key": "C", "trap": "[thieu_cau_phan] Tiêm Oxytocin khi cổ tử cung bị bít tắc cục máu đông sẽ gây đau quặn tử cung dữ dội mà không thoát dịch."}, {"key": "D", "trap": "[bo_chong_chi_dinh] Cho thuốc giảm co làm tử cung đờ dãn thêm ứ dịch."}, {"key": "E", "trap": "[qua_bao_ton] Coi ứ dịch 35 mm nhiễm khuẩn là tự tiêu."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N4 hậu sản + Sốt 38.5°C + Tử cung căng to không ra sản dịch + CTC bị bít máu đông -> Viêm niêm mạc tử cung kèm bế sản dịch -> Nong CTC gắp máu đông khai thông + Oxytocin + Kháng sinh IV.", "explanation": "Bế sản dịch làm sản dịch ứ đọng trong buồng tử cung tạo môi trường thuận lợi cho vi khuẩn phát triển gây viêm niêm mạc tử cung. Xử trí bắt buộc: Đặt mỏ vịt, nong nhẹ lỗ cổ tử cung gắp bỏ cục máu đông bít tắc để khai thông thoát sản dịch ra ngoài, phối hợp thuốc co hồi tử cung Oxytocin và kháng sinh đường tĩnh mạch."}, {"id": 14, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, mổ lấy thai ngày thứ 5 hậu phẫu. Bệnh nhân sốt cao liên tục 39.6°C, rét run, lơ mơ. Sinh hiệu: Mạch 115 lần/phút, HA 95/60 mmHg. Bụng chướng nhẹ, tử cung to bằng thai 16 tuần, mật độ rất mềm nhão, ấn vào sản phụ đau thét lên. Khám âm đạo: Cổ tử cung mở rộng, sản dịch ra màu nâu đen lẫn nhiều mủ thối nồng nặc. Xét nghiệm: Bạch cầu 24.000/mm³, CRP = 135 mg/L.", "question": "Chẩn đoán thể lâm sàng và chiến lược điều trị từ nội khoa đến phẫu thuật chuẩn xác nhất là gì?", "options": ["Viêm niêm mạc tử cung nhẹ, chỉ cần nạo hút buồng tử cung bằng chân không tại phòng khám,.", "Viêm tắc tĩnh mạch đùi, cho dùng ngay thuốc chống đông Coumarin đường uống,.", "Nhiễm khuẩn vết mổ nông, cắt bỏ chỉ vết mổ thành bụng và rửa bằng nước muối,.", "Viêm cơ tử cung cấp tính, điều trị kháng sinh tĩnh mạch phổ rộng liều cao phối hợp Oxytocin, nếu điều trị nội khoa 24-48 giờ không đỡ hoặc tử cung hoại tử thì chỉ định mổ cắt tử cung.", "Tụ máu buồng tử cung vô khuẩn, cho chườm ấm bụng và cho uống thuốc cầm máu,."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_bao_ton] Coi viêm cơ tử cung nặng mềm nhão là viêm niêm mạc tử cung nhẹ nạo buồng tử cung."}, {"key": "B", "trap": "[nham_dan_so] Nhầm với viêm tắc tĩnh mạch đùi."}, {"key": "C", "trap": "[sai_tang] Nhầm tổn thương tử cung với vết mổ thành bụng."}, {"key": "E", "trap": "[qua_bao_ton] Coi nhiễm khuẩn hoại tử cơ tử cung là tụ máu vô khuẩn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N5 + Sốt 39.6°C + Tử cung mềm nhão ấn đau thét + Sản dịch hôi thối + BC 24.000 -> Viêm cơ tử cung cấp -> Kháng sinh IV liều cao + Oxytocin -> Mổ cắt tử cung nếu hoại tử/thất bại nội khoa.", "explanation": "Viêm cơ tử cung (Myometritis) là thể nhiễm khuẩn hậu sản nặng, vi khuẩn xâm nhập sâu vào lớp cơ tử cung làm tử cung mềm nhão, ấn đau chói. Điều trị: Kháng sinh đường tĩnh mạch phổ rộng liều cao phối hợp 3 loại + Oxytocin. Nếu sau 24-48h không cải thiện hoặc có dấu hiệu hoại tử cơ tử cung bắt buộc phải mổ cắt tử cung để cứu sống bệnh nhân."}, {"id": 15, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 36 tuổi, PARA 3003, mổ lấy thai ngày thứ 6. Bệnh nhân sốt cao 40.0°C, rét run, lơ mơ, HA 85/50 mmHg. Sau 36 giờ điều trị kháng sinh tĩnh mạch phối hợp 3 loại liều tối đa, tình trạng nhiễm trùng không giảm, bụng đau dữ dội. Mổ thăm dò: Cơ tử cung toàn bộ tím bầm, mủ thối phun ra từ lớp cơ tử cung hoại tử xơ mủ, xuất hiện nhiều ổ áp xe nhỏ khắp cơ tử cung.", "question": "Quyết định phẫu thuật xử trí triệt để tối khẩn cấp trên bàn mổ là gì?", "options": ["Viêm cơ tử cung hoại tử toàn bộ, tiến hành mổ cắt tử cung toàn phần, lau rửa sạch ổ bụng và đặt dẫn lưu.", "Khâu phục hồi lại cơ tử cung hoại tử và tiếp tục theo dõi điều trị nội khoa.", "Chỉ nạo hút buồng tử cung trên bàn mổ rồi khâu đóng thành bụng.", "Cắt bỏ hai buồng trứng và giữ lại tử cung hoại tử.", "Đóng bụng không can thiệp gì và chuyển sang dùng thuốc hạ sốt."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_bao_ton] Cố khâu phục hồi cơ tử cung hoại tử mủ làm nhiễm khuẩn huyết tử vong."}, {"key": "C", "trap": "[qua_bao_ton] Nạo buồng tử cung không giải quyết được ổ áp xe trong cơ tử cung."}, {"key": "D", "trap": "[sai_tang] Cắt buồng trứng giữ lại tử cung hoại tử."}, {"key": "E", "trap": "[qua_bao_ton] Đóng bụng không xử trí làm bệnh nhân tử vong."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N6 + Thất bại kháng sinh 36h + Cơ tử cung tím bầm hoại tử mủ toàn bộ -> Viêm cơ tử cung hoại tử toàn bộ -> Mổ cắt tử cung toàn phần + Lau rửa ổ bụng + Dẫn lưu.", "explanation": "Khi cơ tử cung bị hoại tử mủ toàn bộ (viêm cơ tử cung hoại tử), đây là ổ nhiễm khuẩn thô bạo giải phóng độc tố vào máu. Bắt buộc phải mổ cắt tử cung toàn phần để loại bỏ triệt để nguồn nhiễm khuẩn, kết hợp lau rửa sạch ổ bụng và đặt dẫn lưu."}, {"id": 16, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 27 tuổi, sinh thường ngả âm đạo ngày thứ 7 hậu sản. Bệnh nhân sốt 38.8°C, đau dữ dội hạ vị lệch sang bên trái. Thăm khám: Mạch 96 lần/phút, HA 110/70 mmHg. Khám âm đạo: Cổ tử cung lệch sang phải, túi cùng bên trái nề cứng, đau chói, có khối thâm nhiễm cứng như gỗ d d = 5 cm nằm ở đáy dây chằng rộng trái, ấn đau chói. Tử cung co hồi bình thường.", "question": "Chẩn đoán vị trí nhiễm khuẩn và phác đồ điều trị ban đầu chuẩn mực nhất là gì?", "options": ["Viêm ruột thừa cấp, chuyển mổ cắt ruột thừa nội soi khẩn cấp,.", "Thai ngoài tử cung vỡ, mổ mở cấp cứu cắt vòi tử cung trái.", "Viêm dây chằng rộng và phần phụ bên trái Parametritis, điều trị kháng sinh đường tĩnh mạch phổ rộng liều cao, chườm ấm tại chỗ, theo dõi hóa mủ.", "Nhiễm khuẩn vết may tầng sinh môn, cắt bỏ chỉ may tầng sinh môn.", "Tụ máu dây chằng rộng vô khuẩn, chỉ cho uống thuốc giảm đau Paracetamol."], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm viêm dây chằng rộng trái với viêm ruột thừa (ruột thừa nằm hố chậu phải)."}, {"key": "B", "trap": "[nham_dan_so] Nhầm với thai ngoài tử cung vỡ."}, {"key": "D", "trap": "[sai_tang] Nhầm tổn thương dây chằng rộng với tầng sinh môn."}, {"key": "E", "trap": "[qua_bao_ton] Coi khối thâm nhiễm sốt 38.8°C là tụ máu vô khuẩn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N7 hậu sản + Sốt 38.8°C + Túi cùng bên trái nề cứng như gỗ ấn đau chói -> Viêm dây chằng rộng trái (Parametritis) -> Kháng sinh tĩnh mạch phổ rộng liều cao + Theo dõi hóa mủ.", "explanation": "Viêm dây chằng rộng (Parametritis) do vi khuẩn từ cổ tử cung/tử cung lan qua đường bạch huyết vào mô liên kết dây chằng rộng. Dấu hiệu đặc trưng: Khám âm đạo thấy túi cùng bên thâm nhiễm cứng như gỗ, ấn đau chói, đẩy tử cung lệch sang bên đối diện. Điều trị: Kháng sinh đường tĩnh mạch phổ rộng liều cao."}, {"id": 17, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, viêm dây chằng rộng phải hậu sản ngày thứ 10. Sau 4 ngày điều trị kháng sinh tĩnh mạch, bệnh nhân vẫn sốt dao động 39.0°C, đau nhói hố chậu phải. Khám âm đạo: Túi cùng bên phải căng phồng, ấn có cảm giác phập phồng rõ rệt, đau dữ dội. Siêu âm ngả âm đạo: Khối d d = 45 mm ở dây chằng rộng phải, chứa dịch mủ đục không đồng nhất.", "question": "Quy trình phẫu thuật rạch chích dẫn lưu mủ an toàn nhất cho sản phụ là gì?", "options": ["Mổ cắt tử cung toàn phần và hai phần phụ khẩn cấp.", "Cho bệnh nhân về nhà uống thuốc hạ sốt Paracetamol,.", "Chỉ tiếp tục tăng liều kháng sinh tĩnh mạch mà tuyệt đối không được rạch mủ.", "Nạo hút buồng tử cung bằng chân không để thoát mủ.", "Áp xe dây chằng rộng phải hóa mủ, rạch chích dẫn lưu mủ qua túi cùng sau âm đạo hoặc đường ngoài phúc mạc vòm hông, đặt ống dẫn lưu."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_xam_lan] Cắt tử cung toàn phần khi mủ khu trú ở dây chằng rộng."}, {"key": "B", "trap": "[qua_bao_ton] Cho về nhà khi có ổ áp xe lớn gây sốc nhiễm khuẩn."}, {"key": "C", "trap": "[qua_bao_ton] Không rạch thoát mủ khi ổ áp xe đã hóa mủ phập phồng gây vỡ áp xe."}, {"key": "D", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được ổ mủ ngoài tử cung."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N10 hậu sản + Áp xe dây chằng rộng 45 mm hóa mủ phập phồng -> Áp xe dây chằng rộng hóa mủ -> Rạch chích mủ qua túi cùng sau âm đạo/đường ngoài phúc mạc vòm hông + Dẫn lưu.", "explanation": "Khi viêm dây chằng rộng hóa mủ tạo thành ổ áp xe (phập phồng trên lâm sàng và siêu âm), bắt buộc phải rạch chích dẫn lưu mủ. Đường rạch an toàn: Qua túi cùng sau âm đạo (nếu áp xe đè sát túi cùng) hoặc đường ngoài phúc mạc ở vòm hông (tránh làm mủ vỡ vào khoang phúc mạc)."}, {"id": 18, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 25 tuổi, sinh thường ngày thứ 6 hậu sản. Bệnh nhân sốt 38.6°C, đau tức dai dẳng vùng hố chậu phải. Khám bụng: Bụng mềm, ấn đau tức hố chậu phải, không có phản ứng thành bụng. Khám âm đạo: Cổ tử cung khép, tử cung co hồi tốt. Phần phụ bên phải nề to, ấn đau chói. Siêu âm: Vòi trứng phải sưng to d = 22 mm chứa dịch đục, buồng trứng phải bình thường.", "question": "Chẩn đoán xác định và phác đồ điều trị ban đầu chuẩn mực nhất là gì?", "options": ["Mổ nội soi cắt bỏ toàn bộ hai buồng trứng khẩn cấp.", "Viêm phần phụ phải hậu sản ứ mủ vòi trứng, điều trị kháng sinh đường tĩnh mạch phổ rộng phối hợp, nằm nghỉ tại giường, theo dõi biến chứng áp xe.", "Viêm ruột thừa cấp, mổ mở cắt ruột thừa ngay lập tức.", "Chữa trị bằng đặt thuốc âm đạo đơn thuần tại nhà.", "Nạo hút buồng tử cung bằng thìa sắc khẩn cấp,."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_xam_lan] Cắt bỏ 2 buồng trứng ở bệnh nhân 25 tuổi là thô bạo tàn phá nội tiết."}, {"key": "C", "trap": "[nham_dan_so] Nhầm viêm phần phụ với viêm ruột thừa."}, {"key": "D", "trap": "[qua_bao_ton] Đặt thuốc âm đạo không điều trị được viêm phần phụ sâu."}, {"key": "E", "trap": "[sai_tang] Nạo buồng tử cung khi tổn thương nằm ở vòi trứng."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N6 hậu sản + Sốt 38.6°C + Phần phụ phải nề đau + Siêu âm vòi trứng phải to 22 mm chứa mủ -> Viêm phần phụ phải hậu sản -> Kháng sinh tĩnh mạch phối hợp + Nghỉ ngơi theo dõi.", "explanation": "Viêm phần phụ hậu sản (Adnexitis) thường do vi khuẩn ngược dòng từ buồng tử cung lan lên vòi trứng và buồng trứng. Dấu hiệu: Sốt, đau hố chậu, khám thấy phần phụ nề to ấn đau. Điều trị: Kháng sinh đường tĩnh mạch phổ rộng phối hợp (bao phủ Chlamydia/Gonorrhea, E. coli, yếm khí) + Nghỉ ngơi."}, {"id": 19, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, sinh thường ngày thứ 6 hậu sản. Bệnh nhân sốt cao 39.2°C, đau dữ dội vùng hạ vị. Thăm khám: Mạch 102 lần/phút, HA 110/70 mmHg. Khám bụng: Bụng nửa trên mềm không đau, vùng hạ vị có phản ứng cơ nhẹ và cảm ứng phúc mạc rõ. Khám âm đạo: Cổ tử cung đau chói khi lay động, túi cùng sau (Douglas) phồng căng, ấn sản phụ đau thét lên. Siêu âm: Tụ dịch mủ d = 30 mm ở túi cùng Douglas.", "question": "Chẩn đoán thể lâm sàng và phác đồ điều trị tĩnh mạch liều cao chuẩn mực nhất là gì?", "options": ["Viêm phúc mạc toàn thể, mổ mở cấp cứu cắt tử cung toàn phần và rửa toàn bộ ổ bụng,.", "Nhiễm khuẩn vết may tầng sinh môn, cắt bỏ chỉ may tầng sinh môn,.", "Viêm niêm mạc tử cung nhẹ, cho uống thuốc kháng sinh Amoxicillin tại nhà,.", "Viêm phúc mạc chậu hậu sản, điều trị kháng sinh tĩnh mạch phổ rộng liều cao phối hợp 3 loại, chườm đá hạ vị, theo dõi sát nếu hóa mủ thì rạch dẫn lưu qua túi cùng sau.", "Tụ máu túi cùng Douglas vô khuẩn, chườm ấm bụng và cho uống thuốc Paracetamol,."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_xam_lan] Nhầm viêm phúc mạc chậu khu trú với viêm phúc mạc toàn thể để mổ cắt tử cung."}, {"key": "B", "trap": "[sai_tang] Nhầm tổn thương chậu hông với tầng sinh môn."}, {"key": "C", "trap": "[qua_bao_ton] Coi viêm phúc mạc chậu là viêm niêm mạc tử cung nhẹ."}, {"key": "E", "trap": "[qua_bao_ton] Coi mủ túi cùng Douglas 30 mm là tụ máu vô khuẩn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N6 hậu sản + Sốt 39.2°C + Phản ứng cơ khu trú hạ vị + Túi cùng Douglas phồng đau chói + Tụ dịch mủ 30 mm -> Viêm phúc mạc chậu -> Kháng sinh tĩnh mạch 3 loại + Theo dõi rạch dẫn lưu qua túi cùng sau.", "explanation": "Viêm phúc mạc chậu (Pelvic peritonitis) là tình trạng nhiễm khuẩn lan đến lớp phúc mạc phủ các cơ quan trong tiểu khung. Dấu hiệu: Phản ứng phúc mạc khu trú vùng hạ vị (nửa trên bụng hoàn toàn bình thường), túi cùng Douglas phồng căng ấn đau chói. Điều trị: Kháng sinh đường tĩnh mạch phổ rộng phối hợp 3 loại. Nếu hóa mủ túi cùng Douglas thì rạch chích dẫn lưu mủ qua túi cùng sau âm đạo."}, {"id": 20, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, viêm phúc mạc chậu hậu sản ngày thứ 9. Bệnh nhân sốt dao động 38.8°C - 39.5°C, đau tức dữ dội vùng hậu môn, mót rượt rặn liên tục nhưng không đi ngoài được. Khám âm đạo: Túi cùng sau âm đạo phồng căng to đè bít lòng âm đạo, ấn có cảm giác phập phồng mủ rõ rệt. Siêu âm: Ổ áp xe túi cùng Douglas d = 55 mm chứa nhiều dịch mủ đục.", "question": "Quy trình phẫu thuật chích thoát mủ chuẩn mực và an toàn nhất cho sản phụ là gì?", "options": ["Áp xe túi cùng Douglas hóa mủ, rạch chích dẫn lưu ổ mủ qua túi cùng sau âm đạo dưới hướng dẫn mỏ vịt, bóc tách thoát hết mủ, đặt ống dẫn lưu rubber.", "Mổ mở dọc giữa đường dưới rốn cắt tử cung ù dịch và vận mạch.", "Cắt bỏ hai buồng trứng và giữ lại tử cung hoại tử,.", "Cho dùng thuốc Oxytocin tiêm bắp và chườm đá lạnh,."], "correct": 2, "traps": [{"key": "A", "trap": "[qua_bao_ton] Rửa bụng không cắt tử cung hoại tử không giải quyết được nguồn nhiễm khuẩn."}, {"key": "B", "trap": "[qua_bao_ton] Cố khâu vết mổ tím đen hoại tử làm bệnh nhân tử vong vì sốc."}, {"key": "D", "trap": "[sai_tang] Cắt buồng trứng giữ lại tử cung tím đen."}, {"key": "E", "trap": "[qua_bao_ton] Dùng Oxytocin không có giá trị khi cơ tử cung hoại tử."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N6 + Sốc nhiễm khuẩn HA 80/40 + Tử cung tím đen hoại tử mủ toàn bộ -> Viêm cơ tử cung hoại tử toàn bộ biến chứng sốc -> Mổ cắt tử cung toàn phần + Lau rửa ổ bụng + Dẫn lưu + Hồi sức bù dịch vận mạch.", "explanation": "Viêm cơ tử cung hoại tử toàn bộ gây sốc nhiễm khuẩn là tình huống đe dọa tính mạng trực tiếp. Cắt tử cung toàn phần là chỉ định sống còn bắt buộc nhằm loại bỏ hoàn toàn nguồn vi khuẩn và độc tố giải phóng vào máu, kết hợp hồi sức tích cực (vận mạch Noradrenaline, bù dịch, kháng sinh IV)."}, {"id": 22, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 26 tuổi, sinh thường ngày thứ 8 hậu sản. Bệnh nhân sốt 38.7°C, đau nhiều hố chậu phải lan xuống đùi phải làm bệnh nhân đi lại khó khăn. Khám bụng: Ấn đau sâu hố chậu phải. Khám âm đạo: Cổ tử cung lệch trái, túi cùng phải nề cứng đau chói, khối thâm nhiễm lan từ cạnh tử cung ra tới tận xương chậu bên phải. Siêu âm: Khối thâm nhiễm dây chằng rộng phải d = 50 mm chưa hóa mủ rõ.", "question": "Chẩn đoán vị trí tổn thương và phác đồ kháng sinh phối hợp đường tĩnh mạch là gì?", "options": ["Viêm ruột thừa vỡ, mổ mở cấp cứu cắt ruột thừa và lau rửa ổ bụng.", "Viêm khớp háng phải cấp tính, chuyển khoa Chấn thương chỉnh hình mổ thay khớp háng.", "Tụ máu vòm hông vô khuẩn, cho uống thuốc giảm đau Paracetamol.", "Nhiễm khuẩn vết may tầng sinh môn, cắt chỉ tầng sinh môn,.", "Viêm dây chằng rộng phải lan ra thành chậu hông,
