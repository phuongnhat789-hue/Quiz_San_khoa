 "correct": 1, "traps": [{"key": "A", "trap": "[qua_bao_ton] Cho về nhà khi có viêm phúc mạc chậu."}, {"key": "C", "trap": "[qua_xam_lan] Nạo hút lại khi đang viêm phúc mạc làm thủng tử cung rộng thêm và nhiễm khuẩn huyết."}, {"key": "D", "trap": "[qua_xam_lan] Cắt tử cung ngay khi mủ hoàn toàn khu trú ở túi cùng Douglas."}, {"key": "E", "trap": "[qua_bao_ton] Điều trị triệu chứng nôn mửa mót rặn mà bỏ qua nguyên nhân viêm phúc mạc."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sau nạo hút N2 + Sốt 39.3°C + Cảm ứng phúc mạc hạ vị + Tụ mủ túi cùng Douglas 32 mm -> Viêm phúc mạc chậu do thủ thuật nạo hút -> Kháng sinh IV 3 loại + Rạch dẫn lưu mủ qua túi cùng sau âm đạo.", "explanation": "Nạo hút buồng tử cung không đảm bảo vô khuẩn có thể gây vi phạm niêm mạc/thủng tử cung lan nhiễm khuẩn vào khoang phúc mạc chậu. Xử trí: Kháng sinh đường tĩnh mạch phổ rộng phối hợp 3 loại + Rạch chích dẫn lưu mủ qua túi cùng sau âm đạo."}, {"id": 24, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, viêm phần phụ trái hậu sản ngày thứ 9. Sau 72 giờ điều trị kháng sinh tĩnh mạch phối hợp, bệnh nhân vẫn sốt 39.1°C, đau nhói dữ dội hố chậu trái. Khám: Khối phần phụ trái kích thước d = 50 mm ấn đau chói. Siêu âm: Vòi trứng trái ứ mủ to d = 48 mm căng phồng hình dải bít, chưa vỡ vào ổ bụng.", "question": "Chỉ định phẫu thuật can thiệp tối ưu nhất cho sản phụ còn nguyện vọng sinh con là gì?", "options": ["Chỉ tiếp tục dùng kháng sinh đường uống tại nhà,,.", "Mổ mở cắt bỏ toàn bộ tử cung và hai phần phụ,.", "Thực hiện nạo hút buồng tử cung bằng chân không,.", "Ứ mủ vòi trứng trái hậu sản thất bại điều trị nội khoa, mổ nội soi ổ bụng hút mủ vòi trứng trái, rửa sạch khoang chậu, bảo tồn buồng trứng và đặt dẫn lưu.", "Tiêm thuốc hạ sốt Paracetamol và chườm lạnh hố chậu trái,."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_bao_ton] Chuyển kháng sinh uống khi mủ ứ to 48 mm thất bại IV."}, {"key": "B", "trap": "[qua_xam_lan] Cắt tử cung và 2 phần phụ ở bệnh nhân 28 tuổi thất bại nội khoa ứ mủ vòi trứng đơn thuần."}, {"key": "C", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được mủ trong vòi trứng."}, {"key": "E", "trap": "[qua_bao_ton] Chườm lạnh hạ sốt không giải quyết ổ ứ mủ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N9 hậu sản + Sốt 39.1°C + Thất bại kháng sinh IV 72h + Vòi trứng trái ứ mủ 48 mm -> Ứ mủ vòi trứng trái hậu sản -> Mổ nội soi hút mủ vòi trứng + Rửa khoang chậu + Bảo tồn buồng trứng + Dẫn lưu.", "explanation": "Khi viêm phần phụ hậu sản tiến triển thành ứ mủ vòi trứng kích thước lớn (48 mm) thất bại sau 72h điều trị kháng sinh tĩnh mạch, bắt buộc phải thi hành phẫu thuật: Mổ nội soi ổ bụng phẫu thuật bảo tồn (hút sạch mủ vòi trứng, rửa khoang chậu, bảo tồn buồng trứng) là phương pháp tối ưu giúp giữ lại chức năng nội tiết và sinh sản cho bệnh nhân."}, {"id": 25, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, sinh thường ngày thứ 5 hậu sản. Bệnh nhân nhập viện trong tình trạng sốt 39.4°C, rét run, da tái lạnh, Mạch 122 lần/phút, HA 85/55 mmHg, Oliguria (nước tiểu 20 mL/giờ). Khám bụng: Tử cung co hồi kém, ấn đau chói. Sản dịch đục hôi nồng. Xét nghiệm: Bạch cầu 21.000/mm³, Lactate máu = 3.8 mmol/L.", "question": "Quy trình hồi sức cấp cứu và kháng sinh tĩnh mạch ban đầu chuẩn mực là gì?", "options": ["Viêm cơ tử cung biến chứng sốc nhiễm khuẩn, hồi sức bù dịch tinh thể Ringer Lactate 30 mL/kg khẩn cấp, dùng kháng sinh tĩnh mạch phổ rộng phối hợp trong vòng 1 giờ, dùng thuốc vận mạch Noradrenaline nếu HA không đạt.", "Cho uống thuốc hạ sốt Paracetamol và tiếp tục theo dõi huyết áp mỗi 4 giờ,.", "Mổ mở cắt tử cung ngay lập tức trước khi hồi sức bù dịch,.", "Tiêm Oxytocin liều cao và cho bệnh nhân uống nước đường ấm,,.", "Chỉ tiêm một liều Dexamethasone chống dị ứng và cho xuất viện,."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_bao_ton] Coi sốc nhiễm khuẩn Lactate 3.8 là sốt thông thường."}, {"key": "C", "trap": "[qua_xam_lan] Đưa bệnh nhân đang sốc nặng HA 85/55 vào mổ ngay khi chưa hồi sức bù dịch tĩnh mạch."}, {"key": "D", "trap": "[qua_bao_ton] Tiêm Oxytocin uống nước đường không hồi sức sốc."}, {"key": "E", "trap": "[nham_dan_so] Nhầm sốc nhiễm khuẩn với dị ứng thuốc."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N5 hậu sản + Sốt 39.4°C + Tụt HA 85/55 + Lactate 3.8 mmol/L -> Viêm cơ tử cung biến chứng sốc nhiễm khuẩn -> Bù dịch Ringer Lactate 30 mL/kg + Kháng sinh IV trong 1 giờ + Vận mạch Noradrenaline.", "explanation": "Sốc nhiễm khuẩn hậu sản là cấp cứu tối khẩn. Bắt buộc thực hiện gói hồi sức Hour-1 Bundle: Bù dịch tinh thể Ringer Lactate khẩn cấp (30 mL/kg trong 3h đầu), tiêm kháng sinh tĩnh mạch phổ rộng trong vòng 1h đầu, cấy máu, dùng vận mạch Noradrenaline giữ MAP >= 65 mmHg nếu bù dịch không đủ."}, {"id": 26, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 27 tuổi, viêm phúc mạc chậu hậu sản ngày thứ 5. Sau 48 giờ điều trị kháng sinh tĩnh mạch phối hợp 3 loại, bệnh nhân giảm sốt từ 39.2°C xuống 37.8°C, mạch giảm từ 105 xuống 82 lần/phút, phản ứng cơ vùng hạ vị giảm rõ rệt. Siêu âm lại: Lượng dịch mủ túi cùng Douglas giảm từ 25 mm xuống 10 mm.", "question": "Đánh giá đáp ứng điều trị và thái độ xử trí tiếp theo chuẩn xác nhất là gì?", "options": ["Dừng toàn bộ kháng sinh tĩnh mạch và cho xuất viện ngay,.", "Chuyển phẫu thuật mổ mở cắt tử cung toàn phần ngay lập tức.", "Đáp ứng tốt với điều trị nội khoa, tiếp tục duy trì phác đồ kháng sinh tĩnh mạch phối hợp đủ 7-10 ngày, theo dõi sát lâm sàng và chỉ số CRP.", "Chỉ định nạo hút buồng tử cung bằng thìa sắc,.", "Đổi sang phác đồ kháng sinh đường uống liều thấp,."], "correct": 2, "traps": [{"key": "A", "trap": "[thieu_cau_phan] Dừng kháng sinh quá sớm gây nhiễm khuẩn bùng phát lại."}, {"key": "B", "trap": "[qua_xam_lan] Mổ cắt tử cung khi bệnh nhân đang đáp ứng điều trị nội khoa rất tốt."}, {"key": "D", "trap": "[qua_xam_lan] Nạo hút buồng tử cung không có chỉ định khi đang tiến triển tốt."}, {"key": "E", "trap": "[qua_bao_ton] Đổi sang kháng sinh uống quá sớm khi chưa đủ thời gian IV."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N5 hậu sản + Giảm sốt 37.8°C + Mạch giảm + Dịch Douglas giảm 10 mm -> Đáp ứng tốt nội khoa -> Duy trì kháng sinh tĩnh mạch đủ 7-10 ngày + Theo dõi lâm sàng và CRP.", "explanation": "Khi viêm phúc mạc chậu đáp ứng tốt với kháng sinh tĩnh mạch (hạ sốt, giảm đau bụng, dịch túi cùng giảm trên siêu âm), phác đồ chuẩn là tiếp tục duy trì kháng sinh đường tĩnh mạch đủ thời gian (thường 7-10 ngày hoặc đến khi hết sốt 48h) trước khi chuyển sang đường uống."}, {"id": 27, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, mổ lấy thai ngày thứ 5 hậu phẫu. Bệnh nhân sốt cao 39.7°C, đau bụng dữ dội toàn bộ ổ bụng, nôn mửa nhiều dịch xanh đen, không trung tiện được. Thăm khám: Mạch 120 lần/phút, HA 90/60 mmHg. Khám bụng: Bụng chướng to, cảm ứng phúc mạc và đề kháng thành bụng lan rộng khắp toàn bộ ổ bụng. Khám âm đạo: Cổ tử cung đau chói, sản dịch hôi thối. Siêu âm: Dịch mủ đục tự do khắp khoang bụng.", "question": "Chẩn đoán biến chứng nguy hiểm và quy trình xử trí phẫu thuật khẩn cấp là gì?", "options": ["Tắc ruột cơ học đơn thuần, cho đặt xông dạ dày hút dịch và theo dõi nội khoa.", "Viêm niêm mạc tử cung nhẹ, chỉ cần dùng Oxytocin tiêm bắp và kháng sinh đường uống.", "Liệt ruột sinh lý sau mổ, cho uống thuốc MHM và cho đi lại vận động.", "Nhiễm khuẩn vết mổ nông, cắt bỏ chỉ vết mổ thành bụng rửa oxy già,.", "Viêm phúc mạc toàn thể hậu sản, mổ mở cấp cứu thăm dò ổ bụng, lau rửa sạch toàn bộ khoang bụng, cắt tử cung nếu cơ tử cung hoại tử, đặt dẫn lưu rộng rãi."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm viêm phúc mạc với tắc ruột cơ học."}, {"key": "B", "trap": "[qua_bao_ton] Coi viêm phúc mạc toàn thể là viêm niêm mạc tử cung nhẹ."}, {"key": "C", "trap": "[qua_bao_ton] Coi cảm ứng phúc mạc toàn bụng là liệt ruột sinh lý."}, {"key": "D", "trap": "[sai_tang] Nhầm tổn thương trong phúc mạc với vết mổ thành bụng nông."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N5 + Sốt 39.7°C + Đề kháng toàn bụng + Dịch mủ tự do khắp ổ bụng -> Viêm phúc mạc toàn thể hậu sản -> Mổ mở cấp cứu lau rửa ổ bụng + Cắt tử cung nếu hoại tử + Dẫn lưu rộng rãi.", "explanation": "Viêm phúc mạc toàn thể (Generalized peritonitis) là biến chứng nhiễm khuẩn hậu sản cực kỳ nặng nề. Triệu chứng: Sốt cao, nôn mửa, chướng bụng, đề kháng thành bụng lan rộng toàn bụng, dịch mủ tự do khắp ổ bụng. Bắt buộc mổ mở cấp cứu: Lau rửa sạch khoang bụng bằng nhiều lít nước muối sinh lý, cắt tử cung nếu tử cung là ổ hoại tử mủ, đặt ống dẫn lưu rộng rãi."}, {"id": 28, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 29 tuổi, đẻ thường ngày thứ 8 hậu sản. Bệnh nhân có tiền sử viêm phần phụ phải đang điều trị. Đột ngột xuất hiện một cơn đau nhói dữ dội hố chậu phải lan ra toàn bụng, sau đó sốt vọt 40.0°C, rét run, HA tụt 85/50 mmHg. Khám: Bụng co cứng như gỗ toàn bộ, phản ứng phúc mạc rõ. Siêu âm: Ổ áp xe phần phụ phải đã vỡ, ổ bụng ngập dịch mủ đục.", "question": "Chẩn đoán biến chứng vỡ áp xe và quy trình phẫu thuật tối khẩn cấp là gì?", "options": ["Chỉ tiêm kháng sinh tĩnh mạch liều cao không can thiệp phẫu thuật,.", "Viêm phúc mạc toàn thể do vỡ áp xe phần phụ phải, mổ mở cấp cứu cắt bỏ phần phụ phải hoại tử vỡ, lau rửa toàn bộ khoang bụng, đặt dẫn lưu rộng rãi.", "Nạo hút buồng tử cung bằng thìa sắc cấp cứu,,.", "Chườm đá lạnh toàn bụng và cho uống thuốc hạ sốt,.", "Thực hiện thủ thuật thụt tháo phân giải áp ruột,."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_bao_ton] Không mổ cấp cứu khi áp xe vỡ gây tử vong vì sốc nhiễm khuẩn."}, {"key": "C", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được áp xe phần phụ vỡ."}, {"key": "D", "trap": "[qua_bao_ton] Chườm đá không có tác dụng với ổ mủ ngập khoang bụng."}, {"key": "E", "trap": "[qua_bao_ton] Thụt tháo phân làm tăng nguy cơ thủng ruột."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N8 hậu sản + Đau nhói dữ dội vỡ áp xe + Bụng co cứng như gỗ + Tụt HA 85/50 -> Viêm phúc mạc toàn thể do vỡ áp xe phần phụ phải -> Mổ cấp cứu cắt phần phụ vỡ + Lau rửa ổ bụng + Dẫn lưu.", "explanation": "Vỡ áp xe phần phụ vào khoang phúc mạc gây viêm phúc mạc toàn thể và sốc nhiễm khuẩn tối cấp. Bắt buộc phải mổ mở cấp cứu khẩn cấp: Cắt bỏ vòi buồng trứng bị vỡ hoại tử, lau rửa sạch toàn bộ khoang bụng bằng dung dịch nước muối sinh lý ấm, đặt dẫn lưu rộng rãi ổ bụng."}, {"id": 29, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, sinh thường ngày thứ 5 hậu sản. Bệnh nhân sốt cao rét run từng cơn 39.8°C, nhiệt độ dao động mạnh, vã mồ hôi hột, da niêm mạc nhợt, xuất hiện vài nốt xuất huyết dưới da. Mạch 125 lần/phút, HA 95/60 mmHg. Khám: Tử cung co hồi kém ấn đau. Cấy máu: Mọc vi khuẩn Escherichia coli. Xét nghiệm: Bạch cầu 25.000/mm³, Tiểu cầu giảm còn 75.000/mm³, Procalcitonin = 15.2 ng/mL.", "question": "Chẩn đoán xác định và phác đồ kháng sinh phối hợp đường tĩnh mạch theo kháng sinh đồ là gì?", "options": ["Sốt xuất huyết Dengue, chỉ bù dịch không dùng kháng sinh,,.", "Nhiễm nấm toàn thân, chỉ dùng thuốc Fluconazole truyền tĩnh mạch,.", "Viêm tầng sinh môn nông, cắt chỉ tầng sinh môn,,.", "Nhiễm khuẩn huyết hậu sản do E. coli, điều trị kháng sinh tĩnh mạch phổ rộng liều cao phối hợp 3 loại theo kháng sinh đồ, hồi sức chống suy đa cơ quan, tìm và loại bỏ ổ nhiễm khuẩn nguyên phát.", "Sốc phản vệ, tiêm ngay Adrenaline dưới da,,."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm nhiễm khuẩn huyết với sốt xuất huyết."}, {"key": "B", "trap": "[nham_dan_so] Nhầm vi khuẩn E. coli với nhiễm nấm."}, {"key": "C", "trap": "[qua_bao_ton] Coi nhiễm khuẩn huyết là nhiễm khuẩn tầng sinh môn nông."}, {"key": "E", "trap": "[nham_dan_so] Nhầm nhiễm khuẩn huyết với sốc phản vệ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N5 hậu sản + Sốt rét run dao động 39.8°C + Cấy máu mọc E. coli + Procalcitonin 15.2 -> Nhiễm khuẩn huyết hậu sản do E. coli -> Kháng sinh tĩnh mạch 3 loại theo kháng sinh đồ + Hồi sức + Loại bỏ ổ nhiễm khuẩn nguyên phát.", "explanation": "Nhiễm khuẩn huyết hậu sản (Postpartum Sepsis) do vi khuẩn từ đường sinh dục vào máu. Dấu hiệu: Sốt cao rét run dao động, cấy máu dương tính, Procalcitonin tăng cao (> 2 ng/mL). Điều trị: Kháng sinh đường tĩnh mạch phổ rộng liều cao phối hợp ngay lập tục, điều chỉnh theo kháng sinh đồ + Hồi sức tích cực + Loại bỏ ổ nhiễm khuẩn gốc (tử cung/tầng sinh môn)."}, {"id": 30, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 34 tuổi, mổ lấy thai ngày thứ 4 hậu phẫu bị viêm cơ tử cung nặng. Bệnh nhân rơi vào lơ mơ, tím đầu chi, Mạch 135 lần/phút nhỏ khó bắt, HA tụt còn 70/40 mmHg, Thân nhiệt 40.1°C rồi hạ xuống 35.5°C, vô niệu. Xét nghiệm: Lactate máu = 5.2 mmol/L, pH = 7.15, Bạch cầu 28.000/mm³.", "question": "Quy trình cấp cứu sốc nhiễm khuẩn nặng chuẩn mực trong giờ đầu tiên là gì?", "options": ["Sốc nhiễm khuẩn hậu sản nặng, hồi sức bù dịch tinh thể Ringer Lactate 30 mL/kg trong 3h, dùng ngay thuốc vận mạch Noradrenaline giữ MAP >= 65 mmHg, tiêm kháng sinh tĩnh mạch phổ rộng trong vòng 1h, cấy máu, cấy sản dịch.", "Đưa ngay bệnh nhân vào phòng mổ cắt tử cung mà không cần bù dịch hay vận mạch,.", "Chỉ cho thở oxy qua xông mũi và chườm ấm toàn thân,,.", "Cho uống thuốc trợ tim Digoxin đường uống,,.", "Tiêm tĩnh mạch Dexamethasone liều cao chống dị ứng rồi cho xuất viện,,."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_xam_lan] Mổ cắt tử cung ngay khi chưa hồi sức chống sốc HA 70/40 làm bệnh nhân tử vong trên bàn mổ."}, {"key": "C", "trap": "[qua_bao_ton] Cho thở oxy chườm ấm không hồi sức sốc."}, {"key": "D", "trap": "[qua_bao_ton] Dùng Digoxin uống không có giá trị trong sốc nhiễm khuẩn."}, {"key": "E", "trap": "[nham_dan_so] Nhầm sốc nhiễm khuẩn nặng với dị ứng."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N4 + Sốc nặng HA 70/40 + Vô niệu + Lactate 5.2 mmol/L -> Sốc nhiễm khuẩn hậu sản nặng -> Bù dịch Ringer Lactate 30 mL/kg + Noradrenaline (MAP >= 65) + Kháng sinh IV trong 1h + Cấy máu.", "explanation": "Sốc nhiễm khuẩn hậu sản nặng có Lactate > 4 mmol/L và tụt HA kéo dài. Quy trình Hour-1 Bundle: Bù dịch tinh thể 30 mL/kg, dùng ngay vận mạch Noradrenaline nâng HA trung bình MAP >= 65 mmHg, dùng kháng sinh tĩnh mạch phổ rộng trong 1 giờ đầu, cấy máu trước dùng kháng sinh, đo lại Lactate."}, {"id": 31, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 28 tuổi, sinh thường ngày thứ 5 hậu sản. Bệnh nhân thấy đau rát nhẹ dọc theo mặt trong bắp chân trái. Thăm khám: Mạch 78 lần/phút, Thân nhiệt 37.2°C. Khám chân trái: Dọc theo đường đi của tĩnh mạch hiển nông ở bắp chân có dải dây tĩnh mạch nổi rõ, sưng đỏ, ấn cứng đau, chu vi hai cẳng chân bằng nhau (không sưng to toàn bộ chân), nghiệm pháp Homans âm tính.", "question": "Chẩn đoán dạng viêm tĩnh mạch và phác đồ điều trị bảo tồn chuẩn mực là gì?", "options": ["Nhiễm khuẩn tầng sinh môn, cắt bỏ chỉ may tầng sinh môn,.", "Viêm tắc tĩnh mạch sâu chi dưới, tiêm ngay thuốc chống đông Heparin liều cao.", "Viêm tắc tĩnh mạch nông chi dưới, nằm nghỉ kê cao chân, chườm ấm tại chỗ, dùng thuốc giảm đau chống viêm NSAIDs, không cần dùng chống đông toàn thân.", "Tắc mạch phổi cấp, mổ mở cấp cứu lồng ngực lấy huyết khối.", "Hoại tử cơ cẳng chân, mổ cắt lọc cơ bắp chân trái."], "correct": 2, "traps": [{"key": "A", "trap": "[sai_tang] Nhầm tổn thương chân với tầng sinh môn."}, {"key": "B", "trap": "[nham_dan_so] Nhầm viêm tĩnh mạch nông với viêm tĩnh mạch sâu DVT để tiêm Heparin liều cao."}, {"key": "D", "trap": "[qua_muc] Nhầm với tắc mạch phổi cấp."}, {"key": "E", "trap": "[qua_xam_lan] Chẩn đoán quá mức hoại tử cơ để cắt lọc."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N5 hậu sản + Tĩnh mạch hiển nông sưng đỏ cứng đơ + Không sưng toàn bộ chân + Homans (-) -> Viêm tắc tĩnh mạch nông chi dưới -> Nằm nghỉ kê cao chân + Chườm ấm + NSAIDs.", "explanation": "Viêm tắc tĩnh mạch nông chi dưới lành tính hơn viêm tĩnh mạch sâu. Dấu hiệu: Dải tĩnh mạch hiển nông nổi đỏ cứng đau, cẳng chân không sưng to. Điều trị: Bảo tồn tại chỗ (kê cao chân, chườm ấm, thuốc NSAIDs giảm đau chống viêm). Tuyệt đối không cần dùng chống đông đường tiêm trừ khi huyết khối lan gần tĩnh mạch sâu."}, {"id": 32, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 32 tuổi, béo phì, mổ sinh ngày thứ 6 hậu phẫu. Bệnh nhân xuất hiện đau dữ dội cẳng chân trái, sốt nhẹ 38.0°C. Thăm khám: Chân trái sưng to căng bóng, chu vi cẳng chân trái to hơn chân phải 4 cm, ấn bắp chân đau chói, nghiệm pháp Homans dương tính (gập mặt lưng bàn chân gây đau chói bắp chân). Siêu âm Doppler mạch máu: Huyết khối lấp hoàn toàn tĩnh mạch đùi nông trái.", "question": "Chẩn đoán xác định và phác đồ điều trị chống đông chuẩn mực cho sản phụ là gì?", "options": ["Gãy xương cẳng chân, bó bột cố định cẳng chân trái,,.", "Viêm tắc tĩnh mạch nông, chỉ chườm ấm và cho uống thuốc Paracetamol,.", "Áp xe bắp chân trái, mổ rạch chích mủ bắp chân,.", "Hoại tử chi dưới, mổ tháo khớp gối trái cấp cứu,.", "Viêm tắc tĩnh mạch sâu chi dưới DVT, dùng thuốc chống đông Heparin trọng lượng phân tử thấp LMWH tiêm dưới da liều điều trị, nằm nghỉ kê cao chân, đeo tất áp lực y tế."], "correct": 4, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm DVT với gãy xương."}, {"key": "B", "trap": "[qua_bao_ton] Nhầm DVT nguy cơ thuyên tắc phổi với viêm tĩnh mạch nông để chườm ấm."}, {"key": "C", "trap": "[nham_dan_so] Nhầm DVT với áp xe bắp chân."}, {"key": "D", "trap": "[qua_xam_lan] Chẩn đoán quá mức tháo khớp gối."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh N6 + Chân trái sưng to to hơn 4 cm + Homans (+) + Doppler có huyết khối tĩnh mạch đùi -> Viêm tắc tĩnh mạch sâu chi dưới (DVT) -> Chống đông LMWH tiêm dưới da + Kê cao chân + Tất áp lực.", "explanation": "Viêm tắc tĩnh mạch sâu chi dưới (DVT) có nguy cơ thuyên tắc mạch phổi tử vong. Dấu hiệu: Chân sưng to căng bóng, Homans (+), siêu âm Doppler thấy huyết khối. Điều trị chuẩn mực: Thuốc chống đông Heparin trọng lượng phân tử thấp (LMWH Enoxaparin) tiêm dưới da liều điều trị (1 mg/kg x 2 lần/ngày) + Kê cao chân + Tất áp lực."}, {"id": 33, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, mổ lấy thai ngày thứ 8 do viêm niêm mạc tử cung. Bệnh nhân đã được điều trị bằng phác đồ 3 kháng sinh tĩnh mạch phổ rộng liều cao 6 ngày liền nhưng vẫn sốt cao rét run từng cơn 39.5°C vây cá, không tìm thấy ổ mủ ở vết mổ hay buồng tử cung. Siêu âm Doppler ổ bụng: Tĩnh mạch buồng trứng phải giãn to d = 12 mm chứa huyết khối.", "question": "Chẩn đoán biến chứng huyết khối nhiễm khuẩn và thử nghiệm điều trị chẩn đoán là gì?", "options": ["Nạo hút buồng tử cung bằng chân không,,.", "Viêm tắc tĩnh mạch chậu nhiễm khuẩn SPT, tiếp tục kháng sinh tĩnh mạch kết hợp dùng thuốc chống đông Heparin tiêm tĩnh mạch hoặc LMWH, hết sốt sau 48-72 giờ giúp khẳng định chẩn đoán.", "Dừng toàn bộ kháng sinh và cho xuất viện,.", "Mổ mỏ cắt tử cung toàn phần và hai phần phụ khẩn cấp,.", "Cho dùng thuốc chống nấm Fluconazole truyền tĩnh mạch,."], "correct": 1, "traps": [{"key": "A", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được huyết khối tĩnh mạch chậu."}, {"key": "C", "trap": "[thieu_cau_phan] Dừng kháng sinh khi sốt cao kéo dài."}, {"key": "D", "trap": "[qua_xam_lan] Mổ cắt tử cung khi sốt do huyết khối tĩnh mạch chậu."}, {"key": "E", "trap": "[nham_dan_so] Nhầm sốt kéo dài với nhiễm nấm."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sốt 39.5°C kéo dài thất bại kháng sinh 6 ngày + Siêu âm có huyết khối tĩnh mạch buồng trứng -> Viêm tắc tĩnh mạch chậu nhiễm khuẩn (SPT) -> Kháng sinh tĩnh mạch + Heparin/LMWH (thử nghiệm hết sốt sau 48-72h).", "explanation": "Viêm tắc tĩnh mạch chậu nhiễm khuẩn (Septic pelvic thrombophlebitis - SPT) nghi ngờ khi bệnh nhân sốt kéo dài vây cá không rõ nguyên nhân mặc dù đã dùng kháng sinh tĩnh mạch phổ rộng 5-7 ngày. Thử nghiệm Heparin: Bổ sung Heparin/LMWH vào phác đồ kháng sinh, nếu bệnh nhân hết sốt cắt sốt ngoại mục sau 48-72h giúp khẳng định chắc chắn chẩn đoán SPT."}, {"id": 34, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 33 tuổi, béo phì, DVT chân trái ngày thứ 7 sau mổ sinh. Đột ngột bệnh nhân xuất hiện khó thở dữ dội, đau ngực bóp nghẹt, ho ra máu tươi, tím tái. Sinh hiệu: Mạch 135 lần/phút, HA tụt 80/50 mmHg, SpO2 = 82% với khí trời. ECG: S1Q3T3, nhịp nhanh xoang. Chụp CT mạch máu phổi (CTPA): Huyết khối bít tắc nhánh chính động mạch phổi phải.", "question": "Chẩn đoán cấp cứu tối khẩn và quy trình hồi sức tiêu sợi huyết/chống đông là gì?", "options": ["Nạo hút buồng tử cung bằng chân không,.", "Cho uống thuốc Paracetamol hạ sốt và tiếp tục theo dõi tại phòng bệnh,.", "Chuyển mổ mở cắt tử cung toàn phần cấp cứu,.", "Thuyên tắc mạch phổi cấp tính PE nguy cơ cao, thở oxy liều cao, hồi sức bù dịch, dùng thuốc tiêu sợi huyết Alteplase hoặc Heparin tiêm tĩnh mạch, hồi sức hô hấp tuần hoàn.", "Tiêm tĩnh mạch Dexamethasone chống dị ứng,."], "correct": 3, "traps": [{"key": "A", "trap": "[sai_tang] Nạo buồng tử cung không giải quyết được thuyên tắc phổi."}, {"key": "B", "trap": "[qua_bao_ton] Coi thuyên tắc phổi tử vong cao là sốt cho uống Paracetamol."}, {"key": "C", "trap": "[sai_tang] Mổ cắt tử cung khi tổn thương nằm ở động mạch phổi."}, {"key": "E", "trap": "[nham_dan_so] Nhầm thuyên tắc phổi với dị ứng."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: DVT N7 + Khó thở dữ dội tím tái SpO2 82% + CTPA có huyết khối động mạch phổi -> Thuyên tắc mạch phổi cấp (PE) nguy cơ cao -> Thở O2 + Bù dịch + Alteplase tiêu sợi huyết / Heparin IV + Hồi sức cấp cứu.", "explanation": "Thuyên tắc mạch phổi cấp (PE) là nguyên nhân tử vong mẹ hàng đầu. Dấu hiệu: Khó thở đột ngột, đau ngực, ho ra máu, SpO2 tụt, CTPA có huyết khối. Nếu PE nguy cơ cao có sốc tụt HA: Thở oxy liều cao, bù dịch, chỉ định thuốc tiêu sợi huyết (Alteplase rTPA) hoặc Heparin tĩnh mạch liều điều trị."}, {"id": 35, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 26 tuổi, sinh thường ngày thứ 10 hậu sản. Bệnh nhân sốt cao 39.0°C, rét run, đau nhức dữ dội vú bên phải. Khám bụng: Tử cung co hồi tốt ngang mu, sản dịch ít màu hồng trong không hôi. Khám vú: Vú phải căng to, 1/4 trên ngoài sưng đỏ d = 5 cm, ấn phập phồng đau chói, có mủ chảy ra từ núm vú khi vắt nhẹ. Siêu âm vú: Khối tụ mủ vú phải d = 42 mm.", "question": "Chẩn đoán xác định nguồn sốt và quy trình xử trí rạch chích mủ vú chuẩn mực là gì?", "options": ["Áp xe vú phải hậu sản, rạch chích dẫn lưu mủ vú phải theo đường nan hoa ngoài quầng vú, đặt dải gạc dẫn lưu, dùng kháng sinh toàn thân, tiếp tục vắt bỏ sữa bên vú bệnh.", "Viêm niêm mạc tử cung, nạo hút buồng tử cung bằng chân không,.", "Nhiễm khuẩn vết may tầng sinh môn, cắt bỏ chỉ tầng sinh môn,.", "Viêm phúc mạc toàn thể, mổ mở cấp cứu lau rửa ổ bụng,.", "Căng sữa sinh lý, chỉ chườm ấm và cho con bú trực tiếp bên vú sưng mủ,."], "correct": 0, "traps": [{"key": "B", "trap": "[sai_tang] Nhầm sốt do áp xe vú với tử cung khi tử cung co tốt sản dịch không hôi."}, {"key": "C", "trap": "[sai_tang] Nhầm với tầng sinh môn."}, {"key": "D", "trap": "[qua_xam_lan] Mổ ổ bụng khi tổn thương ở vú."}, {"key": "E", "trap": "[qua_bao_ton] Coi áp xe mủ 42 mm là căng sữa sinh lý cho con bú trực tiếp gây nhiễm khuẩn trẻ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N10 hậu sản + Sốt 39.0°C + Vú phải sưng mủ 42 mm + Tử cung co tốt sản dịch trong -> Áp xe vú phải hậu sản -> Rạch chích mủ đường nan hoa ngoài quầng vú + Dẫn lưu + Kháng sinh + Vắt bỏ sữa bên đau.", "explanation": "Cần phân biệt sốt do nhiễm khuẩn đường sinh dục với nhiễm khuẩn ngoài đường sinh dục (áp xe vú, nhiễm trùng tiết niệu). Áp xe vú có mủ phập phồng xử trí bắt buộc: Rạch chích dẫn lưu mủ theo đường nan hoa (tránh cắt qua các ống dẫn sữa), đặt gạc dẫn lưu, dùng kháng sinh toàn thân, vắt bỏ sữa bên đau (không cho con bú trực tiếp vú mủ)."}, {"id": 36, "bloom": "Mức 3 - Vận dụng", "stem": "Sản phụ 29 tuổi, sinh thường có đặt xông tiểu lưu ngày thứ 4 hậu sản. Bệnh nhân sốt cao 39.4°C, rét run, đau quặn vùng hông lưng bên phải. Khám bụng: Tử cung co hồi tốt, ấn không đau, sản dịch lượng vừa màu trong không hôi. Khám hệ tiết niệu: Nghiệm pháp rung thận phải dương tính, ấn điểm niệu quản trên phải đau chói. Xét nghiệm nước tiểu: Bạch cầu niệu (+++), Nitrite (+).", "question": "Chẩn đoán xác định nguồn sốt và phác đồ kháng sinh điều trị chuẩn mực là gì?", "options": ["Viêm tắc tĩnh mạch chậu, cho dùng Heparin chống đông,.", "Viêm niêm mạc tử cung, tiêm Oxytocin co hồi tử cung và nạo hút buồng tử cung.", "Viêm đài bể thận cấp hậu sản do nhiễm trùng tiết niệu ngược dòng, điều trị kháng sinh đường tĩnh mạch Ceftriaxone hoặc Fluoroquinolone, uống nhiều nước, cấy nước tiểu.", "Viêm ruột thừa cấp, mổ mỏ cắt ruột thừa khẩn cấp.", "Sốt sinh lý hậu sản, cho uống thuốc hạ sốt Paracetamol."], "correct": 2, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm với viêm tắc tĩnh mạch chậu."}, {"key": "B", "trap": "[sai_tang] Nhầm nhiễm trùng tiết niệu cao với viêm niêm mạc tử cung."}, {"key": "D", "trap": "[nham_dan_so] Nhầm đau hông lưng vỗ thận (+) với viêm ruột thừa."}, {"key": "E", "trap": "[qua_bao_ton] Coi viêm đài bể thận sốt 39.4°C BC niệu (+++) là sốt sinh lý."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: N4 hậu sản + Sốt 39.4°C rét run + Đau hông lưng vỗ thận (+) + BC niệu (+++) Nitrite (+) + Tử cung co tốt -> Viêm đài bể thận cấp hậu sản -> Kháng sinh tĩnh mạch (Ceftriaxone) + Uống nhiều nước + Cấy nước tiểu.", "explanation": "Đặt xông tiểu lưu trong sinh là yếu tố nguy cơ cao gây nhiễm trùng tiết niệu ngược dòng dẫn đến viêm đài bể thận cấp hậu sản. Dấu hiệu: Sốt cao rét run, đau hông lưng, rung thận (+), bạch cầu niệu và Nitrite (+), tử cung co tốt sản dịch không hôi. Điều trị: Kháng sinh đường tĩnh mạch (Ceftriaxone) + Uống nhiều nước."}, {"id": 37, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 25 tuổi, nạo buồng tử cung vì sót nhau ngày thứ 5 hậu sản tại phòng khám tư. Sau thủ thuật 24 giờ, bệnh nhân sốt 39.6°C, đau bụng dữ dội liên tục toàn bộ ổ bụng, nôn mửa. Khám: Bụng chướng, cảm ứng phúc mạc và co cứng thành bụng toàn bộ. Khám mỏ vịt: Cổ tử cung chảy mủ hôi. Siêu âm: Thủng đáy tử cung d = 15 mm, khoang bụng ngập dịch mủ đục.", "question": "Chẩn đoán biến chứng thủng tử cung và quy trình phẫu thuật cấp cứu là gì?", "options": ["Chườm đá lạnh toàn bụng và cho uống thuốc giảm đau,,.", "Nạo hút buồng tử cung lại lần nữa bằng chân không,,.", "Chỉ tiêm kháng sinh tĩnh mạch không mổ,,.", "Thụt tháo phân giải áp ruột,,,.", "Viêm phúc mạc toàn thể do thủng tử cung nhiễm khuẩn sau nạo hút, mổ mở cấp cứu khâu lỗ thủng tử cung hoặc cắt tử cung nếu cơ tử cung hoại tử, lau rửa sạch toàn bộ khoang bụng, đặt dẫn lưu."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_bao_ton] Chườm đá không giải quyết được mủ ngập ổ bụng."}, {"key": "B", "trap": "[qua_xam_lan] Nạo buồng tử cung lại khi tử cung đang thủng 15 mm làm ruột lòi vào tử cung."}, {"key": "C", "trap": "[qua_bao_ton] Không mổ cấp cứu khi có thủng tử cung viêm phúc mạc toàn thể."}, {"key": "D", "trap": "[qua_bao_ton] Thụt tháo phân cấm dùng khi có viêm phúc mạc."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sau nạo N1 + Thủng tử cung 15 mm + Viêm phúc mạc toàn thể + Mủ tự do ổ bụng -> Viêm phúc mạc toàn thể do thủng tử cung nhiễm khuẩn -> Mổ mở cấp cứu khâu lỗ thủng / cắt tử cung + Lau rửa ổ bụng + Dẫn lưu.", "explanation": "Thủng tử cung nhiễm khuẩn sau nạo hút làm mủ và vi khuẩn tràn vào khoang phúc mạc gây viêm phúc mạc toàn thể. Bắt buộc mổ mở cấp cứu: Khâu phục hồi lỗ thủng tử cung (hoặc cắt tử cung nếu cơ tử cung hoại tử mủ lan rộng), lau rửa sạch khoang bụng, đặt dẫn lưu."}, {"id": 38, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 31 tuổi, chẩn đoán DVT tĩnh mạch đùi sâu chân trái ngày thứ 6 sau mổ sinh. Bệnh nhân đã được điều trị bằng Enoxaparin tiêm dưới da 60 mg x 2 lần/ngày trong 7 ngày, triệu chứng sưng đau chân giảm rõ rệt, Doppler mạch máu huyết khối bắt đầu tái thông nhẹ. Bệnh nhân hỏi bác sĩ về thời gian bắt buộc phải tiếp tục duy trì điều trị chống đông.", "question": "Khuyến cáo chuẩn mực về thời gian duy trì thuốc chống đông cho sản phụ DVT hậu sản là gì?", "options": ["Dùng thuốc chống đông liên tục suốt đời không được ngừng,.", "Tiếp tục duy trì thuốc chống đông LMWH tiêm dưới da hoặc chuyển Warfarin đường uống kéo dài ít nhất 3 đến 6 tháng sau sinh, theo dõi chỉ số INR.", "Chỉ cần tiêm thêm thuốc chống đông trong 3 ngày nữa rồi dừng.", "Dừng toàn bộ thuốc chống đông ngay lập tức vì chân đã giảm sưng.", "Đổi sang uống thuốc Aspirin liều thấp 81 mg trong một tuần."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_muc] Chống đông suốt đời chỉ áp dụng cho người có biến chứng rối loạn đông máu di truyền nặng."}, {"key": "C", "trap": "[thieu_cau_phan] Tiêm thêm 3 ngày không đủ thời gian tái thông huyết khối."}, {"key": "D", "trap": "[thieu_cau_phan] Dừng chống đông quá sớm gây thuyên tắc phổi tái phát tử vong."}, {"key": "E", "trap": "[guideline_cu] Aspirin đơn thuần không đủ hiệu lực điều trị DVT đã xác định."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: DVT hậu sản đã ổn định cấp tính -> Thời gian duy trì chống đông chuẩn mực -> Tiếp tục LMWH hoặc Warfarin đường uống kéo dài ít nhất 3 đến 6 tháng sau sinh.", "explanation": "Huyết khối tĩnh mạch sâu (DVT) hậu sản có nguy cơ tái phát và thuyên tắc phổi rất cao nếu dừng chống đông sớm. Khuyến cáo chuẩn mực của RCOG/ACOG: Duy trì thuốc chống đông (LMWH hoặc Warfarin đường uống) kéo dài ít nhất 3 đến 6 tháng sau sinh (target INR 2.0-3.0 nếu dùng Warfarin)."}, {"id": 39, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, tự phá thai chui ngày thứ 3 hậu sản. Bệnh nhân đột ngột sốt 40.2°C, rét run, da vàng sậm như màu đồng thau, nước tiểu màu đỏ xá xị đen (tan máu cấp tính tối cấp). Mạch 135 lần/phút, HA 75/40 mmHg. Khám tử cung: Ấn tử cung lạo xạo hơi dưới tay, sản dịch màu nâu đen hôi thối dữ dội. Bệnh nhân có dấu hiệu suy thận cấp suy đa cơ quan.", "question": "Chẩn đoán vi khuẩn độc lực cao và phác đồ mổ cấp cứu cứu sống bệnh nhân là gì?", "options": ["Nhiễm khuẩn tầng sinh môn nhẹ, rửa vết thương tại chỗ,.", "Nhiễm nấm Candida toàn thân, cho truyền Fluconazole,,.", "Nhiễm siêu vi Dengue xuất huyết, chỉ truyền khối hồng cầu,.", "Nhiễm khuẩn huyết tối cấp do Clostridium perfringens gây tan máu cấp, tiêm tĩnh mạch Penicillin G liều tối đa x 24 triệu đơn vị/ngày phối hợp Clindamycin, mổ cắt tử cung toàn phần khẩn cấp loại bỏ ổ hoại tử.", "Sốc phản vệ do thức ăn, tiêm Adrenaline dưới da,,."], "correct": 3, "traps": [{"key": "A", "trap": "[qua_bao_ton] Coi nhiễm khuẩn tối cấp tan máu là tầng sinh môn nhẹ."}, {"key": "B", "trap": "[nham_dan_so] Nhầm Clostridium với nhiễm nấm."}, {"key": "C", "trap": "[nham_dan_so] Nhầm với sốt xuất huyết."}, {"key": "E", "trap": "[nham_dan_so] Nhầm với sốc phản vệ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sau phá thai chui N3 + Sốt 40.2°C + Da màu đồng thau + Nước tiểu màu xá xị tan máu + Tử cung lạo xạo hơi -> Nhiễm khuẩn huyết tối cấp do Clostridium perfringens -> Penicillin G IV 24 triệu UI/ngày + Clindamycin + Mổ cắt tử cung toàn phần khẩn cấp.", "explanation": "Clostridium perfringens là trực khuẩn gram dương yếm khí sinh ngoại độc tố nguy hiểm nhất sau phá thai/sinh nở. Độc tố alpha-toxin tiết ra làm tan máu nội mạch tối cấp (da màu đồng thau, nước tiểu màu xá xị), sinh hơi trong cơ tử cung (lạo xạo hơi) và suy đa cơ quan tử vong cực nhanh. Cấp cứu sống còn: Penicillin G IV liều tối đa (24 triệu UI/ngày) + Clindamycin + Mổ cắt tử cung toàn phần khẩn cấp để loại bỏ nguồn ngoại độc tố."}, {"id": 40, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 28 tuổi, con so, thai 39 tuần, chỉ định mổ lấy thai chủ động do khung chậu hẹp. Bệnh nhân không có tiền sử dị ứng thuốc, không có dấu hiệu nhiễm trùng. Bác sĩ phẫu thuật chuẩn bị cho dùng kháng sinh dự phòng trước mổ để ngăn ngừa biến chứng nhiễm khuẩn hậu phẫu.", "question": "Thời điểm tiêm và lựa chọn kháng sinh dự phòng chuẩn mực nhất theo ACOG là gì?", "options": ["Tiêm tĩnh mạch Cefazolin 2g đơn liều trong khoảng 30 đến 60 phút trước khi rạch da mổ lấy thai.", "Tiêm Cefazolin sau khi đã kẹp cắt dây rốn của em bé.", "Cho uống Ciprofloxacin 500 mg trước mổ hai giờ.", "Cho tiêm phối hợp 3 loại kháng sinh tĩnh mạch kéo dài 7 ngày sau mổ.", "Không cần dùng kháng sinh vì mổ chủ động vô khuẩn hoàn toàn."], "correct": 0, "traps": [{"key": "B", "trap": "[guideline_cu] Tiêm sau kẹp rốn là hướng dẫn cũ trước đây, hiện tại ACOG khuyến cáo tiêm trước rạch da."}, {"key": "C", "trap": "[bo_chong_chi_dinh] Dùng Ciprofloxacin đường uống không đúng chỉ định kháng sinh dự phòng phẫu thuật."}, {"key": "D", "trap": "[qua_muc] Dùng 3 kháng sinh 7 ngày cho mổ chủ động là lạm dụng kháng sinh gây đề kháng."}, {"key": "E", "trap": "[qua_bao_ton] Không dùng kháng sinh dự phòng làm tăng nguy cơ nhiễm khuẩn hậu phẫu gấp 5-10 lần."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Mổ sinh chủ động -> Kháng sinh dự phòng chuẩn ACOG -> Tiêm tĩnh mạch Cefazolin 2g đơn liều trong 30-60 phút trước rạch da.", "explanation": "Khuyến cáo mới nhất của ACOG và WHO: Tiêm tĩnh mạch kháng sinh dự phòng Cefazolin 2g (hoặc 3g nếu mẹ nặng >= 120 kg) đơn liều trong khoảng 30-60 phút TRƯỚC KHI RẠCH DA (thay vì đợi sau kẹp dây rốn như trước đây). Việc này giúp đạt nồng độ kháng sinh tối ưu trong mô tại thời điểm rạch da, giảm tỷ lệ nhiễm khuẩn vết mổ và viêm niêm mạc tử cung đáng kể."}, {"id": 41, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 30 tuổi, viêm niêm mạc tử cung nặng sau mổ sinh. Bệnh nhân đang được điều trị bằng phác đồ Ampicillin + Gentamicin 5 mg/kg IV x 1 lần/ngày + Metronidazole. Đến ngày thứ 3 điều trị, bệnh nhân xuất hiện ù tai nhẹ, lượng nước tiểu giảm còn 400 mL/24h. Xét nghiệm: Creatinine máu tăng từ 70 lên 165 umol/L.", "question": "Thái độ xử trí lâm sàng chuẩn xác để bảo vệ chức năng thận cho sản phụ là gì?", "options": ["Dừng toàn bộ mọi loại kháng sinh và cho xuất viện.", "Tiếp tục tăng gấp đôi liều Gentamicin để tiêu diệt vi khuẩn nhanh hơn.", "Tạm dừng ngay Gentamicin, kiểm tra lại Creatinine máu và cấy sản dịch, điều chỉnh phác đồ sang Cephalosporin thế hệ 3 phối hợp Metronidazole.", "Không thay đổi gì vì ù tai và tăng Creatinine là tác dụng phụ nhẹ bình thường.", "Chỉ cho uống thêm thuốc lợi tiểu Furosemide và giữ nguyên Gentamicin."], "correct": 2, "traps": [{"key": "A", "trap": "[thieu_cau_phan] Dừng toàn bộ kháng sinh khi nhiễm khuẩn tử cung chưa khỏi hoàn toàn."}, {"key": "B", "trap": "[bo_chong_chi_dinh] Tăng liều Gentamicin khi đang ngộ độc suy thận gây hoại tử ống thận cấp và điếc vĩnh viễn."}, {"key": "D", "trap": "[qua_bao_ton] Coi ngộ độc tai và suy thận Creatinine 165 là bình thường."}, {"key": "E", "trap": "[qua_bao_ton] Dùng lợi tiểu cưỡng ép không ngừng thuốc độc thận."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Dùng Gentamicin N3 + Ù tai + Creatinine tăng vọt 165 umol/L -> Ngộ độc Gentamicin trên thận và ốc tai -> Tạm dừng Gentamicin + Chuyển phác đồ Cephalosporin thế hệ 3 + Metronidazole.", "explanation": "Gentamicin (nhóm Aminoglycosid) có độc tính cao trên thận (hoại tử ống thận cấp) và ốc tai (ù tai, điếc không hồi phục). Khi có dấu hiệu tổn thương thận (Creatinine tăng) hoặc độc tính trên tai, bắt buộc phải dừng ngay Gentamicin và chuyển sang kháng sinh không độc thận như Cephalosporin thế hệ 3."}, {"id": 42, "bloom": "Mức 4 - Ra quyết định", "stem": "Sản phụ 26 tuổi, con so, thai 38 tuần 4 ngày. Bệnh nhân vào viện vì rỉ ối ngả âm đạo từ 20 giờ trước. Hiện tại chưa có cơn co chuyển dạ rõ. Thăm khám: Thân nhiệt 36.9°C, Mạch 80 lần/phút, tử cung không đau, tim thai 140 ck/phút. Khám mỏ vịt: Dịch ối trong chảy ra từ cổ tử cung, pH quỳ tím chuyển xanh (+). Xét nghiệm: Bạch cầu 11.000/mm³, CRP = 5 mg/L.", "question": "Chẩn đoán nguy cơ và phác đồ kháng sinh dự phòng trong chuyển dạ chuẩn mực là gì?", "options": ["Tiêm ngay phối hợp 3 loại kháng sinh tĩnh mạch liều tối đa kéo dài 10 ngày.", "Không cần dùng kháng sinh vì bạch cầu và CRP hoàn toàn bình thường,.", "Mổ lấy thai cấp cứu ngay lập tức bất chấp tình trạng sản phụ.", "Cho uống thuốc kháng sinh Amoxicillin tại nhà và hẹn khi nào đau bụng mới vào viện.", "Ối vỡ sớm kéo dài trên 18 giờ chưa nhiễm khuẩn, cho tiêm tĩnh mạch Ampicillin 2g dự phòng nhiễm khuẩn hậu sản và GBS, đồng thời khởi phát chuyển dạ."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_muc] Dùng 3 kháng sinh liều tối đa khi chưa có dấu hiệu nhiễm khuẩn trên lâm sàng."}, {"key": "B", "trap": "[qua_bao_ton] Không dùng kháng sinh khi ối vỡ > 18h làm tăng nguy cơ nhiễm khuẩn hậu sản gấp 6 lần."}, {"key": "C", "trap": "[qua_xam_lan] Mổ sinh ngay khi không có chỉ định sản khoa khác."}, {"key": "D", "trap": "[qua_bao_ton] Cho về nhà khi ối vỡ kéo dài 20 giờ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Thai 38w4d + Ối vỡ sớm 20h (> 18h) + Chưa có dấu hiệu nhiễm khuẩn -> Nguy cơ nhiễm khuẩn hậu sản cao -> Tiêm Ampicillin 2g IV dự phòng GBS + Khởi phát chuyển dạ.", "explanation": "Ối vỡ sớm kéo dài > 18 giờ là yếu tố nguy cơ hàng đầu gây nhiễm khuẩn hậu sản và nhiễm khuẩn sơ sinh. Khuyến cáo chuẩn mực: Tiêm tĩnh mạch Ampicillin 2g (sau đó 1g mỗi 4h) để dự phòng nhiễm khuẩn và phòng ngừa Liên cầu nhóm B (GBS), phối hợp khởi phát chuyển dạ nếu không có chống chỉ định sinh ngả âm đạo."}, {"id": 43, "bloom": "Mức 5 - Đánh giá", "stem": "Sản phụ 27 tuổi, đẻ thường ngày thứ 4 hậu sản. Bệnh nhân sốt 38.7°C, đau tức hạ vị, sản dịch ra màu xám đục hôi thối. Bác sĩ trẻ kê đơn cho sản phụ tiêm Oxytocin 10 UI tiêm bắp x 2 lần/ngày đơn thuần để tăng co hồi tống xuất sản dịch mà không kê thêm bất kỳ thuốc kháng sinh nào. Đến ngày thứ 6, sản phụ rơi vào sốt cao 39.8°C rét run, lơ mơ.", "question": "Thẩm định sai lầm lâm sàng nghiêm trọng trong đơn thuốc của bác sĩ trẻ?", "options": ["Chỉ định sai lầm vì bắt buộc phải mổ cắt tử cung ngay từ ngày thứ 4,.", "Chỉ định sai lầm nghiêm trọng vì kháng sinh tĩnh mạch phổ rộng là trụ cột điều trị bắt buộc để tiêu diệt vi khuẩn, Oxytocin chỉ là thuốc hỗ trợ không thể thay thế kháng sinh.", "Chỉ định sai lầm vì Oxytocin chống chỉ định tuyệt đối trong thời kỳ hậu sản.", "Chỉ định đúng đắn nhưng bắt buộc phải tăng liều Oxytocin lên gấp 5 lần mới đạt hiệu quả.", "Chỉ định hoàn toàn đúng đắn vì Oxytocin tống xuất hết sản dịch hôi là tử cung sẽ tự khỏi nhiễm khuẩn."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_xam_lan] Cắt tử cung ngay N4 khi chưa dùng kháng sinh."}, {"key": "C", "trap": "[bo_chong_chi_dinh] Hiểu sai Oxytocin chống chỉ định hậu sản (Oxytocin là thuốc co hồi tử cung hậu sản hàng đầu)."}, {"key": "D", "trap": "[qua_muc] Tăng liều Oxytocin gấp 5 lần gây ngộ độc nước."}, {"key": "E", "trap": "[qua_bao_ton] Coi Oxytocin thay thế được kháng sinh diệt khuẩn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sốt 38.7°C + Sản dịch hôi thối + Chỉ tiêm Oxytocin đơn thuần -> Bỏ sót kháng sinh diệt khuẩn -> Kháng sinh tĩnh mạch phổ rộng là trụ cột bắt buộc tiêu diệt vi khuẩn.", "explanation": "Trong điều trị nhiễm khuẩn hậu sản (viêm niêm mạc tử cung), kháng sinh đường tĩnh mạch phổ rộng là trụ cột điều trị tiên quyết và bắt buộc để tiêu diệt vi khuẩn gây bệnh. Thuốc co hồi tử cung (Oxytocin) chỉ có vai trò hỗ trợ tống xuất sản dịch. Dùng Oxytocin đơn thuần không dùng kháng sinh sẽ làm vi khuẩn bùng phát lan vào máu gây nhiễm khuẩn huyết."}, {"id": 44, "bloom": "Mức 4 - Ra quyết định", "stem": "Nữ hoàng hộ sinh lập bảng hướng dẫn theo dõi sản dịch cho các sản phụ tại khoa Hậu sản. Bảng hướng dẫn giúp sản phụ và nhân viên y tế phát hiện sớm dấu hiệu bất thường của sản dịch để chẩn đoán sớm nhiễm khuẩn hậu sản.", "question": "Các tiêu chuẩn sinh lý chuẩn mực về diễn tiến sản dịch hậu sản bình thường là gì?", "options": ["Sản dịch chỉ xuất hiện vào ngày thứ 10 sau sinh trở đi,.", "Sản dịch luôn có màu đỏ tươi kéo dài liên tục trong suốt 30 ngày sau sinh,.", "Sản dịch hoàn toàn không có mùi gì và biến mất hoàn toàn ngay sau khi sinh 24 giờ.", "Sản dịch giảm dần về lượng, biến đổi màu sắc từ đỏ sẫm trong 3-4 ngày đầu sang hồng nhạt đến trắng đục sau 10-14 ngày, có mùi nồng nhẹ sinh lý nhưng tuyệt đối không hôi thối.", "Sản dịch sinh lý bắt buộc phải có mùi hôi nồng nặc và chứa nhiều mủ xanh."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] Hiểu sai thời điểm xuất hiện sản dịch."}, {"key": "B", "trap": "[nham_dan_so] Nhầm sản dịch đỏ tươi kéo dài 30 ngày (là chảy máu bất thường)."}, {"key": "C", "trap": "[qua_bao_ton] Hiểu sai sản dịch biến mất ngay sau sinh 24h."}, {"key": "E", "trap": "[nham_dan_so] Nhầm sản dịch hôi mủ sinh lý (đó là sản dịch nhiễm khuẩn)."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Diễn tiến sản dịch hậu sản sinh lý -> Đỏ sẫm (lochia rubra 3-4d) -> Hồng nhạt (lochia serosa) -> Trắng đục (lochia alba 10-14d) -> Mùi nồng nhẹ sinh lý không hôi.", "explanation": "Sản dịch (Lochia) diễn tiến sinh lý qua 3 giai đoạn: (1) Lochia rubra (đỏ sẫm, 3-4 ngày đầu); (2) Lochia serosa (hồng nhạt/nâu nhạt, ngày 4-10); (3) Lochia alba (trắng đục/vàng nhạt, ngày 10-14 đến 3-4 tuần). Mùi sản dịch sinh lý nồng nhẹ giống mùi máu kinh, nếu có mùi hôi thối đục mủ là dấu hiệu nhiễm khuẩn hậu sản."}, {"id": 45, "bloom": "Mức 6 - Sáng tạo", "stem": "Tại Bệnh viện tuyến huyện, sản phụ 29 tuổi sau mổ sinh ngày thứ 4 bị viêm cơ tử cung nặng rơi vào sốc nhiễm khuẩn: Mạch 128 lần/phút, HA 80/45 mmHg, lơ mơ. Bác sĩ trực quyết định hồi sức tại chỗ và lập kế hoạch chuyển bệnh nhân lên Bệnh viện Sản Nhi tuyến tỉnh.", "question": "Thiết kế quy trình chuyển tuyến an toàn tối ưu nhất cho sản phụ sốc nhiễm khuẩn?", "options": ["Hồi sức truyền nhanh Ringer Lactate bù dịch tĩnh mạch, tiêm liều kháng sinh tĩnh mạch đầu tiên, dùng Noradrenaline giữ HA, liên hệ báo trước tuyến trên và cử bác sĩ hồi sức đi kèm xe cấp cứu.", "Cho bệnh nhân lên xe cấp cứu chuyển đi ngay lập tức mà không cần bù dịch hay tiêm kháng sinh trước để tránh làm trễ thời gian.", "Cho uống thuốc Paracetamol hạ sốt rồi cho gia đình tự thuê xe taxi chở lên tuyến tỉnh,.", "Giữ bệnh nhân lại tuyến huyện điều trị nội khoa kéo dài 7 ngày bất chấp tình trạng sốc.", "Tiêm ngay thuốc co hồi tử cung Ergometrine rồi cho chuyển viện bằng xe máy,."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_bao_ton] Chuyển viện không hồi sức dịch làm bệnh nhân tử vong tụt HA trên đường đi."}, {"key": "C", "trap": "[qua_bao_ton] Cho đi taxi không có nhân viên y tế và phương tiện hồi sức."}, {"key": "D", "trap": "[qua_bao_ton] Giữ bệnh nhân sốc ở tuyến huyện không đủ năng lực hồi sức."}, {"key": "E", "trap": "[bo_chong_chi_dinh] Dùng Ergometrine và xe máy gây tử vong."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Sốc nhiễm khuẩn hậu sản tại tuyến huyện -> Quy trình chuyển tuyến an toàn -> Bù dịch Ringer Lactate + Kháng sinh IV liều 1 + Vận mạch Noradrenaline + Báo tuyến tỉnh + Bác sĩ hồi sức đi kèm xe cấp cứu.", "explanation": "Quy trình chuyển tuyến an toàn cho bệnh nhân sốc nhiễm khuẩn hậu sản: Bắt buộc hồi sức chống sốc ban đầu trước khi di chuyển (bù dịch Ringer Lactate, tiêm tĩnh mạch liều kháng sinh đầu tiên, dùng vận mạch Noradrenaline giữ MAP >= 65 mmHg), liên hệ báo trước cấp cứu tuyến trên chuẩn bị giường/máu, cử bác sĩ hồi sức đi kèm trên xe cấp cứu chuyên dụng."}, {"id": 46, "bloom": "Mức 5 - Đánh giá", "stem": "Hội đồng kiểm thảo tử vong mẹ của Sở Y tế phân tích ca tử vong của sản phụ 26 tuổi do nhiễm khuẩn huyết và sốc nhiễm khuẩn sau mổ sinh. Nguyên nhân do tuyến cơ sở chẩn đoán muộn sốt hậu sản, coi sốt ngày N3 là sốt sữa sinh lý, đến ngày N6 khi sản phụ rơi vào lơ mơ sốc nhiễm khuẩn mới phát hiện viêm cơ tử cung hoại tử.", "question": "Đánh giá bài học an toàn hệ thống quan trọng nhất để ngăn ngừa các ca tử vong mẹ tương tự?", "options": ["Chỉ cho sản phụ xuất viện sau sinh 24 giờ để tránh lây nhiễm chéo,.", "Cấm toàn bộ việc mổ lấy thai ở tất cả các bệnh viện tuyến dưới,.", "Tăng cường tập huấn nhận biết sớm tam chứng nhiễm khuẩn hậu sản sốt, tử cung co hồi kém, sản dịch hôi, tuyệt đối không quy kết sốt hậu sản cho căng sữa khi chưa thăm khám tử cung và sản dịch.", "Bỏ quy định theo dõi nhiệt độ và sản dịch hàng ngày ở khoa Hậu sản,.", "Yêu cầu 100% sản phụ sau sinh phải tiêm kháng sinh tĩnh mạch phối hợp 3 loại kéo dài một tháng,."], "correct": 2, "traps": [{"key": "A", "trap": "[qua_bao_ton] Cho về sớm 24h làm tăng tỷ lệ nhiễm khuẩn tại nhà không được phát hiện."}, {"key": "B", "trap": "[qua_muc] Cấm mổ sinh tuyến dưới là giải pháp cực đoan không khả thi."}, {"key": "D", "trap": "[qua_bao_ton] Bỏ theo dõi nhiệt độ sản dịch làm tăng tỷ lệ bỏ sót nhiễm khuẩn."}, {"key": "E", "trap": "[qua_muc] Dùng 3 kháng sinh 1 tháng cho tất cả sản phụ gây lạm dụng kháng sinh nghiêm trọng."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Bài học an toàn hệ thống phòng tử vong mẹ do nhiễm khuẩn hậu sản -> Đào tạo nhận biết sớm tam chứng (Sốt + Tử cung co kém + Sản dịch hôi) -> Cấm quy sốt hậu sản do căng sữa khi chưa khám tử cung sản dịch.", "explanation": "Căng sữa sinh lý chỉ gây sốt nhẹ (< 38.5°C) trong vòng 24h và vú sưng đau đều hai bên. Mọi trường hợp sốt hậu sản sau ngày thứ 2 bắt buộc phải thăm khám tử cung và sản dịch để loại trừ nhiễm khuẩn hậu sản. Nhận biết sớm tam chứng (sốt, tử cung co kém, sản dịch hôi) và dùng kháng sinh IV sớm là chìa khóa giảm tử vong mẹ."}, {"id": 47, "bloom": "Mức 6 - Sáng tạo", "stem": "Trưởng khoa Sản thiết kế bảng kiểm an toàn vô khuẩn phòng sinh (Birth Safety Checklist) nhằm mục tiêu giảm tỷ lệ nhiễm khuẩn hậu sản tại Bệnh viện xuống dưới 0.5%. Bảng kiểm tập trung vào các mốc can thiệp thủ thuật trong quá trình đỡ sinh ngả âm đạo.", "question": "Thiết kế các trụ cột quy chuẩn vô khuẩn bắt buộc trong đỡ sinh ngả âm đạo?", "options": ["Dùng lại bộ dụng cụ đỡ sinh đỡ cho nhiều sản phụ mà không cần hấp tiệt trùng,.", "Cho nhân viên y tế thăm khám âm đạo mỗi 15 phút một lần bằng găng tay không tiệt trùng,.", "Rửa tầng sinh môn bằng nước cất thông thường không cần dung dịch sát khuẩn,.", "Cho sản phụ tắm ngâm mình trong bể nước chung trước khi đỡ sinh,,.", "Rửa tay phẫu thuật tiệt trùng, đeo găng tay vô khuẩn, sát khuẩn vùng tầng sinh môn bằng Betadine, hạn chế tối đa số lần thăm khám âm đạo trong chuyển dạ, đảm bảo dụng cụ đỡ sinh tiệt trùng tuyệt đối."], "correct": 4, "traps": [{"key": "A", "trap": "[qua_bao_ton] Dùng lại dụng cụ không hấp tiệt trùng gây đại dịch nhiễm khuẩn hậu sản."}, {"key": "B", "trap": "[qua_bao_ton] Thăm âm đạo liên tục 15p bằng găng không tiệt trùng gây đưa vi khuẩn vào tử cung."}, {"key": "C", "trap": "[qua_bao_ton] Rửa nước cất không sát khuẩn."}, {"key": "D", "trap": "[qua_bao_ton] Tắm bể chung gây lây nhiễm chéo vi khuẩn."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Thiết kế quy trình vô khuẩn phòng sinh -> Rửa tay phẫu thuật + Găng tiệt trùng + Sát khuẩn tầng sinh môn Betadine + Hạn chế số lần thăm âm đạo + Dụng cụ hấp tiệt trùng tuyệt đối.", "explanation": "Mỗi lần thăm khám âm đạo bằng tay là một lần đưa vi khuẩn từ bên ngoài vào đường sinh dục. Quy chuẩn vô khuẩn phòng sinh bắt buộc: Rửa tay phẫu thuật, đeo găng tiệt trùng, sát khuẩn tầng sinh môn bằng dung dịch Betadine, hạn chế số lần thăm âm đạo (chỉ khám mỗi 4h hoặc khi có chỉ định), dụng cụ hấp tiệt trùng tuyệt đối."}, {"id": 48, "bloom": "Mức 6 - Sáng tạo", "stem": "Ban Quản lý Chất lượng Bệnh viện xây dựng Quy trình phân tầng nguy cơ nhiễm khuẩn hậu phẫu cho các sản phụ mổ lấy thai. Quy trình giúp nhận diện sớm nhóm nguy cơ cao để áp dụng phác đồ dự phòng tích cực ngay từ trong mổ.", "question": "Thiết kế các yếu tố nguy cơ cao và gói can thiệp dự phòng tích cực tương ứng?", "options": ["Không cho sản phụ tắm rửa vệ sinh da trước mổ sinh,.", "Nhận diện nhóm nguy cơ cao ối vỡ kéo dài > 18h, chuyển dạ kéo dài, béo phì, đái tháo đường, tiêm Cefazolin 2g trước rạch da, chuẩn bị da vùng mổ bằng cồn Povidone-Iodine, kiểm soát đường huyết tốt.", "Cho tất cả sản phụ nguy cơ cao uống thuốc Corticoid Dexamethasone kéo dài 10 ngày,.", "Mổ lấy thai dưới nước để giảm tỷ lệ nhiễm khuẩn vết mổ,.", "Chỉ áp dụng dự phòng cho sản phụ mổ sinh chủ động, còn mổ sinh cấp cứu thì không cần dự phòng,."], "correct": 1, "traps": [{"key": "A", "trap": "[qua_bao_ton] Không tắm vệ sinh da làm tăng vi khuẩn thường trú trên da."}, {"key": "C", "trap": "[bo_chong_chi_dinh] Dùng Corticoid làm suy giảm miễn dịch tăng nguy cơ nhiễm khuẩn hậu phẫu."}, {"key": "D", "trap": "[qua_muc] Mổ dưới nước không có bằng chứng giảm nhiễm khuẩn."}, {"key": "E", "trap": "[qua_bao_ton] Bỏ qua mổ sinh cấp cứu (nhóm mổ cấp cứu có nguy cơ nhiễm khuẩn cao nhất)."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Thiết kế phân tầng nguy cơ mổ sinh -> Nhóm nguy cơ cao (Ối vỡ > 18h, ĐTĐ, béo phì) -> Cefazolin 2g trước rạch da + Sát khuẩn cồn Povidone-Iodine + Kiểm soát đường huyết.", "explanation": "Gói can thiệp dự phòng nhiễm khuẩn mổ lấy thai (Surgical Site Infection Bundle): (1) Phân tầng nguy cơ (ối vỡ kéo dài, béo phì, đái tháo đường); (2) Tắm sát khuẩn da trước mổ; (3) Tiêm Cefazolin 2g IV trong 30-60 min trước rạch da; (4) Chuẩn bị da vùng mổ bằng cồn Povidone-Iodine hoặc Chlorhexidine-alcohol; (5) Kiểm soát đường huyết trong và sau mổ."}, {"id": 49, "bloom": "Mức 6 - Sáng tạo", "stem": "Nữ hộ sinh trưởng thiết kế Tờ hướng dẫn xuất viện (Discharge Safety Plan) trao cho mọi sản phụ trước khi rời viện. Bản hướng dẫn liệt kê các dấu hiệu báo động đỏ nhiễm khuẩn hậu sản cần quay lại bệnh viện khám khẩn cấp.", "question": "Thiết kế danh mục các dấu hiệu báo động đỏ nhiễm khuẩn hậu sản cần tái khám ngay?", "options": ["Co hồi tử cung râm râm nhẹ khi cho con bú,,.", "Sản dịch chuyển từ màu đỏ sang màu hồng nhạt sau 5 ngày sinh,.", "Tuyến vú tiết ra sữa màu vàng sánh nhẹ trong 2 ngày đầu,.", "Sốt trên 38°C hoặc có cảm giác rét run, sản dịch có mùi hôi thối hoặc ra máu đỏ tươi tái phát lượng nhiều, đau tức hạ vị tăng dần, vết mổ/vết may sưng đỏ chảy mủ.", "Thấy mệt mỏi nhẹ và buồn ngủ sau khi thức đêm chăm con,."], "correct": 3, "traps": [{"key": "A", "trap": "[nham_dan_so] Nhầm cơn co tử cung sinh lý khi cho con bú với báo động đỏ."}, {"key": "B", "trap": "[nham_dan_so] Nhầm diễn tiến sản dịch hồng nhạt sinh lý với dấu hiệu báo động."}, {"key": "C", "trap": "[nham_dan_so] Nhầm tiết sữa non sinh lý với dấu hiệu báo động."}, {"key": "E", "trap": "[nham_dan_so] Nhầm mệt mỏi sinh lý với báo động đỏ."}], "decision": "[4. Bảng chốt quyết định (chot_quyet_dinh)]: Bản hướng dẫn báo động đỏ hậu sản tại nhà -> Sốt > 38°C/rét run + Sản dịch hôi thối/máu tươi tái phát + Đau hạ vị tăng + Vết mổ/vết may sưng đỏ chảy mủ.", "explanation": "Tờ hướng dẫn xuất viện giúp sản phụ nhận biết sớm các dấu hiệu báo động đỏ (Red Flags) của nhiễm khuẩn hậu sản tại nhà: Sốt > 38°C hoặc rét run, sản dịch hôi thối đục mủ hoặc ra máu tươi trở lại, đau hạ vị tăng dần, vết may tầng sinh môn hoặc vết mổ sưng đỏ đau chảy mủ. Khi có 1 trong các dấu hiệu này bắt buộc quay lại viện ngay."}, {"id": 50, "bloom": "Mức 6 - Sáng tạo", "stem": "Giám đốc Bệnh viện Sản Nhi chỉ đạo Xây dựng Mô hình Quản lý chất lượng toàn diện 3 trụ cột nhằm triệt tiêu các ca nhiễm khuẩn hậu sản nặng và tử vong mẹ do nhiễm khuẩn.", "question": "Thiết kế 3 trụ cột chiến lược của mô hình quản lý chất lượng phòng chống nhiễm khuẩn hậu sản?", "options": ["Trụ cột 1: Kiểm soát vô khuẩn tuyệt đối phòng sinh và phòng mổ; Trụ cột 2: Tiêm kháng sinh dự phòng chuẩn Cefazolin trước rạch da mổ sinh; Trụ cột 3: Giám sát phát hiện sớm tam chứng nhiễm khuẩn hậu sản và điều trị kháng sinh tĩnh mạch kịp thời.", "Trụ cột 1: Cấm hoàn toàn sinh ngả âm đạo; Trụ cột 2: Cho uống kháng sinh liều cao 30 ngày sau sinh; Trụ cột 3: Cách ly sản phụ tại phòng kín không cho tắm rửa.", "Trụ cột 1: Chỉ mổ sinh cho sản phụ giàu có; Trụ cột 2: Dùng kháng sinh đường tiêm đắt tiền nhất; Trụ cột 3: Không cho người nhà vào thăm,.", "Trụ cột 1: Xóa bỏ toàn bộ dung dịch sát khuẩn Betadine; Trụ cột 2: Dùng lại găng tay cao su rửa sạch; Trụ cột 3: Bỏ theo dõi sản dịch.", "Trụ cột 1: Cho xuất viện ngay sau sinh 12 giờ; Trụ cột 2: Không cho sản phụ uống nước; Trụ cột 3: Không làm xét nghiệm máu,."], "correct": 0, "traps": [{"key": "B", "trap": "[qua_muc] Cấm sinh thường uống kháng     // QUẢN LÝ TIẾN ĐỘ LOCAL STORAGE ĐỘC LẬP THEO TÊN FILE
    const PAGE_ID = window.location.pathname.split('/').pop().replace('.html', '') || 'bai-41-nhiem-khuan-hau-san';
    const STORAGE_KEY = `QUIZ_STATE_${PAGE_ID}_V41_CLEAN`;
    
    let state = {
      answers: {},    // { qId: selectedOptionIndex }
      bookmarks: [],  // [ qId ]
      notes: {},      // { qId: text }
      currentIndex: 0,
      filter: 'all'
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) state = { ...state, ...JSON.parse(saved) };
      } catch (e) { console.error(e); }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) { console.error(e); }
    }

    // LẤY DANH SÁCH CÂU HỎI THEO BỘ LỌC ĐANG CHỌN
    function getFilteredList() {
      return QUESTIONS.map((q, idx) => ({ q, idx })).filter(({ q }) => {
        if (state.filter === 'starred') return state.bookmarks.includes(q.id);
        if (state.filter === 'wrong') {
          const ans = state.answers[q.id];
          return (ans !== undefined && ans !== q.correct);
        }
        return true;
      });
    }

    function initApp() {
      loadState();
      applyFilterUI();
      ensureCurrentIndexInFilter();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function applyFilterUI() {
      ['all', 'starred', 'wrong'].forEach(item => {
        const btn = document.getElementById(`flt-${item}`);
        if (!btn) return;
        if (item === state.filter) {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-teal-600 text-white shadow-xs font-semibold";
        } else {
          btn.className = "px-2.5 py-1 rounded-full whitespace-nowrap bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold";
        }
      });
    }

    function ensureCurrentIndexInFilter() {
      const filtered = getFilteredList();
      if (filtered.length === 0) return;
      if (!filtered.some(item => item.idx === state.currentIndex)) {
        state.currentIndex = filtered[0].idx;
      }
    }

    function setFilter(flt) {
      state.filter = flt;
      applyFilterUI();
      const filtered = getFilteredList();
      if (filtered.length === 0) {
        if (flt === 'starred') alert('Bạn chưa đánh dấu (★) ca lâm sàng nào!');
        else if (flt === 'wrong') alert('Bạn chưa có câu nào làm sai!');
        state.filter = 'all';
        applyFilterUI();
        state.currentIndex = 0;
      } else {
        state.currentIndex = filtered[0].idx;
      }
      saveState();
      renderCurrentQuestion();
      renderGridCells();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentQuestion() {
      const filtered = getFilteredList();
      const currentFilteredPos = filtered.findIndex(item => item.idx === state.currentIndex);
      const q = QUESTIONS[state.currentIndex];
      if (!q) return;

      document.getElementById("case-title").textContent = `Ca ${q.id < 10 ? '0' + q.id : q.id}`;
      document.getElementById("case-bloom").textContent = q.bloom;
      document.getElementById("case-stem").textContent = q.stem;
      document.getElementById("case-question").textContent = q.question;
      
      const badgeText = (state.filter === 'all') ? `Ca ${q.id}/50` : `Ca ${q.id} (${currentFilteredPos + 1}/${filtered.length})`;
      document.getElementById("current-badge").textContent = badgeText;
      document.getElementById("footer-index").textContent = (state.filter === 'all') ? `${q.id} / 50` : `${currentFilteredPos + 1} / ${filtered.length}`;

      const isStarred = state.bookmarks.includes(q.id);
      const starIcon = document.getElementById("star-icon");
      const starBtn = document.getElementById("star-btn");
      if (isStarred) {
        starIcon.classList.add("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.add("border-amber-300", "bg-amber-50");
      } else {
        starIcon.classList.remove("fill-amber-400", "text-amber-500", "stroke-amber-500");
        starBtn.classList.remove("border-amber-300", "bg-amber-50");
      }

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      const letters = ["A", "B", "C", "D", "E"];
      const userAnswer = state.answers[q.id];
      const isAnswered = (userAnswer !== undefined);

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = `w-full text-left p-3 rounded-xl border text-xs font-medium flex items-start gap-2.5 transition-all active:scale-[0.99] min-h-[48px] `;
        
        let borderClass = "border-slate-200 bg-white hover:border-teal-300 hover:bg-teal-50/30 text-slate-700";
        let letterBadge = "bg-slate-100 text-slate-700 border-slate-200";

        if (isAnswered) {
          if (idx === q.correct) {
            borderClass = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-semibold ring-1 ring-emerald-500";
            letterBadge = "bg-emerald-600 text-white border-emerald-600";
          } else if (idx === userAnswer) {
            borderClass = "border-rose-500 bg-rose-50/80 text-rose-900 font-semibold ring-1 ring-rose-500";
            letterBadge = "bg-rose-600 text-white border-rose-600";
          } else {
            borderClass = "border-slate-200 bg-slate-50/50 text-slate-400 opacity-60";
            letterBadge = "bg-slate-100 text-slate-400 border-slate-200";
          }
        }

        btn.className += borderClass;
        btn.onclick = () => selectOption(idx);
        btn.disabled = isAnswered;

        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md border text-[11px] font-bold shrink-0 mt-0.5 ${letterBadge}">
            ${letters[idx]}
          </span>
          <span class="leading-relaxed flex-1">${optText}</span>
        `;
        container.appendChild(btn);
      });

      const expBox = document.getElementById("explanation-box");
      if (isAnswered) {
        expBox.classList.remove("hidden");
        document.getElementById("exp-text").textContent = q.explanation;
        document.getElementById("decision-text").textContent = q.decision;

        const trapsList = document.getElementById("traps-list");
        trapsList.innerHTML = "";
        q.traps.forEach(t => {
          const item = document.createElement("div");
          item.className = "p-2 rounded bg-slate-50 border border-slate-100 flex items-start gap-1.5 text-slate-600";
          item.innerHTML = `<span class="font-bold text-rose-600 shrink-0">[Lựa chọn ${t.key}]:</span> <span>${t.trap}</span>`;
          trapsList.appendChild(item);
        });

        document.getElementById("personal-note").value = state.notes[q.id] || "";
      } else {
        expBox.classList.add("hidden");
      }

      document.getElementById("prev-btn").disabled = (currentFilteredPos <= 0);
      document.getElementById("next-btn").disabled = (currentFilteredPos >= filtered.length - 1);
    }

    function selectOption(idx) {
      const q = QUESTIONS[state.currentIndex];
      if (state.answers[q.id] !== undefined) return;

      state.answers[q.id] = idx;
      saveState();
      renderCurrentQuestion();
      updateProgress();
      renderGridCells();
    }

    function navigate(step) {
      const filtered = getFilteredList();
      const currentPos = filtered.findIndex(item => item.idx === state.currentIndex);
      const newPos = currentPos + step;
      
      if (newPos >= 0 && newPos < filtered.length) {
        state.currentIndex = filtered[newPos].idx;
        saveState();
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      state.currentIndex = idx;
      saveState();
      renderCurrentQuestion();
      toggleGridModal(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleBookmark() {
      const q = QUESTIONS[state.currentIndex];
      const pos = state.bookmarks.indexOf(q.id);
      if (pos > -1) state.bookmarks.splice(pos, 1);
      else state.bookmarks.push(q.id);
      saveState();
      renderCurrentQuestion();
      renderGridCells();
    }

    function saveCurrentNote() {
      const q = QUESTIONS[state.currentIndex];
      state.notes[q.id] = document.getElementById("personal-note").value;
      saveState();
    }

    function updateProgress() {
      let correct = 0, wrong = 0;
      Object.entries(state.answers).forEach(([qId, ans]) => {
        const q = QUESTIONS.find(item => item.id === parseInt(qId));
        if (q) {
          if (ans === q.correct) correct++;
          else wrong++;
        }
      });
      const total = QUESTIONS.length;
      document.getElementById("progress-correct").style.width = `${(correct / total) * 100}%`;
      document.getElementById("progress-wrong").style.width = `${(wrong / total) * 100}%`;
    }

    function renderGridCells() {
      const grid = document.getElementById("grid-cells");
      grid.innerHTML = "";
      const filtered = getFilteredList();

      QUESTIONS.forEach((q, idx) => {
        const isIncluded = filtered.some(item => item.idx === idx);
        if (!isIncluded) return;

        const cell = document.createElement("button");
        cell.className = `h-8 rounded text-[11px] font-bold flex flex-col items-center justify-center relative transition-all border `;
        
        const ans = state.answers[q.id];
        const isCurrent = (idx === state.currentIndex);

        if (ans !== undefined) {
          cell.className += (ans === q.correct) ? "bg-emerald-500 text-white border-emerald-600" : "bg-rose-500 text-white border-rose-600";
        } else {
          cell.className += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
        }

        if (isCurrent) cell.className += " ring-2 ring-teal-600 ring-offset-1";
        cell.textContent = q.id;

        if (state.bookmarks.includes(q.id)) {
          const starBadge = document.createElement("span");
          starBadge.className = "absolute -top-1 -right-1 text-[8px] text-amber-400 font-extrabold";
          starBadge.textContent = "★";
          cell.appendChild(starBadge);
        }

        cell.onclick = () => jumpToQuestion(idx);
        grid.appendChild(cell);
      });
    }

    function toggleGridModal(show) {
      const modal = document.getElementById("grid-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderGridCells();
      } else {
        modal.classList.add("hidden");
      }
    }

    let touchStartX = 0, touchEndX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    document.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, false);

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) navigate(1);
        else navigate(-1);
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
